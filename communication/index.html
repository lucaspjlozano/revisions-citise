<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communication · QCM</title>
<meta name="description" content="Entraînement au QCM Entreprise & Communication (CITISE) : 5 séances, banque de questions, QCM blanc, erreurs, fiche express.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<script>try{var t=localStorage.getItem('comm-theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t))}catch(e){}</script>
<style>
:root{
  --bg:#f5f5f7; --bg-2:#ececef; --surface:#ffffff; --surface-2:#fafafb;
  --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.16);
  --accent:#7b1e2e; --accent-2:#a8334a; --accent-soft:rgba(123,30,46,.08); --accent-ink:#ffffff;
  --good:#2f6b4f; --good-soft:rgba(47,107,79,.09);
  --font-d:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-b:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-l:10px; --r-m:8px; --r-s:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --bg-2:#141416; --surface:#161618; --surface-2:#1c1c1f;
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#8e8e93; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.2);
  --accent:#c9485f; --accent-2:#e07a8c; --accent-soft:rgba(201,72,95,.14); --accent-ink:#ffffff;
  --good:#7fb79a; --good-soft:rgba(127,183,154,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --bg-2:#141416; --surface:#161618; --surface-2:#1c1c1f;
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#8e8e93; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.2);
  --accent:#c9485f; --accent-2:#e07a8c; --accent-soft:rgba(201,72,95,.14); --accent-ink:#ffffff;
  --good:#7fb79a; --good-soft:rgba(127,183,154,.12); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.015em;line-height:1.14;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
main.wrap{padding-bottom:96px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* bandeau */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:44px}
.top .wrap{display:flex;align-items:center;gap:22px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-family:var(--font-d);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{color:var(--accent);font-style:italic;font-weight:400;font-size:1.5rem;line-height:1}
.nav{display:flex;gap:18px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:16px 0 14px;font-weight:500;font-size:.86rem;color:var(--ink-3);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.icon-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-s);background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink)}
@media (max-width:720px){
  .top{margin-bottom:28px}
  .top .wrap{flex-wrap:wrap;gap:0 12px;padding-top:8px}
  .brand{order:1}.icon-btn{order:2;margin-left:auto}
  .nav{order:3;width:100%;margin:0;gap:13px}
  .nav a{padding:10px 0 9px;font-size:.8rem}
  .nav .lg{display:none}
}

/* étiquettes, boutons */
.eyebrow,.tag{font-family:var(--font-m);font-weight:500;text-transform:uppercase;letter-spacing:.09em;font-size:.68rem;color:var(--ink-3)}
.eyebrow{letter-spacing:.14em}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--ink-2)}
.tag.acc{color:var(--accent);border-color:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-s);font-weight:600;font-size:.9rem;padding:10px 18px;min-height:40px;text-decoration:none;transition:background .15s ease,border-color .15s ease,color .15s ease;background:transparent}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent-2)}
.btn.soft{border-color:var(--ink);color:var(--ink)}
.btn.soft:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line-2);color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.btn.small{padding:7px 13px;font-size:.84rem;min-height:34px}
@media (max-width:640px){.btn{min-height:44px}.btn.small{min-height:38px}}
.link{color:var(--ink-2);font-size:.9rem;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;background:none;border:0;padding:0}
.link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.muted{color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent)}

/* titres de page */
.page-h{display:grid;gap:10px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.page-h h1{font-size:clamp(2rem,4.6vw,3rem)}
.page-h p{color:var(--ink-2);max-width:62ch}
.rule-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.rule-h h2{font-size:1.3rem}
.rule-h .picks .pick{min-height:32px;padding:5px 11px;font-size:.82rem}

/* accueil */
.une{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:end;padding-bottom:40px;margin-bottom:48px;border-bottom:1px solid var(--line)}
.une h1{font-size:clamp(3rem,10vw,6.2rem);letter-spacing:-.035em;line-height:.95;margin:18px 0 12px}
.une-sub{font-family:var(--font-d);font-style:italic;font-size:clamp(1.15rem,2.4vw,1.5rem);color:var(--ink-2);max-width:34ch;line-height:1.3}
.une-count{margin-top:14px;font-family:var(--font-m);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.une-cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:26px}
.une-side{border-top:1px solid var(--ink);padding-top:12px}
.une-big{font-family:var(--font-d);font-weight:600;font-size:4.2rem;line-height:1;letter-spacing:-.03em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.une-big span{font-size:1.4rem;font-weight:400;color:var(--ink-3);letter-spacing:0}
.une-lv{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 0;border-top:1px solid var(--line)}
.une-lv div{padding:10px 0 0}
.une-lv dt{font-family:var(--font-m);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.une-lv dd{margin:2px 0 0;font-family:var(--font-d);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.une-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.toc-row{display:grid;grid-template-columns:44px minmax(0,1fr) 130px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.toc-n{font-family:var(--font-d);font-style:italic;font-size:1.7rem;line-height:1;color:var(--ink-3);transition:color .15s}
.toc-t{display:grid;gap:2px;min-width:0}
.toc-t b{font-family:var(--font-d);font-weight:600;font-size:1.08rem;line-height:1.25;transition:color .15s}
.toc-t small,.toc-p{font-family:var(--font-m);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.toc-m{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center}
.toc-m .progress{height:2px}
.toc-p{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.toc-row:hover .toc-n,.toc-row:hover .toc-t b{color:var(--accent)}
.idx a,.idx button{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border:0;border-bottom:1px solid var(--line);text-decoration:none;width:100%;background:none;text-align:left}
.idx b{font-weight:500;font-size:.95rem;transition:color .15s}
.idx span{font-family:var(--font-m);font-size:.72rem;color:var(--ink-3);text-align:right}
.idx a:hover b,.idx button:hover b{color:var(--accent)}
.foot{margin-top:56px;border-top:1px solid var(--line);padding-top:16px;font-family:var(--font-m);font-size:.7rem;letter-spacing:.03em;color:var(--ink-3)}
@media (max-width:900px){.une,.une-cols{grid-template-columns:minmax(0,1fr);gap:36px}.une{align-items:start}}
@media (max-width:560px){.toc-row{grid-template-columns:32px minmax(0,1fr) 48px;gap:10px}.toc-n{font-size:1.35rem}.toc-m{grid-template-columns:1fr}.toc-m .progress{display:none}}

/* réglages d'une série */
.setup{display:grid;gap:26px;max-width:720px}
.field{display:grid;gap:10px}
.field>.eyebrow{display:block}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);font-size:.9rem;font-weight:500;color:var(--ink-2);min-height:40px}
.pick small{font-family:var(--font-m);font-size:.66rem;color:var(--ink-3)}
.pick:hover{border-color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.pick[aria-pressed="true"] small{color:var(--accent)}
.note{font-size:.88rem;color:var(--ink-3);max-width:62ch}

/* question */
.quiz{max-width:760px}
.q-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-bottom:12px}
.q-meta .row{gap:8px}
.q-count{font-family:var(--font-m);font-size:.72rem;letter-spacing:.06em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.quiz .progress{margin-bottom:26px}
.q-text{font-size:clamp(1.3rem,3vw,1.65rem);line-height:1.28;margin-bottom:10px}
.q-kind{font-family:var(--font-m);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
.q-kind.multi{color:var(--accent)}
.opts{display:grid;gap:10px;margin-bottom:22px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:13px 14px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);font-size:.98rem;line-height:1.45;transition:border-color .15s ease}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line-2);font-family:var(--font-m);font-size:.74rem;color:var(--ink-3);margin-top:-1px}
.opt.multi .k{border-radius:4px}
.opt.one .k{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-checked="true"] .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt .mark{font-family:var(--font-m);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;align-self:center;white-space:nowrap}
.opt.is-good{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);background:var(--good-soft)}
.opt.is-good .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.is-good .mark{color:var(--good)}
.opt.is-missed{border-color:var(--good);border-style:dashed;box-shadow:none}
.opt.is-missed .mark{color:var(--good)}
.opt.is-bad{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt.is-bad .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.is-bad .mark{color:var(--accent)}
.opt.is-dim{opacity:.62}
.verdict{border-left:2px solid var(--line-2);background:var(--surface-2);padding:14px 16px;margin-bottom:22px;display:grid;gap:6px}
.verdict b{font-family:var(--font-d);font-size:1.15rem;font-weight:600}
.verdict.ok{border-left-color:var(--good)} .verdict.ok b{color:var(--good)}
.verdict.ko{border-left-color:var(--accent)} .verdict.ko b{color:var(--accent)}
.verdict p{color:var(--ink-2);font-size:.95rem}
.exp{display:grid;gap:3px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.exp .eyebrow{font-size:.62rem}
.exp p:last-child{color:var(--ink);font-size:.98rem;line-height:1.55}
.alt-btn{justify-self:start;margin-top:6px}
.rv details{font-size:.9rem;color:var(--ink-2)}
.rv summary{cursor:pointer;color:var(--ink-2);font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;width:max-content}
.rv summary:hover{color:var(--accent)}
.rv details p{margin-top:6px;border-left:2px solid var(--line-2);padding-left:10px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kbd{font-family:var(--font-m);font-size:.68rem;color:var(--ink-3)}
@media (max-width:640px){.kbd{display:none}}

/* bilan */
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 36px;align-items:end;padding-bottom:28px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.big-score{font-family:var(--font-d);font-weight:600;font-size:clamp(3.6rem,12vw,6rem);line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big-score span{font-size:.32em;font-weight:400;color:var(--ink-3);letter-spacing:0}
.result dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0;margin:0;border-top:1px solid var(--line)}
.result dl div{padding:10px 0 0}
.result dt{font-family:var(--font-m);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.result dd{margin:2px 0 0;font-family:var(--font-d);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:560px){.result{grid-template-columns:1fr}}
.review{display:grid;gap:0;margin-top:18px}
.rv{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.rv-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv-q{font-family:var(--font-d);font-size:1.08rem;font-weight:600;line-height:1.3}
.rv ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rv li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:.92rem;color:var(--ink-2)}
.rv li i{font-style:normal;font-family:var(--font-m);font-size:.72rem;padding-top:2px}
.rv li.g{color:var(--good)} .rv li.b{color:var(--accent)}
.rv .why{font-size:.92rem;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:10px}
.rv .why b{font-family:var(--font-m);font-size:.62rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.st-ok{color:var(--good);border-color:var(--good)}
.st-ko{color:var(--accent);border-color:var(--accent)}

/* QCM blanc */
.exam-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin-bottom:18px}
.chrono{font-family:var(--font-m);font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.grid-n{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;margin-bottom:24px}
.grid-n button{height:30px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-family:var(--font-m);font-size:.68rem;color:var(--ink-3);padding:0}
.grid-n button.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid-n button.skip{border-style:dashed;color:var(--ink-2)}
.grid-n button.cur{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:560px){.grid-n{grid-template-columns:repeat(10,minmax(0,1fr))}.grid-n button{height:32px}}
.switch{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);text-align:left;width:100%}
.switch .box{flex:none;width:20px;height:20px;border:1px solid var(--line-2);border-radius:4px;display:grid;place-items:center;margin-top:2px;font-size:.8rem}
.switch[aria-checked="true"]{border-color:var(--accent)}
.switch[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch b{display:block;font-weight:600}
.switch span.d{font-size:.88rem;color:var(--ink-3)}
.warn{color:var(--accent);font-size:.9rem}

/* fiche express */
.fiche-nav{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:28px}
.fiche-nav a{font-family:var(--font-m);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-decoration:none;border-bottom:2px solid transparent;padding:4px 0}
.fiche-nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}
.fcards{display:grid;gap:28px}
.fcard{padding:26px 28px;scroll-margin-top:120px}
.fcard-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:baseline;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--ink)}
.fcard-h .n{grid-row:1/3;font-family:var(--font-d);font-style:italic;font-size:2.6rem;line-height:1;color:var(--accent)}
.fcard-h h2{font-size:1.45rem}
.fcard dl{margin:0;display:grid}
.fcard dl>div{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 20px;padding:11px 0;border-bottom:1px solid var(--line)}
.fcard dl>div:last-child{border-bottom:0}
.fcard dt{font-family:var(--font-m);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.fcard dd{margin:0;font-size:.95rem;line-height:1.55}
.fcard dd b{font-weight:600}
.fcard dd .seq{color:var(--accent);font-weight:600}
@media (max-width:640px){.fcard{padding:20px 16px}.fcard dl>div{grid-template-columns:1fr}}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);margin-top:8px}
.figs div{padding:14px 12px 14px 0;border-bottom:1px solid var(--line)}
.figs b{display:block;font-family:var(--font-d);font-size:1.7rem;font-weight:600;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.figs span{font-size:.86rem;color:var(--ink-2)}
@media (max-width:640px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{padding:36px 24px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--ink-2)}
.empty h2{font-size:1.4rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>
/*BANK*/
const Q = [];
function _h(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
let _OLD = false;
function _add(s,p,n,type,q,o,ok,why,alt){Q.push({id:'q'+_h(q+'|'+o.join('|')),seance:s,notion:n,type,q,o,ok,why:_OLD?why+'.':why,alt,page:p,_old:_OLD})}
function one(s,p,n,q,o,ok,why,alt){_add(s,p,n,'one',q,o,[ok],why,alt)}
function mul(s,p,n,q,o,ok,why,alt){_add(s,p,n,'multi',q,o,ok,why,alt)}
/* ================= SÉANCE 1 · FONDAMENTAUX (diapos 3-12) ================= */
one(1,3,`Définition`,`Comment le cours définit-il la communication en entreprise ?`,
 [`L'ensemble des échanges d'informations entre acteurs internes et externes, pour faciliter le fonctionnement, la coopération et l'atteinte des objectifs`,
  `L'ensemble des messages que la direction adresse aux salariés pour les informer des décisions`,
  `L'ensemble des actions publicitaires et des relations presse menées par l'entreprise`,
  `Les échanges spontanés entre collègues, en dehors des circuits officiels`],0,
 `Le cours prend une définition large : tous les échanges d'informations, avec les acteurs internes comme externes, au service du fonctionnement, de la coopération et des objectifs. Les trois autres réponses n'en décrivent qu'un morceau : la communication descendante, la communication externe ou l'informel.`,
 `Vois la communication comme la circulation sanguine de l'entreprise : elle irrigue toutes les parties, dedans comme dehors, pour que l'ensemble fonctionne et avance dans la même direction. Une seule artère ne suffit pas à faire une circulation.`);
one(1,3,`Cycle`,`Dans le schéma de la communication, à quel moment le cycle est-il complet ?`,
 [`Quand l'émetteur reçoit un feed-back qui confirme que le message a bien été compris`,
  `Quand le récepteur a reçu le message`,
  `Quand le message est parti par le canal adapté`,
  `Quand le récepteur a répondu, quelle que soit sa réponse`],0,
 `Recevoir un message ne prouve pas qu'on l'a compris. Le cours précise que le cycle n'est complet que lorsque le feed-back revient à l'émetteur et confirme la bonne compréhension. Une simple réponse ne suffit pas si elle montre un malentendu.`,
 `C'est comme un colis : savoir qu'il est parti ne suffit pas, il faut l'accusé de réception, et vérifier que c'est bien le bon colis qui est arrivé. Le feed-back, c'est cet accusé de réception.`);
mul(1,3,`Cycle`,`Quels éléments figurent dans le schéma de la communication présenté en séance 1 ?`,
 [`L'émetteur`,`Le canal`,`Le feed-back`,`Le médiateur`,`Le filtre émotionnel`],[0,1,2],
 `Le schéma relie un émetteur, un message transmis par un canal, un récepteur et un feed-back. Le médiateur appartient à la gestion des conflits (il devient indispensable au niveau 4) et le filtre émotionnel est un obstacle vu dans les cas concrets.`,
 `Retiens la boucle : quelqu'un parle (émetteur), par un tuyau (canal), à quelqu'un (récepteur), qui renvoie un signe (feed-back). Ce qui n'est pas dans cette boucle n'est pas dans le schéma.`);
mul(1,3,`5 enjeux`,`Lesquels font partie des 5 enjeux de la communication en entreprise ?`,
 [`La circulation de l'information`,`La coordination`,`Fédérer`,`L'image`,`La rentabilité`],[0,1,2,3],
 `Les 5 enjeux sont la circulation, la coordination, fédérer, les relations sociales et l'image. La rentabilité est un objectif de l'entreprise, mais le cours ne la range pas parmi les enjeux de la communication.`,
 `Moyen mnémotechnique : « Ce Cher Fédérer Relance son Image », pour Circulation, Coordination, Fédérer, Relations sociales, Image.`);
one(1,3,`5 enjeux`,`Un service diffuse chaque semaine ses résultats et ses consignes à toutes les équipes pour couper court aux rumeurs. Quel enjeu de la communication sert-il ?`,
 [`La circulation de l'information`,`La coordination`,`Fédérer`,`L'image`],0,
 `Faire passer consignes et résultats, et éviter silos et rumeurs : c'est l'enjeu A, la circulation de l'information. La coordination irait plus loin : aligner les services sur des objectifs communs.`,
 `Circulation : l'information arrive à tout le monde. Coordination : tout le monde va dans le même sens. On peut très bien avoir la première sans la seconde.`);
one(1,3,`5 enjeux`,`Deux services qui se renvoyaient la balle se fixent un objectif commun de délai de livraison. Quel enjeu de la communication est servi ?`,
 [`La coordination`,`La circulation de l'information`,`Les relations sociales`,`Fédérer`],0,
 `Aligner les services sur des objectifs communs, c'est la coordination (enjeu B). La circulation se contente de faire passer l'information, sans garantir que chacun vise le même but.`,
 `Pense à un orchestre : chaque pupitre joue sa partie, mais tous suivent la même partition. Coordonner, c'est donner cette partition commune.`);
one(1,3,`5 enjeux`,`Un séminaire renforce le sentiment d'appartenance, la culture commune et la motivation des salariés. Quel enjeu de la communication est servi ?`,
 [`Fédérer`,`L'image`,`Les relations sociales`,`La coordination`],0,
 `Appartenance, culture, motivation : c'est l'enjeu C, fédérer. L'image concerne la réputation (employer branding, notoriété) et les relations sociales concernent le climat et le dialogue avec le personnel.`,
 `Fédérer, c'est faire passer les salariés de « je travaille ici » à « je fais partie de cette équipe ».`);
one(1,3,`5 enjeux`,`Une entreprise soigne sa réputation d'employeur auprès de ses salariés et sa notoriété auprès du public. Quel enjeu de la communication est servi ?`,
 [`L'image`,`Fédérer`,`La circulation de l'information`,`Les relations sociales`],0,
 `Employer branding en interne et notoriété en externe : c'est l'enjeu E, l'image. Fédérer porte sur l'appartenance, pas sur la réputation.`,
 `L'image, c'est ce qu'on dit de l'entreprise quand elle n'est pas dans la pièce, que ce soit à la machine à café ou dans la presse.`);
one(1,3,`5 enjeux`,`La direction organise un dialogue régulier avec le personnel pour garder un climat serein et désamorcer les conflits. Quel enjeu de la communication est servi ?`,
 [`Les relations sociales`,`Fédérer`,`La coordination`,`L'image`],0,
 `Climat serein, dialogue avec le personnel, gestion des conflits : c'est l'enjeu D, les relations sociales. Fédérer vise d'abord l'appartenance et la motivation.`,
 `Les relations sociales, c'est la météo humaine de l'entreprise : le dialogue sert à éviter que les nuages ne tournent à l'orage.`);
mul(1,4,`Risques`,`Quelles conséquences d'une mauvaise communication le cours cite-t-il ?`,
 [`Des rumeurs et du désengagement`,`Une perte de productivité`,`Du turnover et un climat de défiance`,`Une mauvaise image interne et externe`,`Une cohésion d'équipe renforcée`],[0,1,2,3],
 `Le cours liste rumeurs, désengagement, conflits, perte de productivité, mauvaise image interne et externe, turnover et défiance. Une cohésion renforcée est au contraire un effet positif possible d'un conflit bien géré (diapo 28).`,
 `Quand l'information ne circule pas, les gens comblent le vide : d'abord des rumeurs, puis de la méfiance, puis des départs. C'est une réaction en chaîne.`);
mul(1,4,`4 compétences`,`Lesquelles font partie des 4 compétences de communication présentées en séance 1 ?`,
 [`Les compétences verbales`,`Les compétences écrites`,`L'écoute active`,`Les compétences non verbales`,`L'assertivité`],[0,1,2,3],
 `Les 4 compétences sont verbales, écrites, écoute active et non verbales. L'assertivité est l'axe vertical du modèle de Thomas-Kilmann (séance 3), pas une des 4 compétences.`,
 `Deux compétences pour émettre avec des mots (parler, écrire), une pour recevoir (écouter), une pour tout ce qui passe sans mots (le corps).`);
one(1,4,`4 compétences`,`Comprendre les besoins et les attentes de son interlocuteur relève de quelle compétence ?`,
 [`L'écoute active`,`La compétence verbale`,`La compétence non verbale`,`La compétence écrite`],0,
 `Le cours définit l'écoute active comme la capacité à comprendre besoins et attentes. La compétence verbale, elle, consiste à parler clairement, persuader et adapter son discours.`,
 `Verbal : ce que je dis. Écoute active : ce que je comprends de l'autre. L'une émet, l'autre reçoit.`);
one(1,4,`Leadership`,`Selon le cours, comment communique un leader efficace ?`,
 [`Il inspire et motive, reste transparent et authentique, et donne comme reçoit des retours constructifs`,
  `Il transmet des consignes précises et limite les retours pour gagner du temps`,
  `Il garde une partie de l'information pour préserver son autorité`,
  `Il confie toute la communication au service des ressources humaines`],0,
 `Communication et leadership, selon le cours : inspirer et motiver, transparence et authenticité pour gagner la confiance, et feed-back dans les deux sens. Limiter les retours ou retenir l'information va à l'inverse.`,
 `On suit plus volontiers quelqu'un qui explique et qui écoute que quelqu'un qui se contente d'ordonner : le leadership repose sur la confiance, et la confiance sur la transparence.`);
one(1,5,`Types`,`Un manager fait un entretien de feed-back en tête-à-tête avec un collaborateur. De quel type de communication s'agit-il ?`,
 [`Interpersonnelle`,`Intragroupe`,`Intergroupe`,`Organisationnelle`],0,
 `Un échange direct entre deux personnes est une communication interpersonnelle ; le cours cite justement l'entretien et le feed-back comme exemples.`,
 `Interpersonnelle : entre deux personnes. Dès qu'on parle à toute l'équipe, on passe à l'intragroupe.`);
one(1,5,`Types`,`Le service qualité et le service production se réunissent pour régler un problème commun. De quel type de communication s'agit-il ?`,
 [`Intergroupe`,`Intragroupe`,`Interpersonnelle`,`Institutionnelle`],0,
 `Entre services ou départements, c'est la communication intergroupe. L'intragroupe désigne les échanges à l'intérieur d'une même équipe ou d'un même service.`,
 `Comme au lycée : « intra » se passe à l'intérieur de la classe, « inter » entre les classes.`);
one(1,5,`Types`,`Les membres d'une même équipe font leur point du lundi matin. De quel type de communication s'agit-il ?`,
 [`Intragroupe`,`Intergroupe`,`Organisationnelle`,`Interpersonnelle`],0,
 `Entre membres d'une même équipe ou d'un même service : communication intragroupe. Elle devient intergroupe quand plusieurs services se parlent.`,
 `« Intra » veut dire « dedans » : on reste à l'intérieur du même groupe.`);
one(1,5,`Types`,`La direction envoie une note d'information à l'ensemble des salariés. De quel type de communication s'agit-il ?`,
 [`Organisationnelle`,`Institutionnelle`,`Intergroupe`,`Interpersonnelle`],0,
 `Les messages diffusés à tous (notes, réunions, mails) relèvent de la communication organisationnelle. L'institutionnelle, elle, s'adresse à l'extérieur : clients, médias, partenaires.`,
 `Organisationnelle : l'organisation parle à tous ses membres. Institutionnelle : l'institution parle au monde extérieur.`);
one(1,5,`Types`,`L'entreprise publie un communiqué destiné aux médias, aux clients et aux partenaires. De quel type de communication s'agit-il ?`,
 [`Institutionnelle`,`Organisationnelle`,`Intergroupe`,`Informelle`],0,
 `Les messages vers l'extérieur (clients, médias, partenaires) relèvent de la communication institutionnelle. L'organisationnelle reste à l'intérieur : elle s'adresse à tous les salariés.`,
 `Institutionnelle : c'est l'entreprise en tant qu'institution qui prend la parole face au monde, comme un porte-parole.`);
one(1,5,`Types`,`Deux collègues règlent une question pendant la pause café. De quel type de communication s'agit-il ?`,
 [`Informelle`,`Formelle`,`Organisationnelle`,`Intergroupe`],0,
 `Spontanée et hors circuit officiel, c'est la communication informelle (pause café, messagerie instantanée, couloir). La formelle est structurée, validée, officielle et documentée.`,
 `Formel : avec compte rendu et validation. Informel : sans trace, au détour d'un couloir.`);
mul(1,5,`Types`,`Quels publics sont la cible de la communication externe ?`,
 [`Les fournisseurs`,`Les clients`,`L'État et les institutions`,`Les partenaires`,`Les salariés et les associés`],[0,1,2,3],
 `La communication externe vise l'environnement de l'organisation : fournisseurs, clients, État, institutions, partenaires. Les membres de l'entreprise et les associés sont la cible de la communication interne.`,
 `Externe : tous ceux avec qui l'entreprise a affaire, mais qui ne font pas partie de l'entreprise.`);
one(1,6,`Directions`,`Dans quel sens circule la communication descendante ?`,
 [`De la hiérarchie vers les collaborateurs`,`Des collaborateurs vers la hiérarchie`,`Entre personnes de même niveau hiérarchique`,`De l'entreprise vers ses clients`],0,
 `La communication descendante va de la hiérarchie vers les collaborateurs : consignes, notes de service, stratégie. Le sens inverse est la communication ascendante.`,
 `Elle « descend » l'organigramme, du haut vers le bas, comme l'eau d'une cascade.`);
mul(1,6,`Directions`,`Lesquels sont des exemples de communication descendante ?`,
 [`Une note de service`,`Des consignes de travail`,`La présentation de la stratégie`,`Un reporting mensuel`,`Les suggestions des salariés`],[0,1,2],
 `Consignes, note de service et stratégie partent de la hiérarchie vers les équipes : c'est descendant. Le reporting et les suggestions remontent vers la hiérarchie : c'est ascendant.`,
 `Demande-toi qui parle à qui : si c'est le chef qui s'adresse aux équipes, c'est descendant ; si ce sont les équipes qui informent le chef, c'est ascendant.`);
one(1,6,`Directions`,`Un technicien signale une anomalie à son responsable et propose une amélioration. Quelle direction de communication est en jeu ?`,
 [`Ascendante`,`Descendante`,`Horizontale`,`Institutionnelle`],0,
 `Alertes, suggestions, reporting : des collaborateurs vers la hiérarchie, c'est la communication ascendante. Ses atouts sont l'engagement, la remontée du terrain et l'innovation.`,
 `Elle « remonte » du terrain vers les décideurs : ceux qui voient les problèmes de près les font connaître à ceux qui décident.`);
one(1,6,`Directions`,`Quelle limite le cours attribue-t-il à la communication descendante ?`,
 [`Elle peut être perçue comme autoritaire et laisse peu de place au feed-back`,
  `Elle reste lettre morte si la hiérarchie écoute peu`,
  `Elle crée des malentendus quand les rôles sont flous`,
  `Elle enferme chaque service dans un silo`],0,
 `La descendante clarifie, aligne et structure, mais elle peut paraître autoritaire et offre peu de feed-back. « Lettre morte si l'écoute est faible » est la limite de l'ascendante ; « malentendus si rôles flous », celle de l'horizontale.`,
 `Un message qui ne fait que descendre ressemble à un ordre : on l'exécute, mais on n'a pas l'occasion de dire si on l'a compris ou si on est d'accord.`);
one(1,6,`Directions`,`Quelle limite le cours attribue-t-il à la communication ascendante ?`,
 [`Elle est ignorée si l'écoute de la hiérarchie est faible`,
  `Elle est perçue comme autoritaire`,
  `Elle crée des malentendus quand les rôles sont flous`,
  `Elle ne permet pas de remonter les alertes du terrain`],0,
 `La communication ascendante favorise l'engagement, le terrain et l'innovation, mais elle ne sert à rien si la hiérarchie n'écoute pas. Remonter les alertes est justement l'un de ses usages.`,
 `Une boîte à idées que personne n'ouvre : les salariés finissent par ne plus rien y mettre.`);
one(1,6,`Directions`,`Quelle direction de communication favorise la coopération et évite les silos, au risque de malentendus si les rôles sont flous ?`,
 [`Horizontale`,`Ascendante`,`Descendante`,`Organisationnelle`],0,
 `La communication horizontale relie des personnes de même niveau, souvent entre services : elle favorise la coopération et évite les silos. Sa limite : des malentendus quand on ne sait plus qui fait quoi.`,
 `Horizontale : on se parle « à plat », d'égal à égal. Sans chef pour trancher, il faut que les rôles soient clairs.`);
mul(1,6,`4 constituants`,`Quels sont les 4 constituants de toute action de communication ?`,
 [`L'objectif`,`La cible`,`Le canal`,`Le support`,`Le budget`],[0,1,2,3],
 `Toute action de communication repose sur un objectif, une cible, un canal et un support. Le budget compte en pratique, mais ce n'est pas l'un des 4 constituants du cours.`,
 `Quatre questions : pour quoi ? (objectif) à qui ? (cible) par où ? (canal) avec quoi ? (support).`);
one(1,6,`4 constituants`,`Salons professionnels, parrainage et publipostage sont des exemples de canal…`,
 [`Hors médias`,`Médias`,`Informel`,`Digital`],0,
 `Le cours distingue les canaux médias et hors médias, et cite précisément salons, parrainage et publipostage comme exemples hors médias.`,
 `Hors médias : on touche le public directement, sans passer par la télévision, la radio ou la presse.`);
one(1,6,`4 constituants`,`Lequel de ces objectifs ne figure pas parmi les objectifs d'une action de communication cités par le cours ?`,
 [`Réduire les coûts`,`Informer`,`Développer la notoriété`,`Faire évoluer les attitudes`],0,
 `Le cours cite quatre objectifs possibles : information, image, notoriété ou changement d'attitudes. La réduction des coûts n'en fait pas partie.`,
 `Les objectifs du cours portent tous sur ce que le public sait ou pense : savoir (information), connaître (notoriété), apprécier (image), changer (attitudes).`);
one(1,7,`Canaux`,`Quel canal est rapide et interactif, mais éphémère et exposé aux malentendus ?`,
 [`L'oral`,`L'écrit`,`Le visuel`,`Le digital`],0,
 `L'oral permet d'échanger vite et de réagir tout de suite, mais il ne laisse pas de trace et se prête aux malentendus. L'écrit a les qualités inverses : traçable et précis, mais plus lent.`,
 `« Les paroles s'envolent, les écrits restent » : l'oral gagne en vitesse ce qu'il perd en trace.`);
one(1,7,`Canaux`,`Quel canal est traçable et précis, mais plus lent et moins interactif ?`,
 [`L'écrit`,`L'oral`,`Le digital`,`Le visuel`],0,
 `L'écrit garde une trace et oblige à être précis ; en contrepartie, il est plus lent et moins interactif que l'oral.`,
 `Un contrat se signe par écrit pour la trace ; une question rapide se pose à l'oral pour la réponse immédiate.`);
one(1,7,`Canaux`,`Quel canal est immédiat et souple, mais expose à la surcharge et à la dispersion ?`,
 [`Le digital`,`L'oral`,`L'écrit`,`Le visuel`],0,
 `Le canal digital est immédiat et souple ; sa limite, selon le cours, est la surcharge et la dispersion (trop de messages, trop d'outils).`,
 `Pense à une journée avec cinquante notifications : tout arrive vite, mais plus rien ne retient vraiment l'attention.`);
one(1,7,`Canaux`,`Quel canal synthétise l'information et la rend accessible ?`,
 [`Le visuel`,`L'oral`,`L'écrit`,`Le digital`],0,
 `Le cours présente le canal visuel (schémas, graphiques) comme celui qui synthétise et rend l'information accessible.`,
 `Un bon schéma évite trois paragraphes : c'est la force du visuel.`);
one(1,7,`Canal selon l'objectif`,`La direction doit annoncer une réorganisation. Quel canal le cours recommande-t-il ?`,
 [`Une réunion, complétée par un mail synthétique`,`Une note de service seule`,`Un message oral bref`,`Un sondage auprès des salariés`],0,
 `Pour annoncer un changement, le cours recommande une réunion et un mail synthétique : la réunion permet d'expliquer et de répondre aux questions, le mail laisse une trace de ce qui a été dit.`,
 `Un changement inquiète : il faut à la fois un moment humain pour rassurer (la réunion) et un écrit pour s'y référer ensuite (le mail).`);
one(1,7,`Canal selon l'objectif`,`Deux collègues sont en conflit. Quel canal le cours recommande-t-il pour traiter la situation ?`,
 [`Un entretien en présentiel`,`Un échange de mails argumentés`,`Une note de service`,`La messagerie instantanée`],0,
 `Le cours recommande l'entretien en présentiel pour gérer un conflit. Traiter un désaccord par écrit crée de la mésentente, l'un des risques d'un mauvais usage des canaux.`,
 `À l'écrit, sans ton ni visage, chaque phrase peut être lue de travers ; face à face, on voit l'autre réagir et on peut corriger aussitôt.`);
one(1,7,`Canal selon l'objectif`,`Vous voulez recueillir l'avis des équipes sur un nouvel outil. Quel canal le cours recommande-t-il ?`,
 [`Un entretien individuel ou un sondage`,`Une note de service`,`Une réunion suivie d'un mail synthétique`,`Un e-mail officiel`],0,
 `Pour recueillir un retour, le cours recommande l'entretien individuel ou le sondage : ce sont des canaux qui font parler les gens. La note et le mail officiel servent à informer, pas à écouter.`,
 `Pour savoir ce que pensent les gens, il faut leur poser la question : entretien pour le détail, sondage pour le grand nombre.`);
one(1,7,`Canal selon l'objectif`,`Vous devez informer formellement tous les salariés d'une nouvelle règle. Quel canal le cours recommande-t-il ?`,
 [`Une note de service ou un e-mail officiel`,`Un message oral en réunion d'équipe`,`Un entretien individuel`,`Un sondage`],0,
 `Informer formellement demande une trace officielle : le cours recommande la note de service ou l'e-mail officiel.`,
 `« Formellement » signifie qu'on doit pouvoir montrer plus tard que l'information a été donnée : il faut donc de l'écrit officiel.`);
mul(1,7,`Canal selon l'objectif`,`Pour transmettre une consigne simple, quels canaux le cours juge-t-il adaptés ?`,
 [`Un message oral`,`Un mail bref`,`Une réunion suivie d'un mail synthétique`,`Une note de service`],[0,1],
 `Pour des consignes simples, le cours recommande le message oral ou le mail bref. La réunion avec mail est réservée à l'annonce d'un changement, et la note de service à l'information formelle.`,
 `On ne sort pas l'artillerie lourde pour une consigne simple : un mot ou trois lignes suffisent.`);
mul(1,7,`Canaux`,`Quels risques le cours associe-t-il à un mauvais usage des canaux ?`,
 [`La surcharge d'informations`,`La mésentente, quand un désaccord est géré par écrit`,`L'exclusion de certaines personnes`,`Un excès de formalisme`],[0,1,2],
 `Le cours cite trois risques : surcharge d'informations, mésentente (désaccord géré par écrit) et exclusion. L'excès de formalisme n'est pas mentionné.`,
 `Trop de canaux, c'est la surcharge ; le mauvais canal, c'est la mésentente ; un canal que certains n'utilisent pas, c'est l'exclusion.`);
one(1,8,`Formes`,`Les gestes, la posture, les expressions du visage et le regard relèvent de quelle forme de communication ?`,
 [`La communication non verbale`,`La communication para-verbale`,`La communication digitale`,`La communication écrite`],0,
 `Ce sont des signes du corps : c'est la communication non verbale. Le para-verbal concerne la voix (ton, volume, débit, silences, intonation, respiration).`,
 `Non verbal : ce que montre le corps. Para-verbal : la façon dont la voix porte les mots.`);
mul(1,8,`Formes`,`Lesquels relèvent du para-verbal ?`,
 [`Le débit`,`Les silences`,`L'intonation`,`Le volume`,`La posture`],[0,1,2,3],
 `Le para-verbal regroupe ce qui accompagne les mots dans la voix : ton, volume, débit, silences, intonation, respiration. La posture appartient au non-verbal.`,
 `Fais le test du téléphone : tout ce que ton interlocuteur perçoit au téléphone en plus des mots est para-verbal. La posture, elle, ne passe pas au téléphone.`);
one(1,8,`Formes`,`Selon le cours, quelle forme de communication est souvent plus importante que les mots, tout en restant très interprétable ?`,
 [`La communication non verbale`,`La communication para-verbale`,`La communication écrite`,`La communication digitale`],0,
 `Le non-verbal complète le message et exprime émotions et intentions ; il est « souvent plus important que les mots », mais très interprétable et il peut contredire le verbal.`,
 `Quelqu'un qui dit « je suis ravi » en regardant sa montre : c'est son corps qu'on croit, pas ses mots.`);
one(1,8,`Formes`,`Quelle limite le cours attribue-t-il à la communication digitale (visio, messagerie, Teams, Slack) ?`,
 [`La surcharge, le multitâche et l'appauvrissement de la relation humaine`,`Une diffusion trop lente`,`L'impossibilité de travailler à distance`,`L'absence totale de trace`],0,
 `Le digital est réactif, diffuse vite et abolit la distance ; ses limites sont la surcharge, le multitâche et une relation humaine appauvrie.`,
 `En visio, on répond à ses mails en même temps : on est là sans vraiment être là.`);
one(1,8,`Formes`,`Quelle forme de communication garde une trace et reste précise, mais se comprend mal sans ton ni contexte ?`,
 [`La communication écrite`,`La communication orale`,`La communication non verbale`,`La communication para-verbale`],0,
 `L'écrit (e-mails, rapports, notes, chats) apporte trace, précision et lisibilité, mais il est moins interactif et peut être mal interprété faute de ton et de contexte.`,
 `Un « OK. » par écrit peut vouloir dire « d'accord » comme « je suis vexé » : sans la voix, le lecteur devine.`);
mul(1,9,`Obstacles`,`Quels obstacles le cours place-t-il du côté de l'émetteur ?`,
 [`Le jargon et le manque de clarté`,`Des émotions mal gérées`,`Une posture fermée ou un ton agressif`,`L'inattention`,`Le bruit ambiant`],[0,1,2],
 `Côté émetteur : manque de clarté et jargon, émotions mal gérées, posture fermée ou ton agressif. L'inattention se situe chez le récepteur et le bruit ambiant dans le contexte.`,
 `Côté émetteur, la question à se poser est : « est-ce que je m'exprime bien ? ». Côté récepteur : « est-ce qu'il est en état de recevoir ? ».`);
one(1,9,`Obstacles`,`Un collaborateur stressé et fatigué interprète un message à travers son propre cadre de référence. À quel pôle se situe l'obstacle ?`,
 [`Le récepteur`,`L'émetteur`,`Le message`,`Le contexte`],0,
 `Inattention, interprétation selon son cadre de référence, stress et fatigue : ce sont les obstacles du récepteur. Le message peut être parfait, c'est la réception qui coince.`,
 `Même la meilleure émission de radio passe mal sur un poste mal réglé : ici, le problème est le poste, pas l'émission.`);
one(1,9,`Obstacles`,`Dans le cours, l'infobésité (la surcharge d'informations) est un obstacle rattaché à quel pôle ?`,
 [`Le canal`,`Le message`,`Le récepteur`,`Le contexte`],0,
 `Le cours range l'infobésité avec le canal inadapté et la panne technique, du côté du canal : c'est le tuyau qui est saturé.`,
 `Imagine une boîte mail qui reçoit deux cents messages par jour : le message important est noyé dans le flux.`);
one(1,9,`Obstacles`,`Un message trop long, sans structure et contenant des informations contradictoires : à quel pôle se situe l'obstacle ?`,
 [`Le message`,`Le canal`,`Le récepteur`,`Le contexte`],0,
 `Trop complexe ou trop long, contradictoire, sans structure : ce sont les obstacles liés au message lui-même.`,
 `Ici, ce n'est ni la personne ni le tuyau qui posent problème : c'est le contenu qu'on y fait passer.`);
one(1,9,`Obstacles`,`Des relations tendues, une hiérarchie floue et un climat d'urgence : à quel pôle se situe l'obstacle ?`,
 [`Le contexte`,`L'émetteur`,`Le message`,`Le canal`],0,
 `Bruit ambiant, relations tendues, hiérarchie floue, urgence : ce sont les obstacles liés au contexte, c'est-à-dire à l'environnement de l'échange.`,
 `Le contexte, c'est le décor : le meilleur dialogue du monde passe mal sur une scène bruyante et électrique.`);
mul(1,9,`Leviers`,`Quels leviers le cours propose-t-il pour lever les obstacles à la communication ?`,
 [`Clarifier et structurer`,`Adapter le canal`,`Reformuler`,`Choisir le bon moment et le bon lieu`,`Passer systématiquement par l'écrit`],[0,1,2,3],
 `Les leviers du cours : clarifier et structurer, adapter le canal, reformuler, bon moment et bon lieu, écoute active et bienveillance. « Systématiquement par l'écrit » contredit l'idée d'adapter le canal.`,
 `Chaque levier répond à un pôle : structurer pour le message, adapter pour le canal, reformuler pour le récepteur, bien choisir le moment pour le contexte.`);
mul(1,9,`Obstacles`,`Lesquels font partie des « autres obstacles » cités par le cours ?`,
 [`La tendance à juger`,`L'écoute sélective`,`Les idées préconçues`,`L'ignorance du non-verbal`,`La reformulation`],[0,1,2,3],
 `Autres obstacles cités : tendance à juger, écoute sélective, idées préconçues, cadre de référence, bruits, ignorance du non-verbal, émotions. La reformulation est un levier, pas un obstacle.`,
 `Tous ces obstacles sont des filtres dans la tête : on n'entend que ce qu'on veut, ou ce qu'on croyait déjà.`);
one(1,10,`Cas concrets`,`Un ingénieur envoie à un client non spécialiste un rapport rempli de jargon. Quel obstacle le cours y voit-il ?`,
 [`Un message trop complexe`,`Un contexte perturbant`,`Un canal défaillant`,`Un filtre émotionnel`],0,
 `Dans les cas concrets du cours, le rapport en jargon pour un non-spécialiste illustre le message trop complexe.`,
 `Le client a bien reçu le rapport, mais c'est comme s'il était écrit dans une langue étrangère.`);
one(1,10,`Cas concrets`,`Une réunion se tient dans un open space bruyant. Quel obstacle le cours y voit-il ?`,
 [`Un contexte perturbant`,`Un message trop complexe`,`Un ton mal perçu`,`Un canal défaillant`],0,
 `L'open space bruyant est l'exemple du contexte perturbant : l'environnement gêne l'échange.`,
 `Le problème n'est ni ce qu'on dit ni à qui on le dit, mais l'endroit où on le dit.`);
one(1,10,`Cas concrets`,`Un manager envoie un mail sec, sans explication. Quel obstacle le cours y voit-il ?`,
 [`Un ton mal perçu`,`Un canal défaillant`,`Un contexte perturbant`,`Un message trop complexe`],0,
 `Le mail sec sans explication est l'exemple du ton mal perçu : le lecteur lit de la froideur, voire de l'agressivité.`,
 `Sans le sourire qui l'accompagnerait à l'oral, une phrase courte devient vite une phrase sèche.`);
one(1,10,`Cas concrets`,`La visio plante au milieu d'une réunion. Quel obstacle le cours y voit-il ?`,
 [`Un canal défaillant`,`Un ton mal perçu`,`Un filtre émotionnel`,`Un message trop complexe`],0,
 `La visio qui plante est l'exemple du canal défaillant : c'est l'outil de transmission qui lâche.`,
 `Le message est bon et les participants aussi : c'est le tuyau qui est coupé.`);
one(1,10,`Cas concrets`,`Un collègue réagit vivement à une critique. Quel obstacle le cours y voit-il ?`,
 [`Un filtre émotionnel`,`Un contexte perturbant`,`Un canal défaillant`,`Un message trop complexe`],0,
 `La réaction vive à une critique est l'exemple du filtre émotionnel : l'émotion déforme la façon dont le message est reçu.`,
 `Quand on est piqué au vif, on n'entend plus le contenu de la remarque, seulement l'attaque qu'on croit y voir.`);
mul(1,10,`Cas concrets`,`Cas « L'alerte qui n'arrive pas » : une fuite d'huile est signalée sur un groupe WhatsApp privé que le chef ne lit pas, et un intérimaire glisse. Quels bruits le cours identifie-t-il ?`,
 [`Un canal inadapté`,`L'asynchronie`,`L'absence de procédure`,`Un message ambigu`,`Un excès de formalisme`],[0,1,2,3],
 `Le cours relève quatre bruits : canal inadapté (un WhatsApp privé pour un danger), asynchronie (le message est lu trop tard), absence de procédure et message ambigu. C'est le contraire d'un excès de formalisme.`,
 `Une alerte de sécurité doit arriver tout de suite, à la bonne personne, sous une forme claire : ici, aucune des trois conditions n'était remplie.`);
one(1,10,`Cas concrets`,`Dans le cas de la fuite d'huile, quelle chaîne d'alerte le cours présente-t-il comme correcte ?`,
 [`Agent → chef d'équipe (téléphone ou face-à-face) + ticket GMAO → HSE (mail modèle) → brief d'équipe de 5 minutes`,
  `Agent → groupe WhatsApp de l'équipe → chef d'équipe → HSE`,
  `Agent → HSE par mail → brief d'équipe → chef d'équipe`,
  `Agent → brief d'équipe → ticket GMAO → chef d'équipe`],0,
 `La bonne chaîne commence par un canal direct et synchrone (téléphone ou face-à-face) vers le chef, doublé d'une trace (ticket GMAO), puis informe le service HSE avec un mail modèle et se termine par un brief d'équipe de 5 minutes.`,
 `D'abord prévenir vite la bonne personne, puis laisser une trace, puis informer les spécialistes, puis tout le monde : l'urgence d'abord, la diffusion ensuite.`);
mul(1,10,`Cas concrets`,`Que doit contenir le message type d'alerte (50 mots au maximum) ?`,
 [`La zone`,`Le danger`,`L'action à mener`,`Le nom et l'heure`,`L'historique de la machine`],[0,1,2,3],
 `Le message type tient en 50 mots maximum et indique la zone, le danger, l'action, le nom et l'heure. L'historique de la machine alourdirait une alerte qui doit être lue en quelques secondes.`,
 `Où ? Quoi ? Que faire ? Qui et quand ? Si ton alerte répond à ces quatre questions en deux lignes, elle est bonne.`);
one(1,11,`Communiquer efficacement`,`Comment le cours définit-il le feed-back ?`,
 [`Une réaction verbale ou non verbale qui valide la pertinence et la justesse du message`,
  `Un message de la hiérarchie vers les collaborateurs`,
  `Une critique formulée par écrit`,
  `Le canal utilisé pour transmettre le message`],0,
 `Le feed-back est la réaction, verbale ou non verbale, qui valide la pertinence et la justesse du message. C'est lui qui ferme le cycle de la communication.`,
 `Un hochement de tête, un « d'accord, donc je fais ça pour jeudi » : tout retour qui montre à l'émetteur que son message est bien arrivé est un feed-back.`);
one(1,11,`Communiquer efficacement`,`Pour le cours, que signifie « écouter », par opposition à « entendre » ?`,
 [`Saisir et comprendre le point de vue de l'autre`,`Percevoir clairement les paroles de l'autre`,`Préparer sa réponse pendant que l'autre parle`,`Noter mot à mot ce que dit l'autre`],0,
 `Le cours pose « écouter ≠ entendre » : écouter, c'est saisir et comprendre le point de vue de l'autre. Percevoir les paroles, c'est seulement entendre.`,
 `On peut entendre la radio en faisant autre chose ; écouter quelqu'un demande de s'intéresser à ce qu'il veut dire.`);
one(1,11,`Communiquer efficacement`,`« Parler et écouter sans juger, en tenant compte des intérêts du récepteur » : quelle attitude le cours décrit-il ainsi ?`,
 [`Être ouvert`,`Donner un feed-back`,`Être assertif`,`Reformuler`],0,
 `C'est la définition d'« être ouvert », l'une des trois clés pour communiquer efficacement avec le feed-back et l'écoute.`,
 `Être ouvert, c'est laisser la porte entrouverte : on n'arrive pas avec un verdict déjà prêt.`);
mul(1,11,`Introverti / extraverti`,`Quels traits le cours attribue-t-il à l'introverti ?`,
 [`Il aime réfléchir avant de répondre`,`Il préfère le tête-à-tête et l'écrit`,`Il garde son énergie et son enthousiasme à l'intérieur`,`Il s'exprime à voix haute avant de conclure`,`Il recherche le groupe et le contact direct`],[0,1,2],
 `L'introverti réfléchit avant de répondre, préfère le tête-à-tête et l'écrit, garde son énergie à l'intérieur et arrive en réunion avec des conclusions mûries. Penser à voix haute et rechercher le groupe sont des traits de l'extraverti.`,
 `L'introverti fait son brouillon dans sa tête avant de parler ; l'extraverti fait son brouillon à voix haute devant tout le monde.`);
mul(1,11,`Introverti / extraverti`,`Quels traits le cours attribue-t-il à l'extraverti ?`,
 [`Il communique son énergie et son enthousiasme`,`Il répond vite, sans réfléchir longtemps`,`Il recherche le groupe et le contact direct`,`Il arrive en réunion avec des conclusions mûries`,`Il préfère l'écrit`],[0,1,2],
 `L'extraverti communique son énergie, répond vite, recherche le groupe et le contact direct, et réfléchit à voix haute en réunion. Les conclusions mûries et la préférence pour l'écrit décrivent l'introverti.`,
 `L'extraverti pense en parlant : ce qu'il dit en réunion n'est pas forcément sa position finale, c'est sa réflexion en cours.`);
one(1,11,`Introverti / extraverti`,`Pourquoi le cours compare-t-il introvertis et extravertis ?`,
 [`Pour adapter son message et ses moyens de communication aux membres de l'équipe`,
  `Pour savoir qui recruter en priorité`,
  `Pour montrer que les extravertis communiquent mieux`,
  `Pour répartir les tâches écrites et orales`],0,
 `La conclusion de la diapo est d'adapter son message et ses moyens de communication aux membres de l'équipe. Aucun profil n'est présenté comme meilleur que l'autre.`,
 `Demander un avis à chaud à un introverti, c'est le mettre en difficulté ; lui envoyer la question la veille par écrit, c'est obtenir sa meilleure réponse.`);
one(1,12,`DESC`,`Quel est l'ordre des étapes de la méthode DESC ?`,
 [`Décrire, Exprimer, Suggérer, Convenir`,`Décrire, Exprimer, Convenir, Suggérer`,`Décrire, Évaluer, Suggérer, Conclure`,`Observation, Sentiment, Besoin, Demande`],0,
 `DESC, c'est Décrire, Exprimer, Suggérer, Convenir, dans cet ordre. Observation, Sentiment, Besoin, Demande est la méthode OSBD de la séance 5, qui suit la même logique.`,
 `On part des faits (D), on dit ce qu'on ressent (E), on propose (S), puis on se met d'accord (C) : du passé vers l'avenir.`);
one(1,12,`DESC`,`Dans DESC, que doit contenir l'étape « Décrire » ?`,
 [`Un fait précis et daté, sans « toujours » ni « jamais »`,`Une émotion formulée en « je »`,`Une demande concrète et réalisable`,`Un accord précis : qui, quoi, quand`],0,
 `Le D décrit un fait précis et daté, sans généralisation (« toujours », « jamais »), pour que l'autre ne puisse pas le contester. L'émotion vient au E, la demande au S, l'accord au C.`,
 `Écris le D comme un constat d'huissier : une date, un fait, rien que l'on puisse discuter.`);
one(1,12,`DESC`,`Dans DESC, que doit contenir l'étape « Exprimer » ?`,
 [`Une émotion formulée en « je », sans jugement sur la personne`,`Un jugement sur le comportement de l'autre`,`Le rappel détaillé des faits`,`La répartition de qui fait quoi et quand`],0,
 `Le E exprime une émotion en « je » (« je suis inquiet »), sans jugement sur la personne. Juger l'autre (« tu es négligent ») est justement le piège classique de DESC.`,
 `« Je suis inquiet » parle de moi, personne ne peut le contester ; « tu es négligent » parle de l'autre, et il va se défendre.`);
one(1,12,`DESC`,`Dans DESC, que doit contenir l'étape « Suggérer » ?`,
 [`Une demande concrète et réalisable`,`Une sanction en cas de récidive`,`Une émotion formulée en « je »`,`Un fait précis et daté`],0,
 `Le S formule une demande concrète et réalisable. DESC est une méthode de feed-back assertif : on cherche une solution, pas une sanction.`,
 `Après avoir dit ce qui ne va pas, on dit ce qui irait : une demande que l'autre peut vraiment satisfaire.`);
one(1,12,`DESC`,`Dans DESC, à quoi aboutit l'étape « Convenir » ?`,
 [`À un accord précis : qui, quoi, quand`,`À une émotion partagée par les deux personnes`,`À un rappel des faits`,`À un compte rendu envoyé à la hiérarchie`],0,
 `Le C conclut par un accord précis qui dit qui fait quoi et pour quand. Sans cet accord, la discussion reste sans suite.`,
 `Une bonne discussion se termine par un rendez-vous dans l'agenda, pas par « bon, on verra ».`);
one(1,12,`DESC`,`Dans l'exemple du livrable en retard, « Peux-tu me prévenir dès qu'un risque apparaît ? » correspond à quelle étape de DESC ?`,
 [`Suggérer`,`Décrire`,`Exprimer`,`Convenir`],0,
 `C'est une demande concrète et réalisable adressée à l'autre : l'étape S, Suggérer. L'accord final (C) sera « on le valide au lancement de chaque tâche ».`,
 `Une question qui propose un changement de comportement, c'est une suggestion ; l'engagement commun qui suit, c'est le « convenir ».`);
one(1,12,`DESC`,`Dans l'exemple du livrable en retard, « Je suis inquiet : j'ai dû décaler ma présentation » correspond à quelle étape de DESC ?`,
 [`Exprimer`,`Décrire`,`Suggérer`,`Convenir`],0,
 `La phrase dit une émotion en « je » et sa conséquence pour soi : c'est l'étape E, Exprimer.`,
 `Repère le « je suis » suivi d'une émotion : c'est presque toujours le E de DESC.`);
one(1,12,`DESC`,`Dans l'exemple du livrable en retard, « On le valide au lancement de chaque tâche » correspond à quelle étape de DESC ?`,
 [`Convenir`,`Suggérer`,`Exprimer`,`Décrire`],0,
 `C'est l'accord final, commun et précis : l'étape C, Convenir. Le « on » montre qu'il s'agit d'un engagement partagé, pas d'une simple demande.`,
 `« Peux-tu… ? » (une personne demande) = Suggérer ; « On fait… » (les deux s'engagent) = Convenir.`);
one(1,12,`DESC`,`Quelle phrase convient pour ouvrir un DESC à l'étape « Décrire » ?`,
 [`« L'étude devait arriver lundi, je l'ai reçue jeudi. »`,`« Tu es toujours en retard. »`,`« Tu es négligent. »`,`« Tu ne rends jamais rien à temps. »`],0,
 `Seule la première phrase décrit un fait précis et daté. Les autres généralisent (« toujours », « jamais ») ou jugent la personne (« négligent »), ce qui provoque la défense plutôt que l'écoute.`,
 `Un fait daté ne se discute pas ; « toujours » et « jamais » invitent l'autre à chercher le contre-exemple.`);
mul(1,12,`DESC`,`Piège classique de DESC : lesquelles de ces phrases expriment une émotion, et non un jugement ?`,
 [`« Je suis agacé. »`,`« Je suis inquiet. »`,`« Tu es négligent. »`,`« Tu ne fais aucun effort. »`],[0,1],
 `« Je suis agacé » et « je suis inquiet » décrivent ce que je ressens : ce sont des émotions. « Tu es négligent » et « tu ne fais aucun effort » portent un jugement sur l'autre.`,
 `Phrase en « je » + émotion = Exprimer. Phrase en « tu es » = jugement, à proscrire dans DESC.`);
mul(1,12,`DESC`,`Quelles affirmations sur la méthode DESC sont exactes ?`,
 [`C'est une méthode de feed-back assertif`,`Le « D » exclut les mots « toujours » et « jamais »`,`Le « C » fixe qui fait quoi et quand`,`Le « S » consiste à annoncer une sanction`,`C'est la méthode de communication non violente vue en séance 5`],[0,1,2],
 `DESC est le feed-back assertif de la séance 1 : D sans généralisation, C avec un accord précis. Le S est une suggestion, pas une sanction, et la méthode de communication non violente de la séance 5 est OSBD.`,
 `DESC (séance 1) et OSBD (séance 5) sont deux cousines : même logique, lettres différentes.`);

/* ================= SÉANCE 2 · ÉCRIT PROFESSIONNEL (diapos 13-20) ================= */
one(2,13,`Chiffres de l'écrit`,`Selon le cours, quelle part du travail quotidien passe par l'écrit ?`,
 [`80 %`,`50 %`,`20 %`,`95 %`],0,
 `Le cours ouvre la séance 2 sur ce chiffre : 80 % du travail quotidien passe par l'écrit. C'est l'argument principal pour soigner ses écrits professionnels.`,
 `Quatre tâches sur cinq passent par l'écrit : mails, comptes rendus, rapports, messages. L'oral est l'exception, pas la règle.`);
one(2,13,`Chiffres de l'écrit`,`Selon le cours, combien de temps passe-t-on chaque jour sur ses e-mails ?`,
 [`2,5 heures`,`1 heure`,`30 minutes`,`4 heures`],0,
 `Le cours indique 2,5 heures par jour consacrées aux e-mails, soit environ un tiers d'une journée de travail.`,
 `Deux heures et demie, c'est une demi-journée tous les deux jours passée dans sa boîte mail : d'où l'intérêt de mails courts et clairs.`);
one(2,13,`Sondage Ipsos`,`Qui a été interrogé dans le sondage Ipsos 2021 cité par le cours ?`,
 [`2 500 recruteurs`,`25 000 salariés`,`500 directeurs des ressources humaines`,`1 000 étudiants en école d'ingénieurs`],0,
 `Le sondage Ipsos 2021 porte sur 2 500 recruteurs. C'est donc l'avis de ceux qui embauchent, ce qui donne du poids aux chiffres qui suivent.`,
 `Retiens « 2021, 2 500 » : deux nombres qui commencent par 2, et ce sont les recruteurs qui parlent.`);
one(2,13,`Sondage Ipsos`,`Selon le sondage Ipsos 2021, quelle part des recruteurs juge la maîtrise du français prioritaire ?`,
 [`86 %`,`76 %`,`91 %`,`77 %`],0,
 `86 % des recruteurs jugent le français prioritaire, et même 91 % chez les RH. Les autres chiffres existent dans le sondage, mais pour d'autres questions : 76 % lacunes quotidiennes, 77 % productivité.`,
 `86 %, c'est le chiffre phare : il est aussi repris sur la diapo 50 des chiffres à connaître.`);
one(2,13,`Sondage Ipsos`,`Dans le sondage Ipsos 2021, à quoi correspond le chiffre de 76 % ?`,
 [`Aux recruteurs confrontés chaque jour à des lacunes d'orthographe et d'expression`,`Aux recruteurs qui jugent le français prioritaire`,`Aux recruteurs pour qui la relation client en pâtit`,`Aux recruteurs pour qui la productivité en pâtit`],0,
 `76 % des recruteurs sont confrontés chaque jour aux lacunes d'orthographe et d'expression. Les autres réponses correspondent à 86 % (français prioritaire), 91 % (relation client) et 77 % (productivité).`,
 `Classe les chiffres du plus grand au plus petit : 91 relation client, 86 français prioritaire, 77 productivité, 76 lacunes au quotidien.`);
one(2,13,`Sondage Ipsos`,`Selon le sondage Ipsos 2021, quelle part des recruteurs estime que la relation client pâtit des lacunes à l'écrit ?`,
 [`91 %`,`77 %`,`86 %`,`Deux tiers`],0,
 `91 % : la relation client en pâtit. Le sondage cite aussi 77 % pour la productivité et deux tiers pour la performance financière.`,
 `Le client est le premier à voir les fautes : c'est logiquement sur la relation client que le chiffre est le plus élevé.`);
one(2,13,`Sondage Ipsos`,`D'après le sondage, combien d'employeurs voient les lacunes à l'écrit comme un obstacle à la promotion ?`,
 [`8 sur 10`,`4 sur 10`,`1 sur 2`,`2 sur 3`],0,
 `8 employeurs sur 10 y voient un obstacle à la promotion. À ne pas confondre avec « 4 recruteurs sur 5 » qui jugent les fautes rédhibitoires à l'embauche.`,
 `4 sur 5 et 8 sur 10, c'est la même proportion : l'un concerne l'embauche, l'autre la promotion. Les fautes freinent à l'entrée comme en cours de carrière.`);
mul(2,13,`4 enjeux de l'écrit`,`Lesquels font partie des 4 enjeux de l'écrit pour l'ingénieur ?`,
 [`Convaincre`,`Coordonner`,`Représenter`,`Transmettre`,`Contrôler`],[0,1,2,3],
 `Le cours donne quatre enjeux : convaincre, coordonner, représenter, transmettre. Contrôler n'en fait pas partie.`,
 `Mnémotechnique : « CCRT », ou « Ça Coûte Rien de Transmettre » pour Convaincre, Coordonner, Représenter, Transmettre.`);
one(2,14,`5 principes`,`Selon le principe de clarté, combien de mots une phrase doit-elle compter au maximum ?`,
 [`15 à 20 mots`,`8 à 10 mots`,`25 à 30 mots`,`50 mots`],0,
 `Clarté : 15 à 20 mots maximum par phrase, un vocabulaire simple, une idée par phrase. 8 à 10 mots, c'est la longueur maximale d'un objet d'e-mail.`,
 `Une phrase de 15 à 20 mots se lit d'une traite sans reprendre son souffle. Au-delà, le lecteur doit relire.`);
one(2,14,`5 principes`,`« Adapter le texte à la cible, supprimer le superflu, privilégier les faits aux opinions » : quel principe de rédaction le cours décrit-il ainsi ?`,
 [`La pertinence`,`La clarté`,`La structure`,`La tonalité`],0,
 `C'est la pertinence : dire ce qui est utile à ce lecteur-là, et seulement cela. La clarté porte sur la phrase, la structure sur le plan, la tonalité sur le ton.`,
 `Pertinent veut dire « qui a sa place ici » : chaque phrase doit servir ce destinataire précis.`);
one(2,14,`5 principes`,`« Un plan logique, l'essentiel en avant : date, objet, action attendue » : quel principe de rédaction le cours décrit-il ainsi ?`,
 [`La structure`,`La lisibilité`,`La clarté`,`La pertinence`],0,
 `C'est la structure : organiser le texte et placer l'essentiel au début. La lisibilité concerne la présentation visuelle (police, listes, gras).`,
 `Pense au lecteur pressé qui ne lit que les deux premières lignes : tout ce qui compte doit s'y trouver.`);
one(2,14,`5 principes`,`« Respect, neutralité, courtoisie ; ni majuscules ni points d'exclamation en série » : quel principe de rédaction le cours décrit-il ainsi ?`,
 [`La tonalité`,`La lisibilité`,`La pertinence`,`La structure`],0,
 `C'est la tonalité : le ton du message. Les majuscules et les « !!! » donnent une impression de cri ou d'agacement.`,
 `La tonalité, c'est la voix de ton écrit : même sans parler, un mail peut sembler poli ou énervé.`);
one(2,14,`5 principes`,`« Police sobre en taille 11 ou 12, listes, gras sur l'essentiel, relecture » : quel principe de rédaction le cours décrit-il ainsi ?`,
 [`La lisibilité`,`La clarté`,`La tonalité`,`La structure`],0,
 `C'est la lisibilité : rendre le texte agréable et rapide à parcourir à l'œil. La clarté, elle, porte sur la longueur des phrases et le vocabulaire.`,
 `La lisibilité, c'est la mise en page ; la clarté, c'est la phrase. Un texte peut être clair mais illisible s'il est en un seul bloc.`);
mul(2,14,`5 principes`,`Lesquels font partie des 5 principes de la rédaction ?`,
 [`La clarté`,`La structure`,`La pertinence`,`La lisibilité`,`L'originalité`],[0,1,2,3],
 `Les 5 principes sont clarté, structure, pertinence, tonalité et lisibilité. L'originalité n'en fait pas partie : un écrit professionnel cherche à être compris, pas à surprendre.`,
 `Mnémotechnique : « Clara Structure Patiemment Tous Les textes », pour Clarté, Structure, Pertinence, Tonalité, Lisibilité.`);
mul(2,14,`5 principes`,`Lesquelles relèvent du principe de clarté ?`,
 [`Des phrases de 15 à 20 mots au maximum`,`Un vocabulaire simple`,`Une idée par phrase`,`Une police sobre en taille 11 ou 12`,`Des faits plutôt que des opinions`],[0,1,2],
 `La clarté porte sur la phrase : longueur, vocabulaire, une idée à la fois. La police sobre relève de la lisibilité, et les faits plutôt que les opinions de la pertinence.`,
 `Clarté = la phrase. Lisibilité = la page. Pertinence = le contenu.`);
one(2,14,`Registre`,`Dans quel ordre le cours classe-t-il les registres de langue ?`,
 [`Familier → courant → soutenu → administratif`,`Courant → familier → administratif → soutenu`,`Familier → soutenu → courant → administratif`,`Administratif → familier → courant → soutenu`],0,
 `Le cours classe les registres du plus relâché au plus codifié : familier, courant, soutenu, administratif.`,
 `Imagine un escalier qu'on monte : on part du langage entre amis (familier) pour arriver au langage des formulaires (administratif).`);
one(2,14,`Registre`,`Quelle est la règle d'or du registre dans un écrit professionnel ?`,
 [`Rester entre le registre courant et le registre soutenu`,`Toujours écrire en registre administratif`,`Rester entre le registre familier et le registre courant`,`Adopter systématiquement le registre de son interlocuteur`],0,
 `La règle d'or du cours : rester entre courant et soutenu. Le familier manque de respect, l'administratif est lourd et distant.`,
 `Ni le jean troué, ni le smoking : la tenue de bureau. C'est pareil pour la langue.`);
one(2,14,`Mots à bannir`,`Le cours conseille de bannir l'expression « Suite à ». Par quoi la remplacer ?`,
 [`« À la suite de »`,`« Suite à cela »`,`« En suite de »`,`« Ci-joint »`],0,
 `« Suite à » est une tournure fautive en français soigné ; le cours recommande « à la suite de ».`,
 `Il manque un « à la » : on dit « à la suite de la réunion », comme on dit « à la fin de la réunion ».`);
one(2,14,`Mots à bannir`,`Le cours conseille de bannir « Ci-joint vous trouverez ». Par quoi le remplacer ?`,
 [`« Je joins »`,`« Veuillez trouver ci-joint »`,`« En pièce jointe vous trouverez »`,`« Suite à mon mail »`],0,
 `Le cours recommande « je joins » : plus court, plus direct et à la voix active. Les autres variantes gardent la même lourdeur.`,
 `Un sujet, un verbe : « Je joins le rapport. » Le lecteur sait tout de suite qui fait quoi.`);
one(2,15,`E-mail`,`Dans quel ordre se présentent les parties d'un e-mail professionnel ?`,
 [`Objet, appel, corps, politesse, signature`,`Appel, objet, corps, signature, politesse`,`Objet, corps, appel, politesse, signature`,`Appel, corps, objet, politesse, signature`],0,
 `Un e-mail professionnel suit l'ordre objet, formule d'appel, corps, formule de politesse, signature.`,
 `C'est l'ordre de lecture : le destinataire voit d'abord l'objet dans sa boîte, puis « Bonjour », le message, « Cordialement » et enfin qui écrit.`);
mul(2,15,`E-mail`,`Quelles pratiques le cours range-t-il dans les « à faire » d'un e-mail ?`,
 [`Un e-mail par sujet`,`Répondre sous 24 heures`,`Mentionner la pièce jointe`,`Un objet qui indique le sujet et l'action attendue`,`Mettre en copie tous ceux que le sujet pourrait intéresser`],[0,1,2,3],
 `À faire : objet explicite (sujet + action), un sujet par mail, une idée par paragraphe, Cc seulement pour les infos passives, réponse sous 24 h, relecture, mention de la PJ. Mettre tout le monde en copie va à l'encontre de la règle sur le Cc.`,
 `Un bon mail se traite en un coup d'œil : un sujet, une action, une échéance, et seulement les bonnes personnes.`);
one(2,15,`E-mail`,`Selon le cours, à quoi doit servir le champ « Cc » d'un e-mail ?`,
 [`Uniquement aux personnes à tenir informées, sans action à mener`,`À toute la hiérarchie, par principe`,`Aux destinataires qui doivent agir`,`À garder une trace pour soi`],0,
 `Le cours réserve le Cc aux « infos passives » : ceux qui doivent seulement être au courant. Ceux qui doivent agir se mettent dans « À ».`,
 `« À » : c'est à toi de jouer. « Cc » : pour info, rien à faire.`);
mul(2,15,`E-mail`,`Quelles pratiques le cours range-t-il dans les « à éviter » d'un e-mail ?`,
 [`Un objet vague comme « Question » ou « Important »`,`Écrire en majuscules`,`Envoyer un corps vide avec seulement une pièce jointe`,`Utiliser « Répondre à tous » sans réfléchir`,`Relire à voix basse avant d'envoyer`],[0,1,2,3],
 `À éviter : objet vague, majuscules, « urgent » abusif, réponse à chaud, « Répondre à tous » irréfléchi, ironie et émoticônes, corps vide, fuir une conversation difficile par mail. Relire à voix basse est au contraire conseillé.`,
 `Chaque « à éviter » fait perdre du temps ou froisse le destinataire ; relire à voix basse, c'est justement repérer ces défauts avant d'envoyer.`);
one(2,15,`E-mail`,`Que conseille le cours face à un e-mail qui vous agace ?`,
 [`Ne pas répondre à chaud : écrire un brouillon et le relire à froid`,`Répondre immédiatement pour montrer sa réactivité`,`Répondre à tous pour prendre des témoins`,`Ne jamais répondre`],0,
 `Le cours met « répondre à chaud » dans les erreurs : il faut faire un brouillon et le relire à froid. C'est aussi la stratégie « prendre du recul » contre les biais (diapo 39).`,
 `Un mail écrit en colère se regrette souvent le lendemain : le brouillon laisse le temps à l'émotion de retomber.`);
one(2,15,`E-mail`,`Pourquoi le cours déconseille-t-il d'écrire en majuscules dans un e-mail ?`,
 [`Parce que les majuscules donnent l'impression de crier`,`Parce qu'elles sont plus difficiles à taper`,`Parce qu'elles sont réservées à l'objet`,`Parce qu'elles empêchent la mise en gras`],0,
 `À l'écrit, les majuscules équivalent à crier. Le ton du message devient agressif, même si ce n'était pas l'intention.`,
 `Lis « MERCI DE RÉPONDRE » à voix haute comme c'est écrit : tu cries.`);
one(2,15,`E-mail`,`Une conversation difficile s'annonce avec un collègue. Que dit le cours à propos de l'e-mail dans ce cas ?`,
 [`Il ne faut pas fuir une conversation difficile en passant par l'e-mail`,`L'e-mail est le canal idéal, car il évite l'émotion`,`Il faut l'envoyer en mettant la hiérarchie en copie`,`Il faut l'écrire en majuscules pour être clair`],0,
 `« Fuir une conversation difficile par e-mail » fait partie des choses à éviter. C'est cohérent avec la séance 1 : un conflit se gère en entretien en présentiel.`,
 `L'e-mail protège celui qui l'envoie, mais il blesse souvent celui qui le reçoit, qui ne peut pas répondre tout de suite.`);
one(2,16,`Objet`,`Combien de mots au maximum le cours conseille-t-il pour l'objet d'un e-mail ?`,
 [`8 à 10 mots`,`15 à 20 mots`,`3 mots`,`25 mots`],0,
 `Un bon objet est précis, opérationnel, professionnel et bref : 8 à 10 mots au maximum. 15 à 20 mots, c'est la longueur maximale d'une phrase.`,
 `L'objet doit tenir dans l'aperçu de la boîte mail : au-delà de dix mots, la fin est coupée.`);
mul(2,16,`Objet`,`Quels objets d'e-mail le cours juge-t-il bons ?`,
 [`« Demande de validation – offre client Y »`,`« Rappel : réunion du 12/06 à 14h – projet X »`,`« URGENT »`,`« Info »`],[0,1],
 `Les deux premiers objets disent de quoi il s'agit et ce qu'on attend. « URGENT », « Important » ou « Info » sont cités comme mauvais : ils ne disent rien du contenu.`,
 `Un bon objet permet de retrouver le mail six mois plus tard avec la barre de recherche ; « Info », jamais.`);
one(2,16,`Formules`,`Vous écrivez pour la première fois à un destinataire inconnu, dans un contexte formel. Quelle formule d'appel le cours recommande-t-il ?`,
 [`« Madame, Monsieur, »`,`« Bonjour à tous, »`,`« Bonjour Jean, »`,`« Cher ami, »`],0,
 `En contexte formel ou avec un inconnu : « Madame, Monsieur », et en fin de mail « Veuillez recevoir mes salutations distinguées ».`,
 `Inconnu = on ne connaît pas son prénom, on ne peut donc pas l'appeler par son prénom : on reste sur la formule la plus neutre.`);
one(2,16,`Formules`,`Dans un e-mail professionnel standard, quelle formule de fin le cours recommande-t-il ?`,
 [`« Cordialement » ou « Bien cordialement »`,`« Veuillez recevoir mes salutations distinguées »`,`« Merci d'avance » ou « Au plaisir »`,`« Bonne journée à toi »`],0,
 `Contexte standard : « Bonjour » au début, « Cordialement » ou « Bien cordialement » à la fin. Les salutations distinguées sont pour le formel, « Merci d'avance » et « Au plaisir » pour le convivial.`,
 `Trois niveaux : formel (salutations distinguées), standard (cordialement), convivial (au plaisir). Le standard, c'est le niveau du milieu.`);
one(2,16,`Formules`,`Dans un e-mail convivial mais professionnel qui commence par « Bonjour Jean », quelle formule de fin le cours propose-t-il ?`,
 [`« Merci d'avance » ou « Au plaisir »`,`« Veuillez recevoir mes salutations distinguées »`,`« Cordialement » uniquement`,`« À plus »`],0,
 `Pour un ton convivial mais pro, le cours propose « Merci d'avance » ou « Au plaisir ». « À plus » reste du registre familier, à éviter.`,
 `Convivial ne veut pas dire familier : on peut être chaleureux sans écrire comme dans un SMS.`);
mul(2,16,`Mauvais → bon mail`,`Que faut-il, selon le cours, pour transformer un mauvais mail en bon mail ?`,
 [`Un objet exploitable et une formule d'appel`,`Une action claire et un délai`,`Des phrases courtes et une signature complète`,`Un récit détaillé de tout le contexte`],[0,1,2],
 `Le cours liste : objet exploitable, formule d'appel, une action claire et un délai, phrases courtes, signature complète. Un long récit va contre la clarté et la pertinence.`,
 `Un bon mail répond à trois questions : de quoi parle-t-on ? que dois-je faire ? pour quand ?`);
one(2,17,`Erreurs courantes`,`Quelle correction le cours propose-t-il pour une phrase longue, floue et non structurée ?`,
 [`Une phrase courte : sujet, verbe, complément`,`Ajouter des virgules pour aérer`,`Mettre en majuscules les mots importants`,`Passer au registre administratif`],0,
 `Le cours remplace la phrase longue et floue par une phrase courte construite simplement : sujet, verbe, complément.`,
 `« Le rapport (sujet) arrive (verbe) jeudi (complément). » Impossible de mal comprendre.`);
one(2,17,`Erreurs courantes`,`Un collègue écrit « Salut », « À + » et termine par « !!! ». Quelle correction le cours propose-t-il ?`,
 [`« Bonjour », « Bien cordialement » et un ton neutre`,`« Madame, Monsieur » dans tous les cas`,`Supprimer toute formule d'appel et de politesse`,`Ajouter des émoticônes pour adoucir le ton`],0,
 `Ton familier ou autoritaire → « Bonjour », « Bien cordialement », ton neutre. Les émoticônes sont aussi à éviter selon la diapo 15.`,
 `On passe du langage entre copains au langage de bureau, sans tomber dans le langage administratif.`);
one(2,17,`Erreurs courantes`,`Un texte est envoyé en un seul bloc, avec beaucoup de majuscules, de couleurs et de gras. Que conseille le cours ?`,
 [`Des paragraphes, des listes, des sauts de ligne et du gras seulement sur les dates et les actions`,`Tout mettre en gras pour être sûr d'être lu`,`Garder un seul paragraphe pour aller plus vite`,`Utiliser une police fantaisie pour attirer l'œil`],0,
 `Le cours conseille de structurer visuellement (paragraphes, listes, sauts de ligne) et de réserver le gras aux dates et aux actions. Quand tout est en gras, plus rien ne ressort.`,
 `Le gras est comme un surligneur : si tu surlignes toute la page, tu ne retrouves plus rien.`);
one(2,17,`Erreurs courantes`,`Un mail contient du jargon non expliqué et des mots vagues comme « le truc » ou « ça ». Que conseille le cours ?`,
 [`Un vocabulaire adapté au lecteur et des objets nommés précisément`,`Ajouter des abréviations pour faire court`,`Passer au registre familier pour être compris`,`Allonger les phrases pour tout expliquer`],0,
 `Le cours remplace le jargon et les mots vagues par un vocabulaire adapté et des objets nommés précisément.`,
 `« Le truc ne marche pas » oblige le lecteur à deviner ; « la pompe P2 est à l'arrêt » lui permet d'agir.`);
one(2,17,`Erreurs courantes`,`Un mail confond « sa » et « ça », ou « ces » et « ses ». Quel remède le cours propose-t-il ?`,
 [`Relire : orthographe, syntaxe et ponctuation`,`Envoyer quand même, le sens reste compréhensible`,`Passer le texte en majuscules`,`Remplacer les mots par des abréviations`],0,
