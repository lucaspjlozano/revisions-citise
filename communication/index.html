 `Les fautes d'homophones et d'accords se corrigent par une relecture attentive : orthographe, syntaxe, ponctuation. Le sondage Ipsos montre qu'elles pèsent lourd chez les recruteurs.`,
 `Une faute ne bloque pas toujours le sens, mais elle bloque la confiance : 4 recruteurs sur 5 les jugent rédhibitoires.`);
one(2,18,`3 documents`,`Quel document interne transmet un ordre d'un supérieur à plusieurs subordonnés ?`,
 [`La note de service`,`La note d'information`,`Le compte rendu`,`Le communiqué institutionnel`],0,
 `La note de service est un document interne qui transmet un ordre d'un supérieur à plusieurs subordonnés. La note d'information diffuse une règle ou une décision, le compte rendu retranscrit une réunion.`,
 `Note de SERVICE : elle dit au service ce qu'il doit faire. C'est la plus impérative des trois.`);
mul(2,18,`3 documents`,`Quelles caractéristiques le cours attribue-t-il à la note de service ?`,
 [`Un style impersonnel et impératif`,`L'absence de formule de politesse`,`Un seul sujet, sur une page`,`Elle retranscrit fidèlement une réunion`],[0,1,2],
 `La note de service est claire, concise, impersonnelle et impérative, sans formule de politesse, avec un seul sujet sur une page. Retranscrire une réunion, c'est le rôle du compte rendu.`,
 `Une note de service ressemble à un panneau de consigne : court, direct, sans « cordialement ».`);
one(2,18,`3 documents`,`Quel document est une communication descendante formelle qui diffuse une règle, un changement ou une décision ?`,
 [`La note d'information`,`Le compte rendu`,`Le reporting`,`La prise de notes`],0,
 `La note d'information est une communication descendante formelle qui diffuse une règle, un changement ou une décision. Le reporting est ascendant et le compte rendu retranscrit un échange.`,
 `La note de service ordonne une action ; la note d'information fait connaître une décision.`);
one(2,18,`3 documents`,`Que contient le corps d'une note d'information ?`,
 [`Le contexte, la décision et la consigne`,`La date, le lieu et les participants`,`L'objet, la formule d'appel et la formule de politesse`,`Les points abordés et les actions à suivre`],0,
 `Le corps de la note d'information contient le contexte, la décision et la consigne. Date, lieu, participants et actions à suivre sont les éléments du compte rendu.`,
 `Pourquoi on change (contexte), ce qu'on change (décision), ce que vous devez faire (consigne).`);
one(2,18,`3 documents`,`Quel document se termine par la signature ou le cachet de la direction ?`,
 [`La note d'information`,`Le compte rendu`,`La prise de notes`,`L'e-mail convivial`],0,
 `La note d'information porte la signature ou le cachet de la direction, ce qui lui donne son caractère officiel. Le compte rendu indique, lui, un rédacteur et une validation éventuelle.`,
 `Le cachet, c'est le tampon officiel : il prouve que la décision vient bien de la direction.`);
one(2,18,`3 documents`,`Quel document sert de preuve et de suivi après une réunion ?`,
 [`Le compte rendu`,`La note de service`,`La prise de notes personnelle`,`L'objet d'un e-mail`],0,
 `Le compte rendu retranscrit fidèlement une réunion, un entretien ou une décision, et sert de preuve et de suivi. Les notes personnelles ne sont qu'un outil pour le rédiger.`,
 `Six mois après, quand quelqu'un dit « on n'avait jamais décidé ça », c'est le compte rendu qu'on ressort.`);
mul(2,18,`3 documents`,`Quels éléments un compte rendu doit-il contenir ?`,
 [`La date, le lieu, les participants et l'ordre du jour`,`Les points abordés numérotés, les décisions et les actions à suivre`,`Le rédacteur et une validation éventuelle`,`La signature ou le cachet de la direction`],[0,1,2],
 `Le compte rendu indique date, lieu, participants, ordre du jour, points numérotés, décisions, actions à suivre, rédacteur et validation éventuelle. Le cachet de la direction est propre à la note d'information.`,
 `Un compte rendu répond à : quand, où, qui, de quoi on a parlé, ce qu'on a décidé, qui fait quoi ensuite.`);
mul(2,18,`3 documents`,`Lesquels de ces documents sont des communications descendantes ?`,
 [`La note de service`,`La note d'information`,`Le reporting`,`La suggestion d'un salarié`],[0,1],
 `La note de service (ordre d'un supérieur) et la note d'information (communication descendante formelle) partent de la hiérarchie. Le reporting et les suggestions remontent : ils sont ascendants.`,
 `Fais le lien avec la séance 1 : les deux « notes » descendent l'organigramme, le reporting le remonte.`);
one(2,19,`Mémorisation`,`Selon le cours, on retient environ 20 % de ce que…`,
 [`nous entendons`,`nous voyons`,`nous voyons et entendons`,`nous faisons`],0,
 `On retient 20 % de ce qu'on entend (80 % est oublié le lendemain), 40 % de ce qu'on voit, 60 % de ce qu'on voit et entend, et 80 % de ce qu'on fait.`,
 `La règle avance de 20 en 20 : entendre 20, voir 40, voir et entendre 60, faire 80. Plus on est actif, plus on retient.`);
one(2,19,`Mémorisation`,`Selon le cours, quel pourcentage retient-on de ce que l'on voit et entend à la fois ?`,
 [`60 %`,`40 %`,`20 %`,`80 %`],0,
 `Voir et entendre en même temps permet de retenir 60 %, contre 40 % pour la vue seule et 20 % pour l'ouïe seule.`,
 `Additionne presque : vue (40) + ouïe (20) = 60. C'est pour ça qu'une présentation avec support visuel marque plus qu'un discours seul.`);
one(2,19,`Mémorisation`,`Selon le cours, on retient 80 % de ce que…`,
 [`nous faisons nous-mêmes, en parlant ou en écrivant`,`nous voyons`,`nous entendons`,`nous lisons`],0,
 `On retient 80 % de ce qu'on fait soi-même, par la parole ou l'écriture. C'est l'argument du cours pour prendre des notes plutôt que d'écouter passivement.`,
 `Écrire ses notes, c'est « faire » : on passe de 20 % (juste écouter) à 80 %.`);
one(2,19,`Prise de notes`,`Que signifie prendre des notes, selon le cours ?`,
 [`Écrire l'essentiel le plus vite possible, en écoutant, comprenant, traitant et assimilant`,`Copier mot à mot ce qui est dit`,`Tout écrire pour ne rien oublier`,`Enregistrer puis retranscrire intégralement`],0,
 `Prendre des notes, c'est écrire l'essentiel avec un maximum de rapidité : écouter, comprendre, traiter, assimiler, et non copier. Il faut séparer l'important de l'accessoire.`,
 `Une bonne prise de notes ressemble à un plan, pas à une dictée.`);
mul(2,19,`Prise de notes`,`Lesquelles font partie des 6 clés d'une prise de notes efficace ?`,
 [`Les symboles et les abréviations`,`Le plan`,`La concentration`,`La focalisation sur l'essentiel`,`Noter chaque mot pour être exhaustif`],[0,1,2,3],
 `Les 6 clés : symboles et abréviations, concentration, focalisation sur l'essentiel, plan, organisation des notes, exemples et références. Noter chaque mot contredit la focalisation sur l'essentiel.`,
 `Les six clés servent toutes le même but : aller vite sans perdre le sens.`);
one(2,20,`T.A.S.`,`Que signifie la règle du T.A.S. en prise de notes ?`,
 [`Style télégraphique, abréviations, symboles`,`Titre, argument, synthèse`,`Tri, analyse, structure`,`Ton, attitude, sincérité`],0,
 `T.A.S. : style Télégraphique, Abréviations, Symboles. Ce sont les trois techniques pour noter vite.`,
 `On réduit la phrase (télégraphique), puis les mots (abréviations), puis on remplace des mots par des signes (symboles).`);
one(2,20,`T.A.S.`,`« Arriverons demain 9h gare Marseille » illustre quelle technique de prise de notes ?`,
 [`Le style télégraphique`,`L'abréviation`,`Le symbole`,`Le registre soutenu`],0,
 `C'est le style télégraphique : on supprime les mots vides (articles, prépositions) et on garde les mots-clés.`,
 `Comme dans un vieux télégramme payé au mot : on ne garde que ce qui porte le sens.`);
one(2,20,`T.A.S.`,`Dans le style télégraphique, comment note-t-on les définitions et les citations ?`,
 [`En entier, entre guillemets`,`En les abrégeant au maximum`,`En les remplaçant par un symbole`,`On ne les note pas`],0,
 `C'est l'exception du style télégraphique : définitions et citations se notent en entier, entre guillemets, car chaque mot compte.`,
 `On peut résumer une explication, pas une définition : en changeant un mot, on change le sens.`);
mul(2,20,`T.A.S.`,`Quelles correspondances d'abréviations sont exactes selon le cours ?`,
 [`bcp = beaucoup`,`qd = quand`,`cpdt = cependant`,`qq = quelqu'un`,`tt = toujours`],[0,1,2,3],
 `bcp, qd, cpdt et qq sont exacts. « tt » signifie « tout » (et « ts » « tous ») ; « toujours » s'abrège « tjs ».`,
 `Pour « toujours », on garde le « j » qui s'entend : t-j-s.`);
one(2,20,`T.A.S.`,`Que signifie l'abréviation « cf. » ?`,
 [`Se reporter à`,`C'est-à-dire`,`Conférence`,`Ci-dessous figure`],0,
 `Dans le cours, « cf. » signifie « se reporter à ». « C'est-à-dire » s'abrège « càd ».`,
 `« cf. diapo 12 » : va voir la diapo 12.`);
one(2,20,`T.A.S.`,`En prise de notes, que signifie la flèche vers la droite (→) ?`,
 [`Une conséquence`,`Une cause`,`Une augmentation`,`Une équivalence`],0,
 `→ note une conséquence, ← une cause, ↗ une augmentation et ↘ une diminution.`,
 `La flèche suit le sens de lecture : A → B, A entraîne B.`);
one(2,20,`T.A.S.`,`En prise de notes, que signifie le symbole « ~ » ?`,
 [`Environ`,`Différent`,`Rien`,`Parallèle`],0,
 `« ~ » signifie environ. « ≠ » veut dire différent, « ø » rien et « // » parallèle.`,
 `La vague du « ~ » évoque quelque chose d'approximatif, qui ondule autour de la valeur.`);
mul(2,20,`T.A.S.`,`Quelles correspondances de symboles sont exactes selon le cours ?`,
 [`≠ : différent`,`// : parallèle`,`ø : rien`,`← : conséquence`,`~ : égal`],[0,1,2],
 `≠, // et ø sont exacts. ← note une cause (c'est → qui note la conséquence), et ~ signifie environ, pas égal.`,
 `Flèche vers la droite, on avance vers la conséquence ; flèche vers la gauche, on remonte à la cause.`);
one(2,20,`T.A.S.`,`Que signifie « 25 / 125 » dans le cours ?`,
 [`On note environ 25 mots par minute alors qu'on en dit 125`,`Une phrase doit faire entre 25 et 125 caractères`,`On retient 25 % de ce qu'on entend et 125 % de ce qu'on fait`,`Un objet fait 25 caractères et un mail 125 mots`],0,
 `25 / 125 mots par minute : on écrit environ 25 mots pendant qu'on en prononce 125. Impossible de tout noter, d'où le T.A.S.`,
 `On parle cinq fois plus vite qu'on écrit : la prise de notes doit donc compresser par cinq.`);
one(2,20,`T.A.S.`,`Quel exercice de synthèse le cours propose-t-il à la fin de la séance 2 ?`,
 [`Transformer une réunion orale en compte rendu écrit`,`Rédiger une note de service`,`Écrire un e-mail de réclamation`,`Préparer un oral de cinq minutes`],0,
 `L'exercice de synthèse consiste à transformer une réunion orale en compte rendu écrit : il mobilise à la fois la prise de notes et la rédaction.`,
 `C'est la séance 2 en un exercice : noter vite (T.A.S.), puis rédiger proprement (5 principes, compte rendu).`);

/* ================= SÉANCE 3 · ORAL, ÉMOTIONS, CONFLITS (diapos 21-33) ================= */
one(3,21,`Prise de parole`,`Dans une prise de parole structurée, quel est le rôle de l'introduction ?`,
 [`Capter l'attention et poser le cadre`,`Résumer, ouvrir et appeler à l'action`,`Exposer les idées de façon logique et fluide`,`Répondre aux questions du public`],0,
 `L'introduction sert à capter l'attention et à poser le cadre, avec une phrase d'accroche et le contexte. Résumer et appeler à l'action, c'est le rôle de la conclusion ; exposer les idées, celui du développement.`,
 `L'introduction est la bande-annonce : elle donne envie d'écouter et dit de quoi va parler le film.`);
one(3,21,`Prise de parole`,`Dans une prise de parole structurée, quel est le rôle de la conclusion ?`,
 [`Résumer, ouvrir et appeler à l'action`,`Capter l'attention avec une accroche`,`Ajouter une dernière idée importante`,`Détailler les exemples`],0,
 `La conclusion résume, ouvre et appelle à l'action ; l'astuce du cours est de reformuler et de donner une perspective. Ajouter une nouvelle idée à la fin brouillerait le message.`,
 `La conclusion répond à la question que se pose le public en partant : « et maintenant, qu'est-ce que j'en fais ? ».`);
one(3,21,`Prise de parole`,`Combien d'idées le cours conseille-t-il de développer au maximum dans une prise de parole ?`,
 [`Deux ou trois, illustrées d'exemples`,`Cinq ou six`,`Une seule`,`Autant que le temps le permet`],0,
 `Le développement doit exposer les idées de façon logique et fluide : deux ou trois idées au maximum, avec des exemples. Au-delà, le public décroche.`,
 `Un auditeur retient rarement plus de trois choses d'un exposé : mieux vaut trois idées bien illustrées que six survolées.`);
mul(3,21,`La voix`,`Quelles bonnes pratiques le cours donne-t-il pour la voix ?`,
 [`Parler assez fort pour être entendu, sans crier`,`Varier les intonations pour éviter la monotonie`,`Marquer des pauses, car la pause a de l'impact`,`Bien détacher les mots et éviter les tics comme « euh »`,`Parler vite pour garder l'attention`],[0,1,2,3],
 `Les quatre réglages de la voix : volume (sans crier), tonalité (varier), rythme (ni trop vite ni trop lent, la pause a de l'impact), articulation (détacher les mots, éviter les tics). Parler vite va contre le bon rythme.`,
 `Volume, tonalité, rythme, articulation : quatre boutons de réglage, comme sur une table de mixage.`);
one(3,21,`La voix`,`« Bien détacher les mots, éviter les tics comme « euh » ou « voilà » » : quel réglage de la voix le cours décrit-il ainsi ?`,
 [`L'articulation`,`Le volume`,`La tonalité`,`Le rythme`],0,
 `C'est l'articulation. Le volume règle la force de la voix, la tonalité ses variations, le rythme sa vitesse et ses pauses.`,
 `Articuler, c'est donner à chaque mot ses contours, pour qu'il arrive entier jusqu'au fond de la salle.`);
mul(3,22,`Regard et posture`,`Que recommande le cours pour le regard face à un groupe ?`,
 [`Balayer tout le groupe du regard`,`Établir un lien visuel avec chacun`,`Fixer un point au fond de la salle`,`Garder les yeux sur ses notes`],[0,1],
 `Le cours conseille de balayer le groupe et de créer un lien visuel avec chacun, sans fixer un point ni baisser les yeux.`,
 `Chaque personne du public doit avoir l'impression qu'on lui a parlé au moins une fois.`);
mul(3,22,`Regard et posture`,`Qu'est-ce que le cours conseille d'éviter dans la posture et les gestes ?`,
 [`Les bras croisés`,`Les mains dans les poches`,`Les gestes parasites`,`Les gestes ouverts au niveau du buste`],[0,1,2],
 `Posture stable, droite, ancrée, ouverte : pas de bras croisés ni de mains dans les poches, pas de gestes parasites. Les gestes ouverts au niveau du buste sont au contraire recommandés.`,
 `Bras croisés, mains dans les poches : le corps se ferme et dit « je ne suis pas à l'aise » avant même qu'on ait parlé.`);
one(3,22,`Regard et posture`,`Selon le cours, comment doivent être les déplacements pendant un oral ?`,
 [`Utiles pour rythmer, ni trop fréquents ni parasites`,`À éviter complètement`,`Permanents, pour garder l'attention`,`Réservés à la conclusion`],0,
 `Les déplacements sont utiles pour rythmer l'exposé, à condition de ne pas être trop fréquents ni parasites.`,
 `Un pas en avant pour une idée importante, c'est utile ; faire les cent pas, c'est distrayant.`);
mul(3,22,`Écoute active`,`Lesquelles font partie des 6 attitudes de l'écoute active ?`,
 [`Offrir sa disponibilité`,`Voir au-delà des mots`,`Pratiquer la reformulation`,`Ne pas exprimer de jugement`,`Préparer sa réponse pendant que l'autre parle`],[0,1,2,3],
 `Les 6 attitudes : disponibilité, empathie, être là pour écouter et non pour répondre, voir au-delà des mots, ne pas juger, reformuler. Préparer sa réponse pendant que l'autre parle, c'est exactement ce que l'écoute active veut éviter.`,
 `L'écoute active, c'est écouter pour comprendre, pas pour répondre.`);
mul(3,22,`Écoute active`,`Lesquelles font partie des 6 attitudes de l'écoute active ?`,
 [`Exprimer de l'empathie`,`Être là pour écouter et non pour répondre`,`Rassurer tout de suite son interlocuteur`,`Lui conseiller rapidement une solution`],[0,1],
 `Empathie et « écouter et non répondre » font partie des 6 attitudes. Rassurer et conseiller sont des réflexes de Porter (aide/soutien, suggestion) qui, utilisés trop tôt, ferment la communication.`,
 `Rassurer ou conseiller, c'est déjà répondre ; l'écoute active commence par laisser l'autre aller au bout.`);
mul(3,23,`Adapter au public`,`Quels critères le cours propose-t-il pour identifier son public ?`,
 [`Le statut (fonction, expert ou non)`,`Le rapport au sujet (impliqué, décisionnaire, observateur)`,`Le niveau de compréhension`,`La disponibilité et le canal préféré`,`L'âge et l'origine géographique`],[0,1,2,3],
 `Pour identifier son public, le cours cite le statut, le rapport au sujet, le niveau de compréhension, la disponibilité, le canal préféré et le cadre relationnel. L'âge et l'origine n'en font pas partie.`,
 `Avant de parler, demande-toi : qui est-il, qu'a-t-il à voir avec le sujet, que sait-il déjà, combien de temps m'accorde-t-il ?`);
one(3,23,`Adapter au public`,`Vous présentez un projet à un décisionnaire. Comment le cours conseille-t-il d'adapter le fond du message ?`,
 [`Argumenter solidement`,`Simplifier au maximum`,`Être très explicite et détaillé`,`Raconter une anecdote personnelle`],0,
 `Face à un décisionnaire, il faut argumenter solidement. Simplifier convient à un non-expert, être explicite convient à un collègue.`,
 `Le décisionnaire doit pouvoir dire oui ou non : donne-lui des arguments, pas des détails.`);
one(3,23,`Adapter au public`,`Selon le cours, comment adapter son message pour un manager, par rapport à un collègue ?`,
 [`Synthétique avec un manager, explicite avec un collègue`,`Explicite avec un manager, synthétique avec un collègue`,`Familier avec un manager, formel avec un collègue`,`Long avec un manager, court avec un collègue`],0,
 `Le cours dit : synthétique avec un manager, explicite avec un collègue. Le manager veut l'essentiel ; le collègue, qui va travailler avec vous, a besoin des détails.`,
 `Le manager lit le résumé, le collègue lit le mode d'emploi.`);
one(3,23,`Adapter au public`,`Vous devez faire une remarque sensible. Quelle forme le cours conseille-t-il ?`,
 [`Précision et diplomatie`,`Court et visuel`,`Direct et collaboratif`,`Formel et impératif`],0,
 `Pour une remarque sensible : précision et diplomatie. « Court et visuel » convient quand on a peu de temps, « direct et collaboratif » entre collègues.`,
 `Précis pour que le message passe, diplomate pour que la relation tienne.`);
one(3,23,`Adapter au public`,`Selon le cours, quel canal choisir pour lever un malentendu ou traiter une urgence ?`,
 [`Le téléphone`,`L'e-mail`,`La note`,`Le rapport`],0,
 `Le téléphone est immédiat : il convient aux malentendus et aux urgences. L'e-mail laisse une trace mais suppose un délai de réponse.`,
 `Quand il y a le feu, on appelle les pompiers, on ne leur écrit pas.`);
one(3,23,`Adapter au public`,`Selon le cours, quel canal choisir pour des échanges complexes ou pour convaincre ?`,
 [`La réunion`,`L'e-mail`,`La note`,`Le téléphone`],0,
 `La réunion convient aux échanges complexes et à la persuasion ; la note ou le rapport servent à documenter et formaliser, l'e-mail à garder une trace.`,
 `Pour convaincre, il faut voir les réactions et répondre aux objections en direct : c'est ce que permet la réunion.`);
mul(3,24,`Goleman`,`Lesquelles font partie des 5 composantes de l'intelligence émotionnelle selon Goleman ?`,
 [`La conscience de soi`,`La maîtrise de soi`,`L'empathie`,`Les aptitudes sociales`,`L'intuition`],[0,1,2,3],
 `Les 5 composantes : conscience de soi, maîtrise de soi, motivation, empathie, aptitudes sociales. L'intuition n'en fait pas partie.`,
 `Deux composantes tournées vers soi (conscience, maîtrise), une qui fait avancer (motivation), deux tournées vers les autres (empathie, aptitudes sociales).`);
mul(3,24,`Goleman`,`Lesquelles ne font pas partie des composantes de Goleman ?`,
 [`L'assertivité`,`La coopération`,`La maîtrise de soi`,`La motivation`,`L'empathie`],[0,1],
 `Assertivité et coopération sont les deux axes du modèle de Thomas-Kilmann. Goleman, lui, parle de conscience de soi, maîtrise de soi, motivation, empathie et aptitudes sociales.`,
 `Thomas-Kilmann trace une grille (assertivité × coopération) ; Goleman dresse une liste de cinq qualités.`);
one(3,24,`Goleman`,`Un ingénieur repère qu'il est stressé avant une réunion tendue. Quelle composante de l'intelligence émotionnelle mobilise-t-il ?`,
 [`La conscience de soi`,`La maîtrise de soi`,`L'empathie`,`La motivation`],0,
 `Identifier ses propres émotions avant de parler ou d'écrire, c'est la conscience de soi. La maîtrise de soi viendrait ensuite : réguler ce stress.`,
 `D'abord je remarque ce que je ressens (conscience), ensuite j'agis dessus (maîtrise).`);
one(3,24,`Goleman`,`Face à la critique d'un client, une ingénieure reformule calmement au lieu de se défendre. Quelle composante de l'intelligence émotionnelle mobilise-t-elle ?`,
 [`La maîtrise de soi`,`La conscience de soi`,`La motivation`,`L'empathie`],0,
 `Réguler ses réactions et rester professionnelle, c'est la maîtrise de soi. C'est précisément l'exemple du cours.`,
 `La maîtrise de soi, c'est le temps de pause entre l'émotion et la réaction.`);
one(3,24,`Goleman`,`Un chef de projet entraîne son équipe sur un planning difficile en donnant du sens au travail. Quelle composante de l'intelligence émotionnelle mobilise-t-il ?`,
 [`La motivation`,`Les aptitudes sociales`,`La maîtrise de soi`,`La conscience de soi`],0,
 `Donner du sens et transmettre une énergie positive, c'est la motivation selon Goleman. Les aptitudes sociales portent plutôt sur le lien, la persuasion et la gestion des désaccords.`,
 `La motivation, c'est le moteur : la sienne d'abord, puis celle qu'on communique aux autres.`);
one(3,24,`Goleman`,`Un ingénieur adapte son discours technique à un interlocuteur non spécialiste. Quelle composante de l'intelligence émotionnelle mobilise-t-il ?`,
 [`L'empathie`,`La conscience de soi`,`La motivation`,`La maîtrise de soi`],0,
 `Comprendre les émotions et les besoins de l'interlocuteur pour s'y adapter, c'est l'empathie. C'est l'exemple donné par le cours.`,
 `L'empathie, c'est se mettre à la place de l'autre : « qu'est-ce qu'il comprend, lui, de ce que je dis ? ».`);
one(3,24,`Goleman`,`Une manageuse règle un conflit d'équipe par le dialogue et l'écoute. Quelle composante de l'intelligence émotionnelle mobilise-t-elle ?`,
 [`Les aptitudes sociales`,`La motivation`,`La conscience de soi`,`La maîtrise de soi`],0,
 `Créer du lien, convaincre, gérer les désaccords : ce sont les aptitudes sociales. C'est l'exemple du cours pour cette composante.`,
 `L'empathie comprend l'autre ; les aptitudes sociales agissent avec les autres.`);
one(3,24,`Goleman`,`Complétez la formule du cours : « La communication est le canal ; l'intelligence émotionnelle en est… »`,
 [`le moteur`,`le frein`,`le message`,`le récepteur`],0,
 `Pour le cours, la communication est le canal et l'intelligence émotionnelle en est le moteur : c'est elle qui donne de la force aux échanges.`,
 `Une route (le canal) ne sert à rien sans moteur pour avancer dessus.`);
one(3,25,`IE au travail`,`Dans une réunion technique tendue, que risque-t-on sans intelligence émotionnelle ?`,
 [`Un langage défensif, un ton sec et de la fermeture`,`Trop de détails et aucun lien humain`,`Des consignes froides et peu de feed-back`,`Un message perçu comme agressif`],0,
 `Réunion tendue sans IE : langage défensif, ton sec, fermeture ; avec IE : écoute active, reformulation, posture ouverte. Les autres réponses sont les risques d'autres situations du même tableau.`,
 `Dans une réunion tendue, chacun se met en mode défense : l'IE permet d'en sortir en écoutant au lieu de riposter.`);
one(3,25,`IE au travail`,`Avec de l'intelligence émotionnelle, quel ton faut-il donner à un e-mail de désaccord ?`,
 [`Factuel, empathique et orienté solution`,`Ferme et autoritaire, pour être pris au sérieux`,`Neutre, sans émotion ni proposition`,`Ironique, pour détendre l'atmosphère`],0,
 `Sans IE, l'e-mail de désaccord est perçu comme agressif ; avec IE, il est factuel, empathique et orienté solution. L'ironie fait partie des choses à éviter dans un mail (diapo 15).`,
 `Factuel : on parle des faits. Empathique : on montre qu'on comprend l'autre. Orienté solution : on propose une issue.`);
one(3,25,`IE au travail`,`Selon le cours, qu'apporte l'intelligence émotionnelle à une présentation de projet ?`,
 [`Du storytelling, la gestion du stress, le regard et le sourire`,`Davantage de détails techniques`,`Des consignes plus fermes`,`Un discours plus long`],0,
 `Sans IE, une présentation de projet croule sous les détails et manque de lien humain ; avec IE, elle s'appuie sur le storytelling, la gestion du stress, le regard et le sourire.`,
 `Une présentation réussie raconte une histoire à des personnes, elle ne récite pas une fiche technique.`);
one(3,25,`IE au travail`,`En management d'équipe, que risque-t-on sans intelligence émotionnelle ?`,
 [`Des consignes froides et peu de feed-back`,`Un langage défensif en réunion`,`Trop de storytelling`,`Des encouragements excessifs`],0,
 `Management sans IE : consignes froides, peu de feed-back ; avec IE : encouragements, reconnaissance, reformulation positive.`,
 `Un manager sans IE donne des ordres ; un manager avec IE donne aussi des signes de reconnaissance, ce que la diapo 30 appelle des strokes.`);
one(3,25,`IE au travail`,`Selon le cours, que produit la communication avec intelligence émotionnelle, alors que sans elle on ne transmet que de l'information ?`,
 [`De l'influence, de la confiance et de la coopération`,`Davantage d'informations`,`De l'autorité`,`De la rapidité`],0,
 `Sans IE : de l'information ; avec IE : de l'influence, de la confiance, de la coopération. L'information ne suffit pas à faire agir les gens ensemble.`,
 `Un GPS donne de l'information ; un bon coéquipier donne envie de prendre la route avec lui.`);
one(3,26,`5 niveaux de conflit`,`Dans quel ordre le cours présente-t-il les 5 niveaux de conflit ?`,
 [`Divergence, malentendu, désaccord, discorde, polarisation`,`Malentendu, divergence, discorde, désaccord, polarisation`,`Divergence, désaccord, malentendu, polarisation, discorde`,`Désaccord, malentendu, divergence, discorde, polarisation`],0,
 `Les 5 niveaux vont du plus léger au plus grave : divergence, malentendu, désaccord, discorde, polarisation.`,
 `Mnémotechnique : « Deux Mecs Discutent, Dérapent, Polarisent » (Divergence, Malentendu, Désaccord, Discorde, Polarisation).`);
one(3,26,`5 niveaux de conflit`,`Deux ingénieurs ont des avis différents sur une solution, mais chacun comprend et accepte le point de vue de l'autre. Quel est le niveau de conflit ?`,
 [`La divergence`,`Le malentendu`,`Le désaccord`,`La discorde`],0,
 `Avis différent, incompatibilités comprises et acceptées : c'est le niveau 1, la divergence. Le malentendu commence quand on ne comprend plus tout à fait la position de l'autre.`,
 `La divergence est un désaccord sain : « je vois ce que tu veux dire, je ne pense pas pareil ».`);
one(3,26,`5 niveaux de conflit`,`Les incompatibilités ne sont pas tout à fait comprises, mais elles restent acceptées. Quel est le niveau de conflit ?`,
 [`Le malentendu`,`La divergence`,`Le désaccord`,`La polarisation`],0,
 `C'est le niveau 2, le malentendu : on accepte encore la différence sans bien la comprendre. Au niveau 3 (désaccord), on ne comprend plus et l'émotion arrive.`,
 `Malentendu : « je ne vois pas bien ce que tu veux dire, mais d'accord ».`);
one(3,26,`5 niveaux de conflit`,`Les incompatibilités ne sont plus comprises et l'émotion apparaît. Quel est le niveau de conflit ?`,
 [`Le désaccord`,`Le malentendu`,`La discorde`,`La divergence`],0,
 `C'est le niveau 3, le désaccord : incompréhension et émotion. À la discorde (niveau 4), le dialogue devient impossible.`,
 `Le désaccord, c'est le moment où le ton monte : on ne se comprend plus et ça commence à piquer.`);
one(3,26,`5 niveaux de conflit`,`Le dialogue est devenu impossible et tout ce que fait l'autre est perçu comme désagréable. Quel est le niveau de conflit ?`,
 [`La discorde`,`Le désaccord`,`La polarisation`,`Le malentendu`],0,
 `C'est le niveau 4, la discorde. C'est aussi à partir de ce niveau que le médiateur devient indispensable.`,
 `À la discorde, même un « bonjour » de l'autre passe pour une provocation.`);
one(3,26,`5 niveaux de conflit`,`Les parties s'attaquent à la personne tout entière, sans plus aucune réflexion. Quel est le niveau de conflit ?`,
 [`La polarisation`,`La discorde`,`Le désaccord`,`La divergence`],0,
 `C'est le niveau 5, la polarisation, le plus grave : on n'attaque plus les idées mais la personne.`,
 `Polarisation : deux pôles opposés qui se repoussent. L'autre n'est plus un collègue avec qui on n'est pas d'accord, c'est un ennemi.`);
one(3,26,`5 niveaux de conflit`,`À partir de quel niveau de conflit un médiateur devient-il indispensable ?`,
 [`Le niveau 4, la discorde`,`Le niveau 3, le désaccord`,`Le niveau 5, la polarisation`,`Le niveau 2, le malentendu`],0,
 `Le cours indique un médiateur indispensable à partir du niveau 4, la discorde, car le dialogue direct est devenu impossible.`,
 `Tant qu'on peut encore se parler (niveaux 1 à 3), on règle entre soi ; quand on ne peut plus (niveau 4), il faut un tiers.`);
mul(3,26,`5 niveaux de conflit`,`À quels niveaux de conflit les incompatibilités sont-elles encore acceptées ?`,
 [`La divergence`,`Le malentendu`,`Le désaccord`,`La discorde`],[0,1],
 `À la divergence, les incompatibilités sont comprises et acceptées ; au malentendu, pas tout à fait comprises mais acceptées. Au désaccord, elles ne sont plus comprises et l'émotion s'en mêle.`,
 `Les deux premiers niveaux sont « sous contrôle » ; à partir du troisième, l'émotion prend la main.`);
one(3,26,`Conflit`,`Selon le cours, à quelle condition un conflit est-il positif ?`,
 [`Si les parties comprennent et acceptent le point de vue de l'autre`,`Si l'une des parties gagne clairement`,`S'il est évité le plus longtemps possible`,`Jamais : un conflit est toujours destructeur`],0,
 `Le conflit est une part naturelle de la vie d'équipe. Il est positif si les parties comprennent et acceptent le point de vue de l'autre : c'est la manière de le gérer qui le rend constructif ou destructif.`,
 `Un conflit bien géré, c'est un débat qui fait avancer ; mal géré, c'est une guerre qui fait reculer.`);
mul(3,27,`Thomas-Kilmann`,`Quelles attitudes font partie du modèle de Thomas-Kilmann ?`,
 [`La compétition`,`L'accommodation`,`Le compromis`,`L'évitement`,`Le laisser-faire`],[0,1,2,3],
 `Thomas-Kilmann décrit 5 attitudes : compétition, collaboration, évitement, accommodation, compromis. « Laisser-faire » est le style 1.1 de la grille de Blake et Mouton.`,
 `Thomas-Kilmann parle d'attitudes face au conflit ; Blake et Mouton parlent de styles de management. Le « laisser-faire » est un style.`);
one(3,27,`Thomas-Kilmann`,`Quels sont les deux axes du modèle de Thomas-Kilmann ?`,
 [`L'assertivité et la coopération`,`L'intérêt pour les relations humaines et l'intérêt pour les résultats`,`Le conditionnel et l'inconditionnel`,`L'émetteur et le récepteur`],0,
 `Le modèle de Thomas-Kilmann croise l'assertivité (axe vertical) et la coopération (axe horizontal). Relations humaines et résultats sont les axes de Blake et Mouton.`,
 `Assertivité : à quel point je défends mes intérêts. Coopération : à quel point je prends en compte ceux de l'autre.`);
one(3,27,`Thomas-Kilmann`,`Dans un conflit, l'un cherche à l'emporter à tout prix : résultat à somme nulle, bras de fer. Quelle attitude du modèle de Thomas-Kilmann est-ce ?`,
 [`La compétition`,`Le compromis`,`La collaboration`,`L'accommodation`],0,
 `C'est la compétition (aussi appelée domination) : rapport de force, besoins de l'autre ignorés, ce que l'un gagne l'autre le perd.`,
 `Somme nulle : comme une part de gâteau, si tu en prends plus, j'en ai moins.`);
one(3,27,`Thomas-Kilmann`,`Les deux parties trouvent une solution durable qui satisfait pleinement chacune d'elles. Quelle attitude du modèle de Thomas-Kilmann est-ce ?`,
 [`La collaboration`,`Le compromis`,`L'accommodation`,`L'évitement`],0,
 `La collaboration vise la satisfaction mutuelle et des solutions durables : tout le monde gagne. Le compromis, lui, laisse chacun un peu gagnant et un peu perdant.`,
 `Collaboration : on agrandit le gâteau pour que chacun ait sa part entière. Compromis : on coupe le gâteau en deux.`);
one(3,27,`Thomas-Kilmann`,`Chacun cède un peu ; chacun est un peu gagnant et un peu perdant. Quelle attitude du modèle de Thomas-Kilmann est-ce ?`,
 [`Le compromis`,`La collaboration`,`L'accommodation`,`La compétition`],0,
 `C'est le compromis, placé au centre du schéma. La collaboration, elle, cherche une solution où personne ne perd.`,
 `Le compromis est au milieu de tout : ni très assertif, ni très coopératif, un peu des deux.`);
one(3,27,`Thomas-Kilmann`,`Une personne satisfait l'autre au prix de ses propres besoins et cède sur le fond. Quelle attitude du modèle de Thomas-Kilmann est-ce ?`,
 [`L'accommodation`,`Le compromis`,`L'évitement`,`La collaboration`],0,
 `C'est l'accommodation : accepter, céder, sans vraie solution sur le fond. Dans le compromis, les deux cèdent ; ici, un seul cède.`,
 `Accommodation : « bon, d'accord, comme tu veux ». Le conflit s'arrête, mais le problème reste.`);
one(3,27,`Thomas-Kilmann`,`Une personne élude le problème parce qu'elle craint la confrontation. Quelle attitude du modèle de Thomas-Kilmann est-ce ?`,
 [`L'évitement`,`L'accommodation`,`Le compromis`,`La compétition`],0,
 `C'est l'évitement, ou fuite : on élude le problème, on reste neutre, par crainte de la confrontation.`,
 `L'évitement, c'est mettre la poussière sous le tapis : le conflit n'est pas réglé, il est caché.`);
one(3,27,`Thomas-Kilmann`,`Sur le schéma de Thomas-Kilmann, quelle attitude combine une forte assertivité et une forte coopération ?`,
 [`La collaboration`,`La compétition`,`L'accommodation`,`Le compromis`],0,
 `La collaboration est en haut à droite : forte assertivité et forte coopération. La compétition est en haut à gauche (assertive mais peu coopérative), l'accommodation en bas à droite.`,
 `Collaborer, c'est défendre fort ses intérêts ET ceux de l'autre : c'est le seul coin « gagnant-gagnant ».`);
one(3,27,`Thomas-Kilmann`,`Sur le schéma de Thomas-Kilmann, quelle attitude a une forte assertivité mais une faible coopération ?`,
 [`La compétition`,`La collaboration`,`L'évitement`,`L'accommodation`],0,
 `La compétition est en haut (assertivité forte) et à gauche (coopération faible) : je défends mes intérêts sans me soucier de ceux de l'autre.`,
 `Haut = je pousse pour moi ; gauche = je ne pense pas à l'autre. Haut-gauche = compétition.`);
mul(3,27,`Thomas-Kilmann`,`Sur le schéma de Thomas-Kilmann, quelles attitudes ont une forte coopération ?`,
 [`La collaboration`,`L'accommodation`,`La compétition`,`L'évitement`],[0,1],
 `La coopération est l'axe horizontal (forte à droite) : collaboration en haut à droite, accommodation en bas à droite. Compétition et évitement sont à gauche.`,
 `Côté droit du schéma, on pense à l'autre : en le respectant tout en se respectant (collaboration) ou en s'effaçant (accommodation).`);
mul(3,27,`Thomas-Kilmann`,`Quelles associations attitude → description sont exactes ?`,
 [`Compétition → résultat à somme nulle`,`Accommodation → pas de solution sur le fond`,`Évitement → élude le problème`,`Collaboration → chacun cède un peu`],[0,1,2],
 `Les trois premières associations sont exactes. « Chacun cède un peu », c'est le compromis ; la collaboration vise la satisfaction mutuelle et des solutions durables.`,
 `Ne confonds pas « tout le monde gagne » (collaboration) et « tout le monde cède un peu » (compromis).`);
one(3,28,`Blake et Mouton`,`Quels sont les deux axes de la grille de Blake et Mouton ?`,
 [`L'intérêt pour les relations humaines et l'intérêt pour les résultats et la production`,`L'assertivité et la coopération`,`Les strokes positifs et négatifs`,`Les canaux visuel et auditif`],0,
 `Blake et Mouton croisent l'intérêt pour les relations humaines (axe vertical) et l'intérêt pour les résultats et la production (axe horizontal). Assertivité et coopération sont les axes de Thomas-Kilmann.`,
 `Blake et Mouton se demandent : ce manager pense-t-il plutôt aux gens ou plutôt aux résultats ?`);
one(3,28,`Blake et Mouton`,`Dans la grille de Blake et Mouton, que désigne le style 9.9 ?`,
 [`Le style démocratique, « intégrateur », qui prend en compte relation et objectifs`,`Le style autoritaire, centré sur la tâche`,`Le laisser-faire`,`Le style intermédiaire, fait de compromis et de négociation`],0,
 `9.9 est le maximum sur les deux axes : style démocratique, intégrateur, qui prend en compte relation et objectifs.`,
 `9 sur 9 partout : le manager idéal qui ne sacrifie ni les gens ni les résultats.`);
one(3,28,`Blake et Mouton`,`Dans la grille de Blake et Mouton, que désigne le style 9.1 ?`,
 [`Le style autoritaire, centré sur la tâche, qui fait passer les objectifs avant la relation`,`Le style participatif social, qui fait passer la relation avant les objectifs`,`Le style démocratique, intégrateur`,`Le laisser-faire`],0,
 `9.1 : 9 pour les résultats, 1 pour les relations. C'est le style autoritaire, centré tâche. Son opposé, 1.9, est le participatif social.`,
 `Le premier chiffre est l'intérêt pour les résultats, le second l'intérêt pour les gens : 9.1, tout pour la tâche, presque rien pour les personnes.`);
one(3,28,`Blake et Mouton`,`Dans la grille de Blake et Mouton, quel style fait passer la relation avant les objectifs ?`,
 [`Le style 1.9, participatif social`,`Le style 9.1, autoritaire`,`Le style 5.5, intermédiaire`,`Le style 1.1, laisser-faire`],0,
 `1.9 : peu d'intérêt pour les résultats (1), beaucoup pour les relations (9). C'est le style participatif social.`,
 `1.9, c'est l'ambiance avant tout : tout le monde est content, même si le travail n'avance pas.`);
one(3,28,`Blake et Mouton`,`Dans la grille de Blake et Mouton, que désigne le style 1.1 ?`,
 [`Le laisser-faire, avec peu d'intérêt pour les relations comme pour les résultats`,`Le style démocratique`,`Le style autoritaire`,`Le compromis`],0,
 `1.1 est le minimum sur les deux axes : le laisser-faire. Le compromis correspond au style 5.5.`,
 `1.1 : le manager absent, qui ne s'occupe ni des gens ni du travail.`);
one(3,28,`Blake et Mouton`,`Dans la grille de Blake et Mouton, que désigne le style 5.5 ?`,
 [`Le style intermédiaire, fait de compromis et de négociation`,`Le laisser-faire`,`Le style démocratique, intégrateur`,`Le style participatif social`],0,
 `5.5 est au centre de la grille : style intermédiaire, compromis et négociation.`,
 `5.5 est à mi-chemin sur les deux axes, comme le compromis est au centre du schéma de Thomas-Kilmann.`);
mul(3,28,`Blake et Mouton`,`Dans la grille de Blake et Mouton, quels styles accordent un fort intérêt aux résultats ?`,
 [`Le style 9.1, autoritaire`,`Le style 9.9, démocratique`,`Le style 1.9, participatif social`,`Le style 1.1, laisser-faire`],[0,1],
 `Le premier chiffre mesure l'intérêt pour les résultats : il vaut 9 pour les styles 9.1 et 9.9. Les styles 1.9 et 1.1 ont un intérêt faible (1) pour les résultats.`,
 `Lis le premier chiffre pour les résultats, le second pour les relations : 9.x = les résultats comptent beaucoup.`);
mul(3,28,`Blake et Mouton`,`Lesquels sont des styles de la grille de Blake et Mouton ?`,
 [`1.1 laisser-faire`,`9.9 démocratique`,`5.5 intermédiaire`,`La compétition`,`L'évitement`],[0,1,2],
 `Les styles notés x.y appartiennent à Blake et Mouton. Compétition et évitement sont des attitudes du modèle de Thomas-Kilmann.`,
 `S'il y a des chiffres, c'est Blake et Mouton ; s'il y a des attitudes face au conflit, c'est Thomas-Kilmann.`);
mul(3,28,`Effets du conflit`,`Quelles conséquences positives d'un conflit le cours cite-t-il ?`,
 [`La créativité et l'ouverture du champ des possibles`,`Une meilleure solution et des rôles clarifiés`,`La cohésion et la confiance`,`Le blocage de l'information`],[0,1,2],
 `Conséquences positives : créativité, meilleure solution, rôles clarifiés, cohésion et confiance. L'information bloquée fait partie des conséquences négatives.`,
 `Un conflit bien mené oblige à confronter les idées : on en sort souvent avec une meilleure solution qu'au départ.`);
mul(3,28,`Effets du conflit`,`Quelles conséquences négatives d'un conflit le cours cite-t-il ?`,
 [`Un engagement en baisse et de l'information bloquée`,`Un climat négatif et de la défiance`,`Des comportements contre-productifs et de l'absentéisme`,`Des rôles clarifiés`],[0,1,2],
 `Conséquences négatives : engagement en baisse, information bloquée, climat négatif, défiance, comportements contre-productifs, absentéisme. Des rôles clarifiés sont une conséquence positive.`,
 `Un conflit mal géré se voit dans les chiffres : moins d'engagement, plus d'absences.`);
one(3,29,`Strokes`,`De quel courant vient le concept de « strokes » ?`,
 [`De l'analyse transactionnelle d'Éric Berne, dans les années 1950`,`De la PNL de Bandler et Grinder, dans les années 1970`,`De la Process Communication de Taibi Kahler`,`De l'intelligence émotionnelle de Goleman`],0,
 `Les strokes sont un concept de l'analyse transactionnelle, créée par Éric Berne dans les années 1950. La PNL date des années 1970 et Kahler a créé les drivers.`,
 `Berne, années 1950 : analyse transactionnelle, strokes. La PNL arrive vingt ans plus tard.`);
one(3,29,`Strokes`,`Selon le cours, qu'est-ce qu'un stroke ?`,
 [`Un signe de reconnaissance qui prouve à la personne qu'elle existe`,`Un message contraignant intériorisé dès l'enfance`,`Un réflexe d'écoute`,`Un biais cognitif`],0,
 `Un stroke est un signe de reconnaissance qui prouve à la personne qu'elle existe ; c'est une source d'énergie indispensable. Le message contraignant intériorisé dans l'enfance, c'est le driver.`,
 `Un « bonjour » avec le prénom, un merci, un regard : autant de petits signes qui disent « je te vois ».`);
one(3,29,`Strokes`,`Un stroke positif est appelé « caresse ». Comment le cours appelle-t-il un stroke négatif ?`,
 [`Un coup`,`Une blessure`,`Un driver`,`Un recadrage`],0,
 `Positif = caresse, qui donne énergie et enthousiasme ; négatif = coup, qui apporte dix fois moins d'énergie et du stress.`,
 `Caresse et coup : deux images physiques pour des signes qui touchent la personne.`);
one(3,29,`Strokes`,`Sur quoi porte un stroke inconditionnel ?`,
 [`Sur la personne elle-même`,`Sur une circonstance précise`,`Sur un comportement particulier`,`Sur un résultat chiffré`],0,
 `L'inconditionnel porte sur la personne ; le conditionnel, plus faible, est lié à une circonstance ou à un comportement.`,
 `Inconditionnel = sans condition : « tu es… ». Conditionnel = à condition de : « ce que tu as fait est… ».`);
mul(3,29,`Strokes`,`Quelles qualités le cours attend-il d'un bon stroke ?`,
 [`Sincère`,`Dosé`,`Personnalisé`,`Argumenté`,`Systématique`],[0,1,2,3],
 `Un bon stroke est sincère, justifié, dosé, argumenté et personnalisé. Systématique, il perdrait sa sincérité et sa valeur.`,
 `Un compliment distribué à tout le monde, tout le temps, ne vaut plus rien : c'est la rareté et la justesse qui lui donnent du prix.`);
mul(3,29,`Strokes`,`Quelles affirmations sur les strokes sont exactes ?`,
 [`Un stroke conditionnel est plus faible qu'un stroke inconditionnel`,`Un stroke négatif apporte dix fois moins d'énergie qu'un positif`,`Les strokes s'échangent par la parole, le non-verbal et les sens`,`Les strokes ont été définis par Taibi Kahler`,`Un stroke conditionnel porte sur la personne`],[0,1,2],
 `Les trois premières affirmations reprennent le cours. Les strokes viennent de l'analyse transactionnelle d'Éric Berne (Kahler a défini les drivers), et c'est l'inconditionnel qui porte sur la personne.`,
 `Strokes = Berne ; drivers = Kahler. Les deux viennent de l'analyse transactionnelle, d'où la confusion fréquente.`);
mul(3,29,`Steiner`,`Quels sont les 3 besoins de reconnaissance décrits par Claude Steiner ?`,
 [`Exister`,`Être reconnu`,`Être valorisé`,`Être obéi`],[0,1,2],
 `Steiner décrit trois besoins : exister (être vu, salué), être reconnu (feed-backs, gratitude), être valorisé (se sentir utile et compétent).`,
 `Trois marches : on me voit (exister), on me remercie (reconnu), on compte sur moi (valorisé).`);
one(3,29,`Steiner`,`Selon Claude Steiner, « se sentir utile et compétent » correspond à quel besoin de reconnaissance ?`,
 [`Être valorisé`,`Exister`,`Être reconnu`,`Être écouté`],0,
 `Se sentir utile et compétent, c'est le besoin d'être valorisé. Exister, c'est être vu et salué ; être reconnu, c'est recevoir des feed-backs et de la gratitude.`,
 `Valorisé = on me donne de la valeur, on sait que mon travail sert.`);
one(3,29,`Steiner`,`Selon Claude Steiner, « être vu, être salué » correspond à quel besoin de reconnaissance ?`,
 [`Exister`,`Être valorisé`,`Être reconnu`,`Être aimé`],0,
 `Être vu et salué, c'est le besoin le plus basique : exister. Viennent ensuite être reconnu, puis être valorisé.`,
 `Le collègue qu'on croise sans lui dire bonjour se sent transparent : son besoin d'exister n'est pas satisfait.`);
mul(3,29,`Strokes`,`Selon le cours, que peut-on faire avec les signes de reconnaissance ?`,
 [`En donner`,`S'en donner`,`En demander`,`En recevoir, en les acceptant ou en les rejetant`,`En imposer`],[0,1,2,3],
 `Le cours cite quatre gestes : en donner, s'en donner, en demander, en recevoir (en les acceptant ou en les rejetant).`,
 `Donner, se donner, demander, recevoir : les signes de reconnaissance circulent dans tous les sens, y compris vers soi-même.`);
one(3,30,`Typologie des strokes`,`« Bon travail sur ce dossier » : de quel type de stroke s'agit-il ?`,
 [`Positif conditionnel`,`Positif inconditionnel`,`Négatif conditionnel`,`Non verbal`],0,
 `C'est un stroke positif (il valorise) et conditionnel (il porte sur un travail précis, pas sur la personne). Son effet : valoriser un comportement.`,
 `Le stroke parle du dossier, pas de toi : il est donc conditionnel.`);
one(3,30,`Typologie des strokes`,`« Je suis content de travailler avec toi » : de quel type de stroke s'agit-il ?`,
 [`Positif inconditionnel`,`Positif conditionnel`,`Négatif inconditionnel`,`Différé`],0,
 `C'est un stroke positif inconditionnel : il ne dépend d'aucun travail précis, il valorise la personne elle-même.`,
 `Ici, on parle de « toi » en général, pas de ce que tu as fait : c'est inconditionnel.`);
one(3,30,`Typologie des strokes`,`« Tu t'es trompé sur la formule » : de quel type de stroke s'agit-il ?`,
 [`Négatif conditionnel`,`Négatif inconditionnel`,`Positif conditionnel`,`Absent`],0,
 `C'est un stroke négatif conditionnel : il critique une erreur précise. Le cours précise qu'il est utile s'il reste factuel et respectueux.`,
 `On critique la formule, pas la personne : c'est une critique constructive possible.`);
one(3,30,`Typologie des strokes`,`« Tu es incompétent » : de quel type de stroke s'agit-il ?`,
 [`Négatif inconditionnel`,`Négatif conditionnel`,`Positif inconditionnel`,`Non verbal`],0,
 `C'est un stroke négatif inconditionnel : il attaque la personne entière. Le cours le qualifie de destructeur.`,
 `« Tu t'es trompé » vise une erreur qu'on peut corriger ; « tu es incompétent » vise la personne, qui ne peut rien y faire.`);
one(3,30,`Typologie des strokes`,`Un collaborateur envoie un message à son manager et ne reçoit jamais de réponse. De quel type de stroke s'agit-il ?`,
 [`Un stroke différé ou absent, source de frustration et de démotivation`,`Un stroke négatif conditionnel`,`Un stroke neutre, sans effet`,`Un stroke non verbal qui confirme l'accord`],0,
 `L'absence de réponse est un stroke différé ou absent ; le cours en souligne l'effet : frustration et démotivation. Ne rien dire n'est donc pas neutre.`,
 `Le silence est aussi un message : il dit « tu ne comptes pas assez pour que je te réponde ».`);
one(3,30,`Typologie des strokes`,`Un sourire, un regard ou un hochement de tête : de quel type de stroke s'agit-il ?`,
 [`Un stroke non verbal, qui confirme l'écoute ou l'accord`,`Un stroke différé`,`Un stroke négatif conditionnel`,`Un stroke positif inconditionnel verbal`],0,
 `Ce sont des strokes non verbaux : ils confirment l'écoute ou l'accord sans un mot.`,
 `Pas besoin de parler pour reconnaître quelqu'un : un hochement de tête pendant qu'il parle suffit à lui montrer qu'on l'écoute.`);
one(3,30,`Typologie des strokes`,`En réunion, quelle formulation le cours recommande-t-il pour faire le point sur un livrable en retard ?`,
 [`« Où en est-on ? Je sais que ce n'est pas simple. »`,`« Vous n'avez encore rien livré ? »`,`Ne rien dire pour ne pas froisser`,`« Comme d'habitude, rien n'avance. »`],0,
 `Le cours oppose « Où en est-on ? Je sais que ce n'est pas simple » à « Vous n'avez encore rien livré ? ». La première question obtient l'information tout en reconnaissant la difficulté.`,
 `Même question de fond, effet opposé : l'une ouvre le dialogue, l'autre met l'équipe sur la défensive.`);
mul(3,30,`Typologie des strokes`,`Lesquelles de ces phrases sont des strokes conditionnels ?`,
 [`« Bon travail sur ce dossier. »`,`« Tu t'es trompé sur la formule. »`,`« Je suis content de travailler avec toi. »`,`« Tu es incompétent. »`],[0,1],
 `Les strokes conditionnels portent sur un comportement ou une circonstance : le dossier, la formule. Les deux autres phrases portent sur la personne : elles sont inconditionnelles.`,
 `Cherche l'objet : un dossier, une formule → conditionnel ; « toi » tout entier → inconditionnel.`);
one(3,31,`Drivers`,`Qui a défini les drivers ?`,
 [`Taibi Kahler`,`Éric Berne`,`Claude Steiner`,`Elias Porter`],0,
 `Les drivers ont été définis par le psychologue Taibi Kahler, dans le cadre de l'analyse transactionnelle. Berne a créé l'analyse transactionnelle, Steiner les besoins de reconnaissance, Porter les réflexes d'écoute.`,
 `Kahler et drivers : deux mots qui « conduisent ». Les drivers nous poussent à agir d'une certaine façon.`);
one(3,31,`Drivers`,`Quelle distinction le modèle « Process Communication » de Kahler a-t-il reçue ?`,
 [`Le prix Éric Berne, en 1977`,`Le prix Nobel, en 1977`,`Un prix de Harvard, en 2000`,`Le prix Goleman, en 1995`],0,
 `Le modèle Process Communication de Kahler a reçu le prix Éric Berne en 1977, ce qui le rattache à l'analyse transactionnelle.`,
 `Kahler a été récompensé par le prix qui porte le nom du fondateur de son courant : Berne.`);
one(3,31,`Drivers`,`Qui a été le premier utilisateur du modèle de Kahler ?`,
 [`La NASA, pour choisir des astronautes capables de s'entendre en milieu confiné`,`L'armée américaine, pour recruter ses officiers`,`Les grands orchestres américains, pour leurs auditions`,`Harvard, pour sélectionner ses étudiants`],0,
 `Le premier utilisateur a été la NASA, qui cherchait des astronautes capables de s'entendre confinés. Les orchestres apparaissent dans l'étude sur les biais (séance 4).`,
 `Dans une capsule spatiale, on ne peut pas claquer la porte : il faut des profils compatibles, d'où l'intérêt de la NASA.`);
mul(3,31,`Drivers`,`Lesquels font partie des 5 drivers de Kahler ?`,
 [`Sois parfait`,`Sois fort`,`Dépêche-toi`,`Fais plaisir`,`Sois créatif`],[0,1,2,3],
 `Les 5 drivers sont : sois parfait, sois fort, dépêche-toi, fais des efforts, fais plaisir. « Sois créatif » n'en fait pas partie.`,
 `Ce sont cinq injonctions entendues enfant : deux en « sois », deux en « fais », et un « dépêche-toi ».`);
mul(3,31,`Drivers`,`Quelles affirmations sur les drivers sont exactes ?`,
 [`Ils sont intériorisés dès l'enfance`,`Ils s'activent sous stress ou en mode automatique`,`Les repérer chez soi et chez les autres améliore la communication`,`Ils relèvent de la PNL`,`Chacun en possède en général cinq principaux`],[0,1,2],
 `Les drivers sont intériorisés dès l'enfance, s'activent sous stress, et les repérer améliore la communication et la bienveillance. Ils viennent de l'analyse transactionnelle, pas de la PNL, et chacun en a en général deux principaux.`,
 `Un driver, c'est un pilote automatique : il prend les commandes quand on est stressé.`);
one(3,31,`Drivers`,`Combien de drivers principaux une personne a-t-elle en général ?`,
 [`Deux, qui s'activent sous stress ou en mode automatique`,`Un seul, qui ne change jamais`,`Les cinq, à parts égales`,`Aucun, une fois adulte`],0,
 `Selon le cours, chacun en a en général deux principaux, qui s'activent sous stress ou en mode automatique.`,
 `On a tous les cinq en nous, mais deux parlent plus fort que les autres.`);
one(3,32,`Drivers : profils`,`« Tu aurais dû mieux faire » : à quel driver correspond ce message intériorisé ?`,
 [`Sois parfait`,`Fais des efforts`,`Dépêche-toi`,`Sois fort`],0,
 `C'est le message du « Sois parfait » : perfectionniste, très exigeant envers soi et les autres, il délègue mal et a peur du jugement.`,
 `« Mieux faire » : jamais assez bien, donc toujours viser la perfection.`);
one(3,32,`Drivers : profils`,`« Un garçon, ça ne pleure pas » : à quel driver correspond ce message intériorisé ?`,
 [`Sois fort`,`Sois parfait`,`Fais plaisir`,`Fais des efforts`],0,
 `C'est le message du « Sois fort » : autonome, il trouve seul les solutions, cache ses émotions et ne sait pas se faire aider.`,
 `Ne pas pleurer, c'est ne pas montrer d'émotion : être fort.`);
one(3,32,`Drivers : profils`,`« Arrête de traîner », « tu es trop lent » : à quel driver correspondent ces messages intériorisés ?`,
 [`Dépêche-toi`,`Fais des efforts`,`Sois parfait`,`Sois fort`],0,
 `Ce sont les messages du « Dépêche-toi » : stimulé par la pression, il assimile la rapidité à la réussite.`,
 `Le nom du driver dit tout : on lui a toujours dit de se dépêcher.`);
one(3,32,`Drivers : profils`,`« Toute réussite passe par des choses pénibles » : à quel driver correspond ce message intériorisé ?`,
 [`Fais des efforts`,`Sois fort`,`Dépêche-toi`,`Sois parfait`],0,
 `C'est le message du « Fais des efforts » : attaché à l'énergie dépensée plus qu'au résultat. Le « Sois parfait », lui, vise le résultat irréprochable.`,
 `Pour lui, ce qui est facile ne compte pas : il faut avoir souffert pour mériter.`);
one(3,32,`Drivers : profils`,`« Il faut être gentil », « ne sois pas égoïste » : à quel driver correspondent ces messages intériorisés ?`,
 [`Fais plaisir`,`Sois fort`,`Fais des efforts`,`Sois parfait`],0,
 `Ce sont les messages du « Fais plaisir » : il veut satisfaire les autres à tout prix.`,
 `Être gentil, ne pas penser à soi : son objectif est que tout le monde soit content de lui.`);
one(3,32,`Drivers : profils`,`Un collègue est calme sous pression, rationnel et responsable, mais il cache ses émotions et ne demande jamais d'aide. Quel driver le cours associe-t-il à ce profil ?`,
 [`Sois fort`,`Sois parfait`,`Dépêche-toi`,`Fais plaisir`],0,
 `Calme sous pression, rationnel, responsable : ce sont les points forts du « Sois fort », dont le revers est de cacher ses émotions et de ne pas savoir se faire aider.`,
 `Le « Sois fort » est le roc de l'équipe, mais un roc ne demande jamais de l'aide.`);
one(3,32,`Drivers : profils`,`Une collègue est compétente, rigoureuse, méthodique et ponctuelle, mais délègue mal et craint le jugement. Quel driver le cours associe-t-il à ce profil ?`,
 [`Sois parfait`,`Fais des efforts`,`Sois fort`,`Dépêche-toi`],0,
 `Compétent, rigoureux, méthodique, ponctuel : ce sont les points forts du « Sois parfait ». Il délègue mal parce que personne ne fera aussi bien que lui.`,
 `Le « Sois parfait » refait le travail des autres plutôt que d'accepter une version imparfaite.`);
one(3,32,`Drivers : profils`,`Un collègue est vif, fonceur et prend ses décisions rapidement. Quel driver le cours associe-t-il à ces points forts ?`,
 [`Dépêche-toi`,`Sois fort`,`Fais des efforts`,`Fais plaisir`],0,
 `Vif, fonceur, décisions rapides : ce sont les points forts du « Dépêche-toi ».`,
 `Le « Dépêche-toi » est en avance sur tout le monde, quitte à partir avant d'avoir tout vérifié.`);
one(3,32,`Drivers : profils`,`Une collègue relève les défis, persévère et se montre productive. Quel driver le cours associe-t-il à ces points forts ?`,
 [`Fais des efforts`,`Dépêche-toi`,`Sois parfait`,`Fais plaisir`],0,
 `Relève des défis, persévérant, productif : ce sont les points forts du « Fais des efforts ».`,
 `Le « Fais des efforts » ne lâche jamais : plus c'est dur, plus il s'accroche.`);
one(3,32,`Drivers : profils`,`Un collègue est empathique, serviable et convivial. Quel driver le cours associe-t-il à ces points forts ?`,
 [`Fais plaisir`,`Sois fort`,`Sois parfait`,`Dépêche-toi`],0,
 `Empathique, serviable, convivial : ce sont les points forts du « Fais plaisir ».`,
 `Le « Fais plaisir » est celui qui apporte les croissants et pense aux anniversaires.`);
one(3,33,`Drivers : interagir`,`Quel driver est agacé qu'on le prenne en défaut, et apprécie un retour sur la qualité de son travail ?`,
 [`Sois parfait`,`Sois fort`,`Fais plaisir`,`Dépêche-toi`],0,
 `Le « Sois parfait » déteste être pris en défaut et aime un feed-back sur sa compétence et la qualité de son travail.`,
 `Pour lui, être pris en défaut, c'est la preuve qu'il n'est pas parfait : le pire des reproches.`);
one(3,33,`Drivers : interagir`,`Quel driver est agacé par les émotions, les compliments et l'open space, et apprécie qu'on respecte son goût de la solitude ?`,
 [`Sois fort`,`Fais plaisir`,`Sois parfait`,`Fais des efforts`],0,
 `C'est le « Sois fort » : il n'aime ni les sentiments, ni les compliments, ni l'open space, et apprécie qu'on respecte son besoin de solitude.`,
 `Le « Sois fort » cache ses émotions : un compliment devant tout le monde le met mal à l'aise.`);
one(3,33,`Drivers : interagir`,`Quel driver est agacé qu'on le dise mou et déteste les repas et les réunions qui s'éternisent ?`,
 [`Dépêche-toi`,`Sois fort`,`Fais des efforts`,`Sois parfait`],0,
 `C'est le « Dépêche-toi » : il apprécie la vitesse de décision et la parole directe, et déteste la lenteur.`,
 `Une réunion de deux heures sans décision, c'est sa pire journée.`);
one(3,33,`Drivers : interagir`,`Quel driver est agacé par la froideur et les tensions dans le groupe ?`,
 [`Fais plaisir`,`Sois fort`,`Dépêche-toi`,`Sois parfait`],0,
 `C'est le « Fais plaisir » : il aime la bonne entente et les compliments sur sa sympathie, et souffre des tensions.`,
 `Il veut que tout le monde soit content : une ambiance tendue lui est insupportable.`);
one(3,33,`Drivers : interagir`,`Quel driver est agacé par les plaintes, les feed-backs et les discussions sur le bonheur ?`,
 [`Fais des efforts`,`Sois parfait`,`Fais plaisir`,`Dépêche-toi`],0,
 `C'est le « Fais des efforts » : il aime ceux qui ne craignent pas la fatigue et les discussions de groupe, et n'aime ni les plaintes ni qu'on parle de bonheur.`,
 `Pour lui, la vie est un effort : se plaindre ou parler de bonheur, c'est presque de la paresse.`);
mul(3,33,`Drivers : interagir`,`Quels drivers sont agacés par les compliments ou les feed-backs ?`,
 [`Sois fort`,`Fais des efforts`,`Fais plaisir`,`Sois parfait`],[0,1],
 `Le « Sois fort » n'aime pas les compliments et le « Fais des efforts » n'aime pas les feed-backs. À l'inverse, le « Fais plaisir » apprécie les compliments sur sa sympathie et le « Sois parfait » un feed-back sur sa compétence.`,
 `Un même compliment fait plaisir à l'un et gêne l'autre : d'où l'intérêt de connaître le driver de son interlocuteur.`);
one(3,33,`Drivers : interagir`,`Quel driver a du mal à dire non, se surcharge, manque d'autorité et se trouve désavantagé en négociation ?`,
 [`Fais plaisir`,`Sois fort`,`Fais des efforts`,`Dépêche-toi`],0,
 `Ce sont les contraintes du « Fais plaisir » : comme il veut satisfaire tout le monde, il accepte tout et cède facilement.`,
 `Dire non, c'est risquer de déplaire : exactement ce que le « Fais plaisir » veut éviter.`);
one(3,33,`Drivers : interagir`,`Quel driver est impatient, procrastine puis se précipite, et met la pression aux autres ?`,
 [`Dépêche-toi`,`Fais des efforts`,`Sois parfait`,`Fais plaisir`],0,
 `Ce sont les contraintes du « Dépêche-toi » : il a besoin d'urgence pour se mettre en route, puis il fonce et presse tout le monde.`,
 `Il attend la dernière minute parce que c'est la pression qui le fait démarrer.`);
one(3,33,`Drivers : interagir`,`Quel driver se noie dans les détails et complique ce qui est facile ?`,
 [`Fais des efforts`,`Sois parfait`,`Sois fort`,`Dépêche-toi`],0,
 `Se noyer dans les détails et compliquer ce qui est facile : ce sont les contraintes du « Fais des efforts ». Le « Sois parfait », lui, est maniaque et perd de vue l'essentiel.`,
 `Si c'est simple, ça ne compte pas pour lui : il rend la tâche difficile pour qu'elle mérite l'effort.`);
one(3,33,`Drivers : interagir`,`Quel driver prend des risques excessifs, informe peu et travaille mal en équipe ?`,
 [`Sois fort`,`Dépêche-toi`,`Fais plaisir`,`Sois parfait`],0,
 `Ce sont les contraintes du « Sois fort » : il fait tout seul, donc il partage peu l'information et coopère mal.`,
 `Celui qui ne demande jamais d'aide finit par travailler dans son coin, sans prévenir personne.`);
one(3,33,`Drivers : interagir`,`Quel driver est maniaque, rigide, perd de vue l'essentiel et passe trop de temps sur une tâche ?`,
 [`Sois parfait`,`Fais des efforts`,`Dépêche-toi`,`Sois fort`],0,
 `Ce sont les contraintes du « Sois parfait » : à force de vouloir tout parfait, il bloque sur des détails sans importance.`,
 `Le mieux est l'ennemi du bien : il peaufine la police du rapport pendant que l'échéance approche.`);

/* ================= SÉANCE 4 · BIAIS COGNITIFS (diapos 34-39) ================= */
one(4,34,`Définition`,`Comment le cours définit-il un biais cognitif ?`,
 [`Un mécanisme de pensée, le plus souvent inconscient, qui altère le jugement`,`Une erreur de raisonnement commise volontairement pour convaincre`,`Un trouble psychologique rare qui nécessite un traitement`,`Une méthode de décision rationnelle fondée sur les statistiques`],0,
 `Un biais cognitif est un mécanisme de pensée, le plus souvent inconscient, qui altère le jugement : un schéma trompeur et faussement logique, une déviation systématique de la pensée rationnelle. Il n'est ni volontaire ni pathologique : tout le monde en a.`,
 `Un biais, c'est comme une illusion d'optique pour le raisonnement : même quand on sait qu'elle existe, on continue à la voir.`);
mul(4,34,`Définition`,`Quelles affirmations sur les biais cognitifs sont conformes au cours ?`,
 [`Ce sont des déviations systématiques de la pensée rationnelle`,`Ce sont des schémas de pensée trompeurs et faussement logiques`,`Ils permettent de juger ou de décider vite`,`Ils sont toujours conscients`],[0,1,2],
 `Le cours décrit les biais comme des déviations systématiques, des schémas trompeurs et faussement logiques, qui permettent de décider vite. Ils sont le plus souvent inconscients, pas conscients.`,
 `C'est leur force et leur piège : ils nous font gagner du temps sans qu'on s'en rende compte, et c'est pour ça qu'on ne les voit pas.`);
one(4,34,`Pourquoi`,`Selon le cours, combien d'informations par seconde le cerveau traite-t-il environ ?`,
 [`11 millions`,`11 000`,`200`,`Un milliard`],0,
 `Le cerveau traite environ 11 millions d'informations par seconde, mais la conscience n'en retient qu'une petite partie : il doit donc simplifier, et ces raccourcis sont les biais.`,
 `Onze millions d'informations à la seconde : impossible de tout analyser, alors le cerveau trie à toute vitesse, et parfois il trie mal.`);
one(4,34,`Pourquoi`,`Selon le cours, combien de biais cognitifs ont été recensés ?`,
 [`Environ 200`,`13`,`Une vingtaine`,`Environ 2 000`],0,
 `Le cours indique qu'environ 200 biais ont été recensés. Il n'en détaille que 13 (6 fréquents et 7 autres).`,
 `200 recensés, 13 au programme : le cours a fait le tri pour toi.`);
mul(4,34,`Pourquoi`,`Selon le cours, que fait le cerveau face à l'afflux d'informations, ce qui crée les biais ?`,
 [`Il simplifie`,`Il généralise`,`Il filtre`,`Il enregistre tout de façon consciente`],[0,1,2],
 `Le cerveau simplifie, généralise et filtre : ces raccourcis sont les biais. Il ne peut justement pas tout enregistrer consciemment.`,
 `Simplifier, généraliser, filtrer : c'est le travail d'un résumé. Un résumé fait gagner du temps, mais il perd des nuances.`);
one(4,34,`Pourquoi`,`Selon le cours, dans quelles situations les biais pèsent-ils le plus ?`,
 [`Quand l'information est abondante ou le temps limité`,`Quand on est seul et reposé`,`Uniquement chez les personnes peu diplômées`,`Quand on dispose de statistiques fiables`],0,
 `Les biais pèsent surtout quand l'information est abondante ou que le temps manque, car le cerveau doit alors prendre encore plus de raccourcis.`,
 `Pressé et submergé, on décide « au feeling » : c'est le terrain idéal pour les biais.`);
one(4,34,`Pourquoi`,`Que veut illustrer la citation « Nous ne voyons pas le monde tel qu'il est, mais tel que nous sommes » ?`,
 [`Nous croyons percevoir la réalité, alors que notre cerveau l'interprète`,`Le monde change selon notre humeur du jour`,`Il faut se fier à sa première impression`,`La perception humaine est toujours fiable`],0,
 `Le cours commente : nous croyons percevoir la réalité, mais notre cerveau l'interprète. C'est l'idée même du biais cognitif.`,
 `Chacun porte des lunettes teintées sans le savoir : on croit voir la couleur du monde, on voit celle de ses verres.`);
one(4,35,`6 biais fréquents`,`Quel biais consiste à ne retenir que les informations qui confirment nos opinions ?`,
 [`Le biais de confirmation`,`L'ancrage`,`L'effet de halo`,`Le biais de disponibilité`],0,
 `C'est le biais de confirmation. Pour s'en protéger, le cours conseille de chercher un argument qui contredit son idée.`,
 `On cherche sur Internet « pourquoi j'ai raison », jamais « pourquoi j'ai tort ».`);
one(4,35,`6 biais fréquents`,`Quel biais fait qu'une seule impression contamine tout le jugement sur une personne ?`,
 [`L'effet de halo`,`Le biais de confirmation`,`Le biais de projection`,`L'ancrage`],0,
 `C'est l'effet de halo : un trait (positif ou négatif) déteint sur toute l'évaluation. Parade : noter chaque critère séparément, avec une grille.`,
 `Comme le halo d'une lampe qui éclaire tout autour : un seul trait illumine (ou assombrit) tout le reste.`);
one(4,35,`6 biais fréquents`,`Quel biais consiste à juger d'après l'information la plus récente ou la plus marquante ?`,
 [`Le biais de disponibilité`,`L'ancrage`,`Le biais rétrospectif`,`Le biais de confirmation`],0,
 `C'est le biais de disponibilité : ce qui vient facilement à l'esprit paraît plus fréquent qu'en réalité. Parade : chercher des chiffres et des statistiques.`,
 `Après un reportage sur un accident d'avion, on a peur de prendre l'avion, alors que la voiture est bien plus risquée.`);
one(4,35,`6 biais fréquents`,`Quel biais fait que les personnes les moins compétentes surestiment leurs capacités ?`,
 [`L'effet Dunning-Kruger`,`Le biais d'optimisme`,`L'effet IKEA`,`L'effet de halo`],0,
 `C'est l'effet Dunning-Kruger. Parade : demander des retours extérieurs et se comparer à de vrais experts. L'optimisme porte sur les chances de réussite, pas sur la compétence.`,
 `Moins on connaît un sujet, moins on voit tout ce qu'on ignore, donc plus on se croit bon.`);
one(4,35,`6 biais fréquents`,`Quel biais fait que la première information reçue influence toutes les suivantes ?`,
 [`L'ancrage`,`Le biais de disponibilité`,`Le biais de confirmation`,`L'effet de halo`],0,
 `C'est l'ancrage : le premier chiffre ou la première idée sert de point de référence. Parade : préparer son chiffre et parler le premier.`,
 `Comme une ancre jetée au fond : on peut bouger un peu autour, mais on reste accroché au premier point.`);
one(4,35,`6 biais fréquents`,`Quel biais pousse à se rallier à la majorité pour ne pas être isolé ?`,
 [`Le biais de conformité`,`Le biais d'autorité`,`Le biais de similarité`,`Le biais de projection`],0,
 `C'est le biais de conformité (effet de groupe). Parade : demander les avis par écrit avant la discussion, désigner un « avocat du diable ».`,
 `On lève la main avec les autres, même quand on n'est pas convaincu, pour ne pas être le seul à dire non.`);
one(4,35,`6 biais fréquents`,`« Il est toujours en retard, donc il n'est pas sérieux. » Quel biais ce raisonnement illustre-t-il ?`,
 [`L'effet de halo`,`Le biais de disponibilité`,`L'ancrage`,`Le biais de confirmation`],0,
 `C'est l'exemple du cours pour l'effet de halo : un seul trait (les retards) contamine le jugement sur le sérieux de la personne en général.`,
 `Les retards ne disent rien de la qualité de son travail, mais ils colorent tout le jugement.`);
one(4,35,`6 biais fréquents`,`Lors d'une négociation, le premier devis présenté fixe ce qui paraît être un prix « acceptable ». Quel biais est en jeu ?`,
 [`L'ancrage`,`L'effet de halo`,`Le biais de conformité`,`Le biais d'optimisme`],0,
 `C'est l'ancrage : le premier chiffre sert de référence pour tous les autres. C'est pourquoi le cours conseille de préparer son chiffre et de parler le premier.`,
 `Celui qui annonce le premier chiffre fixe le terrain de jeu : toute la négociation tournera autour.`);
one(4,35,`6 biais fréquents`,`Après un incident sur une machine, un responsable déclare : « Ça arrive tout le temps ! » Quel biais est en jeu ?`,
 [`Le biais de disponibilité`,`Le biais de négativité`,`Le biais de confirmation`,`Le biais rétrospectif`],0,
 `C'est le biais de disponibilité : l'incident récent et marquant fait surestimer sa fréquence. Parade : regarder les chiffres réels.`,
 `Un seul incident encore frais dans la mémoire pèse plus que cent jours sans problème.`);
one(4,35,`6 biais fréquents`,`Un stagiaire est persuadé d'en savoir plus que son tuteur. Quel biais est en jeu ?`,
 [`L'effet Dunning-Kruger`,`L'effet IKEA`,`Le biais d'autorité`,`L'effet Barnum`],0,
 `C'est l'exemple du cours pour l'effet Dunning-Kruger : faute d'expérience, le stagiaire ne voit pas tout ce qu'il ignore.`,
 `Le débutant ne sait pas ce qu'il ne sait pas ; l'expert, lui, sait tout ce qu'il lui reste à apprendre.`);
one(4,35,`6 biais fréquents`,`En comité, personne n'ose contredire le manager. Parmi les 6 biais les plus fréquents, lequel est en jeu ?`,
 [`Le biais de conformité`,`L'ancrage`,`L'effet de halo`,`L'effet Dunning-Kruger`],0,
 `C'est l'exemple du cours pour la conformité : chacun se rallie à l'avis dominant pour ne pas être isolé. La diapo 37 évoque aussi le biais d'autorité dans les échanges hiérarchiques.`,
 `Si chacun attend que l'autre ose parler, personne ne parle : la parade est de recueillir les avis par écrit avant la réunion.`);
one(4,35,`6 biais fréquents`,`En réunion, un ingénieur ne cite que les données qui vont dans le sens de son idée. Quel biais est en jeu ?`,
 [`Le biais de confirmation`,`Le biais de disponibilité`,`Le biais du survivant`,`Le biais de projection`],0,
 `C'est l'exemple du cours pour le biais de confirmation : on sélectionne les données qui confortent son avis et on oublie les autres.`,
 `C'est un avocat qui ne présenterait que les preuves favorables à son client, sauf qu'ici on se trompe soi-même.`);
one(4,35,`Se protéger`,`Comment le cours conseille-t-il de se protéger de l'effet de halo ?`,
 [`En notant chaque critère séparément, avec une grille`,`En parlant le premier`,`En cherchant des statistiques`,`En faisant évaluer son travail par un tiers`],0,
 `Contre le halo, on évalue chaque critère séparément avec une grille, pour qu'une impression ne déteigne pas sur tout. Parler le premier protège de l'ancrage, les statistiques de la disponibilité, le tiers de l'effet IKEA.`,
 `La grille oblige à regarder chaque case une par une, au lieu d'avoir une impression d'ensemble.`);
one(4,35,`Se protéger`,`« Préparer son chiffre et parler le premier » : contre quel biais le cours propose-t-il cette parade ?`,
 [`L'ancrage`,`La conformité`,`L'effet de halo`,`Le biais de disponibilité`],0,
 `En parlant le premier avec un chiffre préparé, c'est vous qui fixez l'ancre : c'est la parade contre l'ancrage.`,
 `Si l'ancrage est inévitable, autant que ce soit ton chiffre qui serve d'ancre.`);
one(4,35,`Se protéger`,`« Recueillir les avis par écrit avant la discussion, désigner un avocat du diable » : contre quel biais le cours propose-t-il cette parade ?`,
 [`La conformité`,`L'ancrage`,`L'effet Dunning-Kruger`,`Le biais de disponibilité`],0,
 `Ces deux techniques empêchent chacun de s'aligner sur la majorité : c'est la parade contre le biais de conformité.`,
 `L'avis écrit avant la réunion est l'avis vrai ; l'avis donné après avoir entendu le chef est souvent un avis aligné.`);
one(4,35,`Se protéger`,`« Chercher un argument qui contredit son idée » : contre quel biais le cours propose-t-il cette parade ?`,
 [`Le biais de confirmation`,`L'effet de halo`,`L'ancrage`,`L'effet IKEA`],0,
 `Puisque le biais de confirmation nous fait ne voir que ce qui nous donne raison, la parade consiste à chercher volontairement ce qui nous donne tort.`,
 `Joue contre ton propre camp : « qu'est-ce qui prouverait que je me trompe ? ».`);
mul(4,35,`6 biais fréquents`,`Lesquels font partie des 6 biais les plus fréquents présentés par le cours ?`,
 [`Le biais de confirmation`,`L'ancrage`,`L'effet Dunning-Kruger`,`Le biais de conformité`,`L'effet IKEA`],[0,1,2,3],
 `Les 6 fréquents sont confirmation, halo, disponibilité, Dunning-Kruger, ancrage et conformité. L'effet IKEA fait partie des « 7 autres biais ».`,
 `Mnémotechnique : « Ce Héros Distrait Danse Avec Confiance » pour Confirmation, Halo, Disponibilité, Dunning-Kruger, Ancrage, Conformité.`);
mul(4,35,`Biais : exemples`,`Quelles associations exemple → biais sont exactes ?`,
 [`Un premier devis fixe le prix → ancrage`,`Personne n'ose contredire le manager → conformité`,`« Ça arrive tout le temps » après un incident → disponibilité`,`« Je le savais ! » → confirmation`,`On surévalue ce qu'on a construit soi-même → Dunning-Kruger`],[0,1,2],
 `Les trois premières associations sont celles du cours. « Je le savais ! » illustre le biais rétrospectif, et surévaluer ce qu'on a construit soi-même, c'est l'effet IKEA.`,
 `Rétrospectif : on se croit voyant après coup. IKEA : on adore le meuble qu'on a monté soi-même.`);
one(4,36,`7 autres biais`,`Quel biais consiste à attribuer aux autres nos propres goûts, envies et émotions ?`,
 [`Le biais de projection`,`L'effet Barnum`,`L'effet de halo`,`Le biais de similarité`],0,
 `C'est la projection. Parade : poser des questions ouvertes et écouter. La similarité, elle, consiste à préférer ceux qui nous ressemblent.`,
 `On offre à quelqu'un le cadeau qu'on aimerait recevoir : c'est de la projection.`);
one(4,36,`7 autres biais`,`Quel biais consiste à surestimer ses chances de succès et à sous-estimer les risques ?`,
 [`Le biais d'optimisme`,`L'effet Dunning-Kruger`,`L'effet IKEA`,`Le biais du survivant`],0,
 `C'est le biais d'optimisme. Parade : imaginer l'échec à l'avance (« pré-mortem ») et regarder les statistiques de projets comparables.`,
 `« Ça ne m'arrivera pas à moi » : c'est la voix du biais d'optimisme.`);
one(4,36,`7 autres biais`,`Quel biais fait qu'une critique pèse plus que dix compliments ?`,
 [`Le biais de négativité`,`Le biais de disponibilité`,`L'effet de halo`,`Le biais de confirmation`],0,
 `C'est le biais de négativité. Parade : faire le bilan des points positifs avant de juger.`,
 `Après un entretien avec neuf compliments et une remarque, c'est la remarque qu'on ressasse le soir.`);
one(4,36,`7 autres biais`,`Quel biais consiste à ne regarder que ceux qui ont réussi, en oubliant les échecs ?`,
 [`Le biais du survivant`,`Le biais d'optimisme`,`Le biais de confirmation`,`Le biais rétrospectif`],0,
 `C'est le biais du survivant. Parade : se demander « Que ne vois-je pas ? Où sont les échecs ? ».`,
 `« Il a arrêté ses études et il est devenu milliardaire » : on oublie tous ceux qui ont arrêté leurs études sans le devenir.`);
one(4,36,`7 autres biais`,`Quel biais consiste à valoriser davantage ce qu'on a aidé à créer ?`,
 [`L'effet IKEA`,`L'effet Dunning-Kruger`,`Le biais de projection`,`L'ancrage`],0,
 `C'est l'effet IKEA. Parade : faire évaluer son travail par un tiers, qui n'y est pas attaché.`,
 `Le meuble qu'on a monté soi-même, un peu bancal, nous paraît plus beau que celui du magasin.`);
one(4,36,`7 autres biais`,`Une fois le résultat connu, quelqu'un s'exclame : « Je le savais ! » Quel biais est en jeu ?`,
 [`Le biais rétrospectif`,`Le biais de confirmation`,`Le biais d'optimisme`,`L'effet Barnum`],0,
 `C'est le biais rétrospectif : une fois le résultat connu, il paraît évident après coup. Parade : noter ses prévisions par écrit avant.`,
 `Facile de prédire le passé : c'est pour ça qu'il faut écrire sa prévision avant, pour vérifier ensuite.`);
one(4,36,`7 autres biais`,`Quel biais fait qu'on se reconnaît dans une description très générale, comme un horoscope ?`,
 [`L'effet Barnum`,`Le biais de projection`,`L'effet de halo`,`Le biais de conformité`],0,
 `C'est l'effet Barnum. Parade : se demander « Cette phrase vaut-elle pour tout le monde ? ».`,
 `« Vous êtes quelqu'un de sensible qui cache parfois ses doutes » : tout le monde s'y reconnaît, c'est le principe de l'horoscope.`);
one(4,36,`Se protéger`,`La technique du « pré-mortem » consiste à imaginer l'échec d'un projet avant de le lancer. Contre quel biais protège-t-elle ?`,
 [`Le biais d'optimisme`,`Le biais rétrospectif`,`L'effet Barnum`,`Le biais de négativité`],0,
 `Le pré-mortem force à envisager ce qui pourrait mal tourner : c'est la parade contre le biais d'optimisme, qui sous-estime les risques.`,
 `Au lieu de l'autopsie après l'échec (post-mortem), on fait l'exercice avant (pré-mortem), quand on peut encore corriger.`);
mul(4,36,`Se protéger`,`Quelles parades sont associées au bon biais ?`,
 [`Pré-mortem → optimisme`,`Faire évaluer son travail par un tiers → effet IKEA`,`Noter ses prévisions avant → biais rétrospectif`,`Faire le bilan des points positifs → effet Barnum`,`Poser des questions ouvertes → biais du survivant`],[0,1,2],
 `Les trois premières sont justes. Le bilan des points positifs protège de la négativité, et les questions ouvertes de la projection ; contre le biais du survivant, on se demande « où sont les échecs ? ».`,
 `Chaque parade prend le contre-pied du biais : le biais te fait oublier quelque chose, la parade t'oblige à le regarder.`);
mul(4,36,`7 autres biais`,`Lesquels font partie des « 7 autres biais », et non des 6 plus fréquents ?`,
 [`La projection`,`L'effet Barnum`,`Le biais du survivant`,`L'effet de halo`],[0,1,2],
 `Les 7 autres : projection, optimisme, négativité, survie, effet IKEA, rétrospectif, Barnum. L'effet de halo fait partie des 6 plus fréquents.`,
 `Les 7 autres ont souvent un nom « imagé » (IKEA, Barnum, survivant) ; les 6 fréquents ont des noms plus techniques.`);
one(4,36,`7 autres biais`,`Combien de biais le cours détaille-t-il au total ?`,
 [`13`,`6`,`200`,`11`],0,
 `Le cours détaille 6 biais fréquents (diapo 35) et 7 autres (diapo 36), soit 13. Environ 200 biais ont été recensés au total.`,
 `6 + 7 = 13 : le chiffre est même annoncé dans le sommaire de la séance 4.`);
mul(4,37,`Biais en entreprise`,`Quels biais le cours associe-t-il aux échanges hiérarchiques ?`,
 [`Le biais d'autorité`,`Le biais de confirmation`,`L'ancrage`,`L'effet Barnum`],[0,1,2],
 `Dans les échanges hiérarchiques : biais d'autorité (empêche la remise en question), confirmation (bloque l'écoute active), ancrage (influence les décisions techniques ou RH).`,
 `Face à la hiérarchie, on n'ose pas contredire (autorité), le chef n'écoute que ce qui l'arrange (confirmation) et la première idée émise pèse sur la suite (ancrage).`);
one(4,37,`Biais en entreprise`,`Dans les échanges hiérarchiques, quel biais empêche la remise en question ?`,
 [`Le biais d'autorité`,`Le biais de similarité`,`L'effet IKEA`,`Le biais du survivant`],0,
 `Le biais d'autorité empêche la remise en question : ce que dit le chef semble vrai parce que c'est le chef qui le dit.`,
 `« Si le directeur l'a dit, c'est que c'est vrai » : c'est le titre qui convainc, pas l'argument.`);
