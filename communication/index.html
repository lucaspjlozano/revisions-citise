one(4,37,`Biais en entreprise`,`« Il ne répond pas à mes mails, il est désinvolte. » Juger ainsi un comportement sans connaître le contexte relève de quel biais ?`,
 [`Le biais d'attribution`,`Le biais de projection`,`L'effet de halo`,`L'ancrage`],0,
 `C'est le biais d'attribution, cité par le cours dans les relations interpersonnelles : on attribue le comportement à la personnalité au lieu de chercher le contexte (surcharge, absence…).`,
 `Il ne répond peut-être pas parce qu'il est en congé : le biais d'attribution saute directement à « il s'en moque ».`);
one(4,37,`Biais en entreprise`,`Un recruteur retient surtout les candidats qui lui ressemblent. Quel biais est en jeu ?`,
 [`Le biais de similarité`,`Le biais de projection`,`Le biais de conformité`,`L'effet de halo`],0,
 `C'est le biais de similarité, cité dans le management et le recrutement. La projection, elle, consiste à prêter ses goûts aux autres.`,
 `Similarité : « il a fait la même école que moi, il doit être bon ».`);
one(4,37,`Biais en entreprise`,`« Les jeunes sont impatients », « les seniors ne s'adaptent pas » : quel biais ces phrases illustrent-elles ?`,
 [`Le stéréotype`,`Le biais d'attribution`,`Le biais de négativité`,`L'effet Barnum`],0,
 `C'est le stéréotype : on juge une personne d'après une idée toute faite sur son groupe. Ce sont les exemples du cours.`,
 `Le stéréotype colle une étiquette à tout un groupe, puis à chaque personne qui en fait partie.`);
one(4,37,`Biais en entreprise`,`En entretien d'embauche, un candidat souriant paraît plus compétent. Quel biais est en jeu ?`,
 [`L'effet de halo, ou de contraste`,`Le biais de similarité`,`L'ancrage`,`Le biais d'autorité`],0,
 `C'est l'effet de halo (ou de contraste) : le sourire, trait sympathique, déteint sur l'évaluation des compétences.`,
 `Le sourire ne dit rien de la compétence technique, mais il éclaire tout le reste du jugement.`);
mul(4,37,`Biais en entreprise`,`Quels biais le cours range-t-il dans les relations interpersonnelles ?`,
 [`Le biais d'attribution`,`Le biais de projection`,`Le biais émotionnel`,`Le biais de similarité`],[0,1,2],
 `Relations interpersonnelles : attribution, projection et biais émotionnel, avec pour impact tensions, malentendus et perte de confiance. La similarité est rangée dans le management et le recrutement.`,
 `Entre collègues, on juge sans contexte (attribution), on croit que l'autre pense comme nous (projection) et nos émotions déforment ce qu'on entend (émotionnel).`);
mul(4,37,`Biais en entreprise`,`Quels biais le cours associe-t-il au management et au recrutement ?`,
 [`L'effet de halo ou de contraste`,`Le biais de similarité`,`Le stéréotype`,`Le biais d'attribution`,`Le biais émotionnel`],[0,1,2],
 `Management et recrutement : halo ou contraste, similarité, stéréotype. Attribution et biais émotionnel relèvent des relations interpersonnelles.`,
 `En recrutement, on juge sur une impression (halo), une ressemblance (similarité) ou une étiquette (stéréotype).`);
one(4,37,`Biais en entreprise`,`Un manager convaincu que « c'est trop risqué » n'écoute plus que les arguments qui vont dans son sens. Quel biais est en jeu ?`,
 [`Le biais de confirmation`,`Le biais d'autorité`,`L'ancrage`,`Le biais d'attribution`],0,
 `C'est l'exemple du cours pour le biais de confirmation dans les échanges hiérarchiques : il bloque l'écoute active.`,
 `Une fois l'avis forgé, chaque nouvel argument est trié : « pour » on garde, « contre » on oublie.`);
one(4,38,`Orchestres`,`Dans les années 1970, quelle part de femmes comptaient les grands orchestres américains ?`,
 [`Moins de 5 %`,`Environ 25 %`,`Environ 50 %`,`Environ 15 %`],0,
 `Dans les années 1970, les grands orchestres américains comptaient moins de 5 % de femmes, alors que les auditions se voulaient méritocratiques.`,
 `Moins d'une musicienne sur vingt : un chiffre si bas qu'il ne pouvait pas s'expliquer par le seul talent.`);
one(4,38,`Orchestres`,`En quoi a consisté l'expérience menée dans les années 1980 ?`,
 [`Faire passer les auditions derrière un rideau, parfois pieds nus pour masquer le bruit des talons`,`Imposer des quotas de musiciennes`,`Composer des jurys exclusivement féminins`,`Écouter des enregistrements le lendemain de l'audition`],0,
 `Dans les années 1980, les auditions ont eu lieu derrière un rideau, parfois pieds nus pour qu'on n'entende pas les talons : on n'évaluait plus que la performance musicale.`,
 `Le rideau supprime tout ce qui n'est pas la musique : apparence, genre, et même le bruit des chaussures.`);
one(4,38,`Orchestres`,`Quel effet les auditions à l'aveugle ont-elles eu, d'après Goldin et Rouse (Harvard, 2000) ?`,
 [`25 à 50 % de chances en plus qu'une femme soit sélectionnée`,`5 % de chances en plus qu'une femme soit sélectionnée`,`Deux fois plus de femmes sélectionnées`,`Aucun effet mesurable`],0,
 `Goldin et Rouse (Harvard, 2000) ont mesuré 25 à 50 % de chances en plus qu'une femme soit sélectionnée avec les auditions à l'aveugle.`,
 `Rien n'a changé dans le talent des musiciennes ; seul le regard du jury a été retiré, et les résultats ont bondi.`);
mul(4,38,`Orchestres`,`Quels biais le cours identifie-t-il dans les auditions des orchestres ?`,
 [`Le stéréotype`,`Le biais de similarité`,`L'effet de halo`,`L'effet Barnum`],[0,1,2],
 `Le cours cite trois biais : stéréotype, similarité, halo. Le rideau a supprimé ce que le jury voyait, et avec lui ces trois biais.`,
 `Stéréotype (une idée toute faite sur les musiciennes), similarité (on choisit qui nous ressemble), halo (l'apparence colore l'écoute).`);
mul(4,38,`Orchestres`,`Quel parallèle le cours tire-t-il de l'étude des orchestres pour l'entreprise ?`,
 [`Des recrutements anonymisés`,`Des évaluations par plusieurs jurés`,`Des décisions fondées sur des faits plutôt que sur des impressions`,`Un entretien unique avec le manager direct`],[0,1,2],
 `Le parallèle en entreprise : recrutements anonymisés, évaluations multi-jury, décisions fondées sur des faits. Un entretien unique avec un seul évaluateur laisse au contraire toute la place aux biais.`,
 `Le CV anonyme est le rideau de l'entreprise : on juge les compétences, pas la personne.`);
mul(4,38,`Orchestres`,`Quelles affirmations sur l'étude des orchestres sont exactes ?`,
 [`Les auditions derrière un rideau datent des années 1980`,`L'étude a été publiée par Goldin et Rouse, à Harvard, en 2000`,`Les orchestres comptaient moins de 5 % de femmes dans les années 1970`,`Les auditions derrière un rideau datent des années 1950`,`L'étude a été publiée par Wiseman et ses collègues en 2012`],[0,1,2],
 `Années 1970 : moins de 5 % de femmes ; années 1980 : auditions derrière un rideau ; étude de Goldin et Rouse en 2000. Wiseman et al. (2012) est la référence qui invalide la grille du regard en PNL.`,
 `Trois dates qui se suivent : 1970 le constat, 1980 l'expérience, 2000 la mesure.`);
one(4,39,`Limiter les biais`,`Attendre avant de répondre à un mail irritant : quelle stratégie contre les biais le cours illustre-t-il ainsi ?`,
 [`Prendre du recul`,`Chercher la contradiction`,`Structurer les débats`,`Utiliser des faits mesurables`],0,
 `C'est l'exemple de « prendre du recul » : laisser retomber l'émotion avant d'agir. C'est aussi un conseil de la séance 2 (ne pas répondre à chaud).`,
 `La nuit porte conseil : le délai laisse le temps au raisonnement de reprendre la main sur l'émotion.`);
one(4,39,`Limiter les biais`,`Demander à un collègue « Quel est le point faible de mon idée ? » : quelle stratégie contre les biais le cours illustre-t-il ainsi ?`,
 [`Chercher la contradiction`,`Diversifier les sources d'avis`,`Prendre du recul`,`Développer l'écoute active`],0,
 `C'est « chercher la contradiction » : inviter quelqu'un à challenger son idée. Diversifier les sources, c'est consulter d'autres services.`,
 `On demande à quelqu'un de jouer l'adversaire, pour trouver les failles avant qu'elles ne coûtent cher.`);
one(4,39,`Limiter les biais`,`Consulter un autre service avant de prendre une décision : quelle stratégie contre les biais le cours illustre-t-il ainsi ?`,
 [`Diversifier les sources d'avis`,`Chercher la contradiction`,`Structurer les débats`,`Prendre du recul`],0,
 `C'est « diversifier les sources d'avis » : un autre service apporte un autre point de vue, avec d'autres biais que les nôtres.`,
 `Chaque service voit le problème par sa fenêtre : en ouvrant plusieurs fenêtres, on voit mieux la pièce.`);
one(4,39,`Limiter les biais`,`Règles de réunion, tours de parole, argumentation croisée : quelle stratégie contre les biais le cours illustre-t-il ainsi ?`,
 [`Structurer les débats`,`Développer l'écoute active`,`Utiliser des faits mesurables`,`Diversifier les sources d'avis`],0,
 `C'est « structurer les débats » : des règles qui donnent la parole à chacun et limitent la conformité et l'autorité.`,
 `Un tour de parole oblige le plus timide à donner son avis avant que le plus bavard n'impose le sien.`);
one(4,39,`Limiter les biais`,`Chiffrer et vérifier les causes réelles d'un problème : quelle stratégie contre les biais le cours illustre-t-il ainsi ?`,
 [`Utiliser des faits mesurables`,`Prendre du recul`,`Chercher la contradiction`,`Structurer les débats`],0,
 `C'est « utiliser des faits mesurables » : les chiffres corrigent les impressions, notamment le biais de disponibilité.`,
 `« Ça arrive tout le temps » ? Compte : combien de fois, exactement, ce mois-ci ?`);
one(4,39,`Limiter les biais`,`Reformuler « Si je comprends bien, tu proposes de… » : quelle stratégie contre les biais le cours illustre-t-il ainsi ?`,
 [`Développer l'écoute active`,`Chercher la contradiction`,`Prendre du recul`,`Structurer les débats`],0,
 `C'est « développer l'écoute active » : la reformulation vérifie qu'on a compris l'autre avant d'interpréter.`,
 `Reformuler, c'est vérifier qu'on a bien entendu ce que l'autre a dit, et pas ce qu'on s'attendait à entendre.`);
mul(4,39,`Limiter les biais`,`En recrutement, que recommande le cours pour limiter les biais ?`,
 [`Devenir son propre avocat du diable`,`Mener les entretiens à plusieurs, avec des grilles différentes`,`Préparer des critères objectifs`,`Se fier à sa première impression`],[0,1,2],
 `En recrutement : être son propre avocat du diable, entretiens à plusieurs avec des grilles différentes, critères objectifs préparés. La première impression est justement le terrain du halo.`,
 `Plusieurs regards, des critères écrits à l'avance : on ne juge plus sur un coup de cœur.`);
mul(4,39,`Limiter les biais`,`Lesquelles font partie des stratégies du cours pour limiter les biais ?`,
 [`Prendre du recul`,`Chercher la contradiction`,`Développer l'écoute active`,`Décider seul et vite`,`Se ranger à l'avis majoritaire`],[0,1,2],
 `Les stratégies du cours : recul, contradiction, diversité des avis, faits mesurables, écoute active, débats structurés. Décider seul et vite, ou suivre la majorité, ouvre la porte aux biais.`,
 `Toutes les stratégies ralentissent un peu la décision : c'est le prix à payer pour qu'elle soit moins biaisée.`);
one(4,39,`Limiter les biais`,`Que dit le cours sur la possibilité de supprimer les biais ?`,
 [`On ne les supprime pas : on les repère et on les régule`,`Une formation suffit à les faire disparaître`,`Ils disparaissent avec l'expérience`,`Seuls les experts en sont épargnés`],0,
 `Le cours est clair : on ne supprime pas les biais, on les repère et on les régule. Sa devise : écouter avant d'interpréter, douter avant de trancher, vérifier avant d'affirmer.`,
 `On ne peut pas éteindre une illusion d'optique, mais on peut sortir la règle pour vérifier.`);

/* ================= SÉANCE 5 · ÉCOUTE, PNL, VAKOG (diapos 40-49) ================= */
one(5,40,`Écouter`,`Selon le cours, comment écoutent la plupart des gens ?`,
 [`Pour répondre : ils préparent leur réplique pendant que l'autre parle`,`Pour comprendre, avec empathie`,`Sans jugement, en reformulant`,`En prenant des notes`],0,
 `Le cours constate que la plupart des gens écoutent pour répondre : ils préparent leur réplique pendant que l'autre parle. L'écoute active consiste au contraire à écouter pour comprendre.`,
 `Dans une discussion animée, on attend souvent juste que l'autre reprenne son souffle pour placer son argument : ce n'est pas écouter.`);
one(5,40,`Reformulation`,`Selon le cours, à quoi sert avant tout la reformulation ?`,
 [`À valider qu'on a bien compris`,`À imposer son point de vue`,`À gagner du temps dans la discussion`,`À juger ce que l'autre a dit`],0,
 `La reformulation est un outil de validation de la compréhension : on vérifie auprès de l'autre qu'on a bien saisi ce qu'il voulait dire.`,
 `Reformuler, c'est poser la question « c'est bien ça ? » sous forme de phrase.`);
mul(5,40,`Reformulation`,`Quels types de reformulation le cours présente-t-il ?`,
 [`Le miroir`,`La synthèse`,`La clarification`,`L'interprétation`],[0,1,2],
 `Le cours présente trois reformulations : miroir, synthèse, clarification. L'interprétation est l'un des 6 réflexes de Porter, qui risque d'induire des erreurs.`,
 `Miroir : je répète autrement. Synthèse : je résume. Clarification : je demande des précisions.`);
one(5,40,`Reformulation`,`Répéter ce que dit l'autre avec d'autres mots : quel type de reformulation est-ce ?`,
 [`Le miroir`,`La synthèse`,`La clarification`,`Le recadrage`],0,
 `C'est la reformulation miroir : renvoyer le propos avec d'autres mots. La synthèse résume les idées principales, la clarification questionne avec bienveillance.`,
 `Comme un miroir : l'autre se voit dans ce que tu lui renvoies, et peut corriger si l'image est fausse.`);
one(5,40,`Reformulation`,`Résumer les idées principales de son interlocuteur : quel type de reformulation est-ce ?`,
 [`La synthèse`,`Le miroir`,`La clarification`,`L'interprétation`],0,
 `C'est la synthèse : on condense ce que l'autre a dit en quelques idées clés.`,
 `Après dix minutes d'explications : « Donc, en résumé, tu as deux problèmes : le délai et le budget. » C'est une synthèse.`);
one(5,40,`Reformulation`,`Poser une question bienveillante pour préciser ce que l'autre veut dire : quel type de reformulation est-ce ?`,
 [`La clarification`,`Le miroir`,`La synthèse`,`L'enquête`],0,
 `C'est la clarification : questionner avec bienveillance. L'enquête est un réflexe de Porter, qui peut tourner à l'interrogatoire.`,
 `« Quand tu dis "bientôt", c'est plutôt cette semaine ou ce mois-ci ? » : la question aide l'autre à préciser, sans le mettre en accusation.`);
mul(5,40,`Non verbal`,`Dans l'écoute, quels éléments non verbaux le cours présente-t-il comme favorables ?`,
 [`Un regard qui montre l'intérêt`,`Une posture ouverte, réceptive`,`Une voix calme et des gestes doux, qui apaisent`,`La synchronisation du ton et du rythme`,`Les bras croisés, signe de concentration`],[0,1,2,3],
 `Le cours cite le regard (intérêt), la posture ouverte (réceptivité), la voix calme et les gestes doux (apaisement) et la synchronisation du ton et du rythme. Les bras croisés ferment la posture.`,
 `Le non-verbal soutient ou contredit ce qu'on dit : dire « je t'écoute » en regardant son téléphone ne trompe personne.`);
one(5,41,`OSBD`,`Que signifie l'acronyme OSBD ?`,
 [`Observation, Sentiment, Besoin, Demande`,`Objectif, Situation, But, Décision`,`Observer, Suggérer, Bâtir, Décider`,`Opinion, Sentiment, Besoin, Désir`],0,
 `OSBD : Observation (un fait sans jugement), Sentiment (ce que je ressens), Besoin (ce dont j'ai besoin), Demande (une demande concrète).`,
 `On part de ce qu'on voit (O), on passe par ce qu'on ressent (S) et ce qu'il nous faut (B), et on arrive à ce qu'on demande (D).`);
one(5,41,`OSBD`,`À quelle approche la méthode OSBD appartient-elle ?`,
 [`La communication non violente`,`La programmation neuro-linguistique`,`L'analyse transactionnelle`,`La Process Communication`],0,
 `Le cours présente OSBD comme la méthode de la communication non violente, avec la même logique que DESC (séance 1).`,
 `Non violente : on dit les choses franchement, mais sans attaquer la personne.`);
one(5,41,`OSBD`,`Dans OSBD, que doit contenir l'étape « Observation » ?`,
 [`Un fait, sans jugement`,`Ce que je ressens`,`Ce dont j'ai besoin`,`Une demande concrète`],0,
 `L'Observation énonce un fait sans jugement, comme le « Décrire » de DESC. Le ressenti vient au S, le besoin au B, la demande au D.`,
 `Observer comme une caméra : la caméra enregistre ce qui se passe, elle ne commente pas.`);
one(5,41,`OSBD`,`Dans OSBD, quelle étape correspond à « ce dont j'ai besoin » ?`,
 [`Besoin`,`Demande`,`Sentiment`,`Observation`],0,
 `C'est l'étape B, Besoin. La Demande, qui suit, transforme ce besoin en action concrète demandée à l'autre.`,
 `Besoin : ce qu'il me faut (« j'ai besoin de visibilité »). Demande : ce que je te demande (« peux-tu m'envoyer un point chaque vendredi ? »).`);
one(5,41,`OSBD`,`Selon le cours, quelle méthode de la séance 1 suit la même logique qu'OSBD ?`,
 [`DESC`,`Le T.A.S.`,`Le VAKOG`,`Le modèle de Thomas-Kilmann`],0,
 `Le cours le dit explicitement : OSBD suit la même logique que DESC. Dans les deux cas, on part d'un fait, on exprime un ressenti et on aboutit à une demande.`,
 `DESC et OSBD sont deux recettes du même plat : fait, émotion, demande.`);
mul(5,41,`OSBD / DESC`,`Lesquelles sont des étapes de la méthode OSBD ?`,
 [`Observation`,`Sentiment`,`Besoin`,`Demande`,`Convenir`],[0,1,2,3],
 `OSBD compte quatre étapes : Observation, Sentiment, Besoin, Demande. « Convenir » est la dernière étape de DESC.`,
 `OSBD se termine sur une demande ; DESC va un cran plus loin, jusqu'à l'accord (Convenir).`);
mul(5,41,`OSBD / DESC`,`Lesquelles sont des étapes de DESC, et non d'OSBD ?`,
 [`Exprimer`,`Convenir`,`Besoin`,`Observation`],[0,1],
 `DESC : Décrire, Exprimer, Suggérer, Convenir. Besoin et Observation appartiennent à OSBD.`,
 `Repère les initiales : D-E-S-C d'un côté, O-S-B-D de l'autre.`);
mul(5,41,`Communication bienveillante`,`Quels principes définissent la communication bienveillante selon le cours ?`,
 [`Être clair et sincère dans ce que l'on exprime`,`Prendre en compte les émotions et les besoins de l'autre`,`Favoriser la coopération et la compréhension mutuelle`,`Taire ses propres besoins pour préserver la relation`],[0,1,2],
 `La communication bienveillante : clarté et sincérité, prise en compte des émotions et besoins de l'autre, coopération. Elle ne demande pas de taire ses besoins : OSBD consiste justement à les exprimer.`,
 `Bienveillant ne veut pas dire effacé : on dit clairement ce qu'on veut, tout en respectant l'autre.`);
one(5,42,`Porter`,`Qui a décrit les 6 réflexes d'écoute, dans les années 1950 ?`,
 [`Elias Porter`,`Taibi Kahler`,`Éric Berne`,`Richard Bandler`],0,
 `Les 6 réflexes d'écoute ont été décrits par Elias Porter dans les années 1950. Kahler a décrit les drivers, Berne l'analyse transactionnelle, Bandler la PNL.`,
 `Porter, comme « porter attention » : c'est lui qui a étudié nos façons d'écouter.`);
mul(5,42,`Porter`,`Lesquels font partie des 6 réflexes d'écoute de Porter ?`,
 [`L'empathie`,`L'enquête`,`La suggestion`,`Le jugement`,`Le recadrage`],[0,1,2,3],
 `Les 6 réflexes : empathie, jugement, enquête, interprétation, aide/soutien, suggestion. Le recadrage est un outil de la PNL.`,
 `Mnémotechnique : « Elle Juge, Enquête, Interprète, Aide, Suggère » — EJEIAS.`);
one(5,42,`Porter`,`Selon Porter, comment faut-il considérer les 6 réflexes d'écoute ?`,
 [`Aucun n'est bon ou mauvais en soi : chacun a un effet sur l'autre`,`Seule l'empathie est acceptable, les autres sont à bannir`,`Chacun n'en utilise qu'un seul, toute sa vie`,`Chaque réflexe correspond à un driver de Kahler`],0,
 `Pour Porter, aucune attitude n'est bonne ou mauvaise en soi ; chacun utilise les six. L'objectif est d'en prendre conscience pour choisir l'écoute adaptée.`,
 `Les réflexes sont des outils : un marteau n'est ni bon ni mauvais, mais il ne sert pas à visser.`);
one(5,42,`Porter`,`« Si je comprends bien, tu te sens dépassé. » Quel réflexe d'écoute est-ce ?`,
 [`L'empathie`,`L'interprétation`,`L'aide / soutien`,`L'enquête`],0,
 `C'est l'empathie : je reformule ce que l'autre dit et ressent, sans juger ni conseiller.`,
 `« Si je comprends bien » est la signature de la reformulation, donc de l'empathie.`);
one(5,42,`Porter`,`« Tu as eu tort de réagir comme ça. » Quel réflexe d'écoute est-ce ?`,
 [`Le jugement`,`La suggestion`,`L'interprétation`,`L'enquête`],0,
 `C'est le jugement : j'évalue le comportement de l'autre (« tu as eu tort »).`,
 `Dès qu'on dit « tu as eu tort » ou « tu as bien fait », on évalue : c'est un jugement.`);
one(5,42,`Porter`,`« Depuis quand ? Pourquoi as-tu fait ça ? » Quel réflexe d'écoute est-ce ?`,
 [`L'enquête`,`Le jugement`,`L'empathie`,`L'interprétation`],0,
 `C'est l'enquête : je questionne pour recueillir des faits. Utilisée seule ou trop tôt, elle peut tourner à l'interrogatoire.`,
 `Une rafale de questions, c'est un inspecteur qui mène son enquête.`);
one(5,42,`Porter`,`« C'est parce que tu as peur de l'échec. » Quel réflexe d'écoute est-ce ?`,
 [`L'interprétation`,`L'empathie`,`Le jugement`,`L'aide / soutien`],0,
 `C'est l'interprétation : j'explique à l'autre ce qui se passe en lui, à sa place. Elle peut éclairer, mais aussi se tromper et provoquer un rejet.`,
 `« C'est parce que… » : on joue au psychologue et on donne à l'autre l'explication de son propre comportement.`);
one(5,42,`Porter`,`« Ne t'inquiète pas, ça va s'arranger. » Quel réflexe d'écoute est-ce ?`,
 [`L'aide / soutien`,`L'empathie`,`La suggestion`,`Le jugement`],0,
 `C'est l'aide / soutien : je rassure. Ça réconforte, mais ça risque d'esquiver le vrai problème.`,
 `Rassurer, c'est mettre un pansement : ça soulage, mais ça ne dit pas d'où vient la blessure.`);
one(5,42,`Porter`,`« À ta place, je ferais ceci. » Quel réflexe d'écoute est-ce ?`,
 [`La suggestion`,`L'aide / soutien`,`Le jugement`,`L'interprétation`],0,
 `C'est la suggestion : je conseille. Elle fait gagner du temps, mais peut créer de la dépendance ou des résistances (« oui, mais… »).`,
 `« À ta place » : on prend la place de l'autre pour décider à sa place.`);
mul(5,42,`Porter`,`Quels réflexes de Porter correspondent à « je rassure » et à « je conseille » ?`,
 [`L'aide / soutien`,`La suggestion`,`L'empathie`,`L'interprétation`,`L'enquête`],[0,1],
 `Je rassure = aide / soutien ; je conseille = suggestion. L'empathie, c'est je reformule ; l'interprétation, j'explique à l'autre ; l'enquête, je questionne.`,
 `Six réflexes, six verbes : reformuler, évaluer, questionner, expliquer, rassurer, conseiller.`);
one(5,43,`Effets des réflexes`,`Quel réflexe d'écoute prouve qu'on écoute, comprend sans juger et favorise l'expression de l'autre ?`,
 [`L'empathie`,`L'enquête`,`L'aide / soutien`,`La suggestion`],0,
 `C'est l'empathie : elle prouve l'écoute et favorise l'expression. Son risque est d'être perçue comme un refus d'engagement, source d'insécurité.`,
 `L'empathie ouvre la porte : l'autre se sent compris, donc il continue à parler.`);
one(5,43,`Effets des réflexes`,`Quel réflexe d'écoute risque de tourner à l'interrogatoire et de provoquer de la résistance ?`,
 [`L'enquête`,`Le jugement`,`L'interprétation`,`La suggestion`],0,
 `C'est l'enquête : elle montre de l'intérêt et recueille des informations, mais elle peut devenir un interrogatoire et susciter défenses et projections.`,
 `Trop de « pourquoi ? » d'affilée, et l'autre a l'impression d'être au tribunal.`);
one(5,43,`Effets des réflexes`,`Quel réflexe d'écoute bloque l'échange, provoque agressivité et surenchère et arrête l'expression ?`,
 [`Le jugement`,`L'empathie`,`L'enquête`,`L'aide / soutien`],0,
 `C'est le jugement : il a l'avantage de s'engager et de faire comprendre sa position, mais il bloque, crée de l'agressivité et arrête l'expression.`,
 `Quand on se sent jugé, soit on se tait, soit on contre-attaque : dans les deux cas, l'écoute s'arrête.`);
one(5,43,`Effets des réflexes`,`Quel réflexe d'écoute entraîne un discours décentré du type « oui, mais… » ?`,
 [`La suggestion`,`Le jugement`,`L'empathie`,`L'enquête`],0,
 `C'est la suggestion : constructive et rapide, mais elle provoque dépendance et résistances, d'où les « oui, mais… ».`,
 `Chaque conseil reçoit un « oui, mais… » : la personne n'était pas prête à recevoir une solution, elle voulait d'abord être écoutée.`);
one(5,43,`Effets des réflexes`,`Quel réflexe d'écoute a pour risques les « bons sentiments » et l'esquive du problème ?`,
 [`L'aide / soutien`,`L'empathie`,`L'interprétation`,`La suggestion`],0,
 `C'est l'aide / soutien : il rassure et prend en charge, mais tombe facilement dans les « bons sentiments » et l'esquive, avec un risque de dépendance.`,
 `« Ça va aller » réconforte sur le moment, mais le problème est toujours là le lendemain.`);
one(5,43,`Effets des réflexes`,`Quel réflexe d'écoute peut apporter un éclairage, mais aussi provoquer erreurs et barrages ?`,
 [`L'interprétation`,`L'enquête`,`L'empathie`,`L'aide / soutien`],0,
 `C'est l'interprétation : elle peut éclairer, mais si elle se trompe, elle provoque des barrages, du blocage, voire de l'agressivité.`,
 `Expliquer à quelqu'un ce qu'il ressent, c'est risqué : si tu te trompes, il se ferme.`);
mul(5,43,`Effets des réflexes`,`Selon le cours, quels réflexes d'écoute peuvent entraîner une dépendance ?`,
 [`Le jugement`,`L'aide / soutien`,`La suggestion`,`L'empathie`,`L'enquête`],[0,1,2],
 `Le tableau des conséquences cite la dépendance pour le jugement, l'aide / soutien et la suggestion. L'empathie favorise l'expression et l'enquête entraîne plutôt projections et défenses.`,
 `Quand on juge, rassure ou conseille, on décide à la place de l'autre : il prend l'habitude de ne plus décider seul.`);
one(5,44,`L'empathie d'abord`,`Selon le cours, par quel réflexe faut-il commencer quand on écoute ?`,
 [`L'empathie`,`L'enquête`,`La suggestion`,`Le jugement`],0,
 `En écoute, on commence par l'empathie : faire exprimer l'autre, reformuler ce qu'il dit et ressent. Ensuite seulement, l'enquête pour les faits et la suggestion pour décider.`,
 `D'abord comprendre, ensuite questionner, enfin conseiller : on ne prescrit pas avant d'avoir écouté.`);
one(5,44,`L'empathie d'abord`,`Quel est le risque principal de l'empathie selon le cours ?`,
 [`Paraître passif`,`Bloquer l'expression`,`Créer de la dépendance`,`Esquiver le problème`],0,
 `L'empathie est utile pour faire parler et comprendre ; son risque principal est de paraître passif. Bloquer l'expression est le risque du jugement, la dépendance celui de la suggestion.`,
 `À force de reformuler sans jamais rien proposer, on peut donner l'impression de ne pas s'impliquer.`);
one(5,44,`L'empathie d'abord`,`Quel réflexe d'écoute est utile pour poser un cadre ?`,
 [`Le jugement`,`L'empathie`,`L'aide / soutien`,`L'interprétation`],0,
 `Le jugement est utile pour poser un cadre (rappeler une règle, une limite) ; son risque principal est de bloquer l'expression.`,
 `Un manager doit parfois dire « ce comportement n'est pas acceptable » : c'est un jugement, utile s'il vient au bon moment.`);
one(5,44,`L'empathie d'abord`,`Quel réflexe d'écoute est utile pour aller vite à l'action ?`,
 [`La suggestion`,`L'enquête`,`L'empathie`,`L'aide / soutien`],0,
 `La suggestion permet d'aller vite à l'action ; son risque principal est la dépendance.`,
 `La suggestion, c'est le raccourci : efficace quand l'autre est prêt, contre-productive s'il ne l'est pas.`);
one(5,44,`L'empathie d'abord`,`Quel réflexe d'écoute est utile pour recueillir des faits ?`,
 [`L'enquête`,`L'interprétation`,`Le jugement`,`La suggestion`],0,
 `L'enquête sert à recueillir des faits ; son risque principal est l'interrogatoire.`,
 `Pour régler un problème technique, il faut des faits : quand, où, combien. C'est le rôle de l'enquête.`);
one(5,44,`L'empathie d'abord`,`Selon le cours, que se passe-t-il si les autres réflexes sont utilisés trop tôt ou seuls, sans empathie ?`,
 [`Ils ferment la communication`,`Ils accélèrent la mise en confiance`,`Ils remplacent l'empathie sans inconvénient`,`Ils n'ont aucun effet particulier`],0,
 `Le cours conclut : utilisées trop tôt ou seules, les autres attitudes ferment la communication. D'où la règle de commencer par l'empathie.`,
 `Conseiller quelqu'un qui n'a pas fini de parler, c'est lui couper la parole avec une solution.`);
one(5,45,`PNL`,`Que signifie le sigle PNL ?`,
 [`Programmation neuro-linguistique`,`Psychologie non linéaire`,`Pratique de la négociation libre`,`Processus neuro-logique`],0,
 `PNL signifie programmation neuro-linguistique : programmation (nos habitudes), neuro (le cerveau et les sens), linguistique (le langage).`,
 `Trois mots pour trois idées : nos habitudes (P), notre perception (N), nos mots (L).`);
one(5,45,`PNL`,`Dans « programmation neuro-linguistique », que désigne le mot « programmation » ?`,
 [`Nos habitudes de pensée et de comportement, observables et modifiables`,`Le cerveau et les cinq sens`,`Le langage et les mots que nous employons`,`Le code informatique des machines`],0,
 `La programmation désigne nos habitudes de pensée et de comportement, observables et modifiables. « Neuro » renvoie au cerveau et aux sens, « linguistique » au langage.`,
 `Comme un programme qu'on peut réécrire : nos habitudes ne sont pas figées.`);
one(5,45,`PNL`,`Dans « programmation neuro-linguistique », que désigne le mot « neuro » ?`,
 [`Le cerveau et les cinq sens : notre façon de percevoir le monde`,`Nos habitudes de comportement`,`Les mots que nous employons`,`Le système nerveux autonome uniquement`],0,
 `« Neuro » désigne le cerveau et les cinq sens, c'est-à-dire notre façon de percevoir le monde. C'est le lien avec le VAKOG.`,
 `Neuro = perception : comment l'information du monde entre dans notre tête par nos sens.`);
one(5,45,`PNL`,`Qui a fondé la PNL, et quand ?`,
 [`Richard Bandler et John Grinder, en Californie, dans les années 1970`,`Éric Berne, dans les années 1950`,`Elias Porter, dans les années 1950`,`Taibi Kahler, en 1977`],0,
 `La PNL a été fondée par Richard Bandler et John Grinder, en Californie, dans les années 1970. Berne (analyse transactionnelle) et Porter (réflexes d'écoute) datent des années 1950.`,
 `Années 1950 : Berne et Porter. Années 1970 : Bandler et Grinder, et Kahler (prix 1977).`);
mul(5,45,`PNL`,`Quels thérapeutes Bandler et Grinder ont-ils observés pour créer la PNL ?`,
 [`Milton Erickson`,`Virginia Satir`,`Fritz Perls`,`Éric Berne`],[0,1,2],
 `Bandler et Grinder ont observé trois thérapeutes efficaces : Milton Erickson, Virginia Satir et Fritz Perls, et en ont tiré des techniques. Éric Berne est le fondateur de l'analyse transactionnelle.`,
 `La PNL est née d'une observation : « qu'est-ce que font les meilleurs thérapeutes que les autres ne font pas ? ».`);
one(5,45,`PNL`,`Que signifie le principe de la PNL « la carte n'est pas le territoire » ?`,
 [`Chacun perçoit la réalité à travers sa propre carte : ses expériences, ses croyances, ses valeurs`,`Il faut toujours vérifier ses sources`,`Un résultat décevant est une information pour ajuster`,`Il faut changer d'approche quand ça ne marche pas`],0,
 `« La carte n'est pas le territoire » : chacun perçoit la réalité à travers sa carte (expériences, croyances, valeurs). Les deux dernières réponses correspondent à deux autres principes de la PNL.`,
 `Deux personnes devant la même situation n'ont pas la même carte en tête : avant de discuter, il faut comprendre la carte de l'autre.`);
one(5,45,`PNL`,`Que signifie le principe de la PNL « pas d'échec, que des retours » ?`,
 [`Un résultat décevant est une information qui permet d'ajuster`,`Il ne faut jamais reconnaître une erreur`,`Les retours négatifs sont à ignorer`,`Il faut répéter la même chose avec plus de force`],0,
 `« Pas d'échec, que des retours » : un résultat décevant est une information pour ajuster sa façon de faire.`,
 `Un GPS qui se trompe de route ne dit pas « échec » : il dit « recalcul de l'itinéraire ».`);
one(5,45,`PNL`,`Que signifie le principe de la PNL « si ça ne marche pas, change d'approche » ?`,
 [`Ne pas répéter la même chose en plus fort`,`Abandonner rapidement son objectif`,`Insister avec les mêmes arguments`,`Changer systématiquement d'interlocuteur`],0,
 `Le cours le traduit ainsi : ne pas répéter la même chose en plus fort. On garde l'objectif, mais on change la manière.`,
 `Si quelqu'un ne comprend pas ta phrase, la répéter plus fort ne l'aidera pas : il faut la dire autrement.`);
mul(5,45,`PNL`,`Lesquels sont des principes de la PNL cités par le cours ?`,
 [`« La carte n'est pas le territoire »`,`« Pas d'échec, que des retours »`,`« Si ça ne marche pas, change d'approche »`,`« Nous ne voyons pas le monde tel qu'il est, mais tel que nous sommes »`],[0,1,2],
 `Les trois premiers sont les principes de la PNL présentés diapo 45. La citation sur le monde « tel que nous sommes » illustre les biais cognitifs en séance 4.`,
 `Les trois principes de la PNL parlent d'agir et d'ajuster ; la citation de la séance 4 parle de percevoir et de se tromper.`);
mul(5,46,`Outils PNL`,`Lesquels sont des outils de base de la PNL ?`,
 [`Le rapport`,`Les canaux sensoriels`,`L'ancrage`,`Le recadrage`,`L'enquête`],[0,1,2,3],
 `Les 4 outils de base de la PNL : rapport, canaux sensoriels, ancrage, recadrage. L'enquête est un réflexe d'écoute de Porter.`,
 `Mnémotechnique : « RACR », Rapport, Ancrage, Canaux, Recadrage.`);
one(5,46,`Outils PNL`,`Se mettre sur la même longueur d'onde que l'autre (posture, rythme, ton, mots proches) : quel outil de la PNL est-ce ?`,
 [`Le rapport`,`L'ancrage`,`Le recadrage`,`Les canaux sensoriels`],0,
 `C'est le rapport : s'accorder avec l'autre par la posture, le rythme, le ton et les mots.`,
 `Deux personnes qui s'entendent bien finissent souvent par avoir la même posture sans s'en rendre compte : c'est le rapport.`);
one(5,46,`Outils PNL`,`En PNL, en quoi consiste l'ancrage ?`,
 [`Associer un geste ou un mot à un état positif`,`Laisser la première information influencer les suivantes`,`Changer le sens donné à une situation`,`Adapter son langage aux canaux sensoriels de l'autre`],0,
 `En PNL, l'ancrage associe un geste ou un mot à un état positif. Attention au piège : le biais d'ancrage de la séance 4, c'est la première information qui influence les suivantes.`,
 `Comme le sportif qui serre le poing avant de servir pour retrouver sa confiance : le geste rappelle l'état.`);
one(5,46,`Outils PNL`,`En PNL, en quoi consiste le recadrage ?`,
 [`Changer le sens donné à une situation`,`Nier le problème pour rester positif`,`Remettre son interlocuteur à sa place`,`Associer un mot à un état positif`],0,
 `Le recadrage consiste à changer le sens donné à une situation. Le cours précise que recadrer, ce n'est pas nier le problème : c'est ouvrir une piste d'action.`,
 `Même tableau, autre cadre : la situation reste la même, mais on la regarde sous un angle qui permet d'agir.`);
one(5,46,`Recadrage`,`Comment le cours recadre-t-il la pensée « Je suis nul en public » ?`,
 [`« Je ne suis pas encore à l'aise. Qu'est-ce qui m'aiderait ? »`,`« Je suis le meilleur orateur du groupe. »`,`« Parler en public ne sert à rien. »`,`« Je n'ai aucun problème à l'oral. »`],0,
 `Le recadrage du cours transforme un verdict définitif (« nul ») en étape provisoire (« pas encore ») et ouvre une piste d'action. Les autres réponses nient le problème ou le fuient.`,
 `Le mot clé est « encore » : il transforme un mur en marche à monter.`);
one(5,46,`Recadrage`,`Comment le cours recadre-t-il la pensée « Cette réunion est une perte de temps » ?`,
 [`« Que puis-je en retirer ou y changer ? »`,`« Je n'y vais plus. »`,`« Les réunions sont toujours inutiles. »`,`« Cette réunion est parfaite. »`],0,
 `Le recadrage du cours remplace la plainte par une question tournée vers l'action : « Que puis-je en retirer ou changer ? ».`,
 `On passe de « subir » à « agir » : la réunion n'a pas changé, mais ma façon de la vivre, si.`);
one(5,46,`Recadrage`,`Comment le cours recadre-t-il la pensée « Il me critique tout le temps » ?`,
 [`« Lesquelles de ses remarques sont utiles ? »`,`« Il ne me critique jamais. »`,`« Il est jaloux de moi. »`,`« Je vais le critiquer à mon tour. »`],0,
 `Le recadrage trie les critiques pour en tirer ce qui est utile, sans nier qu'elles existent. « Il est jaloux » est une interprétation, pas un recadrage.`,
 `Au lieu de tout rejeter en bloc, on cherche la pépite dans la critique.`);
mul(5,46,`Recadrage`,`Lesquelles sont de vraies pensées recadrées au sens du cours ?`,
 [`« Que puis-je en retirer ou changer ? »`,`« Lesquelles de ses remarques sont utiles ? »`,`« Il n'y a aucun problème. »`,`« De toute façon, rien ne changera. »`],[0,1],
 `Un recadrage ouvre une piste d'action sans nier le problème. « Il n'y a aucun problème » nie la situation et « rien ne changera » ferme toute action.`,
 `Un bon recadrage se termine souvent par un point d'interrogation : il pose une question qui fait avancer.`);
one(5,47,`VAKOG`,`Que signifie le sigle VAKOG ?`,
 [`Visuel, Auditif, Kinesthésique, Olfactif, Gustatif`,`Verbal, Affectif, Kinésique, Oral, Gestuel`,`Vision, Action, Kinesthésie, Organisation, Groupe`,`Visuel, Analytique, Kinesthésique, Objectif, Global`],0,
 `VAKOG désigne les 5 canaux sensoriels : visuel, auditif, kinesthésique, olfactif, gustatif.`,
 `Ce sont les cinq sens : la vue, l'ouïe, le toucher (et les émotions), l'odorat et le goût.`);
one(5,47,`VAKOG`,`« Ça me saute aux yeux » : à quel canal sensoriel cette expression renvoie-t-elle ?`,
 [`Visuel`,`Auditif`,`Kinesthésique`,`Gustatif`],0,
 `C'est le canal visuel : l'expression parle des yeux. Mots-clés visuels : voir, regarder, image, clair, flou, perspective.`,
 `Les yeux sont dans la phrase : c'est visuel.`);
one(5,47,`VAKOG`,`« Ça sonne juste » : à quel canal sensoriel cette expression renvoie-t-elle ?`,
 [`Auditif`,`Visuel`,`Kinesthésique`,`Olfactif`],0,
 `C'est le canal auditif : « sonner » renvoie au son. Mots-clés auditifs : écouter, entendre, sonner, ton, rythme, silence.`,
 `Une note qui sonne juste en musique : c'est l'oreille qui juge.`);
one(5,47,`VAKOG`,`« J'ai un poids sur les épaules » : à quel canal sensoriel cette expression renvoie-t-elle ?`,
 [`Kinesthésique`,`Visuel`,`Auditif`,`Gustatif`],0,
 `C'est le canal kinesthésique : il renvoie aux sensations du corps et aux émotions (sentir, ressentir, toucher, saisir, solide, lourd).`,
 `Un poids, on le sent dans le corps : K = toucher, émotions, mouvement.`);
one(5,47,`VAKOG`,`« Ça sent le roussi » : à quel canal sensoriel cette expression renvoie-t-elle ?`,
 [`Olfactif`,`Gustatif`,`Kinesthésique`,`Auditif`],0,
 `C'est le canal olfactif : l'odorat (sentir, flair). Attention, « sentir » au sens de ressentir relève du kinesthésique.`,
 `On sent le roussi avec le nez : c'est l'odorat.`);
one(5,47,`VAKOG`,`« Ça me laisse un goût amer » : à quel canal sensoriel cette expression renvoie-t-elle ?`,
 [`Gustatif`,`Olfactif`,`Kinesthésique`,`Visuel`],0,
 `C'est le canal gustatif : le goût (goût, savoureux). Le cours note que les canaux olfactif et gustatif sont rares à l'oral mais puissants.`,
 `Un goût, c'est la langue : gustatif.`);
mul(5,47,`VAKOG`,`Quels mots-clés relèvent du canal kinesthésique ?`,
 [`Saisir`,`Solide`,`Lourd`,`Flou`,`Sonner`],[0,1,2],
 `Mots-clés kinesthésiques : sentir, ressentir, toucher, saisir, solide, lourd. « Flou » est visuel et « sonner » auditif.`,
 `Ce qu'on peut tenir dans les mains ou sentir dans le corps est kinesthésique.`);
mul(5,47,`VAKOG`,`Quels mots-clés relèvent du canal auditif ?`,
 [`Entendre`,`Silence`,`Rythme`,`Perspective`,`Flair`],[0,1,2],
 `Mots-clés auditifs : écouter, entendre, sonner, ton, rythme, silence. « Perspective » est visuel et « flair » olfactif.`,
 `Tout ce qui passe par l'oreille, y compris l'absence de son (le silence), est auditif.`);
one(5,47,`VAKOG`,`Pour s'adresser à un interlocuteur plutôt visuel, que conseille le cours ?`,
 [`Un schéma, des formules comme « imaginez », une présentation soignée`,`Expliquer à voix haute et laisser des silences`,`Proposer d'essayer et parler de ressenti`,`Évoquer des souvenirs d'odeurs`],0,
 `Pour un visuel : schéma, « imaginez », présentation soignée. Pour un auditif : voix haute, reformulation, silences. Pour un kinesthésique : essayer, ressenti, rythme posé.`,
 `Au visuel, montre ; à l'auditif, explique ; au kinesthésique, fais essayer.`);
one(5,47,`VAKOG`,`Pour s'adresser à un interlocuteur plutôt auditif, que conseille le cours ?`,
 [`Expliquer à voix haute, reformuler et laisser des silences`,`Lui proposer de manipuler et d'essayer`,`Lui montrer un schéma très soigné`,`Lui envoyer un long e-mail détaillé`],0,
 `Pour un auditif, le cours conseille d'expliquer à voix haute, de reformuler et de laisser des silences.`,
 `L'auditif comprend en entendant : il faut lui parler, pas seulement lui montrer.`);
one(5,47,`VAKOG`,`Pour s'adresser à un interlocuteur plutôt kinesthésique, que conseille le cours ?`,
 [`Lui proposer d'essayer, parler de ressenti, garder un rythme posé`,`Lui montrer un schéma soigné`,`Reformuler à voix haute en laissant des silences`,`Parler vite pour garder son attention`],0,
 `Pour un kinesthésique : proposer d'essayer, parler de ressenti, garder un rythme posé.`,
 `Le kinesthésique comprend en faisant : mets-lui l'objet dans les mains.`);
one(5,47,`VAKOG`,`Selon le cours, à quoi sert le VAKOG ?`,
 [`De repère de langage`,`De test de personnalité validé scientifiquement`,`De méthode de recrutement`,`De diagnostic médical`],0,
 `Le cours le dit : « le VAKOG sert de repère de langage ». La diapo 49 précise que les canaux préférés ne sont pas validés par la recherche : ce n'est donc pas un test scientifique.`,
 `Le VAKOG aide à choisir ses mots, il ne classe pas les gens dans des cases.`);
one(5,48,`Regard en PNL`,`Selon la grille de la PNL, que signifie un regard dirigé en haut à droite ?`,
 [`Le visuel construit (Vc) : imaginer une image nouvelle`,`Le visuel remémoré (Vr) : se rappeler une image déjà vue`,`L'auditif digital (Ad) : le dialogue intérieur`,`Le kinesthésique (K) : ressentir`],0,
 `En haut à droite : visuel construit, on imagine une image nouvelle. En haut à gauche : visuel remémoré. Droite et gauche s'entendent du point de vue de la personne observée.`,
 `Dans la grille, la droite construit (on invente), la gauche se souvient. Le haut est visuel.`);
one(5,48,`Regard en PNL`,`Selon la grille de la PNL, que signifie un regard dirigé en haut à gauche ?`,
 [`Le visuel remémoré (Vr) : se rappeler une image déjà vue`,`Le visuel construit (Vc) : imaginer une image nouvelle`,`L'auditif remémoré (Ar)`,`Le kinesthésique (K) : ressentir`],0,
 `En haut à gauche : visuel remémoré, on se rappelle une image vue. Le haut correspond au visuel, la gauche au souvenir.`,
 `Haut = image ; gauche = souvenir. Haut-gauche = une image dont on se souvient.`);
one(5,48,`Regard en PNL`,`Selon la grille de la PNL, que signifie un regard dirigé vers le côté droit ?`,
 [`L'auditif construit (Ac) : inventer un son ou une phrase`,`L'auditif remémoré (Ar) : se rappeler un son entendu`,`Le visuel construit (Vc)`,`Le kinesthésique (K)`],0,
 `Sur les côtés, c'est l'auditif : côté droit, auditif construit (on invente un son ou une phrase) ; côté gauche, auditif remémoré.`,
 `Les côtés sont au niveau des oreilles : c'est l'auditif. Et la droite construit toujours.`);
one(5,48,`Regard en PNL`,`Selon la grille de la PNL, que signifie un regard dirigé en bas à gauche ?`,
 [`L'auditif digital (Ad) : le dialogue intérieur`,`Le kinesthésique (K) : ressentir`,`L'auditif remémoré (Ar)`,`Le visuel remémoré (Vr)`],0,
 `En bas à gauche : auditif digital, le dialogue intérieur. En bas à droite : kinesthésique, ressentir.`,
 `Bas-gauche, on se parle à soi-même ; bas-droite, on ressent.`);
one(5,48,`Regard en PNL`,`Selon la grille de la PNL, que signifie un regard dirigé en bas à droite ?`,
 [`Le kinesthésique (K) : ressentir, avec l'olfactif et le gustatif rattachés`,`L'auditif digital (Ad) : le dialogue intérieur`,`Le visuel construit (Vc)`,`L'auditif construit (Ac)`],0,

/* ---------- stockage (clés comm-*) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('comm-' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('comm-' + k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('comm-' + k); }catch(e){} }
};
let stats  = store.get('stats', {});   // id -> {n: essais, c: réussites, last: dernier résultat}
let errors = store.get('errors', {});
let altOpen = store.get('alt', false); // « Expliquer autrement » ouvert d'office ou non  // id -> nb de réussites d'affilée depuis la dernière erreur
function cleanErrors(){ for (const id in errors) if (!BY_ID[id]) delete errors[id]; }
cleanErrors();

function record(q, ok){
  const s = stats[q.id] || {n:0, c:0, last:false};
  s.n++; if (ok) s.c++; s.last = ok; stats[q.id] = s;
  if (!ok) errors[q.id] = 0;
  else if (q.id in errors){ errors[q.id]++; if (errors[q.id] >= 2) delete errors[q.id]; }
  store.set('stats', stats); store.set('errors', errors);
}
function abstain(q){ errors[q.id] = 0; store.set('errors', errors); }

/* ---------- outils ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fr = (x, d = 1) => x.toLocaleString('fr-FR', {minimumFractionDigits: 0, maximumFractionDigits: d});
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function makeItem(q){ return {id: q.id, perm: shuffle(q.o.map((_, i) => i))}; }
function isRight(q, chosen){ // chosen : indices d'origine
  const ok = new Set(q.ok); return chosen.length === ok.size && chosen.every(i => ok.has(i));
}
function seanceStats(s){
  const qs = Q.filter(q => q.seance === s); let n = 0, c = 0, seen = 0, mastered = 0;
  qs.forEach(q => { const st = stats[q.id]; if (st){ n += st.n; c += st.c; seen++; if (st.last) mastered++; } });
  return {total: qs.length, n, c, seen, mastered, rate: pct(c, n)};
}
function fmtTime(sec){ const m = Math.floor(sec / 60), s = sec % 60; return m + ' min ' + String(s).padStart(2, '0') + ' s'; }

});

let timer = null, keyHandler = null, pending = null;
function setKeys(fn){ keyHandler = fn; }
document.addEventListener('keydown', e => {
  if (!keyHandler || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  keyHandler(e);
});
function route(){
  clearInterval(timer); timer = null; setKeys(null);
  const h = location.hash.replace(/^#\/?/, '').split('/')[0] || '';
  document.querySelectorAll('.nav a').forEach(a => {
    const t = a.getAttribute('href').replace(/^#\/?/, '');
    if (t === h) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const views = {'': viewHome, 'entrainement': viewTrain, 'qcm': viewExam, 'erreurs': viewErrors, 'fiche': viewFiche};
  (views[h] || viewHome)();
  window.scrollTo(0, 0);
  if (pending){ const f = pending; pending = null; f(); }
}
window.addEventListener('hashchange', route);
function go(h, then){ pending = then || null; if (location.hash === h) route(); else location.hash = h; }

function prioritize(qs){
  // jamais vues et ratées d'abord, puis le reste ; mélange à l'intérieur de chaque groupe
  const rank = q => { const st = stats[q.id]; return !st ? 0 : (!st.last ? 1 : 2); };
  const groups = [[], [], []]; qs.forEach(q => groups[rank(q)].push(q));
  return groups.flatMap(g => shuffle(g));
}
function startTrain(seances, n){
  store.set('train-pref', {seances, n});
  let qs = prioritize(Q.filter(q => seances.includes(q.seance)));
  if (n) qs = shuffle(qs.slice(0, n));
  const sess = {mode: 'entrainement', seances, items: qs.map(makeItem), i: 0, good: 0, missed: []};
  store.set('session', sess); runQuiz(sess);
}

/* moteur commun Entraînement / Mes erreurs */
function runQuiz(sess){
  let chosen = new Set(), done = false;
  const save = () => { if (!sess.nosave) store.set('session', sess); };
  function draw(){
    if (sess.i >= sess.items.length) return finish();
    const it = sess.items[sess.i], q = BY_ID[it.id], multi = q.type === 'multi';
    const right = done && isRight(q, [...chosen]);
    app.innerHTML = `
    <section class="quiz">
      <div class="q-meta">
        <div class="row"><span class="tag acc">Séance ${q.seance}</span><span class="tag">${esc(q.notion)}</span></div>
        <span class="q-count">${sess.mode === 'erreurs' ? 'Mes erreurs · ' : ''}${sess.i + 1} / ${sess.items.length} · ${sess.good} juste${sess.good > 1 ? 's' : ''}</span>
      </div>
      <div class="progress"><i style="width:${pct(sess.i, sess.items.length)}%"></i></div>
      <h2 class="q-text">${esc(q.q)}</h2>
      <p class="q-kind ${multi ? 'multi' : ''}">${multi ? 'Plusieurs réponses possibles' : 'Une seule réponse'}</p>
      <div class="opts" role="${multi ? 'group' : 'radiogroup'}">
        ${it.perm.map((oi, k) => {
          let cls = '', mark = '';
          if (done){
            const good = q.ok.includes(oi), picked = chosen.has(oi);
            if (good && picked){ cls = 'is-good'; mark = 'Juste'; }
            else if (good){ cls = 'is-missed'; mark = 'Oubliée'; }
            else if (picked){ cls = 'is-bad'; mark = 'Fausse'; }
            else cls = 'is-dim';
          }
          return `<button class="opt ${multi ? 'multi' : 'one'} ${cls}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${chosen.has(oi)}" data-oi="${oi}" ${done ? 'disabled' : ''}>
            <span class="k">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span><span class="mark">${mark}</span></button>`;
        }).join('')}
      </div>
      ${done ? `<div class="verdict ${right ? 'ok' : 'ko'}" role="status"><b>${right ? 'Juste' : 'Faux'}</b>
        ${right ? '' : `<p>Réponse${q.ok.length > 1 ? 's' : ''} attendue${q.ok.length > 1 ? 's' : ''} : ${q.ok.map(i => '« ' + esc(q.o[i]) + ' »').join(', ')}</p>`}
        <div class="exp"><p class="eyebrow">Pourquoi · diapo ${q.page}</p><p>${esc(q.why)}</p></div>
        ${q.alt ? `<button class="link alt-btn" id="altb" aria-expanded="${altOpen}">${altOpen ? 'Masquer l’autre explication' : 'Expliquer autrement'}</button>
        <div class="exp" id="altx" ${altOpen ? '' : 'hidden'}><p class="eyebrow">Autrement dit</p><p>${esc(q.alt)}</p></div>` : ''}</div>` : ''}
      <div class="actions">
        ${done ? `<button class="btn primary" id="next">${sess.i + 1 < sess.items.length ? 'Question suivante' : 'Voir le bilan'}</button>`
               : `<button class="btn primary" id="val" ${chosen.size ? '' : 'disabled'}>Valider</button>`}
        <button class="link" id="quit">Arrêter la série</button>
        <span class="kbd">Touches 1–${it.perm.length} ou A–${LETTERS[it.perm.length - 1]} · Entrée</span>
      </div>
    </section>`;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => toggle(+b.dataset.oi));
    const v = app.querySelector('#val'); if (v) v.onclick = validate;
    const nx = app.querySelector('#next'); if (nx){ nx.onclick = next; nx.focus({preventScroll: true}); }
    app.querySelector('#quit').onclick = () => { finish(true); };
    const ab = app.querySelector('#altb');
    if (ab) ab.onclick = () => { altOpen = !altOpen; store.set('alt', altOpen); const x = app.querySelector('#altx'); x.hidden = !altOpen;
      ab.setAttribute('aria-expanded', altOpen); ab.textContent = altOpen ? 'Masquer l’autre explication' : 'Expliquer autrement'; };
  }
  function toggle(oi){
    if (done) return; const q = BY_ID[sess.items[sess.i].id];
    if (q.type === 'one') chosen = new Set([oi]); else chosen.has(oi) ? chosen.delete(oi) : chosen.add(oi);
    draw();
  }
  function validate(){
    if (done || !chosen.size) return;
    const q = BY_ID[sess.items[sess.i].id], ok = isRight(q, [...chosen]);
    done = true; record(q, ok); if (ok) sess.good++; else sess.missed.push(q.id);
    sess.answered = (sess.answered || 0) + 1; save(); draw();
  }
  function next(){ sess.i++; chosen = new Set(); done = false; save(); draw(); window.scrollTo(0, 0); }
  function finish(early){
    setKeys(null);
    if (done){ sess.i++; done = false; }
    const total = sess.answered || 0, kept = early && sess.i < sess.items.length && !sess.nosave;
    if (kept) store.set('session', sess); else if (!sess.nosave) store.del('session');
    const missed = [...new Set(sess.missed)].map(id => BY_ID[id]).filter(Boolean);
    app.innerHTML = `
    <header class="page-h"><p class="eyebrow">${sess.mode === 'erreurs' ? 'Mes erreurs' : 'Entraînement'} · bilan</p><h1>${early ? 'Série interrompue' : 'Série terminée'}</h1></header>
    <section class="result">
      <p class="big-score">${sess.good}<span> / ${total}</span></p>
      <dl><div><dt>Réussite</dt><dd>${pct(sess.good, total)} %</dd></div><div><dt>Ratées</dt><dd>${missed.length}</dd></div><div><dt>Erreurs à revoir</dt><dd>${Object.keys(errors).length}</dd></div></dl>
    </section>
    <div class="actions" style="margin-bottom:28px">
      ${kept ? '<button class="btn primary" id="cont">Reprendre la série</button>' : ''}
      <button class="btn ${early ? 'soft' : 'primary'}" id="again">Nouvelle série</button>
      ${Object.keys(errors).length ? '<a class="btn ghost" href="#/erreurs">Revoir mes erreurs</a>' : ''}
      <a class="link" href="#/">Accueil</a>
    </div>
    ${missed.length ? `<div class="rule-h"><h2>À retenir</h2><span class="eyebrow">${missed.length} question${missed.length > 1 ? 's' : ''} ratée${missed.length > 1 ? 's' : ''}</span></div>
      <div class="review">${missed.map(q => reviewItem(q, null)).join('')}</div>` : ''}`;
    const c = app.querySelector('#cont'); if (c) c.onclick = () => runQuiz(sess);
    app.querySelector('#again').onclick = () => sess.mode === 'erreurs' ? viewErrors() : viewTrain();
  }
  setKeys(e => {
    const it = sess.items[sess.i]; if (!it) return;
    const k = e.key.toUpperCase(); let idx = -1;
    if (/^[1-5]$/.test(k)) idx = +k - 1; else if (/^[A-E]$/.test(k)) idx = LETTERS.indexOf(k);
    if (idx >= 0 && idx < it.perm.length && !done){ e.preventDefault(); toggle(it.perm[idx]); return; }
    if (e.key === 'Enter'){ e.preventDefault(); done ? next() : validate(); }
  });
  draw();
}
function reviewItem(q, chosen, status){
  // chosen : tableau d'indices d'origine choisis (null = non montré)
  const st = status ? `<span class="tag ${status === 'ok' ? 'st-ok' : status === 'ko' ? 'st-ko' : ''}">${status === 'ok' ? 'Juste' : status === 'ko' ? 'Faux' : 'Abstention'}</span>` : '';
  return `<article class="rv">
    <div class="rv-h">${st}<span class="tag acc">Séance ${q.seance}</span><span class="tag">${esc(q.notion)}</span><span class="tag">${q.type === 'multi' ? 'plusieurs réponses' : 'une réponse'}</span></div>
    <p class="rv-q">${esc(q.q)}</p>
    <ul>${q.o.map((o, i) => { const g = q.ok.includes(i), p = chosen && chosen.includes(i);
      const cls = g ? 'g' : (p ? 'b' : ''); const ic = g ? (chosen && !p ? '○' : '✓') : (p ? '✗' : '·');
      return `<li class="${cls}"><i>${ic}</i><span>${esc(o)}${chosen && p ? ' <span class="muted">(ta réponse)</span>' : ''}</span></li>`; }).join('')}</ul>
    <p class="why"><b>Pourquoi · diapo ${q.page}</b>${esc(q.why)}</p>
    ${q.alt ? `<details><summary>Expliquer autrement</summary><p>${esc(q.alt)}</p></details>` : ''}
  </article>`;
}

  const live = sess && sess.mode === 'erreurs' && sess.i < sess.items.length && sess.items.every(it => BY_ID[it.id]);

  app.innerHTML = `
  <header class="page-h"><p class="eyebrow">Mode 3</p><h1>Mes erreurs</h1>
    <p>Chaque question ratée (ou passée au QCM blanc) arrive ici. Elle sort de la liste après deux réussites de suite.</p></header>
  ${ids.length ? `
    <section class="result">
      <p class="big-score">${ids.length}<span> à revoir</span></p>

      <button class="btn primary" id="go">Rejouer mes erreurs</button>
      <button class="link" id="clear">Vider la liste</button>
    </div>

    <div class="idx">${qs.sort((a, b) => a.seance - b.seance || a.page - b.page).map(q => `<button data-id="${q.id}" class="eitem"><b>${esc(q.q)}</b><span>S${q.seance} · diapo ${q.page} · ${'✓'.repeat(errors[q.id])}${'·'.repeat(2 - errors[q.id])}</span></button>`).join('')}</div>`
  : `<div class="empty sheet"><h2>Aucune erreur en attente</h2><p>Lance une série d’entraînement ou un QCM blanc : les questions ratées viendront ici.</p><a class="btn primary" href="#/entrainement">S’entraîner</a></div>`}`;
  if (!ids.length) return;
  app.querySelector('#go').onclick = () => {
    const s = {mode: 'erreurs', items: shuffle(qs).map(makeItem), i: 0, good: 0, missed: []};
    store.set('session', s); runQuiz(s);
  };
  const r = app.querySelector('#resume'); if (r) r.onclick = () => runQuiz(sess);
  const c = app.querySelector('#clear');
  c.onclick = () => { if (c.dataset.armed){ errors = {}; store.set('errors', errors); viewErrors(); } else { c.dataset.armed = 1; c.textContent = 'Confirmer : vider la liste ?'; } };
  app.querySelectorAll('.eitem').forEach(b => b.onclick = () => {
    const s = {mode: 'erreurs', items: [makeItem(BY_ID[b.dataset.id])], i: 0, good: 0, missed: [], nosave: true};
    runQuiz(s);
  });
}

/* =============== QCM BLANC =============== */
const EXAM_N = 30;
function viewExam(){
  let neg = store.get('neg', false);
  function draw(){
    const exams = store.get('exams', []);
    app.innerHTML = `
    <header class="page-h"><p class="eyebrow">Mode 2</p><h1>QCM blanc</h1>
      <p>${EXAM_N} questions tirées au hasard sur les 5 séances, sans correction pendant l’épreuve, chrono en marche, note sur 20 à la fin.</p></header>
    <div class="setup">
      <button class="switch" id="neg" role="switch" aria-checked="${neg}"><span class="box">${neg ? '✓' : ''}</span>
        <span><b>Points négatifs</b><span class="d">+1 si juste, −0,5 si faux, 0 si tu passes (bouton « Je passe »). Sans cette option : +1 si juste, 0 sinon.</span></span></button>
      <p class="note">Une question à plusieurs réponses n’est juste que si toutes les bonnes cases sont cochées et aucune fausse. Une question laissée vide compte comme une abstention.</p>
      <div class="row"><button class="btn primary" id="go">Commencer le QCM blanc</button></div>
      ${exams.length ? `<div><div class="rule-h"><h2>Mes notes</h2></div><div class="idx">${exams.slice().reverse().slice(0, 10).map(e => `<div style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)"><b style="font-weight:500">${fr(e.note)} / 20</b><span class="muted" style="font-family:var(--font-m);font-size:.72rem">${e.date} · ${e.c} justes, ${e.w} fausses, ${e.a} passées${e.neg ? ' · négatifs' : ''} · ${fmtTime(e.t)}</span></div>`).join('')}</div></div>` : ''}
    </div>`;
    app.querySelector('#neg').onclick = () => { neg = !neg; store.set('neg', neg); draw(); };
    app.querySelector('#go').onclick = () => runExam(neg);
  }
  draw();
}
function runExam(neg){
  const items = shuffle(Q).slice(0, EXAM_N).map(makeItem);
  const ans = items.map(() => null); // null = vide, 'skip' = je passe, sinon tableau d'indices d'origine
  let i = 0, armed = false; const t0 = Date.now();
  const elapsed = () => Math.round((Date.now() - t0) / 1000);
  function tick(){ const el = document.getElementById('chrono'); if (el) el.textContent = fmtTime(elapsed()); }
  timer = setInterval(tick, 1000);
  function draw(){
    const it = items[i], q = BY_ID[it.id], multi = q.type === 'multi', a = Array.isArray(ans[i]) ? ans[i] : [];
    const nDone = ans.filter(x => Array.isArray(x) && x.length).length, nSkip = ans.filter(x => x === 'skip').length;
    const nEmpty = EXAM_N - nDone - nSkip;
    app.innerHTML = `
    <section class="quiz">
      <div class="exam-bar"><span class="eyebrow">QCM blanc${neg ? ' · points négatifs' : ''}</span><span class="chrono" id="chrono">${fmtTime(elapsed())}</span></div>
      <div class="grid-n" aria-label="Aller à une question">${items.map((_, k) => `<button data-k="${k}" class="${Array.isArray(ans[k]) && ans[k].length ? 'done' : ans[k] === 'skip' ? 'skip' : ''} ${k === i ? 'cur' : ''}" aria-label="Question ${k + 1}">${k + 1}</button>`).join('')}</div>
      <div class="q-meta"><span class="q-count">Question ${i + 1} / ${EXAM_N}</span><span class="q-count">${nDone} répondues · ${nSkip} passées · ${nEmpty} vides</span></div>
      <h2 class="q-text">${esc(q.q)}</h2>
      <p class="q-kind ${multi ? 'multi' : ''}">${multi ? 'Plusieurs réponses possibles' : 'Une seule réponse'}${ans[i] === 'skip' ? ' · passée' : ''}</p>
      <div class="opts">${it.perm.map((oi, k) => `<button class="opt ${multi ? 'multi' : 'one'}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${a.includes(oi)}" data-oi="${oi}"><span class="k">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span><span class="mark"></span></button>`).join('')}</div>
      <div class="actions">
        <button class="btn ghost small" id="prev" ${i ? '' : 'disabled'}>Précédente</button>
        ${neg ? '<button class="btn ghost small" id="skip">Je passe</button>' : ''}
        <button class="btn soft small" id="next" ${i < EXAM_N - 1 ? '' : 'disabled'}>Suivante</button>
        <button class="btn primary small" id="end">${armed ? 'Confirmer la fin' : 'Terminer le QCM'}</button>
      </div>
      ${armed && nEmpty ? `<p class="warn" style="margin-top:12px">${nEmpty} question${nEmpty > 1 ? 's' : ''} encore vide${nEmpty > 1 ? 's' : ''} : elles compteront comme des abstentions (0 point).</p>` : ''}
    </section>`;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => toggle(+b.dataset.oi));
    app.querySelectorAll('.grid-n button').forEach(b => b.onclick = () => { i = +b.dataset.k; armed = false; draw(); });
    app.querySelector('#prev').onclick = () => { if (i){ i--; armed = false; draw(); } };
    app.querySelector('#next').onclick = () => { if (i < EXAM_N - 1){ i++; armed = false; draw(); } };
    const sk = app.querySelector('#skip'); if (sk) sk.onclick = () => { ans[i] = 'skip'; if (i < EXAM_N - 1) i++; draw(); };
    app.querySelector('#end').onclick = () => { if (armed) finish(); else { armed = true; draw(); } };
  }
  function toggle(oi){
    const q = BY_ID[items[i].id]; let a = Array.isArray(ans[i]) ? ans[i].slice() : [];
    if (q.type === 'one') a = a[0] === oi ? [] : [oi];
    else a = a.includes(oi) ? a.filter(x => x !== oi) : a.concat(oi);
    ans[i] = a.length ? a : null; armed = false; draw();
  }
  function finish(){
    clearInterval(timer); timer = null; setKeys(null);
    let c = 0, w = 0, ab = 0; const res = [];
    items.forEach((it, k) => {
      const q = BY_ID[it.id], a = ans[k];
      if (!Array.isArray(a) || !a.length){ ab++; abstain(q); res.push('ab'); }
      else if (isRight(q, a)){ c++; record(q, true); res.push('ok'); }
      else { w++; record(q, false); res.push('ko'); }
    });
    const pts = neg ? c - 0.5 * w : c;
    const note = Math.round(Math.max(0, pts) / EXAM_N * 20 * 10) / 10;
    const t = elapsed();
    const d = new Date(); const date = d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
    const exams = store.get('exams', []); exams.push({date, note, neg, c, w, a: ab, t}); store.set('exams', exams.slice(-30));
    let filter = 'all';
    function drawRes(){
      app.innerHTML = `
      <header class="page-h"><p class="eyebrow">QCM blanc · résultat${neg ? ' · points négatifs' : ''}</p><h1>Ta note</h1></header>
      <section class="result">
        <p class="big-score">${fr(note)}<span> / 20</span></p>
        <dl>
          <div><dt>Justes</dt><dd>${c}</dd></div><div><dt>Fausses</dt><dd>${w}</dd></div><div><dt>Passées</dt><dd>${ab}</dd></div>
          <div><dt>Points</dt><dd>${fr(pts)} / ${EXAM_N}</dd></div><div><dt>Temps</dt><dd style="font-size:1.1rem">${fmtTime(t)}</dd></div>
        </dl>
      </section>
      ${neg && pts < 0 ? '<p class="note" style="margin:-16px 0 24px">Total négatif : la note est ramenée à 0.</p>' : ''}
      <div class="actions" style="margin-bottom:28px">
        <button class="btn primary" id="again">Nouveau QCM blanc</button>
        ${Object.keys(errors).length ? '<a class="btn ghost" href="#/erreurs">Revoir mes erreurs</a>' : ''}
        <a class="link" href="#/">Accueil</a>
      </div>
      <div class="rule-h"><h2>Correction</h2>
        <div class="picks">${[['all','Tout'],['bad','Fausses et passées']].map(([k, l]) => `<button class="pick" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div></div>
      <div class="review">${items.map((it, k) => (filter === 'bad' && res[k] === 'ok') ? '' : reviewItem(BY_ID[it.id], Array.isArray(ans[k]) ? ans[k] : [], res[k] === 'ab' ? 'ab' : res[k])).join('')}</div>`;
      app.querySelector('#again').onclick = () => viewExam();
      app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; drawRes(); });
    }
    drawRes(); window.scrollTo(0, 0);
  }
  setKeys(e => {
    const it = items[i]; const k = e.key.toUpperCase(); let idx = -1;
    if (/^[1-5]$/.test(k)) idx = +k - 1; else if (/^[A-E]$/.test(k)) idx = LETTERS.indexOf(k);
    if (idx >= 0 && idx < it.perm.length){ e.preventDefault(); toggle(it.perm[idx]); }
    else if (e.key === 'ArrowRight' && i < EXAM_N - 1){ i++; armed = false; draw(); }
    else if (e.key === 'ArrowLeft' && i){ i--; armed = false; draw(); }
  });
  draw();
}
