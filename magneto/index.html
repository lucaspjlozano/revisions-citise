<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magnéto-induction</title>
<meta name="description" content="Révisions CITISE de magnétostatique et d'induction électromagnétique : cours clarifié, TD2 corrigé, banque d'exercices, colle blanche, fiche imprimable et révision active.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
</head>
<body>
<style>
/* ===== Magnéto-induction : socle éditorial (même esprit que Maths CITISE), accent bleu nuit ===== */
:root{
  --bg:#f5f5f7; --bg-2:#ececef; --surface:#ffffff; --surface-2:#fafafb;
  --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --line:rgba(0,0,0,.09); --line-2:rgba(0,0,0,.18);
  --accent:#1f3a5f; --accent-2:#2f5d8f; --accent-soft:rgba(31,58,95,.07); --accent-ink:#ffffff;
  --copper:#a4532a; --copper-soft:rgba(164,83,42,.08);
  --good:#2f6b4f; --good-soft:rgba(47,107,79,.08); --warn:#8a5a00; --warn-soft:rgba(176,120,0,.09);
  --bad:#9b2335; --bad-soft:rgba(155,35,53,.07);
  --fieldB:#2f5d8f; --fieldE:#a4532a; --cur:#9b2335; --flux:#2f6b4f;
  --font-d:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-b:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-l:10px; --r-m:8px; --r-s:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --bg-2:#18181b; --surface:#141416; --surface-2:#1b1b1e;
    --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#9a9aa0; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
    --accent:#86b0e6; --accent-2:#a9c8f0; --accent-soft:rgba(134,176,230,.10); --accent-ink:#0b0b0c;
    --copper:#e0915f; --copper-soft:rgba(224,145,95,.10);
    --good:#7fb79a; --good-soft:rgba(127,183,154,.10); --warn:#e3b45a; --warn-soft:rgba(227,180,90,.10);
    --bad:#e27b8b; --bad-soft:rgba(226,123,139,.10);
    --fieldB:#86b0e6; --fieldE:#e0915f; --cur:#e27b8b; --flux:#7fb79a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --bg-2:#18181b; --surface:#141416; --surface-2:#1b1b1e;
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#9a9aa0; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --accent:#86b0e6; --accent-2:#a9c8f0; --accent-soft:rgba(134,176,230,.10); --accent-ink:#0b0b0c;
  --copper:#e0915f; --copper-soft:rgba(224,145,95,.10);
  --good:#7fb79a; --good-soft:rgba(127,183,154,.10); --warn:#e3b45a; --warn-soft:rgba(227,180,90,.10);
  --bad:#e27b8b; --bad-soft:rgba(226,123,139,.10);
  --fieldB:#86b0e6; --fieldE:#e0915f; --cur:#e27b8b; --flux:#7fb79a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.2;margin:0 0 .5em;letter-spacing:-.005em}
h1{font-size:clamp(1.9rem,4.4vw,2.8rem)} h2{font-size:1.55rem;margin-top:1.6em} h3{font-size:1.2rem;margin-top:1.3em} h4{font-size:1.02rem}
p{margin:.55em 0}
ul,ol{padding-left:1.3em;margin:.5em 0} li{margin:.2em 0}
code,kbd{font-family:var(--font-m);font-size:.88em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- mise en page ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 0;background:var(--bg)}
.top::before{content:"";position:absolute;left:50%;transform:translateX(-50%);width:100vw;top:0;bottom:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:-1}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:600;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand-mark{font-family:var(--font-d);font-size:1.35rem;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:6px}
.brand-text{font-family:var(--font-d);font-size:1.08rem}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.nav a{color:var(--ink-3);font-size:.86rem;padding:6px 9px;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink);text-decoration:none}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.icon-btn{background:transparent;border:1px solid var(--line-2);border-radius:var(--r-s);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{border-color:var(--ink)}
.nav-toggle{display:none}
@media (max-width:860px){
  .nav-toggle{display:grid;margin-left:auto}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:6px;z-index:30}
  .nav.open{display:flex}
  .nav a{padding:10px 12px;border-bottom:0;border-left:2px solid transparent}
  .nav a[aria-current="page"]{border-left-color:var(--accent)}
}
main{padding-top:28px;min-height:60vh;outline:none}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:.8rem}

/* ---------- éléments communs ---------- */
.page-h{margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.page-h p.lead{color:var(--ink-2);font-size:1.05rem;max-width:760px;margin:.4em 0 0}
.eyebrow,.tag,.chip,.kb,.qnum{font-family:var(--font-m);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}
.eyebrow{color:var(--accent);display:block;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink-2);padding:3px 7px;background:transparent}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.good{border-color:var(--good);color:var(--good)} .chip.bad{border-color:var(--bad);color:var(--bad)} .chip.warn{border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muted{color:var(--ink-3)} .small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px}
.card h3:first-child,.card h2:first-child,.card h4:first-child{margin-top:0}
a.card{display:block;color:var(--ink);transition:border-color .15s}
a.card:hover{border-color:var(--ink);text-decoration:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--r-s);border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--ink-2);text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--ink);color:var(--ink);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-ink)}
.btn.soft{border-color:var(--ink);color:var(--ink)} .btn.soft:hover{background:var(--ink);color:var(--bg)}
.btn.good{border-color:var(--good);color:var(--good)} .btn.good:hover{background:var(--good);color:var(--bg)}
.btn.bad{border-color:var(--bad);color:var(--bad)} .btn.bad:hover{background:var(--bad);color:var(--bg)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=number],input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:7px 9px;min-height:38px}
input[type=range]{accent-color:var(--accent);width:100%}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--ink-2)}

.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.big{font-family:var(--font-d);font-size:2.2rem;font-weight:600;line-height:1}
.stat .lbl{color:var(--ink-3);font-size:.8rem}

/* ---------- encadrés pédagogiques ---------- */
.box{position:relative;border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:0 var(--r-m) var(--r-m) 0;background:var(--surface);padding:13px 16px 11px;margin:16px 0}
.box>.kb{display:block;margin-bottom:5px;color:var(--ink-3)}
.box>.kb::before{margin-right:6px}
.box p:first-of-type{margin-top:0} .box p:last-child,.box ul:last-child{margin-bottom:0}
.box.savoir{border-left-color:var(--accent);background:var(--accent-soft)} .box.savoir>.kb{color:var(--accent)}
.box.savoir>.kb::before{content:"■"}
.box.def{border-left-color:var(--ink-2)} .box.def>.kb::before{content:"≡"}
.box.methode{border-left-color:var(--good);background:var(--good-soft)} .box.methode>.kb{color:var(--good)} .box.methode>.kb::before{content:"→"}
.box.signe{border-left-color:var(--warn);background:var(--warn-soft)} .box.signe>.kb{color:var(--warn)} .box.signe>.kb::before{content:"±"}
.box.erreur{border-left-color:var(--bad);background:var(--bad-soft)} .box.erreur>.kb{color:var(--bad)} .box.erreur>.kb::before{content:"✕"}
.box.lien{border-left-color:var(--copper);background:var(--copper-soft)} .box.lien>.kb{color:var(--copper)} .box.lien>.kb::before{content:"↗"}
.box.exemple{border-left-color:var(--ink-3)} .box.exemple>.kb::before{content:"◇"}
.box.hors{border-left-style:dashed} .box.hors>.kb::before{content:"※"}
.eq{margin:14px 0;padding:8px 0;overflow-x:auto;text-align:center}
.eq.boxed{border:1px solid var(--accent);border-radius:var(--r-s);padding:10px 14px;display:table;margin:14px auto;min-width:220px}

/* repliables (démonstrations, indices, corrections) */
details.fold{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin:12px 0}
details.fold>summary{cursor:pointer;list-style:none;padding:11px 14px;display:flex;gap:10px;align-items:baseline;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";font-family:var(--font-m);color:var(--ink-3);transition:transform .15s;display:inline-block;width:12px}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>summary .tag{margin-left:auto;color:var(--ink-3)}
details.fold>.in{padding:0 16px 14px;border-top:1px solid var(--line)}
details.demo>summary{color:var(--ink-2);font-weight:500}
details.demo{border-style:dashed}
details.hint>summary{font-weight:500;color:var(--warn)}
details.corr>summary{color:var(--good)}

/* ---------- cours ---------- */
.layout-c{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;align-items:start}
.toc{position:sticky;top:76px;font-size:.86rem;max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}
.toc a{display:block;color:var(--ink-3);padding:4px 0 4px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);text-decoration:none}
.toc a.cur{color:var(--ink);border-left-color:var(--accent)}
.toc .toc-h{font-family:var(--font-m);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px}
@media (max-width:860px){.layout-c{grid-template-columns:1fr}.toc{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:10px}}
.prose{max-width:760px}
.prose h2{padding-top:10px;border-top:1px solid var(--line)}
.prose h2 .n,.prose h3 .n{font-family:var(--font-m);font-size:.75rem;color:var(--accent);margin-right:8px;vertical-align:middle}
.chap-nav{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.chap-card .num{font-family:var(--font-m);color:var(--accent);font-size:.75rem}
.chap-card h3{margin:.25em 0 .3em}
.chap-card p{margin:0;color:var(--ink-3);font-size:.88rem}

/* schémas */
figure.fig{margin:18px 0;text-align:center}
figure.fig svg{max-width:100%;height:auto;color:var(--ink)}
figure.fig figcaption{font-size:.82rem;color:var(--ink-3);margin-top:6px}
.fig .B{stroke:var(--fieldB);fill:var(--fieldB);color:var(--fieldB)} .fig .Bs{stroke:var(--fieldB);fill:none}
.fig .I{stroke:var(--cur);fill:var(--cur);color:var(--cur)} .fig .Is{stroke:var(--cur);fill:none}
.fig .E{stroke:var(--fieldE);fill:var(--fieldE)} .fig .Es{stroke:var(--fieldE);fill:none}
.fig .F{stroke:var(--flux);fill:var(--flux)} .fig .Fs{stroke:var(--flux);fill:none}
.fig .k{stroke:currentColor;fill:none} .fig .kf{fill:currentColor;stroke:none}
.fig .zone{fill:var(--accent-soft);stroke:var(--accent);stroke-dasharray:4 3}
.fig text{font-family:var(--font-b);font-size:13px;fill:currentColor}
.fig text.it{font-family:var(--font-d);font-style:italic;font-size:15px}
.fig text.cB{fill:var(--fieldB)} .fig text.cI{fill:var(--cur)} .fig text.cE{fill:var(--fieldE)} .fig text.cF{fill:var(--flux)}

/* ---------- exercices ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px;padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.filters .grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.filters .grp>span{font-family:var(--font-m);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-right:4px}
.filters button.chip{cursor:pointer}
.ex-list{display:grid;gap:10px}
a.ex-item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px;color:var(--ink)}
a.ex-item:hover{border-color:var(--ink);text-decoration:none}
.ex-item .qnum{color:var(--accent);font-size:.72rem}
.ex-item h4{margin:0;font-family:var(--font-b);font-weight:600;font-size:.98rem}
.ex-item p{margin:2px 0 0;color:var(--ink-3);font-size:.85rem}
.st{width:10px;height:10px;border-radius:50%;border:1px solid var(--line-2);display:inline-block}
.st.ok{background:var(--good);border-color:var(--good)} .st.rev{background:var(--warn);border-color:var(--warn)}
.statement{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r-m) var(--r-m) 0;padding:14px 18px;margin:16px 0}
.statement p,.statement li{font-family:var(--font-d);font-size:1.06rem;line-height:1.55}
.qpart{margin:22px 0}
.qpart>.qh{display:flex;gap:10px;align-items:baseline;font-weight:600}
.qpart>.qh .qnum{color:var(--accent)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
ol.steps>li{counter-increment:s;position:relative;padding:8px 0 8px 36px;border-top:1px dashed var(--line)}
ol.steps>li:first-child{border-top:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:9px;font-family:var(--font-m);font-size:.72rem;color:var(--ink-3);border:1px solid var(--line-2);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.an{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0}
.an div{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface-2)}
.an b{display:block;font-family:var(--font-m);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.self{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px;padding:14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}

/* ---------- révision active ---------- */
.flash{min-height:230px;display:grid;place-items:center;text-align:center;padding:26px;cursor:pointer;font-family:var(--font-d);font-size:1.15rem;user-select:none}
.flash .face-lbl{position:absolute;top:10px;left:14px}
.flash-wrap{position:relative}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:10px 14px;margin:7px 0;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{background:var(--surface-2);border-left:2px solid var(--line-2);padding:9px 13px;margin-top:10px;font-size:.93rem}
.timer{font-family:var(--font-m);font-size:2.6rem;letter-spacing:.04em;line-height:1}
.timer.low{color:var(--bad)}
.grille td,.grille th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table{border-collapse:collapse;width:100%}
.tbl th{font-family:var(--font-m);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tbl td,.tbl th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll-x{overflow-x:auto}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.86rem;margin:6px 0}
@media (max-width:520px){.bar{grid-template-columns:110px 1fr 38px}}

/* ---------- animations ---------- */
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
.sim canvas{width:100%;display:block;border-radius:var(--r-s);background:var(--surface-2)}
.sim .ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px;margin-top:12px}
.sim .ro{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sim .ro span{font-family:var(--font-m);font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--surface-2)}
.sim .lead{color:var(--ink-2);font-size:.92rem;margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r-s);font-size:.88rem;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:26px;text-align:center;color:var(--ink-3)}
mjx-container{max-width:100%}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.m-wait{color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- fiche imprimable ---------- */
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 26px;columns:2 330px;column-gap:28px;font-size:.88rem;line-height:1.45}
.fiche h3{break-after:avoid;font-size:1rem;margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line);font-family:var(--font-b);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}

${fig('generateur', 'Schéma équivalent : la portion MN est un générateur de f.é.m. e orientée dans le sens de i (convention générateur), en série avec R.')}
${box('signe', L`<p>\(i\) et \(e_{MN}\) sont comptés positivement <b>de M vers N</b>. La flèche de \(e\) sur le schéma est dans le sens de \(i\) : convention générateur. Circuit fermé seul (\(M = N\)) : \(Ri = e\), donc \(i = e/R\).</p>`)}
${box('erreur', L`<p>Prendre la f.é.m. comme une tension « aux bornes » en convention récepteur. En circuit ouvert (\(i = 0\)), \(V_M - V_N = -e_{MN}\) : la tension aux bornes est l'<b>opposée</b> de la f.é.m. comptée de \(M\) vers \(N\).</p>`)}`
      },

        id: 'mobile', t: 'Circuit mobile',
        html: L`
<p>Même relation, avec \(\Em = \ve\wedge\vB\) dans le référentiel \(\mathcal R\) et \(\vE' = -\grad V + \Em\) dans le référentiel du conducteur : \(V_M - V_N = Ri - e_{MN}\).</p>
${fig('portionMN', 'Portion MN d’un conducteur mobile dans un champ stationnaire : Em = ve ∧ B.')}`

${eqb(L`Q = -\frac{\Delta\Phi}{R} = -\frac{\Phi_f-\Phi_i}{R}`)}

${box('lien', L`<p>${xref('td6')} (question 2c) : charge induite quand le cadre passe de l'horizontale à la verticale.</p>`)}`

  {

  {

          L`Flux à travers une spire : \(\phi_1 = \int_{-a}^{a}\d z\int_{R-a}^{R+a}\dfrac{\mo NI_1}{2\pi\rho}\d\rho = \dfrac{\mo NI_1\,2a}{2\pi}\ln\dfrac{R+a}{R-a}\).`,
          L`Pour les \(N\) spires : \(\phi = N\phi_1 = \dfrac{\mo N^2 a\,I_1}{\pi}\ln\dfrac{R+a}{R-a}\).`
        ]
      },
      {
        q: L`Inductance propre.`,
        hints: [L`\(L = \phi/I_1\).`],
        steps: [L`\(L = \dfrac{\mo N^2a}{\pi}\ln\dfrac{R+a}{R-a}\). Contrôle (\(a\ll R\)) : \(\ln\dfrac{R+a}{R-a}\approx\dfrac{2a}{R}\), donc \(L\approx\dfrac{\mo N^2(2a)^2}{2\pi R}\) : c'est le solénoïde \(\mo N^2S/\ell\) de section \(S = 4a^2\) et de longueur \(\ell = 2\pi R\). ✓`]
      },
      {
        q: L`Établissement du courant et énergie.`,
        hints: [L`Circuit RL : \(E_1 = ri + L\,\d i/\d t\).`],
        steps: [
          L`\(E_1 = ri + L\dt{i}\), \(i(0) = 0\) : \(i(t) = \dfrac{E_1}{r}\left(1-\e^{-rt/L}\right)\), constante de temps \(\tau = L/r\).`,
          L`En régime établi \(I = E_1/r\), et l'énergie emmagasinée vaut \(W = \tfrac12LI^2 = \dfrac{\mo N^2a}{2\pi}\ln\dfrac{R+a}{R-a}\left(\dfrac{E_1}{r}\right)^2\).`
        ]
      },
      {
        q: L`Mutuelle fil–tore et vérification de Neumann.`,
        hints: [L`\(M_{21}\) : flux du champ du fil \(\dfrac{\mo I_2}{2\pi\rho}\) à travers les \(N\) spires.`, L`\(M_{12}\) : flux du champ du tore à travers le « circuit » du fil, fermé à l'infini. Prends comme surface un demi-plan contenant \(Oz\).`],
        steps: [
          L`<b>Fil vers tore</b> : le champ du fil \(\dfrac{\mo I_2}{2\pi\rho}\ut\) est orthoradial comme celui du tore. Flux à travers les \(N\) spires : \(\Phi_{2\to1} = N\dfrac{\mo I_2\,2a}{2\pi}\ln\dfrac{R+a}{R-a}\), donc \(M_{21} = \dfrac{\mo Na}{\pi}\ln\dfrac{R+a}{R-a}\).`,
          L`<b>Tore vers fil</b> : le fil infini se referme à l'infini ; une surface qui s'appuie sur lui est un demi-plan \(\theta = \text{cste}\), qui coupe le tore selon <b>une</b> section carrée. \(\Phi_{1\to2} = \dfrac{\mo NI_1\,2a}{2\pi}\ln\dfrac{R+a}{R-a}\), donc \(M_{12} = \dfrac{\mo Na}{\pi}\ln\dfrac{R+a}{R-a}\).`,
          L`\(M_{12} = M_{21} = M\) : théorème de Neumann vérifié. On remarque \(L = NM\).`
        ]
      }
    ],
    methodes: L`<ul><li>Ampère avec symétries (tore).</li><li>Flux d'un champ non uniforme : intégrale double \(\int\d z\int\d\rho/\rho\).</li><li>RL ; énergie \(\tfrac12LI^2\) ; mutuelle et théorème de Neumann.</li></ul>`,
    erreurs: [L`Prendre \(B\) uniforme sur la section (vrai seulement si \(a\ll R\)).`, L`Oublier le facteur \(N\) en passant d'une spire à la bobine (\(L\propto N^2\)).`, L`Pour \(M_{12}\), compter \(N\) sections : le demi-plan ne coupe le tore qu'une fois.`],
    an: [],
    retenir: L`Tore : \(B = \mo NI/(2\pi\rho)\), \(L = \dfrac{\mo N^2a}{\pi}\ln\dfrac{R+a}{R-a}\), et avec un fil sur l'axe \(M = L/N\).`

  {
    id: 'td8', n: 8, title: 'Bobine autour d’un solénoïde : mutuelle et mesure', theme: 'mutuelle', diff: 2,
    enonce: L`<p>Une bobine de \(N_2\) spires entoure un solénoïde de \(N_1\) spires, de longueur \(\ell\) et de section \(S\).</p>
<ol><li>Calculer l'inductance mutuelle \(M\) de ces deux circuits.</li><li>La bobine, de résistance \(R\), est refermée sur elle-même. Le solénoïde est parcouru par \(i_1 = i_0\cos\omega t\). On suppose \(N_2\ll N_1\). Montrer que l'inductance propre \(L_2\) de la bobine est négligeable et déterminer le courant \(i_2\).</li><li>Proposer une méthode simple, avec un générateur basse fréquence et un oscilloscope, pour mesurer \(M\).</li></ol>
${fig('td8', 'Bobine de N₂ spires enroulée autour d’un long solénoïde de N₁ spires.')}`,
    parts: [
      {
        q: L`Inductance mutuelle.`,
        hints: [L`Champ du long solénoïde : \(\mo N_1i_1/\ell\), uniforme dans la section \(S\).`],
        steps: [L`\(B_1 = \mo\dfrac{N_1}{\ell}i_1\) dans le solénoïde. La bobine (qui l'entoure) intercepte le flux \(\Phi_{1\to2} = N_2B_1S = \mo\dfrac{N_1N_2S}{\ell}i_1\), donc \(M = \mo\dfrac{N_1N_2S}{\ell}\) (les deux circuits orientés dans le même sens).`]
      },
      {
        q: L`Courant dans la bobine fermée sur elle-même.`,
        hints: [L`\(e_2 = -L_2\dt{i_2} - M\dt{i_1}\) et \(Ri_2 = e_2\).`, L`Compare \(L_2\) à \(M\) : \(L_2\propto N_2^2\), \(M\propto N_1N_2\).`],
        steps: [
          L`Maille de la bobine : \(Ri_2 = -L_2\dt{i_2} - M\dt{i_1}\).`,
          L`Ordres de grandeur : le flux propre de la bobine est \(L_2i_2\), avec \(L_2\) de l'ordre de \(\mo N_2^2S/\ell_2\) ; le flux mutuel \(Mi_1\) est proportionnel à \(N_1N_2\). Pour des géométries comparables, \(L_2/M\sim N_2/N_1\ll1\). De plus \(i_2\) reste petit devant \(i_1\) (il est limité par \(R\)). Le terme \(L_2\,\d i_2/\d t\) est donc négligeable devant \(M\,\d i_1/\d t\) (cela revient à \(L_2\omega\ll R\)).`,
          L`Il reste \(Ri_2 = -M\dt{i_1} = M\omega i_0\sin\omega t\), soit \(i_2 = \dfrac{\mo N_1N_2S\,\omega\,i_0}{R\,\ell}\sin\omega t\) : en quadrature avec \(i_1\).`
        ]
      },
      {
        q: L`Mesurer \(M\) au GBF et à l'oscilloscope.`,
        hints: [L`Bobine en circuit ouvert : \(u_2 = M\,\d i_1/\d t\) (au signe près).`],
        steps: [
          L`On alimente le solénoïde par le GBF à travers une résistance connue \(r_0\) : la voie 1 de l'oscilloscope mesure \(u_{r_0} = r_0i_1\), donc \(i_1\).`,
          L`La bobine est en circuit ouvert (l'oscilloscope a une grande impédance d'entrée, \(i_2\approx0\)) : la voie 2 mesure \(|u_2| = M\left|\dt{i_1}\right|\).`,
          L`En sinusoïdal : \(M = \dfrac{U_{2,max}}{\omega I_{1,max}}\). Avec un signal <b>triangulaire</b>, \(\d i_1/\d t\) est constant par morceaux, \(u_2\) est un créneau d'amplitude \(M\times\) (pente de \(i_1\)) : lecture directe.`
        ]
      }
    ],
    methodes: L`<ul><li>Mutuelle par le circuit dont le champ est le plus simple.</li><li>F.é.m. couplées, comparaison d'ordres de grandeur.</li><li>Mesure : courant via une résistance, tension en circuit ouvert.</li></ul>`,
    erreurs: [L`Prendre la section de la bobine extérieure au lieu de celle du solénoïde (le champ est nul hors du solénoïde).`, L`Mesurer \(u_2\) avec la bobine fermée sur une faible résistance : \(i_2\neq0\) fausse la mesure.`],
    an: [],
    retenir: L`\(M = \mo N_1N_2S/\ell\) : c'est la section du solénoïde intérieur qui compte. En circuit ouvert, \(u_2 = M\,\d i_1/\d t\) permet de mesurer \(M\).`
  },
  {
    id: 'td9', n: 9, title: 'Câble coaxial : champ, énergie, inductance linéique', theme: 'auto', diff: 2,
    enonce: L`<p>Un câble coaxial est formé de deux cylindres infinis de rayons \(R_1\lt R_2\), parcourus par des courants surfaciques \(j_1\) et \(j_2\) colinéaires à l'axe \(Oz\). Le cylindre intérieur est alimenté par l'intensité \(I\), qui revient par le cylindre extérieur.</p>
<ol><li>Calculer \(\vB\) dans tout l'espace.</li><li>En déduire la densité volumique d'énergie magnétique.</li><li>Quelle est l'énergie emmagasinée entre les plans de cote \(z\) et \(z+\ell\) ?</li><li>Déterminer l'inductance propre \(L\) de cette portion de câble et l'inductance par unité de longueur \(\mathscr L\).</li></ol>
${fig('td9', 'Câble coaxial : I monte dans le conducteur intérieur et redescend dans l’extérieur.')}`,
    parts: [
      {
        q: L`Champ dans tout l'espace.`,
        hints: [L`\(\vB = B(\rho)\,\ut\) ; cercle d'Ampère de rayon \(\rho\) dans les trois zones.`],
        steps: [
          L`Symétries comme pour un fil : \(\vB = B(\rho)\,\ut\). Ampère sur un cercle de rayon \(\rho\) : \(2\pi\rho B = \mo I_{enl}\).`,
          L`\(\rho\lt R_1\) : \(I_{enl} = 0\), donc \(B = 0\).`,
          L`\(R_1\lt\rho\lt R_2\) : \(I_{enl} = I\), donc \(B = \dfrac{\mo I}{2\pi\rho}\).`,
          L`\(\rho\gt R_2\) : \(I_{enl} = I - I = 0\), donc \(B = 0\). Le champ est confiné entre les deux conducteurs. (Courants surfaciques : \(j_1 = \dfrac{I}{2\pi R_1}\), \(j_2 = -\dfrac{I}{2\pi R_2}\), en A·m⁻¹.)`
        ]
      },
      {
        q: L`Densité d'énergie.`,
        hints: [L`\(w = B^2/(2\mo)\).`],
        steps: [L`\(w = \dfrac{B^2}{2\mo} = \dfrac{\mo I^2}{8\pi^2\rho^2}\) entre les cylindres, \(0\) ailleurs.`]
      },
      {
        q: L`Énergie dans une longueur \(\ell\).`,
        hints: [L`Volume élémentaire : couronne \(\d\tau = 2\pi\rho\,\ell\,\d\rho\).`],
        steps: [L`\(W = \int_{R_1}^{R_2}\dfrac{\mo I^2}{8\pi^2\rho^2}\,2\pi\rho\,\ell\,\d\rho = \dfrac{\mo I^2\ell}{4\pi}\ln\dfrac{R_2}{R_1}\).`]
      },
      {
        q: L`Inductance.`,
        hints: [L`\(W = \tfrac12LI^2\).`],
        steps: [L`\(\tfrac12LI^2 = \dfrac{\mo I^2\ell}{4\pi}\ln\dfrac{R_2}{R_1}\), donc \(L = \dfrac{\mo\ell}{2\pi}\ln\dfrac{R_2}{R_1}\) et \(\mathscr L = \dfrac{L}{\ell} = \dfrac{\mo}{2\pi}\ln\dfrac{R_2}{R_1}\) (H·m⁻¹). Exemple : \(R_2/R_1 = 3{,}5\) donne \(\mathscr L\approx0{,}25\ \mathrm{\mu H\cdot m^{-1}}\).`]
      }
    ],
    methodes: L`<ul><li>Ampère dans les trois zones.</li><li>Énergie par intégration de \(B^2/2\mo\) en coordonnées cylindriques.</li><li>Inductance par l'énergie.</li></ul>`,
    erreurs: [L`Oublier le retour du courant : à l'extérieur, le courant enlacé est nul.`, L`Prendre \(\d\tau = \d\rho\) au lieu de \(2\pi\rho\ell\,\d\rho\).`],
    an: [['ℒ pour R₂/R₁ = 3,5', 2.5055e-7, 'H/m']],
    retenir: L`Coaxial : champ confiné entre les conducteurs, \(\mathscr L = \dfrac{\mo}{2\pi}\ln\dfrac{R_2}{R_1}\). L'énergie donne l'inductance sans calculer de flux.`
  },
  {
    id: 'td10', n: 10, title: 'Ouverture d’un circuit inductif : surtension', theme: 'circuits', diff: 2,
    enonce: L`<p>Le circuit comprend une bobine d'inductance \(L\) et une résistance \(R\), alimentées par un générateur de tension \(E\). La résistance \(R_0\), très grande devant \(R\), représente l'air entre les contacts de l'interrupteur \(K\) juste après son ouverture.</p>
<ol><li>Déterminer \(i(t)\) lorsque l'interrupteur est fermé.</li><li>Le courant étant établi depuis longtemps, on ouvre l'interrupteur à \(t = 0\). Déterminer la tension \(u(t)\) aux bornes de l'interrupteur et montrer que, pendant un temps très court, \(u\) est supérieure à \(E\).</li></ol>
${fig('td10', 'Circuit L, R, E ; l’interrupteur K est shunté par R₀ (air entre les contacts).')}`,
    parts: [
      {
        q: L`Interrupteur fermé.`,
        hints: [L`\(K\) fermé court-circuite \(R_0\).`],
        steps: [L`\(R_0\) est court-circuitée : \(E = Ri + L\dt{i}\), \(i(0) = 0\), donc \(i(t) = \dfrac{E}{R}\left(1-\e^{-Rt/L}\right)\).`]
      },
      {
        q: L`Ouverture : tension aux bornes de \(K\).`,
        hints: [L`À \(t = 0^+\), le courant dans la bobine est continu : \(i(0^+) = E/R\).`, L`Le circuit devient \(E\), \(L\), \(R\), \(R_0\) en série.`],
        steps: [
          L`Après ouverture : \(E = (R+R_0)i + L\dt{i}\), avec \(i(0^+) = E/R\) (continuité du courant dans une bobine).`,
          L`\(i(t) = \dfrac{E}{R+R_0} + \left(\dfrac{E}{R}-\dfrac{E}{R+R_0}\right)\e^{-t/\tau'}\), où \(\tau' = \dfrac{L}{R+R_0}\) est très petit.`,
          L`\(u(t) = R_0\,i(t)\). Juste après l'ouverture : \(u(0^+) = \dfrac{R_0}{R}E\gg E\) puisque \(R_0\gg R\). La surtension décroît en quelques \(\tau'\) vers \(\dfrac{R_0E}{R+R_0}\approx E\).`,
          L`Interprétation : la bobine s'oppose à la chute brutale du courant (Lenz). Sa f.é.m. \(-L\,\d i/\d t\) devient énorme, d'où l'étincelle de rupture ; l'énergie \(\tfrac12L(E/R)^2\) est dissipée dans l'arc.`
        ]
      }
    ],
    methodes: L`<ul><li>Continuité du courant dans une bobine.</li><li>Équation du premier ordre avec second membre, constante de temps \(L/R_{tot}\).</li></ul>`,
    erreurs: [L`Écrire \(i(0^+) = E/(R+R_0)\) : le courant ne peut pas sauter dans une bobine.`, L`Confondre la tension aux bornes de \(K\) avec celle aux bornes de la bobine.`],
    an: [],
    retenir: L`Couper brutalement le courant d'une bobine crée une surtension \(\approx(R_0/R)E\). C'est pour cela qu'on protège les bobines (diode de roue libre, en électronique).`
  },
  {
    id: 'td11', n: 11, title: 'Transformateur : rapport des tensions', theme: 'machines', diff: 1,
    enonce: L`<p>Sur une carcasse de fer (C) sont bobinés deux enroulements distincts de \(N_1\) et \(N_2\) spires, de résistances \(R_1\) et \(R_2\). On applique aux bornes \(A_1B_1\) une tension alternative \(u_1\) de valeur efficace \(U_{eff1}\). On admet que toutes les lignes de champ sont canalisées par (C) et que les résistances des enroulements sont négligeables. Montrer qu'aux bornes de \(A_2B_2\) apparaît une tension \(u_2\) de valeur efficace \(U_{eff2}\) telle que \(\dfrac{U_{eff2}}{U_{eff1}} = \dfrac{N_2}{N_1}\).</p>
${fig('transfo', 'Carcasse de fer, primaire N₁ (A₁B₁) et secondaire N₂ (A₂B₂).')}`,
    parts: [
      {
        q: L`Démonstration.`,
        hints: [L`Lignes de champ canalisées : le même flux \(\phi(t)\) traverse chaque spire des deux enroulements.`, L`Résistances négligeables : \(u_k = -e_k\).`],
        steps: [
          L`Canalisation parfaite : chaque spire, du primaire comme du secondaire, est traversée par le même flux \(\phi(t)\). Flux totaux : \(\Phi_1 = N_1\phi\), \(\Phi_2 = N_2\phi\).`,
          L`F.é.m. : \(e_1 = -N_1\dt{\phi}\), \(e_2 = -N_2\dt{\phi}\).`,
          L`Résistances négligeables : \(u_1 = -e_1 = N_1\dt{\phi}\) et \(u_2 = -e_2 = N_2\dt{\phi}\) (conventions du cours).`,
          L`Donc \(\dfrac{u_2(t)}{u_1(t)} = \dfrac{N_2}{N_1}\) à chaque instant, et a fortiori pour les valeurs efficaces : \(\dfrac{U_{eff2}}{U_{eff1}} = \dfrac{N_2}{N_1} = m\). Le signe de \(u_2\) dépend du sens d'enroulement.`
        ]
      }
    ],
    methodes: L`<ul><li>Flux commun par spire (circuit magnétique parfait).</li><li>Faraday pour \(N\) spires : \(e = -N\,\d\phi/\d t\).</li></ul>`,
    erreurs: [L`Croire qu'un transformateur fonctionne en continu : sans variation de flux, \(u_2 = 0\).`],
    an: [],
    retenir: L`\(U_2/U_1 = N_2/N_1\) découle seulement de Faraday et du flux commun par spire.`
  },
  {
    id: 'td12', n: 12, tag: 'Ex. de cours', eyebrow: 'Exercice donné en cours · très probable au DS',
    title: 'Spire en translation : flux coupé et loi de Faraday', theme: 'lorentz', diff: 2,
    enonce: L`<p>Une spire rectangulaire \((C)\) de largeur \(L\) et de hauteur \(h\) se déplace à vitesse uniforme \(\ve = v_e\,\vec i\) dans une région où règne un champ magnétique uniforme et statique \(\vB = B\,\vec k\). À \(t = 0\), la spire est dans le plan \(x = 0\) ; pendant \(\d t\), elle balaie une surface élémentaire \(\d S\).</p>
<ol>
<li>Déterminer le champ électromoteur \(\Em\) dû au mouvement de la spire dans le champ magnétique.</li>
<li>Pendant \(\d t\), la spire balaie une surface élémentaire \(\d S\) : a) exprimer le déplacement élémentaire \(\d\vec r\) en fonction de \(\ve\) et \(\d t\) ; b) déterminer \(\d S\) en fonction de \(L\) et \(\d r\) ; c) orienter le vecteur surface élémentaire \(\d\vec S\).</li>
<li>Déterminer le flux magnétique coupé par la spire pendant \(\d t\).</li>
<li>Déterminer le flux coupé par un conducteur rectiligne de longueur \(L\), puis par la spire, pendant \(\d t\).</li>
<li>Déterminer la f.é.m. induite dans la spire par les deux méthodes : a) circulation du champ électromoteur, \(e = \oint_{(C)}\Em\cdot\dl\) ; b) loi de Faraday, \(e = -\d\Phi_B/\d t\).</li>
<li>Comparer les deux résultats et conclure.</li>
</ol>
${fig('coupe', 'La spire est dans le plan x = 0 (L selon j, h selon k), B est vertical, la vitesse selon i. En pointillé, sa position à t + dt ; en grisé, les bandes balayées par les deux côtés de longueur L.')}`,
    notes: L`<p>Le texte dit que la spire est « orientée dans le plan \((x,y)\) », mais il précise aussi qu'elle est dans le plan \(x = 0\), et le schéma la dessine verticale : \(L\) selon \(\vec j\), \(h\) selon \(\vec k\). La correction suit le schéma (spire dans le plan \((y,z)\), donc \(\vB\) est <b>dans</b> le plan de la spire). Avec l'autre lecture (spire horizontale, \(\vB\) normal à la spire), les conclusions sont les mêmes : \(e = 0\). C'est précisé à chaque question.</p>`,
    parts: [
      {
        q: L`Champ électromoteur \(\Em\).`,
        hints: [L`Circuit mobile dans un champ permanent : induction de Lorentz.`, L`Base directe : \(\vec i\wedge\vec j = \vec k\), \(\vec j\wedge\vec k = \vec i\), \(\vec k\wedge\vec i = \vec j\). Donc \(\vec i\wedge\vec k = -\vec j\).`],
        steps: [
          L`Les porteurs de charge \(q\) sont entraînés avec la spire à la vitesse \(\ve\) et subissent la force magnétique \(q\,\ve\wedge\vB\). Le champ électromoteur est cette force par unité de charge :`,
          L`\[\Em = \ve\wedge\vB = v_eB\,(\vec i\wedge\vec k) = -v_eB\,\vec j.\]`,
          L`\(\Em\) est <b>uniforme</b> (même vecteur en tout point de la spire) et dirigé selon \(-\vec j\), c'est-à-dire parallèle aux deux côtés de longueur \(L\) et perpendiculaire aux deux côtés de hauteur \(h\).`
        ]
      },
      {
        q: L`Déplacement \(\d\vec r\), surface balayée \(\d S\) et orientation de \(\d\vec S\).`,
        hints: [L`Un côté de longueur \(L\) qui avance de \(\d r\) perpendiculairement à lui-même balaie un rectangle.`, L`Convention du cours : l'élément \(\dl\) qui se déplace de \(\d\vec r\) balaie \(\d\vec S = \d\vec r\wedge\dl\). Il faut d'abord choisir le sens positif de la spire.`],
        steps: [
          L`<b>a)</b> Mouvement de translation uniforme : tous les points de la spire ont la même vitesse, donc \(\d\vec r = \ve\,\d t = v_e\,\d t\,\vec i\).`,
          L`<b>b)</b> Un côté de longueur \(L\) (selon \(\vec j\)) avance de \(\d r = v_e\,\d t\) selon \(\vec i\), perpendiculairement à lui-même. Il balaie un rectangle de côtés \(L\) et \(\d r\) : \(\d S = L\,\d r = L\,v_e\,\d t\). (Un côté de hauteur \(h\) balaie de même \(h\,\d r\), dans le plan \((x,z)\).)`,
          L`<b>c)</b> On oriente la spire : sens positif \(+\vec j\) sur le côté du bas, \(+\vec k\) sur le côté \(y = L\), \(-\vec j\) en haut, \(-\vec k\) en \(y = 0\). Par la règle de la main droite, sa normale est \(\vn = \vec j\wedge\vec k = +\vec i\).`,
          L`Avec \(\d\vec S = \d\vec r\wedge\dl\) : côté du bas (\(\dl = \d y\,\vec j\), longueur totale \(L\)) : \(\d\vec S_{\text{bas}} = v_e\d t\,\vec i\wedge L\,\vec j = +L\,v_e\,\d t\,\vec k\). Côté du haut (\(\dl\) selon \(-\vec j\)) : \(\d\vec S_{\text{haut}} = -L\,v_e\,\d t\,\vec k\).`,
          L`Côtés verticaux (\(\dl\) selon \(\pm\vec k\)) : \(\d\vec S = \d\vec r\wedge(\pm h\,\vec k) = \mp h\,v_e\,\d t\,\vec j\), donc selon \(\pm\vec j\), perpendiculaire à \(\vB\).`
        ]
      },
      {
        q: L`Flux coupé par la spire pendant \(\d t\).`,
        hints: [L`Le flux coupé est la somme des flux de \(\vB\) à travers les quatre bandes balayées.`, L`\(\vB\cdot\vec j = 0\) : les côtés verticaux ne coupent aucune ligne de champ.`],
        steps: [
          L`\(\d\Phi_c = \sum\vB\cdot\d\vec S = B\vec k\cdot(L v_e\d t\,\vec k) + B\vec k\cdot(-L v_e\d t\,\vec k) + 0 + 0\).`,
          L`\[\d\Phi_c = BLv_e\,\d t - BLv_e\,\d t = 0.\]`,
          L`Interprétation : \(\vB\) étant uniforme, le côté du bas et le côté du haut coupent exactement le même nombre de lignes de champ, mais ils sont parcourus en sens opposés : leurs contributions s'annulent.`
        ]
      },

<h3>Auto-induction, mutuelle</h3>
<div class="it">\(\Phi_p = Li\) (H) ; \(e = -L\,\d i/\d t\) ; \(u = Ri + L\,\d i/\d t\). Courant <b>continu</b> dans une bobine.</div>
<div class="it">\(W = \frac12Li^2\) ; \(w = \dfrac{B^2}{2\mo}\). Solénoïde \(L = \mo N^2S/\ell\). Tore \(L = \frac{\mo N^2a}{\pi}\ln\frac{R+a}{R-a}\). Coaxial \(\mathscr L = \frac{\mo}{2\pi}\ln\frac{R_2}{R_1}\).</div>
<div class="it">\(L\) : par le flux (\(\Phi_p/i\)) ou par l'énergie (\(\iiint B^2/2\mo = \frac12Li^2\)).</div>
<div class="it">\(\Phi_{1\to2} = Mi_1\) ; <b>Neumann</b> \(M_{12} = M_{21}\) (signe selon orientations). \(e_1 = -L_1\dot\imath_1 - M\dot\imath_2\). \(E_m = \frac12L_1i_1^2 + \frac12L_2i_2^2 + Mi_1i_2\). Bobine sur solénoïde \(M = \mo N_1N_2S/\ell\).</div>

<h3>Circuits et machines</h3>
<div class="it">RL : \(I = \frac ER(1-\e^{-t/\tau})\), rupture \(I_0\e^{-t/\tau}\), \(\tau = L/R\) (63 %, tangente). Ouverture brutale : surtension.</div>
<div class="it">LC : \(\ddot Q + Q/LC = 0\), \(\omega = 1/\sqrt{LC}\), \(Q_0^2/2C = \frac12LI_0^2\).</div>
<div class="it">Machines (ARQS) : \(e = -\omega\,\d\Phi/\d\theta\), \(\Gamma = i\,\d\Phi/\d\theta\), \(P_e + P_m = 0\). Moteur CC : \(U = E' + RI\), \(E'\propto\omega\).</div>
<div class="it">Transformateur parfait (\(R_k\approx0\), \(L_k = kN_k^2\), \(M = kN_1N_2\)) : \(U_2/U_1 = N_2/N_1 = m\), \(I_2/I_1 = 1/m\) ; alternatif seulement.</div>
<div class="it">Foucault : \(\vj = \sigma\ve\wedge\vB\) ; freinage \(\propto v\) ; tôles feuilletées ; effet de peau.</div>

<h3>Pièges majeurs</h3>
<ul>
<li class="warn">Oublier d'orienter, ou ne pas conclure sur le sens réel.</li>
<li class="warn">« Le champ induit est opposé à \(\vB\) » : non, à la <b>variation</b> du flux.</li>
<li class="warn">Faraday sur un circuit ouvert : passer par \(\Em\).</li>
<li class="warn">Oublier le facteur \(N\) (flux) ou \(N^2\) (inductance).</li>
<li class="warn">Prendre la surface de la spire au lieu de celle où règne le champ.</li>
<li class="warn">Couple d'un générateur positif : il est résistant.</li>
<li class="warn">\(i(0^+)\) discontinu dans une bobine.</li>
</ul>
`;

/**
 * @typedef {{s:'ok'|'rev', t:number}} ExoStatus
 * @typedef {{b:number, due:number, ok:number, ko:number}} CardState
 * @typedef {{v:number, ex:Object<string,ExoStatus>, recent:string[], cards:Object<string,CardState>,
 *   qcm:Object<string,{ok:number,ko:number}>, vf:Object<string,{ok:number,ko:number}>,
 *   tests:{t:number,score:number,n:number,theme:string}[], colles:{t:number,sujet:string,note:number}[],
 *   chap:Object<string,number>, dsDate:string|null, days:string[]}} State
 */
/** @returns {State} */
function blankState() { return { v: 1, ex: {}, recent: [], cards: {}, qcm: {}, vf: {}, tests: [], colles: [], chap: {}, dsDate: null, days: [] }; }
const Store = {
  ok: true,
  /** @type {State} */ s: blankState(),
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); this.s = Object.assign(blankState(), o); }
    } catch (e) { this.ok = false; }
  },
  save() {
    const d = new Date().toISOString().slice(0, 10);
    if (!this.s.days.includes(d)) { this.s.days.push(d); if (this.s.days.length > 120) this.s.days.shift(); }
    try { localStorage.setItem(KEY, JSON.stringify(this.s)); } catch (e) { this.ok = false; }
  },
  reset() { this.s = blankState(); this.save(); }
};
/** Marque un exercice (id TD 'td3' ou banque 'b12'). */
function setExo(id, s) { Store.s.ex[id] = { s, t: Date.now() }; touch(id); Store.save(); }
function touch(id) { const r = Store.s.recent.filter(x => x !== id); r.unshift(id); Store.s.recent = r.slice(0, 12); Store.save(); }
function exoStatus(id) { const e = Store.s.ex[id]; return e ? e.s : null; }
/** Leitner : boîtes 0..4, intervalles en jours. */
const BOX_DAYS = [0, 1, 3, 7, 15];
function rateCard(id, good) {
  const c = Store.s.cards[id] || { b: 0, due: 0, ok: 0, ko: 0 };
  if (good) { c.b = Math.min(4, c.b + 1); c.ok++; } else { c.b = 0; c.ko++; }
  c.due = today0() + BOX_DAYS[c.b] * DAY;
  Store.s.cards[id] = c; Store.save();
}
function scoreQ(kind, id, good) {
  const m = Store.s[kind]; const c = m[id] || { ok: 0, ko: 0 }; good ? c.ok++ : c.ko++; m[id] = c; Store.save();
}
/** Indice de maîtrise par thème (0..1) et nombre d'éléments vus. */
function mastery() {
  const res = {}; Object.keys(THEMES).forEach(k => res[k] = { pts: 0, max: 0, rev: 0 });
  const add = (th, p, m) => { if (res[th]) { res[th].pts += p; res[th].max += m; } };
  ALL_EXOS.forEach(x => { const s = exoStatus(x.id); if (s) { add(x.theme, s === 'ok' ? 1 : 0, 1); if (s === 'rev') res[x.theme].rev++; } });
  FLASH.forEach(c => { const st = Store.s.cards[c.id]; if (st) add(c.theme, st.b / 4, 1); if (st && st.b === 0 && st.ko) res[c.theme].rev++; });
  QCM.forEach(q => { const st = Store.s.qcm[q.id]; if (st) { add(q.theme, st.ok / (st.ok + st.ko), 1); if (st.ko > st.ok) res[q.theme].rev++; } });
  VF.forEach(q => { const st = Store.s.vf[q.id]; if (st) { add(q.theme, st.ok / (st.ok + st.ko), 1); if (st.ko > st.ok) res[q.theme].rev++; } });
  return res;
}

const Views = {};

  go(hash) { location.hash = hash; },
  render() {
    cleanup.forEach(f => { try { f(); } catch (e) { /* rien */ } }); cleanup = [];
    let h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'accueil';
    const [path, query] = h.split('?');
    const parts = path.split('/');

    const anchor = Router.pendingAnchor; Router.pendingAnchor = null;

const S = {
  /** Flèche de (x1,y1) à (x2,y2). */
  arrow(x1, y1, x2, y2, cls, w) {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 8, s = 4;
    const bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a);
    const p = [x2, y2, bx + s * Math.sin(a), by - s * Math.cos(a), bx - s * Math.sin(a), by + s * Math.cos(a)].map(v => v.toFixed(1)).join(' ');
    const c = cls || 'k';
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + bx.toFixed(1) + '" y2="' + by.toFixed(1) + '" class="' + c + (c.endsWith('s') || c === 'k' ? '' : 's') + '" stroke-width="' + (w || 1.6) + '"/>' +
      '<polygon points="' + p + '" class="' + (c === 'k' ? 'kf' : c.replace(/s$/, '')) + '"/>';
  },
  /** Champ sortant (⊙) ou entrant (⊗). */
  dot(x, y, cls) { return '<circle cx="' + x + '" cy="' + y + '" r="7" class="' + (cls || 'Bs') + '" stroke-width="1.4"/><circle cx="' + x + '" cy="' + y + '" r="1.8" class="' + (cls || 'Bs').replace(/s$/, '') + '"/>'; },
  cross(x, y, cls) { const c = (cls || 'Bs'); return '<circle cx="' + x + '" cy="' + y + '" r="7" class="' + c + '" stroke-width="1.4"/><path d="M' + (x - 4) + ' ' + (y - 4) + 'L' + (x + 4) + ' ' + (y + 4) + 'M' + (x + 4) + ' ' + (y - 4) + 'L' + (x - 4) + ' ' + (y + 4) + '" class="' + c + '" stroke-width="1.4"/>'; },
  t(x, y, s, cls, anchor) { return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + s + '</text>'; },
  svg(w, h, body, label) { return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img" aria-label="' + (label || 'schéma') + '">' + body + '</svg>'; },
  /** Petite boucle fléchée (sens de parcours) autour de (cx,cy). */
  loopArrow(cx, cy, r, cw, cls) {
    const c = cls || 'Is';

  }
};

// @ts-check
/* Animations interactives sur canvas (requestAnimationFrame). Chaque animation :
   { title, lead, ctrls:[{k, label, min, max, step, v, unit}], modes?, h (hauteur), draw(ctx, w, h, st, p) }
   st = état interne (temps t...), p = valeurs des curseurs. */
const Anim = {
  live: new Set(),
  pal: null,
  colors() {
    if (this.pal) return this.pal;
    const cs = getComputedStyle(document.documentElement);
    const g = k => cs.getPropertyValue(k).trim() || '#888';
    this.pal = { ink: g('--ink'), ink3: g('--ink-3'), line: g('--line-2'), B: g('--fieldB'), I: g('--cur'), E: g('--fieldE'), F: g('--flux'), bg: g('--surface-2'), acc: g('--accent'), soft: g('--accent-soft') };
    return this.pal;
  },
  recolor() { this.pal = null; },
  mount(slot, key) {
    const def = ANIMS[key];
    if (!def) { slot.innerHTML = '<p class="muted small">Animation indisponible.</p>'; return; }
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const p = {}; (def.ctrls || []).forEach(c => p[c.k] = c.v);
    if (def.modes) p.mode = def.modes[0][0];
    slot.innerHTML = '<div class="sim"><div class="row"><h4 style="margin:0">' + def.title + '</h4><span class="sp"></span>' +
      '<button class="btn sm" data-a="play" aria-label="Pause">⏸ Pause</button><button class="btn sm" data-a="reset">↺ Recommencer</button></div>' +
      '<p class="lead">' + def.lead + '</p>' +
      (def.modes ? '<div class="chips" style="margin-bottom:8px">' + def.modes.map(m => '<button class="chip' + (m[0] === p.mode ? ' on' : '') + '" data-mode="' + m[0] + '">' + m[1] + '</button>').join('') + '</div>' : '') +
      '<canvas height="' + def.h + '" aria-label="' + def.title + '"></canvas><div class="ro"></div>' +
      '<div class="ctrls">' + (def.ctrls || []).map(c => '<label class="field">' + c.label + ' <span class="muted" data-v="' + c.k + '"></span><input type="range" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '" value="' + c.v + '" data-k="' + c.k + '"></label>').join('') + '</div></div>';
    const cv = /** @type {HTMLCanvasElement} */ (slot.querySelector('canvas'));
    const ro = slot.querySelector('.ro');
    const st = { t: 0, run: !reduced, x: 0 };
    const showV = () => (def.ctrls || []).forEach(c => { const el = slot.querySelector('[data-v="' + c.k + '"]'); if (el) el.textContent = '= ' + fmtNum(p[c.k], 3) + (c.unit ? ' ' + c.unit : ''); });
    showV();
    slot.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => { p[inp.getAttribute('data-k')] = parseFloat(inp.value); showV(); if (def.onChange) def.onChange(st, p); if (!st.run) frame(0); }));
    slot.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { p.mode = b.getAttribute('data-mode'); slot.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b)); st.t = 0; if (def.onChange) def.onChange(st, p); frame(0); }));
    const playBtn = slot.querySelector('[data-a="play"]');
    const setBtn = () => { playBtn.textContent = st.run ? '⏸ Pause' : '▶ Lecture'; playBtn.setAttribute('aria-label', st.run ? 'Pause' : 'Lecture'); };
    setBtn();
    playBtn.addEventListener('click', () => { st.run = !st.run; setBtn(); last = performance.now(); });
    slot.querySelector('[data-a="reset"]').addEventListener('click', () => { st.t = 0; if (def.onChange) def.onChange(st, p); frame(0); });
    let w = 0, dpr = 1;
    const size = () => { dpr = window.devicePixelRatio || 1; w = cv.clientWidth || 600; cv.width = Math.round(w * dpr); cv.height = Math.round(def.h * dpr); cv.style.height = def.h + 'px'; };
    size();
    const robs = new ResizeObserver(() => { size(); frame(0); }); robs.observe(cv);
    function frame(dt) {
      const ctx = cv.getContext('2d'); if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, def.h);
      const txt = def.draw(ctx, w, def.h, st, p, dt, Anim.colors());
      if (txt) ro.innerHTML = txt.map(s => '<span>' + s + '</span>').join('');
    }
    let last = performance.now(), raf = 0, alive = true;
    const loop = now => {
      if (!alive) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (st.run && document.visibilityState === 'visible') { st.t += dt; frame(dt); }
      raf = requestAnimationFrame(loop);
    };
    if (def.onChange) def.onChange(st, p);
    frame(0); raf = requestAnimationFrame(loop);
    onLeave(() => { alive = false; cancelAnimationFrame(raf); robs.disconnect(); });
  }
};

/* ---------- aides de dessin ---------- */
const G = {
  line(ctx, x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w || 1.5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); },
  arrow(ctx, x1, y1, x2, y2, col, w) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1); if (L < 2) return;
    G.line(ctx, x1, y1, x2 - 7 * Math.cos(a), y2 - 7 * Math.sin(a), col, w || 2);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 10 * Math.cos(a) + 4.5 * Math.sin(a), y2 - 10 * Math.sin(a) - 4.5 * Math.cos(a));
    ctx.lineTo(x2 - 10 * Math.cos(a) - 4.5 * Math.sin(a), y2 - 10 * Math.sin(a) + 4.5 * Math.cos(a)); ctx.closePath(); ctx.fill();
  },
  text(ctx, s, x, y, col, size, align) { ctx.fillStyle = col; ctx.font = (size || 12) + 'px Inter, sans-serif'; ctx.textAlign = align || 'left'; ctx.fillText(s, x, y); },
  /** Tracé de courbes dans un cadre. fns : [{f(t), col, label}] */
  plot(ctx, x, y, w, h, fns, t0, t1, ymin, ymax, P, cursor) {
    G.line(ctx, x, y + h / 2, x + w, y + h / 2, P.line, 1);
    if (ymin >= 0) G.line(ctx, x, y + h, x + w, y + h, P.line, 1);
    G.line(ctx, x, y, x, y + h, P.line, 1);
    const Y = v => y + h - (v - ymin) / (ymax - ymin) * h;
    fns.forEach((fn, k) => {
      ctx.strokeStyle = fn.col; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i <= w; i += 2) { const t = t0 + (t1 - t0) * i / w; const v = Math.max(ymin, Math.min(ymax, fn.f(t))); i ? ctx.lineTo(x + i, Y(v)) : ctx.moveTo(x + i, Y(v)); }
      ctx.stroke();
      if (fn.label) G.text(ctx, fn.label, x + 6 + k * 90, y + 12, fn.col, 12);
    });
    if (cursor !== undefined && cursor >= t0 && cursor <= t1) { const cx = x + (cursor - t0) / (t1 - t0) * w; G.line(ctx, cx, y, cx, y + h, P.ink3, 1); }
  },
  spiral(ctx, cx, cy, rx, ry, col) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); },
  dot(ctx, x, y, col) { ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.stroke(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill(); },
  cross(ctx, x, y, col) { ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.moveTo(x - 3, y - 3); ctx.lineTo(x + 3, y + 3); ctx.moveTo(x + 3, y - 3); ctx.lineTo(x - 3, y + 3); ctx.stroke(); }
};
const fx = (v, d) => fmtNum(v, d || 3);

const ANIMS = {
  lenz: {
    title: 'Aimant et spire : loi de Faraday et loi de Lenz', h: 300,
    lead: 'L’aimant (nord vers la spire) oscille le long de l’axe. Le flux, la f.é.m. et le sens du courant induit sont calculés en direct (modèle dipolaire, unités arbitraires). La spire est orientée par n dans le sens du champ de l’aimant (vers la gauche) : Φ > 0.',
    ctrls: [{ k: 'f', label: 'Fréquence d’oscillation', min: 0.1, max: 1, step: 0.05, v: 0.3, unit: 'Hz' }, { k: 'A', label: 'Amplitude', min: 0.5, max: 2.5, step: 0.1, v: 1.8, unit: 'u.a.' }],
    draw(ctx, w, h, st, p, dt, P) {
      const om = 2 * Math.PI * p.f;
      const xpos = t => 2.2 + p.A * Math.cos(om * t);         // distance aimant-spire (u.a.)
      const phi = t => 1 / Math.pow(1 + xpos(t) * xpos(t), 1.5); // flux d'un dipôle sur l'axe
      const emf = t => -(phi(t + 1e-3) - phi(t - 1e-3)) / 2e-3;
      const t = st.t, X = xpos(t), e = emf(t);
      const T0 = 1 / p.f; let phiMax = 0, eMax = 0;
      for (let k = 0; k < 200; k++) { const s = k * T0 / 200; phiMax = Math.max(phiMax, phi(s)); eMax = Math.max(eMax, Math.abs(emf(s))); }
      const cy = 95, sx = Math.min(140, w * 0.25), scale = (w - sx - 60) / 5;
      // spire (vue de profil)
      G.spiral(ctx, sx, cy, 12, 55, P.ink);
      G.arrow(ctx, sx, cy, sx - 40, cy, P.F, 1.6); G.text(ctx, 'n', sx - 50, cy - 6, P.F, 13);
      // champ de l'aimant au niveau de la spire : il sort du pôle N, donc vers la gauche (même sens que n)

/* ===== components.js ===== */

/* Composants partagés par les vues : en-têtes, puces, rendu d'un exercice, filtres. */

function pageHead(eyebrow, title, lead) {
  return '<header class="page-h"><span class="eyebrow">' + eyebrow + '</span><h1>' + title + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + '</header>';
}
function diffDots(d) { return '<span class="chip" title="Difficulté ' + d + ' sur 3">' + '●'.repeat(d) + '○'.repeat(3 - d) + '</span>'; }
function themeChip(th) { return '<span class="chip">' + (THEMES[th] || th) + '</span>'; }
function typeChip(x) { return x.kind === 'td' ? '<span class="chip">' + (x.tag || 'TD2') + '</span>' : '<span class="chip">' + TYPES[x.type] + '</span>'; }
function stDot(id) { const s = exoStatus(id); return '<span class="st ' + (s === 'ok' ? 'ok' : s === 'rev' ? 'rev' : '') + '" title="' + (s === 'ok' ? 'Maîtrisé' : s === 'rev' ? 'À revoir' : 'Pas encore travaillé') + '"></span>'; }
function exoHref(x) { return x.kind === 'td' ? '#td/' + x.n : '#exos/' + x.id; }
function exoLabel(x) { return x.kind === 'td' ? (x.tag || 'TD2 · Ex. ' + x.n) : x.id.toUpperCase(); }

/** Ligne de liste d'exercice. */
function exoItem(x) {
  return '<a class="ex-item" href="' + exoHref(x) + '"><span class="qnum">' + exoLabel(x) + '</span><div><h4>' + x.title + '</h4><p>' + (THEMES[x.theme] || '') + ' · ' + (x.kind === 'td' ? (x.tag ? 'Fait en cours · probable au DS' : 'TD2') : TYPES[x.type]) + '</p></div><span class="row" style="gap:8px">' + diffDots(x.diff) + stDot(x.id) + '</span></a>';

  $('#close-all').addEventListener('click', () => $$('details', app).forEach(d => d.open = false));

/** Filtres génériques : groups = [{key, label, opts:[[val, label]]}] ; état dans l'URL (query). */

function themeSelect(cur) { return '<select id="f-theme" aria-label="Thème"><option value="">Tous les thèmes</option>' + THEME_OPTS.map(([k, l]) => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>'; }

Views.flash = (app, parts, q) => {
  const th = q.get('theme') || '', mode = q.get('mode') || 'due';
  let deck = FLASH.filter(c => !th || c.theme === th);
  if (mode === 'due') deck = deck.filter(c => { const st = Store.s.cards[c.id]; return !st || st.due <= Date.now(); });
  deck = shuffle(deck);
  let i = 0, flipped = false, good = 0;
  const head = pageHead('Révision active', 'Flashcards', 'Lis la question, réponds dans ta tête, retourne la carte (clic ou espace), puis sois honnête.') +
    '<div class="row" style="margin-bottom:14px">' + themeSelect(th) + '<select id="f-mode" aria-label="Cartes"><option value="due"' + (mode === 'due' ? ' selected' : '') + '>À réviser aujourd’hui</option><option value="all"' + (mode === 'all' ? ' selected' : '') + '>Toutes les cartes</option></select></div>';
  const go = () => { const nq = new URLSearchParams(); const t = $('#f-theme').value, m = $('#f-mode').value; if (t) nq.set('theme', t); if (m !== 'due') nq.set('mode', m); Router.go('flash' + (nq.toString() ? '?' + nq : '')); };
  const draw = () => {
    if (!deck.length) { app.innerHTML = head + '<div class="empty"><p>Aucune carte à réviser ici pour aujourd’hui.</p><p><a class="btn" href="#flash?mode=all' + (th ? '&theme=' + th : '') + '">Revoir toutes les cartes</a></p></div>'; bind(); return; }
    if (i >= deck.length) { app.innerHTML = head + '<div class="card" style="text-align:center"><div class="big">' + good + ' / ' + deck.length + '</div><p>cartes sues dans cette série.</p><p><a class="btn primary" href="#flash">Nouvelle série</a> <a class="btn" href="#reviser">Autres modes</a></p></div>'; bind(); return; }
    const c = deck[i];
    app.innerHTML = head + '<div class="progress" style="margin-bottom:10px"><i style="width:' + Math.round(100 * i / deck.length) + '%"></i></div>' +
      '<div class="flash-wrap"><div class="card flash" id="card" tabindex="0" role="button" aria-label="Retourner la carte"><span class="chip face-lbl">' + (flipped ? 'Réponse' : 'Question') + ' · ' + THEMES[c.theme] + '</span><div>' + (flipped ? c.a : c.q) + '</div></div></div>' +
      '<div class="row" style="margin-top:12px;justify-content:center">' + (flipped ? '<button class="btn bad" id="ko">↻ À revoir</button><button class="btn good" id="ok">✓ Je savais</button>' : '<button class="btn soft" id="flip">Retourner</button>') + '</div>' +
      '<p class="muted small" style="text-align:center">Carte ' + (i + 1) + ' / ' + deck.length + '</p>';
    bind(); typeset(app);
    const flip = () => { flipped = !flipped; draw(); };
    $('#card').addEventListener('click', flip);
    if ($('#flip')) $('#flip').addEventListener('click', flip);
    const rate = g => { rateCard(c.id, g); if (g) good++; i++; flipped = false; draw(); };
    if ($('#ok')) { $('#ok').addEventListener('click', () => rate(true)); $('#ko').addEventListener('click', () => rate(false)); }
  };
  const bind = () => { $('#f-theme').addEventListener('change', go); $('#f-mode').addEventListener('change', go); };
  const key = e => { if (e.target && /** @type {HTMLElement} */ (e.target).tagName === 'SELECT') return; if (e.code === 'Space' && $('#card')) { e.preventDefault(); $('#card').click(); } };
  document.addEventListener('keydown', key); onLeave(() => document.removeEventListener('keydown', key));
  draw();
};

/** Série de questions à choix (QCM ou vrai/faux) avec correction immédiate. */
function choiceSeries(app, kind, title, lead, items, th) {
  const head = pageHead('Révision active', title, lead) + '<div class="row" style="margin-bottom:14px">' + themeSelect(th) + '</div>';
  let i = 0, score = 0;
  const qs = shuffle(items).slice(0, 10);
  const go = () => { const t = $('#f-theme').value; Router.go(kind + (t ? '?theme=' + t : '')); };
  const draw = () => {
    if (!qs.length) { app.innerHTML = head + '<div class="empty">Aucune question pour ce thème.</div>'; $('#f-theme').addEventListener('change', go); return; }
    if (i >= qs.length) { app.innerHTML = head + '<div class="card" style="text-align:center"><div class="big">' + score + ' / ' + qs.length + '</div><p>' + (score === qs.length ? 'Parfait.' : 'Les questions ratées sont comptées dans les notions à revoir.') + '</p><p><a class="btn primary" href="#' + kind + (th ? '?theme=' + th : '') + '">Nouvelle série</a> <a class="btn" href="#reviser">Autres modes</a></p></div>'; $('#f-theme').addEventListener('change', go); return; }
    const x = qs[i];
    const opts = kind === 'vf' ? [['v', 'Vrai'], ['f', 'Faux']] : shuffle(x.o.map((o, k) => [String(k), o]));
    app.innerHTML = head + '<div class="progress" style="margin-bottom:10px"><i style="width:' + Math.round(100 * i / qs.length) + '%"></i></div>' +
      '<div class="card"><span class="eyebrow">Question ' + (i + 1) + ' / ' + qs.length + ' · ' + THEMES[x.theme] + '</span><p style="font-family:var(--font-d);font-size:1.12rem">' + (kind === 'vf' ? x.s : x.q) + '</p>' +
      opts.map(o => '<button class="opt" data-o="' + o[0] + '">' + o[1] + '</button>').join('') + '<div id="why"></div></div>';
    $('#f-theme').addEventListener('change', go); typeset(app);
    $$('.opt', app).forEach(b => b.addEventListener('click', () => {
      const v = b.getAttribute('data-o'); const ok = kind === 'vf' ? (v === 'v') === x.v : v === '0';
      if (ok) score++; scoreQ(kind, x.id, ok);
      $$('.opt', app).forEach(o => { o.disabled = true; const good = kind === 'vf' ? (o.getAttribute('data-o') === 'v') === x.v : o.getAttribute('data-o') === '0'; if (good) o.classList.add('ok'); else if (o === b) o.classList.add('ko'); });
      $('#why').innerHTML = '<div class="why"><b>' + (ok ? 'Exact.' : 'Non.') + '</b> ' + x.why + '</div><div class="row" style="margin-top:12px"><button class="btn primary" id="next">' + (i + 1 < qs.length ? 'Question suivante' : 'Voir le score') + '</button></div>';
      typeset($('#why')); $('#next').addEventListener('click', () => { i++; draw(); }); $('#next').focus();
    }));
  };
  draw();
}
Views.qcm = (app, parts, q) => { const th = q.get('theme') || ''; choiceSeries(app, 'qcm', 'QCM expliqués', 'Séries de 10 questions tirées au hasard. Une seule bonne réponse par question.', QCM.filter(x => !th || x.theme === th), th); };
Views.vf = (app, parts, q) => { const th = q.get('theme') || ''; choiceSeries(app, 'vf', 'Vrai ou faux', 'Séries de 10 affirmations : chaque réponse est justifiée.', VF.filter(x => !th || x.theme === th), th); };

Views.test = (app) => {
  const intro = () => {
    const hist = Store.s.tests.slice(-5).reverse();
    app.innerHTML = pageHead('Révision active', 'Mini-test chronométré', '10 questions (QCM et vrai/faux) en temps limité, sans correction pendant le test. La correction complète s’affiche à la fin.') +
      '<div class="card row"><label class="field">Durée<select id="t-dur"><option value="5">5 min</option><option value="8" selected>8 min</option><option value="12">12 min</option></select></label><label class="field">Thème' + themeSelect('') + '</label><span class="sp"></span><button class="btn primary" id="t-go">Commencer</button></div>' +
      '<h2>Derniers tests</h2>' + (hist.length ? '<table class="tbl"><tr><th>Date</th><th>Thème</th><th>Score</th></tr>' + hist.map(t => '<tr><td>' + fmtDate(t.t) + '</td><td>' + (THEMES[t.theme] || 'Tous') + '</td><td>' + t.score + ' / ' + t.n + '</td></tr>').join('') + '</table>' : '<p class="muted">Aucun test pour l’instant.</p>');
    $('#t-go').addEventListener('click', () => run(+$('#t-dur').value, $('#f-theme').value));
  };
  let tid = 0; onLeave(() => clearInterval(tid));
  const run = (dur, th) => {
    const pool = shuffle(QCM.filter(x => !th || x.theme === th).map(x => ({ k: 'qcm', x })).concat(VF.filter(x => !th || x.theme === th).map(x => ({ k: 'vf', x })))).slice(0, 10);
    if (!pool.length) { toast('Pas de question pour ce thème.'); return; }
    const ans = {};
    let h = pageHead('Mini-test', 'En cours', '') + '<div class="card row" style="position:sticky;top:64px;z-index:5"><span class="timer" id="t-left"></span><span class="sp"></span><button class="btn primary" id="t-end">Terminer et corriger</button></div>';
    pool.forEach((it, n) => {
      const opts = it.k === 'vf' ? [['v', 'Vrai'], ['f', 'Faux']] : shuffle(it.x.o.map((o, k) => [String(k), o]));
      h += '<div class="card" style="margin-top:12px" data-q="' + n + '"><span class="eyebrow">' + (n + 1) + ' · ' + (it.k === 'vf' ? 'Vrai ou faux' : 'QCM') + '</span><p>' + (it.k === 'vf' ? it.x.s : it.x.q) + '</p>' + opts.map(o => '<button class="opt" data-n="' + n + '" data-o="' + o[0] + '">' + o[1] + '</button>').join('') + '<div class="res"></div></div>';
    });
    app.innerHTML = h; typeset(app);
    $$('.opt', app).forEach(b => b.addEventListener('click', () => { const n = b.getAttribute('data-n'); ans[n] = b.getAttribute('data-o'); $$('.opt[data-n="' + n + '"]', app).forEach(o => o.classList.toggle('on', o === b)); $$('.opt[data-n="' + n + '"]', app).forEach(o => o.style.borderColor = o === b ? 'var(--ink)' : ''); }));
    let left = dur * 60; const el = $('#t-left');
    const show = () => { el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); el.classList.toggle('low', left <= 30); };
    show(); tid = setInterval(() => { left--; show(); if (left <= 0) end(); }, 1000);
    const end = () => {
      clearInterval(tid); let score = 0;
      pool.forEach((it, n) => {
        const a = ans[n]; const ok = a !== undefined && (it.k === 'vf' ? (a === 'v') === it.x.v : a === '0');
        if (ok) score++; if (a !== undefined) scoreQ(it.k, it.x.id, ok);
        const card = $('[data-q="' + n + '"]', app);
        $$('.opt', card).forEach(o => { o.disabled = true; const good = it.k === 'vf' ? (o.getAttribute('data-o') === 'v') === it.x.v : o.getAttribute('data-o') === '0'; if (good) o.classList.add('ok'); else if (o.getAttribute('data-o') === a) o.classList.add('ko'); });
        card.querySelector('.res').innerHTML = '<div class="why"><b>' + (ok ? 'Exact.' : a === undefined ? 'Sans réponse.' : 'Non.') + '</b> ' + it.x.why + '</div>';
      });
      Store.s.tests.push({ t: Date.now(), score, n: pool.length, theme: th }); Store.save();
      $('#t-end').outerHTML = '<span><b>' + score + ' / ' + pool.length + '</b></span><a class="btn" href="#test">Nouveau test</a>';
      $('#t-left').textContent = 'Terminé'; typeset(app); window.scrollTo(0, 0);
    };
    $('#t-end').addEventListener('click', end);
  };
  intro();
};

Views.suivi = (app) => {
  const s = Store.s, m = mastery();
  const seenCards = Object.keys(s.cards).length, box4 = Object.values(s.cards).filter(c => c.b >= 3).length;
  let h = pageHead('Progression', 'Suivi', 'Ta progression est enregistrée dans ce navigateur (rien n’est envoyé ailleurs).');
  h += '<div class="grid g2"><div class="card"><h3>Date de la colle ou du DS</h3><div class="row"><input type="date" id="ds-date" value="' + (s.dsDate || '') + '"><button class="btn" id="ds-save">Enregistrer</button>' + (s.dsDate ? '<button class="btn" id="ds-clear">Effacer</button>' : '') + '</div><p class="muted small">Le tableau de bord affiche alors le compte à rebours.</p></div>' +
    '<div class="card"><h3>En chiffres</h3><ul class="small"><li>' + ALL_EXOS.filter(x => exoStatus(x.id) === 'ok').length + ' exercices maîtrisés, ' + ALL_EXOS.filter(x => exoStatus(x.id) === 'rev').length + ' à revoir</li><li>' + seenCards + ' flashcards vues, ' + box4 + ' bien ancrées</li><li>' + Object.keys(s.qcm).length + ' QCM et ' + Object.keys(s.vf).length + ' vrai/faux répondus</li><li>' + s.tests.length + ' mini-tests, ' + s.colles.length + ' colles blanches</li><li>' + CHAPS.filter(c => s.chap[c.id]).length + ' / ' + CHAPS.length + ' chapitres ouverts</li><li>' + s.days.length + ' jour' + (s.days.length > 1 ? 's' : '') + ' de révision</li></ul></div></div>';
  h += '<h2>Maîtrise par thème</h2><div class="card">' + Object.entries(m).map(([k, v]) => '<div class="bar"><a href="#exos?theme=' + k + '">' + THEMES[k] + '</a><div class="progress"><i style="width:' + (v.max ? Math.round(100 * v.pts / v.max) : 0) + '%"></i></div><span class="muted small">' + (v.max ? Math.round(100 * v.pts / v.max) + ' %' : '—') + '</span></div>').join('') + '<p class="muted small">Calcul : exercices maîtrisés, boîte des flashcards et réussite aux QCM et vrai/faux, par thème. « — » : rien de travaillé encore.</p></div>';
  const rev = ALL_EXOS.filter(x => exoStatus(x.id) === 'rev');
  h += '<h2>Exercices à revoir</h2>' + (rev.length ? '<div class="ex-list">' + rev.map(exoItem).join('') + '</div>' : '<p class="muted">Aucun.</p>');
  h += '<h2>Sauvegarde</h2><div class="card row"><button class="btn" id="exp">Exporter ma progression</button><label class="btn">Importer<input type="file" id="imp" accept="application/json" hidden></label><span class="sp"></span><button class="btn bad" id="reset">Tout effacer</button></div>';
  app.innerHTML = h;
  $('#ds-save').addEventListener('click', () => { s.dsDate = $('#ds-date').value || null; Store.save(); toast('Date enregistrée'); Router.render(); });
  if ($('#ds-clear')) $('#ds-clear').addEventListener('click', () => { s.dsDate = null; Store.save(); Router.render(); });
  $('#exp').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(s, null, 1)], { type: 'application/json' })); a.download = 'magneto-progression.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
  $('#imp').addEventListener('change', e => { const f = /** @type {HTMLInputElement} */ (e.target).files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (o.v !== 1) throw new Error('format'); Store.s = Object.assign(blankState(), o); Store.save(); toast('Progression importée'); Router.render(); } catch (err) { toast('Fichier non reconnu'); } }); });
  $('#reset').addEventListener('click', () => { if (confirm('Effacer toute la progression enregistrée dans ce navigateur ? Cette action est définitive.')) { Store.reset(); toast('Progression effacée'); Router.render(); } });
};
