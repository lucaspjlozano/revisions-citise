  answer: L`\(P_A=(X+1)^2(X-2)\), trigonalisable non diagonalisable, \(T\) et \(\exp(tA)\) ci-dessus.`,
  retenir: L`\(\exp(tA)=P\exp(tT)P^{-1}\) ; sur un bloc \(\lambda I+N\) avec \(N^2=0\) : \(e^{\lambda t}(I+tN)\).` },

{ n: 20, set: 'S4', part: 's4red', title: 'Extrema locaux avec les valeurs propres de la hessienne',
  statement: L`<ol><li>\(a\in\R^*\). Extrema locaux de \(f(x_1,x_2,x_3)=x_1^2-x_1+x_1x_2+x_2^2+ax_3^2\).</li><li>Extrema locaux de \(f=x_1x_2+x_2x_3+x_3x_1\).</li><li>Extrema locaux de \(f=a(x_1^2+x_2^2+x_3^2)+x_1x_2+x_2x_3+x_3x_1\), \(a\notin\{-1,\frac12\}\).</li><li>Extrema locaux de \(f=x_1^2-8x_1+2x_1x_2-14x_2+2x_2^2-4x_3-x_3^2\).</li></ol>`,
  idea: L`Points critiques (gradient nul), puis signe des valeurs propres de la hessienne : toutes \(\gt0\) ⇒ minimum local strict ; toutes \(\lt0\) ⇒ maximum local strict ; de signes opposés ⇒ pas d'extremum.`,
  parts: [
    { q: L`1) Premier cas`, steps: [
      L`\(\nabla f=(2x_1-1+x_2,\ x_1+2x_2,\ 2ax_3)=0\) : \(x_1=-2x_2\), \(-3x_2=1\), \(x_3=0\). Unique point critique \(\left(\frac23,-\frac13,0\right)\).`,
      L`\(H=\begin{pmatrix}2&1&0\\1&2&0\\0&0&2a\end{pmatrix}\), de valeurs propres \(1\), \(3\), \(2a\). Si \(a\gt0\) : minimum local strict. Si \(a\lt0\) : pas d'extremum.` ] },
    { q: L`2) Deuxième cas`, steps: [
      L`\(\nabla f=(x_2+x_3,\ x_1+x_3,\ x_1+x_2)=0\iff x=0\). \(H=\begin{pmatrix}0&1&1\\1&0&1\\1&1&0\end{pmatrix}\), \(P_H(X)=(X+1)^2(X-2)\).`,
      L`Valeurs propres \(2\) et \(-1\) : de signes opposés, pas d'extremum en \(0\).` ] },
    { q: L`3) Troisième cas`, steps: [
      L`\(f(x)=\frac12x^TH_ax\) avec \(H_a=2aI_3+H\) (\(H\) de la question 2) : valeurs propres \(2a+2\) et \(2a-1\) (double). Comme \(a\notin\{-1,\frac12\}\), \(H_a\) est inversible et \(\nabla f=H_ax=0\iff x=0\).`,
      L`\(a\gt\frac12\) : les deux valeurs propres sont \(\gt0\), minimum local strict en \(0\). \(-1\lt a\lt\frac12\) : \(2a+2\gt0\gt2a-1\), pas d'extremum. \(a\lt-1\) : les deux sont \(\lt0\), maximum local strict.` ] },
    { q: L`4) Quatrième cas`, steps: [
      L`\(\nabla f=(2x_1-8+2x_2,\ 2x_1-14+4x_2,\ -4-2x_3)=0\) : \(x_3=-2\), \(x_1+x_2=4\), \(x_1+2x_2=7\), donc le point critique \((1,3,-2)\).`,
      L`\(H=\begin{pmatrix}2&2&0\\2&4&0\\0&0&-2\end{pmatrix}\) : valeurs propres \(3\pm\sqrt5\gt0\) et \(-2\lt0\). Pas d'extremum.` ] } ],
  answer: L`1) min local en \((\frac23,-\frac13,0)\) si \(a\gt0\), rien si \(a\lt0\) ; 2) aucun ; 3) min si \(a\gt\frac12\), rien si \(-1\lt a\lt\frac12\), max si \(a\lt-1\) ; 4) aucun.`,
  retenir: L`La hessienne est symétrique, donc diagonalisable (théorème spectral) : on lit la nature du point critique sur le signe de ses valeurs propres.` },
/* ---------- Chapitre 3 : intégrales dépendant d'un paramètre ---------- */
{ n: 21, set: 'S4', part: 's4par', title: 'Intégration terme à terme : Σ 1/((2n+1)(2n+2)) et ln 2',
  statement: L`\(f_n(x)=x^{2n}(1-x)\) sur \(I=[0,1[\).
<ol><li>Calculer \(\int_0^1f_n(t)\,dt\).</li><li>Avec le théorème d'intégration terme à terme, calculer \(\sum_{n\geqslant0}\frac1{(2n+1)(2n+2)}\).</li><li>En déduire \(\sum_{n\geqslant1}\frac{(-1)^{n-1}}n\).</li></ol>`,
  idea: L`\(\sum f_n(x)=\frac{1-x}{1-x^2}=\frac1{1+x}\) (géométrique). Les \(f_n\) sont positives et \(\sum\int|f_n|\) converge : on peut intervertir somme et intégrale.`,
  parts: [
    { q: L`1) Intégrale de fₙ`, steps: [ L`\(\int_0^1(x^{2n}-x^{2n+1})\,dx=\frac1{2n+1}-\frac1{2n+2}=\frac1{(2n+1)(2n+2)}\).` ] },
    { q: L`2) Terme à terme`, steps: [
      L`Pour \(x\in[0,1[\) : \(\sum_{n\geqslant0}f_n(x)=(1-x)\sum_{n\geqslant0}x^{2n}=\frac{1-x}{1-x^2}=\frac1{1+x}\).`,
      L`Les \(f_n\) sont continues, positives, intégrables sur \([0,1[\), et \(\sum\int_0^1|f_n|=\sum\frac1{(2n+1)(2n+2)}\) converge (terme équivalent à \(\frac1{4n^2}\)).`,
      L`Le théorème d'intégration terme à terme donne
<div class="math">\[ \begin{aligned}\sum_{n\geqslant0}\frac1{(2n+1)(2n+2)}&=\int_0^1\frac{dx}{1+x}\\ &=\ln2.\end{aligned} \]</div>` ] },
    { q: L`3) Série harmonique alternée`, steps: [
      L`\(\frac1{(2n+1)(2n+2)}=\frac1{2n+1}-\frac1{2n+2}\), donc \(\sum_{n=0}^{N-1}\frac1{(2n+1)(2n+2)}=\sum_{k=1}^{2N}\frac{(-1)^{k-1}}k=S_{2N}\).`,
      L`\(\sum\frac{(-1)^{k-1}}k\) converge (séries alternées) et sa somme est la limite de \(S_{2N}\) : \(\sum_{n\geqslant1}\frac{(-1)^{n-1}}n=\ln2\).` ] } ],
  answer: L`\(\int_0^1f_n=\frac1{(2n+1)(2n+2)}\) ; les deux sommes valent \(\ln2\).`,
  retenir: L`Intégration terme à terme : il suffit que \(\sum_n\int_I|f_n|\) converge.` },

{ n: 22, set: 'S4', part: 's4par', title: 'Une fonction intégrable avec une infinité de discontinuités',
  statement: L`\(f:[0,1]\to\R\), \(f(0)=0\) et \(f(x)=(-1)^n\) pour \(x\in I_n:=\left]\frac1{n+1},\frac1n\right]\), \(n\geqslant1\).
<ol><li>Vérifier que \(f\) a une infinité de points de discontinuité.</li><li>Montrer que \(f=\sum_{n\geqslant1}(-1)^n\mathbf 1_{I_n}\). En déduire que \(f\in\mathcal L^1([0,1])\) et calculer \(\int_{[0,1]}f\).</li></ol>`,
  idea: L`Les \(I_n\) sont disjoints et recouvrent \(]0,1]\). Intégration terme à terme avec \(\int|(-1)^n\mathbf 1_{I_n}|=\frac1n-\frac1{n+1}\), série convergente.`,
  parts: [
    { q: L`1) Discontinuités`, steps: [ L`En \(\frac1n\) (\(n\geqslant2\)) : \(f=(-1)^n\) sur \(\left]\frac1{n+1},\frac1n\right]\) et \(f=(-1)^{n-1}\) juste à droite. Il y a un saut de \(2\) en chaque \(\frac1n\), \(n\geqslant2\) : une infinité de discontinuités.` ] },
    { q: L`2) Intégrale`, steps: [
      L`Les \(I_n\) sont deux à deux disjoints et \(\bigcup_{n\geqslant1}I_n=]0,1]\). Pour \(x\in I_n\), un seul terme de \(\sum(-1)^k\mathbf 1_{I_k}(x)\) est non nul et vaut \((-1)^n=f(x)\) ; en \(0\), tout vaut \(0\). Donc \(f=\sum(-1)^n\mathbf 1_{I_n}\).`,
      L`\(\int|(-1)^n\mathbf 1_{I_n}|=\lambda(I_n)=\frac1n-\frac1{n+1}\), et \(\sum\big(\frac1n-\frac1{n+1}\big)=1\) converge. Par intégration terme à terme, \(f\in\mathcal L^1([0,1])\) et
<div class="math">\[ \begin{aligned}\int_{[0,1]}f&=\sum_{n\geqslant1}(-1)^n\\ &\qquad\times\Big(\frac1n-\frac1{n+1}\Big).\end{aligned} \]</div>`,
      L`\(\sum_{n\geqslant1}\frac{(-1)^n}n=-\ln2\) et \(\sum_{n\geqslant1}\frac{(-1)^n}{n+1}=\sum_{m\geqslant2}\frac{(-1)^{m-1}}m=\ln2-1\). Donc \(\int_{[0,1]}f=-\ln2-(\ln2-1)=1-2\ln2\).` ] } ],
  answer: L`\(f\in\mathcal L^1([0,1])\) et \(\int_{[0,1]}f=1-2\ln2\approx-0{,}386\).`,
  retenir: L`Une fonction « en escalier infini » s'intègre en sommant les intégrales de ses marches, si la série des valeurs absolues converge.` },

{ n: 23, set: 'S4', part: 's4par', title: 'Partiel 2017 : ∫ sin t/(eᵗ − 1)',
  statement: L`But : calculer \(I=\int_0^{+\infty}\frac{\sin t}{e^t-1}dt\). On admet \(\sum_{n\geqslant1}\frac a{n^2+a^2}=\frac{\pi(e^{2\pi a}+1)}{2(e^{2\pi a}-1)}-\frac1{2a}\) pour \(a\gt0\).
<ol><li>Avec \(|\sin t|\leqslant t\), montrer que \(t\mapsto(\sin t)e^{-mt}\) est dans \(\mathcal L^1(]0,+\infty[)\) et \(\int_0^{+\infty}|\sin t|e^{-mt}dt\leqslant\frac1{m^2}\) (\(m\geqslant1\)).</li><li>Calculer \(\int_0^{+\infty}(\sin t)e^{-mt}dt\).</li><li>Calculer \(\sum_{n\geqslant1}e^{-nt}\) pour \(t\gt0\).</li><li>Avec \(f_n(t)=(\sin t)e^{-nt}\), montrer que l'intégration terme à terme s'applique à \(\sum f_n\).</li><li>En déduire que \(\frac{\sin t}{e^t-1}\) est intégrable et donner \(I\).</li></ol>`,
  idea: L`\(\frac1{e^t-1}=\sum_{n\geqslant1}e^{-nt}\). On intègre terme à terme \(\sum(\sin t)e^{-nt}\), la majoration \(\frac1{n^2}\) assurant la convergence de \(\sum\int|f_n|\).`,
  parts: [
    { q: L`1) Intégrabilité`, steps: [ L`\(t\mapsto(\sin t)e^{-mt}\) est continue et \(|\sin t|e^{-mt}\leqslant te^{-mt}\), avec \(\int_0^{+\infty}te^{-mt}dt=\frac1{m^2}\) (intégration par parties). Donc elle est dans \(\mathcal L^1\) et \(\int_0^{+\infty}|\sin t|e^{-mt}dt\leqslant\frac1{m^2}\).` ] },
    { q: L`2) Calcul par Euler`, steps: [
      L`\(\sin t=\frac{e^{jt}-e^{-jt}}{2j}\) et \(\int_0^{+\infty}e^{(\pm j-m)t}dt=\frac1{m\mp j}\) (car \(|e^{(\pm j-m)t}|=e^{-mt}\to0\)).`,
      L`Donc \(\int_0^{+\infty}(\sin t)e^{-mt}dt=\frac1{2j}\Big(\frac1{m-j}-\frac1{m+j}\Big)=\frac1{2j}\cdot\frac{2j}{m^2+1}=\frac1{m^2+1}\).` ] },
    { q: L`3) Série géométrique`, steps: [ L`Pour \(t\gt0\), \(0\lt e^{-t}\lt1\) : \(\sum_{n\geqslant1}e^{-nt}=\frac{e^{-t}}{1-e^{-t}}=\frac1{e^t-1}\).` ] },
    { q: L`4) Terme à terme`, steps: [ L`Chaque \(f_n\in\mathcal L^1(]0,+\infty[)\) (question 1 avec \(m=n\geqslant1\)) et \(\sum_n\int|f_n|\leqslant\sum\frac1{n^2}\lt+\infty\) : le théorème d'intégration terme à terme s'applique.` ] },
    { q: L`5) Valeur de I`, steps: [
      L`D'après la question 3, \(\sum f_n(t)=\frac{\sin t}{e^t-1}\) : cette fonction est dans \(\mathcal L^1\) et \(I=\sum_{n\geqslant1}\int f_n=\sum_{n\geqslant1}\frac1{n^2+1}\) (question 2).`,
      L`Avec la formule admise pour \(a=1\) :
<div class="math">\[ I=\frac{\pi(e^{2\pi}+1)}{2(e^{2\pi}-1)}-\frac12 \]</div>
soit \(I\approx1{,}0767\).` ] } ],
  answer: L`\(\int_0^{+\infty}(\sin t)e^{-mt}dt=\frac1{m^2+1}\), et \(I=\frac{\pi(e^{2\pi}+1)}{2(e^{2\pi}-1)}-\frac12\).`,
  retenir: L`\(\frac1{e^t-1}=\sum_{n\geqslant1}e^{-nt}\) transforme une intégrale en série : on intègre terme à terme après avoir majoré \(\int|f_n|\).` },

{ n: 24, set: 'S4', part: 's4par', title: 'Modifier une fonction sur un ensemble négligeable',
  statement: L`\(f:[1,+\infty[\to\R\), \(f(t)=t^3\) si \(\sin t=0\), \(f(t)=\frac1{t^2}\) sinon. Montrer que \(f\in\mathcal L^1([1,+\infty[)\) et calculer \(\int_{[1,+\infty[}f\).`,
  idea: L`\(\{\sin t=0\}=\pi\mathbb Z\) est dénombrable, donc négligeable : \(f=\frac1{t^2}\) presque partout.`,
  parts: [
    { q: L`Calcul`, steps: [
      L`\(\{t\geqslant1:\sin t=0\}\subset\pi\mathbb Z\) est dénombrable, donc négligeable. Ainsi \(f(t)=\frac1{t^2}\) pour presque tout \(t\in[1,+\infty[\).`,
      L`\(t\mapsto\frac1{t^2}\) est continue, d'intégrale de Riemann généralisée absolument convergente sur \([1,+\infty[\) : elle est dans \(\mathcal L^1\), d'intégrale \(\left[-\frac1t\right]_1^{+\infty}=1\).`,
      L`Une fonction égale presque partout à une fonction intégrable est intégrable, de même intégrale : \(f\in\mathcal L^1([1,+\infty[)\) et \(\int_{[1,+\infty[}f=1\).` ] } ],
  answer: L`\(\int_{[1,+\infty[}f=1\).`,
  retenir: L`Changer une fonction sur un ensemble négligeable (fini, dénombrable) ne change ni l'intégrabilité ni l'intégrale.` },

{ n: 25, set: 'S4', part: 's4par', title: 'Limite de ∫ dx/(xⁿ + eˣ)',
  statement: L`Montrer que \(u_n=\int_0^{+\infty}\frac{dx}{x^n+e^x}\) a une limite finie et la calculer.`,
  idea: L`Convergence dominée : \(\frac1{x^n+e^x}\leqslant e^{-x}\), intégrable ; la limite simple vaut \(e^{-x}\) sur \([0,1[\) et \(0\) sur \(]1,+\infty[\).`,
  parts: [
    { q: L`Convergence dominée`, steps: [
      L`\(f_n(x)=\frac1{x^n+e^x}\) est continue positive sur \([0,+\infty[\), et \(0\leqslant f_n(x)\leqslant e^{-x}\), avec \(x\mapsto e^{-x}\) dans \(\mathcal L^1([0,+\infty[)\). Donc \(f_n\in\mathcal L^1\).`,
      L`Limite simple : pour \(0\leqslant x\lt1\), \(x^n\to0\) et \(f_n(x)\to e^{-x}\) ; pour \(x\gt1\), \(x^n\to+\infty\) et \(f_n(x)\to0\) ; le point \(x=1\) est négligeable.`,
      L`Par convergence dominée : \(u_n\to\int_0^1e^{-x}dx=1-\frac1e\).` ] } ],
  answer: L`\(\lim u_n=1-\frac1e\).`,
  retenir: L`Trois hypothèses : \(f_n\in\mathcal L^1\), convergence simple (presque partout suffit), domination par une \(g\in\mathcal L^1\) indépendante de \(n\).` },

{ n: 26, set: 'S4', part: 's4par', title: 'Partiel 2016 : une limite par convergence dominée',
  statement: L`<ol><li>Montrer que \(t\mapsto\frac1{1+t^2}\) est dans \(\mathcal L^1(\R)\).</li><li>Pour \(\alpha\in\R\), étudier la limite de \(e^{-\alpha n}+e^{(\alpha-1)n}\).</li><li>Montrer que \(u_n=\int_\R\frac{dt}{t^2+1+e^{-nt}+e^{(t-1)n}}\) a une limite finie, à déterminer.</li></ol>`,
  idea: L`La question 2 donne la limite simple de l'intégrande (avec \(\alpha=t\)) ; la domination par \(\frac1{1+t^2}\) est immédiate.`,
  parts: [
    { q: L`1) Intégrabilité`, steps: [ L`\(\frac1{1+t^2}\) est continue positive et \(\int_{-X}^X\frac{dt}{1+t^2}=2\arctan X\to\pi\) : intégrale absolument convergente, donc \(\frac1{1+t^2}\in\mathcal L^1(\R)\).` ] },
    { q: L`2) Comportement`, steps: [
      L`Si \(0\lt\alpha\lt1\) : \(-\alpha\lt0\) et \(\alpha-1\lt0\), la somme tend vers \(0\).`,
      L`Si \(\alpha=0\) ou \(\alpha=1\) : elle tend vers \(1\). Si \(\alpha\lt0\) ou \(\alpha\gt1\) : un des deux termes tend vers \(+\infty\), la somme aussi.` ] },
    { q: L`3) Limite de uₙ`, steps: [
      L`\(f_n(t)=\frac1{t^2+1+e^{-nt}+e^{(t-1)n}}\) est continue, et \(0\leqslant f_n(t)\leqslant\frac1{1+t^2}\in\mathcal L^1(\R)\).`,
      L`Par la question 2 (avec \(\alpha=t\)) : \(f_n(t)\to\frac1{1+t^2}\) pour \(0\lt t\lt1\), et \(f_n(t)\to0\) pour \(t\lt0\) ou \(t\gt1\) (les points \(0\) et \(1\) sont négligeables).`,
      L`Par convergence dominée : \(u_n\to\int_0^1\frac{dt}{1+t^2}=\frac\pi4\).` ] } ],
  answer: L`\(\lim u_n=\frac\pi4\).`,
  retenir: L`Étudier d'abord la limite simple « à \(t\) fixé », puis dominer par une fonction intégrable qui ne dépend pas de \(n\).` },

{ n: 27, set: 'S4', part: 's4par', title: 'L’intégrale de Gauss par une intégrale à paramètre',
  statement: L`\(f(x)=\left(\int_0^xe^{-t^2}dt\right)^2\) et \(g(x)=\int_0^1\frac{e^{-x^2(1+t^2)}}{1+t^2}dt\) pour \(x\geqslant0\).
<ol><li>Montrer que \(|2xe^{-x^2(1+t^2)}|\leqslant\sqrt2e^{-1/2}\) pour \((x,t)\in]0,+\infty[\times[0,1]\).</li><li>Montrer que \(g\) est continue sur \([0,+\infty[\).</li><li>Montrer que \(g\) est dérivable sur \(]0,+\infty[\) et exprimer \(g'\) en fonction de \(f'\).</li><li>Que dire de \(f+g\) ?</li><li>Limite de \(g(x)\) en \(+\infty\) ?</li><li>En déduire \(\int_0^{+\infty}e^{-t^2}dt\).</li></ol>`,
  idea: L`On montre \(g'=-f'\), donc \(f+g\) est constante égale à \(g(0)=\frac\pi4\). Comme \(g\to0\), \(f\to\frac\pi4\).`,
  parts: [
    { q: L`1) Majoration`, steps: [ L`\(h(x)=xe^{-x^2}\) a pour dérivée \((1-2x^2)e^{-x^2}\) : maximum en \(\frac1{\sqrt2}\), égal à \(\frac1{\sqrt2}e^{-1/2}\). Donc \(|2xe^{-x^2(1+t^2)}|\leqslant2xe^{-x^2}\leqslant\sqrt2e^{-1/2}\).` ] },
    { q: L`2) Continuité`, steps: [ L`\(\varphi(x,t)=\frac{e^{-x^2(1+t^2)}}{1+t^2}\) est continue en \(x\), et \(|\varphi(x,t)|\leqslant\frac1{1+t^2}\), intégrable sur \([0,1]\). Par continuité sous le signe somme, \(g\) est continue sur \([0,+\infty[\).` ] },
    { q: L`3) Dérivée`, steps: [
      L`\(\frac{\partial\varphi}{\partial x}(x,t)=-2xe^{-x^2(1+t^2)}\), majorée en valeur absolue par la constante \(\sqrt2e^{-1/2}\), intégrable sur \([0,1]\). Par dérivation sous le signe somme :
<div class="math">\[ g'(x)=-2xe^{-x^2}\int_0^1e^{-x^2t^2}dt. \]</div>`,
      L`Avec \(u=xt\) : \(x\int_0^1e^{-x^2t^2}dt=\int_0^xe^{-u^2}du\). Donc \(g'(x)=-2e^{-x^2}\int_0^xe^{-u^2}du=-f'(x)\).` ] },
    { q: L`4) f + g`, steps: [ L`\((f+g)'=0\) sur \(]0,+\infty[\) et \(f+g\) est continue sur \([0,+\infty[\) : elle est constante, égale à \(f(0)+g(0)=0+\int_0^1\frac{dt}{1+t^2}=\frac\pi4\).` ] },
    { q: L`5) Limite de g`, steps: [ L`\(0\leqslant g(x)\leqslant e^{-x^2}\int_0^1\frac{dt}{1+t^2}=\frac\pi4e^{-x^2}\to0\).` ] },
    { q: L`6) Intégrale de Gauss`, steps: [ L`\(f(x)=\frac\pi4-g(x)\to\frac\pi4\), donc \(\int_0^xe^{-t^2}dt\to\sqrt{\frac\pi4}\) (intégrale positive) : \(\int_0^{+\infty}e^{-t^2}dt=\frac{\sqrt\pi}2\).` ] } ],
  answer: L`\(g'=-f'\), \(f+g=\frac\pi4\), \(g\to0\) et \(\int_0^{+\infty}e^{-t^2}dt=\frac{\sqrt\pi}2\).`,
  retenir: L`Pour dériver sous le signe somme : dominer la <b>dérivée partielle</b> par une fonction intégrable indépendante de \(x\).` },

{ n: 28, set: 'S4', part: 's4par', title: 'L’intégrale de Dirichlet ∫ sin t / t = π/2',
  statement: L`\(A=\lim_{x\to+\infty}\int_0^x\frac{\sin t}t\,dt\) (intégrale convergente, pas absolument). <b>I)</b> \(H(x)=\int_0^{+\infty}e^{-xt}\frac{\sin t}t\,dt\), \(x\gt0\).
<ol><li>Montrer que \(H\) est continue sur \(]0,+\infty[\).</li><li>Montrer que \(H(x)\to0\) en \(+\infty\).</li><li>Montrer que \(H\) est dérivable et calculer \(H'(x)\).</li><li>En déduire \(H(x)\).</li></ol>
<b>II)</b> <ol><li>Pourquoi le passage à la limite sous le signe somme ne s'applique-t-il pas directement quand \(x\to0^+\) ?</li><li>Avec \(F(x)=\int_0^x\frac{\sin t}tdt\), montrer que \(F\) est bornée sur \([0,+\infty[\).</li><li>Montrer que \(H(x)=x\int_0^{+\infty}F(t)e^{-xt}dt\).</li><li>Montrer que \(H(x)=\int_0^{+\infty}F(\frac tx)e^{-t}dt\).</li><li>En déduire \(H(x)\to A\) quand \(x\to0^+\).</li><li>En déduire \(A\).</li></ol>`,
  idea: L`On travaille sur \(]\alpha,+\infty[\) pour dominer par \(e^{-\alpha t}\). \(H'(x)=-\frac1{1+x^2}\), donc \(H=\frac\pi2-\arctan\). Pour \(x\to0^+\), une intégration par parties et un changement de variable font apparaître \(F\), bornée, qui permet de dominer.`,
  parts: [
    { q: L`I.1) Continuité`, steps: [ L`Soit \(\alpha\gt0\). Pour \(x\geqslant\alpha\) et \(t\gt0\) : \(\left|e^{-xt}\frac{\sin t}t\right|\leqslant e^{-\alpha t}\) (car \(|\sin t|\leqslant t\)), intégrable sur \(]0,+\infty[\). L'intégrande est continu en \(x\) : \(H\) est continue sur \(]\alpha,+\infty[\) pour tout \(\alpha\gt0\), donc sur \(]0,+\infty[\).` ] },
    { q: L`I.2) Limite en +∞`, steps: [ L`\(|H(x)|\leqslant\int_0^{+\infty}e^{-xt}dt=\frac1x\to0\).` ] },
    { q: L`I.3) Dérivée`, steps: [
      L`\(\frac{\partial}{\partial x}\Big(e^{-xt}\frac{\sin t}t\Big)=-e^{-xt}\sin t\), majorée par \(e^{-\alpha t}\) pour \(x\geqslant\alpha\). Par dérivation sous le signe somme, \(H\) est dérivable et \(H'(x)=-\int_0^{+\infty}e^{-xt}\sin t\,dt\).`,
      L`Comme dans l'exo 23 (formules d'Euler) : \(\int_0^{+\infty}e^{-xt}\sin t\,dt=\frac1{1+x^2}\), donc \(H'(x)=-\frac1{1+x^2}\).` ] },
    { q: L`I.4) Expression de H`, steps: [ L`\(H(x)=C-\arctan x\) ; la limite nulle en \(+\infty\) donne \(C=\frac\pi2\) : \(H(x)=\frac\pi2-\arctan x\).` ] },
    { q: L`II.1) Pas de domination directe`, steps: [ L`Il faudrait \(g\in\mathcal L^1\) avec \(\left|e^{-xt}\frac{\sin t}t\right|\leqslant g(t)\) pour tous les \(x\gt0\) ; en faisant \(x\to0\), on aurait \(\frac{|\sin t|}t\leqslant g(t)\), alors que \(\frac{\sin t}t\notin\mathcal L^1(]0,+\infty[)\).` ] },
    { q: L`II.2) F bornée`, steps: [ L`\(F\) est continue sur \([0,+\infty[\) (\(\frac{\sin t}t\) se prolonge par continuité en \(0\)) et a une limite finie \(A\) en \(+\infty\) : elle est bornée sur \([0,+\infty[\), disons par \(M\).` ] },
    { q: L`II.3) Intégration par parties`, steps: [ L`Sur \([0,X]\), avec \(F'(t)=\frac{\sin t}t\) : \(\int_0^Xe^{-xt}F'(t)dt=\big[e^{-xt}F(t)\big]_0^X+x\int_0^XF(t)e^{-xt}dt\). Comme \(F(0)=0\) et \(|e^{-xX}F(X)|\leqslant Me^{-xX}\to0\), on obtient en \(X\to+\infty\) : \(H(x)=x\int_0^{+\infty}F(t)e^{-xt}dt\).` ] },
    { q: L`II.4) Changement de variable`, steps: [ L`Avec \(t=\frac ux\) (\(dt=\frac{du}x\)) : \(x\int_0^{+\infty}F(t)e^{-xt}dt=\int_0^{+\infty}F\left(\frac ux\right)e^{-u}du\).` ] },
    { q: L`II.5) Limite en 0⁺`, steps: [ L`Pour \(u\gt0\) fixé, \(\frac ux\to+\infty\) donc \(F(\frac ux)e^{-u}\to Ae^{-u}\) ; et \(|F(\frac ux)e^{-u}|\leqslant Me^{-u}\), intégrable. Par passage à la limite sous le signe somme : \(H(x)\to\int_0^{+\infty}Ae^{-u}du=A\).` ] },
    { q: L`II.6) Valeur de A`, steps: [ L`\(H(x)=\frac\pi2-\arctan x\to\frac\pi2\) quand \(x\to0^+\). Par unicité de la limite : \(A=\frac\pi2\).` ] } ],
  answer: L`\(H(x)=\frac\pi2-\arctan x\) et \(A=\int_0^{+\infty}\frac{\sin t}tdt=\frac\pi2\).`,
  retenir: L`Pour la continuité ou la dérivabilité sur \(]0,+\infty[\), on domine sur chaque \(]\alpha,+\infty[\) : c'est suffisant car ces propriétés sont locales.` },

{ n: 29, set: 'S4', part: 's4par', title: 'Inégalité de Markov pour la mesure de Lebesgue',
  statement: L`\(f\in\mathcal L^1(\R)\) positive, \(A(R)=\{t\in\R:f(t)\geqslant R\}\) pour \(R\gt0\).
<ol><li>Pourquoi \(A(R)\) est-il mesurable ?</li><li>Montrer que \(\int_{A(R)}(f(t)-R)\,dt\geqslant0\) et en déduire \(\lambda(A(R))\leqslant\frac1R\int_\R f\).</li></ol>`,
  idea: L`\(A(R)\) est l'image réciproque d'un intervalle par une fonction mesurable. Sur \(A(R)\), \(f-R\geqslant0\).`,
  parts: [
    { q: L`1) Mesurabilité`, steps: [ L`\(f\in\mathcal L^1\) est mesurable, et \(A(R)=\{t:f(t)\in[R,+\infty[\}\) avec \([R,+\infty[\in\beta^*(\R)\) : \(A(R)\) est mesurable (propriété 3.9).` ] },
    { q: L`2) Inégalité`, steps: [
      L`\(\mathbf 1_{A(R)}\leqslant\frac fR\) (sur \(A(R)\), \(f\geqslant R\) ; ailleurs \(f\geqslant0\)), donc \(\mathbf 1_{A(R)}\in\mathcal L^1\) et \((f-R)\mathbf 1_{A(R)}\) est intégrable, positive : \(\int_{A(R)}(f-R)\geqslant0\).`,
      L`Donc \(R\,\lambda(A(R))\leqslant\int_{A(R)}f\leqslant\int_\R f\) (car \(f\geqslant0\)), soit \(\lambda(A(R))\leqslant\frac1R\int_\R f\).` ] } ],
  answer: L`\(\lambda(\{f\geqslant R\})\leqslant\frac1R\int_\R f\).`,
  retenir: L`Inégalité de Markov : une fonction intégrable ne peut être grande que sur un ensemble de petite mesure.` },

{ n: 30, set: 'S4', part: 's4par', title: 'Continuité croissante de la mesure',
  statement: L`\(M_0\gt0\), \((A_n)\) mesurables, \(A_n\subset A_{n+1}\) et \(\lambda(A_n)\leqslant M_0\). On veut \(\lambda\big(\bigcup A_n\big)=\lim\lambda(A_n)\).
<ol><li>Pourquoi \(\lambda(A_n)\) converge-t-elle ?</li><li>Avec \(B_0=A_0\), \(B_n=A_n\setminus A_{n-1}\), montrer que \(\bigcup A_n=\bigcup B_n\), réunion disjointe.</li><li>En déduire \(\lambda\big(\bigcup A_n\big)=\sum\lambda(B_n)\) et conclure.</li></ol>`,
  idea: L`On découpe la réunion croissante en « couronnes » disjointes \(B_n\), puis on utilise la \(\sigma\)-additivité.`,
  parts: [
    { q: L`1) Convergence`, steps: [ L`\(A_n\subset A_{n+1}\) donne \(\lambda(A_n)\leqslant\lambda(A_{n+1})\) : suite croissante, majorée par \(M_0\), donc convergente.` ] },
    { q: L`2) Les couronnes`, steps: [
      L`Disjointes : si \(m\lt n\), \(B_m\subset A_m\subset A_{n-1}\) et \(B_n\cap A_{n-1}=\varnothing\).`,
      L`Même réunion : \(B_n\subset A_n\) ; et si \(x\in\bigcup A_n\), soit \(n\) le plus petit indice avec \(x\in A_n\) : \(x\in B_n\). De plus \(\bigcup_{k\leqslant n}B_k=A_n\).` ] },
    { q: L`3) Conclusion`, steps: [ L`Les \(B_n\) sont mesurables et disjoints : \(\lambda\big(\bigcup A_n\big)=\sum_n\lambda(B_n)=\lim_N\sum_{n\leqslant N}\lambda(B_n)=\lim_N\lambda\big(\bigcup_{n\leqslant N}B_n\big)=\lim_N\lambda(A_N)\).` ] } ],
  answer: L`\(\lambda\big(\bigcup A_n\big)=\lim\lambda(A_n)\).`,
  retenir: L`Réunion croissante : passer aux différences successives \(A_n\setminus A_{n-1}\), disjointes, puis \(\sigma\)-additivité.` },

{ n: 31, set: 'S4', part: 's4par', title: 'Une suite croissante intégrable est finie presque partout',
  statement: L`\(f_n\in\mathcal L^1(\R)\) positives, \(f_n\leqslant f_{n+1}\), \(M_0=\sup_n\int f_n\lt+\infty\). \(E=\{t:\lim f_n(t)=+\infty\}\).
<ol><li>Si \(E\) est mesurable, que faut-il montrer sur \(\lambda(E)\) ?</li><li>Montrer que \(E=\bigcap_{R\in\N^*}\bigcup_nA_n(R)\), \(A_n(R)=\{f_n\geqslant R\}\), et que \(E\) est mesurable.</li><li>Avec l'exo 29 : \(\lambda(A_n(R))\leqslant\frac{M_0}R\).</li><li>Avec l'exo 30 : \(\lambda\big(\bigcup_nA_n(R)\big)\leqslant\frac{M_0}R\).</li><li>Conclure.</li></ol>`,
  idea: L`Une suite croissante tend vers \(+\infty\) si et seulement si elle dépasse tout \(R\). Markov (exo 29) puis continuité croissante (exo 30) donnent \(\lambda(E)\leqslant\frac{M_0}R\) pour tout \(R\).`,
  parts: [
    { q: L`1) Objectif`, steps: [ L`Montrer que \(\lambda(E)=0\) : la limite est finie pour presque tout \(t\).` ] },
    { q: L`2) Écriture de E`, steps: [
      L`\((f_n(t))\) est croissante : elle tend vers \(+\infty\) si et seulement si pour tout \(R\in\N^*\), il existe \(n\) avec \(f_n(t)\geqslant R\), c'est-à-dire \(t\in\bigcap_R\bigcup_nA_n(R)\).`,
      L`Chaque \(A_n(R)\) est mesurable (exo 29) ; une réunion dénombrable et une intersection dénombrable de mesurables sont mesurables : \(E\) est mesurable.` ] },
    { q: L`3) Markov`, steps: [ L`Exo 29 : \(\lambda(A_n(R))\leqslant\frac1R\int f_n\leqslant\frac{M_0}R\).` ] },
    { q: L`4) Réunion croissante`, steps: [ L`\(f_n\leqslant f_{n+1}\) donne \(A_n(R)\subset A_{n+1}(R)\), de mesures majorées par \(\frac{M_0}R\). Exo 30 : \(\lambda\big(\bigcup_nA_n(R)\big)=\lim_n\lambda(A_n(R))\leqslant\frac{M_0}R\).` ] },
    { q: L`5) Conclusion`, steps: [ L`\(E\subset\bigcup_nA_n(R)\) pour tout \(R\), donc \(\lambda(E)\leqslant\frac{M_0}R\) pour tout \(R\geqslant1\). En faisant \(R\to+\infty\) : \(\lambda(E)=0\).` ] } ],
  answer: L`\(\lambda(E)=0\) : \(\lim f_n(t)\) est finie pour presque tout \(t\).`,
  retenir: L`« Pour tout \(R\), il existe \(n\) » se traduit par \(\bigcap_R\bigcup_n\) : c'est ainsi qu'on prouve la mesurabilité d'un ensemble défini par une limite.` },

{ n: 32, set: 'S4', part: 's4par', title: 'Espérance et variance des trois lois à densité',
  statement: L`Déterminer l'espérance et la variance de \(X\) pour les trois lois à densité du cours : uniforme \(\mathcal U_{[a,b]}\), exponentielle \(\mathcal E(\alpha)\), normale \(\mathcal N(\mu,\sigma^2)\).`,
  idea: L`\(\mathbb E(X)=\int tf(t)dt\), \(\mathbb E(X^2)=\int t^2f(t)dt\), \(\mathbb V(X)=\mathbb E(X^2)-\mathbb E(X)^2\). Pour la loi normale, on se ramène à \(\mathcal N(0,1)\) par \(u=\frac{t-\mu}\sigma\).`,
  parts: [
    { q: L`Uniforme`, steps: [ L`\(f=\frac1{b-a}\mathbf 1_{[a,b]}\) : \(\mathbb E(X)=\frac{a+b}2\), \(\mathbb E(X^2)=\frac{a^2+ab+b^2}3\), donc \(\mathbb V(X)=\frac{(b-a)^2}{12}\).` ] },
    { q: L`Exponentielle`, steps: [ L`\(f(t)=\alpha e^{-\alpha t}\mathbf 1_{[0,+\infty[}\). Par parties : \(\mathbb E(X)=\frac1\alpha\), \(\mathbb E(X^2)=\frac2{\alpha^2}\), donc \(\mathbb V(X)=\frac1{\alpha^2}\).` ] },
    { q: L`Normale`, steps: [
      L`Avec \(u=\frac{t-\mu}\sigma\) : \(\mathbb E(X)=\mu+\frac\sigma{\sqrt{2\pi}}\int_\R ue^{-u^2/2}du=\mu\) (fonction impaire intégrable).`,
      L`\(\mathbb V(X)=\frac{\sigma^2}{\sqrt{2\pi}}\int_\R u^2e^{-u^2/2}du\). Par parties (\(u\cdot ue^{-u^2/2}\)) : \(\int u^2e^{-u^2/2}du=\int e^{-u^2/2}du=\sqrt{2\pi}\) (intégrale de Gauss, exo 27). Donc \(\mathbb V(X)=\sigma^2\).` ] } ],
  answer: L`\(\mathcal U_{[a,b]}\) : \(\frac{a+b}2\), \(\frac{(b-a)^2}{12}\) ; \(\mathcal E(\alpha)\) : \(\frac1\alpha\), \(\frac1{\alpha^2}\) ; \(\mathcal N(\mu,\sigma^2)\) : \(\mu\), \(\sigma^2\).`,
  retenir: L`Variance = \(\mathbb E(X^2)-\mathbb E(X)^2\) ; pour la normale, centrer-réduire puis utiliser \(\int e^{-u^2/2}=\sqrt{2\pi}\).` },

{ n: 33, set: 'S4', part: 's4par', title: 'Somme de deux uniformes indépendantes',
  statement: L`\(X\), \(Y\) indépendantes de loi \(\mathcal U([0,1])\). Déterminer la densité de \(X+Y\).`,
  idea: L`La densité de \(X+Y\) est le produit de convolution \(f\star f\), avec \(f=\mathbf 1_{[0,1]}\).`,
  parts: [
    { q: L`Convolution`, steps: [
      L`\((f\star f)(x)=\int_\R\mathbf 1_{[0,1]}(t)\mathbf 1_{[0,1]}(x-t)dt=\lambda\big([0,1]\cap[x-1,x]\big)\).`,
      L`Pour \(0\leqslant x\leqslant1\) : \([0,x]\), longueur \(x\). Pour \(1\leqslant x\leqslant2\) : \([x-1,1]\), longueur \(2-x\). Sinon : \(0\).`,
      L`Densité de \(X+Y\) : \(h(x)=x\) sur \([0,1]\), \(h(x)=2-x\) sur \([1,2]\), \(0\) ailleurs (densité « en triangle »).` ] } ],
  answer: L`\(h(x)=1-|x-1|\) pour \(x\in[0,2]\), \(0\) sinon.`,
  retenir: L`Somme de variables indépendantes à densité : densité = produit de convolution des densités.` },

{ n: 34, set: 'S4', part: 's4par', title: 'Lois de 2X + 1 et de −ln(1 − X)/λ',
  statement: L`<ol><li>\(X\sim\mathcal E(1)\). Montrer que \(Y=2X+1\) est à densité, déterminer sa densité et \(\mathbb E(Y)\).</li><li>\(X\sim\mathcal U([0,1])\). Déterminer la loi de \(T=-\frac1\lambda\ln(1-X)\), \(\lambda\gt0\).</li></ol>`,
  idea: L`On calcule la fonction de répartition, puis on la dérive (théorème 3.12 : continue, dérivable sauf en un nombre fini de points ⇒ à densité).`,
  parts: [
    { q: L`1) Y = 2X + 1`, steps: [
      L`\(F_Y(y)=\mathbb P\left(X\leqslant\frac{y-1}2\right)=1-e^{-(y-1)/2}\) pour \(y\geqslant1\), et \(0\) pour \(y\lt1\).`,
      L`\(F_Y\) est continue, dérivable sauf en \(1\) : \(Y\) est à densité \(f_Y(y)=\frac12e^{-(y-1)/2}\mathbf 1_{[1,+\infty[}(y)\).`,
      L`\(\mathbb E(Y)=2\mathbb E(X)+1=3\).` ] },
    { q: L`2) T = −ln(1 − X)/λ`, steps: [
      L`\(1-X\in]0,1]\) presque sûrement, donc \(T\geqslant0\). Pour \(t\geqslant0\) : \(F_T(t)=\mathbb P\big(1-X\geqslant e^{-\lambda t}\big)=\mathbb P\big(X\leqslant1-e^{-\lambda t}\big)=1-e^{-\lambda t}\).`,
      L`C'est la fonction de répartition de \(\mathcal E(\lambda)\) : \(T\sim\mathcal E(\lambda)\).` ] } ],
  answer: L`\(f_Y(y)=\frac12e^{-(y-1)/2}\) sur \([1,+\infty[\), \(\mathbb E(Y)=3\) ; \(T\sim\mathcal E(\lambda)\).`,
  retenir: L`Pour trouver la loi de \(\varphi(X)\) : calculer \(F_{\varphi(X)}\) en inversant l'inégalité, puis dériver.` },
/* ---------- Chapitre 4 : intégrales multiples ---------- */
{ n: 35, set: 'S4', part: 's4mul', title: 'Partiel 2016 : un quart de couronne en polaires',
  statement: L`Calculer \(\iint_{\mathcal D}\frac{dx\,dy}{1+x^2+y^2}\) où \(\mathcal D=\{(x,y):x\geqslant0,\ y\geqslant0,\ 1\leqslant x^2+y^2\leqslant3\}\). <i>Indication</i> : coordonnées polaires.`,
  idea: L`En polaires, \(\mathcal D\) devient le rectangle \(\rho\in[1,\sqrt3]\), \(\theta\in[0,\frac\pi2]\), et \(dx\,dy=\rho\,d\rho\,d\theta\).`,
  parts: [
    { q: L`Calcul`, steps: [
      L`Avec \(x=\rho\cos\theta\), \(y=\rho\sin\theta\) (\(|\det J|=\rho\)), \(\mathcal D\) correspond, aux bords près (négligeables), à \(1\leqslant\rho\leqslant\sqrt3\), \(0\leqslant\theta\leqslant\frac\pi2\). L'intégrande est continue bornée sur ce compact.`,
      L`<div class="math">\[ \begin{aligned}&\iint_{\mathcal D}\frac{dx\,dy}{1+x^2+y^2}\\ &=\int_0^{\pi/2}\!\!\int_1^{\sqrt3}\frac{\rho\,d\rho}{1+\rho^2}\,d\theta\\ &=\frac\pi2\cdot\frac12\big[\ln(1+\rho^2)\big]_1^{\sqrt3}=\frac\pi4\ln2.\end{aligned} \]</div>` ] } ],
  answer: L`\(\frac\pi4\ln2\).`,
  retenir: L`Disques, couronnes, secteurs : polaires, sans oublier le facteur \(\rho\).` },

{ n: 36, set: 'S4', part: 's4mul', title: 'Examen 2017 : Fubini, puis un secteur de couronne',
  statement: L`<ol><li>Montrer que \(f(x,y)=e^{-y(1+x^2)}\) est dans \(\mathcal L^1([0,+\infty[^2)\) et calculer \(I=\iint_{[0,+\infty[^2}e^{-y(1+x^2)}dx\,dy\).</li><li>\(\mathcal D=\{(x,y):\frac14\leqslant x^2+y^2\leqslant1,\ y\geqslant|x|\}\). a) Dessiner \(\mathcal D\). b) Vérifier que \(J=\iint_{\mathcal D}\sin(\pi x^2+\pi y^2)dx\,dy\) est bien définie et la calculer.</li></ol>`,
  idea: L`1) \(f\geqslant0\) : Fubini pour les fonctions positives, en intégrant d'abord en \(y\). 2) \(\mathcal D\) est un secteur de couronne : polaires.`,
  parts: [
    { q: L`1) Fubini`, steps: [
      L`\(f\) est continue positive. À \(x\) fixé, \(\int_0^{+\infty}e^{-y(1+x^2)}dy=\frac1{1+x^2}\).`,
      L`\(\int_0^{+\infty}\frac{dx}{1+x^2}=\frac\pi2\) converge : par le théorème de Fubini (cas mesurable, intégrales successives de \(|f|=f\)), \(f\in\mathcal L^1([0,+\infty[^2)\) et \(I=\frac\pi2\).` ] },
    { q: L`2a) Le domaine`, steps: [
      L`Entre les cercles de rayons \(\frac12\) et \(1\), au-dessus des droites \(y=x\) et \(y=-x\) : un secteur de couronne d'angle \(\theta\in[\frac\pi4,\frac{3\pi}4]\).
<div class="exo-fig"><svg viewBox="-1.25 -1.2 2.5 1.45" width="240" height="140" role="img" aria-label="Secteur de couronne entre les rayons 1/2 et 1, pour un angle de pi/4 à 3pi/4"><path d="M -1.2 0 H 1.2 M 0 .15 V -1.15" stroke="currentColor" stroke-width=".012" opacity=".6"/><circle cx="0" cy="0" r="1" fill="none" stroke="currentColor" stroke-width=".01" opacity=".35"/><circle cx="0" cy="0" r=".5" fill="none" stroke="currentColor" stroke-width=".01" opacity=".35"/><path d="M -.85 -.85 L .85 -.85" stroke="none"/><path d="M 0 0 L .85 -.85 M 0 0 L -.85 -.85" stroke="var(--accent)" stroke-width=".012" stroke-dasharray=".04 .03"/><path d="M .7071 -.7071 A 1 1 0 0 0 -.7071 -.7071 L -.3536 -.3536 A .5 .5 0 0 1 .3536 -.3536 Z" fill="var(--mint-s)" stroke="var(--accent)" stroke-width=".02"/><text x=".88" y="-.72" font-size=".11" fill="currentColor">y = x</text><text x="-1.2" y="-.72" font-size=".11" fill="currentColor">y = −x</text><text x=".52" y=".12" font-size=".1" fill="currentColor">1/2</text><text x="1.02" y=".12" font-size=".1" fill="currentColor">1</text></svg></div>` ] },
    { q: L`2b) Calcul de J`, steps: [
      L`L'intégrande est continu et borné par \(1\) sur le compact \(\mathcal D\) : \(J\) est bien définie.`,
      L`En polaires (\(\frac12\leqslant\rho\leqslant1\), \(\frac\pi4\leqslant\theta\leqslant\frac{3\pi}4\)) :
<div class="math">\[ \begin{aligned}J&=\int_{\pi/4}^{3\pi/4}\!\!\int_{1/2}^1\sin(\pi\rho^2)\rho\,d\rho\,d\theta\\ &=\frac\pi2\left[-\frac{\cos(\pi\rho^2)}{2\pi}\right]_{1/2}^1\\ &=\frac14\Big(1+\frac{\sqrt2}2\Big)=\frac{2+\sqrt2}8.\end{aligned} \]</div>` ] } ],
  answer: L`\(I=\frac\pi2\) ; \(J=\frac{2+\sqrt2}8\).`,
  retenir: L`Fonction positive : si une intégrale successive converge, Fubini s'applique et donne l'intégrale double.` },

{ n: 37, set: 'S4', part: 's4mul', title: 'Convolution et « intégration par parties » par Fubini',
  statement: L`\(f,g\in\mathcal L^1(\R)\).
<ol><li>On admet que \((x,t)\mapsto f(x-t)g(t)\) est mesurable. Redémontrer que \(f\star g\in\mathcal L^1(\R)\) et \(\int_\R f\star g=\left(\int_\R f\right)\left(\int_\R g\right)\).</li><li>Montrer que \(\int_\R\Big(\int_{-\infty}^xf\Big)g(x)dx=\Big(\int_\R f\Big)\Big(\int_\R g\Big)-\int_\R\Big(\int_{-\infty}^xg\Big)f(x)dx\) (avec \(A=\{t\leqslant x\}\), montrer d'abord que \(\varphi=f(t)g(x)\mathbf 1_A(x,t)\in\mathcal L^1(\R^2)\)).</li></ol>`,
  idea: L`On vérifie l'intégrabilité sur \(\R^2\) en intégrant la valeur absolue (Fubini, cas mesurable), puis on calcule l'intégrale double dans les deux ordres.`,
  parts: [
    { q: L`1) Intégrale de f ⋆ g`, steps: [
      L`Pour \(t\) fixé, \(\int_\R|f(x-t)|dx=\int_\R|f|\) (translation). Donc \(\int_\R\Big(\int_\R|f(x-t)g(t)|dx\Big)dt=\int_\R|f|\cdot\int_\R|g|\lt+\infty\).`,
      L`Par Fubini, \(\varphi(x,t)=f(x-t)g(t)\in\mathcal L^1(\R^2)\), donc \(x\mapsto\int_\R\varphi(x,t)dt=(f\star g)(x)\) est dans \(\mathcal L^1(\R)\), et en intégrant d'abord en \(x\) :
<div class="math">\[ \begin{aligned}\int_\R f\star g&=\int_\R g(t)\Big(\int_\R f(x-t)dx\Big)dt\\ &=\int_\R f\int_\R g.\end{aligned} \]</div>` ] },
    { q: L`2) La formule`, steps: [
      L`\(\varphi\) est mesurable et \(|\varphi|\leqslant|f(t)||g(x)|\), fonction intégrable sur \(\R^2\) (ses intégrales successives valent \(\int|f|\int|g|\)). Donc \(\varphi\in\mathcal L^1(\R^2)\).`,
      L`En intégrant d'abord en \(t\) : \(\iint\varphi=\int_\R g(x)\Big(\int_{-\infty}^xf(t)dt\Big)dx\).`,
      L`En intégrant d'abord en \(x\) : \(\iint\varphi=\int_\R f(t)\Big(\int_t^{+\infty}g\Big)dt=\int_\R f(t)\Big(\int_\R g-\int_{-\infty}^tg\Big)dt\), soit \(\int f\int g-\int_\R f(t)\Big(\int_{-\infty}^tg\Big)dt\). Fubini donne l'égalité annoncée.` ] } ],
  answer: L`\(\int f\star g=\int f\int g\), et la formule d'« intégration par parties » découle de Fubini appliqué à \(\varphi\).`,
  retenir: L`Avant d'échanger l'ordre d'intégration, prouver que la fonction est dans \(\mathcal L^1(\R^2)\) en intégrant sa valeur absolue.` },

{ n: 38, set: 'S4', part: 's4mul', title: 'Examen 2018 : ∫ e^{jat}/(1 + t²) = π e^{−|a|}',
  statement: L`But : \(\int_\R\frac{e^{jat}}{1+t^2}dt=\pi e^{-|a|}\).
<ol><li>Montrer que \(t\mapsto e^{-\lambda|t|+j\alpha t}\in\mathcal L^1(\R)\) et \(\int_\R e^{-\lambda|t|+j\alpha t}dt=\frac{2\lambda}{\lambda^2+\alpha^2}\) (\(\lambda\gt0\)).</li><li>Montrer que \(h_{\varepsilon,a}(x,y)=e^{j(a-y)x}e^{-\varepsilon|x|-|y|}\in\mathcal L^1(\R^2)\).</li><li>Exprimer les intégrales successives de \(h_{\varepsilon,a}\) avec \(F_\varepsilon(a)=\int_\R\frac{e^{jat}}{1+t^2}e^{-\varepsilon|t|}dt\) et \(G_\varepsilon(a)=\int_\R e^{-|t|}\frac{\varepsilon}{\pi(\varepsilon^2+(a-t)^2)}dt\), et justifier \(F_\varepsilon(a)=\pi G_\varepsilon(a)\).</li><li>Montrer que \(G_\varepsilon(a)=\int_\R e^{-|a-\varepsilon v|}\frac1{\pi(1+v^2)}dv\).</li><li>Limite de \(G_\varepsilon(a)\) quand \(\varepsilon\to0^+\) ?</li><li>Limite de \(F_\varepsilon(a)\) sous forme intégrale ?</li><li>Conclure.</li></ol>`,
  idea: L`On calcule l'intégrale double de \(h_{\varepsilon,a}\) dans les deux ordres (Fubini) avec la formule de la question 1, puis on fait \(\varepsilon\to0\) par convergence dominée.`,
  parts: [
    { q: L`1) Calcul de base`, steps: [ L`\(|e^{-\lambda|t|+j\alpha t}|=e^{-\lambda|t|}\in\mathcal L^1(\R)\). En coupant en \(0\) : \(\int_0^{+\infty}e^{(-\lambda+j\alpha)t}dt+\int_0^{+\infty}e^{(-\lambda-j\alpha)t}dt=\frac1{\lambda-j\alpha}+\frac1{\lambda+j\alpha}=\frac{2\lambda}{\lambda^2+\alpha^2}\).` ] },
    { q: L`2) Intégrabilité de h`, steps: [ L`\(h_{\varepsilon,a}\) est continue et \(|h_{\varepsilon,a}(x,y)|=e^{-\varepsilon|x|}e^{-|y|}\), dont les intégrales successives valent \(\frac2\varepsilon\cdot2\lt+\infty\) : \(h_{\varepsilon,a}\in\mathcal L^1(\R^2)\) (Fubini).` ] },
    { q: L`3) Les deux ordres`, steps: [
      L`D'abord en \(x\) (question 1, \(\lambda=\varepsilon\), \(\alpha=a-y\)) : \(\int_\R h\,dx=e^{-|y|}\frac{2\varepsilon}{\varepsilon^2+(a-y)^2}\), puis \(\int_\R(\dots)dy=2\pi G_\varepsilon(a)\).`,
      L`D'abord en \(y\) (\(\lambda=1\), \(\alpha=-x\)) : \(\int_\R h\,dy=e^{jax}e^{-\varepsilon|x|}\frac2{1+x^2}\), puis \(\int_\R(\dots)dx=2F_\varepsilon(a)\).`,
      L`Par Fubini, les deux sont égales : \(F_\varepsilon(a)=\pi G_\varepsilon(a)\).` ] },
    { q: L`4) Changement de variable`, steps: [ L`Avec \(t=a-\varepsilon v\) (bijection affine, \(|dt/dv|=\varepsilon\)) : \(\frac{\varepsilon}{\pi(\varepsilon^2+\varepsilon^2v^2)}\cdot\varepsilon=\frac1{\pi(1+v^2)}\), d'où \(G_\varepsilon(a)=\int_\R e^{-|a-\varepsilon v|}\frac{dv}{\pi(1+v^2)}\).` ] },
    { q: L`5) Limite de G`, steps: [ L`L'intégrande tend vers \(\frac{e^{-|a|}}{\pi(1+v^2)}\) et est dominé par \(\frac1{\pi(1+v^2)}\in\mathcal L^1(\R)\). Par convergence dominée : \(G_\varepsilon(a)\to e^{-|a|}\cdot\frac1\pi\int_\R\frac{dv}{1+v^2}=e^{-|a|}\).` ] },
    { q: L`6) Limite de F`, steps: [ L`\(\left|\frac{e^{jat}}{1+t^2}e^{-\varepsilon|t|}\right|\leqslant\frac1{1+t^2}\in\mathcal L^1(\R)\) : par convergence dominée, \(F_\varepsilon(a)\to\int_\R\frac{e^{jat}}{1+t^2}dt\).` ] },
    { q: L`7) Conclusion`, steps: [ L`\(\int_\R\frac{e^{jat}}{1+t^2}dt=\lim F_\varepsilon(a)=\pi\lim G_\varepsilon(a)=\pi e^{-|a|}\).` ] } ],
  answer: L`\(\int_\R\frac{e^{jat}}{1+t^2}dt=\pi e^{-|a|}\).`,
  retenir: L`Calculer une même intégrale double dans les deux ordres (Fubini) donne une identité entre deux intégrales simples.` },

{ n: 39, set: 'S4', part: 's4mul', title: 'Intégrale de xyz sur un tétraèdre',
  statement: L`\(V=\{(x,y,z):x,y,z\geqslant0,\ x+y+z\leqslant1\}\). Calculer \(\iiint_Vxyz\,dx\,dy\,dz\).`,
  idea: L`Intégrales successives : \(z\) de \(0\) à \(1-x-y\), puis \(y\) de \(0\) à \(1-x\), puis \(x\) de \(0\) à \(1\).`,
  parts: [
    { q: L`Calcul`, steps: [
      L`\(\int_0^{1-x-y}z\,dz=\frac{(1-x-y)^2}2\). Avec \(s=1-x\) : \(\int_0^sy\frac{(s-y)^2}2dy=\frac12\cdot\frac{s^4}{12}=\frac{s^4}{24}\) (par exemple avec \(u=s-y\)).`,
      L`Puis \(\frac1{24}\int_0^1x(1-x)^4dx=\frac1{24}\cdot\frac1{30}=\frac1{720}\) (avec \(u=1-x\) : \(\int_0^1(1-u)u^4du=\frac15-\frac16\)).` ] } ],
  answer: L`\(\iiint_Vxyz=\frac1{720}\).`,
  retenir: L`Pour un tétraèdre, on écrit les bornes de l'intérieur vers l'extérieur : \(0\leqslant z\leqslant1-x-y\), \(0\leqslant y\leqslant1-x\), \(0\leqslant x\leqslant1\).` },

{ n: 40, set: 'S4', part: 's4mul', title: 'Une boule en coordonnées sphériques',
  statement: L`\(V=\{x^2+y^2+z^2\leqslant4\}\). Calculer \(\iiint_V\exp\big((x^2+y^2+z^2)^{3/2}\big)dx\,dy\,dz\) (coordonnées sphériques).`,
  idea: L`En sphériques, \((x^2+y^2+z^2)^{3/2}=r^3\) et l'élément de volume est \(r^2\sin\theta\,dr\,d\theta\,d\varphi\).`,
  parts: [
    { q: L`Calcul`, steps: [
      L`Convention rayon-colatitude-longitude : \(x=r\cos\varphi\sin\theta\), \(y=r\sin\varphi\sin\theta\), \(z=r\cos\theta\), et \(|\det J|=r^2\sin\theta\). La boule correspond à \(r\in[0,2]\), \(\theta\in[0,\pi]\), \(\varphi\in[0,2\pi]\).`,
      L`<div class="math">\[ \begin{aligned}\iiint_Ve^{r^3}=&\int_0^{2\pi}\!\!d\varphi\int_0^\pi\!\sin\theta\,d\theta\\ &\times\int_0^2e^{r^3}r^2dr\\ =&\ 2\pi\cdot2\cdot\frac{e^8-1}3=\frac{4\pi}3(e^8-1).\end{aligned} \]</div>` ] } ],
  answer: L`\(\frac{4\pi}3(e^8-1)\).`,
  retenir: L`Sphériques : \(dx\,dy\,dz=r^2\sin\theta\,dr\,d\theta\,d\varphi\) ; quand l'intégrande ne dépend que de \(r\), on obtient \(4\pi\int r^2f(r)dr\).` },

{ n: 41, set: 'S4', part: 's4mul', title: 'Partiel 2021 : changement de variables (uw, vw, uv)',
  statement: L`\(\varphi(u,v,w)=(uw,vw,uv)\) est un \(C^1\)-difféomorphisme de \(]0,+\infty[^3\). \(\mathcal D=\{(x,y,z)\in]0,+\infty[^3:z\leqslant xy\leqslant4z,\ yz\leqslant x,\ z\leqslant y\}\). Calculer \(I=\iiint_{\mathcal D}\frac{dx\,dy\,dz}{xz+xy}\) avec \((x,y,z)=\varphi(u,v,w)\).`,
  idea: L`On traduit les inégalités en \(u,v,w\) : on obtient un domaine simple. Puis jacobien et intégrale.`,
  parts: [
    { q: L`1) Le domaine`, steps: [
      L`\(xy=uvw^2\) et \(z=uv\) : \(z\leqslant xy\leqslant4z\iff1\leqslant w^2\leqslant4\iff1\leqslant w\leqslant2\).`,
      L`\(yz=uv^2w\leqslant x=uw\iff v\leqslant1\) ; \(z=uv\leqslant y=vw\iff u\leqslant w\). Donc \(\mathcal D=\varphi(K)\), \(K=\{0\lt v\leqslant1,\ 1\leqslant w\leqslant2,\ 0\lt u\leqslant w\}\).` ] },
    { q: L`2) Jacobien et intégrande`, steps: [
      L`\(J_\varphi=\begin{pmatrix}w&0&u\\0&w&v\\v&u&0\end{pmatrix}\), \(\det J_\varphi=w(-uv)+u(-wv)=-2uvw\), donc \(|\det J_\varphi|=2uvw\).`,
      L`\(xz+xy=u^2vw+uvw^2=uvw(u+w)\).` ] },
    { q: L`3) Calcul`, steps: [
      L`Par la formule du changement de variable :
<div class="math">\[ \begin{aligned}I&=\iiint_K\frac{2uvw}{uvw(u+w)}\,du\,dv\,dw\\ &=\int_0^1\!\!dv\int_1^2\!\!\int_0^w\frac{2\,du}{u+w}\,dw.\end{aligned} \]</div>`,
      L`\(\int_0^w\frac{du}{u+w}=\ln(2w)-\ln w=\ln2\), donc \(I=1\times1\times2\ln2=2\ln2\).` ] } ],
  answer: L`\(I=2\ln2\).`,
  retenir: L`Un bon changement de variables transforme les contraintes en bornes indépendantes ; ne pas oublier \(|\det J_\varphi|\).` },

{ n: 42, set: 'S4', part: 's4mul', title: 'Couple uniforme sur le disque unité',
  statement: L`\(D\) disque fermé de centre \(0\) et de rayon \(1\), \((X,Y)\) de densité \(h=\frac1\pi\mathbf 1_D\).
<ol><li>Vérifier que \(h\) est une densité.</li><li>Calculer \(\mathbb P(Y\geqslant X)\).</li><li>Calculer \(\mathbb P(X\in[0,1])\).</li><li>Calculer \(\mathbb P(X+Y\leqslant1)\).</li></ol>`,
  idea: L`\(\mathbb P((X,Y)\in A)=\frac{\text{aire}(A\cap D)}\pi\) : on calcule des aires géométriquement.`,
  parts: [
    { q: L`a) Densité`, steps: [ L`\(h\geqslant0\), mesurable, bornée à support compact donc intégrable, et \(\iint h=\frac{\lambda(D)}\pi=\frac\pi\pi=1\).` ] },
    { q: L`b) Y ≥ X`, steps: [ L`La droite \(y=x\) passe par le centre : elle coupe \(D\) en deux demi-disques. \(\mathbb P(Y\geqslant X)=\frac{\pi/2}\pi=\frac12\).` ] },
    { q: L`c) X ∈ [0, 1]`, steps: [ L`Sur \(D\), \(X\leqslant1\) toujours ; \(\{X\geqslant0\}\cap D\) est un demi-disque : \(\mathbb P(X\in[0,1])=\frac12\).` ] },
    { q: L`d) X + Y ≤ 1`, steps: [
      L`La droite \(x+y=1\) passe par \((1,0)\) et \((0,1)\), deux points du cercle. La partie de \(D\) au-dessus est le segment circulaire : quart de disque moins le triangle de sommets \((0,0),(1,0),(0,1)\), d'aire \(\frac\pi4-\frac12\).`,
      L`\(\mathbb P(X+Y\leqslant1)=\frac{\pi-(\frac\pi4-\frac12)}\pi=\frac34+\frac1{2\pi}\approx0{,}909\).` ] } ],
  answer: L`\(\frac12\), \(\frac12\), et \(\frac34+\frac1{2\pi}\).`,
  retenir: L`Densité uniforme sur un domaine : une probabilité est un rapport d'aires.` },

{ n: 43, set: 'S4', part: 's4fd', title: 'dφ₁ ∧ dφ₂ = (det J) du ∧ dv',
  statement: L`Soit \(U\) un ouvert de \(\R^2\) et \(\varphi_1,\varphi_2\) deux 0-formes de classe \(C^1\) sur \(U\). On pose \(\varphi=(\varphi_1,\varphi_2)\). Montrer que \(d\varphi_1\wedge d\varphi_2=(\det J_\varphi)\,du\wedge dv\) sur \(U\), où \(J_\varphi(u,v)\) est la matrice jacobienne de \(\varphi\).`,
  idea: L`On développe le produit extérieur des deux différentielles avec les règles \(du\wedge du=dv\wedge dv=0\) et \(dv\wedge du=-du\wedge dv\).`,
  parts: [
    { q: L`Calcul`, steps: [
      L`\(d\varphi_1=\frac{\partial\varphi_1}{\partial u}du+\frac{\partial\varphi_1}{\partial v}dv\) et \(d\varphi_2=\frac{\partial\varphi_2}{\partial u}du+\frac{\partial\varphi_2}{\partial v}dv\).`,
      L`Le produit extérieur est bilinéaire. Comme \(du\wedge du=0\), \(dv\wedge dv=0\) et \(dv\wedge du=-du\wedge dv\), il reste deux termes :
<div class="math">\[ \begin{aligned}d\varphi_1\wedge d\varphi_2&=\frac{\partial\varphi_1}{\partial u}\frac{\partial\varphi_2}{\partial v}\,du\wedge dv\\ &\quad+\frac{\partial\varphi_1}{\partial v}\frac{\partial\varphi_2}{\partial u}\,dv\wedge du.\end{aligned} \]</div>`,
      L`Donc \(d\varphi_1\wedge d\varphi_2=\Big(\frac{\partial\varphi_1}{\partial u}\frac{\partial\varphi_2}{\partial v}-\frac{\partial\varphi_1}{\partial v}\frac{\partial\varphi_2}{\partial u}\Big)du\wedge dv\), et la parenthèse est exactement \(\det J_\varphi=\begin{vmatrix}\partial_u\varphi_1&\partial_v\varphi_1\\ \partial_u\varphi_2&\partial_v\varphi_2\end{vmatrix}\).` ] } ],
  answer: L`\(d\varphi_1\wedge d\varphi_2=(\det J_\varphi)\,du\wedge dv\).`,
  retenir: L`C'est l'origine du jacobien dans le changement de variables : \(dx\wedge dy\) devient \((\det J_\varphi)\,du\wedge dv\).` },

{ n: 44, set: 'S4', part: 's4fd', title: 'Rotationnel nul sur un étoilé ⇒ gradient',
  statement: L`Soit \(U\subset\R^3\) un ouvert étoilé et \(\vec E:U\to\R^3\) un champ de vecteurs de classe \(C^1\) tel que \(\overrightarrow{\mathrm{rot}}(\vec E)=\vec0\) sur \(U\). Montrer qu'il existe \(V:U\to\R\) de classe \(C^2\) telle que \(\vec E=\overrightarrow{\mathrm{grad}}(V)\). Indication : avec \(\vec E=(P,Q,R)\), appliquer le théorème de Poincaré à \(\omega=P\,dx_1+Q\,dx_2+R\,dx_3\).`,
  idea: L`Le champ associé à \(d\omega\) est \(\overrightarrow{\mathrm{rot}}\,\vec E\) : rotationnel nul veut dire \(\omega\) fermée. Poincaré donne une primitive \(V\), et \(dV=\omega\) veut dire \(\overrightarrow{\mathrm{grad}}\,V=\vec E\).`,
  parts: [
    { q: L`Démonstration`, steps: [
      L`\(\omega\) est de classe \(C^1\) car \(P,Q,R\) le sont.`,
      L`D'après le cours, \(d\omega=\big(\frac{\partial R}{\partial x_2}-\frac{\partial Q}{\partial x_3}\big)dx_2\wedge dx_3+\big(\frac{\partial P}{\partial x_3}-\frac{\partial R}{\partial x_1}\big)dx_3\wedge dx_1+\big(\frac{\partial Q}{\partial x_1}-\frac{\partial P}{\partial x_2}\big)dx_1\wedge dx_2\) : ses trois coefficients sont les composantes de \(\overrightarrow{\mathrm{rot}}\,\vec E\). Donc \(\overrightarrow{\mathrm{rot}}\,\vec E=\vec0\) donne \(d\omega=0\) : \(\omega\) est fermée.`,
      L`\(U\) est étoilé, \(\omega\) est \(C^1\) et fermée : par le théorème de Poincaré, il existe \(V\) de classe \(C^2\) sur \(U\) avec \(\omega=dV\).`,
      L`\(dV=\frac{\partial V}{\partial x_1}dx_1+\frac{\partial V}{\partial x_2}dx_2+\frac{\partial V}{\partial x_3}dx_3\) : en identifiant avec \(\omega\), \(\frac{\partial V}{\partial x_1}=P\), \(\frac{\partial V}{\partial x_2}=Q\), \(\frac{\partial V}{\partial x_3}=R\), c'est-à-dire \(\vec E=\overrightarrow{\mathrm{grad}}\,V\).` ] } ],
  answer: L`\(\vec E=\overrightarrow{\mathrm{grad}}\,V\) avec \(V\) primitive de \(\omega\) donnée par Poincaré.`,
  retenir: L`Dictionnaire : \(d\) d'une 0-forme ↔ gradient, \(d\) d'une 1-forme ↔ rotationnel, \(d\) d'une 2-forme ↔ divergence.` },

{ n: 45, set: 'S4', part: 's4fd', title: 'Le plan fendu est étoilé par rapport à (1, 0)',
  statement: L`En revenant à la définition, redémontrer que \(U=\R^2\setminus\{(x,0):x\leqslant0\}\) est un ouvert de \(\R^2\) étoilé par rapport au point \((1,0)\).`,
  idea: L`Ouvert : on retire une demi-droite fermée. Étoilé : on suppose qu'un point du segment \([a,M]\) tombe sur la demi-droite et on aboutit à une contradiction.`,
  parts: [
    { q: L`1) U est ouvert`, steps: [
      L`La demi-droite \(D=\{(x,0):x\leqslant0\}\) est fermée (si \((x_n,0)\to(x,y)\) avec \(x_n\leqslant0\), alors \(y=0\) et \(x\leqslant0\)). Son complémentaire \(U\) est donc ouvert.` ] },
    { q: L`2) U est étoilé par rapport à a = (1, 0)`, steps: [
      L`\(a\in U\). Soit \(M=(x,y)\in U\) et \(t\in[0,1]\). Le point du segment est \((1-t)a+tM=(1-t+tx,\ ty)\). Supposons qu'il soit dans \(D\) : alors \(ty=0\) et \(1-t+tx\leqslant0\).`,
      L`Si \(t=0\), le point est \(a=(1,0)\), qui n'est pas dans \(D\) : impossible. Donc \(t\gt0\), et \(ty=0\) donne \(y=0\).`,
      L`Mais alors \(M=(x,0)\in U\) impose \(x\gt0\), et \(1-t+tx=(1-t)+tx\gt0\) (somme d'un terme \(\geqslant0\) et d'un terme \(\gt0\)) : contradiction avec \(1-t+tx\leqslant0\).`,
      L`Donc tout le segment \([a,M]\) est dans \(U\) : \(U\) est étoilé par rapport à \((1,0)\).` ] } ],
  answer: L`\(U\) est ouvert (complémentaire d'un fermé) et étoilé par rapport à \((1,0)\).`,
  retenir: L`Pour montrer « étoilé par rapport à \(a\) » : prendre \(M\in U\), \(t\in[0,1]\), et vérifier que \((1-t)a+tM\in U\).` },

{ n: 46, set: 'S4', part: 's4fd', title: 'Primitives sur le demi-plan y > 0',
  statement: L`\(U=\R\times]0,+\infty[\), \(P(x,y)=\frac{e^x(y^2-1)}{(y+e^x)^2}\) et \(Q(x,y)=\frac{e^{2x}-1}{(y+e^x)^2}\). Montrer que \(\omega=P\,dx+Q\,dy\) est exacte sur \(U\) et déterminer ses primitives.`,
  idea: L`Poincaré (demi-plan convexe, forme fermée), puis primitive de \(Q\) en \(y\) à \(x\) fixé, et on trouve la « constante » \(K(x)\) en dérivant en \(x\).`,
  parts: [
    { q: L`1) ω est exacte`, steps: [
      L`\(y+e^x\gt0\) sur \(U\) : \(P\) et \(Q\) sont \(C^1\) sur \(U\) (quotients de fonctions \(C^1\) à dénominateur non nul).`,
      L`Un calcul direct donne
<div class="math">\[ \frac{\partial P}{\partial y}=\frac{\partial Q}{\partial x}=\frac{2e^x(1+ye^x)}{(y+e^x)^3}, \]</div>donc \(d\omega=0\) : \(\omega\) est fermée.`,
      L`\(U\) est un demi-plan, donc convexe, donc étoilé. Par Poincaré, \(\omega\) est exacte.` ] },
    { q: L`2) Primitives`, steps: [
      L`Soit \(f\) une primitive. À \(x\) fixé, \(\{y:(x,y)\in U\}=]0,+\infty[\) est un intervalle et \(\frac{\partial f}{\partial y}=\frac{e^{2x}-1}{(y+e^x)^2}\), donc il existe \(K(x)\) tel que \(f(x,y)=-\frac{e^{2x}-1}{y+e^x}+K(x)\).`,
      L`\(K(x)=f(x,1)+\frac{e^{2x}-1}{1+e^x}\) est dérivable. En dérivant en \(x\) et en utilisant \(\frac{\partial f}{\partial x}=P\), on obtient \(K'(x)=e^x\) (le calcul se simplifie), donc \(K(x)=e^x+C\) : à \(y\) fixé, \(x\) parcourt \(\R\), qui est un intervalle.`,
      L`D'où \(f(x,y)=e^x-\frac{e^{2x}-1}{y+e^x}+C=\frac{1+ye^x}{y+e^x}+C\). Vérification : \(\frac{\partial}{\partial y}\frac{1+ye^x}{y+e^x}=\frac{e^x(y+e^x)-(1+ye^x)}{(y+e^x)^2}=Q\) et de même en \(x\) on retrouve \(P\).` ] } ],
  answer: L`\(\omega\) est exacte et ses primitives sont \(f(x,y)=\frac{1+ye^x}{y+e^x}+C\), \(C\in\R\).`,
  retenir: L`Méthode : intégrer en \(y\) (sur un intervalle !) avec une « constante » \(K(x)\), puis trouver \(K\) en dérivant en \(x\).` },

{ n: 47, set: 'S4', part: 's4fd', title: 'Partiel 2018 : primitives sur {xy > 1, x > 0}',
  statement: L`\(U=\{(x,y):xy\gt1,\ x\gt0\}\). On admet : \(\forall(x,y)\in U,\ \forall t\in[0,1],\ \big(2(1-t)+tx,\ 3(1-t)+ty\big)\in U\).
<ol><li>Quelle propriété remarquable \(U\) possède-t-il ?</li><li>Montrer que \(\omega=\frac{y^2-1}{(xy-1)^2}dx+\frac{1-x^2}{(xy-1)^2}dy\) est exacte sur \(U\). Soit \(f\) une primitive.</li><li>Montrer que pour \(x\gt0\) fixé, \(\{y:(x,y)\in U\}\) est un intervalle \(I_x\) contenant \(\frac2x\), à expliciter.</li><li>Montrer qu'il existe \(H(x)\) tel que \(f(x,y)=\frac{x^2-1}{x(xy-1)}+H(x)\) pour \(y\in I_x\).</li><li>Vérifier que \(H(x)=f(x,\frac2x)-x+\frac1x\).</li><li>Montrer que \(H\) est \(C^1\) sur \(]0,+\infty[\) et calculer \(H'\).</li><li>En déduire \(H\).</li><li>Déterminer toutes les primitives de \(\omega\) sur \(U\).</li></ol>`,
  idea: L`\(U\) est étoilé par rapport à \((2,3)\). On intègre en \(y\) sur \(I_x\), puis on trouve \(H\) en suivant la courbe \(y=\frac2x\), qui reste dans \(U\).`,
  parts: [
    { q: L`1) Propriété de U`, steps: [ L`\((2,3)\in U\) (\(6\gt1\)) et la propriété admise dit que le segment de \((2,3)\) à tout point de \(U\) est dans \(U\) : \(U\) est <b>étoilé par rapport à \((2,3)\)</b>.` ] },
    { q: L`2) ω est exacte`, steps: [
      L`Sur \(U\), \(xy-1\gt0\) : les coefficients sont \(C^1\).`,
      L`\(\frac{\partial P}{\partial y}=\frac{2y(xy-1)-2x(y^2-1)}{(xy-1)^3}=\frac{2(x-y)}{(xy-1)^3}\) et \(\frac{\partial Q}{\partial x}=\frac{-2x(xy-1)-2y(1-x^2)}{(xy-1)^3}=\frac{2(x-y)}{(xy-1)^3}\). Donc \(\omega\) est fermée.`,
      L`\(U\) ouvert étoilé, \(\omega\) \(C^1\) et fermée : par Poincaré, \(\omega\) est exacte.` ] },
    { q: L`3) L'intervalle I_x`, steps: [ L`Pour \(x\gt0\) : \(xy\gt1\iff y\gt\frac1x\). Donc \(I_x=\big]\frac1x,+\infty\big[\), un intervalle, qui contient \(\frac2x\gt\frac1x\).` ] },
    { q: L`4) La fonction H`, steps: [ L`À \(x\) fixé, \(\frac{\partial f}{\partial y}=\frac{1-x^2}{(xy-1)^2}\) sur l'intervalle \(I_x\). Une primitive en \(y\) est \((1-x^2)\cdot\frac{-1}{x(xy-1)}=\frac{x^2-1}{x(xy-1)}\), donc il existe \(H(x)\) avec \(f(x,y)=\frac{x^2-1}{x(xy-1)}+H(x)\) pour tout \(y\in I_x\).` ] },
    { q: L`5) Valeur en y = 2/x`, steps: [ L`Pour \(y=\frac2x\in I_x\) : \(xy-1=1\), donc \(f(x,\frac2x)=\frac{x^2-1}x+H(x)=x-\frac1x+H(x)\), d'où \(H(x)=f(x,\frac2x)-x+\frac1x\).` ] },
    { q: L`6) Dérivée de H`, steps: [
      L`\(x\mapsto(x,\frac2x)\) est \(C^1\) à valeurs dans \(U\) et \(f\) est \(C^2\) : \(H\) est \(C^1\) sur \(]0,+\infty[\) (composée et somme).`,
      L`Par la dérivation des fonctions composées :
<div class="math">\[ \begin{aligned}H'(x)&=\frac{\partial f}{\partial x}\Big(x,\frac2x\Big)-\frac2{x^2}\frac{\partial f}{\partial y}\Big(x,\frac2x\Big)-1-\frac1{x^2}\\ &=\Big(\frac4{x^2}-1\Big)-\frac2{x^2}(1-x^2)-1-\frac1{x^2}=\frac1{x^2}.\end{aligned} \]</div>(au point \((x,\frac2x)\), \(xy-1=1\)).` ] },
    { q: L`7) Expression de H`, steps: [ L`\(]0,+\infty[\) est un intervalle : \(H(x)=-\frac1x+C\), \(C\in\R\).` ] },
    { q: L`8) Toutes les primitives`, steps: [
      L`\(f(x,y)=\frac{x^2-1}{x(xy-1)}-\frac1x+C=\frac{x^2-1-(xy-1)}{x(xy-1)}+C=\frac{x-y}{xy-1}+C\).`,
      L`Réciproquement, \(\frac{\partial}{\partial x}\frac{x-y}{xy-1}=\frac{(xy-1)-(x-y)y}{(xy-1)^2}=\frac{y^2-1}{(xy-1)^2}\) et de même en \(y\) : ces fonctions sont bien des primitives.` ] } ],
  answer: L`Les primitives de \(\omega\) sur \(U\) sont \(f(x,y)=\frac{x-y}{xy-1}+C\), \(C\in\R\).`,
  retenir: L`Quand \(\{x:(x,y)\in U\}\) n'est pas pratique, on calcule \(H\) le long d'une courbe qui reste dans \(U\) (ici \(y=\frac2x\)).` },

{ n: 48, set: 'S4', part: 's4fd', title: 'Exercice plus difficile : primitives sur {xy > −1}',
  statement: L`\(U=\{(x,y):xy\gt-1\}\) et \(\omega=\frac{1-y^2}{(1+xy)^2}dx+\frac{1-x^2}{(1+xy)^2}dy\).
<ol><li>Montrer que \(U\) est étoilé par rapport à \((0,0)\).</li><li>Montrer que \(\omega\) est exacte. Soit \(f\) une primitive.</li><li>Montrer que pour \(x\in\R\), \(\{y:(x,y)\in U\}\) est un intervalle \(I_x\) contenant \(0\) (distinguer \(x\gt0\), \(x\lt0\), \(x=0\)).</li><li>Pour \(x\neq0\), montrer qu'il existe \(L(x)\) tel que \(f(x,y)=\frac{x^2-1}{x(1+xy)}+L(x)\) pour \(y\in I_x\).</li><li>a) Vérifier que \(L(x)=f(x,0)-x+\frac1x\). b) Montrer que \(L\) est \(C^1\) sur \(\R^*\) et calculer \(L'\). c) En déduire \(L\).</li><li>Déterminer \(f(0,y)\) pour \(y\in I_0\).</li><li>Avec \(\lim_{x\to0^+}f(x,0)=\lim_{x\to0^-}f(x,0)=f(0,0)\), donner toutes les primitives de \(\omega\) sur \(U\), définies et continues sur tout \(U\).</li></ol>`,
  idea: L`Même méthode que l'exo 47. Piège : \(\R^*\) n'est pas un intervalle, donc \(L\) a a priori une constante différente de chaque côté de \(0\). La continuité en \(x=0\) les recolle.`,
  parts: [
    { q: L`1) U étoilé par rapport à 0`, steps: [ L`Soit \((x,y)\in U\) et \(t\in[0,1]\). \((tx)(ty)=t^2xy\). Si \(xy\geqslant0\), \(t^2xy\geqslant0\gt-1\). Si \(-1\lt xy\lt0\), \(t^2xy\geqslant xy\gt-1\) car \(t^2\leqslant1\). Donc \(t(x,y)\in U\).` ] },
    { q: L`2) ω est exacte`, steps: [
      L`Sur \(U\), \(1+xy\gt0\) : les coefficients sont \(C^1\). Un calcul direct donne \(\frac{\partial P}{\partial y}=\frac{\partial Q}{\partial x}=\frac{-2(x+y)}{(1+xy)^3}\), donc \(\omega\) est fermée.`,
      L`\(U\) est étoilé (question 1) : par Poincaré, \(\omega\) est exacte.` ] },
    { q: L`3) Les intervalles I_x`, steps: [ L`Si \(x\gt0\) : \(xy\gt-1\iff y\gt-\frac1x\), \(I_x=]-\frac1x,+\infty[\). Si \(x\lt0\) : \(I_x=]-\infty,-\frac1x[\). Si \(x=0\) : \(0\gt-1\) toujours, \(I_0=\R\). Ce sont des intervalles qui contiennent \(0\).` ] },
    { q: L`4) La fonction L`, steps: [ L`Pour \(x\neq0\), sur l'intervalle \(I_x\), \(\frac{\partial f}{\partial y}=\frac{1-x^2}{(1+xy)^2}\), dont une primitive en \(y\) est \(\frac{x^2-1}{x(1+xy)}\). D'où \(L(x)\).` ] },
    { q: L`5) Calcul de L`, steps: [
      L`a) En \(y=0\in I_x\) : \(f(x,0)=\frac{x^2-1}x+L(x)\), donc \(L(x)=f(x,0)-x+\frac1x\).`,
      L`b) \(x\mapsto f(x,0)\) est \(C^1\) (car \((x,0)\in U\) et \(f\) est \(C^2\)), donc \(L\) est \(C^1\) sur \(\R^*\) et \(L'(x)=\frac{\partial f}{\partial x}(x,0)-1-\frac1{x^2}=1-1-\frac1{x^2}=-\frac1{x^2}\).`,
      L`c) \(\R^*\) n'est pas un intervalle : il existe deux constantes \(C_+\) et \(C_-\) avec \(L(x)=\frac1x+C_+\) pour \(x\gt0\) et \(L(x)=\frac1x+C_-\) pour \(x\lt0\).` ] },
    { q: L`6) Sur l'axe x = 0`, steps: [ L`\(\frac{\partial f}{\partial y}(0,y)=1\) sur \(I_0=\R\) : \(f(0,y)=y+C_0\).` ] },
    { q: L`7) Toutes les primitives`, steps: [
      L`Pour \(x\neq0\) : \(f(x,y)=\frac{x^2-1}{x(1+xy)}+\frac1x+C_\pm=\frac{x^2-1+1+xy}{x(1+xy)}+C_\pm=\frac{x+y}{1+xy}+C_\pm\).`,
      L`En particulier \(f(x,0)=x+C_\pm\to C_\pm\) quand \(x\to0^\pm\). La continuité de \(f\) en \((0,0)\) donne \(C_+=C_-=f(0,0)=C_0\).`,
      L`Donc \(f(x,y)=\frac{x+y}{1+xy}+C\) sur tout \(U\) (pour \(x=0\) on retrouve bien \(y+C\)). Cette expression est définie et continue sur \(U\), et on vérifie qu'elle est une primitive.` ] } ],
  answer: L`Les primitives de \(\omega\) sur \(U\) sont \(f(x,y)=\frac{x+y}{1+xy}+C\), \(C\in\R\).`,
  retenir: L`Si l'ensemble où l'on intègre n'est pas un intervalle, il y a une constante par morceau ; on les relie par continuité.` },

{ n: 49, set: 'S4', part: 's4ifd', title: '∫_γ df = f(γ(b)) − f(γ(a))',
  statement: L`\(U\) ouvert de \(\R^2\), \(a\lt b\) et \(\gamma:[a,b]\to U\) un chemin \(C^1\).
<ol><li>Soit \(f\) une 0-forme \(C^1\) sur \(U\). Retrouver \(\int_\gamma df=f(\gamma(b))-f(\gamma(a))\) (poser \(g=f\circ\gamma\), et partir de \(g(b)-g(a)=\int_a^bg'(t)dt\)).</li><li>En déduire que si \(\omega\) est exacte et \(\gamma\) fermé, \(\int_\gamma\omega=0\).</li></ol>`,
  idea: L`La dérivée de \(f\circ\gamma\) est exactement l'intégrande de \(\int_\gamma df\).`,
  parts: [
    { q: L`1) Intégrale d'une différentielle`, steps: [
      L`\(g=f\circ\gamma\) est \(C^1\) sur \([a,b]\) et, par dérivation des composées, \(g'(t)=\frac{\partial f}{\partial x}(\gamma(t))\gamma_1'(t)+\frac{\partial f}{\partial y}(\gamma(t))\gamma_2'(t)\).`,
      L`Par définition, \(df=\frac{\partial f}{\partial x}dx+\frac{\partial f}{\partial y}dy\), donc \(\int_\gamma df=\int_a^b\Big(\frac{\partial f}{\partial x}(\gamma(t))\gamma_1'(t)+\frac{\partial f}{\partial y}(\gamma(t))\gamma_2'(t)\Big)dt=\int_a^bg'(t)dt\).`,
      L`Donc \(\int_\gamma df=g(b)-g(a)=f(\gamma(b))-f(\gamma(a))\).` ] },
    { q: L`2) Sur un lacet`, steps: [ L`Si \(\omega=df\) et \(\gamma(a)=\gamma(b)\), alors \(\int_\gamma\omega=f(\gamma(b))-f(\gamma(a))=0\).` ] } ],
  answer: L`\(\int_\gamma df=f(\gamma(b))-f(\gamma(a))\), et l'intégrale d'une forme exacte sur un lacet est nulle.`,
  retenir: L`Contraposée très utile : s'il existe un lacet \(\gamma\) avec \(\int_\gamma\omega\neq0\), alors \(\omega\) n'est pas exacte.` },

{ n: 50, set: 'S4', part: 's4ifd', title: 'La forme « angle » : fermée mais pas exacte',
  statement: L`\(\omega=A\,dx+B\,dy\) avec \(A=-\frac y{x^2+y^2}\), \(B=\frac x{x^2+y^2}\) sur \(\R^2\setminus\{(0,0)\}\).
<ol><li>\(\omega\) est-elle fermée sur \(\R^2\setminus\{(0,0)\}\) ?</li><li>Est-elle exacte sur \(\R^2\setminus\{(x,0):x\leqslant0\}\) ?</li><li>Avec \(\gamma(t)=(\cos t,\sin t)\), \(0\leqslant t\leqslant2\pi\), calculer \(\int_\gamma\omega\).</li><li>\(\omega\) est-elle exacte sur \(\R^2\setminus\{(0,0)\}\) ?</li></ol>`,
  idea: L`Fermée partout ; exacte sur le plan fendu (étoilé, exo 45) ; mais l'intégrale sur le cercle vaut \(2\pi\neq0\), donc pas exacte sur le plan privé de l'origine.`,
  parts: [
    { q: L`1) Fermée`, steps: [ L`\(A\) et \(B\) sont \(C^1\) sur \(\R^2\setminus\{0\}\) et \(\frac{\partial A}{\partial y}=\frac{-(x^2+y^2)+2y^2}{(x^2+y^2)^2}=\frac{y^2-x^2}{(x^2+y^2)^2}=\frac{\partial B}{\partial x}\). Oui, \(\omega\) est fermée.` ] },
    { q: L`2) Exacte sur le plan fendu`, steps: [ L`Le plan fendu est un ouvert étoilé par rapport à \((1,0)\) (exo 45), inclus dans \(\R^2\setminus\{0\}\) où \(\omega\) est \(C^1\) et fermée. Par Poincaré : oui, \(\omega\) y est exacte (une primitive est l'angle polaire \(\theta\in]-\pi,\pi[\)).` ] },
    { q: L`3) Intégrale sur le cercle`, steps: [ L`\(\gamma_1=\cos t\), \(\gamma_2=\sin t\), \(x^2+y^2=1\) : \(\int_\gamma\omega=\int_0^{2\pi}\big(-\sin t\cdot(-\sin t)+\cos t\cdot\cos t\big)dt=\int_0^{2\pi}dt=2\pi\).` ] },
    { q: L`4) Exacte sur le plan privé de 0 ?`, steps: [ L`Non : \(\gamma\) est un lacet de \(\R^2\setminus\{0\}\) et \(\int_\gamma\omega=2\pi\neq0\). Si \(\omega\) était exacte, cette intégrale serait nulle (exo 49).` ] } ],
  answer: L`Fermée ; exacte sur le plan fendu ; \(\int_\gamma\omega=2\pi\) ; pas exacte sur \(\R^2\setminus\{(0,0)\}\).`,
  retenir: L`Contre-exemple type : « fermée ⇒ exacte » est faux si l'ouvert n'est pas étoilé (ici il a un « trou » en \(0\)).` },

{ n: 51, set: 'S4', part: 's4ifd', title: 'Aires par Green-Riemann : rectangle et quadrilatère',
  statement: L`<ol><li>Soient \(a,b\gt0\). Retrouver par Green-Riemann l'aire du rectangle de sommets \((0,0),(a,0),(a,b),(0,b)\).</li><li>Déterminer par Green-Riemann l'aire du quadrilatère convexe de sommets \((1,2),(2,-1),(3,1),(3,3)\).</li></ol>`,
  idea: L`Aire \(=\oint_{\partial K}x\,dy=\frac12\oint_{\partial K}(x\,dy-y\,dx)\), bord parcouru dans le sens direct. Sur un segment de \(P\) à \(Q\), \(\frac12\int(x\,dy-y\,dx)=\frac12(x_Py_Q-x_Qy_P)\).`,
  parts: [
    { q: L`1) Rectangle`, steps: [
      L`Bord direct : \((0,0)\to(a,0)\to(a,b)\to(0,b)\to(0,0)\). On utilise \(\mathcal A=\oint x\,dy\).`,
      L`Sur les côtés horizontaux, \(dy=0\). Sur \((0,b)\to(0,0)\), \(x=0\). Il reste le côté \(x=a\), \(y\) de \(0\) à \(b\) : \(\int_0^ba\,dy=ab\). L'aire vaut \(ab\).` ] },
    { q: L`2) Quadrilatère`, steps: [
      L`Dans le sens direct, les sommets se suivent ainsi : \((2,-1)\to(3,1)\to(3,3)\to(1,2)\to(2,-1)\).`,
      L`Sur chaque segment, \(\frac12\int(x\,dy-y\,dx)=\frac12(x_Py_Q-x_Qy_P)\) (paramétrer \((1-t)P+tQ\)) : on obtient \(\frac12(5+6+3-5)\), car \(2\cdot1-3\cdot(-1)=5\), \(3\cdot3-3\cdot1=6\), \(3\cdot2-1\cdot3=3\), \(1\cdot(-1)-2\cdot2=-5\).`,
      L`L'aire vaut \(\frac92\).` ] } ],
  answer: L`Rectangle : \(ab\). Quadrilatère : \(\frac92\).`,
  retenir: L`Aire d'un polygone de sommets successifs (sens direct) : \(\frac12\sum(x_iy_{i+1}-x_{i+1}y_i)\).` },

{ n: 52, set: 'S4', part: 's4ifd', title: 'Partiel 2016 : aire d\'un domaine bordé d\'arcs',
  statement: L`Points \(O(0,0)\), \(A(1,0)\), \(B(0,1)\), \(C(0,2)\), \(D(-1,\sqrt3)\), \(E(-1,0)\), \(F(-2,-1)\), \(G(-1,-1)\). Le domaine \(\mathcal E\) est délimité par : l'arc de centre \(O\), rayon \(1\), de \(A\) à \(B\) (sens direct) ; le segment \([BC]\) ; l'arc de centre \(O\), rayon \(2\), de \(C\) à \(D\) (sens direct) ; le segment \([DE]\) ; l'arc de centre \(G\), rayon \(1\), de \(E\) à \(F\) (sens direct) ; le segment \([FA]\).
<ol><li>Dessiner \(\mathcal E\).</li><li>Calculer l'aire de \(\mathcal E\) par Green-Riemann.</li></ol>`,
  idea: L`On découpe le bord en 6 morceaux et on calcule \(\frac12\int(x\,dy-y\,dx)\) sur chacun, puis on fait la somme (relation de Chasles). Sur un arc de centre \(O\), rayon \(r\), l'intégrande vaut \(r^2dt\).`,
  parts: [
    { q: L`1) Le domaine`, steps: [
      L`Le bord est parcouru dans l'ordre \(A\to B\to C\to D\to E\to F\to A\), dans le sens direct (le domaine est à gauche) : c'est l'orientation de Green-Riemann.
<div class="exo-fig"><svg viewBox="-2.4 -2.25 3.8 3.55" width="260" height="243" role="img" aria-label="Domaine borde par un quart de cercle de rayon 1, un segment vertical, un arc de rayon 2, un segment vertical, un arc de centre G et un segment"><path d="M -2.3 0 H 1.3 M 0 1.2 V -2.2" stroke="currentColor" stroke-width=".015" opacity=".5"/><path d="M 1 0 A 1 1 0 0 0 0 -1 L 0 -2 A 2 2 0 0 0 -1 -1.732 L -1 0 A 1 1 0 0 0 -2 1 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width=".03"/><g font-size=".17" fill="currentColor"><text x="1.05" y=".2">A</text><text x=".07" y="-.92">B</text><text x=".07" y="-2.02">C</text><text x="-1.3" y="-1.8">D</text><text x="-.95" y=".22">E</text><text x="-2.3" y="1.2">F</text><text x="-1.2" y="1.25">G</text><text x=".07" y=".2">O</text></g><circle cx="-1" cy="1" r=".035" fill="currentColor"/></svg></div>` ] },
    { q: L`2) Aire`, steps: [
      L`Arc \(A\to B\) : \((\cos t,\sin t)\), \(t\in[0,\frac\pi2]\), \(x\,dy-y\,dx=dt\) : contribution \(\frac12\cdot\frac\pi2=\frac\pi4\).`,
      L`Segment \([BC]\) : \(x=0\) et \(dx=0\), contribution \(0\). Arc \(C\to D\) : \((2\cos t,2\sin t)\), \(t\in[\frac\pi2,\frac{2\pi}3]\), \(x\,dy-y\,dx=4\,dt\) : \(\frac12\cdot4\cdot\frac\pi6=\frac\pi3\).`,
      L`Segment \([DE]\) : \(\frac12\big((-1)\cdot0-(-1)\sqrt3\big)=\frac{\sqrt3}2\).`,
      L`Arc \(E\to F\) : \((-1+\cos t,-1+\sin t)\), \(t\in[\frac\pi2,\pi]\), \(x\,dy-y\,dx=(1-\cos t-\sin t)dt\). Donc \(\frac12\int_{\pi/2}^{\pi}(1-\cos t-\sin t)dt=\frac12\big(\frac\pi2+1-1\big)=\frac\pi4\).`,
      L`Segment \([FA]\) : \(\frac12\big((-2)\cdot0-1\cdot(-1)\big)=\frac12\).`,
      L`En sommant :
<div class="math">\[ \begin{aligned}\mathcal A(\mathcal E)&=\frac\pi4+\frac\pi3+\frac{\sqrt3}2+\frac\pi4+\frac12\\ &=\frac{5\pi}6+\frac{1+\sqrt3}2\approx3{,}98.\end{aligned} \]</div>` ] } ],
  answer: L`\(\mathcal A(\mathcal E)=\frac{5\pi}6+\frac{1+\sqrt3}2\approx3{,}98\).`,
  retenir: L`Green-Riemann transforme une aire compliquée en une somme d'intégrales simples sur les morceaux du bord (segments et arcs).` },

{ n: 53, set: 'S4', part: 's4ifd', title: 'Circulation de (x², y³, z⁴) le long de (t, t³, t)',
  statement: L`Calculer la circulation de \(\vec E(x,y,z)=(x^2,y^3,z^4)\) le long de \(\gamma(t)=(t,t^3,t)\), \(t\in[0,1]\).`,
  idea: L`Circulation \(=\int_0^1\vec E(\gamma(t))\cdot\gamma'(t)\,dt\). On peut aussi remarquer que \(\vec E\) est un gradient.`,
  parts: [
    { q: L`Calcul`, steps: [
      L`\(\gamma'(t)=(1,3t^2,1)\) et \(\vec E(\gamma(t))=(t^2,t^9,t^4)\), donc \(\vec E(\gamma(t))\cdot\gamma'(t)=t^2+3t^{11}+t^4\).`,
      L`\(\int_0^1(t^2+3t^{11}+t^4)dt=\frac13+\frac14+\frac15=\frac{47}{60}\).`,
      L`Vérification : \(\vec E=\overrightarrow{\mathrm{grad}}\big(\frac{x^3}3+\frac{y^4}4+\frac{z^5}5\big)\), donc la circulation vaut la différence des valeurs entre \(\gamma(1)=(1,1,1)\) et \(\gamma(0)=(0,0,0)\) : \(\frac{47}{60}\).` ] } ],
  answer: L`\(\int_\gamma\vec E\cdot d\vec\ell=\frac{47}{60}\).`,
  retenir: L`Si \(\vec E=\overrightarrow{\mathrm{grad}}\,V\), la circulation ne dépend que des extrémités : \(V(\text{fin})-V(\text{début})\).` },

{ n: 54, set: 'S4', part: 's4ifd', title: 'Longueurs : cercle et arc de parabole',
  statement: L`<ol><li>Retrouver la longueur d'un cercle de rayon \(R\gt0\).</li><li>Soit \(\alpha\gt0\). Calculer la longueur de l'arc \(\big(t,\frac{t^2}2\big)\), \(t\in[0,\alpha]\) (poser \(t=\frac12(e^u-e^{-u})=\mathrm{sh}\,u\)).</li></ol>`,
  idea: L`Longueur \(=\int_a^b\|\gamma'(t)\|dt\).`,
  parts: [
    { q: L`1) Cercle`, steps: [ L`\(\gamma(t)=(R\cos t,R\sin t)\), \(t\in[0,2\pi]\) : \(\|\gamma'(t)\|=R\), longueur \(\int_0^{2\pi}R\,dt=2\pi R\).` ] },
    { q: L`2) Arc de parabole`, steps: [
      L`\(\gamma'(t)=(1,t)\), \(\|\gamma'(t)\|=\sqrt{1+t^2}\), longueur \(\ell=\int_0^\alpha\sqrt{1+t^2}\,dt\).`,
      L`Avec \(t=\mathrm{sh}\,u\) (bijection croissante de \([0,\mathrm{argsh}\,\alpha]\) sur \([0,\alpha]\)), \(dt=\mathrm{ch}\,u\,du\) et \(\sqrt{1+\mathrm{sh}^2u}=\mathrm{ch}\,u\) : \(\ell=\int_0^{\mathrm{argsh}\,\alpha}\mathrm{ch}^2u\,du\).`,
      L`\(\mathrm{ch}^2u=\frac{1+\mathrm{ch}\,2u}2\), donc \(\ell=\Big[\frac u2+\frac{\mathrm{sh}\,2u}4\Big]_0^{\mathrm{argsh}\,\alpha}=\frac12\big(u+\mathrm{sh}\,u\,\mathrm{ch}\,u\big)\) en \(u=\mathrm{argsh}\,\alpha\).`,
      L`Avec \(\mathrm{sh}\,u=\alpha\), \(\mathrm{ch}\,u=\sqrt{1+\alpha^2}\) et \(\mathrm{argsh}\,\alpha=\ln(\alpha+\sqrt{1+\alpha^2})\) :
<div class="math">\[ \ell=\frac12\Big(\alpha\sqrt{1+\alpha^2}+\ln\big(\alpha+\sqrt{1+\alpha^2}\big)\Big). \]</div>` ] } ],
  answer: L`\(2\pi R\) ; \(\ell=\frac12\big(\alpha\sqrt{1+\alpha^2}+\ln(\alpha+\sqrt{1+\alpha^2})\big)\).`,
  retenir: L`Pour \(\int\sqrt{1+t^2}\), le changement \(t=\mathrm{sh}\,u\) fait disparaître la racine.` },

{ n: 55, set: 'S4', part: 's4ifd', title: 'Flux à travers un demi-cylindre',
  statement: L`Calculer le flux de \(\vec E(x,y,z)=(x,1,z^2)\) à travers la portion de cylindre \(x=4\cos\theta\), \(y=4\sin\theta\), \(\theta\in[-\frac\pi2,\frac\pi2]\), \(z\in[-1,1]\), orientée par la normale sortante.`,
  idea: L`Flux \(=\iint_D\vec E(\varphi(\theta,z))\cdot\vec N(\theta,z)\,d\theta\,dz\) avec \(\vec N=\frac{\partial\varphi}{\partial\theta}\times\frac{\partial\varphi}{\partial z}\), en vérifiant qu'elle est sortante.`,
  parts: [
    { q: L`1) Normale`, steps: [ L`\(\varphi(\theta,z)=(4\cos\theta,4\sin\theta,z)\), \(\frac{\partial\varphi}{\partial\theta}=(-4\sin\theta,4\cos\theta,0)\), \(\frac{\partial\varphi}{\partial z}=(0,0,1)\), donc \(\vec N=(4\cos\theta,4\sin\theta,0)\) : elle pointe vers l'extérieur du cylindre, elle est sortante.` ] },
    { q: L`2) Flux`, steps: [
      L`\(\vec E(\varphi)=(4\cos\theta,1,z^2)\), donc \(\vec E(\varphi)\cdot\vec N=16\cos^2\theta+4\sin\theta\).`,
      L`<div class="math">\[ \begin{aligned}\Phi&=\int_{-1}^1\!\int_{-\pi/2}^{\pi/2}(16\cos^2\theta+4\sin\theta)\,d\theta\,dz\\ &=2\Big(16\cdot\frac\pi2+0\Big)=16\pi.\end{aligned} \]</div>(\(\int_{-\pi/2}^{\pi/2}\cos^2\theta\,d\theta=\frac\pi2\), et \(\sin\) est impaire.)` ] } ],
  answer: L`\(\Phi=16\pi\).`,
  retenir: L`Toujours vérifier le sens de \(\vec N=\partial_u\varphi\times\partial_v\varphi\) ; s'il est rentrant, on change le signe du flux.` },

{ n: 56, set: 'S4', part: 's4ifd', title: 'Flux de (x, 0, 0) sur une sphère et volume de la boule',
  statement: L`Calculer le flux de \(\vec E(x,y,z)=(x,0,0)\) à travers la sphère de centre \(0\) et de rayon \(R_0\gt0\), orientée par la normale sortante. En déduire avec la formule d'Ostrogradsky la valeur de \(\iiint_Vdx\,dy\,dz\). Que représente-t-elle ? Indication : \(x=r\cos\theta\cos\varphi\), \(y=r\cos\theta\sin\varphi\), \(z=r\sin\theta\), \(\theta\in[-\frac\pi2,\frac\pi2]\), \(\varphi\in[-\pi,\pi]\).`,
  idea: L`Paramétrage latitude-longitude : la normale sortante est \(\partial_\varphi S\times\partial_\theta S=R_0^2\cos\theta\,(\cos\theta\cos\varphi,\cos\theta\sin\varphi,\sin\theta)\). Puis \(\mathrm{div}\,\vec E=1\).`,
  parts: [
    { q: L`1) Normale sortante`, steps: [ L`\(S(\theta,\varphi)=R_0(\cos\theta\cos\varphi,\cos\theta\sin\varphi,\sin\theta)\). Le cours donne \(\partial_\theta S\times\partial_\varphi S=-R_0^2\cos\theta\,(\cos\theta\cos\varphi,\cos\theta\sin\varphi,\sin\theta)\), qui est rentrante (\(\cos\theta\geqslant0\)). La normale sortante est l'opposé : \(\vec N=\partial_\varphi S\times\partial_\theta S=R_0^2\cos\theta\,\frac{S}{R_0}\).` ] },
    { q: L`2) Flux`, steps: [
      L`\(\vec E(S)\cdot\vec N=R_0\cos\theta\cos\varphi\cdot R_0^2\cos^2\theta\cos\varphi=R_0^3\cos^3\theta\cos^2\varphi\).`,
      L`<div class="math">\[ \begin{aligned}\Phi&=R_0^3\int_{-\pi/2}^{\pi/2}\cos^3\theta\,d\theta\int_{-\pi}^{\pi}\cos^2\varphi\,d\varphi\\ &=R_0^3\cdot\frac43\cdot\pi=\frac43\pi R_0^3.\end{aligned} \]</div>(\(\int\cos^3=\int(1-\sin^2\theta)\cos\theta\,d\theta=\big[\sin\theta-\frac{\sin^3\theta}3\big]\), soit \(\frac43\) ; \(\int_{-\pi}^\pi\cos^2=\pi\).)` ] },
    { q: L`3) Ostrogradsky`, steps: [
      L`\(\mathrm{div}\,\vec E=\frac{\partial x}{\partial x}+0+0=1\). La sphère orientée vers l'extérieur borde la boule \(V\) : \(\iint_\Sigma\vec E\cdot d\vec S=\iiint_V\mathrm{div}\,\vec E\,dV=\iiint_Vdx\,dy\,dz\).`,
      L`Donc \(\iiint_Vdx\,dy\,dz=\frac43\pi R_0^3\) : c'est le <b>volume de la boule</b> de rayon \(R_0\).` ] } ],
  answer: L`\(\Phi=\frac43\pi R_0^3\), donc \(\iiint_Vdx\,dy\,dz=\frac43\pi R_0^3\), le volume de la boule.`,
  retenir: L`Ostrogradsky : le flux sortant d'un champ de divergence \(1\) à travers une surface fermée est le volume qu'elle enferme.` }
];

let mjChain = Promise.resolve();

function typeset(el) {
  if (!el) return Promise.resolve();
  if (!window.__mjReady) { try { texWait(el); } catch (e) { /* rien */ } mjPending.add(el); return Promise.resolve(); }
  mjChain = mjChain.then(() => (el.isConnected ? MathJax.typesetPromise([el]) : null)).then(() => { texUnwrap(el); markWide(el); }).catch((e) => console.warn(e));
  return mjChain;
}
/* A10 : tant que MathJax charge, chaque formule en attente apparaît comme une ligne grise fixe (.m-tex, voir motion.css).

const TEX_RE = /\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]/g;

    <div class="dia-ctrl">
      <button class="icon-btn" data-a="prev" aria-label="Étape précédente">‹</button>
      <div class="dia-dots">${spec.stages.map((_, i) => `<button class="ddot" data-s="${i}" aria-label="Étape ${i + 1}"></button>`).join('')}</div>
      <button class="icon-btn" data-a="next" aria-label="Étape suivante">›</button>

  const ms = spec.ms || 6500;

  const setStage = s => {

/* Repère 2D : zone A = {x, y, w, h}, intervalles xr = [x0, x1], yr = [y0, y1]. */
function frame2d(A, xr, yr) {
  const X = (x) => A.x + (x - xr[0]) / (xr[1] - xr[0]) * A.w;
  const Y = (y) => A.y + A.h - (y - yr[0]) / (yr[1] - yr[0]) * A.h;
  return { X, Y };
}
function axes2d(ctx, C, A, F, xr, yr, labels = ['', '']) {
  ctx.strokeStyle = rgba(C.ink3, 0.6); ctx.lineWidth = 1.2;
  const y0 = clamp(F.Y(0), A.y, A.y + A.h), x0 = clamp(F.X(0), A.x, A.x + A.w);
  ctx.beginPath(); ctx.moveTo(A.x, y0); ctx.lineTo(A.x + A.w, y0); ctx.moveTo(x0, A.y); ctx.lineTo(x0, A.y + A.h); ctx.stroke();
  ctx.font = `700 12px ${C.font}`; ctx.fillStyle = C.ink3; ctx.textBaseline = 'middle';
  ctx.textAlign = 'right'; ctx.fillText(labels[0], A.x + A.w, y0 + 12);
  ctx.textAlign = 'left'; ctx.fillText(labels[1], x0 + 6, A.y + 6);
}
function plotFn(ctx, F, f, a, b, color, lw = 2.4, N = 600, dash) {

/* ---------- Schémas animés de la colle 3 (séries, intégrales généralisées) ----------
   Mêmes outils que dias-ex.js : frame2d, axes2d, plotFn, tag, dotAt, rgba. */
function barsAt(ctx, F, pts, color, w = 0.32) {
  pts.forEach(([x, y]) => {
    const x0 = F.X(x - w), x1 = F.X(x + w), y0 = F.Y(0), y1 = F.Y(y);
    ctx.fillStyle = rgba(color, 0.55); ctx.fillRect(x0, Math.min(y0, y1), x1 - x0, Math.abs(y1 - y0));
  });
}
function shadeUnder(ctx, F, f, a, b, color, N = 200) {
  ctx.beginPath(); ctx.moveTo(F.X(a), F.Y(0));
  for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N; ctx.lineTo(F.X(x), F.Y(f(x))); }
  ctx.lineTo(F.X(b), F.Y(0)); ctx.closePath(); ctx.fillStyle = rgba(color, 0.28); ctx.fill();
}
function vline(ctx, F, x, A, color, label, C) {
  ctx.setLineDash([5, 5]); ctx.strokeStyle = rgba(color, 0.8); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(F.X(x), A.y); ctx.lineTo(F.X(x), A.y + A.h); ctx.stroke(); ctx.setLineDash([]);
  if (label) tag(ctx, C, label, F.X(x), A.y + 10, color);
}

/* =====================================================================
   COUCHE DE MOUVEMENT (storyboard : docs/motion-storyboard.md)
   Règles :
   - seulement transform, opacity, clip-path et stroke-dashoffset ;
   - l'état final est le CSS par défaut : les animations partent de leur état initial
     (fill: 'backwards'), donc sans animation tout reste visible ;
   - un pointerdown ou une touche termine tout ce qui joue (Motion.finishAll) ;
   - Motion.reduced (mouvement réduit) : état final direct, ou fondu court ;
   - jamais de pointer-events:none pendant une animation.
   API : Motion.reveal(els, opts), Motion.countUp(el, to, opts), Motion.drawStroke(el, opts),
         Motion.rule(el, side, opts), Motion.stamp({ mention, big, sub, mini, host }),
         Motion.pageTransition(fn), Motion.finishAll(), Motion.ready(el, max), Motion.reduced.

const Motion = (() => {

    el.insertAdjacentHTML('beforeend', ok ? '<svg class="m-check" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6.5l3 3 6-7"/></svg>' : '<span class="m-miss" aria-hidden="true"></span>');

  /* A5 : formules clés. Après le rendu MathJax, les formules en bloc visibles (3 au plus) se dévoilent
     de gauche à droite (500 ms, 120 ms d'écart) ; les termes importants (.m-u) sont soulignés d'un trait

      const all = $$('mjx-container[display="true"]', root).filter((c) => !(M.mobile && c.scrollWidth > c.clientWidth + 1));
      const fs = all.filter(M.inView).slice(0, cap);

    if (o.now) play(); else M.ready(root, o.max || 700).then(play);
  };

  /* Entrée générique d'une page (vues sans animation dédiée) : lignes de liste, traits, compteurs, anneaux. */
  const ROWS = '.grid > .dcard, .mrow, .faq-item, .gl, .pday, .sh-strip > *, .hist > *, .bgrid > *, .colle-pick > *, .cards3 > a';
  M.pageIn = function (app) {

    M.rows(rows);

    M.counts($$('.mrow > b', app), { delay: tb });

  /* Résultat compté (notes sur 20, points) : partie entière comptée de 0 à sa valeur. */
  M.resultIn = function (box, o = {}) {
    if (!box || M.reduced) return;
    $$('.note20, .pts', box).slice(0, 6).forEach((el) => { const v = num(el); if (v > 0) M.countUp(el, v, { dur: 600, delay: o.delay || 0 }); });

  /* ---------- A9 : estampille ---------- */
  let stampEl = null;

    const box = document.createElement('div');
    box.className = 'm-stamp' + (mini ? ' mini' : '') + (big ? '' : ' nobig');
    if (!mini) { let live = $('#m-live'); if (!live) { live = document.createElement('div'); live.id = 'm-live'; live.className = 'sr'; live.setAttribute('aria-live', 'polite'); document.body.appendChild(live); } setTimeout(() => { live.textContent = [mention, big, sub].filter(Boolean).join(', '); }, 60); }
    box.innerHTML = `<svg class="m-stamp-frame" aria-hidden="true" preserveAspectRatio="none"><rect class="o" x=".5" y=".5" pathLength="100"/><rect class="i" x="4.5" y="4.5" pathLength="100"/></svg>
      <span class="m-stamp-m">${esc(mention)}</span>${big ? `<span class="m-stamp-b">${esc(big)}</span>` : ''}${sub ? `<span class="m-stamp-s">${esc(sub)}</span>` : ''}`;
    if (mini) {
      if (!host) return null;
      host.appendChild(box);
    } else {
      if (stampEl) stampEl.remove();
      stampEl = box;
      document.body.appendChild(box);
      const tb = $('.top'); const top = tb ? Math.max(12, tb.getBoundingClientRect().bottom + 12) : 24;
      box.style.top = top + 'px';
      box.tabIndex = -1;
    }
