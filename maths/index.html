<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maths CITISE</title>
<meta name="description" content="Révisions de maths CITISE (S3, S4) : démonstrations des colles, exemples de cours, exos de TD corrigés, colles et examens blancs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
</head>
<body>
<style>
/* Maths CITISE : « l'ouvrage de référence ». Papier, encre, un seul bordeaux (palette de lucaspjlozano.github.io).
   Ni dégradé, ni flou, ni ombre : des filets fins, des titres à empattements, des numéros. */
:root{
  --bg:#f5f5f7; --bg-2:#ececef; --surface:#ffffff; --surface-2:#fafafb;
  --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.16);
  --accent:#7b1e2e; --accent-2:#a8334a; --accent-soft:rgba(123,30,46,.08); --accent-ink:#ffffff;
  --good:#2f6b4f; --mid:#6e6e73; --bad:#7b1e2e;
  --glass:var(--surface); --glass-2:var(--surface-2); --glass-line:var(--line); --hair:var(--line); --hi:transparent; --shadow:none;
  --lilac:var(--ink-2); --lilac-s:var(--bg-2); --pink:var(--ink-2); --pink-s:var(--bg-2); --sky:var(--ink-2); --sky-s:var(--bg-2); --mint:var(--ink-2); --mint-s:var(--bg-2); --butter:var(--ink-2); --butter-s:var(--bg-2); --peach:var(--ink-2); --peach-s:var(--bg-2); --aqua:var(--ink-2); --aqua-s:var(--bg-2); --wood:var(--ink-2); --wood-s:var(--bg-2);
  --font-d:"Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-b:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-m:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-l:10px; --r-m:8px; --r-s:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#0b0b0c; --bg-2:#141416; --surface:#161618; --surface-2:#1c1c1f;
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#8e8e93; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.2);
  --accent:#c9485f; --accent-2:#e07a8c; --accent-soft:rgba(201,72,95,.14); --accent-ink:#ffffff;
  --good:#7fb79a; --mid:#8e8e93; --bad:#c9485f;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --bg-2:#141416; --surface:#161618; --surface-2:#1c1c1f;
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#8e8e93; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.2);
  --accent:#c9485f; --accent-2:#e07a8c; --accent-soft:rgba(201,72,95,.14); --accent-ink:#ffffff;
  --good:#7fb79a; --mid:#8e8e93; --bad:#c9485f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--font-d);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ciel : halos + bulles de verre ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky .halo{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.sky .h1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--lilac)}
.sky .h2{width:38vmax;height:38vmax;right:-10vmax;top:8vmax;background:var(--sky);opacity:.42}
.sky .h3{width:36vmax;height:36vmax;left:22vmax;bottom:-20vmax;background:var(--pink);opacity:.38}
.sky .h4{width:24vmax;height:24vmax;right:12vmax;bottom:-6vmax;background:var(--butter);opacity:.35}
.sky .bub{position:absolute;border-radius:50%;border:1px solid var(--glass-line);
  background:radial-gradient(circle at 32% 28%, var(--hi), transparent 42%), radial-gradient(circle at 70% 78%, rgba(255,255,255,.08), transparent 55%), var(--glass);
  box-shadow:inset 0 -8px 18px rgba(120,100,220,.08), var(--shadow);animation:drift 22s ease-in-out infinite}
.sky .b1{width:120px;height:120px;left:6%;top:58%}
.sky .b2{width:64px;height:64px;right:9%;top:18%;animation-delay:-6s;animation-duration:18s}
.sky .b3{width:180px;height:180px;right:-50px;top:62%;animation-delay:-11s;animation-duration:28s}
.sky .b4{width:38px;height:38px;left:44%;top:12%;animation-delay:-3s;animation-duration:16s}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(14px,-22px)}66%{transform:translate(-12px,10px)}}

/* ---------- verre ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(165%);backdrop-filter:blur(20px) saturate(165%);
  border:1px solid var(--glass-line);border-radius:var(--r-l);box-shadow:var(--shadow), inset 0 1px 0 var(--hi)}
.wrap{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:12px 110px}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:999px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--font-d);font-weight:800;font-size:1.02rem;white-space:nowrap;flex:none}
.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--lilac-s);color:var(--accent);font-family:var(--font-d);font-size:1.25rem;font-weight:800}
.colle-sel{position:relative;flex:none;cursor:pointer;padding:5px 11px;gap:5px;white-space:nowrap}
.colle-sel select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}
.colle-sel.one{cursor:default}.colle-sel.one select{display:none}
.colle-sel:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.brand small{font-family:var(--font-b);font-weight:600;color:var(--ink-3);font-size:.78rem;margin-left:2px}
.nav{display:flex;gap:2px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent)}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-weight:600;font-size:.88rem;padding:7px 11px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.nav a:hover{background:var(--glass-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-line)}
.top-tools{display:flex;align-items:center;gap:6px;flex:none}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.84rem;padding:5px 10px;border-radius:999px;background:var(--butter-s);border:1px solid var(--glass-line);font-variant-numeric:tabular-nums}
.streak svg{width:15px;height:15px;color:var(--mid)}
.chip.sync{padding:5px 9px}
.chip.sync .lbl{display:none}
@media (min-width:1100px){.chip.sync .lbl{display:inline}}
@media (max-width:640px){.brand-text{display:none}.top{padding-left:8px;gap:6px}.streak .lbl{display:none}.chip.sync{display:none}}

/* ---------- icônes ---------- */
.ic{width:1.1em;height:1.1em;flex:none;display:inline-block;vertical-align:-.18em}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;text-decoration:none;font-weight:700;font-size:.95rem;padding:12px 20px;border-radius:16px;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 10px 24px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.35)}
.btn.soft{background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:var(--shadow);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink-2)}
.btn.small{padding:8px 14px;font-size:.86rem;border-radius:12px}
.btn.tiny{padding:5px 10px;font-size:.8rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass-2);display:grid;place-items:center;font-size:1rem;line-height:1;flex:none;padding:0}
.icon-btn:hover{background:var(--glass)}
.icon-btn .ic{width:18px;height:18px}

.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 4px var(--cs,var(--lilac-s));flex:none}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tip{font-size:.84rem;color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row-b{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.stack{display:grid;gap:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--glass-2);border:1px solid var(--glass-line);color:var(--ink-2);white-space:nowrap;text-decoration:none}
.chip .led{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.chip.cloud .led{background:var(--good)}
.chip.c{background:var(--cs);color:var(--ink)}
.kb{font-family:var(--font-b);font-size:.72rem;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--hair);color:var(--ink-2)}
.panel{padding:22px}
.box{padding:20px 22px}
.box h3{font-size:1.1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.sec-h h2{font-size:1.5rem}
.page-h{margin-bottom:22px;display:grid;gap:8px}
.page-h h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800}
.page-h p{max-width:62ch}
.anim-in{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.progress{flex:1;min-width:120px;height:8px;border-radius:999px;background:var(--hair);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--lilac)),var(--accent));border-radius:inherit;transition:width .5s}
.empty{padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--ink-2)}
.empty img{width:90px}
input[type="date"],input[type="text"],input[type="search"],textarea,select{background:var(--glass-2);border:1px solid var(--glass-line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.5}

/* ---------- anneau de maîtrise ---------- */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--hair)}
.ring .fgc{stroke:var(--c,var(--accent));transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;font-family:var(--font-d);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- mascotte ---------- */
.masc{display:block;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(90,55,25,.22));user-select:none;-webkit-user-drag:none}
.masc.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.masc.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(16px) scale(.9)}60%{transform:translateY(-10px) scale(1.04)}100%{transform:none}}
.masc.shake{animation:mshake .5s}
@keyframes mshake{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.dock{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:70;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.dock .masc{width:78px;height:96px;pointer-events:auto;cursor:pointer;transition:transform .25s}
.dock .masc:hover{transform:translateY(-4px) rotate(-3deg)}
.dock.off{display:none}
.bubble{max-width:min(300px,calc(100vw - 120px));padding:12px 14px;border-radius:18px 18px 4px 18px;font-size:.92rem;font-weight:600;line-height:1.45;pointer-events:auto;margin-bottom:46px;
  background:var(--glass-2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-line);box-shadow:var(--shadow);transform-origin:100% 100%;animation:pop .25s ease}
.bubble.happy{border-color:color-mix(in srgb, var(--good) 45%, transparent)}
.bubble.grr{border-color:color-mix(in srgb, var(--bad) 45%, transparent)}
.bubble.party{border-color:color-mix(in srgb, var(--mid) 55%, transparent)}
.bubble .b-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:560px){.dock .masc{width:60px;height:74px}.bubble{margin-bottom:36px;font-size:.86rem}}
.masc-inline{display:flex;align-items:center;gap:14px}
.masc-inline .masc{flex:none}
.says{position:relative;padding:12px 16px;border-radius:18px;background:var(--glass-2);border:1px solid var(--glass-line);font-weight:600}
.says::before{content:"";position:absolute;left:-7px;top:22px;width:14px;height:14px;background:inherit;border-left:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);transform:rotate(45deg)}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:center;margin-bottom:40px}
.hero h1{font-size:clamp(2.2rem,5.4vw,4rem);font-weight:800;margin:12px 0 14px}
.hero h1 span{background:linear-gradient(100deg,var(--accent) 10%,#d46a9c 55%,#d79a2a 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:54ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero-card{padding:22px;display:grid;gap:16px}
.hero-card .row1{display:flex;align-items:center;gap:16px}
.hero-card h2{font-size:1.12rem}
.countdown{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--butter-s),var(--pink-s));border:1px solid var(--glass-line)}
.countdown b{font-family:var(--font-d);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvl{border-radius:14px;padding:8px 6px;text-align:center;background:var(--glass-2);border:1px solid var(--glass-line)}
.lvl b{display:block;font-family:var(--font-d);font-size:1.25rem;font-variant-numeric:tabular-nums}
.lvl span{font-size:.68rem;font-weight:700;color:var(--ink-3)}
.next-up{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-decoration:none;background:var(--cs);border:1px solid var(--glass-line)}
.next-up .q{font-family:var(--font-d);font-weight:800;font-size:1.15rem;color:var(--ink);white-space:nowrap}
.next-up small{display:block;color:var(--ink-2);font-size:.8rem}
.next-up .go{margin-left:auto;font-weight:800;color:var(--accent);white-space:nowrap}
.hero-masc{display:flex;align-items:flex-end;gap:12px}
.hero-masc .masc{width:118px;height:150px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:40px}
.qk{display:grid;gap:6px;padding:16px;border-radius:var(--r-m);text-decoration:none;position:relative;overflow:hidden;transition:transform .2s}
.qk:hover{transform:translateY(-3px)}
.qk .ic{width:26px;height:26px;color:var(--c,var(--accent))}
.qk b{font-family:var(--font-d);font-size:1.02rem}
.qk span{font-size:.82rem;color:var(--ink-2);line-height:1.4}
.qk .badge-n{position:absolute;right:12px;top:12px}
.method{list-style:none;padding:0;margin:0 0 40px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:m}
.method li{counter-increment:m;padding:14px 14px 16px;border-radius:var(--r-m)}
.method li::before{content:counter(m);font-family:var(--font-d);font-weight:800;font-size:.85rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--ink);margin-bottom:8px;border:1px solid var(--glass-line)}
.method b{display:block;font-size:.95rem}
.method span{font-size:.84rem;color:var(--ink-2);line-height:1.45;display:block;margin-top:2px}
@media (max-width:860px){.method{grid-template-columns:repeat(2,minmax(0,1fr))}.method li:last-child{grid-column:1/-1}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.dcard{--rx:0deg;--ry:0deg;display:flex;flex-direction:column;gap:10px;padding:18px;text-decoration:none;min-width:0;position:relative;overflow:hidden;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease, box-shadow .25s ease}
.dcard::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-50px;top:-60px;background:var(--c);opacity:.28;filter:blur(8px)}
.dcard:hover{box-shadow:0 26px 50px -18px rgba(80,62,160,.38), inset 0 1px 0 var(--hi)}
.dcard-top{display:flex;align-items:center;gap:8px;position:relative}
.qnum{font-family:var(--font-d);font-weight:800;font-size:.92rem;padding:4px 11px;border-radius:999px;background:var(--cs);border:1px solid var(--glass-line);white-space:nowrap}
.tag{font-size:.72rem;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.dcard h3{font-size:1.16rem;position:relative}
.dcard-st{font-size:.88rem;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.dcard-bottom{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:6px;border-top:1px solid var(--hair)}
.dcard-bottom .lv{font-weight:700;font-size:.88rem}
.dcard-bottom small{display:block;color:var(--ink-3);font-size:.76rem}
.foot{margin-top:52px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;color:var(--ink-3);font-size:.84rem}

/* ---------- page démo / exemple ---------- */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;color:var(--ink-2);font-size:.92rem;margin-bottom:14px}
.back:hover{color:var(--ink)}
.demo-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.demo-head h1{font-size:clamp(1.8rem,4.2vw,2.7rem);font-weight:800;margin-top:8px;max-width:24ch}
.mast{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:22px}
.mast b.lv{display:block;font-family:var(--font-d);font-size:1.05rem}
.mast small{color:var(--ink-3);font-size:.8rem}
.statement{padding:20px 22px;margin-bottom:18px;background:linear-gradient(135deg,var(--cs),var(--glass) 70%)}
.statement .lab{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;display:block}
.statement p{font-size:1.04rem;max-width:78ch}
.statement .row{margin-top:12px}
.tabs{display:flex;gap:3px;padding:5px;border-radius:18px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 13px;border-radius:13px;font-weight:700;font-size:.88rem;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px;text-decoration:none}
.tab:hover{color:var(--ink);background:var(--glass)}
.tab[aria-selected="true"]{background:var(--glass-2);color:var(--ink);box-shadow:0 4px 14px -6px rgba(80,62,160,.35), inset 0 0 0 1px var(--glass-line)}
.tab .n{font-size:.68rem;font-weight:800;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--cs);color:var(--ink)}
.tab.colle{color:var(--accent)}
.errata{padding:14px 18px;border-radius:var(--r-m);background:var(--butter-s);border:1px solid var(--glass-line);margin-bottom:18px;font-size:.92rem}
.errata summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.errata ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;color:var(--ink-2)}
.seealso{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* fiche */
.fiche{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:900px){.fiche{grid-template-columns:1fr}}
.skel{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.skel li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.skel li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:.85rem;background:var(--cs);border:1px solid var(--glass-line)}
.skel li span{padding-top:2px;min-width:0}
.mnemo{margin-top:16px;padding:16px 18px;border-radius:var(--r-m);background:linear-gradient(135deg,var(--butter-s),var(--pink-s));border:1px solid var(--glass-line);display:flex;gap:12px;align-items:center}
.mnemo .masc{width:58px;height:74px}
.mnemo .big{font-family:var(--font-d);font-weight:800;font-size:1.25rem;display:block;margin-bottom:4px}
.mnemo p{font-size:.93rem;color:var(--ink-2)}
.qa{border-top:1px solid var(--hair)}
.qa:first-of-type{border-top:0}
.qa summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"+";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--cs);font-weight:800;font-size:.9rem;transition:transform .2s}
.qa[open] summary::before{transform:rotate(45deg)}
.qa > div{padding:0 0 12px 32px;color:var(--ink-2);font-size:.95rem}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{border:1px solid var(--glass-line);background:var(--glass-2);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.key:hover{color:var(--ink);border-color:var(--accent)}
.full{margin-top:18px}
.full ol{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.full li{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding-left:16px;border-left:3px solid var(--c)}
.st{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.why{font-size:.88rem;color:var(--ink-2);padding:8px 12px;border-radius:12px;background:var(--glass-2);border:1px dashed var(--hair)}
.why b{color:var(--ink)}

mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:2px 0;margin:.5em 0 !important}
mjx-container{max-width:100%}

/* schémas */
.dia{margin:0;padding:14px;display:grid;gap:10px}
.dia-view{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%, var(--glass-2), transparent 70%);border:1px solid var(--hair)}
.dia canvas{display:block;width:100%;aspect-ratio:16/10;touch-action:pan-y}
.dia-hint{position:absolute;right:10px;bottom:8px;font-size:.72rem;font-weight:700;color:var(--ink-3);background:var(--glass-2);padding:3px 9px;border-radius:999px;pointer-events:none}
.dia-html{min-height:260px;display:grid;place-items:center;padding:18px 10px}
.dia-html .hs{grid-area:1/1;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .45s, transform .45s;max-width:100%;overflow-x:auto;text-align:center;font-size:1.3rem}
.dia-html .hs.on{opacity:1;transform:none}
.dia-cap{min-height:3.2em;font-size:.95rem;padding:0 4px;color:var(--ink)}
.dia-ctrl{display:flex;align-items:center;gap:8px}
.dia-dots{display:flex;gap:6px;flex:1;justify-content:center}
.ddot{width:9px;height:9px;padding:0;border-radius:999px;border:0;background:var(--hair);transition:width .3s, background .3s}
.ddot.on{width:26px;background:var(--c,var(--accent))}
@media (max-width:560px){.dia canvas{aspect-ratio:5/4}}

/* pas à pas */
.trail{display:grid;gap:10px;margin-bottom:14px}
.done-step{padding:12px 16px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line);font-size:.93rem;color:var(--ink-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.rate-dot{width:12px;height:12px;border-radius:50%;margin-top:7px}
.rate-dot.r1{background:var(--good)}.rate-dot.r2{background:var(--mid)}.rate-dot.r0{background:var(--bad)}
.cur{padding:22px;display:grid;gap:14px}
.cur-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cur-h b{font-family:var(--font-d);font-size:1.12rem}
.hint{padding:10px 14px;border-radius:14px;background:var(--cs);font-weight:600;font-size:.95rem}
.think{padding:20px;border-radius:var(--r-m);border:2px dashed var(--hair);color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:14px;justify-content:center;text-align:left}
.think .masc{width:54px;height:70px}
.reveal-text{font-size:1.02rem}
.rates{display:flex;flex-wrap:wrap;gap:8px}
.rate{border:1px solid var(--glass-line);background:var(--glass-2);padding:10px 16px;border-radius:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.rate:hover{transform:translateY(-1px)}
.rate.r1{color:var(--good)}.rate.r2{color:var(--mid)}.rate.r0{color:var(--bad)}
.ai-out{padding:14px 16px;border-radius:14px;background:var(--lilac-s);border:1px solid var(--glass-line);font-size:.94rem;display:grid;gap:8px}
.ai-out p+p{margin-top:6px}

/* récitation */
.recit-lv{display:flex;gap:6px;flex-wrap:wrap}
.recit-lv button{border:1.5px solid var(--glass-line);background:var(--glass-2);padding:8px 13px;border-radius:12px;font-weight:700;font-size:.86rem}
.recit-lv button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--lilac-s)}
.recit{display:grid;gap:12px}
.recit .hole-step{line-height:2}
.hw{display:inline;border:0;padding:0 2px;margin:0;background:var(--lilac-s);color:var(--accent);border-radius:6px;font-weight:700;letter-spacing:.06em;font-family:var(--font-b);font-size:1em;cursor:pointer}
.hw.open{background:transparent;color:inherit;letter-spacing:0;font-weight:inherit;cursor:default}
.hm{display:inline-flex;align-items:center;gap:4px;border:1.5px dashed var(--accent);background:var(--lilac-s);color:var(--accent);border-radius:9px;padding:0 9px;font-weight:800;font-size:.8rem;line-height:1.7;vertical-align:middle}
.hm.open{border:0;background:transparent;color:inherit;padding:0;font-weight:inherit;font-size:1em}

/* à trous */
.holes{display:grid;gap:12px}
.hole-step{padding:16px 18px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line);line-height:2}
.hole-step .st{display:block;line-height:1.4;margin-bottom:2px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:5.5em;min-height:1.9em;padding:0 10px;margin:0 2px;vertical-align:middle;border-radius:10px;border:1.5px dashed var(--accent);background:var(--lilac-s);color:var(--accent);font-weight:800;font-size:.85rem;line-height:1.4}
.blank:hover{background:var(--glass-2)}
.blank.filled{border-style:solid;cursor:default;color:var(--ink);font-weight:500;font-size:1rem;padding:2px 8px}
.blank.filled.ok{border-color:var(--good);background:var(--mint-s)}
.blank.filled.meh{border-color:var(--mid);background:var(--butter-s)}
.blank.active{box-shadow:0 0 0 4px var(--lilac-s)}
.pop{position:absolute;z-index:60;width:min(440px,calc(100vw - 24px));padding:14px;display:grid;gap:8px;border-radius:20px;background:var(--glass-2);animation:pop .2s ease}
.pop-h{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.choice,.opt{text-align:left;border:1.5px solid var(--glass-line);background:var(--glass);padding:11px 14px;border-radius:14px;font-size:.98rem;overflow-x:auto;transition:border-color .15s, background .15s}
.choice:hover,.opt:hover{border-color:var(--accent)}
.choice.wrong,.opt.bad{border-color:var(--bad);background:var(--pink-s);animation:shake .35s}
.opt.right{border-color:var(--good);background:var(--mint-s)}
.choice[disabled],.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.bad){opacity:.6}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.counter{font-family:var(--font-d);font-weight:800;font-variant-numeric:tabular-nums}

/* qcm */
.qcm{padding:22px;display:grid;gap:14px}
.qprompt{font-size:1.1rem;font-weight:600}
.opts{display:grid;gap:8px}
.feedback{padding:12px 16px;border-radius:14px;display:grid;gap:4px;font-size:.95rem}
.feedback.ok{background:var(--mint-s);border:1px solid color-mix(in srgb, var(--good) 40%, transparent)}
.feedback.no{background:var(--pink-s);border:1px solid color-mix(in srgb, var(--bad) 40%, transparent)}
.feedback b{font-family:var(--font-d)}

/* ordre */
.ord{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.oi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px 12px 8px;border-radius:var(--r-m);background:var(--glass-2);border:1.5px solid var(--glass-line);box-shadow:0 6px 18px -12px rgba(80,62,160,.4);font-size:.94rem;position:relative}
.oi.dragging{z-index:5;box-shadow:0 22px 40px -16px rgba(80,62,160,.55);border-color:var(--accent);transition:none}
.oi.ok{border-color:var(--good);background:var(--mint-s)}
.oi.ko{border-color:var(--bad);background:var(--pink-s)}
.grip{width:34px;align-self:stretch;border:0;background:transparent;display:grid;place-items:center;touch-action:none;cursor:grab;color:var(--ink-3);border-radius:10px}
.grip:active{cursor:grabbing}
.grip svg{width:14px;height:20px}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:30px;height:26px;border-radius:9px;border:1px solid var(--glass-line);background:var(--glass);font-size:.75rem;line-height:1}
.oi .pos{position:absolute;left:-9px;top:-9px;width:22px;height:22px;border-radius:50%;font-size:.72rem;font-weight:800;display:grid;place-items:center;background:var(--good);color:#fff}
.oi.ko .pos{background:var(--bad)}

/* trouve l'erreur */
.err-list{display:grid;gap:10px}
.err-step{text-align:left;padding:14px 16px;border-radius:var(--r-m);background:var(--glass);border:1.5px solid var(--glass-line);display:grid;gap:4px;font-size:.95rem;transition:border-color .15s, transform .15s}
.err-step:hover{border-color:var(--accent);transform:translateX(3px)}
.err-step.right{border-color:var(--good);background:var(--mint-s)}
.err-step.bad{border-color:var(--bad);background:var(--pink-s)}
.err-step[disabled]{cursor:default;transform:none}

/* flashcards */
.deck{display:grid;gap:16px;justify-items:center}
.flip{width:min(640px,100%);perspective:1400px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.flip-in{display:grid;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:240px;padding:28px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--cs),var(--glass) 75%)}
.face .k{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px;align-items:center;justify-content:space-between}
.face .txt{font-size:1.16rem;font-weight:600}
.face.back .txt{font-weight:500;font-size:1.06rem}
.face .turn{margin-top:auto;font-size:.8rem;color:var(--ink-3);font-weight:600}
.boxes{display:flex;gap:4px}
.boxes i{width:14px;height:6px;border-radius:3px;background:var(--hair)}
.boxes i.on{background:var(--good)}

/* résumé */
.summary{padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:18px}
.summary .masc{width:96px;height:124px}
.summary > div:last-child{flex:1;min-width:220px;display:grid;gap:8px}
.summary h3{font-size:1.35rem}

/* colles */
.colle-wrap{max-width:920px;margin:0 auto}
.colle-head{text-align:center;margin-bottom:22px;display:grid;justify-items:center;gap:8px}
.colle-head h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800}
.setup{padding:24px;display:grid;gap:22px}
.setup h3{font-size:1rem;margin-bottom:10px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pk{border:1.5px solid var(--glass-line);background:var(--glass-2);padding:8px 13px;border-radius:14px;font-weight:700;font-size:.9rem}
.pk[aria-pressed="true"]{border-color:var(--accent);background:var(--lilac-s);color:var(--accent)}
.draw{display:grid;place-items:center;gap:14px;padding:36px 20px}
.draw .roll{font-family:var(--font-d);font-weight:800;font-size:clamp(3rem,11vw,5.5rem);line-height:1;min-width:2.4em;height:1.9em;padding:0 .3em;border-radius:999px;display:grid;place-items:center;background:radial-gradient(circle at 30% 28%, var(--hi), transparent 45%), var(--cs, var(--lilac-s));border:1px solid var(--glass-line);box-shadow:var(--shadow);white-space:nowrap}
.run{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
@media (max-width:720px){.run{grid-template-columns:1fr}.timer{order:-1;justify-self:center}}
.run .q{padding:24px;display:grid;gap:12px}
.run .q h2{font-size:1.45rem}
.timer{padding:16px;display:grid;justify-items:center;gap:6px;border-radius:30px}
.timer .t{font-family:var(--font-d);font-weight:800;font-size:1.85rem;font-variant-numeric:tabular-nums}
.timer.over .fgc{stroke:var(--bad)}
.timer.over .t{color:var(--bad)}
.timer .masc{width:70px;height:90px}
.check{display:grid;gap:10px}
.ck{padding:14px 16px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line);display:grid;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--glass-line);background:var(--glass-2);padding:7px 12px;border-radius:12px;font-weight:700;font-size:.86rem}
.seg button[aria-pressed="true"].v1{border-color:var(--good);color:var(--good);background:var(--mint-s)}
.seg button[aria-pressed="true"].v2{border-color:var(--mid);color:var(--mid);background:var(--butter-s)}
.seg button[aria-pressed="true"].v0{border-color:var(--bad);color:var(--bad);background:var(--pink-s)}
.note20{font-family:var(--font-d);font-weight:800;font-size:2.4rem;font-variant-numeric:tabular-nums}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.hub a{padding:22px;display:grid;gap:10px;text-decoration:none;transition:transform .2s}
.hub a:hover{transform:translateY(-3px)}
.hub .masc{width:70px;height:88px}
.hub h2{font-size:1.3rem}
.wheel-wrap{position:relative;width:min(420px,88vw);aspect-ratio:1;margin:0 auto}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--accent);filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));z-index:2}
.wheel-hub{position:absolute;inset:0;margin:auto;width:24%;height:24%;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.wheel-hub img{width:70%;height:90%;object-fit:contain}
.exam-parts{display:grid;gap:10px}
.exam-part{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line)}
.exam-part b{font-family:var(--font-d)}
.exam-part .pts{margin-left:auto;font-family:var(--font-d);font-weight:800}
.stepper{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.stepper span{padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--glass-2);border:1px solid var(--glass-line);color:var(--ink-3)}
.stepper span.on{color:var(--accent);border-color:var(--accent)}
.stepper span.done{color:var(--good)}

/* suivi */
.suivi-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.suivi-grid{grid-template-columns:1fr}}
.mtable{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) 46px;gap:10px;align-items:center;text-decoration:none;font-size:.9rem}
.mrow .bar{height:10px;border-radius:999px;background:var(--hair);overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.mrow b{font-variant-numeric:tabular-nums;text-align:right}
.plan{display:grid;gap:8px}
.pday{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);font-size:.9rem;align-items:center}
.pday.today{border-color:var(--accent);background:var(--lilac-s)}
.pday .d{font-weight:800;font-size:.82rem;color:var(--ink-2)}
.pday .items{display:flex;flex-wrap:wrap;gap:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{padding:14px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line);display:grid;gap:4px;justify-items:center;text-align:center}
.bdg .medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:radial-gradient(circle at 30% 28%, var(--hi), transparent 45%), var(--butter);box-shadow:var(--shadow)}
.bdg .medal .ic{width:24px;height:24px;color:#6b4a14}
.bdg b{font-size:.9rem}
.bdg span{font-size:.76rem;color:var(--ink-3);line-height:1.35}
.bdg.locked{opacity:.5;filter:grayscale(.9)}
.hist{display:grid;gap:6px;font-size:.9rem}
.hist div{display:flex;gap:10px;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--glass)}
.hist b{font-variant-numeric:tabular-nums}

/* vidéos */
.sh-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.sh-thumb{position:relative;aspect-ratio:9/14;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;overflow:hidden;border:1px solid var(--glass-line);background:linear-gradient(170deg,var(--cs),var(--glass) 70%);box-shadow:var(--shadow);transition:transform .2s}
.sh-thumb:hover{transform:translateY(-3px)}
.sh-thumb .masc{position:absolute;right:6px;top:10px;width:56px;height:72px;opacity:.95}
.sh-thumb .lbl{font-size:.72rem;font-weight:800;color:var(--ink-3)}
.sh-thumb b{font-family:var(--font-d);font-size:.98rem;line-height:1.2}
.sh-thumb .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.72rem;color:var(--ink-2)}
.sh-thumb .play{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line)}
.sh-seen{font-weight:800;color:var(--good)}
.sh-overlay{position:fixed;inset:0;z-index:100;background:rgba(20,16,40,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.sh-stage{display:flex;gap:12px;align-items:center;height:min(900px, calc(100vh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));height:min(900px, calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
.sh-frame{position:relative;height:100%;aspect-ratio:9/16;max-width:calc(100vw - 20px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden;border-radius:28px;background:var(--bg)}
.sh-frame::before{content:"";position:absolute;inset:0;background:linear-gradient(170deg,var(--cs),transparent 60%);pointer-events:none}
.sh-top{position:relative;padding:12px 14px 6px;display:grid;gap:8px}
.sh-bars{display:flex;gap:4px}
.sh-bars i{flex:1;height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.sh-bars i b{display:block;height:100%;background:var(--accent);width:0}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head b{font-family:var(--font-d);font-size:1rem;line-height:1.2;flex:1;min-width:0}
.sh-vis{position:relative;min-height:0}
.sh-vis canvas{position:absolute;inset:0;width:100%;height:100%}
.sh-tex{position:absolute;inset:8px 14px;display:grid;place-items:center;text-align:center;font-size:1.45rem;overflow:auto;opacity:0;transition:opacity .4s}
.sh-tex.on{opacity:1}
.sh-tex > div{padding:16px;border-radius:20px;background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:var(--shadow);max-width:100%}
.sh-presenter{position:absolute;left:10px;bottom:4px;width:62px;height:80px;pointer-events:none}
.sh-pause{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sh-pause span{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line)}
.sh-cap{position:relative;padding:6px 16px;font-size:1rem;font-weight:600;min-height:3.4em}
.sh-sub{position:relative;padding:0 16px 14px 80px;font-size:.92rem;color:var(--ink-2);min-height:3em}
.sh-sub span.on{color:var(--ink)}
.sh-sub span.cur{color:var(--accent);font-weight:700}
.sh-rail{position:absolute;right:8px;bottom:120px;display:grid;gap:10px;z-index:3}
.sh-rb{display:grid;justify-items:center;gap:2px;border:0;background:transparent;font-size:.66rem;font-weight:700;color:var(--ink-2)}
.sh-rb .ic,.sh-rb b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line);padding:9px;font-size:.78rem}
.sh-rb[aria-pressed="true"] .ic{color:var(--good)}
.sh-quiz{position:absolute;inset:auto 0 0 0;z-index:4;padding:18px;display:grid;gap:10px;background:var(--glass-2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--glass-line);max-height:78%;overflow:auto}
.sh-side{display:grid;gap:10px;justify-items:center}
@media (max-width:640px){.sh-side{display:none}.sh-frame{border-radius:20px}}
.sh-in-next{animation:shn .35s ease}
.sh-in-prev{animation:shp .35s ease}
@keyframes shn{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shp{from{transform:translateY(-40px);opacity:.3}to{transform:none;opacity:1}}
html.sh-open{overflow:hidden}
html.sh-open .dock{display:none}

/* FAQ, glossaire, Claude */
.faq-item{padding:16px 18px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line)}
.faq-item summary{cursor:pointer;font-weight:700;list-style:none}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item .ans{margin-top:10px;display:grid;gap:8px;color:var(--ink-2)}
.faq-oral{padding:10px 14px;border-radius:12px;background:var(--mint-s)}
.gloss{display:grid;gap:10px}
.gl{padding:14px 16px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line)}
.gl b{font-family:var(--font-d);font-size:1.02rem;display:block;margin-bottom:4px}
.gl.flash{animation:glow 1.6s ease}
@keyframes glow{0%,40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:none}}
.ai-only{display:none!important}
html[data-ai="on"] .ai-only{display:revert!important}
html[data-ai="on"] .no-ai{display:none!important}
.ai-img{display:none!important}
html[data-ai-img="on"] .ai-img{display:revert!important}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chat{display:grid;gap:10px;max-height:460px;overflow:auto;padding:2px}
.msg{padding:12px 14px;border-radius:16px;max-width:88%;font-size:.95rem}
.msg.me{justify-self:end;background:var(--lilac-s)}
.msg.prof{justify-self:start;background:var(--glass-2);border:1px solid var(--glass-line)}
.msg .who{display:block;font-size:.72rem;font-weight:800;color:var(--ink-3);margin-bottom:2px}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.drop{display:grid;justify-items:center;gap:4px;padding:18px;border-radius:16px;border:2px dashed var(--hair);text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--lilac-s)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:10px;cursor:pointer}
.verdict{display:grid;gap:12px}
.status{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--hair)}
.pill{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.pill.ok{background:var(--mint-s);color:var(--good)}.pill.partiel{background:var(--butter-s);color:var(--mid)}.pill.faux,.pill.manquant{background:var(--pink-s);color:var(--bad)}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3);font-weight:600}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* fiche à imprimer */
.print-sheet{display:grid;gap:14px}
.ps-unit{padding:16px 18px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line);break-inside:avoid}
.ps-unit h3{font-size:1.05rem;margin-bottom:6px}
.ps-unit ol{padding-left:20px;display:grid;gap:4px;font-size:.92rem}
@page{size:A4;margin:12mm}
@media print{
  .print-sheet{display:block}.ps-unit{margin-bottom:6px;padding:10px 12px}.ps-unit ol{font-size:.85rem}.page-h h1{font-size:1.6rem}
  .sky,.top,.dock,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .wrap{padding:0;max-width:none}
  .glass,.ps-unit{background:#fff!important;box-shadow:none!important;border:1px solid #ccc!important;-webkit-backdrop-filter:none;backdrop-filter:none}
  .print-sheet{gap:8px}
}

/* fête + toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);z-index:110;padding:11px 18px;border-radius:999px;font-weight:700;font-size:.9rem;animation:pop .25s ease;max-width:calc(100vw - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* Les grilles à une colonne ne doivent jamais s'élargir à cause d'une longue formule (elle défile dans son cadre). */
.holes,.recit,.err-list,.trail,.check,.stack,.opts,.gloss,.cur,.qcm,.ck,.verdict,.exam-parts,.plan,.mtable,.hist,.err-step,.sh-quiz,.setup,.dia,.print-sheet,.ai-out,.feedback,.pop{grid-template-columns:minmax(0,1fr)}
.deck{grid-template-columns:minmax(0,1fr)}
.hole-step,.done-step > div,.reveal-text,.face .txt,.opt,.choice,.qprompt,.statement p,.dcard-st{min-width:0;overflow-wrap:anywhere}
.mj-wide{display:block!important;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:3px 0;text-align:left}
.ord,.flip-in{grid-template-columns:minmax(0,1fr)}
select{max-width:100%;text-overflow:ellipsis}
.gl,.faq-item,.exam-part,.pday,.ps-unit,.box,.panel,.ck,.hole-step{min-width:0;overflow-wrap:anywhere}

/* Pièges du prof (fiche d'unité et fiche imprimable) */
.pieges{padding-left:20px;display:grid;gap:8px;font-size:.95rem}
.ps-pieges{padding-left:18px;display:grid;gap:3px;font-size:.85rem}

/* Formules trop longues : défilement dans leur cadre plutôt que débordement de la page (téléphone) */
mjx-container:not([display="true"]){max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.ps-unit ol li,.ps-unit ol{min-width:0}

/* ---------- Exos de TD ---------- */
.exo-st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;color:var(--ink-3)}
.exo-st.ok{color:var(--good)}.exo-st.re{color:var(--mid)}
.exo-enonce{min-width:0;max-width:100%}
.exo-enonce ol,.exo-enonce ul{padding-left:22px;margin-top:8px;display:grid;gap:4px}
.exo-enonce ol > li,.exo-enonce ul > li{min-width:0}
.exo-enonce .math,.exo-enonce .tip{margin-top:8px}
.exo-q h3 .qnum{font-size:.82rem;padding:2px 10px}
.exo-steps{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:10px}
.exo-steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--glass-line);border-left:3px solid var(--c)}
.exo-steps li.hid{display:none}
.exo-steps li > div{min-width:0}
.exo-steps li ul{padding-left:20px;margin-top:4px;display:grid;gap:2px}
.exo-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:.82rem;background:var(--cs);border:1px solid var(--glass-line)}
.exo-fig{display:flex;justify-content:center;margin-top:8px;color:var(--ink-2)}
.exo-fig svg{max-width:100%;height:auto}
.exo-ans{background:linear-gradient(135deg,var(--mint-s),var(--glass) 70%)}

/* ---------- Fiche PDF des exos ---------- */
.px-sheet{display:grid;gap:14px}
.px-h{font-size:1.3rem;margin-top:8px}
.px-exo{padding:16px 18px;border-radius:var(--r-m);background:var(--glass);border:1px solid var(--glass-line);border-left:4px solid var(--c);display:grid;gap:8px;min-width:0}
.px-exo h3{font-size:1.08rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.px-exo h4{font-family:var(--font-d);font-size:.95rem;margin:4px 0 2px}
.px-enonce{font-size:.93rem;padding:8px 12px;border-radius:12px;background:var(--cs)}
.px-idea{font-size:.88rem;color:var(--ink-2)}
.px-part ol{padding-left:22px;display:grid;gap:3px;font-size:.92rem}
.px-part ol li{min-width:0}
.px-part ul{padding-left:18px}
.px-ans{font-size:.9rem;padding:8px 12px;border-radius:12px;background:var(--mint-s)}
@media print{
  .px-sheet{display:block}
  .px-exo{display:block;margin-bottom:8px;padding:10px 12px;background:#fff!important;border:1px solid #ccc!important;border-left:4px solid var(--c)!important;box-shadow:none!important}
  .px-exo > * + *{margin-top:6px}
  .px-exo h3{break-after:avoid}
  .px-part{display:block}
  .px-part li{break-inside:avoid}
  .px-part h4{break-after:avoid}
  .px-ans,.px-enonce,.exo-fig{break-inside:avoid}
  .px-h{break-after:avoid}
  .px-h:not(:first-child){break-before:page}
  .px-enonce,.px-ans{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .px-exo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .px-exo .exo-fig svg{width:170px;height:170px}
}

/* Multi-colles : onglets de colle sur l'accueil, compte à rebours en texte */
.colle-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.countdown-line{font-weight:600;margin-bottom:14px;line-height:1.45}

/* ===== Socle « ouvrage de référence » =====
   Étape 1 de la refonte : règles communes (fond, bandeau, typographie, feuilles, boutons, onglets, étiquettes).
   Elles passent par-dessus l'ancien style, qui sera retiré page par page. */
body{background:var(--bg);font-family:var(--font-b);font-size:16px;line-height:1.6;font-feature-settings:"cv11","ss01"}
.sky,.bub{display:none!important}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.015em;line-height:1.14}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}

/* feuille : surface blanche + filet, rien d'autre */
.glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:none}
.wrap{max-width:1080px;padding-block:0 96px}

/* bandeau du haut : plat, filet bas sur toute la largeur */
.top{position:sticky;top:0;z-index:30;margin-bottom:44px;padding:12px 0;gap:14px;border:0;border-radius:0;background:var(--bg)}
.top::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:var(--bg);border-bottom:1px solid var(--line);z-index:-1}
.brand{font-family:var(--font-d);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;gap:7px}
.brand-mark{width:auto;height:auto;background:none;border-radius:0;color:var(--accent);font-family:var(--font-d);font-style:italic;font-weight:400;font-size:1.5rem;line-height:1}
.nav{gap:18px}
.nav a{padding:6px 0;border-radius:0;font-weight:500;font-size:.86rem;color:var(--ink-3);border-bottom:2px solid transparent}
.nav a:hover{background:none;color:var(--ink)}
.nav a[aria-current="page"]{background:none;box-shadow:none;color:var(--ink);border-bottom-color:var(--accent)}
.icon-btn{border-radius:var(--r-s);background:transparent;border:1px solid var(--line)}
.icon-btn:hover{background:var(--surface);border-color:var(--line-2)}

/* étiquettes : mono, petites capitales espacées */
.eyebrow,.tag,.st,.statement .lab,.chip,.streak,.kb,.lvl span{font-family:var(--font-m);font-weight:500;text-transform:uppercase;letter-spacing:.09em;font-size:.68rem}
.eyebrow{color:var(--ink-3);letter-spacing:.14em}
.chip,.streak{background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);padding:4px 8px}
.chip.c{background:transparent;color:var(--ink-2)}
.chip.cloud .led{background:var(--good)}
.streak svg{color:var(--accent)}
.colle-sel{color:var(--ink);border-color:var(--line-2)}
.dot{box-shadow:none;width:6px;height:6px;background:var(--accent)}
.kb{background:var(--bg-2);border-radius:3px}

/* boutons : un primaire bordeaux, un secondaire à filet d'encre, un tertiaire discret */
.btn{border-radius:var(--r-s);font-weight:600;font-size:.9rem;padding:10px 18px;min-height:40px;transition:background .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{transform:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.primary:hover{background:var(--accent-2)}
.btn.soft{background:transparent;border:1px solid var(--ink);box-shadow:none;color:var(--ink)}
.btn.soft:hover{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink)}
.btn.small{padding:7px 13px;font-size:.84rem;min-height:34px;border-radius:var(--r-s)}
.btn.tiny{border-radius:4px;min-height:0}
@media (max-width:640px){.btn{min-height:44px}.btn.small{min-height:38px}}

/* titres de page */
.page-h{margin-bottom:32px;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.page-h h1{font-size:clamp(2rem,4.6vw,3rem);font-weight:600}
.sec-h h2{font-size:1.45rem}
.box h3{font-size:1.12rem}
.box h3 .ic{color:var(--ink-3)}
.lead{font-size:1.05rem}

/* champs */
input[type="date"],input[type="text"],input[type="search"],textarea,select{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:0;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* progression : un trait fin */
.progress{height:3px;border-radius:0;background:var(--line)}
.progress i{background:var(--accent);border-radius:0}
.ring .fgc{stroke:var(--accent)}
.ring b{font-family:var(--font-m);font-weight:500;letter-spacing:0}

/* accueil */
.hero h1{font-weight:600;letter-spacing:-.02em}
.hero h1 span{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--accent);font-style:italic}
.countdown{background:none;border:0;border-left:2px solid var(--accent);border-radius:0;padding:4px 0 4px 14px}
.countdown b{font-family:var(--font-d);font-weight:600}
.lvl{background:none;border:0;border-top:1px solid var(--line);border-radius:0}
.lvl b{font-family:var(--font-d);font-weight:600}
.next-up{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m)}
.next-up .q{font-family:var(--font-d);font-weight:600}
.next-up .go{color:var(--accent);font-weight:600}
.qk{transition:border-color .15s ease}
.qk:hover{transform:none;border-color:var(--ink)}
.qk .ic{color:var(--ink-3);width:20px;height:20px}
.qk b{font-family:var(--font-d);font-weight:600}
.method li::before,.skel li::before{background:none;border:0;border-radius:0;width:auto;height:auto;display:block;font-family:var(--font-d);font-weight:400;font-style:italic;font-size:1.5rem;line-height:1;color:var(--accent)}

/* cartes d'unité : numéro, titre, filet */
.dcard{transform:none!important;transition:border-color .15s ease}
.dcard::before{display:none}
.dcard:hover{box-shadow:none;border-color:var(--ink)}
.dcard h3{font-size:1.2rem}
.qnum{font-family:var(--font-m);font-weight:500;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;padding:0;border:0;border-radius:0;background:none;color:var(--accent)}
.dcard-bottom .lv{font-weight:600}

/* page d'unité : énoncé en encadré de théorème, onglets soulignés */
.demo-head h1{font-weight:600}
.mast{border-radius:var(--r-m)}
.mast b.lv{font-family:var(--font-d);font-weight:600}
.statement{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r-m) var(--r-m) 0}
.statement p{font-family:var(--font-d);font-size:1.1rem;line-height:1.55}
.tabs{gap:22px;padding:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.tab{padding:10px 0;border-radius:0;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{background:none;color:var(--ink)}
.tab[aria-selected="true"]{background:none;box-shadow:none;color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{background:none;font-family:var(--font-m);font-weight:500;color:var(--ink-3);min-width:0;padding:0}
.tab.colle{color:var(--accent)}
.errata{background:var(--surface-2);border-color:var(--line)}
.mnemo{background:var(--surface-2);border:1px solid var(--line)}
.mnemo .big{font-family:var(--font-d);font-weight:600}
.qa summary::before{background:none;border:1px solid var(--line-2);font-weight:400}
.key{background:transparent;border-color:var(--line-2);font-weight:500}
.full li{border-left:1px solid var(--line-2)}
.why{background:var(--surface-2);border:0;border-left:2px solid var(--line-2);border-radius:0}
.dia-view{background:var(--surface-2);border-radius:var(--r-m)}
.dia-hint{background:var(--surface)}
.ddot.on{background:var(--accent)}
.hint{background:var(--accent-soft)}
.rate{border-radius:var(--r-s);background:transparent;border-color:var(--line-2)}
.rate:hover{transform:none;border-color:var(--ink)}
.ai-out{background:var(--surface-2)}
.exo-ans,.face.back{background:var(--surface-2)}
.bdg .medal{background:none;border:1px solid var(--line-2);color:var(--ink-2)}
.sh-overlay{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.72)}
.sh-frame::before{display:none}

/* mouvement : court, et coupé si l'utilisateur le demande */
.anim-in{animation:rise .16s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media (max-width:640px){.top{margin-bottom:28px;gap:8px}.nav{gap:14px}}

/* ----- Accueil : la une ----- */
.link{color:var(--ink-2);font-size:.9rem;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;transition:color .15s,text-decoration-color .15s}
.link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.rule-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.rule-h h2{font-size:1.3rem}
.une{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:end;padding-bottom:40px;margin-bottom:48px;border-bottom:1px solid var(--line)}
.une h1{font-size:clamp(3.2rem,10vw,6.5rem);font-weight:600;letter-spacing:-.035em;line-height:.95;margin:18px 0 10px}
.une-sub{font-family:var(--font-d);font-style:italic;font-size:clamp(1.15rem,2.4vw,1.5rem);color:var(--ink-2);max-width:32ch;line-height:1.3}
.une-count,.une-note,.toc-p,.toc-t small,.idx span,.une-lv dt{font-family:var(--font-m);font-size:.72rem;letter-spacing:.04em;color:var(--ink-3)}
.une-count{margin-top:14px;text-transform:uppercase;letter-spacing:.09em}
.une .countdown-line{font-weight:400;color:var(--ink-2);margin:18px 0 0;max-width:46ch}
.une .countdown-line b{color:var(--accent)}
.une-cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:26px}
.colle-tabs{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px}
.colle-tabs .pk{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:4px 0;font-family:var(--font-m);font-size:.72rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.colle-tabs .pk:hover{color:var(--ink)}
.colle-tabs .pk[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);background:none;box-shadow:none}
.une-side{border-top:1px solid var(--ink);padding-top:12px}
.une-big{font-family:var(--font-d);font-weight:600;font-size:4.2rem;line-height:1;letter-spacing:-.03em;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.une-big span{font-size:1.4rem;font-weight:400;color:var(--ink-3);letter-spacing:0}
.une-note{margin-top:12px;line-height:1.7}
.une-lv{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0 0;border-top:1px solid var(--line)}
.une-lv div{padding:10px 0 0}
.une-lv dt{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em}
.une-lv dd{margin:2px 0 0;font-family:var(--font-d);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.une-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.toc-row{display:grid;grid-template-columns:44px minmax(0,1fr) 120px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.toc-n{font-family:var(--font-d);font-style:italic;font-size:1.7rem;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums;transition:color .15s}
.toc-t{display:grid;gap:2px;min-width:0}
.toc-t b{font-family:var(--font-d);font-weight:600;font-size:1.08rem;line-height:1.25;transition:color .15s}
.toc-t small{text-transform:uppercase;letter-spacing:.08em;font-size:.64rem}
.toc-m{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:10px;align-items:center}
.toc-m .progress{min-width:0;height:2px}
.toc-p{text-align:right;font-variant-numeric:tabular-nums}
.toc-row:hover .toc-n,.toc-row:hover .toc-t b{color:var(--accent)}
.idx a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none}
.idx b{font-weight:500;font-size:.95rem;transition:color .15s}
.idx span{text-align:right}
.idx a:hover b{color:var(--accent)}
.methode{list-style:none;margin:0;padding:0;counter-reset:m}
.methode li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.methode li::before{content:counter(m);grid-row:1/3;font-family:var(--font-d);font-style:italic;font-size:1.25rem;line-height:1.1;color:var(--accent)}
.methode b{font-weight:500;font-size:.95rem}
.methode span{font-size:.82rem;color:var(--ink-3);line-height:1.45}
.foot{border-top:1px solid var(--line);padding-top:16px;font-family:var(--font-m);font-size:.7rem;letter-spacing:.03em}
@media (max-width:900px){.une,.une-cols{grid-template-columns:minmax(0,1fr);gap:36px}.une{align-items:start}}
@media (max-width:560px){.toc-row{grid-template-columns:32px minmax(0,1fr) 44px;gap:10px}.toc-n{font-size:1.35rem}.toc-m{grid-template-columns:1fr}.toc-m .progress{display:none}}

/* Fiches imprimables sur petit écran : les formules longues défilent dans la feuille au lieu d’élargir la page. */
@media (max-width:640px){.print-sheet,.px-exo{overflow-x:auto;overflow-y:hidden}}
/* ===== Mouvement (storyboard : docs/motion-storyboard.md) =====
   L'état final est toujours le style par défaut ; les animations sont jouées par src/motion.js. */
:root{
  --t-fast:140ms; --t-std:280ms; --t-big:800ms;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-io:cubic-bezier(.65,0,.35,1);
}

/* Élément en attente de ses formules (posé juste avant l'animation, retiré au départ). */
.m-pre{opacity:0}

/* Filet porté par une bordure : la bordure est masquée pendant le tracé, un pseudo-élément la remplace. */
.m-rule{position:relative}
.m-rule-top{border-top-color:transparent!important}
.m-rule-bottom{border-bottom-color:transparent!important}
.m-rule-left{border-left-color:transparent!important}
.m-rule-top::before,.m-rule-bottom::after,.m-rule-left::before{content:"";position:absolute;background:var(--m-rc,var(--ink));pointer-events:none}
.m-rule-top::before{left:0;right:0;top:calc(-1 * var(--m-rw,1px));height:var(--m-rw,1px);transform-origin:left center}
.m-rule-bottom::after{left:0;right:0;bottom:calc(-1 * var(--m-rw,1px));height:var(--m-rw,1px);transform-origin:left center}
.m-rule-left::before{top:-1px;bottom:-1px;left:calc(-1 * var(--m-rw,1px));width:var(--m-rw,1px);transform-origin:center top}

/* Filet de l'onglet actif (navigation, modes) : un pseudo-élément à la place de la bordure, pour pouvoir glisser (A3). */
.nav a,.tab{position:relative}
.nav a[aria-current="page"],.tab[aria-selected="true"]{border-bottom-color:transparent}
.nav a[aria-current="page"]::after,.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent);transform-origin:left center;pointer-events:none}

/* ----- A3 / A4 : View Transitions ----- */
.top{view-transition-name:top}
#app{view-transition-name:app}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(top){display:none}
::view-transition-new(top){animation:none}
::view-transition-group(app){animation:none}
::view-transition-old(app){animation:m-vt-out 120ms linear both}
::view-transition-new(app){animation:m-vt-in 280ms var(--ease-out) 120ms both}
.m-vt-mobile::view-transition-new(app){animation-name:m-vt-in-m}
::view-transition-group(unit-title),::view-transition-group(unit-num){animation-duration:300ms;animation-timing-function:var(--ease-out)}
::view-transition-old(unit-title),::view-transition-old(unit-num){animation:m-vt-out 150ms linear both}
::view-transition-new(unit-title),::view-transition-new(unit-num){animation:m-vt-fade 300ms linear both}
@keyframes m-vt-out{to{opacity:0}}
@keyframes m-vt-fade{from{opacity:0}}
@keyframes m-vt-in{from{opacity:0;transform:translateY(8px)}}
@keyframes m-vt-in-m{from{opacity:0;transform:translateY(4px)}}

/* ----- A6 : Pas à pas ----- */
.cur-h b i{font-style:italic;display:inline-block}

/* ----- A8 : validation ----- */
.done-step{position:relative}
.done-step.has-mark{padding-right:38px}
.m-check{position:absolute;right:14px;top:14px;width:12px;height:12px;fill:none;stroke:var(--good);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.m-miss{position:absolute;left:16px;right:16px;bottom:6px;height:1px;background:var(--accent);transform-origin:left center}
.m-sum-bar{max-width:260px;margin:2px 0}

/* ----- A9 : estampille ----- */
.m-stamp{position:fixed;right:24px;z-index:60;width:220px;height:132px;background:var(--surface);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 14px;text-align:center;cursor:pointer;outline:0}
.m-stamp-frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.m-stamp-frame rect{fill:none;vector-effect:non-scaling-stroke}
.m-stamp-frame .o{stroke:var(--ink);stroke-width:1}
.m-stamp-frame .i{stroke:var(--accent);stroke-width:.5}
.m-stamp-m{position:relative;font-family:var(--font-m);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.m-stamp-b{position:relative;font-family:var(--font-d);font-style:italic;font-weight:600;font-size:3.4rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.m-stamp-s{position:relative;font-size:.8rem;color:var(--ink-2);line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-stamp.nobig{gap:8px}
.m-stamp.nobig .m-stamp-m{font-size:.8rem}
.m-stamp.mini{position:relative;right:auto;z-index:auto;width:140px;height:auto;min-height:64px;padding:6px 10px;gap:2px;margin:10px 0;cursor:default}
.m-stamp.mini .m-stamp-b{font-size:1.5rem}
.m-stamp.mini .m-stamp-m{font-size:.58rem}
.m-stamp.mini .m-stamp-s{font-size:.66rem}
@media (max-width:640px){
  .m-stamp:not(.mini){right:auto;left:50%;margin-left:-90px;width:180px;height:108px}
  .m-stamp:not(.mini) .m-stamp-b{font-size:2.6rem}
}
@media print{.m-stamp:not(.mini){display:none}}

/* ----- A8 : marques posées par Motion.mark (QCM, trous, erreurs) ; plus de secousse ----- */
.m-mark-host{position:relative}
.opt.m-mark-host,.err-step.m-mark-host,.choice.m-mark-host{padding-right:38px}
.choice.wrong,.opt.bad{animation:none}
.blank > .m-check{position:static;display:inline-block;margin-left:6px;vertical-align:middle;flex:none}
.err-step > .m-miss,.opt > .m-miss,.choice > .m-miss{bottom:4px}

/* ----- A5 : terme clé souligné ----- */
.m-u{position:relative;display:inline-block;max-width:100%}
.m-u::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--accent);transform-origin:left center;pointer-events:none}

/* ----- Flashcards : retournement à plat (pas de 3D) ----- */
.flip{perspective:none}
.flip-in,.flip.on .flip-in{transform:none;transition:none;transform-style:flat}
.face,.face.back{transform:none;backface-visibility:visible;-webkit-backface-visibility:visible}
.flip .face.back,.flip.on .face:not(.back){visibility:hidden}
.flip.on .face.back{visibility:visible}

/* ----- Chrono des colles en mono ----- */
.timer .t{font-family:var(--font-m);font-weight:500;letter-spacing:.02em}

/* ----- A10 : formule en attente de MathJax = ligne grise fixe à sa place ----- */
.m-tex{display:inline-block;width:var(--w,3em);max-width:100%;height:1px;background:var(--line-2);vertical-align:middle;overflow:hidden;color:transparent;white-space:nowrap;user-select:none}
.m-tex.d{display:block;width:40%;margin:1.1em auto}
/* A5 : formule en attente de sa première apparition (grand écran) ; retirée à l’apparition ou au premier clic. */
.m-clip{clip-path:inset(0 100% 0 0)}
/* ===== Chatbot compagnon (session « Chatbot UX/UI ») =====
   Ouvrage de référence : papier, filets fins, serif pour les réponses. Ni bulle, ni ombre, ni flou. */

/* ----- Languette « Questions » ----- */
.cmp-tab{display:none;position:fixed;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:85;width:28px;height:112px;padding:0;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);border-right:0;border-radius:var(--r-s) 0 0 var(--r-s);
  font-family:var(--font-m);font-size:.62rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  transition:transform 140ms cubic-bezier(.2,.7,.2,1),color 140ms,border-color 140ms}
.cmp-tab span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block}
html[data-ai="on"] .cmp-tab{display:grid;place-items:center}
.cmp-tab:hover{transform:translateX(-3px);color:var(--accent);border-color:var(--accent)}
.cmp-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cmp-tab[aria-expanded="true"]{color:var(--accent)}

/* ----- Panneau ----- */
.cmp{position:fixed;inset:0 0 0 auto;width:min(400px,100vw);z-index:90;pointer-events:none}
.cmp[hidden]{display:none}
.cmp-rule{position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line-2);transform-origin:top;z-index:2}
.cmp-sheet{position:absolute;inset:0;pointer-events:auto;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;min-height:0;outline:0}
.cmp-veil{position:fixed;inset:0;z-index:89;background:var(--bg);opacity:.6}
html.cmp-push .wrap{--cmp-side:max(0px,calc((100vw - 400px - 1140px) / 2));margin-left:var(--cmp-side);margin-right:calc(400px + var(--cmp-side))}
html[data-cmp] .cmp-tab{visibility:hidden}

.cmp-grip{display:none}
.cmp-head{position:relative;padding:18px 22px 16px;flex:none}
.cmp-tools{display:flex;align-items:center;gap:12px;min-height:28px}
.cmp-sp{flex:1}
.cmp-tools .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#cmp-new{white-space:nowrap}
.cmp-x{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r-s);background:transparent;font-size:1.2rem;line-height:1;color:var(--ink-2)}
.cmp-x:hover{border-color:var(--ink);color:var(--ink)}
.cmp-title{font-family:var(--font-d);font-weight:600;font-size:1.55rem;line-height:1.15;margin:14px 0 0;letter-spacing:-.01em}
.cmp-sub{margin:4px 0 0;font-family:var(--font-d);font-style:italic;color:var(--ink-3);font-size:.95rem;line-height:1.35}
.cmp-sub:empty{display:none}
.cmp-hr{position:absolute;left:22px;right:22px;bottom:0;height:1px;background:var(--line);transform-origin:left}
.cmp-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 22px 22px;overscroll-behavior:contain}
.cmp-foot{flex:none;padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line);background:var(--surface)}

/* Accueil : suggestions en liens soulignés, puis raccourcis */
.cmp-eb{margin:0 0 8px}
.cmp-sug,.cmp-short{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
.cmp-sug a,.cmp-short a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;text-decoration-thickness:1px;font-family:var(--font-d);font-size:1.02rem;line-height:1.4}
.cmp-sug a:hover,.cmp-short a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.cmp-short{gap:6px}
.cmp-short a{font-family:var(--font-b);font-size:.9rem;color:var(--ink-2)}

/* ----- Messages (communs au panneau, à l'oral et aux explications) ----- */
.cx-thread{display:grid;gap:0}
.cx-thread.cx-inline{max-height:520px;overflow-y:auto;overflow-x:hidden;padding-right:4px}
.cx-msg{min-width:0}
.cx-thread>.cx-msg+.cx-msg{margin-top:18px}
.cx-thread>.cx-ai+.cx-me{padding-top:18px;border-top:1px solid var(--line)}
.cx-ai{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:start}
.cx-who{font-family:var(--font-m);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);line-height:1.6rem;padding-top:1px;overflow-wrap:anywhere}
.cx-col{min-width:0;display:grid;gap:10px}
.cx-text{min-width:0}
.cx-ai .cx-text{font-family:var(--font-d);font-size:1rem;line-height:1.6;color:var(--ink);display:grid;gap:10px;max-width:68ch}
.cx-ai .cx-text p{margin:0}
.cx-ai .cx-text ul,.cx-ai .cx-text ol{margin:0}
.cx-ai .cx-text:empty{display:none}
.cx-blk:empty{display:none}
.cx-me{justify-self:end;max-width:80%;margin-left:auto;padding:2px 12px 2px 0;border-right:1px solid var(--ink);text-align:right;font-family:var(--font-b);font-size:.92rem;line-height:1.5;color:var(--ink-2)}
.cx-me p{margin:0}.cx-me p+p{margin-top:6px}
/* Colonnes bornées : une formule large défile au lieu d'élargir la colonne. */
.cx-col,.cx-ai .cx-text,.cx-sb,.cx-hb,.cx-box{grid-template-columns:minmax(0,1fr)}
.cx-blk,.cx-col>*,.cx-sb>*,.cx-box>*,.cx-hb>*,.cx-step>*{min-width:0}
.cx-msg mjx-container[display="true"]{display:block;text-align:center;overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.4em 0!important}
.cx-msg mjx-container:not([display="true"]){max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}

/* Composants des réponses structurées */
.cx-step{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:8px;align-items:baseline}
.cx-n{font-family:var(--font-d);font-style:italic;font-size:1.3rem;line-height:1;color:var(--accent)}
.cx-sb{min-width:0;display:grid;gap:6px}
.cx-sb p,.cx-hb p,.cx-box p{margin:0}
.cx-hint summary{cursor:pointer;list-style:none;display:inline;color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-family:var(--font-b);font-size:.9rem}
.cx-hint summary::-webkit-details-marker{display:none}
.cx-hint summary::before{content:"+ ";font-family:var(--font-m)}
.cx-hint[open] summary::before{content:"− "}
.cx-hint .cx-hb{margin-top:8px;padding-left:14px;border-left:2px solid var(--line-2);display:grid;gap:6px}
.cx-box{padding:2px 0 2px 14px;border-left:2px solid var(--ink-3);display:grid;gap:6px}
.cx-box.cx-warn{border-left-color:var(--accent)}
.cx-lab{font-family:var(--font-m);font-size:.62rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cx-warn>.cx-lab,.cx-err .cx-lab{color:var(--accent)}
.cx-good{color:var(--good);font-weight:600}
.cx-bad{color:var(--accent);font-weight:600}

/* Attente : filet bordeaux de 2 px, libellé mono */
.cx-wait{display:grid;gap:6px;margin:10px 0 0 52px;max-width:240px}
.cx-inline .cx-wait,.cx-page .cx-wait,.cx-msg~.cx-wait{margin-left:52px}
.cx-bar{display:block;height:2px;background:var(--line);overflow:hidden}
.cx-bar i{display:block;height:100%;background:var(--accent);transform:scaleX(.9);transform-origin:left}
.cx-wl{font-family:var(--font-m);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
span.cx-wait{display:inline-grid;margin:0;min-width:200px}
.cx-page>.cx-anchor+.cx-wait{margin-left:0}

/* Erreur, pied de message */
.cx-err{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding-top:8px;border-top:1px solid var(--accent);font-size:.88rem;color:var(--ink-2)}
.cx-link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-family:var(--font-b);font-size:.82rem;cursor:pointer}
.cx-link:hover{color:var(--ink)}
.cx-foot{display:flex;gap:14px}
.cx-foot .cx-link{color:var(--ink-3);font-size:.78rem}
.cx-foot .cx-link:hover{color:var(--accent)}
.cx-stamp:empty{display:none}

/* Zone de saisie */
.cx-composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.cx-composer textarea{width:100%;resize:none;min-height:44px;max-height:160px;padding:10px 12px;font:inherit;font-size:.95rem;line-height:1.45;color:var(--ink)}
.cx-cbtn{display:grid;gap:6px}

/* Correction de copie */
.cx-verdict{display:grid;gap:14px}
.cx-vhead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:baseline}
.cx-vres{flex:1;min-width:200px;font-family:var(--font-d);line-height:1.55}

/* ----- Mobile : feuille du bas ----- */
@media (max-width:640px){
