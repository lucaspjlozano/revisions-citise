    const W = box.offsetWidth, H = box.offsetHeight, svg = box.firstElementChild;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const [ro, ri] = svg.querySelectorAll('rect');
    ro.setAttribute('width', W - 1); ro.setAttribute('height', H - 1);
    ri.setAttribute('width', Math.max(0, W - 9)); ri.setAttribute('height', Math.max(0, H - 9));
    const k = mini ? 0.6 : 1, q = (x) => Math.round(x * k);
    if (!M.reduced) {
      M.drawStroke(ro, { dur: q(400) });
      M.drawStroke(ri, { dur: q(350), delay: q(100) });
      anim($('.m-stamp-m', box), { clipPath: ['inset(0 100% 0 0)', 'inset(0 0 0 0)'] }, { duration: q(220), delay: q(300), easing: EASE_IO });
      const b = $('.m-stamp-b', box); if (b) anim(b, { opacity: [0, 1], transform: ['scale(1.04)', 'none'] }, { duration: q(280), delay: q(420) });
      const s = $('.m-stamp-s', box); if (s) anim(s, { opacity: [0, 1] }, { duration: q(300), delay: q(600) });
    }
    if (mini) return box;

    let hold = 0, closing = false;
    const close = () => {

      if (M.reduced || !box.isConnected) return rm();
      const a = anim(box, { opacity: [1, 0], transform: ['none', 'translateY(-4px)'] }, { duration: 280, fill: 'forwards', easing: EASE_IO });
      if (a) a.finished.then(rm, rm); else rm();

    };
    const arm = (ms) => { clearTimeout(hold); hold = setTimeout(close, ms); };
    const onEsc = (e) => { if (e.key === 'Escape') close(); };
    box.addEventListener('mouseenter', () => clearTimeout(hold));
    box.addEventListener('mouseleave', () => arm(1200));
    box.addEventListener('focusin', () => clearTimeout(hold));
    box.addEventListener('focusout', () => arm(1200));
    box.addEventListener('click', close);
    document.addEventListener('keydown', onEsc);
    arm((M.reduced ? 0 : 900) + 2500);
    return box;
  };

  return M;
})();

/* ---------- Résumé de fin de mode ---------- */
function summary(host, u, mode, result, opts = {}) {
  const { before, after } = record(u.id, mode, result, opts.extra);
  const pct = Math.round(result * 100);
  const nx = NEXT[mode];
  const box = document.createElement('div');
  box.className = 'summary glass anim-in'; box.style.cssText = colorVars(u);
  box.innerHTML = `${mascotImg(moodFor(pct), 'jump')}${ring(pct, 96, 9)}<div>
    <h3>${cheer(pct)}</h3>
    <p class="muted">Maîtrise ${u.kind === 'demo' ? 'de la ' : 'de l’'}${u.label} : ${before}% → <b class="m-after">${after}%</b></p>
    <div class="progress m-sum-bar" aria-hidden="true"><i style="width:${after}%"></i></div>
    ${opts.note || ''}
    <div class="row" style="margin-top:6px"><button class="btn soft small" data-again>${icon('reset')}Recommencer</button>
    ${nx ? `<a class="btn primary small" href="${modeHref(u.id, nx)}">${MODES[nx].label} →</a>` : ''}
    <a class="btn ghost small" href="#accueil">Tableau de bord</a></div></div>`;
  host.appendChild(box);
  typeset(box);
  box.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
  Mascot.result(pct);
  summaryMotion(box, pct, before, after);
  if (pct >= 80) {
    const info = { mention: after >= 80 ? 'Maîtrisée' : MODES[mode].label, big: `${pct} %`, sub: `${u.label} · ${plainText(u.title)}` };
    if (Motion.reduced) celebrate(info); else setTimeout(() => celebrate(info), 700);
  }
  return box;
}
const plainText = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.trim(); };
/* A8 (fin de mode) : le résultat se compte de 0 à pct, l'anneau se trace, le trait de maîtrise passe de « avant » à « après ». */
function summaryMotion(box, pct, before, after) {
  if (Motion.reduced) return;
  const fg = $('.ring .fgc', box), lab = $('.ring b', box);
  if (fg && pct > 0) {
    const len = parseFloat(fg.getAttribute('stroke-dasharray')) || 0;
    Motion.anim(fg, { strokeDashoffset: [len, 0] }, { duration: 600, easing: Motion.EASE_IO });
  }
  if (lab) Motion.countUp(lab, pct, { dur: 600 });
  const bar = $('.m-sum-bar i', box);
  if (bar && after > 0) Motion.drawStroke(bar, { from: clamp(before / after, 0, 1), delay: 200, dur: 600 });
  const ab = $('.m-after', box); if (ab && after !== before) Motion.countUp(ab, after, { from: before, delay: 200, dur: 600 });
  const nt = $('.note20', box); if (nt) Motion.resultIn(nt.parentElement, { delay: 200 }); // note de colle blanche
}

const missKey = (u, type, i) => `${u.id}|${type}|${i}`;
function blankList(u) {
  const out = [];

}
function missItem(m) {
  const u = byId[m.unit]; if (!u) return null;
  const i = +m.i;
  if (m.type === 'qcm' && u.qcm[i]) return { kind: 'qcm', ...u.qcm[i] };
  if (m.type === 'card' && u.cards[i]) return { kind: 'card', q: u.cards[i].q, a: u.cards[i].a };
  if (m.type === 'colleur' && u.colleur[i]) return { kind: 'card', q: u.colleur[i].q, a: u.colleur[i].a };
  if (m.type === 'err' && u.erreurs[i]) { const e = u.erreurs[i]; return { kind: 'card', q: `Trouve l'erreur : « ${e.bad} »`, a: `${e.why}<br><br><b>Version juste :</b> ${plain(u.steps[e.k].x)}` }; }
  if (m.type === 'trou') {
    const all = blankList(u), bl = all[i]; if (!bl) return null;
    const local = all.filter((b, j) => b.si === bl.si && j < i).length;

}

/* ---------- Pas à pas ---------- */
function panelEtapes(u, el) {
  let i = 0, shown = false, hint = false; const rates = [];
  const RL = { 1: 'Je l\'avais', 0.5: 'À moitié', 0: 'Je ne l\'avais pas' };
  function trail() {
    return u.steps.slice(0, i).map((s, k) => `<div class="done-step${rates[k] === 0.5 ? '' : ' has-mark'}"><span class="rate-dot r${rates[k] === 1 ? 1 : rates[k] === 0.5 ? 2 : 0}" title="${RL[rates[k]]}"></span><div>${plain(s.x)}</div>${markHTML(rates[k])}</div>`).join('');
  }
  let lastAction = null; // 'rate' juste après une auto-évaluation : on anime le passage d'étape (A6, A8)
  function render() {
    mathClear(el);
    const act = lastAction; lastAction = null;
    if (i >= u.steps.length) {
      el.innerHTML = `<div class="trail">${trail()}</div>`; typeset(el);
      if (act === 'rate') stepMotion(el, { n: u.steps.length, i });
      const r = rates.reduce((a, b) => a + b, 0) / rates.length;
      summary(el, u, 'etapes', r).querySelector('[data-again]').onclick = () => { i = 0; shown = false; hint = false; rates.length = 0; render(); };
      refreshMast(); return;
    }
    const s = u.steps[i];
    el.innerHTML = `
      <div class="trail">${trail()}</div>
      <section class="cur glass">
        <div class="cur-h"><b>Étape <i>${i + 1}</i> sur ${u.steps.length}</b><div class="progress"><i style="width:${i / u.steps.length * 100}%"></i></div></div>
        ${hint || shown ? `<div class="hint">Indice : ${s.t}</div>` : ''}
        ${shown ? `<div class="reveal-text">${keyed(s.x)}</div>
          ${s.why ? `<div class="why"><b>Pourquoi ?</b> ${s.why}</div>` : ''}
          <div class="ai-only"><button class="btn ghost small" id="ai-exp">${icon('spark')}Explique-moi autrement</button><div id="ai-exp-out" style="margin-top:8px"></div></div>
          <div class="rates">
            <button class="rate r1" data-r="1"><span class="kb">1</span> Je l'avais</button>
            <button class="rate r2" data-r="0.5"><span class="kb">2</span> À moitié</button>
            <button class="rate r0" data-r="0"><span class="kb">3</span> Je ne l'avais pas</button>
          </div>`
        : `<div class="think">${mascotImg('think')}<span>Dis cette étape à voix haute (ou écris-la), puis vérifie.</span></div>
          <div class="row"><button class="btn primary" data-show>Afficher l'étape <span class="kb">Espace</span></button>${hint ? '' : '<button class="btn soft" data-hint>Voir un indice</button>'}</div>`}
      </section>
      <p class="tip" style="margin-top:10px">Raccourcis : Espace pour afficher, 1, 2 ou 3 pour t'évaluer.</p>`;
    typeset(el);
    if (act === 'rate') stepMotion(el, { n: u.steps.length, i });
    if (act === 'show') revealMotion($('.cur', el));
    const sb = $('[data-show]', el); if (sb) sb.onclick = () => { shown = true; lastAction = 'show'; render(); };
    const hb = $('[data-hint]', el); if (hb) hb.onclick = () => { hint = true; render(); };
    const ab = $('#ai-exp', el); if (ab) ab.onclick = () => AI.explain(u, s, $('#ai-exp-out', el), ab);
    $$('[data-r]', el).forEach((b) => (b.onclick = () => rate(+b.dataset.r)));
  }
  function rate(r) { rates.push(r); Mascot.feedback(r >= 0.5); i++; shown = false; hint = false; lastAction = 'rate'; render(); }
  const onKey = (e) => {
    if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || i >= u.steps.length) return;
    if (!shown && (e.code === 'Space' || e.key === 'Enter') && !e.target.closest('button,a')) { e.preventDefault(); shown = true; lastAction = 'show'; render(); }
    else if (shown && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); rate([1, 0.5, 0][+e.key - 1]); }
  };

  Router.panelCleanups.push(() => document.removeEventListener('keydown', onKey));

}

/* A8 : marque d'une réponse jugée (coche verte si juste, filet bordeaux si fausse, rien si « à moitié »). */
const markHTML = (r) => (r === 1 ? '<svg class="m-check" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6.5l3 3 6-7"/></svg>' : r === 0 ? '<span class="m-miss" aria-hidden="true"></span>' : '');
/* A6 : passage d'une étape à l'autre, joué après le rendu du nouvel état (réutilisable par Récitation, À trous, Dans l'ordre).

function stepMotion(el, { n, i }) {

    const ms = last && $('.m-miss', last); if (ms) Motion.drawStroke(ms, { delay: d(100), dur: 180 });

/* A5 : le terme clé d'une étape (la bonne réponse de son trou ⟦…⟧) est marqué .m-u pour être souligné. */

/* Étape révélée (Pas à pas) : le texte monte et se dévoile, puis ses formules clés s'écrivent et le terme clé se souligne. */

/* Un élément dévoilé à la demande (mot, formule, étape) : masque de gauche à droite, après ses formules. */

/* ---------- Récitation progressive ---------- */
const RECIT_LV = [
  { n: 1, label: 'Niveau 1', desc: 'Un mot sur trois est masqué.' },
  { n: 2, label: 'Niveau 2', desc: 'Deux mots sur trois sont masqués.' },
  { n: 3, label: 'Niveau 3', desc: 'Il ne reste que les initiales, formules masquées.' },
  { n: 4, label: 'Niveau 4', desc: 'Seulement les titres : tu récites tout.' }
];
function recitHTML(text, lv) {
  const parts = plain(text).split(/(\\\(.*?\\\)|\\\[[\s\S]*?\\\])/g);
  let w = 0;
  return parts.map((part) => {
    if (/^\\[([]/.test(part)) return lv >= 3 ? `<button class="hm" data-m="${encodeURIComponent(part)}">${icon('eye')}formule</button>` : part;
    return part.replace(/[A-Za-zÀ-ÖØ-öø-ÿ'’-]{3,}/g, (word) => {
      w++;
      const hide = lv >= 3 || (lv === 2 ? w % 3 !== 0 : w % 3 === 1);
      return hide ? `<button class="hw" data-w="${esc(word)}">${esc(word[0])}${'·'.repeat(Math.min(word.length - 1, 9))}</button>` : word;
    });
  }).join('');
}

/* ---------- Dans l'ordre ---------- */
const GRIP = '<svg viewBox="0 0 14 20" fill="currentColor"><circle cx="4" cy="4" r="1.8"/><circle cx="10" cy="4" r="1.8"/><circle cx="4" cy="10" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="4" cy="16" r="1.8"/><circle cx="10" cy="16" r="1.8"/></svg>';
function panelOrdre(u, el) {
  let order = shuffle(u.steps.map((_, k) => k));
  while (u.steps.length > 2 && order.every((v, k) => v === k)) order = shuffle(order);
  let first = null, solved = false;
  el.innerHTML = `
    <section class="box glass">
      <div class="row-b" style="margin-bottom:12px"><h3 style="margin:0">${icon('list')}Remets les ${u.steps.length} étapes dans l'ordre</h3><span class="tip">Glisse avec la poignée, ou utilise les flèches</span></div>
      <ol class="ord" id="ord">${order.map((k) => `<li class="oi" data-k="${k}"><button class="grip" aria-label="Déplacer">${GRIP}</button><div>${plain(u.steps[k].x)}</div><div class="mv"><button data-up aria-label="Monter">▲</button><button data-down aria-label="Descendre">▼</button></div></li>`).join('')}</ol>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="ord-check">Vérifier l'ordre</button><button class="btn soft" id="ord-sol" hidden>Voir la solution</button><span class="tip" id="ord-msg"></span></div>
    </section>`;
  typeset(el);
  const list = $('#ord', el), items = () => $$('.oi', list);
  const clearMarks = () => { if (solved) return; items().forEach((it) => { it.classList.remove('ok', 'ko'); const p = $('.pos', it); if (p) p.remove(); }); };
  function flip(fn) {
    const before = new Map(items().map((it) => [it, it.getBoundingClientRect().top]));
    fn();
    items().forEach((it) => { const dy = before.get(it) - it.getBoundingClientRect().top; if (dy && !it.classList.contains('dragging')) { it.style.transition = 'none'; it.style.transform = `translateY(${dy}px)`; requestAnimationFrame(() => { it.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)'; it.style.transform = ''; }); } });
  }
  list.addEventListener('click', (e) => {
    const it = e.target.closest('.oi'); if (!it || solved) return;
    if (e.target.closest('[data-up]') && it.previousElementSibling) { flip(() => list.insertBefore(it, it.previousElementSibling)); clearMarks(); }
    if (e.target.closest('[data-down]') && it.nextElementSibling) { flip(() => list.insertBefore(it.nextElementSibling, it)); clearMarks(); }
  });
  let drag = null;
  list.addEventListener('pointerdown', (e) => {
    const g = e.target.closest('.grip'); if (!g || solved) return;
    const it = g.closest('.oi'); e.preventDefault(); g.setPointerCapture(e.pointerId);
    drag = { it, y0: e.clientY }; it.classList.add('dragging'); clearMarks();
  });
  list.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const { it } = drag; it.style.transform = `translateY(${e.clientY - drag.y0}px)`;
    const r = it.getBoundingClientRect(), mid = r.top + r.height / 2, nx = it.nextElementSibling, pv = it.previousElementSibling;
    if (nx) { const rn = nx.getBoundingClientRect(); if (mid > rn.top + rn.height / 2) { const t0 = it.offsetTop; flip(() => list.insertBefore(nx, it)); drag.y0 += it.offsetTop - t0; it.style.transform = `translateY(${e.clientY - drag.y0}px)`; } }
    if (pv) { const rp = pv.getBoundingClientRect(); if (mid < rp.top + rp.height / 2) { const t0 = it.offsetTop; flip(() => list.insertBefore(it, pv)); drag.y0 += it.offsetTop - t0; it.style.transform = `translateY(${e.clientY - drag.y0}px)`; } }
  });
  const end = () => { if (!drag) return; const { it } = drag; it.classList.remove('dragging'); it.style.transition = 'transform .25s'; it.style.transform = ''; drag = null; };
  list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
  $('#ord-check', el).onclick = () => {
    const its = items(); let good = 0;
    its.forEach((it, pos) => {
      const ok = +it.dataset.k === pos; if (ok) good++;
      it.classList.toggle('ok', ok); it.classList.toggle('ko', !ok);
      let p = $('.pos', it); if (!p) { p = document.createElement('span'); p.className = 'pos'; it.appendChild(p); }
      p.textContent = ok ? '✓' : '✕';
      Motion.reveal(p, { clip: 'left', dur: 180, delay: pos * 30, ease: Motion.EASE_OUT }); // A8 : les marques s'inscrivent l'une après l'autre
    });
    if (first === null) first = good / its.length;
    if (good === its.length) { Mascot.feedback(true); finish(); }
    else { Mascot.feedback(false, `${good} sur ${its.length} à la bonne place. Corrige les étapes en rose !`); $('#ord-msg', el).textContent = `${good} sur ${its.length} à la bonne place.`; $('#ord-sol', el).hidden = false; }
  };
  $('#ord-sol', el).onclick = () => {
    flip(() => items().sort((a, b) => a.dataset.k - b.dataset.k).forEach((it) => list.appendChild(it)));
    items().forEach((it) => { it.classList.remove('ko'); it.classList.add('ok'); const p = $('.pos', it); if (p) p.textContent = '✓'; });
    finish();
  };
  function finish() {
    if (solved) return; solved = true;
    $('#ord-check', el).disabled = true; $('#ord-sol', el).hidden = true; $('#ord-msg', el).textContent = '';
    $$('.mv button', el).forEach((b) => (b.disabled = true));
    summary(el, u, 'ordre', first, { note: '<p class="tip">Score calculé sur ta première vérification.</p>' }).querySelector('[data-again]').onclick = () => Views.switchTab('ordre', true);
    refreshMast();
  }
}

      refreshMast();

          <div class="flip-in">

          <button class="rate r1" data-r="1"><span class="kb">1</span> Je savais</button>
          <button class="rate r2" data-r="0.5"><span class="kb">2</span> À peu près</button>
          <button class="rate r0" data-r="0"><span class="kb">3</span> Raté</button>
        </div>
      </div>`;
    typeset(el);
    $('#flip', el).onclick = flip;
    $$('[data-r]', el).forEach((b) => (b.onclick = () => rate(+b.dataset.r)));
  }
  /* Retournement à plat (pas de 3D) : la face visible se dévoile de haut en bas (motion.css neutralise rotateY). */
  function flip() {
    flipped = !flipped; $('#flip', el).classList.toggle('on', flipped); $('.rates', el).style.visibility = flipped ? 'visible' : 'hidden'; if (flipped) Mascot.setMood('think');
    Motion.reveal($(flipped ? '.face.back' : '.face:not(.back)', el), { clip: 'down', from: 0.3, dur: 280, ease: Motion.EASE_IO });

const CX_MARKS = 'Mise en forme : paragraphes courts séparés par une ligne vide. Pour une démarche, commence chaque étape par « Étape 1. », « Étape 2. »… en début de paragraphe. Commence un indice par « Indice : », un exemple par « Exemple : », une mise en garde par « Attention : » (chacun en début de paragraphe). Pour juger une réponse, emploie les mots « juste » ou « faux ». Formules en LaTeX entre \\( et \\), ou entre \\[ et \\] pour une formule importante seule sur sa ligne. Pas de titres Markdown, pas de tableaux.';

      const prompt = `Tu es colleur de mathématiques (2e année, maths pour l'ingénieur), exigeant mais bienveillant. Un étudiant devait rédiger de mémoire le résultat ci-dessous. Corrige sa copie en la comparant à la référence.\n\n=== RÉFÉRENCE ===\n${unitRef(u)}\n\n=== COPIE DE L'ÉTUDIANT ===\n${text ? `Texte tapé :\n"""\n${text.slice(0, 12000)}\n"""\n` : ''}${files.length ? `La copie (ou une partie) est sur ${files.length > 1 ? 'les photos jointes' : 'la photo jointe'} : écriture manuscrite à déchiffrer avec soin.\n` : ''}\n=== CONSIGNES ===\n- Note sur 20, au demi-point. Chaque étape compte. Hypothèse oubliée, justification manquante (théorème non cité, passage à la limite non justifié), erreur de signe ou d'inégalité : on retire des points.\n- Une entrée par étape de la référence, dans l'ordre, avec un statut : "ok" (juste et justifiée), "partiel" (idée là mais oubli ou imprécision), "faux" (erreur), "manquant" (absente).\n- Cite brièvement ce que l'étudiant a écrit quand tu relèves une erreur. Formules en LaTeX entre \\( et \\).\n- Si la copie est illisible ou hors sujet, dis-le dans "resume" et mets une note basse.\n\nRéponds UNIQUEMENT avec un objet JSON de cette forme :\n{"note": 13.5, "resume": "2 phrases", "etapes": [{"n": 1, "statut": "ok", "commentaire": "1 phrase"}], "erreurs": ["erreur précise et sa correction"], "questions": ["question qu'un colleur poserait ensuite"], "conseil": "1 conseil concret"}`;
      try {
        const v = await this.sample.json(prompt, { modelTier: 'complex', signal: c.signal, images: files.length ? files.slice() : undefined });
        w.end(); renderVerdict(v);
      } catch (e) {
        w.end(); const m = this.errorText(e);
        out.innerHTML = '';
        if (m) { const d = cxMsg('assistant', 'Colleur'); out.append(d); cxErr(d, m, () => go.click()); }
      } finally { go.disabled = false; stop.hidden = true; this.ctls.delete(c); }
    };
    function renderVerdict(v) {
      v = v && typeof v === 'object' ? v : {};
      const note = clamp(Number(v.note) || 0, 0, 20);
      const etapes = Array.isArray(v.etapes) ? v.etapes : [];
      const one = (x) => cxTone(md(String(x)).replace(/^<p>|<\/p>$/g, ''));
      const list = (a) => (Array.isArray(a) ? a : []).map((x) => `<li>${one(x)}</li>`).join('');
      const label = { ok: 'juste', partiel: 'partiel', faux: 'faux', manquant: 'manquant' };
      setHTML(out, `<div class="verdict cx-verdict">
        <div class="cx-vhead"><div class="note20">${note20(note)}<span class="muted" style="font-size:.45em"> / 20</span></div><div class="cx-vres">${one(v.resume || '')}</div></div>
        <div>${u.steps.map((s, k) => {
          const e = etapes.find((x) => Number(x && x.n) === k + 1) || etapes[k] || {};
          const st = ['ok', 'partiel', 'faux', 'manquant'].includes(e.statut) ? e.statut : 'manquant';
          return `<div class="status"><span class="pill ${st}">${label[st]}</span><div><b>${k + 1}. ${esc(s.t)}</b>${e.commentaire ? `<div class="small muted">${one(e.commentaire)}</div>` : ''}</div></div>`;
        }).join('')}</div>
        ${(v.erreurs || []).length ? `<div class="cx-box cx-warn"><span class="cx-lab">Erreurs relevées</span><ul class="small" style="padding-left:18px;margin:0">${list(v.erreurs)}</ul></div>` : ''}
        ${(v.questions || []).length ? `<div class="cx-box"><span class="cx-lab">Questions du colleur</span><ul class="small" style="padding-left:18px;margin:0">${list(v.questions)}</ul></div>` : ''}
        ${v.conseil ? `<div class="cx-box"><span class="cx-lab">Conseil</span><p>${one(v.conseil)}</p></div>` : ''}
      </div>`).then(() => { if (typeof Motion !== 'undefined' && Motion.formulas) Motion.formulas(out); });
      record(u.id, 'correction', note / 20);
      Mascot.result(note * 5); if (note >= 16) celebrate({ mention: 'Copie corrigée', big: `${note20(note)}/20`, sub: u.label });
      refreshMast();
    }
  },

  /* Oral avec un colleur virtuel : Claude pose une question, l'étudiant répond, Claude évalue et enchaîne. */
  oral(el, u) {
    const turns = []; let c = null, stamped = false;
    const rules = `Tu es un colleur de mathématiques bienveillant mais exigeant (2e année, maths pour l'ingénieur). Tu fais passer un oral sur le résultat ci-dessous. Règles : pose UNE question à la fois, courte, comme à l'oral (pourquoi telle hypothèse, que se passe-t-il si…, refais tel calcul, donne un contre-exemple). Après chaque réponse de l'étudiant : dis en 1 à 3 phrases si c'est juste, corrige si besoin, puis pose la question suivante. Après 4 questions, conclus par une note indicative sur 20 (écrite sous la forme « 15/20 ») et un conseil, sans poser de nouvelle question. Réponds en français, formules en LaTeX entre \\( et \\).\n\n${CX_MARKS}\n\n${unitRef(u)}`;
    el.innerHTML = `<div class="cx-thread cx-inline" id="or-chat" style="margin-top:12px"></div>
      <div class="cx-composer" style="margin-top:10px"><label class="sr" for="or-in">Ta réponse au colleur</label><textarea id="or-in" rows="2" placeholder="Ta réponse…"></textarea>
      <div class="cx-cbtn"><button class="btn primary small" id="or-go">${icon('send')}Répondre</button><button class="btn ghost small" id="or-stop" hidden>${icon('stop')}Stop</button></div></div>
      <p class="small muted" id="or-msg" role="status"></p><div class="sr" aria-live="polite" id="or-live"></div>`;
    const chat = $('#or-chat', el), inp = $('#or-in', el), go = $('#or-go', el), stop = $('#or-stop', el), msg = $('#or-msg', el), live = $('#or-live', el);
    const keep = () => { chat.scrollTop = chat.scrollHeight; };
    const send = async (userText) => {
      if (!AI.sample || c) return;
      if (userText) { turns.push({ role: 'user', content: userText }); cxUser(chat, userText, 'Moi'); }
      const out = cxMsg('assistant', 'Colleur'); chat.append(out); keep();
      c = AI.ctl(); go.disabled = true; stop.hidden = false; msg.textContent = '';
      /* Tour 1 : [consignes]. Ensuite : [consignes, colleur, étudiant, colleur, étudiant…] (finit toujours par l'étudiant). */
      const input = [{ role: 'user', content: rules + '\n\nCommence : salue brièvement l\'étudiant et pose ta première question.' }, ...turns];
      try {
        const text = await AI.stream(out, input, { cache: false, signal: c.signal }, ['Le colleur lit ta réponse…', 'Le colleur réfléchit…', 'Le colleur rédige…'], keep);
        turns.push({ role: 'assistant', content: text }); cxAnnounce(live, text);
        const n = cxNote(text);
        if (n && n.v >= 14 && !stamped && typeof Motion !== 'undefined' && Motion.stamp) {
          stamped = true;
          const host = document.createElement('div'); host.className = 'cx-stamp'; $('.cx-col', out).append(host);
          try { Motion.stamp({ mention: 'Bon oral', big: `${n.s}/20`, sub: `${u.label} · ${strip(u.title)}`, mini: true, host }); } catch (x) { /* estampille facultative */ }
        }
      } catch (e) {
        if (e && e.text) turns.push({ role: 'assistant', content: e.text });
        const m = AI.errorText(e);
        if (m) cxErr(out, m, e && e.text ? null : () => { out.remove(); send(null); });
        else if (!(e && e.text)) out.remove();
      } finally { go.disabled = false; stop.hidden = true; AI.ctls.delete(c); c = null; keep(); }
    };
    go.onclick = () => { const t = inp.value.trim(); if (!t) return; inp.value = ''; send(t); };
    inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go.click(); } };
    stop.onclick = () => c && c.abort();
    send(null);
  },

  /* Questions libres (FAQ) : renvoie vers le panneau compagnon, disponible sur toutes les pages. */
  askPanel(el, u) {
    if (!el) return;
    el.innerHTML = `
      <div><span class="ai-badge">${icon('spark')}Claude · questions</span><h3 style="margin:4px 0 0">${u ? 'Une question sur ce résultat ?' : 'Pose ta question en direct'}</h3></div>
      <div class="ai-only" style="margin-top:10px"><p class="muted small" style="margin:0 0 10px">Le panneau « Questions », en bas à droite de chaque page, garde ta conversation pendant toute la session.</p>
        <button class="btn primary small" type="button" id="qa-open">${icon('chat')}Ouvrir les questions</button></div>
      <p class="no-ai muted small" style="margin-top:10px">Ouvre le site sur claude.ai, connecté à ton compte, pour poser tes questions ici.</p>`;
    const b = $('#qa-open', el); if (b) b.onclick = () => Companion.open(b);
  }
};

/* ---------- Le compagnon : panneau « Questions » sur toutes les pages ----------
   Grand écran (≥ 1000 px) : page de marge à droite qui pousse le contenu. Entre 641 et 999 px : même panneau, modal, sur un voile.
   Mobile (≤ 640 px) : feuille du bas à 92 % de la hauteur. Historique par contexte dans sessionStorage (jamais dans `state`). */
const Companion = {
  KEY: 'cmp-hist', built: false, isOpen: false, mode: '', key: '', busy: null, ctl: null, opener: null,
  hist: (() => { try { return JSON.parse(sessionStorage.getItem('cmp-hist') || '{}') || {}; } catch (e) { return {}; } })(),
  save() { try { sessionStorage.setItem(this.KEY, JSON.stringify(this.hist)); } catch (e) { /* stockage indisponible */ } },
  turns(k = this.key) { if (!Array.isArray(this.hist[k])) this.hist[k] = []; return this.hist[k]; },
  /* Contexte de la page : unité ouverte, sinon la colle. */
  ctx() {
    const cur = (typeof Router !== 'undefined' && Router.current) || '';
    const u = cur.startsWith('unit:') ? byId[cur.slice(5)] : null;
    if (u) return { key: u.id, u, title: `Une question sur ${u.label} ?`, sub: strip(u.title) };
    const lab = /^colle/i.test(COLLE.label) ? `la ${COLLE.label.toLowerCase()}` : `le ${COLLE.sem}`;
    return { key: 'colle:' + COLLE.id, u: null, title: `Une question sur ${lab} ?`, sub: COLLE.title };
  },
  init() {
    if (this.built) return;
    const tab = $('#cmp-tab'), root = $('#cmp');
    if (!tab || !root) return;
    this.built = true; this.tab = tab; this.root = root;
    root.innerHTML = `
      <span class="cmp-rule" aria-hidden="true"></span>
      <div class="cmp-sheet" role="dialog" aria-labelledby="cmp-title" tabindex="-1">
        <button class="cmp-grip" type="button" aria-label="Fermer le panneau"><i></i></button>
        <header class="cmp-head">
          <div class="cmp-tools"><span class="eyebrow">Claude · questions</span><span class="cmp-sp"></span>
            <button type="button" class="cx-link" id="cmp-new">Nouvelle conversation</button>
            <button type="button" class="cmp-x" id="cmp-close" aria-label="Fermer">×</button></div>
          <h2 id="cmp-title" class="cmp-title"></h2><p class="cmp-sub"></p>
          <span class="cmp-hr" aria-hidden="true"></span>
        </header>
        <div class="cmp-body"><div class="cmp-welcome"></div><div class="cx-thread"></div></div>
        <form class="cmp-foot cx-composer" novalidate>
          <label class="sr" for="cmp-in">Ta question</label>
          <textarea id="cmp-in" rows="2" placeholder="Pose ta question…"></textarea>
          <div class="cx-cbtn"><button class="btn primary small" type="submit" id="cmp-go">${icon('send')}Envoyer</button><button class="btn ghost small" type="button" id="cmp-stop" hidden>${icon('stop')}Stop</button></div>
        </form>
        <div class="sr" aria-live="polite" id="cmp-live"></div>
      </div>`;
    this.veil = $('#cmp-veil');
    this.sheet = $('.cmp-sheet', root); this.body = $('.cmp-body', root); this.thread = $('.cx-thread', root); this.welcome = $('.cmp-welcome', root);
    this.inp = $('#cmp-in', root); this.go = $('#cmp-go', root); this.stop = $('#cmp-stop', root); this.live = $('#cmp-live', root);
    tab.onclick = () => (this.isOpen ? this.close() : this.open(tab));
    $('#cmp-close', root).onclick = () => this.close();
    $('#cmp-new', root).onclick = () => { if (this.busy === this.key && this.ctl) this.ctl.abort(); this.hist[this.key] = []; this.save(); this.render(); this.inp.focus(); };
    if (this.veil) this.veil.onclick = () => this.close();
    $('form', root).onsubmit = (e) => { e.preventDefault(); const t = this.inp.value.trim(); if (!t) return; this.inp.value = ''; this.send(t); };
    this.inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form', root).requestSubmit(); } };
    this.stop.onclick = () => this.ctl && this.ctl.abort();
    this.sheet.addEventListener('keydown', (e) => this.onKey(e));
    this.grip();
    window.addEventListener('hashchange', () => setTimeout(() => this.sync(), 0));
    window.addEventListener('resize', () => { if (this.isOpen) this.layout(false); });
    if (window.visualViewport) { const f = () => this.fit(); visualViewport.addEventListener('resize', f); visualViewport.addEventListener('scroll', f); }
    this.sync(true);
  },
  /* Met à jour le contexte (titre, suggestions, fil) quand la page change. */
  sync(force) {
    const c = this.ctx();
    if (!force && c.key === this.key && this.cur && this.cur.u === c.u) return;
    this.cur = c; this.key = c.key; this.render();
  },
  render() {
    const c = this.cur, root = this.root;
    $('#cmp-title', root).textContent = c.title;
    $('.cmp-sub', root).textContent = c.sub || '';
    const t = this.turns();
    this.welcome.hidden = t.length > 0;
    mathClear(this.welcome);
    this.welcome.innerHTML = t.length ? '' : this.welcomeHTML(c);
    if (!t.length) typeset(this.welcome);
    $$('[data-ask]', this.welcome).forEach((a) => { a.onclick = (e) => { e.preventDefault(); this.send(a.dataset.ask); }; });
    $$('a[href^="#"]:not([data-ask])', this.welcome).forEach((a) => { a.addEventListener('click', () => { if (this.mode !== 'push') this.close(true); }); });
    mathClear(this.thread); this.thread.innerHTML = '';
    t.forEach((x) => {
      if (x.role === 'user') cxUser(this.thread, x.content, 'Moi');
      else { const m = cxMsg('assistant', 'Claude'); $('.cx-text', m).innerHTML = cxRich(x.content); this.thread.append(m); this.foot(m, x.content); typeset(m); }
    });
    this.toBottom();
  },
  welcomeHTML(c) {
    const u = c.u, sug = [];
    if (u) {
      if (u.colleur && u.colleur[0]) sug.push(strip(u.colleur[0].q));
      const k = u.steps.length > 1 ? 1 : 0, s = u.steps[k];
      if (s) sug.push(`Donne-moi un indice pour l'étape ${k + 1} : ${strip(s.t)}`);
      sug.push('Pose-moi une question de colleur');
    } else {
      const a = UNITS[0], b = UNITS[1];
      if (a) sug.push(`Résume-moi ${a.label} en trois idées`);
      if (a && b) sug.push(`Quelle différence entre ${a.label} et ${b.label} ?`);
      sug.push('Pose-moi une question de colleur sur la colle');
    }
    const short = u ? `<p class="eyebrow cmp-eb">Raccourcis</p><ul class="cmp-short">
        <li><a href="#" data-ask="Explique-moi autrement l'idée générale de cette démonstration, simplement, en étapes.">Expliquer autrement</a></li>
        <li><a href="#${u.id}-correction">Corriger ma copie</a></li>
        <li><a href="#${u.id}-colleur">Oral avec le colleur</a></li></ul>` : '';
    return `<p class="eyebrow cmp-eb">Suggestions</p><ul class="cmp-sug">${sug.map((s) => `<li><a href="#" data-ask="${esc(s)}">${esc(s)}</a></li>`).join('')}</ul>${short}`;
  },
  foot(m, text) {
    const f = document.createElement('div'); f.className = 'cx-foot';
    f.innerHTML = '<button type="button" class="cx-link">Copier la réponse</button>';
    $('button', f).onclick = () => cxCopy(text);
    $('.cx-col', m).append(f);
  },
  toBottom() { const b = this.body; if (b) b.scrollTop = b.scrollHeight; },
  rules(c) {
    const ctx = c.u ? `L'étudiant travaille ceci :\n${unitRef(c.u)}` : `Programme de la ${COLLE.label} (${COLLE.title}) : ${UNITS.map((x) => `${x.label} ${strip(x.title)}`).join(' ; ')}. ${MACROS_NOTE}`;
    return `Tu es un professeur de mathématiques bienveillant qui accompagne un étudiant de 2e année (maths pour l'ingénieur) dans ses révisions de colle orale. Réponds en français, clairement et précisément, en 3 à 10 phrases sauf si un calcul détaillé est demandé. Justifie les étapes (hypothèses, théorèmes utilisés). Si l'étudiant demande un indice, donne un indice sans la solution complète. Si tu poses une question de colleur, pose-en une seule et attends sa réponse. Si la question sort du sujet, réponds brièvement puis ramène vers les maths.\n\n${CX_MARKS}\n\n${ctx}`;
  },
  async send(q) {
    if (!AI.sample) return;
    if (this.busy) { toast('Claude répond déjà : attends la fin ou arrête la réponse.'); return; }
    const key = this.key, c = this.cur, t = this.turns(key);
    if (q) {
      /* Une question restée sans réponse (erreur, arrêt) est fusionnée avec la nouvelle. */
      if (t.length && t[t.length - 1].role === 'user') t[t.length - 1].content += '\n\n' + q; else t.push({ role: 'user', content: q });
      this.save();
      if (!this.welcome.hidden) { this.welcome.hidden = true; this.welcome.innerHTML = ''; }
      $$('.cx-err', this.thread).forEach((d) => d.closest('.cx-msg.cx-ai') && !strip($('.cx-text', d.closest('.cx-msg')).innerHTML).trim() ? d.closest('.cx-msg').remove() : d.remove());
      cxUser(this.thread, q, 'Moi');
    }
    if (!t.length || t[t.length - 1].role !== 'user') return;
    const msg = cxMsg('assistant', 'Claude'); this.thread.append(msg); this.toBottom();
    /* Taille limitée : on retire les plus vieux tours au-delà de ~60 000 caractères. */
    const sent = t.slice();
    while (JSON.stringify(sent).length > 60000 && sent.length > 2) sent.splice(0, 2);
    while (sent.length && sent[0].role !== 'user') sent.shift();
    const input = sent.map((x, k) => (k === 0 ? { role: 'user', content: this.rules(c) + '\n\n=== QUESTION ===\n' + x.content } : x));
    this.busy = key; this.ctl = AI.ctl(); this.go.disabled = true; this.stop.hidden = false;
    const labels = [c.u ? `Claude lit ${c.u.kind === 'demo' ? 'la démo' : 'l\'exemple'}…` : 'Claude lit ta question…', 'Claude réfléchit…', 'Claude rédige…'];
    const near = () => { const b = this.body; if (b && b.scrollHeight - b.scrollTop - b.clientHeight < 120) this.toBottom(); };
    try {
      const text = await AI.stream(msg, input, { cache: false, signal: this.ctl.signal }, labels, near);
      t.push({ role: 'assistant', content: text }); this.save();
      if (this.key === key && msg.isConnected) { this.foot(msg, text); cxAnnounce(this.live, text); near(); } else if (this.key === key) this.render();
    } catch (e) {
      const m = AI.errorText(e);
      if (e && e.code === 'cancelled' && e.text) { t.push({ role: 'assistant', content: e.text }); this.save(); if (msg.isConnected) this.foot(msg, e.text); }
      else if (m && msg.isConnected) cxErr(msg, m, () => { msg.remove(); this.send(null); });
      else if (!e || !e.text) msg.remove();
    } finally {
      AI.ctls.delete(this.ctl); this.ctl = null; this.busy = null; this.go.disabled = false; this.stop.hidden = true;
    }
  },

  /* ----- Ouverture, fermeture, mise en page ----- */
  modeFor() { const w = window.innerWidth; return w <= 640 ? 'sheet' : w >= 1000 ? 'push' : 'side'; },
  layout(animate) {
    const mode = this.modeFor(), html = document.documentElement, wrap = $('.wrap');
    const modal = mode !== 'push';
    const x0 = animate && wrap ? wrap.getBoundingClientRect().left : 0;
    html.classList.toggle('cmp-push', mode === 'push');
    html.dataset.cmp = mode;
    this.mode = mode;
    if (modal) this.sheet.setAttribute('aria-modal', 'true'); else this.sheet.removeAttribute('aria-modal');
    if (this.veil) this.veil.hidden = !modal;
    if (wrap) wrap.inert = modal;
    if (animate && wrap && !reduced && mode === 'push') {
      const dx = x0 - wrap.getBoundingClientRect().left;
      if (Math.abs(dx) > 1) wrap.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 280, easing: CX_OUT });
    }
    this.fit();
  },
  /* Mobile : la feuille suit le clavier (visualViewport). */
  fit() {
    const vv = window.visualViewport; if (!vv || !this.root) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    this.root.style.setProperty('--cmp-kb', kb + 'px');
    this.root.style.setProperty('--cmp-vh', vv.height + 'px');
  },
  open(from) {
    if (!this.built || !AI.sample) return;
    if (this.isOpen) { this.inp.focus(); return; }
    this.sync();
    this.opener = from || this.tab;
    /* Une fermeture encore en cours est annulée. */
    this.root.getAnimations({ subtree: true }).forEach((x) => x.cancel()); if (this.veil) this.veil.getAnimations().forEach((x) => x.cancel());
    this.isOpen = true; this.root.hidden = false;
    this.tab.setAttribute('aria-expanded', 'true');
    this.layout(true);
    const sheet = this.mode === 'sheet', anims = [];
    if (reduced) anims.push(this.root.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 80 }));
    else {
      const rule = $('.cmp-rule', this.root);
      if (!sheet) anims.push(rule.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 200, easing: CX_IO, fill: 'backwards' }));
      anims.push(this.sheet.animate([{ transform: sheet ? 'translateY(100%)' : 'translateX(100%)' }, { transform: 'none' }], { duration: 280, delay: sheet ? 0 : 120, easing: CX_OUT, fill: 'backwards' }));
      if (this.veil && !this.veil.hidden) anims.push(this.veil.animate([{ opacity: 0 }, { opacity: .6 }], { duration: 280, easing: CX_OUT }));
      const d0 = sheet ? 160 : 280;
      anims.push($('.cmp-hr', this.root).animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 280, delay: d0, easing: CX_IO, fill: 'backwards' }));
      anims.push($('.cmp-title', this.root).animate([{ clipPath: 'inset(100% 0 0 0)', transform: 'translateY(.12em)' }, { clipPath: 'inset(0 0 0 0)', transform: 'none' }], { duration: 280, delay: d0 + 20, easing: CX_OUT, fill: 'backwards' }));
      $$('.cmp-sug li, .cmp-short li', this.root).forEach((li, k) => anims.push(li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: d0 + 80 + 40 * k, easing: CX_OUT, fill: 'backwards' })));

/* ---------- Colle blanche ---------- */

          <div><h3>Durée</h3><div class="pick" id="pk-t">${[5, 8, 10, 15].map((m) => `<button class="pk" data-v="${m}" aria-pressed="${dur === m}">${m} min</button>`).join('')}</div></div>

    const tick = () => {

    };

    $('#hint').onclick = () => {

      <div class="colle-wrap" style="${colorVars(u)}">
        <div class="colle-head"><p class="eyebrow"><span class="dot"></span>${u.label} · ${Math.floor(secs / 60)} min ${String(secs % 60).padStart(2, '0')} s</p><h1 style="font-size:clamp(1.6rem,4vw,2.4rem)">Corrige-toi, étape par étape</h1>
        <p class="muted">Pour chaque étape : l'avais-tu écrite ou dite correctement, avec sa justification ?</p></div>
        ${checkHTML(u)}
        <div class="row" style="justify-content:center;margin-top:20px"><button class="btn primary" id="val" disabled>Valider ma colle</button></div>
        <div id="res"></div>

    typeset(app);

    $('#val').onclick = () => {
      $('#val').disabled = true; $$('.seg button').forEach((b) => (b.disabled = true));

      const prevBest = us(u.id).best, best = !prevBest || note > prevBest.note ? { note, secs } : prevBest;
      state.colles.push({ t: Date.now(), id: u.id, note, secs, hint: usedHint });
      const box = summary($('#res'), u, 'colle', r, { extra: { best }, note: `<p><span class="note20">${note20(note)}/20</span> <span class="tip">note indicative${usedHint ? ', squelette consulté (−20 %)' : ''}${over ? ', temps dépassé' : ''}</span></p>${colleQueue.length ? `<button class="btn primary small" id="next-q">Sujet suivant : ${byId[colleQueue[0]].label} →</button>` : ''}` });
      box.querySelector('[data-again]').onclick = () => { chosen = 'auto'; setup(); window.scrollTo(0, 0); };
      const nq = $('#next-q'); if (nq) nq.onclick = () => start(byId[colleQueue.shift()]);

function checkHTML(u) {
  return `<div class="check">${u.steps.map((s, k) => `

function bindCheck(root, u, marks, onChange) {

/* ---------- Roue : colle aléatoire ---------- */
Views.roulette = function (app) {
  let mode = Prefs.get('roue:mode', 'both');
  if (!EXEMPLES.length && mode !== 'demo') mode = 'demo';
  let spinning = false, rot = 0, raf = 0;
  Router.cleanups.push(() => cancelAnimationFrame(raf));
  const listFor = (m) => (m === 'demo' || !EXEMPLES.length ? DEMOS : m === 'ex' ? EXEMPLES : UNITS);
  app.innerHTML = `
    <div class="colle-wrap">
      <div class="colle-head"><p class="eyebrow">Colle aléatoire</p><h1>Fais tourner la roue</h1>
        <p class="muted" style="max-width:56ch">Le jour J, tu ne choisis pas ton sujet. La roue tire en priorité ce que tu maîtrises le moins.</p></div>
      <section class="setup glass">
        <div class="pick" id="rm" style="justify-content:center">${(EXEMPLES.length ? [['both', 'Une démo + un exemple'], ['demo', 'Une démo'], ['ex', 'Un exemple'], ['all', 'N\'importe quoi']] : [['demo', 'Une démo']]).map(([v, l]) => `<button class="pk" data-v="${v}" aria-pressed="${mode === v}">${l}</button>`).join('')}</div>
        <div class="wheel-wrap"><div class="wheel-pin"></div><canvas id="wheel" aria-label="Roue des sujets"></canvas><div class="wheel-hub">${mascotImg('think')}</div></div>
        <div class="row" style="justify-content:center"><button class="btn primary" id="spin">${icon('dice')}Tourner la roue</button></div>
        <div id="wres"></div>
      </section>
    </div>`;
  const cv = $('#wheel'), ctx = cv.getContext('2d');
  let list = listFor(mode === 'both' ? 'demo' : mode);
  function size() { const dpr = Math.min(devicePixelRatio || 1, 2), s = cv.clientWidth; cv.width = s * dpr; cv.height = s * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawWheel(); }
  function drawWheel() {
    const s = cv.clientWidth, C = palette(), r = s / 2 - 4, n = list.length, seg = TAU / n;
    ctx.clearRect(0, 0, s, s); ctx.save(); ctx.translate(s / 2, s / 2); ctx.rotate(rot);
    list.forEach((u, i) => {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i * seg, (i + 1) * seg); ctx.closePath();
      ctx.fillStyle = C[u.color] || C.lilac; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = C.bg; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.rotate((i + 0.5) * seg); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.font = `800 ${Math.max(11, Math.min(18, s / (n * 1.6)))}px ${C.font}`; ctx.fillStyle = '#2a2440'; ctx.fillText(u.label, r - 12, 0); ctx.restore();
    });
    ctx.restore();
  }
  const ro = new ResizeObserver(size); ro.observe(cv); Router.cleanups.push(() => ro.disconnect());
  function spinTo(target, done) {
    const n = list.length, seg = TAU / n, i = list.indexOf(target);
    /* Le pointeur est en haut (angle −π/2) : on veut rot + (i + ½)·seg ≡ −π/2, avec quelques tours en plus. */
    const want = -Math.PI / 2 - (i + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6;
    const from = rot; let end = want; while (end < from) end += TAU; end += TAU * 5;
    if (reduced) { rot = end; drawWheel(); return done(); }
    const t0 = performance.now(), D = 3600;
    const step = (now) => { const p = Math.min(1, (now - t0) / D); rot = from + (end - from) * ease(p); drawWheel(); if (p < 1) raf = requestAnimationFrame(step); else done(); };
    raf = requestAnimationFrame(step);
  }
  function result(picks) {
    const box = $('#wres');
    box.innerHTML = `<div class="masc-inline" style="justify-content:center;margin-top:8px">${mascotImg('party', 'jump', 'width:70px;height:90px')}<div class="says">Ton sujet : ${picks.map((u) => `<b>${u.label}</b> (${u.title})`).join(' puis ')} !</div></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn primary" id="w-go">${icon('timer')}Lancer la colle blanche${picks.length > 1 ? ' (les deux à la suite)' : ''}</button>
        ${picks.map((u) => `<a class="btn soft small" href="#${u.id}">Réviser ${u.label} d'abord</a>`).join('')}
      </div>`;
    typeset(box);
    $('#w-go').onclick = () => { colleQueue = picks.map((u) => u.id); Router.go('colle'); };
    Mascot.react('party', `C'est tombé sur ${picks.map((u) => u.label).join(' et ')} !`, { hold: 3000 });
  }
  $('#rm').onclick = (e) => { const b = e.target.closest('.pk'); if (!b || spinning) return; mode = b.dataset.v; Prefs.set('roue:mode', mode); $$('#rm .pk').forEach((x) => x.setAttribute('aria-pressed', x === b)); list = listFor(mode === 'both' ? 'demo' : mode); drawWheel(); $('#wres').innerHTML = ''; };
  $('#spin').onclick = () => {
    if (spinning) return; spinning = true; $('#spin').disabled = true; $('#wres').innerHTML = '';
    Mascot.setMood('think');
    if (mode === 'both') {
      list = DEMOS; drawWheel();
      const a = weightedPick(DEMOS);
      spinTo(a, () => setTimeout(() => {
        list = EXEMPLES; rot = 0; drawWheel();
        const b = weightedPick(EXEMPLES);
        spinTo(b, () => { spinning = false; $('#spin').disabled = false; result([a, b]); list = DEMOS; });
      }, 900));
    } else {
      const a = weightedPick(list);
      spinTo(a, () => { spinning = false; $('#spin').disabled = false; result([a]); });
    }
  };
};

    }

function recordCards(res, mode = 'flash') {
  const per = {}; res.forEach((x) => (per[x.id] = per[x.id] || []).push(x.r));
  Object.entries(per).forEach(([id, rs]) => record(id, mode, rs.reduce((a, b) => a + b, 0) / rs.length));
}
function endBox(host, pct, title, text, actions) {
  host.innerHTML = `<section class="summary glass anim-in">${mascotImg(moodFor(pct), 'jump')}${ring(pct, 96, 9)}<div><h3>${title}</h3><p class="muted">${text}</p><div class="row" style="margin-top:6px">${actions}</div></div></section>`;
  typeset(host); Motion.ringIn(host, { all: true }); Mascot.result(pct); if (pct >= 80) celebrate({ mention: 'Révision', big: `${pct} %`, sub: colleTag() });
}

/* ---------- Révision express : 5 minutes ---------- */
Views.express = function (app) {
  const weak = [...UNITS].sort((a, b) => priority(b.id) - priority(a.id));
  const u1 = weak[0], u2 = weak[1] || weak[0];
  let cards = dueCards(3, 3); if (cards.length < 3) cards = [...cards, ...shuffle(ALL_CARDS).filter((c) => !cards.includes(c))].slice(0, 3);
  const qi = Math.floor(Math.random() * u2.qcm.length);
  const blanks = blankList(u1), bi = Math.floor(Math.random() * blanks.length);
  const trou = missItem({ unit: u1.id, type: 'trou', i: bi });
  const k = Math.floor(Math.random() * u1.steps.length);
  const tasks = [
    { t: 'cards', label: '3 cartes' },
    { t: 'qcm', label: '1 QCM', items: [{ ...u2.qcm[qi], unit: u2.id, missKey: missKey(u2, 'qcm', qi), missType: 'qcm', missI: qi }] },
    { t: 'step', label: '1 étape à réciter' },
    { t: 'qcm', label: '1 trou', items: trou ? [{ ...trou, unit: u1.id, missKey: missKey(u1, 'trou', bi), missType: 'trou', missI: bi }] : [] }
  ];
  let ti = 0; const scores = []; let t0 = 0, timer = null, warned = false;
  Router.cleanups.push(() => clearInterval(timer));
  app.innerHTML = `
    <div class="colle-wrap">
      <div class="colle-head">${mascotImg('happy', 'bob', 'width:84px;height:108px')}<p class="eyebrow">Pour le bus, la file d'attente, la pause</p><h1>Révision express</h1>
      <p class="muted">5 minutes chrono : ${tasks.map((t) => t.label).join(', ')}.</p></div>
      <div class="row" style="justify-content:center;margin-bottom:14px"><span class="chip" style="font-size:1rem;padding:6px 14px">${icon('timer')}<b id="xtime" class="counter">5:00</b></span></div>
      <div class="stepper" id="xstep"></div>
      <div id="xbox"><div class="row" style="justify-content:center"><button class="btn primary" id="xgo">${icon('bolt')}C'est parti</button></div></div>
    </div>`;
  const box = $('#xbox');
  const stepBar = () => { $('#xstep').innerHTML = tasks.map((t, i) => `<span class="${i === ti ? 'on' : i < ti ? 'done' : ''}">${t.label}</span>`).join(''); };
  stepBar();
  $('#xgo').onclick = () => {
    t0 = Date.now();
    timer = setInterval(() => {
      const el = $('#xtime'); if (!el) return;
      const left = 300 - (Date.now() - t0) / 1000, a = Math.abs(Math.round(left));
      el.textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
      if (left < 0 && !warned) { warned = true; Mascot.react('think', 'Les 5 minutes sont passées ! Termine tranquillement.', { hold: 3000 }); }
    }, 500);
    next();
  };
  function next() {
    stepBar(); mathClear(box);
    if (ti >= tasks.length) return finish();
    const T = tasks[ti];
    if (T.t === 'cards') {
      const off = flashDeck(box, cards.map((c) => ({ ...c })), (res) => { recordCards(res); scores.push(res.reduce((a, b) => a + b.r, 0) / res.length); ti++; next(); });
      Router.cleanups.push(off);
    } else if (T.t === 'qcm') {
      if (!T.items.length) { ti++; return next(); }
      runQcm(box, T.items, (res) => { Store.save(); scores.push(res.filter((r) => r.ok).length / res.length); ti++; next(); }, { title: T.label });
    } else {
      const s = u1.steps[k];
      box.innerHTML = `<section class="cur glass" style="${colorVars(u1)}"><div class="cur-h"><b>${u1.label} · étape ${k + 1} sur ${u1.steps.length}</b><span class="chip c">${s.t}</span></div>
        <p class="muted small">${u1.statement}</p>
        <div class="think">${mascotImg('think')}<span>Récite l'étape « ${s.t} » à voix haute.</span></div>
        <div class="row"><button class="btn primary" id="xshow">Afficher l'étape</button></div></section>`;
      typeset(box);
      $('#xshow').onclick = () => {
        $('#xshow').parentElement.outerHTML = `<div class="reveal-text">${plain(s.x)}</div><div class="rates"><button class="rate r1" data-r="1">Je l'avais</button><button class="rate r2" data-r="0.5">À moitié</button><button class="rate r0" data-r="0">Je ne l'avais pas</button></div>`;
        typeset(box);
        $$('[data-r]', box).forEach((b) => (b.onclick = () => { const r = +b.dataset.r; record(u1.id, 'etapes', r); Mascot.feedback(r >= 0.5); scores.push(r); ti++; next(); }));
      };
    }
  }
  function finish() {
    clearInterval(timer);
    state.express++; Store.save(); checkBadges();
    const pct = Math.round(scores.reduce((a, b) => a + b, 0) / Math.max(1, scores.length) * 100), secs = Math.round((Date.now() - t0) / 1000);
    endBox(box, pct, cheer(pct), `Révision express terminée en ${Math.floor(secs / 60)} min ${String(secs % 60).padStart(2, '0')} s. C'est ta ${state.express}${state.express > 1 ? 'e' : 're'} !`, `<button class="btn soft small" id="xagain">${icon('reset')}Encore une</button><a class="btn ghost small" href="#accueil">Tableau de bord</a>`);
    $('#xagain').onclick = () => Router.render();
  }
};

    const cs = items.filter((x) => x.it.kind === 'card').map(({ m, it }) => ({ q: it.q, a: it.a, id: m.unit, missKey: m.key, missType: m.type, missI: m.i }));
    let okN = 0;
    const done = () => { Store.save(); const left = colleMisses().length; const pct = Math.round(okN / Math.max(1, items.length) * 100); endBox(host, pct, left ? `Encore ${left} erreur${left > 1 ? 's' : ''} à revoir` : 'Ardoise propre !', `${okN} réussie${okN > 1 ? 's' : ''} sur ${items.length}.`, `<button class="btn soft small" id="er-again">Voir la liste</button>`); $('#er-again').onclick = () => Router.render(); checkBadges(); };

/* ---------- Suivi : compte à rebours, plan, maîtrise, badges, historique, réglages ---------- */
function planDays() {
  const D = daysLeft(); if (!(D > 0)) return [];
  const dem = [...DEMOS].sort((a, b) => priority(b.id) - priority(a.id)), ex = [...EXEMPLES].sort((a, b) => priority(b.id) - priority(a.id));
  const nd = dem.length;
  const out = [];
  for (let i = 0; i < Math.min(D, 21); i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const left = D - i;
    let items;
    if (left <= 1) items = [{ href: '#express', t: 'Révision express' }, { href: '#roulette', t: 'Une colle aléatoire, puis repos !' }];
    else if (left <= 3) items = [{ href: '#examen', t: 'Examen blanc' }, { href: '#erreurs', t: 'Mes erreurs' }, { href: '#reviser', t: 'Cartes du jour' }];
    else items = [dem[(2 * i) % nd], dem[(2 * i + 1) % nd], ex.length ? ex[i % ex.length] : dem[(2 * i + 2) % nd]].filter((u, k, a) => u && a.indexOf(u) === k).map((u) => ({ href: `#${u.id}`, t: u.label, u })).concat([{ href: '#reviser', t: 'Cartes du jour' }]);
    out.push({ d, items, today: i === 0 });
  }
  return out;
}

    if (fx < 0.28) prevStep(); else if (fx > 0.72) nextStep(); else setPlaying(!playing);
  });
  let wheelLock = 0, wheelAcc = 0;
  ov.addEventListener('wheel', (e) => {
    if (e.target.closest('.sh-quiz') && quizEl.scrollHeight > quizEl.clientHeight) return;
    e.preventDefault(); const now = performance.now(); if (now < wheelLock) return;
    wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = now + 700; }
  }, { passive: false });
  const onKey = (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    const kmap = { ArrowDown: () => go(1), PageDown: () => go(1), ArrowUp: () => go(-1), PageUp: () => go(-1), ArrowRight: nextStep, ArrowLeft: prevStep, Escape: () => close(), ' ': () => setPlaying(!playing), k: () => setPlaying(!playing), m: () => setVoiceOn(!opt.voice) };
    const fn = kmap[e.key]; if (!fn) return;
    if (e.key === ' ' && e.target.closest && e.target.closest('button')) return;
    e.preventDefault(); fn();
  };
  document.addEventListener('keydown', onKey);
  const onVis = () => { if (document.hidden && playing) setPlaying(false); };
  document.addEventListener('visibilitychange', onVis);
  const onHash = () => close(true);
  window.addEventListener('hashchange', onHash);
  function close(silent) {
    cancelAnimationFrame(raf); ro.disconnect(); hush();
    document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('hashchange', onHash);
    mathClear(ov); ov.remove(); document.documentElement.classList.remove('sh-open'); SP = null;
    if (!silent && back && back.isConnected) back.focus();
    if (Router.current === 'videos' && !silent) Router.render();
  }
  SP = { close };
  load(idx, 0);
  q('#sh-close').focus();
  raf = requestAnimationFrame(tick);
}

});

/* ---------- Exos de TD à savoir faire (liste #exos, page #x25) ----------

   Le statut « Je sais le faire / À revoir » fait partie de la progression synchronisée (state.exo[id] = { s, t }). */

   Les anciens statuts gardés dans Prefs (clé exo:<id>) sont repris au démarrage par Store.adoptExoPrefs. */
const EXO_PARTS = {
  det: { label: 'Déterminants', color: 'sky' }, fpv: { label: 'Fonctions de plusieurs variables', color: 'mint' },
  s4fse: { label: 'Séries de Fourier, séries entières', color: 'lilac' }, s4red: { label: 'Réduction d\'endomorphismes', color: 'sky' },
  s4par: { label: 'Intégrales dépendant d\'un paramètre', color: 'mint' }, s4mul: { label: 'Intégrales multiples', color: 'pink' },
  s4fd: { label: 'Formes différentielles', color: 'butter' }, s4ifd: { label: 'Intégrale des formes différentielles', color: 'peach' }
};
const exoById = Object.fromEntries(ALL_EXOS.map((x) => [x.id, x]));
const exoStatus = (id) => (state.exo[id] && state.exo[id].s) || '';
const exoVars = (x) => { const c = (EXO_PARTS[x.part] || { color: 'lilac' }).color; return `--c:var(--${c});--cs:var(--${c}-s)`; };
const exoParts = () => [...new Set(EXOS.map((x) => x.part))];
const exoNext = () => EXOS.find((x) => exoStatus(x.id) === 're') || EXOS.find((x) => !exoStatus(x.id)) || EXOS[0];
const EXO_LAB = { ok: ['check', 'Je sais le faire'], re: ['reset', 'À revoir'], '': ['eye', 'Pas encore fait'] };

function exoCard(x) {

}
