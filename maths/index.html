/* ---------- Q8 : séries alternées ---------- */
{
  id: 'c3q8', kind: 'demo', n: 8, label: 'Q8', color: 'lilac', domain: 'Séries numériques',
  title: 'Théorème des séries alternées',
  statement: L`Soit \((u_n)\) une suite réelle, décroissante et de limite nulle. Alors la série \(\sum_{n\geqslant0}(-1)^nu_n\) est convergente.`,
  keys: ['adjacentes', 'serie', 'serie-positive'],
  skeleton: [
    L`On pose \(S_n=\sum_{k=0}^n(-1)^ku_k\), \(T_n=S_{2n}\) (rangs pairs) et \(W_n=S_{2n+1}\) (rangs impairs).`,
    L`\(W_{n+1}-W_n=u_{2n+2}-u_{2n+3}\geqslant0\) et \(T_{n+1}-T_n=-u_{2n+1}+u_{2n+2}\leqslant0\).`,
    L`\(T_n-W_n=u_{2n+1}\to0\) : suites adjacentes, même limite.`,
    L`Les rangs pairs et impairs convergent vers la même limite : \((S_n)\) converge.`
  ],
  mnemo: { big: 'Pairs ↓ · Impairs ↑', text: L`« Les pairs descendent, les impairs montent, l'écart fond » : les sommes partielles font un zigzag qui se resserre autour de la somme.` },
  pieges: [
    L`Le prof veut voir les trois calculs : \(W_{n+1}-W_n\), \(T_{n+1}-T_n\) et \(T_n-W_n\), avec le mot « décroissante » au bon endroit.`,
    L`Conclure proprement : si les suites extraites des rangs pairs et impairs ont la même limite, la suite entière converge vers cette limite.`,
    L`Décroissante et de limite nulle implique \(u_n\geqslant0\) : la série est bien alternée.`
  ],
  colleur: [
    { q: L`Calcule \(W_{n+1}-W_n\).`, a: L`\(S_{2n+3}-S_{2n+1}=(-1)^{2n+2}u_{2n+2}+(-1)^{2n+3}u_{2n+3}=u_{2n+2}-u_{2n+3}\geqslant0\).` },
    { q: L`Pourquoi \(T_n-W_n=u_{2n+1}\) ?`, a: L`\(S_{2n}-S_{2n+1}=-(-1)^{2n+1}u_{2n+1}=u_{2n+1}\).` },
    { q: L`Que dit le théorème sur le reste ?`, a: L`La somme \(S\) est entre deux sommes partielles consécutives, donc \(|S-S_n|\leqslant u_{n+1}\) (majoration du reste par le premier terme négligé).` },
    { q: L`Exemple d'application ?`, a: L`\(\sum\frac{(-1)^n}{n+1}\) converge (sa somme vaut \(\ln2\)), alors que \(\sum\frac1{n+1}\) diverge.` },
    { q: L`Et si \((u_n)\) n'est pas décroissante ?`, a: L`Le théorème peut tomber : \(u_n=\frac1{\sqrt n}+\frac{(-1)^n}{n}\) tend vers \(0\) mais \(\sum(-1)^nu_n\) diverge.` },
    { q: L`Pourquoi deux suites adjacentes convergent-elles ?`, a: L`\((W_n)\) est croissante et majorée par \(T_0\), \((T_n)\) décroissante et minorée par \(W_0\) : elles convergent, et \(T_n-W_n\to0\) donne la même limite.` }
  ],
  steps: [
    { t: 'Les sommes partielles', x: L`Posons ⟦\(S_n:=\sum_{k=0}^n(-1)^ku_k\), \(T_n:=S_{2n}\) et \(W_n:=S_{2n+1}\) ;; \(S_n:=\sum_{k=0}^nu_k\), \(T_n:=S_n\) et \(W_n:=S_{n+1}\) ;; \(T_n:=u_{2n}\) et \(W_n:=u_{2n+1}\)⟧ pour tout \(n\geqslant0\).`, why: L`On sépare les sommes partielles de rangs pairs et de rangs impairs.` },
    { t: 'Les impairs montent', x: L`On a \(W_{n+1}-W_n=\sum_{k=0}^{2n+3}(-1)^ku_k-\sum_{k=0}^{2n+1}(-1)^ku_k=\) ⟦\(u_{2n+2}-u_{2n+3}\geqslant0\) ;; \(u_{2n+3}-u_{2n+2}\geqslant0\) ;; \(-u_{2n+2}\leqslant0\)⟧.`, why: L`Il reste les termes d'indices \(2n+2\) (signe \(+\)) et \(2n+3\) (signe \(-\)) ; \(u_{2n+2}\geqslant u_{2n+3}\) par décroissance.` },
    { t: 'Les pairs descendent', x: L`On a \(T_{n+1}-T_n=\sum_{k=0}^{2n+2}(-1)^ku_k-\sum_{k=0}^{2n}(-1)^ku_k=\) ⟦\(-u_{2n+1}+u_{2n+2}\leqslant0\) ;; \(u_{2n+1}-u_{2n+2}\leqslant0\) ;; \(u_{2n+2}\geqslant0\)⟧, car \((u_n)\) est décroissante.`, why: L`Il reste \(-u_{2n+1}\) (indice impair) et \(+u_{2n+2}\) ; \(u_{2n+2}\leqslant u_{2n+1}\).` },
    { t: 'L’écart tend vers 0', x: L`De plus ⟦\(T_n-W_n=u_{2n+1}\) ;; \(T_n-W_n=u_{2n}\) ;; \(T_n-W_n=0\)⟧, de sorte que \((W_n)\) est croissante, \((T_n)\) est décroissante et \(T_n-W_n\to0\) quand \(n\to+\infty\).`, why: L`\(S_{2n}-S_{2n+1}=-(-1)^{2n+1}u_{2n+1}=u_{2n+1}\to0\) car \(u_n\to0\).` },
    { t: 'Suites adjacentes', x: L`Ainsi les suites \((W_n)\) et \((T_n)\) sont ⟦adjacentes ;; périodiques ;; égales⟧ : elles sont donc convergentes et ont même limite.`, why: L`Théorème des suites adjacentes : une croissante, une décroissante, un écart qui tend vers \(0\).` },
    { t: 'Conclusion', x: L`Or \(T_n=S_{2n}\) et \(W_n=S_{2n+1}\) pour tout \(n\geqslant0\), donc la suite \((S_n)\) est elle-même ⟦convergente ;; divergente ;; bornée seulement⟧, ce qui prouve que \(\sum(-1)^nu_n\) converge.`, why: L`Si les rangs pairs et les rangs impairs tendent vers la même limite \(S\), toute la suite tend vers \(S\).` }
  ],
  cards: [
    { q: L`Quelles suites introduit-on dans la démo des séries alternées ?`, a: L`\(S_n=\sum_{k=0}^n(-1)^ku_k\), \(T_n=S_{2n}\) et \(W_n=S_{2n+1}\).` },
    { q: L`Que vaut \(W_{n+1}-W_n\) ?`, a: L`\(u_{2n+2}-u_{2n+3}\geqslant0\) : \((W_n)\) croît.` },
    { q: L`Que vaut \(T_{n+1}-T_n\) ?`, a: L`\(-u_{2n+1}+u_{2n+2}\leqslant0\) : \((T_n)\) décroît.` },
    { q: L`Que vaut \(T_n-W_n\) ?`, a: L`\(u_{2n+1}\), qui tend vers \(0\).` },
    { q: L`Comment conclut-on ?`, a: L`Suites adjacentes, même limite ; rangs pairs et impairs convergent vers la même limite, donc \((S_n)\) converge.` }
  ],
  qcm: [
    { q: L`Quelle propriété de \((u_n)\) donne la monotonie de \((T_n)\) et \((W_n)\) ?`, o: [L`Sa décroissance`, L`Sa limite nulle`, L`Sa positivité`, L`Sa convergence`], why: L`\(u_{2n+2}-u_{2n+3}\geqslant0\) et \(u_{2n+2}-u_{2n+1}\leqslant0\) viennent de la décroissance.` },
    { q: L`Quelle propriété de \((u_n)\) donne \(T_n-W_n\to0\) ?`, o: [L`\(u_n\to0\)`, L`\((u_n)\) décroissante`, L`\(u_n\geqslant0\)`, L`\(\sum u_n\) converge`], why: L`\(T_n-W_n=u_{2n+1}\to0\).` },
    { q: L`\(\sum\frac{(-1)^n}{\sqrt{n+1}}\) :`, o: [L`converge (séries alternées)`, L`diverge, car \(\sum\frac1{\sqrt{n+1}}\) diverge`, L`converge absolument`, L`diverge grossièrement`], why: L`\(\frac1{\sqrt{n+1}}\) décroît vers \(0\) ; la convergence n'est pas absolue.` },
    { q: L`Quel est le sens de variation des sommes partielles de rangs pairs \(S_{2n}\) ?`, o: [L`Décroissantes`, L`Croissantes`, L`Constantes`, L`Ni l'un ni l'autre`], why: L`\(S_{2n+2}-S_{2n}=u_{2n+2}-u_{2n+1}\leqslant0\).` }
  ],
  erreurs: [
    { k: 1, bad: L`On a \(W_{n+1}-W_n=u_{2n+3}-u_{2n+2}\geqslant0\) car \((u_n)\) est décroissante.`, why: L`Les signes sont inversés : le terme d'indice pair \(2n+2\) a le signe \(+\). On trouve \(u_{2n+2}-u_{2n+3}\), positif par décroissance.` },
    { k: 3, bad: L`De plus \(T_n-W_n=u_{2n+1}\), mais rien ne garantit que cet écart tende vers \(0\).`, why: L`L'hypothèse \(u_n\to0\) donne justement \(u_{2n+1}\to0\).` },
    { k: 5, bad: L`Or \(T_n=S_{2n}\) converge, donc \((S_n)\) converge.`, why: L`La convergence des rangs pairs seuls ne suffit pas : il faut que les rangs pairs <b>et</b> impairs convergent vers la même limite.` }
  ],
  errata: [],
  dia: 'c3q8', see: ['c3q9']
},
/* ---------- Q9 : convergence absolue ⇒ convergence ---------- */
{
  id: 'c3q9', kind: 'demo', n: 9, label: 'Q9', color: 'sky', domain: 'Séries numériques',
  title: 'Convergence absolue ⇒ convergence',
  statement: L`Soit \((u_n)\) une suite réelle. Montrer que la convergence absolue de \(\sum u_n\) implique la convergence de \(\sum u_n\). Montrer par un exemple qu'une série peut être convergente sans être absolument convergente.`,
  keys: ['cv-abs', 'comparaison', 'serie-positive', 'riemann-serie'],
  skeleton: [
    L`Parties positive et négative : \(a_n=\max(0,u_n)\), \(b_n=\max(0,-u_n)\).`,
    L`\(a_n,b_n\geqslant0\), \(a_n-b_n=u_n\), \(a_n+b_n=|u_n|\).`,
    L`\(0\leqslant a_n\leqslant|u_n|\) et \(0\leqslant b_n\leqslant|u_n|\) : comparaison, \(\sum a_n\) et \(\sum b_n\) convergent.`,
    L`\(\sum u_n=\sum a_n-\sum b_n\) converge. Contre-exemple : \(\frac{(-1)^n}n\).`
  ],
  mnemo: { big: 'u = a − b', text: L`« Coupe en deux morceaux positifs » : le positif \(a_n\), le négatif \(b_n\). Chacun est sous \(|u_n|\), donc chacun converge.` },
  pieges: [
    L`Le théorème de comparaison ne s'applique qu'à des suites <b>positives</b> : c'est toute la raison d'être de \(a_n\) et \(b_n\). On ne peut pas comparer directement \(u_n\) et \(|u_n|\).`,
    L`Vérifie les quatre propriétés \(a_n\geqslant0\), \(b_n\geqslant0\), \(a_n-b_n=u_n\), \(a_n+b_n=|u_n|\) en distinguant \(u_n\geqslant0\) et \(u_n\lt0\).`,
    L`Pour le contre-exemple, justifie les deux points : la convergence (séries alternées) et la non-convergence absolue (Riemann, série harmonique).`
  ],
  colleur: [
    { q: L`Vérifie que \(a_n+b_n=|u_n|\).`, a: L`Si \(u_n\geqslant0\) : \(a_n=u_n\), \(b_n=0\), somme \(u_n=|u_n|\). Si \(u_n\lt0\) : \(a_n=0\), \(b_n=-u_n\), somme \(-u_n=|u_n|\).` },
    { q: L`Pourquoi ne pas comparer directement \(u_n\leqslant|u_n|\) ?`, a: L`Le théorème de comparaison exige \(0\leqslant u_n\) : sans positivité il est faux (\(-1\leqslant0\)).` },
    { q: L`Ton contre-exemple converge-t-il vraiment ?`, a: L`\(\frac1n\) est décroissante de limite \(0\) : le théorème des séries alternées s'applique. Et \(\sum\frac1n\) diverge (Riemann).` },
    { q: L`Que vaut \(\sum_{n\geqslant1}\frac{(-1)^{n+1}}n\) ?`, a: L`\(\ln2\). (Non demandé, mais classique.)` },
    { q: L`Et pour des suites complexes ?`, a: L`On applique le résultat aux parties réelle et imaginaire, toutes deux majorées en module par \(|u_n|\).` },
    { q: L`Donne une série absolument convergente non positive.`, a: L`\(\sum\frac{(-1)^n}{n^2}\) : \(\sum\frac1{n^2}\) converge.` }
  ],
  steps: [
    { t: 'Partie positive, partie négative', x: L`Posons ⟦\(a_n:=\max(0,u_n)\) et \(b_n:=\max(0,-u_n)\) ;; \(a_n:=|u_n|\) et \(b_n:=u_n\) ;; \(a_n:=u_n^2\) et \(b_n:=-u_n\)⟧ pour tout \(n\geqslant0\), de sorte que ⟦\(a_n\geqslant0\), \(b_n\geqslant0\), \(a_n-b_n=u_n\) et \(a_n+b_n=|u_n|\) ;; \(a_n+b_n=u_n\) et \(a_n-b_n=|u_n|\) ;; \(a_n=b_n\)⟧.`, why: L`Si \(u_n\geqslant0\), \(a_n=u_n\) et \(b_n=0\) ; si \(u_n\lt0\), \(a_n=0\) et \(b_n=-u_n\).` },
    { t: 'La partie positive converge', x: L`Comme ⟦\(0\leqslant a_n\leqslant a_n+b_n=|u_n|\) ;; \(a_n\geqslant|u_n|\) ;; \(a_n\leqslant u_n\)⟧ et que \(\sum|u_n|\) converge, alors par critère de comparaison, \(\sum a_n\) converge.`, why: L`Comparaison de séries <b>positives</b> : c'est pour pouvoir l'utiliser qu'on a introduit \(a_n\).` },
    { t: 'La partie négative converge', x: L`Semblablement, ⟦\(0\leqslant b_n\leqslant|u_n|\) ;; \(b_n\geqslant|u_n|\) ;; \(b_n\leqslant u_n\)⟧ pour tout \(n\), donc \(\sum b_n\) converge.`, why: L`Même argument : \(b_n\) est positive et majorée par \(|u_n|\).` },
    { t: 'Conclusion', x: L`De plus, comme \(u_n=a_n-b_n\) pour tout \(n\), la série \(\sum u_n\) converge comme ⟦différence de deux séries convergentes ;; produit de deux séries convergentes ;; série positive majorée⟧.`, why: L`\(\sum_{n=0}^Nu_n=\sum_{n=0}^Na_n-\sum_{n=0}^Nb_n\), différence de deux suites convergentes.` },
    { t: 'Le contre-exemple', x: L`En considérant ⟦\(u_n=\frac{(-1)^n}n\) ;; \(u_n=\frac{(-1)^n}{n^2}\) ;; \(u_n=\frac1n\)⟧ pour tout \(n\geqslant1\), la série \(\sum u_n\) est une série alternée, donc convergente, tandis que \(\sum|u_n|=\sum\frac1n\) est ⟦divergente d'après le critère de Riemann ;; convergente ;; grossièrement divergente⟧.`, why: L`\(\frac1n\) décroît vers \(0\) (séries alternées) ; \(\sum\frac1n\) est la série de Riemann d'exposant \(1\).` }
  ],
  cards: [
    { q: L`Quelles suites auxiliaires introduit-on ?`, a: L`\(a_n=\max(0,u_n)\) et \(b_n=\max(0,-u_n)\).` },
    { q: L`Quelles sont les quatre propriétés de \(a_n\) et \(b_n\) ?`, a: L`\(a_n\geqslant0\), \(b_n\geqslant0\), \(a_n-b_n=u_n\), \(a_n+b_n=|u_n|\).` },
    { q: L`Pourquoi \(\sum a_n\) converge-t-elle ?`, a: L`\(0\leqslant a_n\leqslant|u_n|\) et \(\sum|u_n|\) converge : comparaison.` },
    { q: L`Quel contre-exemple montre que la réciproque est fausse ?`, a: L`\(\sum\frac{(-1)^n}n\) converge (séries alternées), mais \(\sum\frac1n\) diverge.` }
  ],
  qcm: [
    { q: L`Pourquoi introduit-on \(a_n\) et \(b_n\) ?`, o: [L`Pour appliquer la comparaison à des suites positives`, L`Pour calculer la somme`, L`Pour utiliser les séries alternées`, L`Par commodité d'écriture`], why: L`Le théorème de comparaison exige des termes positifs.` },
    { q: L`Si \(u_n=-3\), que valent \(a_n\) et \(b_n\) ?`, o: [L`\(a_n=0\), \(b_n=3\)`, L`\(a_n=-3\), \(b_n=0\)`, L`\(a_n=3\), \(b_n=3\)`, L`\(a_n=0\), \(b_n=-3\)`], why: L`\(\max(0,-3)=0\) et \(\max(0,3)=3\).` },
    { q: L`Laquelle de ces séries converge sans converger absolument ?`, o: [L`\(\sum\frac{(-1)^n}{n}\)`, L`\(\sum\frac{(-1)^n}{n^2}\)`, L`\(\sum\frac1{n^2}\)`, L`\(\sum(-1)^n\)`], why: L`\(\sum\frac{(-1)^n}{n^2}\) et \(\sum\frac1{n^2}\) convergent absolument ; \(\sum(-1)^n\) diverge grossièrement.` },
    { q: L`La réciproque « convergente ⇒ absolument convergente » est…`, o: [L`fausse`, L`vraie`, L`vraie pour les séries alternées`, L`vraie si \(u_n\to0\)`], why: L`Contre-exemple \(\sum\frac{(-1)^n}n\). Elle est vraie, en revanche, pour les séries à termes positifs.` }

  steps: [
    { t: 'Coefficients de Fourier', x: L`Pour \(f\) \(2\pi\)-périodique continue par morceaux, ⟦\(c_n=\frac1{2\pi}\int_0^{2\pi}f(t)e^{-jnt}\,dt\) ;; \(c_n=\frac1\pi\int_0^{2\pi}f(t)e^{jnt}\,dt\) ;; \(c_n=\int_0^{2\pi}f(t)e^{-jnt}\,dt\)⟧ pour \(n\in\mathbb Z\), et la série de Fourier est \(S[f]=c_0+\sum_{n\geqslant1}\big(c_ne^{jnt}+c_{-n}e^{-jnt}\big)\).`, why: L`Le poly travaille avec les coefficients complexes, normalisés par \(\frac1{2\pi}\).` },

    { t: 'Égalité de Parseval', x: L`Pour \(f\) continue par morceaux, ⟦\(\sum_{n\in\mathbb Z}|c_n|^2=\frac1{2\pi}\int_0^{2\pi}|f(t)|^2dt\) ;; \(\sum_{n\in\mathbb Z}|c_n|=\frac1{2\pi}\int_0^{2\pi}|f(t)|dt\) ;; \(\sum_{n\in\mathbb Z}c_n^2=\int_0^{2\pi}f(t)^2dt\)⟧.`, why: L`L'énergie du signal est la somme des énergies de ses harmoniques.` },
    { t: 'Rayon de convergence', x: L`Pour une série entière \(\sum a_nz^n\), il existe un unique \(R\in[0,+\infty]\) tel que la série ⟦converge pour \(|z|\lt R\) et diverge pour \(|z|\gt R\) ;; converge pour \(|z|\leqslant R\) ;; diverge pour \(|z|\lt R\)⟧. On a \(R=\sup\{r\gt0:\sum|a_n|r^n\text{ converge}\}\).`, why: L`Sur le cercle \(|z|=R\), il n'y a pas de résultat général.` },
    { t: 'Calcul pratique', x: L`Si \(|a_n|^{1/n}\) a une limite, alors ⟦\(\lim|a_n|^{1/n}=\frac1R\) ;; \(\lim|a_n|^{1/n}=R\) ;; \(\lim|a_n|=\frac1R\)⟧ (règle de Cauchy). Si \(a_n\neq0\) et \(\frac{|a_{n+1}|}{|a_n|}\) a une limite, elle vaut \(\frac1R\) (règle de d'Alembert).`, why: L`On applique les règles des séries numériques à \(|a_nz^n|\).` },
    { t: 'Fonction somme', x: L`Si \(R\gt0\), \(f(x)=\sum a_nx^n\) est ⟦de classe \(C^\infty\) sur \(]-R,R[\) ;; seulement continue sur \([-R,R]\) ;; dérivable en \(0\) seulement⟧, on dérive terme à terme, et deux séries entières égales sur un intervalle \(]-r,r[\) ont les mêmes coefficients (identification).`, why: L`\(a_n=\frac{f^{(n)}(0)}{n!}\) : les coefficients sont déterminés par la fonction.` },
    { t: 'Fonctions génératrices', x: L`Pour \(X\) à valeurs dans \(\N\), \(G_X(t)=\mathbb E(t^X)=\sum\mathbb P(X=k)t^k\) a un rayon \(\geqslant1\), ⟦\(\mathbb E(X)=G_X'(1)\) et \(\mathbb E(X^2)=G_X''(1)+G_X'(1)\) ;; \(\mathbb E(X)=G_X(1)\) ;; \(\mathbb E(X^2)=G_X''(1)\)⟧, et si \(X\), \(Y\) sont indépendantes, \(G_{X+Y}=\) ⟦\(G_XG_Y\) ;; \(G_X+G_Y\) ;; \(G_X\circ G_Y\)⟧.`, why: L`\(G_X\) caractérise la loi ; \(\mathbb E(t^{X+Y})=\mathbb E(t^X)\mathbb E(t^Y)\) par indépendance.` },

  statement: L`Valeurs propres et polynôme caractéristique, trigonalisation et diagonalisation, Cayley-Hamilton, sous-espaces caractéristiques, méthode du noyau itéré, puissances et exponentielle de matrice, systèmes différentiels, extrema par la hessienne.`,

    { q: L`Énonce une condition nécessaire et suffisante de trigonalisation.`, a: L`\(A\) est trigonalisable sur \(\mathbb K\) si et seulement si \(P_A\) est scindé sur \(\mathbb K\). Sur \(\mathbb C\), c'est toujours le cas.` },

  steps: [
    { t: 'Valeurs propres', x: L`\(\lambda\) est valeur propre de \(A\) si et seulement si ⟦\(\det(\lambda I_n-A)=0\) ;; \(\det(A)=\lambda\) ;; \(\mathrm{Tr}(A)=\lambda\)⟧, c'est-à-dire si \(\lambda\) est racine de \(P_A(X)=\det(XI_n-A)\), polynôme ⟦unitaire de degré \(n\) ;; de degré \(n-1\) ;; de degré \(2n\)⟧. Deux matrices semblables ont même polynôme caractéristique.`, why: L`\(\det(\lambda I-A)=0\iff\ker(A-\lambda I)\neq\{0\}\) (théorème du rang).` },
    { t: 'Trigonalisation', x: L`\(A\) est trigonalisable sur \(\mathbb K\) si et seulement si ⟦\(P_A\) est scindé sur \(\mathbb K\) ;; \(P_A\) a des racines simples ;; \(A\) est inversible⟧. C'est toujours le cas sur \(\mathbb C\).`, why: L`Récurrence sur \(n\) : on complète un vecteur propre en une base.` },
    { t: 'Cayley-Hamilton', x: L`Si \(P_A\) est le polynôme caractéristique de \(A\), alors ⟦\(P_A(A)=0\) ;; \(P_A(0)=0\) ;; \(A=P_A(0)I_n\)⟧.`, why: L`Démontré par récurrence sur la taille, dans le cas scindé (puis en passant par \(\mathbb C\)).` },
    { t: 'Sous-espaces caractéristiques', x: L`Si \(P_A=\prod_j(X-\lambda_j)^{m_j}\) est scindé, les \(C_{\lambda_j}=\) ⟦\(\ker(A-\lambda_jI)^{m_j}\) ;; \(\ker(A-\lambda_jI)\) ;; \(\mathrm{Im}(A-\lambda_jI)\)⟧ sont stables par \(A\), de dimension \(m_j\), et \(E=\bigoplus_jC_{\lambda_j}\).`, why: L`Décomposition de \(\frac1{P_A}\) en éléments simples et Cayley-Hamilton.` },

    { t: 'Méthode du noyau itéré', x: L`Pour \(\dim\ker(A-\lambda I)^m=m\) : on prend une base de \(\ker(A-\lambda I)\), on la complète en base de \(\ker(A-\lambda I)^2\), etc. Observation fondamentale : si \(x\in\ker(A-\lambda I)^k\), alors ⟦\((A-\lambda I)x\in\ker(A-\lambda I)^{k-1}\) ;; \(Ax=\lambda x\) ;; \(x=0\)⟧.`, why: L`C'est ce qui rend la matrice triangulaire, avec \(\lambda\) sur la diagonale.` },
    { t: 'Puissances', x: L`La méthode donne \(P^{-1}AP=T=D+N\) avec \(D\) diagonale, \(N\) nilpotente et ⟦\(DN=ND\) ;; \(DN=0\) ;; \(D=N\)⟧, donc \(T^m=\sum_k\binom mkN^kD^{m-k}\) (binôme) et \(A^m=PT^mP^{-1}\).`, why: L`La somme du binôme s'arrête car \(N\) est nilpotente.` },
    { t: 'Exponentielle de matrice', x: L`\(\exp(A)=\sum_{k\geqslant0}\frac{A^k}{k!}\) converge, \(\exp(P^{-1}AP)=P^{-1}\exp(A)P\), et ⟦\(\exp(A+B)=\exp(A)\exp(B)\) si \(AB=BA\) ;; \(\exp(A+B)=\exp(A)\exp(B)\) toujours ;; \(\exp(AB)=\exp(A)\exp(B)\)⟧. Si \(N^p=0\), \(\exp(N)=\sum_{k=0}^{p-1}\frac{N^k}{k!}\).`, why: L`Pour \(T=D+N\) avec \(DN=ND\) : \(\exp(T)=\exp(D)\exp(N)\).` },
    { t: 'Systèmes différentiels', x: L`\(t\mapsto\exp(tA)\) est dérivable de dérivée \(A\exp(tA)\), et \(Y'=AY\) sur \(\R\) si et seulement si ⟦\(Y(t)=\exp(tA)U_0\) ;; \(Y(t)=U_0\exp(tA)\) ;; \(Y(t)=e^tAU_0\)⟧ pour une colonne constante \(U_0\).`, why: L`On dérive \(\exp(-tA)Y(t)\) : sa dérivée est nulle.` },
    { t: 'Extrema locaux', x: L`En un point critique \(a\) d'une fonction \(C^2\) sur un ouvert de \(\R^n\) : si toutes les valeurs propres de la hessienne \(H_a(f)\) sont ⟦strictement positives ;; strictement négatives ;; nulles⟧, \(f\) a un minimum local strict ; si elle a des valeurs propres de signes opposés, ⟦pas d'extremum ;; un maximum ;; un minimum⟧.`, why: L`\(H_a(f)\) est symétrique, donc diagonalisable dans une base orthonormée (théorème spectral) ; Taylor-Young à l'ordre 2.` }

  cards: [

  ],

    L`La fonction dominante \(g\) doit être <b>indépendante</b> de \(n\) (ou de \(x\)) : c'est l'hypothèse cruciale. Contre-exemple : \(f_n(t)=n^2t^n(1-t)\) sur \([0,1]\).`,
    L`\(\frac{\sin t}t\) n'est pas dans \(\mathcal L^1(]0,+\infty[)\) : en Lebesgue, pas d'intégrale semi-convergente (\(f\in\mathcal L^1\Rightarrow|f|\in\mathcal L^1\)).`,
    L`Pour la dérivation sous le signe somme, c'est la <b>dérivée partielle</b> \(\frac{\partial f}{\partial x}\) qu'il faut dominer.`
  ],
  colleur: [
    { q: L`Énonce le théorème de convergence dominée.`, a: L`\((f_n)\) dans \(\mathcal L^1(I)\) converge simplement vers \(f\), et il existe \(g\in\mathcal L^1(I)\) avec \(|f_n|\leqslant g\) pour tout \(n\). Alors \(f\in\mathcal L^1(I)\) et \(\int_If_n\to\int_If\).` },
    { q: L`Énonce le théorème d'intégration terme à terme.`, a: L`Si \(f_n\in\mathcal L^1(I)\) et \(\sum\int_I|f_n|\) converge, alors \(\sum f_n\) converge presque partout, \(\sum f_n\in\mathcal L^1(I)\) et \(\int_I\sum f_n=\sum\int_If_n\).` },
    { q: L`Donne des exemples d'ensembles négligeables.`, a: L`Les ensembles finis, dénombrables (\(\N\), \(\mathbb Z\), \(\mathbb Q\)). Un ensemble contenant un intervalle ouvert n'est jamais négligeable.` },
    { q: L`Quelles hypothèses pour dériver sous le signe somme ?`, a: L`\(t\mapsto f(x,t)\in\mathcal L^1(J)\) pour tout \(x\), \(x\mapsto f(x,t)\) dérivable, et \(\left|\frac{\partial f}{\partial x}(x,t)\right|\leqslant g(t)\) avec \(g\in\mathcal L^1(J)\).` },
    { q: L`Quelle est la densité de \(X+Y\) pour \(X\), \(Y\) indépendantes ?`, a: L`Le produit de convolution \(f\star g\) des densités : \((f\star g)(x)=\int_\R f(t)g(x-t)dt\).` },
    { q: L`Comment montrer que \(\varphi(X)\) est à densité ?`, a: L`On calcule \(F_{\varphi(X)}\) ; si elle est continue et dérivable sauf en un nombre fini de points, \(\varphi(X)\) est à densité \(F'_{\varphi(X)}\) (presque partout).` }
  ],
  steps: [
    { t: 'Ensembles négligeables', x: L`\(E\subset\R\) est négligeable si pour tout \(\varepsilon\gt0\), il est recouvert par une famille finie ou dénombrable d'intervalles \(]a_n,b_n[\) avec ⟦\(\sum(b_n-a_n)\leqslant\varepsilon\) ;; \(\sum(b_n-a_n)\geqslant\varepsilon\) ;; \(b_n-a_n=\varepsilon\)⟧. Les ensembles finis et ⟦dénombrables ;; bornés ;; fermés⟧ sont négligeables.`, why: L`Une réunion dénombrable de négligeables est négligeable ; un ensemble contenant un intervalle ouvert ne l'est jamais.` },
    { t: 'L’espace L¹(I)', x: L`\(\mathcal L^1(I)\) est un espace vectoriel, \(f\mapsto\int_If\) est linéaire et positive, et si \(g=f\) ⟦presque partout ;; en un point ;; sur un intervalle⟧ avec \(f\in\mathcal L^1(I)\), alors \(g\in\mathcal L^1(I)\) et \(\int_Ig=\int_If\).`, why: L`L'intégrale de Lebesgue ne voit pas les ensembles négligeables.` },
    { t: 'Lien avec Riemann', x: L`Une fonction Riemann intégrable sur \([a,b]\) est dans \(\mathcal L^1([a,b])\), avec la même intégrale ; une fonction dont l'intégrale généralisée est ⟦absolument convergente ;; semi-convergente ;; divergente⟧ est dans \(\mathcal L^1(I)\). En revanche \(\frac{\sin t}t\notin\mathcal L^1(]0,+\infty[)\).`, why: L`En Lebesgue, \(f\in\mathcal L^1\) entraîne \(|f|\in\mathcal L^1\) : pas de semi-convergence.` },
    { t: 'Changement de variable', x: L`Si \(\varphi:J\to I\) est une bijection \(C^1\) et \(f\in\mathcal L^1(I)\), alors ⟦\(\int_If(x)dx=\int_Jf(\varphi(t))|\varphi'(t)|dt\) ;; \(\int_If=\int_Jf(\varphi(t))dt\) ;; \(\int_If=\int_J\varphi(f(t))dt\)⟧.`, why: L`La valeur absolue de \(\varphi'\) remplace l'orientation des bornes.` },
    { t: 'Intégration terme à terme', x: L`Si \(f_n\in\mathcal L^1(I)\) et si ⟦\(\sum_n\int_I|f_n|\) converge ;; \(\sum f_n\) converge simplement ;; \(f_n\to0\)⟧, alors \(\sum f_n\) converge presque partout, \(\sum f_n\in\mathcal L^1(I)\) et \(\int_I\sum f_n=\sum\int_If_n\).`, why: L`On contrôle la série des intégrales des valeurs absolues, pas seulement la série des fonctions.` },
    { t: 'Convergence dominée', x: L`Si \(f_n\in\mathcal L^1(I)\), \(f_n\to f\) simplement et s'il existe \(g\in\mathcal L^1(I)\) avec ⟦\(|f_n|\leqslant g\) pour tout \(n\) ;; \(|f|\leqslant g\) seulement ;; \(|f_n|\leqslant n\,g\)⟧, alors \(f\in\mathcal L^1(I)\) et \(\int_If_n\to\int_If\).`, why: L`Sans domination, c'est faux : \(n^2t^n(1-t)\to0\) mais son intégrale ne tend pas vers \(0\).` },
    { t: 'Mesurable et dominée', x: L`Si \(f\) est mesurable et ⟦\(|f|\leqslant g\) avec \(g\in\mathcal L^1(I)\) ;; \(f\) bornée ;; \(f\) continue⟧, alors \(f\in\mathcal L^1(I)\). Les fonctions continues (par morceaux, ou presque partout) sont mesurables.`, why: L`Analogue du théorème de comparaison du S3 ; il sert à vérifier \(f_n\in\mathcal L^1\).` },
    { t: 'Continuité sous le signe somme', x: L`Si \(t\mapsto f(x,t)\in\mathcal L^1(J)\), \(x\mapsto f(x,t)\) est continue, et \(|f(x,t)|\leqslant g(t)\) avec \(g\in\mathcal L^1(J)\) ⟦indépendante de \(x\) ;; dépendant de \(x\) ;; bornée⟧, alors \(F(x)=\int_Jf(x,t)dt\) est continue sur \(I\).`, why: L`Conséquence de la convergence dominée par la caractérisation séquentielle.` },
    { t: 'Dérivation sous le signe somme', x: L`Si de plus \(x\mapsto f(x,t)\) est dérivable et ⟦\(\left|\frac{\partial f}{\partial x}(x,t)\right|\leqslant g(t)\) ;; \(|f(x,t)|\leqslant g(t)\) ;; \(\frac{\partial f}{\partial x}\) continue⟧ avec \(g\in\mathcal L^1(J)\), alors \(F\) est dérivable et \(F'(x)=\int_J\frac{\partial f}{\partial x}(x,t)dt\).`, why: L`On domine les taux d'accroissement grâce aux accroissements finis.` },
    { t: 'Mesure de Lebesgue', x: L`\(\lambda(A)=\int_\R\mathbf 1_A\) pour \(A\) mesurable : \(\lambda(]a,b[)=b-a\), \(\lambda\) est croissante, nulle sur les négligeables et ⟦\(\sigma\)-additive : \(\lambda\big(\bigcup A_n\big)=\sum\lambda(A_n)\) pour des \(A_n\) disjoints ;; multiplicative ;; bornée par \(1\)⟧.`, why: L`Les mesurables forment la tribu de Lebesgue \(\beta^*(\R)\).` },
    { t: 'Probabilités à densité', x: L`\(f\) est une densité si \(f\geqslant0\) et \(\int_\R f=1\) ; alors \(\mathbb E(X)=\int_\R tf(t)dt\), \(\mathbb E(\Phi(X))=\int_\R\Phi(t)f(t)dt\) (transfert), et si \(X\), \(Y\) indépendantes de densités \(f\), \(g\), \(X+Y\) a pour densité ⟦\(f\star g\) ;; \(fg\) ;; \(f+g\)⟧.`, why: L`Lois du cours : uniforme \(\mathcal U_{[a,b]}\), exponentielle \(\mathcal E(\alpha)\), normale \(\mathcal N(\mu,\sigma^2)\).` }
  ],
  cards: [
    { q: L`Convergence dominée : les trois hypothèses ?`, a: L`\(f_n\in\mathcal L^1\) ; \(f_n\to f\) simplement ; \(|f_n|\leqslant g\in\mathcal L^1\) pour tout \(n\).` },
    { q: L`Intégration terme à terme : l'hypothèse ?`, a: L`\(\sum_n\int_I|f_n|\lt+\infty\).` },
    { q: L`\(\mathbb Q\) est-il négligeable ?`, a: L`Oui, il est dénombrable.` },
    { q: L`\(\frac{\sin t}t\) est-elle dans \(\mathcal L^1(]0,+\infty[)\) ?`, a: L`Non (\(\int\frac{|\sin t|}t\) diverge), même si \(\int_0^{+\infty}\frac{\sin t}t\) converge et vaut \(\frac\pi2\).` },
    { q: L`Densité de \(X+Y\) (indépendantes) ?`, a: L`\(f\star g\).` },
    { q: L`Espérance et variance de \(\mathcal E(\alpha)\) ?`, a: L`\(\frac1\alpha\) et \(\frac1{\alpha^2}\).` }
  ],
  qcm: [
    { q: L`Pour appliquer la convergence dominée, la fonction \(g\) doit…`, o: [L`être intégrable et indépendante de \(n\)`, L`dépendre de \(n\)`, L`être continue`, L`être bornée`], why: L`\(|f_n|\leqslant g\) pour tout \(n\), avec \(g\in\mathcal L^1\).` },
    { q: L`Quel ensemble n'est PAS négligeable ?`, o: [L`\([0,10^{-9}]\)`, L`\(\mathbb Q\)`, L`\(\{1/n:n\geqslant1\}\)`, L`\(\pi\mathbb Z\)`], why: L`Un intervalle non réduit à un point contient un intervalle ouvert.` },
    { q: L`\(F(x)=\int_Jf(x,t)dt\) est dérivable si l'on domine…`, o: [L`\(\frac{\partial f}{\partial x}\)`, L`\(f\) seulement`, L`\(\frac{\partial f}{\partial t}\)`, L`rien`], why: L`C'est la dérivée en \(x\) qu'il faut dominer par une \(g\in\mathcal L^1\).` },
    { q: L`Si \(f=g\) presque partout et \(f\in\mathcal L^1\), alors…`, o: [L`\(g\in\mathcal L^1\) et \(\int g=\int f\)`, L`\(g\) peut ne pas être intégrable`, L`\(f=g\) partout`, L`\(\int g=0\)`], why: L`L'intégrale de Lebesgue ignore les ensembles négligeables.` }
  ],
  erreurs: [
    { k: 5, bad: L`Si \(f_n\to f\) simplement et que chaque \(f_n\) est intégrable, alors \(\int_If_n\to\int_If\).`, why: L`Il manque la <b>domination</b> \(|f_n|\leqslant g\in\mathcal L^1\) ; sans elle, c'est faux (\(n^2t^n(1-t)\) sur \([0,1]\)).` },
    { k: 4, bad: L`Si \(\sum f_n\) converge simplement, alors \(\int_I\sum f_n=\sum\int_If_n\).`, why: L`L'hypothèse est la convergence de \(\sum\int_I|f_n|\), pas la simple convergence de la série.` },
    { k: 8, bad: L`Si \(|f(x,t)|\leqslant g(t)\) avec \(g\in\mathcal L^1(J)\), alors \(F\) est dérivable et \(F'(x)=\int_J\frac{\partial f}{\partial x}dt\).`, why: L`Dominer \(f\) donne la continuité ; pour la dérivabilité, il faut dominer \(\frac{\partial f}{\partial x}\).` }
  ],

/* ---------- Chapitre 4 ---------- */
{
  id: 's4f4', kind: 'demo', n: 4, label: 'Ch4', name: 'Chapitre 4', color: 'pink', domain: 'Intégration',
  title: 'Intégrales doubles et triples',
  statement: L`Intégrale de Lebesgue sur \(\R^2\), intégrales successives et théorème de Fubini, changement de variables (jacobien), coordonnées polaires, sphériques et cylindriques, couples de variables aléatoires à densité.`,
  keys: ['fubini', 'jacobien', 'polaires'],
  skeleton: [
    L`Fubini : si \(f\in\mathcal L^1(I\times J)\), les intégrales successives existent et sont égales à l'intégrale double.`,
    L`Pour montrer \(f\in\mathcal L^1\) : \(f\) mesurable et une intégrale successive de \(|f|\) converge.`,
    L`Changement de variable : \(\iint_{\varphi(K)}f=\iint_Kf\circ\varphi\,|\det J_\varphi|\) ; polaires \(\rho\), sphériques \(r^2\sin\theta\).`,
    L`Couple à densité : \(\mathbb P((X,Y)\in A)=\iint_Ah\) ; si indépendance, \(h(x,y)=f(x)g(y)\).`
  ],
  mnemo: { big: '|f| d’abord', text: L`« On intègre la valeur absolue avant d'échanger » : Fubini avec \(|f|\) prouve l'intégrabilité, puis on calcule dans l'ordre le plus simple.` },
  pieges: [
    L`On ne peut échanger l'ordre d'intégration que si \(f\in\mathcal L^1(I\times J)\) : on le vérifie avec les intégrales successives de \(|f|\).`,
    L`Ne pas oublier \(|\det J_\varphi|\) : \(\rho\) en polaires, \(r^2\sin\theta\) en sphériques (colatitude), \(r\) en cylindriques.`,
    L`Le domaine se transforme : \(\iint_{\varphi(K)}\) à gauche, \(\iint_K\) à droite. Il faut déterminer \(K\) (les bornes en \(\rho,\theta\)).`
  ],
  colleur: [
    { q: L`Énonce le théorème de Fubini.`, a: L`Si \(f\in\mathcal L^1(I\times J)\), les deux intégrales successives existent, sont égales, et valent \(\iint_{I\times J}f\). Si \(f\) est mesurable et qu'une intégrale successive de \(|f|\) converge, alors \(f\in\mathcal L^1\).` },
    { q: L`Énonce la formule du changement de variable.`, a: L`Pour \(\varphi\) un \(C^1\)-difféomorphisme et \(K\) mesurable : \(\iint_{\varphi(K)}f(x,y)dxdy=\iint_Kf(\varphi(u,v))|\det J_\varphi(u,v)|dudv\).` },
    { q: L`Jacobien des coordonnées polaires ?`, a: L`\(J=\begin{pmatrix}\cos\theta&-\rho\sin\theta\\\sin\theta&\rho\cos\theta\end{pmatrix}\), \(\det J=\rho\).` },
    { q: L`Élément de volume en sphériques ?`, a: L`Avec la colatitude \(\theta\) : \(r^2\sin\theta\,dr\,d\theta\,d\varphi\).` },
    { q: L`Densité d'un couple de variables indépendantes ?`, a: L`\(h(x,y)=f(x)g(y)\), produit des densités.` }

  steps: [
    { t: 'Intégrales successives', x: L`L'intégrale \(\int_I\big(\int_Jf(x,y)dy\big)dx\) existe si, pour presque tout \(x\), \(y\mapsto f(x,y)\) est dans \(\mathcal L^1(J)\) et si \(F(x)=\int_Jf(x,y)dy\) est ⟦dans \(\mathcal L^1(I)\) ;; continue ;; bornée⟧.`, why: L`On autorise un ensemble négligeable de \(x\) où l'intégrale intérieure n'existe pas.` },
    { t: 'Théorème de Fubini', x: L`Si \(f\in\mathcal L^1(I\times J)\), les intégrales successives de \(f\) existent et sont ⟦égales à \(\iint_{I\times J}f\) ;; de signes opposés ;; nulles⟧. Si \(f\) est mesurable et si une intégrale successive de ⟦\(|f|\) ;; \(f\) ;; \(f^2\)⟧ converge, alors \(f\in\mathcal L^1(I\times J)\).`, why: L`Pour les fonctions positives, il suffit qu'une intégrale successive converge.` },
    { t: 'Matrice jacobienne', x: L`Pour \(\varphi=(\varphi_1,\varphi_2)\), \(J_\varphi(u,v)=\begin{pmatrix}\partial_u\varphi_1&\partial_v\varphi_1\\\partial_u\varphi_2&\partial_v\varphi_2\end{pmatrix}\). Si \(\varphi\) est un \(C^1\)-difféomorphisme, alors ⟦\(\det J_\varphi\neq0\) partout ;; \(\det J_\varphi=1\) ;; \(J_\varphi\) est symétrique⟧.`, why: L`Difféomorphisme : bijection \(C^1\) de réciproque \(C^1\).` },
    { t: 'Changement de variable', x: L`Si \(\varphi\) est un \(C^1\)-difféomorphisme, ⟦\(\iint_{\varphi(K)}f(x,y)dxdy=\iint_Kf(\varphi(u,v))|\det J_\varphi(u,v)|dudv\) ;; \(\iint_Kf=\iint_{\varphi(K)}f\circ\varphi\) ;; \(\iint_{\varphi(K)}f=\iint_Kf\circ\varphi\det J_\varphi\)⟧, l'une étant intégrable si et seulement si l'autre l'est.`, why: L`La valeur absolue du jacobien mesure la dilatation des aires.` },
    { t: 'Coordonnées polaires', x: L`\(\varphi(\rho,\theta)=(\rho\cos\theta,\rho\sin\theta)\) est un \(C^1\)-difféomorphisme de \(]0,+\infty[\times]-\pi,\pi[\) sur \(\R^2\) privé d'une demi-droite, et ⟦\(\det J_\varphi=\rho\) ;; \(\det J_\varphi=1\) ;; \(\det J_\varphi=\rho^2\)⟧.`, why: L`La demi-droite retirée est négligeable : elle ne change pas les intégrales.` },
    { t: 'Intégrales triples', x: L`Sur un volume compact intégrable (pavés, boules, cylindres, prismes, leurs intersections), on intègre successivement. En sphériques (colatitude \(\theta\)), \(x=r\cos\varphi\sin\theta\), \(y=r\sin\varphi\sin\theta\), \(z=r\cos\theta\) et ⟦\(|\det J|=r^2\sin\theta\) ;; \(|\det J|=r\) ;; \(|\det J|=r^2\)⟧ ; en cylindriques, \(|\det J|=r\).`, why: L`Même formule du changement de variable qu'en dimension 2.` },
    { t: 'Couples à densité', x: L`\((X,Y)\) a pour densité \(h\geqslant0\), \(\iint_{\R^2}h=1\), si \(\mathbb P((X,Y)\in A)=\iint_Ah\) ; si \(X\) et \(Y\) sont indépendantes de densités \(f\), \(g\), alors ⟦\(h(x,y)=f(x)g(y)\) ;; \(h=f+g\) ;; \(h=f\star g\)⟧.`, why: L`Une probabilité devient une intégrale double, souvent calculée en polaires.` }
  ],
  cards: [
    { q: L`Fubini : quand peut-on échanger l'ordre ?`, a: L`Quand \(f\in\mathcal L^1(I\times J)\), ce qu'on vérifie avec une intégrale successive de \(|f|\).` },
    { q: L`Facteur en polaires ?`, a: L`\(\rho\) : \(dx\,dy=\rho\,d\rho\,d\theta\).` },
    { q: L`Facteur en sphériques ?`, a: L`\(r^2\sin\theta\) (colatitude \(\theta\in[0,\pi]\)).` },
    { q: L`Facteur en cylindriques ?`, a: L`\(r\) : \(dx\,dy\,dz=r\,dr\,d\theta\,dz\).` },
    { q: L`Volume de la boule de rayon \(R\) ?`, a: L`\(\int_0^{2\pi}\int_0^\pi\int_0^Rr^2\sin\theta=\frac43\pi R^3\).` }
  ],
  qcm: [
    { q: L`En polaires, \(\iint_Df(x,y)dxdy\) devient…`, o: [L`\(\iint f(\rho\cos\theta,\rho\sin\theta)\rho\,d\rho\,d\theta\)`, L`\(\iint f(\rho\cos\theta,\rho\sin\theta)d\rho\,d\theta\)`, L`\(\iint f\rho^2\,d\rho\,d\theta\)`, L`\(\iint f\sin\theta\,d\rho\,d\theta\)`], why: L`\(\det J=\rho\).` },
    { q: L`Pour appliquer Fubini à \(f\) de signe quelconque, on vérifie d'abord…`, o: [L`que \(|f|\) a une intégrale successive finie`, L`que \(f\) est continue`, L`que \(f\) est positive`, L`rien`], why: L`C'est ce qui prouve \(f\in\mathcal L^1(I\times J)\).` },
    { q: L`\(|\det J|\) en sphériques (colatitude) ?`, o: [L`\(r^2\sin\theta\)`, L`\(r\sin\theta\)`, L`\(r^2\)`, L`\(r\)`], why: L`Calcul du déterminant \(3\times3\).` },
    { q: L`Si \(X\), \(Y\) indépendantes de densités \(f\), \(g\), la densité de \((X,Y)\) est…`, o: [L`\(f(x)g(y)\)`, L`\(f\star g\)`, L`\(f+g\)`, L`\(\frac{f+g}2\)`], why: L`C'est la densité de \(X+Y\) qui est \(f\star g\).` }
  ],
  erreurs: [
    { k: 3, bad: L`\(\iint_{\varphi(K)}f(x,y)dxdy=\iint_Kf(\varphi(u,v))\,dudv\).`, why: L`Il manque le facteur \(|\det J_\varphi(u,v)|\).` },
    { k: 4, bad: L`En polaires, \(\det J_\varphi=1\), donc \(dx\,dy=d\rho\,d\theta\).`, why: L`\(\det J_\varphi=\rho\) : \(dx\,dy=\rho\,d\rho\,d\theta\).` },
    { k: 1, bad: L`Si les intégrales successives de \(f\) existent, alors elles sont égales.`, why: L`Il faut \(f\in\mathcal L^1(I\times J)\) (vérifié via \(|f|\)) ; sinon les deux ordres peuvent donner des valeurs différentes.` }
  ],

  dia: 's4f4', see: ['s4f3']
},
/* ---------- Chapitre 5 ---------- */
{
  id: 's4f5', kind: 'demo', n: 5, label: 'Ch5', name: 'Chapitre 5', color: 'butter', domain: 'Analyse de Fourier',
  title: 'Transformée de Fourier',
  statement: L`Définition de \(\mathcal F[f]\) pour \(f\in\mathcal L^1(\R)\), linéarité, translation, modulation, dilatation, continuité et limite nulle à l'infini, formule d'inversion, transformées classiques, convolution, dérivation, application aux équations différentielles.`,
  keys: ['fourier-transf'],
  skeleton: [
    L`\(\mathcal F[f](x)=\int_\R f(u)e^{-2i\pi xu}du\), continue, bornée, de limite nulle en \(\pm\infty\).`,
    L`Translation, modulation, dilatation ; inversion \(\overline{\mathcal F}[\mathcal F[f]]=f\) si \(f\) continue et \(\mathcal F[f]\in\mathcal L^1\).`,
    L`\(\mathcal F[f\star g]=\mathcal F[f]\mathcal F[g]\) et \(\mathcal F[f']=(2i\pi x)\mathcal F[f]\).`,
    L`Application : une équation différentielle linéaire devient une équation algébrique.`
  ],
  mnemo: { big: 'Convolution ↔ produit', text: L`« Fourier transforme les convolutions en produits et les dérivées en multiplications par \(2i\pi x\). »` },
  pieges: [
    L`La normalisation du poly est \(e^{-2i\pi xu}\) (sans facteur devant) ; d'autres conventions existent (\(\mathcal F_\omega\)), il faut savoir passer de l'une à l'autre.`,
    L`L'inversion demande \(f\) <b>continue</b> et \(\mathcal F[f]\in\mathcal L^1(\R)\).`,
    L`Translation : \(\mathcal F[f(u-\alpha)](x)=e^{-2i\pi\alpha x}\mathcal F[f](x)\) ; modulation : \(\mathcal F[e^{2i\pi\alpha u}f(u)](x)=\mathcal F[f](x-\alpha)\). Ne pas les confondre.`
  ],
  colleur: [
    { q: L`Donne la définition de la transformée de Fourier.`, a: L`Pour \(f\in\mathcal L^1(\R)\) : \(\mathcal F[f](x)=\int_\R f(u)e^{-2i\pi xu}du\).` },
    { q: L`Que sais-tu de \(\mathcal F[f]\) pour \(f\in\mathcal L^1\) ?`, a: L`Elle est continue, bornée, et tend vers \(0\) en \(\pm\infty\). Si elle est nulle partout, \(f=0\) presque partout.` },
    { q: L`Transformée de \(e^{-a|u|}\) ?`, a: L`\(\frac{2a}{a^2+4\pi^2x^2}\).` },
    { q: L`Transformée d'une gaussienne ?`, a: L`\(\mathcal F[e^{-\lambda u^2}](x)=\sqrt{\frac\pi\lambda}e^{-\pi^2x^2/\lambda}\).` },
    { q: L`Comment résoudre \(y''-y=f\) ?`, a: L`\(\mathcal F[y'']=(2i\pi x)^2\mathcal F[y]\), donc \(\mathcal F[y]=-\frac{\mathcal F[f]}{1+4\pi^2x^2}\), et avec \(\mathcal F[e^{-|t|}]\) on trouve \(y=f\star g\), \(g(t)=-\frac12e^{-|t|}\).` }

  steps: [
    { t: 'Définition', x: L`Pour \(f\in\mathcal L^1(\R)\), ⟦\(\mathcal F[f](x)=\int_\R f(u)e^{-2i\pi xu}du\) ;; \(\mathcal F[f](x)=\int_\R f(u)e^{2i\pi xu}du\) ;; \(\mathcal F[f](x)=\frac1{2\pi}\int_\R f(u)e^{-ixu}du\)⟧ pour tout \(x\in\R\).`, why: L`C'est la normalisation du poly (\(\omega=2\pi\)).` },
    { t: 'Translation et modulation', x: L`\(\mathcal F[f(u-\alpha)](x)=\) ⟦\(e^{-2i\pi\alpha x}\mathcal F[f](x)\) ;; \(\mathcal F[f](x-\alpha)\) ;; \(e^{2i\pi\alpha x}\mathcal F[f](x)\)⟧ et \(\mathcal F[e^{2i\pi\alpha u}f(u)](x)=\mathcal F[f](x-\alpha)\).`, why: L`Changement de variable \(v=u-\alpha\) dans l'intégrale.` },
    { t: 'Dilatation', x: L`Pour \(\lambda\neq0\) : ⟦\(\mathcal F[f(\lambda u)](x)=\frac1{|\lambda|}\mathcal F[f]\big(\frac x\lambda\big)\) ;; \(\mathcal F[f(\lambda u)](x)=\lambda\mathcal F[f](\lambda x)\) ;; \(\mathcal F[f(\lambda u)]=\mathcal F[f]\)⟧.`, why: L`Changement de variable \(v=\lambda u\), d'où le \(\frac1{|\lambda|}\).` },
    { t: 'Régularité', x: L`Si \(f\in\mathcal L^1(\R)\), \(\mathcal F[f]\) est ⟦continue, bornée, et tend vers \(0\) en \(\pm\infty\) ;; dérivable ;; intégrable⟧. Si \(\mathcal F[f]=0\), alors \(f=0\) presque partout.`, why: L`Continuité sous le signe somme, et Riemann-Lebesgue pour la limite.` },
    { t: 'Inversion', x: L`Si \(f\in\mathcal L^1(\R)\) est ⟦continue et si \(\mathcal F[f]\in\mathcal L^1(\R)\) ;; seulement bornée ;; paire⟧, alors \(\overline{\mathcal F}[\mathcal F[f]]=f\), où \(\overline{\mathcal F}[g](x)=\int_\R g(u)e^{+2i\pi xu}du\).`, why: L`La transformée inverse a le signe \(+\) dans l'exponentielle.` },
    { t: 'Transformées classiques', x: L`\(\mathcal F[\Pi_a](x)=\frac{\sin(2\pi ax)}{\pi x}\), \(\mathcal F[e^{-\lambda u^2}](x)=\sqrt{\frac\pi\lambda}e^{-\pi^2x^2/\lambda}\), ⟦\(\mathcal F[e^{-a|u|}](x)=\frac{2a}{a^2+4\pi^2x^2}\) ;; \(\mathcal F[e^{-a|u|}](x)=\frac1{a^2+x^2}\) ;; \(\mathcal F[e^{-a|u|}](x)=e^{-a|x|}\)⟧, \(\mathcal F\big[\frac1{u^2+\lambda^2}\big](x)=\frac\pi\lambda e^{-2\pi\lambda|x|}\).`, why: L`\(\Pi_a\) est l'indicatrice de \(]-a,a[\).` },
    { t: 'Convolution', x: L`Si \(f,g\in\mathcal L^1(\R)\), alors \(f\star g\in\mathcal L^1(\R)\) et ⟦\(\mathcal F[f\star g]=\mathcal F[f]\,\mathcal F[g]\) ;; \(\mathcal F[f\star g]=\mathcal F[f]+\mathcal F[g]\) ;; \(\mathcal F[fg]=\mathcal F[f]\,\mathcal F[g]\)⟧.`, why: L`Fubini dans l'intégrale double \(\iint f(x-u)g(u)e^{-2i\pi tx}\).` },
    { t: 'Dérivation', x: L`Si \(f\) est dérivable, \(f,f'\in\mathcal L^1(\R)\) et \(f'\) bornée sur tout segment, ⟦\(\mathcal F[f'](x)=(2i\pi x)\mathcal F[f](x)\) ;; \(\mathcal F[f']=\mathcal F[f]'\) ;; \(\mathcal F[f'](x)=-2i\pi x\mathcal F[f](x)\)⟧. Et si \(u^nf(u)\in\mathcal L^1\), \(\mathcal F[f]\) est \(C^n\) avec \((\mathcal F[f])^{(k)}=(-2i\pi)^k\mathcal F[u^kf]\).`, why: L`Intégration par parties pour la première, dérivation sous le signe somme pour la seconde.` }
  ],

    { t: 'Forme exacte et lacet', x: L`Si \(\omega=dg\), alors \(\int_\gamma dg=\) ⟦\(g(\gamma(b))-g(\gamma(a))\) ;; \(0\) toujours ;; \(g(b)-g(a)\)⟧ ; sur un lacet, l'intégrale d'une forme exacte est nulle.`, why: L`La dérivée de \(g\circ\gamma\) est l'intégrande.` },
    { t: 'Green-Riemann', x: L`Pour un compact à bord \(K\), bord orienté avec \(K\) ⟦à gauche ;; à droite ;; dans n'importe quel sens⟧ : \(\iint_K\big(\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}\big)dxdy=\oint_{\partial K}P\,dx+Q\,dy\). Aire \(=\oint x\,dy=\frac12\oint(x\,dy-y\,dx)\).`, why: L`C'est le théorème de Stokes dans le plan : \(\iint_Kd\alpha=\oint_{\partial K}\alpha\).` },

/* ---------- FAQ : questions posées par l'étudiant dans Claude Code ----------
   Format : { d: 'q3' (id de démo/exemple, ou '' si général), q: 'question', a: 'réponse HTML + LaTeX \( \)', date: 'AAAA-MM-JJ' }
   Plus récente en premier. Réponse découpée en <p>…</p>, formule clé en <div class="math">\[ … \]</div>,
   idée clé en <b>, et un encadré <div class="faq-oral"><b>À l'oral :</b> …</div>. */
const FAQ = [
{ d: '', date: '2026-11-13',
  q: L`Exo EDP, question 2 : pourquoi ne pas calculer \(\dd Tv\) et primitiver en \(v\) ?`,
  a: L`<p>Bonne idée à tester, mais <b>ça bloque</b> : on ne connaît pas \(\dd Tv\) en général. Calculons-la. Avec \(x=e^{2u-v}\), \(y=e^{3u-2v}\) : \(\dd xv=-x\) et \(\dd yv=-2y\), donc</p>
<div class="math">\[ \dd Tv=-\Big(x\dd{F_0}x+2y\dd{F_0}y\Big). \]</div>
<p>Or \((\star)\) donne seulement la combinaison \(2x\dd{F_0}x+3y\dd{F_0}y\), pas \(x\dd{F_0}x+2y\dd{F_0}y\). On ne peut donc rien en dire, sauf là où \((\star\star)\) s'applique.</p>
<p><b>Où \((\star\star)\) s'applique-t-il ?</b> Sur les points \(\big(\frac1t,\frac1{t^2}\big)\), c'est-à-dire là où \(y=x^2\). Là, \(\frac1{t^2}=x^2\) et \(\frac2{t^3}=2xy\), donc \((\star\star)\) dit \(x\big(x\dd{F_0}x+2y\dd{F_0}y\big)=\ln t\) : c'est bien la combinaison de \(\dd Tv\). Mais \(y=x^2\) s'écrit \(e^{3u-2v}=e^{4u-2v}\), soit \(u=0\) : on ne connaît \(\dd Tv\) que <b>sur la droite \(u=0\)</b>.</p>
<p><b>D'où la méthode de l'énoncé :</b></p>
<ul><li>sur la droite \(u=0\), on connaît \(T\) grâce à \((\star\star)\) : \(T(0,v)=\varphi(e^v)\) (c'est la question 1) ;</li>
<li>partout, on connaît \(\dd Tu\) grâce à \((\star)\). On part de la droite \(u=0\) et on avance en \(u\).</li></ul>
<p>Le changement de variables a été <b>choisi exprès</b> pour que \(\dd Tu\) soit exactement le membre de gauche de \((\star)\) : c'est pour ça qu'on dérive en \(u\) et pas en \(v\).</p>
<div class="faq-oral"><b>À l'oral :</b> « \(\dd Tv=-(x\dd{F_0}x+2y\dd{F_0}y)\), que l'énoncé ne donne pas en général. En revanche \(\dd Tu=2x\dd{F_0}x+3y\dd{F_0}y\), qui est donné par \((\star)\). On primitive donc en \(u\), et la valeur en \(u=0\) vient de \((\star\star)\) via \(\varphi\). »</div>` },
{ d: '', date: '2026-11-13',
  q: L`Exo EDP, question 2 : comment passe-t-on de \(\dd Tu=2e^v\) à \(T(u,v)=2ue^v+\varphi(e^v)\) (étapes 4 et 5) ?`,
  a: L`<p>C'est <b>la même idée que la question 1</b> (primitiver), mais avec deux variables. On bloque \(v\) : c'est un nombre fixé, et on regarde \(T\) comme une fonction de \(u\) seulement.</p>
<p><b>Étape 4.</b> On sait que \(\dd Tu(u,v)=2e^v\). Comme \(v\) est bloqué, \(2e^v\) est une constante, et une primitive en \(u\) est \(2ue^v\). Donc \(u\mapsto T(u,v)-2ue^v\) a pour dérivée \(2e^v-2e^v=0\) : elle est constante <b>en \(u\)</b>. Mais cette « constante » peut changer quand on change \(v\) : on la note \(c(v)\).</p>
<div class="math">\[ T(u,v)=2ue^v+c(v) \]</div>
<p><b>Trouver \(c(v)\).</b> L'égalité est vraie pour tout \(u\) : on choisit le plus simple, \(u=0\). Il reste \(T(0,v)=0+c(v)\), donc \(c(v)=T(0,v)\).</p>
<p><b>Étape 5.</b> On calcule \(T(0,v)\) avec la définition de \(T\) (on remplace \(u\) par \(0\)) :</p>
<div class="math">\[ T(0,v)=F_0\big(e^{-v},e^{-2v}\big) \]</div>
<p>Or \(\varphi(t)=F_0\big(\frac1t,\frac1{t^2}\big)\). Si on prend \(t=e^v\), alors \(\frac1t=e^{-v}\) et \(\frac1{t^2}=e^{-2v}\) : c'est exactement ce qu'on a. Donc \(T(0,v)=\varphi(e^v)\), et</p>
<div class="math">\[ T(u,v)=2ue^v+\varphi(e^v). \]</div>
<p><b>À retenir :</b> quand on primitive par rapport à \(u\) une fonction de \((u,v)\), la constante d'intégration est une <b>fonction de \(v\)</b>. On la trouve en donnant à \(u\) une valeur simple.</p>
<div class="faq-oral"><b>À l'oral :</b> « À \(v\) fixé, \(T(u,v)-2ue^v\) a une dérivée nulle en \(u\) sur \(\R\), donc ne dépend que de \(v\). Je l'évalue en \(u=0\) : elle vaut \(T(0,v)=F_0(e^{-v},e^{-2v})\), qui est \(\varphi(e^v)\) par définition de \(\varphi\). »</div>` },
{ d: '', date: '2026-11-13',
  q: L`Exo EDP, question 1 : pourquoi \(\varphi(t)+t\ln t=t+C\) ? C'est une équation différentielle ?`,
  a: L`<p>C'est juste une <b>primitive</b> (l'équation différentielle la plus simple qui soit : \(g'=1\)). On pose \(g(t)=\varphi(t)+t\ln t\). L'étape précédente a montré que</p>
<div class="math">\[ g'(t)=1\quad\text{pour tout } t\gt0. \]</div>
<p>Quelles fonctions ont pour dérivée \(1\) ? La fonction \(t\mapsto t\), et toutes celles qui en diffèrent d'une constante. En effet \((g(t)-t)'=1-1=0\), et <b>une fonction de dérivée nulle sur un intervalle est constante</b>. Donc \(g(t)-t=C\), c'est-à-dire</p>
<div class="math">\[ \varphi(t)+t\ln t=t+C. \]</div>
<p>Il n'y a rien à « résoudre » : on primitive les deux côtés. La constante \(C\) se trouve ensuite avec la condition \(\varphi(1)=F_0(1,1)=2\) : \(2+0=1+C\), donc \(C=1\).</p>
<p><b>Pourquoi l'énoncé fait dériver \(\varphi(t)+t\ln t\) ?</b> Parce que \(\varphi'(t)=-\ln t\) et \((t\ln t)'=\ln t+1\) : le \(t\ln t\) est là pour annuler le \(\ln t\). C'est une façon déguisée de primitiver \(-\ln t\).</p>
<div class="faq-oral"><b>À l'oral :</b> « La dérivée de \(\varphi(t)+t\ln t\) vaut 1 sur l'intervalle \(]0,+\infty[\), donc cette fonction est égale à \(t\) plus une constante. Je trouve la constante avec \(\varphi(1)=2\). »</div>` },
{ d: 'q1', date: '2026-10-24',
  q: L`Dans la démo 1, pourquoi \(f(\vx{\varphi(k)})\to+\infty\) ?`,
  a: L`<p>Tout vient de la construction de la suite au début de la preuve : pour tout \(k\geqslant1\), on a \(f(\vx{k})\geqslant k\). Le terme d'indice \(j\) est donc au moins égal à \(j\).</p>
<p>La sous-suite \((\vx{\varphi(k)})\) est formée des termes d'indices \(\varphi(k)\). On applique l'inégalité avec \(j=\varphi(k)\) :</p>
<div class="math">\[ f(\vx{\varphi(k)})\geqslant\varphi(k) \]</div>
<p><b>Pourquoi \(\varphi(k)\to+\infty\) ?</b> \(\varphi\) est strictement croissante de \(\N^*\) dans \(\N^*\), donc \(\varphi(k+1)\geqslant\varphi(k)+1\). Par récurrence, \(\varphi(k)\geqslant k\) pour tout \(k\), et comme \(k\to+\infty\), \(\varphi(k)\to+\infty\).</p>
<p>Donc \(f(\vx{\varphi(k)})\) est minorée par \(\varphi(k)\), qui tend vers \(+\infty\) : par comparaison, \(f(\vx{\varphi(k)})\to+\infty\).</p>
<p><b>Ce qui contredit</b> la continuité : \(f(\vx{\varphi(k)})\to f(\va)\), un nombre fini. Une suite ne peut pas tendre à la fois vers un réel et vers \(+\infty\).</p>
<div class="faq-oral"><b>À l'oral :</b> « Les termes \(f(\vx{k})\) sont au moins \(k\). Dans la sous-suite, le terme de rang \(k\) correspond à l'indice \(\varphi(k)\), donc il est au moins \(\varphi(k)\). Comme \(\varphi(k)\geqslant k\), ça part vers \(+\infty\). »</div>` },
];
