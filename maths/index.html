/* ---------- Q5 ---------- */
{
  id: 'c1q5', kind: 'demo', n: 5, label: 'Q5', color: 'butter', domain: 'Applications linéaires',
  title: 'rg f = p ⇒ f injective',
  statement: L`Soient \(E\), \(F\) deux \(\mathbb K\)-espaces vectoriels, avec \(\dim E=p\) et \(\dim F=n\), et \(f\in\mathcal L(E,F)\). Montrer que si le rang de \(f\) vaut \(p\), alors \(f\) est injective.`,
  keys: ['rang', 'noyau-image', 'gen-min', 'libre'],
  skeleton: [
    L`\((f(e_1),\dots,f(e_p))\) engendre \(\mathrm{Im}f\), de dimension \(p\) : génératrice minimale, donc libre.`,
    L`Soit \(\vec x=\sum x_ie_i\in\ker f\) : \(\sum x_if(e_i)=\vec0\).`,
    L`Liberté : tous les \(x_i\) sont nuls, \(\vec x=\vec0\), \(\ker f=\{\vec0\}\).`
  ],
  mnemo: { big: 'Rang plein ⇒ noyau nul', text: L`« Aucune dimension perdue » : si l'image a autant de dimensions que l'espace de départ, rien n'est écrasé sur \(\vec0\).` },
  pieges: [
    L`L'argument « génératrice à \(p\) vecteurs dans un espace de dimension \(p\) ⇒ libre » est le cœur : énonce-le (c'est le sens réciproque de la Q2).`,
    L`Pour montrer l'injectivité, on prend \(\vec x\in\ker f\) et on montre \(\vec x=\vec0\) : n'oublie pas de décomposer \(\vec x\) dans la base.`,
    L`Conclure par « \(\ker f=\{\vec0\}\), donc \(f\) est injective ».`
  ],
  colleur: [
    { q: L`Pourquoi \((f(e_i))\) est-elle libre ?`, a: L`Elle engendre \(\mathrm{Im}f\), de dimension \(p\), avec \(p\) vecteurs : c'est une base, donc elle est libre.` },
    { q: L`Comment le théorème du rang donne-t-il le résultat directement ?`, a: L`\(\dim\ker f=\dim E-\mathrm{rg}f=p-p=0\).` },
    { q: L`Conséquence en dimension égale (\(n=p\)) ?`, a: L`Injective ⟺ surjective ⟺ bijective ⟺ \(\mathrm{rg}f=n\).` },
    { q: L`Pourquoi \(\ker f=\{\vec0\}\) implique-t-il l'injectivité ?`, a: L`Si \(f(\vec x)=f(\vec y)\), alors \(f(\vec x-\vec y)=\vec0\), donc \(\vec x-\vec y=\vec0\).` }
  ],
  steps: [
    { t: 'La famille image est libre', x: L`Soit \((e_1,\dots,e_p)\) une base de \(E\). \((f(e_1),\dots,f(e_p))\) est génératrice de \(\mathrm{Im}(f)\). Si \(\mathrm{rg}(f)=p\), alors \(\dim\mathrm{Im}(f)=p\), et comme \((f(e_i))\) est génératrice à \(p\) vecteurs, elle est ⟦génératrice minimale, donc libre ;; liée ;; orthonormée⟧.`, why: L`En dimension \(p\), une famille génératrice de \(p\) vecteurs est une base.` },
    { t: 'Un vecteur du noyau', x: L`Soit maintenant \(\vec x\in\ker f\). Alors \(f(\vec x)=\vec0\). Il existe \(x_1,\dots,x_p\in\mathbb K\) tels que \(\vec x=\sum x_ie_i\), et donc par linéarité ⟦\(\sum x_if(e_i)=\vec0\) ;; \(\sum x_ie_i=\vec0\) ;; \(f(x_i)=0\)⟧.`, why: L`On décompose \(\vec x\) dans la base, puis on applique \(f\).` },
    { t: 'Liberté', x: L`Comme \((f(e_1),\dots,f(e_p))\) est libre, ceci implique que ⟦tous les \(x_i\) sont nuls ;; un des \(x_i\) est nul ;; \(\vec x\in\mathrm{Im}f\)⟧, et par conséquent \(\vec x=\vec0\).`, why: L`Une combinaison nulle d'une famille libre a tous ses coefficients nuls.` },
    { t: 'Conclusion', x: L`Donc ⟦\(\ker f=\{\vec0\}\) ;; \(\mathrm{Im}f=F\) ;; \(\ker f=E\)⟧, et donc \(f\) est injective.`, why: L`\(f\) linéaire est injective si et seulement si son noyau est réduit à \(\{\vec0\}\).` }
  ],
  cards: [
    { q: L`Pourquoi \((f(e_i))\) est libre quand \(\mathrm{rg}f=p\) ?`, a: L`Génératrice de \(\mathrm{Im}f\) (dimension \(p\)) avec \(p\) vecteurs : base, donc libre.` },
    { q: L`Comment montre-t-on \(\ker f=\{\vec0\}\) ?`, a: L`\(\vec x=\sum x_ie_i\in\ker f\) ⇒ \(\sum x_if(e_i)=\vec0\) ⇒ \(x_i=0\) ⇒ \(\vec x=\vec0\).` },
    { q: L`Version théorème du rang ?`, a: L`\(\dim\ker f=p-\mathrm{rg}f=0\).` }
  ],
  qcm: [
    { q: L`Si \(\mathrm{rg}f=p=\dim E\), \(\dim\ker f\) vaut…`, o: [L`\(0\)`, L`\(p\)`, L`\(n-p\)`, L`\(n\)`], why: L`Théorème du rang.` },
    { q: L`Quel argument rend \((f(e_i))\) libre ?`, o: [L`Génératrice minimale`, L`Injectivité de \(f\)`, L`Liberté de \((e_i)\) seule`, L`Surjectivité`], why: L`On ne sait pas encore que \(f\) est injective : c'est ce qu'on démontre.` },
    { q: L`Pour montrer qu'une application linéaire est injective, il suffit de montrer…`, o: [L`\(\ker f=\{\vec0\}\)`, L`\(f(\vec0)=\vec0\)`, L`\(\mathrm{Im}f\neq\{\vec0\}\)`, L`\(\dim E\leqslant\dim F\)`], why: L`Caractérisation par le noyau.` },
    { q: L`Cette démo est la réciproque de…`, o: [L`f injective ⇒ rg f = p`, L`Cauchy-Schwarz`, L`dim E = dim F + dim G`, L`Tr(AB) = Tr(BA)`], why: L`Q4 et Q5 donnent ensemble : f injective ⟺ rg f = dim E.` }
  ],
  erreurs: [
    { k: 0, bad: L`\((f(e_i))\) est génératrice de \(\mathrm{Im}(f)\) et, comme \(f\) est injective, elle est libre.`, why: L`On ne peut pas utiliser l'injectivité : c'est ce qu'on veut prouver. La liberté vient du <b>rang</b> (génératrice minimale).` },
    { k: 2, bad: L`Comme \((e_1,\dots,e_p)\) est libre, \(\sum x_if(e_i)=\vec0\) implique \(x_i=0\).`, why: L`La combinaison porte sur les \(f(e_i)\) : c'est la liberté de \((f(e_i))\) qu'il faut utiliser.` },
    { k: 3, bad: L`Donc \(\mathrm{Im}f=F\), et \(f\) est injective.`, why: L`\(\mathrm{Im}f=F\) est la surjectivité. Ici on a prouvé \(\ker f=\{\vec0\}\).` }
  ],
  errata: [],
  dia: 'c1q5', see: ['c1q4', 'c1q2']
},
/* ---------- Q6 ---------- */
{
  id: 'c1q6', kind: 'demo', n: 6, label: 'Q6', color: 'peach', domain: 'Matrices',
  title: 'Matrice d’un endomorphisme : Y = AX',
  statement: L`Soit \(E\) un \(\mathbb K\)-espace vectoriel de dimension \(n\geqslant1\), \(\B\) une base de \(E\), \(u\in\mathcal L(E)\) et \(\vec x\in E\). Donner l'expression liant \(M_\B(\vec x)\), \(M_\B(u(\vec x))\) et \(M_\B(u)\), et la démontrer.`,
  keys: ['mat-endo', 'unicite', 'base'],
  skeleton: [
    L`Formule : \(Y=AX\) avec \(X=M_\B(\vec x)\), \(Y=M_\B(u(\vec x))\), \(A=M_\B(u)\).`,
    L`Définition de \(A\) : \(u(e_j)=\sum_ia_{i,j}e_i\).`,
    L`Linéarité : \(u(\vec x)=\sum_jx_ju(e_j)\), puis on intervertit les sommes.`,
    L`Unicité dans \(\B\) : \(y_i=\sum_ja_{i,j}x_j\).`
  ],
  mnemo: { big: 'Colonnes = images', text: L`« La colonne \(j\) de \(A\), c'est \(u(e_j)\) » : en multipliant par \(X\), on recombine les images avec les coordonnées de \(\vec x\).` },
  pieges: [
    L`Écris la définition de \(A\) avec le bon ordre d'indices : \(u(e_j)=\sum_ia_{i,j}e_i\) (colonne \(j\), ligne \(i\)).`,
    L`La linéarité de \(u\) est indispensable : c'est elle qui permet \(u(\sum x_je_j)=\sum x_ju(e_j)\).`,
    L`Même structure que la Q3 : on termine par l'unicité des coordonnées.`
  ],
  colleur: [
    { q: L`Que contient la colonne \(j\) de \(A\) ?`, a: L`Les coordonnées de \(u(e_j)\) dans \(\B\).` },
    { q: L`Matrice de la rotation d'angle \(\theta\) dans la base canonique de \(\R^2\) ?`, a: L`\(\begin{pmatrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{pmatrix}\) : ses colonnes sont les images de \(e_1\) et \(e_2\).` },
    { q: L`Que vaut la matrice de \(u\circ v\) ?`, a: L`\(M_\B(u\circ v)=M_\B(u)M_\B(v)\), conséquence de \(Y=AX\).` },
    { q: L`Pourquoi peut-on intervertir les sommes ?`, a: L`Ce sont des sommes finies.` }
  ],
  steps: [
    { t: 'La formule et les notations', x: L`On pose \(X=M_\B(\vec x)\), \(Y=M_\B(u(\vec x))\) et \(A=M_\B(u)\). On cherche à montrer que ⟦\(Y=AX\) ;; \(X=AY\) ;; \(Y=XA\)⟧. On note \(\vec x=\sum x_ie_i\) et \(u(\vec x)=\sum y_ie_i\).`, why: L`\(X\) et \(Y\) sont des colonnes de coordonnées dans \(\B=(e_1,\dots,e_n)\).` },
    { t: 'Définition de A', x: L`Par définition, en notant \(A=(a_{i,j})\), on a ⟦\(u(e_j)=\sum_{i=1}^na_{i,j}e_i\) ;; \(u(e_i)=\sum_ja_{i,j}e_j\) ;; \(e_j=\sum_ia_{i,j}u(e_i)\)⟧ pour tout \(j\in\{1,\dots,n\}\).`, why: L`La colonne \(j\) de \(A\) contient les coordonnées de \(u(e_j)\).` },
    { t: 'Linéarité', x: L`Par linéarité, ⟦\(u(\vec x)=u\left(\sum_jx_je_j\right)=\sum_jx_ju(e_j)\) ;; \(u(\vec x)=\sum_ju(x_j)e_j\) ;; \(u(\vec x)=\sum_jx_je_j\)⟧.`, why: L`\(u\) linéaire : on sort les scalaires \(x_j\) et on distribue sur la somme.` },
    { t: 'On remplace et on intervertit', x: L`En reportant, ⟦\(u(\vec x)=\sum_jx_j\left(\sum_ia_{i,j}e_i\right)=\sum_i\left(\sum_ja_{i,j}x_j\right)e_i\) ;; \(u(\vec x)=\sum_i\left(\sum_ja_{j,i}x_j\right)e_i\) ;; \(u(\vec x)=\sum_ia_{i,i}x_ie_i\)⟧.`, why: L`On regroupe selon les vecteurs \(e_i\) (sommes finies).` },
    { t: 'Unicité', x: L`Par ⟦unicité de l'écriture dans la base \(\B\) ;; linéarité de \(u\) ;; inversibilité de \(A\)⟧, \(y_i=\sum_ja_{i,j}x_j\) pour tout \(i\), ce qui équivaut à l'écriture matricielle \(Y=AX\).`, why: L`\(\sum_ja_{i,j}x_j\) est le coefficient \(i\) du produit \(AX\).` }
  ],
  cards: [
    { q: L`Relation entre \(M_\B(\vec x)\), \(M_\B(u(\vec x))\) et \(M_\B(u)\) ?`, a: L`\(Y=AX\).` },
    { q: L`Définition de \(A=M_\B(u)\) ?`, a: L`\(u(e_j)=\sum_ia_{i,j}e_i\) : colonne \(j\) = coordonnées de \(u(e_j)\).` },
    { q: L`Les deux arguments clés de la preuve ?`, a: L`La linéarité de \(u\) et l'unicité des coordonnées dans \(\B\).` }
  ],
  qcm: [
    { q: L`La colonne \(j\) de \(M_\B(u)\) contient…`, o: [L`les coordonnées de \(u(e_j)\)`, L`les coordonnées de \(e_j\)`, L`la ligne \(j\) transposée`, L`\(u(x_j)\)`], why: L`Définition de la matrice d'une application linéaire.` },
    { q: L`Quelle propriété donne \(u(\sum x_je_j)=\sum x_ju(e_j)\) ?`, o: [L`La linéarité de \(u\)`, L`L'unicité des coordonnées`, L`L'inversibilité de \(u\)`, L`La symétrie de \(A\)`], why: L`Définition d'une application linéaire.` },
    { q: L`Avec \(A=\begin{pmatrix}1&2\\0&1\end{pmatrix}\) et \(X=\begin{pmatrix}1\\1\end{pmatrix}\), \(Y\) vaut…`, o: [L`\(\begin{pmatrix}3\\1\end{pmatrix}\)`, L`\(\begin{pmatrix}1\\3\end{pmatrix}\)`, L`\(\begin{pmatrix}2\\1\end{pmatrix}\)`, L`\(\begin{pmatrix}3\\2\end{pmatrix}\)`], why: L`\(1+2=3\) et \(0+1=1\).` },
    { q: L`Cette formule entraîne…`, o: [L`\(M_\B(u\circ v)=M_\B(u)M_\B(v)\)`, L`\(M_\B(u+v)=M_\B(u)M_\B(v)\)`, L`\(\det(u)=\mathrm{Tr}(u)\)`, L`\(A^2=A\)`], why: L`On applique \(Y=AX\) deux fois.` }
  ],
  erreurs: [
    { k: 1, bad: L`Par définition, on a \(u(e_i)=\sum_ja_{i,j}e_j\) pour tout \(i\).`, why: L`Ce sont les <b>colonnes</b> qui contiennent les images : \(u(e_j)=\sum_ia_{i,j}e_i\).` },
    { k: 2, bad: L`On a \(u(\vec x)=\sum_jx_je_j\) par définition des coordonnées.`, why: L`\(\sum_jx_je_j=\vec x\), pas \(u(\vec x)\). Il faut la linéarité : \(u(\vec x)=\sum_jx_ju(e_j)\).` },
    { k: 4, bad: L`Par linéarité de \(u\), \(y_i=\sum_ja_{i,j}x_j\), d'où \(Y=AX\).`, why: L`L'identification des coefficients vient de l'<b>unicité</b> de l'écriture dans \(\B\).` }
  ],
  errata: [],
  dia: 'c1q6', see: ['c1q3']
},
/* ---------- Q7 ---------- */
{
  id: 'c1q7', kind: 'demo', n: 7, label: 'Q7', color: 'aqua', domain: 'Matrices',
  title: 'Tr(AB) = Tr(BA)',
  statement: L`Montrer que pour tout \(A,B\in\M_n(\mathbb K)\), on a \(\mathrm{Tr}(AB)=\mathrm{Tr}(BA)\). Montrer que deux matrices semblables ont même trace.`,
  keys: ['trace', 'semblables'],
  skeleton: [
    L`\(C=AB\), \(D=BA\) : \(c_{i,j}=\sum_\ell a_{i,\ell}b_{\ell,j}\), \(d_{i,j}=\sum_\ell b_{i,\ell}a_{\ell,j}\).`,
    L`\(\mathrm{Tr}\,C=\sum_i\sum_\ell a_{i,\ell}b_{\ell,i}\).`,
    L`On permute les sommes : \(\sum_\ell\sum_ib_{\ell,i}a_{i,\ell}=\sum_\ell d_{\ell,\ell}=\mathrm{Tr}\,D\).`,
    L`Semblables : \(\mathrm{Tr}(P^{-1}AP)=\mathrm{Tr}(APP^{-1})=\mathrm{Tr}A\).`
  ],
  mnemo: { big: 'On échange i et ℓ', text: L`« Double somme, on échange l'ordre » : la même somme \(\sum a_{i,\ell}b_{\ell,i}\) se lit comme la trace de \(AB\) ou de \(BA\).` },
  pieges: [
    L`Écris bien la formule du produit avec un indice muet \(\ell\) : \(c_{i,j}=\sum_\ell a_{i,\ell}b_{\ell,j}\).`,
    L`Pour les matrices semblables, applique \(\mathrm{Tr}(XY)=\mathrm{Tr}(YX)\) avec \(X=P^{-1}\) et \(Y=AP\). Ne prétends pas que \(\mathrm{Tr}(ABC)=\mathrm{Tr}(BAC)\) en général.`,
    L`La permutation des sommes est licite parce que les sommes sont finies.`
  ],
  colleur: [
    { q: L`A-t-on \(\mathrm{Tr}(ABC)=\mathrm{Tr}(BAC)\) en général ?`, a: L`Non. On peut seulement permuter <b>circulairement</b> : \(\mathrm{Tr}(ABC)=\mathrm{Tr}(BCA)=\mathrm{Tr}(CAB)\).` },
    { q: L`A-t-on \(AB=BA\) ?`, a: L`Non en général ; seule l'égalité des traces est vraie.` },
    { q: L`Peut-on avoir \(AB-BA=I_n\) ?`, a: L`Non : la trace de gauche vaut \(0\), celle de droite vaut \(n\neq0\).` },
    { q: L`Pourquoi parle-t-on de la trace d'un endomorphisme ?`, a: L`Deux matrices d'un même endomorphisme sont semblables, donc ont même trace : la trace ne dépend pas de la base.` }
  ],
  steps: [
    { t: 'Les coefficients des produits', x: L`Soit \(C=AB\) et \(D=BA\). Pour \(1\leqslant i,j\leqslant n\), on a ⟦\(c_{i,j}=\sum_\ell a_{i,\ell}b_{\ell,j}\) et \(d_{i,j}=\sum_\ell b_{i,\ell}a_{\ell,j}\) ;; \(c_{i,j}=a_{i,j}b_{i,j}\) et \(d_{i,j}=b_{i,j}a_{i,j}\) ;; \(c_{i,j}=\sum_\ell a_{\ell,i}b_{j,\ell}\)⟧.`, why: L`Coefficient \((i,j)\) d'un produit : ligne \(i\) du premier fois colonne \(j\) du second.` },
    { t: 'La trace de AB', x: L`Ainsi ⟦\(\mathrm{Tr}(C)=\sum_ic_{i,i}=\sum_i\sum_\ell a_{i,\ell}b_{\ell,i}\) ;; \(\mathrm{Tr}(C)=\sum_ia_{i,i}b_{i,i}\) ;; \(\mathrm{Tr}(C)=\mathrm{Tr}(A)\mathrm{Tr}(B)\)⟧.`, why: L`On prend \(j=i\) dans la formule et on somme.` },
    { t: 'On permute les sommes', x: L`En ⟦permutant les sommations ;; développant ;; transposant⟧, on obtient \(\mathrm{Tr}(C)=\sum_\ell\sum_ia_{i,\ell}b_{\ell,i}=\sum_\ell\sum_ib_{\ell,i}a_{i,\ell}=\sum_\ell d_{\ell,\ell}=\mathrm{Tr}(D)\).`, why: L`\(\sum_ib_{\ell,i}a_{i,\ell}\) est exactement \(d_{\ell,\ell}\).` },
    { t: 'Matrices semblables', x: L`Enfin, si \(A\) et \(B\) sont semblables, il existe \(P\) inversible telle que ⟦\(B=P^{-1}AP\) ;; \(B=PA\) ;; \(B=A+P\)⟧. Ainsi \(\mathrm{Tr}(B)=\mathrm{Tr}(P^{-1}AP)=\mathrm{Tr}(APP^{-1})=\mathrm{Tr}(A)\).`, why: L`On applique \(\mathrm{Tr}(XY)=\mathrm{Tr}(YX)\) avec \(X=P^{-1}\) et \(Y=AP\).` }
  ],
  cards: [
    { q: L`Coefficient \((i,j)\) de \(AB\) ?`, a: L`\(\sum_\ell a_{i,\ell}b_{\ell,j}\).` },
    { q: L`Idée de la preuve de \(\mathrm{Tr}(AB)=\mathrm{Tr}(BA)\) ?`, a: L`\(\mathrm{Tr}(AB)=\sum_i\sum_\ell a_{i,\ell}b_{\ell,i}\) ; on échange l'ordre des sommes et on reconnaît \(\mathrm{Tr}(BA)\).` },
    { q: L`Pourquoi deux matrices semblables ont-elles même trace ?`, a: L`\(\mathrm{Tr}(P^{-1}AP)=\mathrm{Tr}(APP^{-1})=\mathrm{Tr}(A)\).` }
  ],
  qcm: [
    { q: L`\(\mathrm{Tr}(AB)\) vaut…`, o: [L`\(\sum_i\sum_\ell a_{i,\ell}b_{\ell,i}\)`, L`\(\sum_ia_{i,i}b_{i,i}\)`, L`\(\mathrm{Tr}A\cdot\mathrm{Tr}B\)`, L`\(\sum_{i,\ell}a_{i,\ell}b_{i,\ell}\)`], why: L`Trace du produit : on somme les coefficients diagonaux \(c_{i,i}\).` },
    { q: L`Pour \(B=P^{-1}AP\), on applique \(\mathrm{Tr}(XY)=\mathrm{Tr}(YX)\) avec…`, o: [L`\(X=P^{-1}\), \(Y=AP\)`, L`\(X=A\), \(Y=P\)`, L`\(X=P\), \(Y=P^{-1}\)`, L`\(X=B\), \(Y=A\)`], why: L`\(\mathrm{Tr}(P^{-1}\cdot AP)=\mathrm{Tr}(AP\cdot P^{-1})\).` },
    { q: L`Peut-on avoir \(AB-BA=I_2\) ?`, o: [L`Non, les traces valent \(0\) et \(2\)`, L`Oui, toujours`, L`Oui si \(A\) est inversible`, L`Oui si \(A=B\)`], why: L`\(\mathrm{Tr}(AB-BA)=0\neq2\).` },
    { q: L`\(\mathrm{Tr}(ABC)\) est toujours égale à…`, o: [L`\(\mathrm{Tr}(CAB)\)`, L`\(\mathrm{Tr}(BAC)\)`, L`\(\mathrm{Tr}(ACB)\)`, L`\(\mathrm{Tr}(A)\mathrm{Tr}(BC)\)`], why: L`Seules les permutations circulaires conservent la trace.` }
  ],

{
  id: 'c1q8', kind: 'demo', n: 8, label: 'Q8', color: 'lilac', domain: 'Espaces préhilbertiens',
  title: 'Inégalité de Cauchy-Schwarz',
  statement: L`Soit \(E\) un espace préhilbertien réel. Énoncer et démontrer l'inégalité de Cauchy-Schwarz.`,
  keys: ['prod-scal', 'discriminant'],
  skeleton: [
    L`Énoncé : \(|\langle\vec x,\vec y\rangle|\leqslant\|\vec x\|\,\|\vec y\|\).`,
    L`Cas trivial si un vecteur est nul. Sinon, \(\|\vec x+t\vec y\|^2\geqslant0\) pour tout \(t\in\R\).`,
    L`On développe : trinôme \(\|\vec y\|^2t^2+2\langle\vec x,\vec y\rangle t+\|\vec x\|^2\geqslant0\).`,
    L`Toujours positif avec \(A\gt0\) ⇒ \(\Delta\leqslant0\) ⇒ l'inégalité.`
  ],
  mnemo: { big: 'Δ ≤ 0', text: L`« Une parabole qui ne descend jamais sous l'axe a un discriminant négatif » : on applique ça à \(t\mapsto\|\vec x+t\vec y\|^2\).` },
  pieges: [
    L`Il faut \(A=\|\vec y\|^2\gt0\), donc \(\vec y\neq\vec0\) : c'est pourquoi on traite à part le cas d'un vecteur nul.`,
    L`Justifie \(\Delta\leqslant0\) : si \(\Delta\gt0\), le trinôme serait strictement négatif entre ses deux racines. Le prof veut cet argument, pas juste « \(\Delta\leqslant0\) ».`,
    L`Le développement de \(\|\vec x+t\vec y\|^2\) utilise la bilinéarité et la symétrie : \(\langle\vec x,\vec y\rangle=\langle\vec y,\vec x\rangle\).`
  ],
  colleur: [
    { q: L`Développe \(\|\vec x+t\vec y\|^2\).`, a: L`\(\langle\vec x+t\vec y,\vec x+t\vec y\rangle=\|\vec x\|^2+2t\langle\vec x,\vec y\rangle+t^2\|\vec y\|^2\) (bilinéarité et symétrie).` },
    { q: L`Cas d'égalité ?`, a: L`Égalité si et seulement si \(\vec x\) et \(\vec y\) sont colinéaires : \(\Delta=0\) donne une racine double \(t_0\) avec \(\vec x+t_0\vec y=\vec0\).` },
    { q: L`Que donne l'inégalité dans \(\R^n\) ?`, a: L`\(\left|\sum x_iy_i\right|\leqslant\sqrt{\sum x_i^2}\sqrt{\sum y_i^2}\).` },
    { q: L`Et dans \(\mathcal C^0([0,1],\R)\) ?`, a: L`\(\left|\int_0^1fg\right|\leqslant\sqrt{\int_0^1f^2}\sqrt{\int_0^1g^2}\).` },
    { q: L`Quelle conséquence importante ?`, a: L`L'inégalité triangulaire \(\|\vec x+\vec y\|\leqslant\|\vec x\|+\|\vec y\|\) : \(\|\cdot\|\) est une norme.` }
  ],
  steps: [
    { t: 'Énoncé et cas trivial', x: L`Pour tout \(\vec x,\vec y\in E\), ⟦\(|\langle\vec x,\vec y\rangle|\leqslant\|\vec x\|\,\|\vec y\|\) ;; \(\langle\vec x,\vec y\rangle\geqslant\|\vec x\|\,\|\vec y\|\) ;; \(\|\vec x+\vec y\|\leqslant\|\vec x\|+\|\vec y\|\)⟧. Le résultat est immédiat si l'un des deux vecteurs est nul ; on les suppose désormais non nuls. Pour tout \(t\in\R\), \(\|\vec x+t\vec y\|^2\geqslant0\).`, why: L`Une norme au carré est positive : c'est la seule information qu'on exploite.` },
    { t: 'Le trinôme', x: L`Pour tout \(t\in\R\), on a ⟦\(\|\vec x+t\vec y\|^2=\|\vec y\|^2t^2+2\langle\vec x,\vec y\rangle t+\|\vec x\|^2\) ;; \(\|\vec x+t\vec y\|^2=\|\vec x\|^2+t^2\|\vec y\|^2\) ;; \(\|\vec x+t\vec y\|^2=(\|\vec x\|+t\|\vec y\|)^2\)⟧.`, why: L`Bilinéarité et symétrie du produit scalaire (formules de polarisation).` },
    { t: 'Un trinôme toujours positif', x: L`Posant \(A=\|\vec y\|^2\), \(B=2\langle\vec x,\vec y\rangle\) et \(C=\|\vec x\|^2\), on a \(A,B,C\in\R\), ⟦\(A\gt0\) ;; \(A=0\) ;; \(B\gt0\)⟧ et \(At^2+Bt+C\geqslant0\) pour tout \(t\in\R\).`, why: L`\(A\gt0\) car \(\vec y\neq\vec0\) et le produit scalaire est défini.` },
    { t: 'Le discriminant', x: L`Si l'on avait \(\Delta:=B^2-4AC\gt0\), le polynôme posséderait deux racines réelles \(r_1\lt r_2\), et comme \(A\gt0\), on aurait ⟦\(At^2+Bt+C\lt0\) pour \(t\in]r_1,r_2[\) ;; \(At^2+Bt+C\gt0\) partout ;; \(r_1=r_2\)⟧. Ceci est absurde, donc \(\Delta\leqslant0\).`, why: L`Un trinôme de coefficient dominant positif est négatif entre ses racines.` },
    { t: 'Conclusion', x: L`Donc ⟦\(4\langle\vec x,\vec y\rangle^2-4\|\vec x\|^2\|\vec y\|^2\leqslant0\) ;; \(4\langle\vec x,\vec y\rangle^2+4\|\vec x\|^2\|\vec y\|^2\leqslant0\) ;; \(\langle\vec x,\vec y\rangle\leqslant0\)⟧, ce qui implique bien \(|\langle\vec x,\vec y\rangle|\leqslant\|\vec x\|\,\|\vec y\|\).`, why: L`On divise par \(4\) et on prend la racine carrée (tout est positif).` }
  ],
  cards: [
    { q: L`Énoncé de Cauchy-Schwarz ?`, a: L`\(|\langle\vec x,\vec y\rangle|\leqslant\|\vec x\|\,\|\vec y\|\).` },
    { q: L`Quelle fonction de \(t\) étudie-t-on ?`, a: L`\(t\mapsto\|\vec x+t\vec y\|^2=\|\vec y\|^2t^2+2\langle\vec x,\vec y\rangle t+\|\vec x\|^2\geqslant0\).` },
    { q: L`Pourquoi \(\Delta\leqslant0\) ?`, a: L`Sinon, avec \(A\gt0\), le trinôme serait strictement négatif entre ses deux racines.` },
    { q: L`Cas d'égalité ?`, a: L`\(\vec x\) et \(\vec y\) colinéaires.` }
  ],
  qcm: [
    { q: L`Pourquoi suppose-t-on \(\vec y\neq\vec0\) ?`, o: [L`Pour avoir \(A=\|\vec y\|^2\gt0\), un vrai trinôme`, L`Pour que \(\langle\vec x,\vec y\rangle\neq0\)`, L`Pour diviser par \(\vec y\)`, L`Ce n'est pas nécessaire`], why: L`Si \(A=0\), ce n'est plus un polynôme du second degré.` },
    { q: L`Le développement de \(\|\vec x+t\vec y\|^2\) utilise…`, o: [L`la bilinéarité et la symétrie`, L`l'inégalité triangulaire`, L`Pythagore seulement`, L`la positivité seulement`], why: L`\(\langle\vec x+t\vec y,\vec x+t\vec y\rangle\) se développe par bilinéarité.` },
    { q: L`\(\Delta\) vaut…`, o: [L`\(4\langle\vec x,\vec y\rangle^2-4\|\vec x\|^2\|\vec y\|^2\)`, L`\(4\|\vec x\|^2\|\vec y\|^2-4\langle\vec x,\vec y\rangle^2\)`, L`\(\langle\vec x,\vec y\rangle^2\)`, L`\(\|\vec x+\vec y\|^2\)`], why: L`\(B^2-4AC\) avec \(B=2\langle\vec x,\vec y\rangle\).` },
    { q: L`Dans \(\R^2\), avec \(\vec x=(1,2)\) et \(\vec y=(3,1)\) :`, o: [L`\(5\leqslant\sqrt5\sqrt{10}\)`, L`\(5\leqslant5\)`, L`\(7\leqslant\sqrt{50}\) est faux`, L`\(5\geqslant\sqrt{50}\)`], why: L`\(\langle\vec x,\vec y\rangle=3+2=5\) et \(\sqrt{50}\approx7{,}07\).` }
  ],
  erreurs: [
    { k: 3, bad: L`Le trinôme \(At^2+Bt+C\) est positif, donc \(\Delta\geqslant0\).`, why: L`C'est l'inverse : un trinôme (avec \(A\gt0\)) toujours positif a au plus une racine, donc \(\Delta\leqslant0\).` },
    { k: 1, bad: L`Pour tout \(t\in\R\), on a \(\|\vec x+t\vec y\|^2=\|\vec x\|^2+t^2\|\vec y\|^2\).`, why: L`Il manque le double produit \(2t\langle\vec x,\vec y\rangle\) : c'est justement lui qui donne l'inégalité.` },
    { k: 2, bad: L`Posant \(A=\|\vec y\|^2\), \(B=2\langle\vec x,\vec y\rangle\), \(C=\|\vec x\|^2\), on a \(A\geqslant0\) et \(At^2+Bt+C\geqslant0\).`, why: L`Il faut \(A\) <b>strictement</b> positif (d'où \(\vec y\neq\vec0\)) pour raisonner sur les racines d'un trinôme.` }
  ],
  errata: [],

/* ---------- Q9 ---------- */
{
  id: 'c1q9', kind: 'demo', n: 9, label: 'Q9', color: 'sky', domain: 'Espaces préhilbertiens',
  title: 'E = F ⊕ F⊥ (F de dimension finie)',
  statement: L`Soit \(E\) un espace préhilbertien réel et \(F\) un sous-espace vectoriel de dimension finie. Montrer que \(E=F\oplus F^\perp\).`,
  keys: ['orthogonal', 'bon', 'somme-directe', 'prod-scal'],
  skeleton: [
    L`Base orthonormée \((f_1,\dots,f_n)\) de \(F\).`,
    L`\(\vec y=\sum\langle\vec x,f_i\rangle f_i\in F\) et \(\vec z=\vec x-\vec y\).`,
    L`\(\langle\vec z,f_j\rangle=0\) pour tout \(j\), donc \(\vec z\in F^\perp\) : \(E=F+F^\perp\).`,
    L`\(F\cap F^\perp=\{\vec0\}\) : \(\langle\vec x,\vec x\rangle=0\Rightarrow\vec x=\vec0\).`
  ],
  mnemo: { big: 'Projeter, puis vérifier', text: L`« On projette, le reste est orthogonal » : \(\vec y\) est la projection orthogonale de \(\vec x\) sur \(F\), \(\vec z\) est ce qui dépasse.` },
  pieges: [
    L`L'existence d'une base orthonormée de \(F\) vient de la dimension finie (Gram-Schmidt) : c'est là qu'elle sert.`,
    L`Pour montrer \(\vec z\in F^\perp\), il suffit de vérifier \(\langle\vec z,f_j\rangle=0\) sur une base de \(F\) (par linéarité). Dis-le.`,
    L`L'intersection nulle utilise le caractère <b>défini</b> du produit scalaire.`
  ],
  colleur: [
    { q: L`Pourquoi suffit-il de vérifier \(\langle\vec z,f_j\rangle=0\) pour tout \(j\) ?`, a: L`Tout \(\vec v\in F\) s'écrit \(\sum v_jf_j\), et \(\langle\vec z,\vec v\rangle=\sum v_j\langle\vec z,f_j\rangle=0\) par linéarité.` },
    { q: L`Que représente \(\vec y\) ?`, a: L`La projection orthogonale de \(\vec x\) sur \(F\) : c'est le point de \(F\) le plus proche de \(\vec x\).` },
    { q: L`Le résultat reste-t-il vrai si \(F\) est de dimension infinie ?`, a: L`Pas toujours : dans \(\mathcal C^0([0,1])\) avec \(\langle f,g\rangle=\int fg\), le sous-espace des polynômes a un orthogonal réduit à \(\{0\}\).` },
    { q: L`Que vaut \(\dim F^\perp\) si \(\dim E=N\) ?`, a: L`\(N-\dim F\), d'après la Q1 et \(E=F\oplus F^\perp\).` },
    { q: L`Pourquoi \(\langle f_i,f_j\rangle\) vaut \(1\) ou \(0\) ?`, a: L`La base est orthonormée : vecteurs unitaires, deux à deux orthogonaux.` }
  ],
  steps: [
    { t: 'Base orthonormée', x: L`Lorsque \(F=\{\vec0\}\), \(F^\perp=E\) et le résultat est immédiat. On suppose \(\dim F=n\geqslant1\). Le sous-espace \(F\) possède ⟦une base orthonormée \((f_1,\dots,f_n)\) ;; une base de vecteurs de norme \(2\) ;; une base de \(E\)⟧.`, why: L`Procédé de Gram-Schmidt, possible car \(F\) est de dimension finie.` },
    { t: 'La décomposition', x: L`Pour tout \(\vec x\in E\), on pose ⟦\(\vec y=\sum_i\langle\vec x,f_i\rangle f_i\) et \(\vec z=\vec x-\vec y\) ;; \(\vec y=\sum_if_i\) et \(\vec z=\vec x+\vec y\) ;; \(\vec y=\langle\vec x,\vec x\rangle f_1\) et \(\vec z=\vec0\)⟧. On a clairement \(\vec y\in F\).`, why: L`\(\vec y\) est une combinaison linéaire des \(f_i\) : c'est la projection orthogonale de \(\vec x\) sur \(F\).` },
    { t: 'z est orthogonal à F', x: L`Pour tout \(j\), ⟦\(\langle\vec z,f_j\rangle=\langle\vec x,f_j\rangle-\sum_i\langle\vec x,f_i\rangle\langle f_i,f_j\rangle=\langle\vec x,f_j\rangle-\langle\vec x,f_j\rangle=0\) ;; \(\langle\vec z,f_j\rangle=\langle\vec x,f_j\rangle\) ;; \(\langle\vec z,f_j\rangle=1\)⟧, car \(\langle f_i,f_j\rangle=1\) si \(i=j\) et \(0\) sinon.`, why: L`Linéarité à gauche du produit scalaire, puis orthonormalité : seul le terme \(i=j\) survit.` },
    { t: 'E = F + F⊥', x: L`Comme \(F=\mathrm{Vect}(f_1,\dots,f_n)\), on a donc ⟦\(\vec z\in F^\perp\) ;; \(\vec z\in F\) ;; \(\vec z=\vec0\)⟧, et ainsi \(\vec x=\vec y+\vec z\in F+F^\perp\).`, why: L`Être orthogonal à chaque vecteur d'une base de \(F\), c'est être orthogonal à \(F\) (linéarité).` },
    { t: 'Intersection nulle', x: L`Enfin, si \(\vec x\in F\cap F^\perp\), alors \(\langle\vec x,\vec x\rangle=0\), donc \(\vec x=\vec0\) car le produit scalaire est une forme ⟦définie ;; symétrique ;; bilinéaire⟧. Ainsi \(F\cap F^\perp=\{\vec0\}\) et \(E=F\oplus F^\perp\).`, why: L`\(\vec x\in F^\perp\) est orthogonal à tout vecteur de \(F\), en particulier à lui-même.` }
  ],
  cards: [
    { q: L`Comment décompose-t-on \(\vec x\) dans \(F\oplus F^\perp\) ?`, a: L`\(\vec y=\sum\langle\vec x,f_i\rangle f_i\in F\) et \(\vec z=\vec x-\vec y\in F^\perp\), avec \((f_i)\) base orthonormée de \(F\).` },
    { q: L`Pourquoi \(\vec z\in F^\perp\) ?`, a: L`\(\langle\vec z,f_j\rangle=\langle\vec x,f_j\rangle-\langle\vec x,f_j\rangle=0\) pour tout \(j\).` },
    { q: L`Pourquoi \(F\cap F^\perp=\{\vec0\}\) ?`, a: L`\(\langle\vec x,\vec x\rangle=0\) et le produit scalaire est défini.` },
    { q: L`Où sert la dimension finie de \(F\) ?`, a: L`Pour avoir une base orthonormée de \(F\) (Gram-Schmidt).` }
  ],
  qcm: [
    { q: L`\(\vec y=\sum\langle\vec x,f_i\rangle f_i\) est…`, o: [L`la projection orthogonale de \(\vec x\) sur \(F\)`, L`la norme de \(\vec x\)`, L`un vecteur de \(F^\perp\)`, L`toujours nul`], why: L`C'est la formule de la projection sur un sous-espace muni d'une base orthonormée.` },
    { q: L`Quelle propriété du produit scalaire donne \(F\cap F^\perp=\{\vec0\}\) ?`, o: [L`Il est défini`, L`Il est symétrique`, L`Il est bilinéaire`, L`Il est continu`], why: L`\(\langle\vec x,\vec x\rangle=0\Rightarrow\vec x=\vec0\).` },
    { q: L`Pour montrer \(\vec z\in F^\perp\), il suffit de tester…`, o: [L`\(\langle\vec z,f_j\rangle=0\) pour une base de \(F\)`, L`\(\langle\vec z,\vec z\rangle=0\)`, L`\(\langle\vec z,\vec x\rangle=0\)`, L`\(\|\vec z\|=1\)`], why: L`Par linéarité, l'orthogonalité à une base entraîne l'orthogonalité à \(F\).` },
    { q: L`Dans \(\R^3\), si \(F\) est un plan, \(F^\perp\) est…`, o: [L`une droite (la normale au plan)`, L`un plan`, L`\(\{\vec0\}\)`, L`\(\R^3\)`], why: L`\(\dim F^\perp=3-2=1\).` }
  ],
  erreurs: [
    { k: 2, bad: L`Pour tout \(j\), \(\langle\vec z,f_j\rangle=\langle\vec x,f_j\rangle-\sum_i\langle\vec x,f_i\rangle=0\).`, why: L`On a oublié les facteurs \(\langle f_i,f_j\rangle\) : c'est l'orthonormalité qui fait que seul le terme \(i=j\) reste.` },
    { k: 4, bad: L`Si \(\vec x\in F\cap F^\perp\), alors \(\langle\vec x,\vec x\rangle=0\), donc \(\vec x=\vec0\) car le produit scalaire est symétrique.`, why: L`C'est le caractère <b>défini</b> qui donne \(\langle\vec x,\vec x\rangle=0\Rightarrow\vec x=\vec0\).` },
    { k: 1, bad: L`Pour tout \(\vec x\in E\), on pose \(\vec y=\sum_if_i\) et \(\vec z=\vec x-\vec y\).`, why: L`\(\vec y\) doit dépendre de \(\vec x\) : c'est sa projection \(\sum_i\langle\vec x,f_i\rangle f_i\).` }
  ],
  errata: [],
  dia: 'c1q9', see: ['c1q8', 'c1q1']
}
];

    { t: 'L’encadrement', x: L`Pour \(n\geqslant n_0\), par décroissance de \(f\) et par positivité de l'intégrale, on a ⟦\(\int_n^{n+1}f(t)\,dt\leqslant f(n)\leqslant\int_{n-1}^nf(t)\,dt\) ;; \(\int_{n-1}^nf(t)\,dt\leqslant f(n)\leqslant\int_n^{n+1}f(t)\,dt\) ;; \(f(n)\leqslant\int_n^{n+1}f(t)\,dt\)⟧.`, why: L`Sur \([n,n+1]\), \(f(t)\leqslant f(n)\) ; sur \([n-1,n]\), \(f(t)\geqslant f(n)\). On intègre sur des intervalles de longueur \(1\).` },
    { t: 'On somme les inégalités', x: L`On en déduit pour tout \(N\geqslant n_0\) : ⟦\(\int_{n_0}^{N+1}f=\sum_{n=n_0}^N\int_n^{n+1}f\leqslant\sum_{n=n_0}^Nf(n)\) ;; \(\sum_{n=n_0}^Nf(n)\leqslant\int_{n_0}^{N+1}f\) ;; \(\int_{n_0}^{N+1}f=\sum_{n=n_0}^Nf(n)\)⟧, et pour tout \(N\geqslant n_0+1\) : \(\sum_{n=n_0+1}^Nf(n)\leqslant\sum_{n=n_0+1}^N\int_{n-1}^nf=\int_{n_0}^Nf\).`, why: L`Relation de Chasles : les intégrales sur \([n,n+1]\) mises bout à bout donnent l'intégrale sur \([n_0,N+1]\).` },
    { t: 'Si l’intégrale converge', x: L`Supposons que \(\int_{n_0}^{+\infty}f\) converge. Alors pour tout \(N\geqslant n_0+1\) : \(\sum_{n=n_0}^Nf(n)=f(n_0)+\sum_{n=n_0+1}^Nf(n)\leqslant f(n_0)+\int_{n_0}^Nf\leqslant f(n_0)+\int_{n_0}^{+\infty}f\), donc \(N\mapsto\sum_{n=n_0}^Nf(n)\) est ⟦croissante majorée ;; décroissante minorée ;; bornée et alternée⟧ : la série converge.`, why: L`\(f\geqslant0\) donc les sommes partielles croissent ; une suite croissante majorée converge.` },
    { t: 'Si l’intégrale diverge', x: L`Supposons maintenant que \(\int_{n_0}^{+\infty}f\) diverge. Comme ⟦\(f\) est positive ;; \(f\) est décroissante ;; \(f\) est continue⟧, cela implique \(\lim\limits_{N\to+\infty}\int_{n_0}^{N+1}f=+\infty\). Comme \(\int_{n_0}^{N+1}f\leqslant\sum_{n=n_0}^Nf(n)\), le théorème des gendarmes donne \(\sum_{n=n_0}^Nf(n)\to+\infty\) : la série diverge.`, why: L`Pour \(f\geqslant0\), \(X\mapsto\int_{n_0}^Xf\) est croissante : si elle n'a pas de limite finie, elle tend vers \(+\infty\).` }
  ],
  cards: [
    { q: L`Quel encadrement est au cœur de la comparaison série-intégrale ?`, a: L`\(\int_n^{n+1}f\leqslant f(n)\leqslant\int_{n-1}^nf\) pour \(n\geqslant n_0\), par décroissance de \(f\).` },
    { q: L`Pourquoi choisir \(n_0\geqslant a+1\) ?`, a: L`Pour que \(\int_{n-1}^nf\) soit définie (\(n-1\geqslant a\)) pour tout \(n\geqslant n_0\).` },
    { q: L`Comment conclut-on quand l'intégrale converge ?`, a: L`Les sommes partielles sont croissantes (\(f\geqslant0\)) et majorées par \(f(n_0)+\int_{n_0}^{+\infty}f\) : elles convergent.` },
    { q: L`Comment conclut-on quand l'intégrale diverge ?`, a: L`\(\int_{n_0}^{N+1}f\to+\infty\) (car \(f\geqslant0\)) et minore \(\sum_{n_0}^Nf(n)\) : la série diverge.` }
  ],
  qcm: [
    { q: L`Quelle hypothèse donne \(\int_n^{n+1}f\leqslant f(n)\) ?`, o: [L`\(f\) décroissante`, L`\(f\) positive`, L`\(f\) continue`, L`\(a\geqslant1\)`], why: L`Sur \([n,n+1]\), \(f(t)\leqslant f(n)\) parce que \(f\) décroît.` },
    { q: L`Pourquoi \(n_0\geqslant a+1\) ?`, o: [L`Pour que \(\int_{n-1}^nf\) soit définie pour \(n\geqslant n_0\)`, L`Pour que \(f(n_0)\gt0\)`, L`Pour que la série converge`, L`Pour appliquer Riemann`], why: L`\(f\) est définie sur \([a,+\infty[\) : il faut \(n-1\geqslant a\).` },
    { q: L`Que permet de dire la comparaison série-intégrale sur \(\sum_{n\geqslant2}\frac1{n\ln n}\) ?`, o: [L`Elle diverge, car \(\int_2^X\frac{dt}{t\ln t}=\ln\ln X-\ln\ln2\to+\infty\)`, L`Elle converge, car \(\frac1{n\ln n}\to0\)`, L`Elle converge par Riemann`, L`On ne peut pas l'appliquer`], why: L`\(t\mapsto\frac1{t\ln t}\) est positive décroissante sur \([2,+\infty[\), de primitive \(\ln(\ln t)\).` },
    { q: L`Dans le cas convergent, de quel type est la suite des sommes partielles ?`, o: [L`Croissante et majorée`, L`Décroissante et minorée`, L`Alternée`, L`Constante à partir d'un rang`], why: L`\(f(n)\geqslant0\) et \(\sum_{n_0}^Nf(n)\leqslant f(n_0)+\int_{n_0}^{+\infty}f\).` }
  ],
  erreurs: [
    { k: 1, bad: L`Pour \(n\geqslant n_0\), par décroissance de \(f\), on a \(\int_{n-1}^nf(t)\,dt\leqslant f(n)\leqslant\int_n^{n+1}f(t)\,dt\).`, why: L`C'est l'inverse : \(f\) décroît, donc sur \([n,n+1]\) elle est <b>sous</b> \(f(n)\), et sur \([n-1,n]\) elle est <b>au-dessus</b>.` },
    { k: 4, bad: L`Supposons que \(\int_{n_0}^{+\infty}f\) diverge. Comme \(\sum_{n=n_0}^Nf(n)\leqslant f(n_0)+\int_{n_0}^Nf\), la série diverge.`, why: L`Une majoration par une quantité qui tend vers \(+\infty\) ne prouve rien. Il faut la <b>minoration</b> \(\int_{n_0}^{N+1}f\leqslant\sum_{n_0}^Nf(n)\).` },
    { k: 0, bad: L`Soit \(n_0\in\N\) fixé tel que \(n_0\geqslant a\). Les séries \(\sum_{n\geqslant a}f(n)\) et \(\sum_{n\geqslant n_0}f(n)\) sont de même nature.`, why: L`Avec seulement \(n_0\geqslant a\), l'intégrale \(\int_{n_0-1}^{n_0}f\) peut sortir de \([a,+\infty[\). Il faut \(n_0\geqslant a+1\).` }
  ],

/* ---------- Q3 : Stirling ---------- */
{
  id: 'c3q3', kind: 'demo', n: 3, label: 'Q3', color: 'mint', domain: 'Calcul asymptotique',
  title: 'Formule de Stirling (avec une constante)',
  statement: L`Montrer qu'il existe \(C_0\gt0\) tel que \(n!\sim C_0\,n^ne^{-n}\sqrt n\) lorsque \(n\to+\infty\).`,
  keys: ['dl-ln', 'telescopique', 'riemann-serie', 'equivalent'],
  skeleton: [
    L`On pose \(A_n:=\frac{n^{n+1/2}e^{-n}}{n!}\) et on calcule \(\ln\frac{A_{n+1}}{A_n}=\left(n+\frac12\right)\ln\left(1+\frac1n\right)-1\).`,
    L`DL de \(\ln(1+x)\) à l'ordre 3 : \(\ln\frac{A_{n+1}}{A_n}\sim\frac1{12n^2}\).`,
    L`Riemann : la série \(\sum\ln\frac{A_{n+1}}{A_n}\) converge.`,
    L`Télescopage : \(\ln A_N\to L\), donc \(A_n\to e^L\) et \(C_0=e^{-L}\).`
  ],
  mnemo: { big: '1 / 12n²', text: L`« Un douzième sur n au carré » : c'est tout ce qui reste du DL, et c'est sommable. Le reste, c'est un télescope.` },
  pieges: [
    L`Le DL doit aller jusqu'à l'ordre 3 en \(x=\frac1n\) : multiplié par \(n\), un \(o(x^2)\) ne suffirait pas à obtenir le terme en \(\frac1{n^2}\).`,
    L`Le critère de Riemann s'applique parce que \(\ln\frac{A_{n+1}}{A_n}\sim\frac1{12n^2}\) est de signe constant (positif) pour \(n\) grand : précise-le.`,
    L`Ne confonds pas « la série \(\sum\ln\frac{A_{n+1}}{A_n}\) converge » et « la suite \(\ln A_n\) converge » : c'est le télescopage qui fait le lien.`
  ],
  colleur: [
    { q: L`Calcule \(\frac{A_{n+1}}{A_n}\).`, a: L`\(\frac{A_{n+1}}{A_n}=\frac{(n+1)^{n+3/2}e^{-n-1}\,n!}{(n+1)!\,n^{n+1/2}e^{-n}}=\left(1+\frac1n\right)^{n+1/2}e^{-1}\), d'où le logarithme \(\left(n+\frac12\right)\ln\left(1+\frac1n\right)-1\).` },
    { q: L`Pourquoi aller à l'ordre 3 dans le DL ?`, a: L`On multiplie par \(n+\frac12\) : les termes en \(\frac1n\) et les constantes se simplifient, et il faut connaître exactement le terme en \(\frac1{n^2}\). Avec l'ordre 2, il resterait un \(o\!\left(\frac1n\right)\) inutilisable.` },
    { q: L`Que vaut \(C_0\) ?`, a: L`\(C_0=\sqrt{2\pi}\) (formule de Stirling complète). La démo ne le donne pas : on l'obtient avec les intégrales de Wallis.` },
    { q: L`Pourquoi \(C_0\gt0\) ?`, a: L`\(C_0=e^{-L}\) avec \(L\in\R\) fini : une exponentielle est strictement positive.` },
    { q: L`Comment passe-t-on de \(A_n\to e^L\) à l'équivalent de \(n!\) ?`, a: L`\(n!=\frac{n^{n+1/2}e^{-n}}{A_n}\) et \(\frac1{A_n}\to e^{-L}=C_0\neq0\), donc \(n!\sim C_0n^ne^{-n}\sqrt n\).` },
    { q: L`Le critère de Riemann marche-t-il avec un équivalent négatif ?`, a: L`Oui si le signe est constant : on applique le critère à \(-u_n\). Ici \(\frac1{12n^2}\gt0\), donc les termes sont positifs à partir d'un rang.` }
  ],
  steps: [
    { t: 'La suite auxiliaire', x: L`On pose ⟦\(A_n:=\frac{n^{n+1/2}e^{-n}}{n!}\) ;; \(A_n:=\frac{n!}{n^ne^{-n}}\) ;; \(A_n:=n!\,e^n\)⟧ pour tout \(n\geqslant1\). On a alors \(\ln\frac{A_{n+1}}{A_n}=\) ⟦\(\left(n+\frac12\right)\ln\left(1+\frac1n\right)-1\) ;; \(n\ln\left(1+\frac1n\right)\) ;; \(\ln(n+1)-1\)⟧ pour tout \(n\geqslant1\).`, why: L`\(\frac{A_{n+1}}{A_n}=\left(\frac{n+1}n\right)^{n+1/2}e^{-1}\) : les factorielles se simplifient en \(\frac{n!}{(n+1)!}=\frac1{n+1}\), qui mange une puissance de \(n+1\).` },
    { t: 'Le développement limité', x: L`En effectuant un DL de \(\ln(1+x)\) en \(x=0\) à ⟦l'ordre 3 ;; l'ordre 1 ;; l'ordre 2⟧, \(\ln(1+x)=x-\frac{x^2}2+\frac{x^3}3+o(x^3)\), on obtient \(\ln\frac{A_{n+1}}{A_n}=\left(n+\frac12\right)\left(\frac1n-\frac1{2n^2}+\frac1{3n^3}+o\!\left(\frac1{n^3}\right)\right)-1\).`, why: L`On remplace \(x\) par \(\frac1n\to0\).` },
    { t: 'Ce qui reste : 1/(12n²)', x: L`En développant, les constantes et les termes en \(\frac1n\) se simplifient et ⟦\(\ln\frac{A_{n+1}}{A_n}=\frac1{12n^2}+\frac1{6n^3}+o\!\left(\frac1{n^2}\right)\sim\frac1{12n^2}\) ;; \(\ln\frac{A_{n+1}}{A_n}\sim\frac1{2n}\) ;; \(\ln\frac{A_{n+1}}{A_n}\to\frac1{12}\)⟧.`, why: L`\(n\cdot\left(\frac1n-\frac1{2n^2}+\frac1{3n^3}\right)=1-\frac1{2n}+\frac1{3n^2}\) et \(\frac12\left(\frac1n-\frac1{2n^2}\right)=\frac1{2n}-\frac1{4n^2}\) : il reste \(\frac13-\frac14=\frac1{12}\) devant \(\frac1{n^2}\).` },
    { t: 'Convergence de la série', x: L`D'après ⟦le critère de Riemann ;; la règle de Cauchy ;; le critère des séries alternées⟧, la série \(\sum_{n\geqslant1}\ln\frac{A_{n+1}}{A_n}\) converge.`, why: L`Terme général positif à partir d'un rang, équivalent à \(\frac1{12n^2}\) : même nature que \(\sum\frac1{n^2}\), convergente (\(2\gt1\)).` },
    { t: 'Le télescopage', x: L`Pour tout \(N\geqslant2\), on a \(\ln A_1+\sum_{n=1}^{N-1}\ln\frac{A_{n+1}}{A_n}=\ln A_1+\sum_{n=1}^{N-1}(\ln A_{n+1}-\ln A_n)=\) ⟦\(\ln A_N\) ;; \(\ln A_1\) ;; \(\ln(N!)\)⟧ (somme télescopique). En posant \(L:=\ln A_1+\sum_{n=1}^{+\infty}\ln\frac{A_{n+1}}{A_n}\in\R\), on a \(\lim\limits_{n\to+\infty}\ln A_n=L\).`, why: L`Dans la somme, chaque \(\ln A_k\) intermédiaire apparaît une fois avec \(+\) et une fois avec \(-\).` },
    { t: 'Conclusion', x: L`Par composition avec l'exponentielle, \(\lim A_n=e^L\). En posant ⟦\(C_0=e^{-L}\) ;; \(C_0=L\) ;; \(C_0=e^L\)⟧, on a bien \(C_0\gt0\) et \(n!\sim C_0\,n^ne^{-n}\sqrt n\) lorsque \(n\to+\infty\).`, why: L`\(n!=\frac{n^{n+1/2}e^{-n}}{A_n}\) et \(\frac1{A_n}\to e^{-L}\) : la limite est finie et non nulle, d'où l'équivalent.` }
  ],
  cards: [
    { q: L`Quelle suite auxiliaire introduit-on pour Stirling ?`, a: L`\(A_n=\frac{n^{n+1/2}e^{-n}}{n!}\).` },
    { q: L`Que vaut \(\ln\frac{A_{n+1}}{A_n}\) ?`, a: L`\(\left(n+\frac12\right)\ln\left(1+\frac1n\right)-1\sim\frac1{12n^2}\).` },
    { q: L`Pourquoi la série \(\sum\ln\frac{A_{n+1}}{A_n}\) converge-t-elle ?`, a: L`Critère de Riemann : terme général équivalent à \(\frac1{12n^2}\), positif.` },
    { q: L`Comment passe-t-on de la série à la suite \(\ln A_n\) ?`, a: L`Télescopage : \(\ln A_1+\sum_{n=1}^{N-1}\ln\frac{A_{n+1}}{A_n}=\ln A_N\).` },
    { q: L`Que vaut \(C_0\) en fonction de \(L=\lim\ln A_n\) ?`, a: L`\(C_0=e^{-L}\gt0\) (et en fait \(C_0=\sqrt{2\pi}\)).` }
  ],
  qcm: [
    { q: L`Quel est l'équivalent de \(\ln\frac{A_{n+1}}{A_n}\) ?`, o: [L`\(\frac1{12n^2}\)`, L`\(\frac1{2n}\)`, L`\(\frac1{6n^3}\)`, L`\(\frac1{12n}\)`], why: L`Les termes d'ordre \(0\) et \(1\) en \(\frac1n\) se simplifient ; il reste \(\left(\frac13-\frac14\right)\frac1{n^2}\).` },
    { q: L`À quel ordre faut-il développer \(\ln(1+x)\) ?`, o: [L`À l'ordre 3`, L`À l'ordre 1`, L`À l'ordre 2`, L`À l'ordre 5`], why: L`On multiplie par \(n\) : pour connaître le terme en \(\frac1{n^2}\), il faut le terme en \(x^3\).` },
    { q: L`Quel outil transforme la convergence de la série en convergence de \(\ln A_n\) ?`, o: [L`La somme télescopique`, L`Le critère de comparaison`, L`Le théorème des gendarmes`, L`Les suites adjacentes`], why: L`\(\sum_{n=1}^{N-1}(\ln A_{n+1}-\ln A_n)=\ln A_N-\ln A_1\).` },
    { q: L`Que vaut \(C_0\) en réalité ?`, o: [L`\(\sqrt{2\pi}\)`, L`\(e\)`, L`\(1\)`, L`\(\pi\)`], why: L`C'est la formule de Stirling complète : \(n!\sim\sqrt{2\pi n}\left(\frac ne\right)^n\).` }
  ],
  erreurs: [
    { k: 1, bad: L`En effectuant un DL de \(\ln(1+x)\) à l'ordre 1, \(\ln(1+x)=x+o(x)\), on obtient \(\ln\frac{A_{n+1}}{A_n}=\left(n+\frac12\right)\left(\frac1n+o\!\left(\frac1n\right)\right)-1\).`, why: L`À l'ordre 1, il reste \(\frac1{2n}+o(1)\) : le terme \(o(1)\) empêche toute conclusion. Il faut l'<b>ordre 3</b> pour isoler \(\frac1{12n^2}\).` },
    { k: 4, bad: L`Comme la série \(\sum\ln\frac{A_{n+1}}{A_n}\) converge, son terme général tend vers \(0\), donc \(\ln A_n\) converge.`, why: L`\(\ln\frac{A_{n+1}}{A_n}\to0\) dit seulement que deux termes consécutifs se rapprochent (comme pour \(\ln n\)). C'est le <b>télescopage</b> qui donne la convergence de \(\ln A_n\).` },
    { k: 5, bad: L`Par composition avec l'exponentielle, \(\lim A_n=e^L\). En posant \(C_0=e^L\), on a \(n!\sim C_0\,n^ne^{-n}\sqrt n\).`, why: L`\(n!=\frac{n^{n+1/2}e^{-n}}{A_n}\) : c'est l'<b>inverse</b> de la limite, \(C_0=e^{-L}\).` }
  ],
  errata: [],
  dia: 'c3q3', see: ['c3q7']
},
/* ---------- Q4 : critère de Riemann (intégrales sur [1,+∞[) ---------- */
{
  id: 'c3q4', kind: 'demo', n: 4, label: 'Q4', color: 'pink', domain: 'Intégrales généralisées',
  title: 'Critère de Riemann pour les intégrales',
  statement: L`Soit \(f\) localement Riemann intégrable sur \([1,+\infty[\) telle que \(f(t)\sim\frac1{t^\alpha}\) quand \(t\to+\infty\). Alors \(\int_1^{+\infty}f(t)\,dt\) converge si \(\alpha\gt1\) et diverge si \(\alpha\leqslant1\).`,
  keys: ['riemann-int', 'equivalent', 'comparaison', 'integrale-gen'],
  skeleton: [
    L`Calcul direct : \(\int_A^{+\infty}\frac{dt}{t^\alpha}\) converge si et seulement si \(\alpha\gt1\).`,
    L`\(t^\alpha f(t)\to1\) : il existe \(A\) avec \(\frac1{2t^\alpha}\leqslant f(t)\leqslant\frac2{t^\alpha}\) sur \([A,+\infty[\).`,
    L`\(\alpha\gt1\) : majoration, comparaison. \(\alpha\leqslant1\) : minoration, comparaison.`,
    L`\(\int_1^Af\) est ordinaire : même nature que \(\int_A^{+\infty}f\).`
  ],
  mnemo: { big: '½ · 1 · 2', text: L`« Entre la moitié et le double » : quand \(t^\alpha f(t)\to1\), on coince \(t^\alpha f(t)\) entre \(\frac12\) et \(2\), puis on compare dans un sens ou dans l'autre.` },
  pieges: [
    L`L'encadrement \(\frac1{2t^\alpha}\leqslant f(t)\leqslant\frac2{t^\alpha}\) n'est vrai qu'à partir d'un certain \(A\) : d'où le découpage \(\int_1^A+\int_A^{+\infty}\).`,
    L`Le théorème de comparaison demande une fonction <b>positive</b> : l'encadrement montre justement que \(f\geqslant0\) sur \([A,+\infty[\). Signale-le.`,
    L`Sache refaire le calcul direct : primitive \(\frac{t^{1-\alpha}}{1-\alpha}\) pour \(\alpha\neq1\), et \(\ln t\) pour \(\alpha=1\).`
  ],
  colleur: [
    { q: L`Fais le calcul direct de \(\int_A^X\frac{dt}{t^\alpha}\).`, a: L`Pour \(\alpha\neq1\) : \(\frac{X^{1-\alpha}-A^{1-\alpha}}{1-\alpha}\), qui a une limite finie si et seulement si \(1-\alpha\lt0\), soit \(\alpha\gt1\). Pour \(\alpha=1\) : \(\ln X-\ln A\to+\infty\).` },
    { q: L`Pourquoi existe-t-il \(A\) tel que \(\frac1{2t^\alpha}\leqslant f(t)\leqslant\frac2{t^\alpha}\) ?`, a: L`\(t^\alpha f(t)\to1\) ; avec \(\varepsilon=\frac12\), à partir d'un \(A\) on a \(\frac12\leqslant t^\alpha f(t)\leqslant\frac32\leqslant2\).` },
    { q: L`Et si \(f(t)\sim\frac{c}{t^\alpha}\) avec \(c\gt0\) ?`, a: L`Même conclusion : \(\frac fc\sim\frac1{t^\alpha}\), et multiplier par \(c\gt0\) ne change pas la nature.` },
    { q: L`Que dire de \(\int_1^{+\infty}\frac{\sin^2 t}{t^2}dt\) ?`, a: L`Pas d'équivalent simple, mais \(0\leqslant\frac{\sin^2t}{t^2}\leqslant\frac1{t^2}\) : converge par comparaison directe.` },
    { q: L`Pourquoi \(\int_1^Af\) converge-t-elle ?`, a: L`\(f\) est localement Riemann intégrable : sur le segment \([1,A]\), c'est une intégrale de Riemann ordinaire.` }
  ],
  steps: [
    { t: 'Le calcul de référence', x: L`Un calcul direct de primitive montre que pour tout \(A\geqslant1\) fixé, l'intégrale \(\int_A^{+\infty}\frac{dt}{t^\alpha}\) converge si et seulement si ⟦\(\alpha\gt1\) ;; \(\alpha\geqslant1\) ;; \(\alpha\lt1\)⟧.`, why: L`Primitive \(\frac{t^{1-\alpha}}{1-\alpha}\) (\(\alpha\neq1\)) : limite finie en \(+\infty\) seulement si \(1-\alpha\lt0\). Pour \(\alpha=1\), \(\ln t\to+\infty\).` },
    { t: 'Encadrement à partir de A', x: L`Comme \(f(t)\sim\frac1{t^\alpha}\), on a \(\lim\limits_{t\to+\infty}t^\alpha f(t)=1\), donc il existe \(A\geqslant1\) tel que ⟦\(\frac1{2t^\alpha}\leqslant f(t)\leqslant\frac2{t^\alpha}\) ;; \(f(t)=\frac1{t^\alpha}\) ;; \(f(t)\leqslant\frac1{t^\alpha}\)⟧ pour tout \(t\in[A,+\infty[\). En particulier, \(f\) est ⟦positive ;; décroissante ;; continue⟧ sur \([A,+\infty[\).`, why: L`Définition de la limite avec \(\varepsilon=\frac12\) : \(t^\alpha f(t)\in\left[\frac12,\frac32\right]\subset\left[\frac12,2\right]\) pour \(t\) assez grand.` },
    { t: 'Cas α > 1', x: L`Si \(\alpha\gt1\), alors \(\int_A^{+\infty}\frac{dt}{t^\alpha}\) converge et comme ⟦\(0\leqslant f(t)\leqslant\frac2{t^\alpha}\) ;; \(f(t)\geqslant\frac1{2t^\alpha}\) ;; \(f(t)\to0\)⟧ pour tout \(t\geqslant A\), on en déduit par théorème de comparaison que \(\int_A^{+\infty}f\) converge.`, why: L`On majore une fonction positive par une fonction d'intégrale convergente.` },
    { t: 'Cas α ≤ 1', x: L`Si maintenant \(\alpha\leqslant1\), alors \(\int_A^{+\infty}\frac{dt}{t^\alpha}\) diverge, et comme ⟦\(f(t)\geqslant\frac1{2t^\alpha}\) ;; \(f(t)\leqslant\frac2{t^\alpha}\) ;; \(f(t)\geqslant0\)⟧ pour tout \(t\geqslant A\), alors par théorème de comparaison \(\int_A^{+\infty}f\) diverge.`, why: L`On minore par une fonction positive d'intégrale divergente.` },
    { t: 'Recoller [1, A]', x: L`On conclut en remarquant que \(\int_1^Af(t)\,dt\) est ⟦une intégrale de Riemann ordinaire, donc convergente ;; une intégrale généralisée divergente ;; nulle⟧ : \(\int_1^{+\infty}f\) a la même nature que \(\int_A^{+\infty}f\).`, why: L`\(f\) localement Riemann intégrable : elle est intégrable sur le segment \([1,A]\).` }
  ],
  cards: [
    { q: L`Énonce le critère de Riemann pour les intégrales sur \([1,+\infty[\).`, a: L`Si \(f(t)\sim\frac1{t^\alpha}\), \(\int_1^{+\infty}f\) converge si \(\alpha\gt1\) et diverge si \(\alpha\leqslant1\).` },
    { q: L`Quel encadrement tire-t-on de \(t^\alpha f(t)\to1\) ?`, a: L`Il existe \(A\geqslant1\) tel que \(\frac1{2t^\alpha}\leqslant f(t)\leqslant\frac2{t^\alpha}\) pour \(t\geqslant A\).` },
    { q: L`Pourquoi peut-on appliquer le théorème de comparaison ?`, a: L`Parce que l'encadrement montre que \(f\geqslant0\) sur \([A,+\infty[\).` },
    { q: L`Que fait-on de \(\int_1^Af\) ?`, a: L`C'est une intégrale de Riemann ordinaire, donc convergente : elle ne change pas la nature.` }
  ],
  qcm: [
    { q: L`Nature de \(\int_1^{+\infty}\frac{t+1}{t^3+2}\,dt\) ?`, o: [L`Convergente : équivalent \(\frac1{t^2}\)`, L`Divergente : équivalent \(\frac1t\)`, L`Divergente : numérateur non borné`, L`On ne peut pas conclure`], why: L`\(\frac{t+1}{t^3+2}\sim\frac{t}{t^3}=\frac1{t^2}\), et \(2\gt1\).` },
    { q: L`Que vaut \(\int_1^X\frac{dt}t\) ?`, o: [L`\(\ln X\), qui tend vers \(+\infty\)`, L`\(1-\frac1X\)`, L`\(\frac{X^2}2\)`, L`\(\ln X\), qui tend vers \(1\)`], why: L`D'où la divergence pour \(\alpha=1\).` },
    { q: L`Dans la démo, à quoi sert la minoration \(f(t)\geqslant\frac1{2t^\alpha}\) ?`, o: [L`À prouver la divergence pour \(\alpha\leqslant1\)`, L`À prouver la convergence pour \(\alpha\gt1\)`, L`À montrer que \(f\) est intégrable sur \([1,A]\)`, L`À rien`], why: L`On minore par une fonction positive dont l'intégrale diverge.` },
    { q: L`Pourquoi a-t-on besoin d'un \(A\) et pas directement de \(1\) ?`, o: [L`L'encadrement n'est vrai que pour \(t\) assez grand`, L`Parce que \(f(1)\) n'existe pas`, L`Parce que \(\int_1^{+\infty}\frac{dt}{t^\alpha}\) diverge`, L`Par convention`], why: L`L'équivalent ne donne d'information qu'au voisinage de \(+\infty\).` }
  ],
  erreurs: [
    { k: 1, bad: L`Comme \(f(t)\sim\frac1{t^\alpha}\), on a \(\frac1{2t^\alpha}\leqslant f(t)\leqslant\frac2{t^\alpha}\) pour tout \(t\in[1,+\infty[\).`, why: L`L'équivalent ne dit rien sur \([1,A]\) : l'encadrement n'est vrai qu'<b>à partir d'un certain \(A\)</b>.` },
    { k: 2, bad: L`Si \(\alpha\gt1\), comme \(f(t)\geqslant\frac1{2t^\alpha}\) pour \(t\geqslant A\) et que \(\int_A^{+\infty}\frac{dt}{t^\alpha}\) converge, alors \(\int_A^{+\infty}f\) converge.`, why: L`Une minoration par une intégrale convergente ne prouve rien. Pour la convergence il faut la <b>majoration</b> \(f\leqslant\frac2{t^\alpha}\).` },
    { k: 0, bad: L`Un calcul direct montre que \(\int_A^{+\infty}\frac{dt}{t^\alpha}\) converge si et seulement si \(\alpha\geqslant1\).`, why: L`Pour \(\alpha=1\), \(\int_A^X\frac{dt}t=\ln\frac XA\to+\infty\) : il faut \(\alpha\) <b>strictement</b> plus grand que \(1\).` }
  ],
  errata: [],
  dia: 'c3q4', see: ['c3q5', 'c3q7']

/* ---------- Q5 : intégrales sur ]0,1] et tᵞ f(t) ---------- */
{
  id: 'c3q5', kind: 'demo', n: 5, label: 'Q5', color: 'butter', domain: 'Intégrales généralisées',
  title: 'Critères en tᵞf(t) sur ]0, 1]',
  statement: L`Soit \(f\) localement Riemann intégrable sur \(]0,1]\), à valeurs positives. Si \(tf(t)\to+\infty\) lorsque \(t\to0^+\), alors \(\int_0^1f(t)\,dt\) diverge. S'il existe \(\gamma\lt1\) tel que \(t^\gamma f(t)\to0\) lorsque \(t\to0^+\), alors \(\int_0^1f(t)\,dt\) converge.`,
  keys: ['riemann-int', 'comparaison', 'integrale-gen', 'nature'],
  skeleton: [
    L`\(tf(t)\to+\infty\) : près de \(0\), \(f(t)\geqslant\frac1t\), et \(\int_0^a\frac{dt}t\) diverge.`,
    L`\(t^\gamma f(t)\to0\) avec \(\gamma\lt1\) : près de \(0\), \(0\leqslant f(t)\leqslant\frac1{t^\gamma}\), et \(\int_0^a\frac{dt}{t^\gamma}\) converge.`,
    L`Dans les deux cas : comparaison sur \(]0,a]\), puis \(\int_a^1f\) est ordinaire.`
  ],
  mnemo: { big: 'En 0 : γ < 1', text: L`« En zéro, tout s'inverse » : en \(+\infty\) il faut \(\alpha\gt1\), en \(0\) il faut \(\gamma\lt1\). Et \(\frac1t\) est la frontière qui diverge des deux côtés.` },
  pieges: [
    L`En \(0\), les intégrales de Riemann \(\int_0^a\frac{dt}{t^\gamma}\) convergent pour \(\gamma\lt1\) : c'est l'inverse de \(+\infty\). Le prof teste souvent ce point.`,
    L`On a besoin de \(f\geqslant0\) pour appliquer le théorème de comparaison : c'est une hypothèse de l'énoncé, cite-la.`,
    L`L'énoncé du polycopié parle de « nature de la série » : il s'agit bien de l'<b>intégrale</b> \(\int_0^1f\).`
  ],
  colleur: [
    { q: L`Pourquoi \(\int_0^a\frac{dt}t\) diverge-t-elle ?`, a: L`\(\int_\varepsilon^a\frac{dt}t=\ln a-\ln\varepsilon\to+\infty\) quand \(\varepsilon\to0^+\).` },
    { q: L`Pourquoi \(\int_0^a\frac{dt}{t^\gamma}\) converge-t-elle pour \(\gamma\lt1\) ?`, a: L`\(\int_\varepsilon^a t^{-\gamma}dt=\frac{a^{1-\gamma}-\varepsilon^{1-\gamma}}{1-\gamma}\to\frac{a^{1-\gamma}}{1-\gamma}\) car \(1-\gamma\gt0\).` },
    { q: L`Applique le critère à \(\int_0^1\frac{dt}{\sqrt t}\).`, a: L`Avec \(\gamma=\frac34\) : \(t^{3/4}\cdot t^{-1/2}=t^{1/4}\to0\) : convergente (elle vaut \(2\)).` },
    { q: L`Applique-le à \(\int_0^1\frac{|\ln t|}{t}dt\).`, a: L`\(t\cdot\frac{|\ln t|}t=|\ln t|\to+\infty\) : divergente.` },
    { q: L`Que se passe-t-il pour \(\int_0^1\ln t\,dt\) ?`, a: L`\(f=-\ln\geqslant0\) sur \(]0,1]\) et \(t^{1/2}|\ln t|\to0\) (croissances comparées) : convergente (elle vaut \(-1\)).` },
    { q: L`Pourquoi a-t-on besoin d'un \(a\in]0,1[\) ?`, a: L`Les limites en \(0^+\) ne donnent l'inégalité que près de \(0\), sur un intervalle \(]0,a[\).` }
  ],
  steps: [
    { t: 'Premier critère : minoration', x: L`Si \(tf(t)\to+\infty\) lorsque \(t\to0^+\), alors il existe \(a\in]0,1[\) tel que \(tf(t)\geqslant1\) pour tout \(t\in]0,a[\). Ainsi on a ⟦\(f(t)\geqslant\frac1t\) ;; \(f(t)\leqslant\frac1t\) ;; \(f(t)\geqslant t\)⟧ pour tout \(t\in]0,a[\).`, why: L`Définition de « tendre vers \(+\infty\) » avec le seuil \(1\), puis on divise par \(t\gt0\).` },
    { t: 'Comparaison avec 1/t', x: L`Or \(\int_0^a\frac{dt}t\) est ⟦divergente ;; convergente ;; égale à \(\ln a\)⟧ (critère de Riemann), alors par théorème de comparaison \(\int_0^af\) est divergente.`, why: L`En \(0\), \(\int_0^a\frac{dt}{t^\gamma}\) converge si et seulement si \(\gamma\lt1\) ; ici \(\gamma=1\).` },
    { t: 'Recoller [a, 1]', x: L`Comme \(\int_a^1f\) est ⟦une intégrale de Riemann ordinaire (donc convergente) ;; divergente ;; nulle⟧, on en déduit que \(\int_0^1f\) est divergente.`, why: L`Le problème n'est qu'en \(0\) : sur le segment \([a,1]\), \(f\) est intégrable au sens de Riemann.` },
    { t: 'Second critère : majoration', x: L`S'il existe \(\gamma\lt1\) tel que \(t^\gamma f(t)\to0\) lorsque \(t\to0^+\), alors il existe \(a\in]0,1[\) tel que \(0\leqslant t^\gamma f(t)\leqslant1\) pour tout \(t\in]0,a[\), et donc ⟦\(0\leqslant f(t)\leqslant\frac1{t^\gamma}\) ;; \(f(t)\geqslant\frac1{t^\gamma}\) ;; \(f(t)\leqslant t^\gamma\)⟧ pour tout \(t\in]0,a[\).`, why: L`Définition de la limite \(0\) avec \(\varepsilon=1\) ; la positivité vient de l'hypothèse \(f\geqslant0\).` },
    { t: 'Comparaison et conclusion', x: L`Or \(\int_0^a\frac{dt}{t^\gamma}\) est convergente (critère de Riemann avec ⟦\(\gamma\lt1\) ;; \(\gamma\gt1\) ;; \(\gamma=1\)⟧), alors par théorème de comparaison \(\int_0^af\) converge. Comme \(\int_a^1f\) est une intégrale de Riemann ordinaire, \(\int_0^1f\) est convergente.`, why: L`On majore une fonction positive par une fonction d'intégrale convergente sur \(]0,a]\).` }
  ],
  cards: [
    { q: L`Quel est le premier critère (divergence) sur \(]0,1]\) ?`, a: L`Si \(tf(t)\to+\infty\) en \(0^+\) (avec \(f\geqslant0\)), alors \(\int_0^1f\) diverge.` },
    { q: L`Quel est le second critère (convergence) sur \(]0,1]\) ?`, a: L`S'il existe \(\gamma\lt1\) tel que \(t^\gamma f(t)\to0\) en \(0^+\), alors \(\int_0^1f\) converge.` },
    { q: L`Pour quelles valeurs \(\int_0^1\frac{dt}{t^\gamma}\) converge-t-elle ?`, a: L`Pour \(\gamma\lt1\) seulement.` },
    { q: L`Que fait-on de \(\int_a^1f\) ?`, a: L`C'est une intégrale de Riemann ordinaire : elle converge et ne change pas la nature.` }
  ],
  qcm: [
    { q: L`\(\int_0^1\frac{dt}{t^\gamma}\) converge si et seulement si…`, o: [L`\(\gamma\lt1\)`, L`\(\gamma\gt1\)`, L`\(\gamma\leqslant1\)`, L`\(\gamma\geqslant1\)`], why: L`En \(0\), c'est l'inverse de \(+\infty\) : primitive \(\frac{t^{1-\gamma}}{1-\gamma}\), qui tend vers \(0\) en \(0^+\) si \(1-\gamma\gt0\).` },
    { q: L`Nature de \(\int_0^1\frac{dt}{t^2}\) ?`, o: [L`Divergente, car \(t\cdot\frac1{t^2}=\frac1t\to+\infty\)`, L`Convergente, car \(2\gt1\)`, L`Convergente, car \(t^2\cdot\frac1{t^2}=1\)`, L`On ne peut pas conclure`], why: L`Premier critère : \(tf(t)\to+\infty\).` },
    { q: L`Quelle hypothèse sur \(f\) est indispensable pour comparer ?`, o: [L`\(f\geqslant0\)`, L`\(f\) décroissante`, L`\(f\) continue en \(0\)`, L`\(f\) bornée`], why: L`Le théorème de comparaison des intégrales porte sur des fonctions positives.` },
    { q: L`Pour \(f(t)=\frac1{\sqrt t}\), quel \(\gamma\) convient dans le second critère ?`, o: [L`\(\gamma=\frac34\)`, L`\(\gamma=\frac14\)`, L`\(\gamma=2\)`, L`\(\gamma=1\)`], why: L`\(t^{3/4}t^{-1/2}=t^{1/4}\to0\) et \(\frac34\lt1\). (Avec \(\frac14\), \(t^{-1/4}\to+\infty\).)` }
  ],
  erreurs: [
    { k: 1, bad: L`Or \(\int_0^a\frac{dt}t\) est convergente (critère de Riemann), donc on ne peut rien conclure.`, why: L`\(\int_\varepsilon^a\frac{dt}t=\ln\frac a\varepsilon\to+\infty\) : elle est <b>divergente</b>, et c'est ce qui permet de conclure.` },
    { k: 4, bad: L`Or \(\int_0^a\frac{dt}{t^\gamma}\) est convergente (critère de Riemann avec \(\gamma\gt1\)).`, why: L`En \(0\), la condition de convergence est \(\gamma\) <b>inférieur</b> à \(1\) (c'est l'hypothèse \(\gamma\lt1\)).` },
    { k: 0, bad: L`Si \(tf(t)\to+\infty\) lorsque \(t\to0^+\), alors \(f(t)\geqslant\frac1t\) pour tout \(t\in]0,1]\).`, why: L`La limite ne donne l'inégalité que <b>près de \(0\)</b>, sur un intervalle \(]0,a[\).` }
  ],
  errata: [L`Le polycopié écrit « deux conditions suffisantes concernant la nature de la <b>série</b> » : il s'agit de la nature de l'<b>intégrale</b> \(\int_0^1f(t)\,dt\).`],
  dia: 'c3q5', see: ['c3q4', 'c3q7']
},
/* ---------- Q6 : théorème de comparaison des séries ---------- */
{
  id: 'c3q6', kind: 'demo', n: 6, label: 'Q6', color: 'peach', domain: 'Séries numériques',
  title: 'Théorème de comparaison des séries',
  statement: L`Soient \((u_n)\) et \((v_n)\) deux suites réelles. 1. Si \(0\leqslant u_n\leqslant v_n\) pour tout \(n\) assez grand et si \(\sum v_n\) converge, alors \(\sum u_n\) converge. 2. Si \(0\leqslant v_n\leqslant u_n\) pour tout \(n\) assez grand et si \(\sum v_n\) diverge, alors \(\sum u_n\) diverge.`,
  keys: ['serie-positive', 'serie', 'nature', 'gendarmes-infini'],
  skeleton: [
    L`Rappel : pour une suite positive, \(N\mapsto\sum_{n=0}^Nu_n\) est croissante, donc tend vers \(+\infty\) ou converge.`,
    L`Point 1 : \(\sum_0^Nu_n\leqslant\sum_0^Nv_n\leqslant\sum_0^{+\infty}v_n\) : majorée, donc ne tend pas vers \(+\infty\).`,
    L`Point 2 : \(\sum_0^Nu_n\geqslant\sum_0^Nv_n\to+\infty\) : gendarmes.`
  ],
  mnemo: { big: 'Croissante : deux destins', text: L`« Une somme positive n'a que deux destins » : exploser vers \(+\infty\) ou converger. Pour conclure, il suffit d'empêcher (ou de forcer) l'explosion.` },
  pieges: [
    L`Le cœur de la preuve est le rappel « suite croissante : majorée ⇒ converge, sinon \(\to+\infty\) ». Énonce-le clairement avant les deux points.`,
    L`« Pour tout \(n\) assez grand » : on se ramène à « pour tout \(n\) » en enlevant un nombre fini de termes, ce qui ne change pas la nature. Dis-le.`,
    L`Au point 2, si \(\sum v_n\) diverge avec \(v_n\geqslant0\), ses sommes partielles tendent vers \(+\infty\) (et pas « divergent en oscillant ») : c'est le rappel qui le garantit.`
  ],
  colleur: [
    { q: L`Pourquoi les sommes partielles d'une série positive sont-elles croissantes ?`, a: L`\(S_{N+1}-S_N=u_{N+1}\geqslant0\).` },
    { q: L`Le théorème reste-t-il vrai sans l'hypothèse \(u_n\geqslant0\) ?`, a: L`Non : \(u_n=-1\leqslant v_n=0\), \(\sum v_n\) converge mais \(\sum u_n\) diverge.` },
    { q: L`Comment traiter « pour \(n\) assez grand » ?`, a: L`On applique le raisonnement à partir du rang \(N_0\) : les séries \(\sum_{n\geqslant0}\) et \(\sum_{n\geqslant N_0}\) ont même nature.` },
    { q: L`Donne une application.`, a: L`\(0\leqslant\frac{1}{n^2+n}\leqslant\frac1{n^2}\) et \(\sum\frac1{n^2}\) converge, donc \(\sum\frac1{n^2+n}\) converge.` },
    { q: L`Quelle est la version « équivalents » ?`, a: L`Si \(u_n\sim v_n\) et \(v_n\geqslant0\), les séries ont même nature : on se ramène à \(\frac12v_n\leqslant u_n\leqslant2v_n\) à partir d'un rang.` }
  ],
  steps: [
    { t: 'Le rappel essentiel', x: L`Si \((u_n)\) est une suite positive, alors la suite \(N\mapsto\sum_{n=0}^Nu_n\) est ⟦croissante ;; décroissante ;; constante⟧. Ainsi : soit \(\lim\limits_{N\to+\infty}\sum_{n=0}^Nu_n=+\infty\), soit \(\sum u_n\) converge.`, why: L`Une suite croissante majorée converge ; une suite croissante non majorée tend vers \(+\infty\).` },
    { t: 'Point 1 : majoration', x: L`Pour le premier point, si \(\sum_{n=0}^{+\infty}v_n\) converge et si \(0\leqslant u_n\leqslant v_n\) pour tout \(n\in\N\), alors pour tout \(N\in\N\) on a ⟦\(\sum_{n=0}^Nu_n\leqslant\sum_{n=0}^Nv_n\leqslant\sum_{n=0}^{+\infty}v_n\) ;; \(\sum_{n=0}^Nu_n\geqslant\sum_{n=0}^Nv_n\) ;; \(\sum_{n=0}^Nu_n=\sum_{n=0}^Nv_n\)⟧.`, why: L`On somme \(u_n\leqslant v_n\) ; puis les sommes partielles de \(\sum v_n\), positives et croissantes, sont sous leur limite.` },
    { t: 'Conclusion du point 1', x: L`Ainsi \(N\mapsto\sum_{n=0}^Nu_n\) ⟦ne tend pas vers \(+\infty\) ;; tend vers \(+\infty\) ;; est décroissante⟧ lorsque \(N\to+\infty\), donc d'après le rappel, \(\sum u_n\) converge.`, why: L`Elle est majorée par \(\sum_{n=0}^{+\infty}v_n\) : des deux destins, seul « converger » reste possible.` },
    { t: 'Point 2 : minoration', x: L`Pour le deuxième point, on a pour tout \(N\in\N\) : ⟦\(\sum_{n=0}^Nu_n\geqslant\sum_{n=0}^Nv_n\) ;; \(\sum_{n=0}^Nu_n\leqslant\sum_{n=0}^Nv_n\) ;; \(\sum_{n=0}^Nu_n\geqslant\sum_{n=0}^{+\infty}v_n\)⟧, et comme \(\lim\limits_{N\to+\infty}\sum_{n=0}^Nv_n=+\infty\), le théorème des gendarmes permet de conclure à la divergence de \(\sum u_n\).`, why: L`\(\sum v_n\) est positive et divergente : d'après le rappel, ses sommes partielles tendent vers \(+\infty\), et elles minorent celles de \(\sum u_n\).` }
  ],
  cards: [
    { q: L`Quel rappel sur les séries positives sert de base à la démo ?`, a: L`Les sommes partielles sont croissantes : soit elles tendent vers \(+\infty\), soit la série converge.` },
    { q: L`Comment prouve-t-on le point 1 ?`, a: L`\(\sum_0^Nu_n\leqslant\sum_0^Nv_n\leqslant\sum_0^{+\infty}v_n\) : majorées, donc convergentes.` },
    { q: L`Comment prouve-t-on le point 2 ?`, a: L`\(\sum_0^Nu_n\geqslant\sum_0^Nv_n\to+\infty\) : les sommes partielles de \(\sum u_n\) tendent vers \(+\infty\).` },
    { q: L`Que faire de « pour \(n\) assez grand » ?`, a: L`On enlève un nombre fini de termes : la nature ne change pas.` }
  ],
  qcm: [
    { q: L`Si \(0\leqslant u_n\leqslant v_n\) et \(\sum u_n\) converge, que dire de \(\sum v_n\) ?`, o: [L`On ne peut rien dire`, L`Elle converge`, L`Elle diverge`, L`Elle a la même somme`], why: L`Exemple : \(u_n=0\) et \(v_n=1\). Le théorème ne marche que dans les deux sens énoncés.` },
    { q: L`Pourquoi a-t-on besoin de \(u_n\geqslant0\) ?`, o: [L`Pour que les sommes partielles soient croissantes`, L`Pour que \(v_n\) soit positive`, L`Pour appliquer Riemann`, L`Ce n'est pas nécessaire`], why: L`Sans positivité, \(u_n=-1\leqslant0=v_n\) donne un contre-exemple.` },
    { q: L`\(\sum\frac{1}{n^2+n}\) :`, o: [L`converge par comparaison avec \(\sum\frac1{n^2}\)`, L`diverge par comparaison avec \(\sum\frac1n\)`, L`diverge grossièrement`, L`on ne peut pas conclure`], why: L`\(0\leqslant\frac1{n^2+n}\leqslant\frac1{n^2}\).` },
    { q: L`Une série positive divergente…`, o: [L`a des sommes partielles qui tendent vers \(+\infty\)`, L`a des sommes partielles qui oscillent`, L`a un terme général qui ne tend pas vers \(0\)`, L`n'existe pas`], why: L`Sommes partielles croissantes non majorées ; le terme général peut tendre vers \(0\) (\(\frac1n\)).` }
  ],
  erreurs: [
    { k: 2, bad: L`Ainsi \(N\mapsto\sum_{n=0}^Nu_n\) est majorée, donc elle est convergente car toute suite majorée converge.`, why: L`Une suite majorée ne converge pas forcément (\((-1)^n\)). C'est parce qu'elle est <b>croissante</b> et majorée qu'elle converge.` },
    { k: 3, bad: L`Pour le deuxième point, on a \(\sum_{n=0}^Nu_n\leqslant\sum_{n=0}^Nv_n\), et comme \(\sum_{n=0}^Nv_n\to+\infty\), la série \(\sum u_n\) diverge.`, why: L`Inégalité à l'envers : avec \(v_n\leqslant u_n\), on a \(\sum_0^Nu_n\geqslant\sum_0^Nv_n\). Être majorée par une quantité qui explose ne prouve rien.` },
    { k: 0, bad: L`Si \((u_n)\) est une suite positive, alors la suite \(N\mapsto\sum_{n=0}^Nu_n\) est croissante. Ainsi \(\sum u_n\) converge.`, why: L`Une suite croissante peut tendre vers \(+\infty\) : il y a <b>deux</b> possibilités, converger ou exploser.` }
  ],
  errata: [],
  dia: 'c3q6', see: ['c3q7', 'c3q9']
},
/* ---------- Q7 : critères en n^γ u_n ---------- */
{
  id: 'c3q7', kind: 'demo', n: 7, label: 'Q7', color: 'aqua', domain: 'Séries numériques',
  title: 'Critères en nᵞuₙ',
  statement: L`Soit \((u_n)\) une suite à termes positifs. Si \(nu_n\to+\infty\) lorsque \(n\to+\infty\), alors \(\sum u_n\) est divergente. S'il existe \(\gamma\gt1\) tel que \(n^\gamma u_n\to0\) lorsque \(n\to+\infty\), alors \(\sum u_n\) est convergente.`,
  keys: ['riemann-serie', 'comparaison', 'nature', 'serie-positive'],
  skeleton: [
    L`On peut commencer les séries à n'importe quel rang \(N_0\) : même nature.`,
    L`\(nu_n\to+\infty\) : \(u_n\geqslant\frac1n\) à partir d'un rang, et \(\sum\frac1n\) diverge.`,
    L`\(n^\gamma u_n\to0\), \(\gamma\gt1\) : \(0\leqslant u_n\leqslant\frac1{n^\gamma}\) à partir d'un rang, et \(\sum\frac1{n^\gamma}\) converge.`
  ],
  mnemo: { big: 'n · uₙ / nᵞ · uₙ', text: L`« Multiplier pour comparer » : si même multiplié par \(n\) le terme explose, il est plus gros que \(\frac1n\) ; si multiplié par \(n^\gamma\) (\(\gamma\gt1\)) il s'écrase, il est plus petit que \(\frac1{n^\gamma}\).` },
  pieges: [
    L`Les deux critères reposent sur la comparaison avec les séries de Riemann : \(\sum\frac1n\) diverge et \(\sum\frac1{n^\gamma}\) converge pour \(\gamma\gt1\). Cite-les.`,
    L`Le cas « \(n^\gamma u_n\to0\) avec \(\gamma=1\) » ne permet pas de conclure : \(u_n=\frac1{n\ln n}\) vérifie \(nu_n\to0\) et pourtant \(\sum u_n\) diverge.`,
    L`L'hypothèse \(u_n\geqslant0\) est indispensable pour le théorème de comparaison.`
  ],
  colleur: [
    { q: L`Applique le second critère à \(u_n=e^{-\sqrt n}\).`, a: L`\(n^2e^{-\sqrt n}\to0\) (croissances comparées), et \(2\gt1\) : la série converge.` },
    { q: L`Applique le premier critère à \(u_n=\frac{\ln n}{n}\).`, a: L`\(nu_n=\ln n\to+\infty\) : la série diverge.` },
    { q: L`Pourquoi \(\gamma=1\) ne suffit-il pas dans le second critère ?`, a: L`\(\frac1{n\ln n}\) vérifie \(nu_n=\frac1{\ln n}\to0\), mais \(\sum\frac1{n\ln n}\) diverge (comparaison série-intégrale).` },
    { q: L`Comment justifies-tu que \(\sum\frac1n\) diverge ?`, a: L`Par comparaison série-intégrale : \(\int_1^X\frac{dt}t=\ln X\to+\infty\).` },
    { q: L`Pourquoi peut-on « commencer à \(N_0\) » ?`, a: L`Les séries \(\sum_{n\geqslant1}u_n\) et \(\sum_{n\geqslant N_0}u_n\) ne diffèrent que d'un nombre fini de termes : elles ont même nature.` }
  ],
  steps: [
    { t: 'Commencer à n’importe quel rang', x: L`On commence par remarquer que pour tout \(N_0\geqslant1\) fixé, les séries \(\sum_{n\geqslant1}u_n\) et \(\sum_{n\geqslant N_0}u_n\) ⟦ne diffèrent que d'un nombre fini de termes, donc ont même nature ;; ont la même somme ;; convergent toutes les deux⟧.`, why: L`Les sommes partielles diffèrent d'une constante \(\sum_{n=1}^{N_0-1}u_n\) : l'une converge si et seulement si l'autre converge.` },
    { t: 'Premier critère : minoration', x: L`Si \(nu_n\to+\infty\), il existe \(N_0\in\N\) tel que \(nu_n\geqslant1\) pour tout \(n\geqslant N_0\). Ainsi, pour tout \(n\geqslant N_0\), on a ⟦\(u_n\geqslant\frac1n\) ;; \(u_n\leqslant\frac1n\) ;; \(u_n\geqslant n\)⟧.`, why: L`Définition de \(+\infty\) avec le seuil \(1\), puis division par \(n\gt0\).` },
    { t: 'Divergence', x: L`Or \(\sum_{n\geqslant1}\frac1n\) est ⟦divergente ;; convergente ;; alternée⟧, donc par théorème de comparaison, \(\sum u_n\) est divergente.`, why: L`Série harmonique : Riemann avec exposant \(1\).` },
    { t: 'Second critère : majoration', x: L`S'il existe \(\gamma\gt1\) tel que \(n^\gamma u_n\to0\), alors il existe \(N_1\in\N\) tel que \(n^\gamma u_n\leqslant1\) pour tout \(n\geqslant N_1\). Alors ⟦\(0\leqslant u_n\leqslant\frac1{n^\gamma}\) ;; \(u_n\geqslant\frac1{n^\gamma}\) ;; \(u_n\leqslant\frac1n\)⟧ pour tout \(n\geqslant N_1\).`, why: L`Définition de la limite \(0\) avec \(\varepsilon=1\) ; \(u_n\geqslant0\) par hypothèse.` },
    { t: 'Convergence', x: L`Or d'après le critère de Riemann, \(\sum_{n\geqslant1}\frac1{n^\gamma}\) est convergente (car ⟦\(\gamma\gt1\) ;; \(\gamma\lt1\) ;; \(\gamma\geqslant0\)⟧), donc par théorème de comparaison, \(\sum u_n\) est convergente.`, why: L`Séries de Riemann : \(\sum\frac1{n^\gamma}\) converge si et seulement si \(\gamma\gt1\).` }
  ],
  cards: [
    { q: L`Énonce le critère de divergence en \(nu_n\).`, a: L`Si \(u_n\geqslant0\) et \(nu_n\to+\infty\), alors \(\sum u_n\) diverge.` },
    { q: L`Énonce le critère de convergence en \(n^\gamma u_n\).`, a: L`Si \(u_n\geqslant0\) et s'il existe \(\gamma\gt1\) tel que \(n^\gamma u_n\to0\), alors \(\sum u_n\) converge.` },
    { q: L`Avec quelles séries compare-t-on ?`, a: L`Avec \(\sum\frac1n\) (divergente) et \(\sum\frac1{n^\gamma}\), \(\gamma\gt1\) (convergente).` },
    { q: L`Contre-exemple au critère avec \(\gamma=1\) ?`, a: L`\(u_n=\frac1{n\ln n}\) : \(nu_n\to0\) mais \(\sum u_n\) diverge.` }
  ],
  qcm: [
    { q: L`Nature de \(\sum\frac{\ln n}{n^2}\) ?`, o: [L`Convergente : \(n^{3/2}\cdot\frac{\ln n}{n^2}=\frac{\ln n}{\sqrt n}\to0\)`, L`Divergente : \(\ln n\to+\infty\)`, L`Divergente : \(n\cdot\frac{\ln n}{n^2}\to+\infty\)`, L`On ne peut pas conclure`], why: L`Second critère avec \(\gamma=\frac32\gt1\).` },
    { q: L`Nature de \(\sum\frac1{\sqrt n}\) ?`, o: [L`Divergente : \(n\cdot\frac1{\sqrt n}=\sqrt n\to+\infty\)`, L`Convergente : \(\frac1{\sqrt n}\to0\)`, L`Convergente par Riemann`, L`On ne peut pas conclure`], why: L`Premier critère (ou Riemann avec \(\frac12\leqslant1\)).` },
    { q: L`Dans le second critère, pourquoi exiger \(\gamma\gt1\) ?`, o: [L`Pour que \(\sum\frac1{n^\gamma}\) converge`, L`Pour que \(n^\gamma\to+\infty\)`, L`Pour que \(u_n\geqslant0\)`, L`Pour que \(u_n\to0\)`], why: L`La comparaison n'aboutit que si la série majorante converge.` },
    { q: L`Si \(nu_n\to0\) (et \(u_n\geqslant0\)), alors…`, o: [L`on ne peut pas conclure`, L`\(\sum u_n\) converge`, L`\(\sum u_n\) diverge`, L`\(u_n=0\) à partir d'un rang`], why: L`\(\frac1{n^2}\) (converge) et \(\frac1{n\ln n}\) (diverge) vérifient tous deux \(nu_n\to0\).` }
  ],
  erreurs: [
    { k: 1, bad: L`Si \(nu_n\to+\infty\), il existe \(N_0\) tel que \(nu_n\geqslant1\) pour \(n\geqslant N_0\). Ainsi \(u_n\leqslant\frac1n\) pour tout \(n\geqslant N_0\).`, why: L`En divisant \(nu_n\geqslant1\) par \(n\gt0\), on obtient \(u_n\geqslant\frac1n\) : l'inégalité garde son sens.` },
    { k: 4, bad: L`Or d'après le critère de Riemann, \(\sum\frac1{n^\gamma}\) est convergente car \(\gamma\gt0\).`, why: L`Les séries de Riemann ne convergent que pour \(\gamma\gt1\). Pour \(0\lt\gamma\leqslant1\), elles divergent.` },
    { k: 2, bad: L`Or \(\sum\frac1n\) est convergente, car \(\frac1n\to0\), donc on ne peut rien conclure.`, why: L`La série harmonique <b>diverge</b>, même si son terme général tend vers \(0\). C'est ce qui donne la divergence de \(\sum u_n\).` }
  ],
