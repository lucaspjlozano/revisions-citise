      </svg>
      <p class="small muted">Tracé de \(\sin(\omega_1t)+0{,}6\sin(2\omega_1t)+0{,}3\sin(3\omega_1t)\), au facteur \(-K\omega_1\) près.</p>`,
      { err: T`\(x_0\) n'est pas donné, et ce sont les \(B_n\), pas les \(A_n\), qui pondèrent \(s(t)\) : rigoureusement \(B_n\propto n\,A_n\sin(n\pi x_0/L)\). On ne peut tracer qu'une <b>allure</b>. Les facteurs \(n\sin(n\pi x_0/L)\) changent la forme exacte, mais pas la période ni les zéros en \(0\), \(T_1/2\), \(T_1\).` }),
    Q(T`<b>Analyse spectrale.</b> a) Fréquences des trois premiers pics pour \(c=180\) m/s et \(L=0{,}65\) m.`, 1,
      T`<p>\(f_n=\frac{\omega_n}{2\pi}=\frac{nc}{2L}\), avec \(\frac{c}{2L}=\frac{180}{1{,}30}\approx138{,}5\) Hz :</p>
      <div class="math">\[f_1\approx138\ \text{Hz}\qquad f_2\approx277\ \text{Hz}\qquad f_3\approx415\ \text{Hz}\]</div>`),
    Q("b) Identifier la fréquence fondamentale et les harmoniques.", 1,
      T`<p>Le <b>fondamental</b> est \(f_1\approx138\) Hz : c'est la hauteur perçue de la note. Les <b>harmoniques</b> sont les multiples entiers \(f_n=nf_1\) : 277 Hz (harmonique 2), 415 Hz (harmonique 3)…</p>
      <p>Le spectre est donc un ensemble de raies régulièrement espacées de \(f_1\), ce qui est la signature d'un signal périodique de période \(T_1=1/f_1\).</p>`),
    Q(T`<b>Lieu de pincement.</b> a) Pour un pincement à \(L/5\), montrer que \(A_n\propto\sin\left(\frac{n\pi}{5}\right)\).`, 3,
      T`<p><b>Conditions initiales :</b> la corde est tirée en \(x=a\) à la hauteur \(h\) et lâchée sans vitesse. La forme initiale est un triangle :</p>
      <div class="math">\[y_0(x)=\begin{cases}\dfrac{hx}{a} & 0\le x\le a\\[2mm] \dfrac{h(L-x)}{L-a} & a\le x\le L\end{cases}\]</div>
      <p>La vitesse initiale nulle est bien compatible avec des termes en \(\cos(\omega_nt)\) seulement.</p>
      <p><b>Coefficients de Fourier :</b> à \(t=0\), \(y_0(x)=\sum A_n\sin(kx)\) avec \(k=\frac{n\pi}{L}\). Par orthogonalité (\(\int_0^L\sin\frac{m\pi x}L\sin\frac{n\pi x}L dx=\frac L2\delta_{mn}\)) :</p>
      <div class="math">\[A_n=\frac2L\int_0^Ly_0(x)\sin(kx)\,dx\]</div>
      <p><b>Intégration par parties</b> (le crochet est nul car \(y_0(0)=y_0(L)=0\)) :</p>
      <div class="math">\[\int_0^Ly_0\sin(kx)\,dx=\frac1k\int_0^Ly_0'(x)\cos(kx)\,dx\]</div>
      <p>\(y_0'=\frac ha\) sur \([0,a]\) et \(-\frac{h}{L-a}\) sur \([a,L]\), et \(\sin(kL)=\sin(n\pi)=0\) :</p>
      <div class="math">\[\frac1k\left[\frac ha\cdot\frac{\sin(ka)}{k}+\frac{h}{L-a}\cdot\frac{\sin(ka)}{k}\right]=\frac{h\sin(ka)}{k^2}\cdot\frac{L}{a(L-a)}\]</div>
      <div class="math">\[A_n=\frac{2hL^2}{n^2\pi^2a(L-a)}\sin\Big(\frac{n\pi a}{L}\Big)\]</div>
      <p><b>Pour \(a=L/5\) :</b> \(a(L-a)=\frac L5\cdot\frac{4L}5=\frac{4L^2}{25}\), donc</p>
      <div class="math">\[A_n=\frac{25h}{2\pi^2n^2}\sin\Big(\frac{n\pi}{5}\Big)\]</div>
      <p>La dépendance en la position du pincement passe par \(\sin\left(\frac{n\pi}{5}\right)\).</p>`,
      { hint: T`Écris la forme triangulaire \(y_0(x)\), puis \(A_n=\frac2L\int_0^Ly_0\sin\frac{n\pi x}{L}dx\). Une intégration par parties suffit : \(y_0'\) est constante par morceaux.`,
        err: T`Strictement, \(A_n\propto\dfrac{1}{n^2}\sin\Big(\dfrac{n\pi}{5}\Big)\) : l'énoncé oublie le facteur \(1/n^2\). Il ne change pas quels harmoniques sont absents, mais il fixe la décroissance du spectre.` }),
    Q("b) Déterminer les harmoniques absents.", 1,
      T`<p>\(A_n=0\iff\sin\left(\frac{n\pi}{5}\right)=0\iff n\) multiple de 5 : <b>les harmoniques 5, 10, 15…</b> sont absents.</p>
      <p><b>Interprétation :</b> le mode \(n\) a des nœuds en \(x=\frac{pL}{n}\). Le point \(x=\frac L5\) est un nœud du mode \(n\) exactement quand \(n\) est multiple de 5. On ne peut pas exciter un mode en tirant la corde à l'endroit où il ne bouge pas.</p>
      <p><b>À noter pour le signal \(s(t)\) :</b> les harmoniques qui ont un nœud au point d'écoute \(x_0\) disparaissent aussi, à cause du facteur \(\sin(n\pi x_0/L)\) de \(B_n\).</p>`),
    Q("c) Distinguer son pur et son riche à partir du spectre ; effet sur le timbre.", 2,
      T`<p><b>Son pur :</b> une seule raie dans le spectre, signal sinusoïdal (par exemple un diapason). <b>Son riche</b> (ou complexe) : une raie fondamentale et plusieurs harmoniques.</p>
      <p>Deux sons de même fondamental ont la même hauteur. Ce qui les distingue, le <b>timbre</b>, dépend des amplitudes relatives des harmoniques.</p>
      <p>Pour un pincement à \(L/5\), amplitudes relatives \(|A_n/A_1|\) :</p>
      <svg class="schema-svg" viewBox="0 0 360 130" style="max-width:480px" role="img" aria-label="Spectre d'une corde pincée au cinquième">
        <line x1="20" y1="105" x2="350" y2="105" style="stroke:var(--ink-3)" stroke-width="1"/>
        <rect x="30" y="20" width="20" height="85" rx="3" style="fill:var(--c)"/>
        <rect x="62" y="70.6" width="20" height="34.4" rx="3" style="fill:var(--c)"/>
        <rect x="94" y="89.7" width="20" height="15.3" rx="3" style="fill:var(--c)"/>
        <rect x="126" y="99.7" width="20" height="5.3" rx="2" style="fill:var(--c)"/>
        <rect x="190" y="102.6" width="20" height="2.4" rx="1" style="fill:var(--c)"/>
        <rect x="222" y="102.2" width="20" height="2.8" rx="1" style="fill:var(--c)"/>
        <rect x="254" y="102.9" width="20" height="2.1" rx="1" style="fill:var(--c)"/>
        <rect x="286" y="104" width="20" height="1" rx="1" style="fill:var(--c)"/>
        <text x="40" y="16" font-size="10" text-anchor="middle" style="fill:var(--ink-2)">1</text>
        <text x="72" y="66" font-size="10" text-anchor="middle" style="fill:var(--ink-2)">0,40</text>
        <text x="104" y="85" font-size="10" text-anchor="middle" style="fill:var(--ink-2)">0,18</text>
        <text x="136" y="95" font-size="10" text-anchor="middle" style="fill:var(--ink-2)">0,06</text>
        <text x="168" y="100" font-size="12" text-anchor="middle" style="fill:var(--rose-ink)">×</text>
        <text x="328" y="100" font-size="12" text-anchor="middle" style="fill:var(--rose-ink)">×</text>
      </svg>
      <p class="small muted">Harmoniques \(n=1\) à \(10\) ; × : harmoniques 5 et 10 absents. Décroissance en \(1/n^2\).</p>
      <p><b>Effet du lieu de pincement :</b> pincée au milieu, la corde ne produit que les harmoniques impairs, avec \(A_n\propto1/n^2\) : son doux et rond. Pincée près d'un bout (\(a\) petit), \(\sin\frac{n\pi a}{L}\approx\frac{n\pi a}{L}\) pour les premiers \(n\), donc \(A_n\propto1/n\) : beaucoup plus d'harmoniques, son plus brillant, plus métallique. C'est ce qu'on entend en grattant une guitare près du chevalet.</p>`),
    Q(T`<b>Application numérique.</b> a) Calculer \(f_1=\frac{c}{2L}\).`, 1,
      T`<div class="math">\[f_1=\frac{180}{2\times0{,}65}\approx138{,}5\ \text{Hz}\]</div>`),
    Q("b) Donner les fréquences des cinq premiers harmoniques.", 1,
      T`<p>\(f_n=nf_1\) :</p>
      <div class="math">\[138{,}5\ \text{Hz}\quad 277\ \text{Hz}\quad 415\ \text{Hz}\quad 554\ \text{Hz}\quad 692\ \text{Hz}\]</div>
      <p>(Si l'on ne compte pas le fondamental comme harmonique, on ajoute \(f_6\approx831\) Hz.) Avec un pincement à \(L/5\), l'harmonique 5 (692 Hz) est absent du spectre.</p>`)
  ] });

dsEx({ id: "t-cours", ann: null, title: "Questions de cours express", th: "cours", cm: ["cm1", "cm3"], dur: 10,
  intro: "Réponses courtes, comme en début de contrôle.",
  q: [
    Q("Différence entre onde progressive et onde stationnaire ?", 1, "<p>Progressive : la perturbation se déplace et transporte de l'énergie. Stationnaire : tous les points vibrent en phase (ou en opposition), l'amplitude dépend de la position, nœuds et ventres sont fixes, <b>pas de transport d'énergie</b> en moyenne.</p>"),
    Q("Définir k, ω, la vitesse de phase, et les relier à λ et T.", 1, T`<p>\(k=2\pi/\lambda\), \(\omega=2\pi/T\), \(v_\varphi=\lambda/T=\omega/k\).</p>`),
    Q("Distance entre deux nœuds voisins d'une onde stationnaire ? Entre un nœud et un ventre ?", 1, T`<p>\(\lambda/2\) entre deux nœuds ; \(\lambda/4\) entre un nœud et le ventre voisin.</p>`),
    Q("Conditions de Dirichlet et de Neumann ? Un exemple de chaque sur une corde.", 1, T`<p>Dirichlet : \(f=0\) au bord (extrémité fixe). Neumann : \(\pd{f}{n}=0\) au bord (extrémité libre, anneau sur une tige).</p>`)
  ] });
dsEx({ id: "t-dal", ann: null, title: "Est-ce une solution ? Relation de dispersion", th: "dal", cm: ["cm1", "cm3"], dur: 12,
  intro: T`Équation \(\pdd{f}{x}-\frac{1}{c^2}\pdd{f}{t}=0\).`,
  q: [
    Q(T`Montrer que \(f_1=e^{-(x+ct)^2/a^2}\) est solution. Dans quel sens se propage-t-elle ?`, 2,
      T`<p>C'est une fonction de \(v=x+ct\) seulement, \(G(v)\) : \(\pdd{G}{x}=G''\), \(\pdd{G}{t}=c^2G''\), donc l'équation est vérifiée. \(x+ct=\text{cte}\) donne \(dx/dt=-c\) : propagation vers les \(x\) décroissants.</p>`),
    Q(T`À quelle condition \(f_2=A\cos(\omega t-kx)\) est-elle solution ?`, 1, T`<p>\(\left(-k^2+\frac{\omega^2}{c^2}\right)f_2=0\), soit \(\omega=kc\).</p>`),
    Q(T`\(f_3=A\,e^{-\beta t}\cos(\omega t-kx)\) peut-elle être solution avec \(\beta>0\) ?`, 2,
      T`<p>\(\pdd{f_3}{x}=-k^2f_3\). En temps, en notation complexe \(f_3=\mathrm{Re}\{Ae^{(-\beta+i\omega)t-ikx}\}\) : \(\pdd{}{t}\to(-\beta+i\omega)^2=\beta^2-\omega^2-2i\beta\omega\). Il faudrait \(-k^2c^2=\beta^2-\omega^2-2i\beta\omega\) : la partie imaginaire impose \(\beta\omega=0\). Avec \(\beta>0\) et \(\omega\neq0\), <b>impossible</b> : d'Alembert ne décrit pas d'amortissement (il faut un terme en \(\pd{f}{t}\), comme dans l'équation des télégraphistes).</p>`,
      { hint: "Passe en notation complexe : dériver en t revient à multiplier par (−β + iω)." })
  ] });
dsEx({ id: "t-sphere", ann: null, title: "Onde sphérique", th: "geo", cm: ["cm1", "ops"], dur: 20,
  intro: T`Équation \(\pdd{a}{t}=c^2\Delta a\) pour une onde à symétrie sphérique \(a(r,t)\). Formulaire : \(\Delta a=\frac1r\pdd{(ra)}{r}\) quand \(a\) ne dépend que de \(r\).`,
  q: [
    Q(T`Montrer que \(u=r\,a\) vérifie une équation de d'Alembert à une dimension.`, 2,
      T`<p>\(\pdd{a}{t}=\frac{c^2}{r}\pdd{(ra)}{r}\). On multiplie par \(r\) (indépendant de \(t\)) : \(\pdd{u}{t}=c^2\pdd{u}{r}\).</p>`),
    Q("En déduire la forme générale de a(r,t).", 2, T`<div class="math">\[a(r,t)=\frac{F(r-ct)+G(r+ct)}{r}\]</div><p>Une onde divergente (sortante) et une onde convergente.</p>`),
    Q("Pourquoi l'amplitude décroît-elle en 1/r ? Lien avec l'énergie.", 2,
      T`<p>L'intensité est en \(a^2\propto1/r^2\) et la surface de la sphère en \(4\pi r^2\) : la puissance totale qui traverse chaque sphère reste constante. L'énergie se conserve en se répartissant sur une surface de plus en plus grande.</p>`)
  ] });
dsEx({ id: "t-violon", ann: null, title: "Corde de violon : modes et application numérique", th: "stat", cm: ["cm2", "cm3"], dur: 20,
  intro: T`Corde de longueur \(L=33\) cm, fixée aux deux bouts, masse linéique \(\mu=0{,}60\) g·m⁻¹. Elle doit jouer le la à \(f_1=440\) Hz.`,
  q: [
    Q("Rappeler les fréquences propres et la forme des modes.", 2, T`<p>\(f_n=\frac{n}{2L}\sqrt{T/\mu}\), modes \(y_n=A_n\sin(n\pi x/L)\cos(\omega_nt+\psi_n)\).</p>`),
    Q("Tension nécessaire ?", 2, T`<div class="math">\[T=\mu(2Lf_1)^2=6{,}0\cdot10^{-4}\times(2\times0{,}33\times440)^2\approx51\ \text{N}\]</div>`),
    Q("On pose le doigt au tiers de la corde (nouvelle longueur 2L/3). Nouvelle fréquence fondamentale ?", 2, T`<p>\(f\propto1/L\) : \(f_1'=\frac32\times440=660\) Hz (une quinte au-dessus).</p>`),
    Q("Un harmonique « flageolet » s'obtient en effleurant la corde en L/3 : quels modes subsistent ?", 2, T`<p>Seuls les modes qui ont un <b>nœud</b> en \(L/3\) : \(\sin(n\pi/3)=0\), soit \(n=3,6,9,\dots\) La note entendue est \(3f_1=1320\) Hz.</p>`)
  ] });
dsEx({ id: "t-libre", ann: null, title: "Réflexion sur une extrémité libre", th: "refl", cm: ["cm3"], dur: 20,
  intro: T`Onde incidente \(\tilde\psi_i=\psi_0e^{i(\omega t-kx)}\) sur une corde dont l'extrémité \(x=L\) est libre (anneau sans frottement sur une tige). Onde totale \(\tilde\psi=\psi_0e^{i(\omega t-kx)}+\psi_re^{i(\omega t+kx)}\).`,
  q: [
    Q("Condition aux limites en x = L ? Justifier.", 1, T`<p>Aucune force verticale sur l'anneau sans masse : la tension doit être horizontale, donc \(\pd{\psi}{x}(L,t)=0\) (Neumann).</p>`),
    Q(T`Déterminer \(\psi_r\) et le coefficient \(r\) en \(x=L\).`, 2,
      T`<p>\(\pd{\tilde\psi}{x}=-ik\psi_0e^{i(\omega t-kx)}+ik\psi_re^{i(\omega t+kx)}\). En \(x=L\) : \(\psi_r=\psi_0e^{-2ikL}\), donc \(r=+1\) : pas de déphasage.</p>`),
    Q("Solution réelle. Nœuds et ventres.", 3,
      T`<p>\(\tilde\psi=2\psi_0\cos\big(k(L-x)\big)e^{i(\omega t-kL)}\), d'où \(\psi=2\psi_0\cos\big(k(L-x)\big)\cos(\omega t-kL)\).</p>
      <p>Ventre en \(x=L\) (le bout libre bouge le plus) ; ventres en \(x=L-m\lambda/2\) ; nœuds en \(x=L-(2m+1)\lambda/4\).</p>`),
    Q("Comparer avec le bout fixe.", 1, "<p>Bout fixe : \\(r=-1\\), nœud en \\(x=L\\). Bout libre : \\(r=+1\\), ventre en \\(x=L\\). Les nœuds et les ventres sont échangés.</p>")
  ] });
dsEx({ id: "t-vibreur", ann: null, title: "Vibreur et extrémité libre : résonances", th: "stat", cm: ["cm3"], dur: 20,
  intro: T`Corde entre \(x=0\) et \(x=L\). Un vibreur impose \(y(0,t)=a\cos\omega t\) ; l'extrémité \(x=L\) est libre : \(\pd{y}{x}(L,t)=0\). On cherche \(y=X(x)\cos\omega t\).`,
  q: [
    Q("Équation et forme générale de X.", 1, T`<p>\(X''+k^2X=0\), \(k=\omega/c\) ; \(X=\alpha\cos(k(L-x))+\beta\sin(k(L-x))\).</p>`),
    Q("Utiliser les conditions aux limites.", 3,
      T`<p>\(X'(L)=0\) : \(X'=k\alpha\sin(k(L-x))-k\beta\cos(k(L-x))\), en \(x=L\) cela donne \(\beta=0\). \(X(0)=a\) donne \(\alpha\cos(kL)=a\) :</p>
      <div class="math">\[y(x,t)=a\,\frac{\cos\big(k(L-x)\big)}{\cos(kL)}\cos\omega t\]</div>`),
    Q("Pulsations de résonance ? Comparer au bout fixe.", 2,
      T`<p>\(\cos(\omega L/c)=0\) : \(\omega_n=(2n+1)\frac{\pi c}{2L}\). Seuls les harmoniques <b>impairs</b> d'une fondamentale \(\pi c/(2L)\), soit la moitié de celle du bout fixe (\(\pi c/L\)) : un tuyau ouvert-fermé sonne une octave plus bas.</p>`),
    Q("Que se passe-t-il physiquement à la résonance ?", 1, "<p>L'amplitude théorique diverge ; en pratique, les pertes la limitent. Le système répond au maximum quand la fréquence imposée coïncide avec une fréquence propre.</p>")
  ] });
dsEx({ id: "t-coax", ann: null, title: "Câble coaxial idéal : célérité et impédance", th: "coax", cm: ["cm2"], dur: 20,
  intro: T`Câble sans pertes, inductance linéique \(\ell=0{,}25\) µH·m⁻¹, capacité linéique \(\gamma=100\) pF·m⁻¹.`,
  q: [
    Q("Établir les deux équations couplées en V et I.", 2, T`<div class="math">\[\pd{V}{x}=-\ell\pd{I}{t}\qquad \pd{I}{x}=-\gamma\pd{V}{t}\]</div><p>(loi des mailles, puis loi des nœuds, au premier ordre en \(dx\)).</p>`),
    Q("Équation de propagation et célérité. Application numérique.", 2,
      T`<p>\(\pdd{V}{x}-\ell\gamma\pdd{V}{t}=0\), \(c_0=\frac{1}{\sqrt{\ell\gamma}}=\frac{1}{\sqrt{2{,}5\cdot10^{-17}}}=2\cdot10^8\) m/s, soit \(\frac23c\).</p>`),
    Q(T`Pour une onde progressive \(V=f(x-c_0t)\), montrer que \(I=V/Z_c\) et calculer \(Z_c\).`, 3,
      T`<p>On cherche \(I=g(x-c_0t)\). La première équation donne \(f'=\ell c_0\,g'\), donc \(I=\frac{V}{\ell c_0}\) (à une constante près, nulle). Ainsi</p>
      <div class="math">\[Z_c=\ell c_0=\sqrt{\frac{\ell}{\gamma}}=\sqrt{\frac{0{,}25\cdot10^{-6}}{100\cdot10^{-12}}}=50\ \Omega\]</div><p>C'est l'impédance caractéristique standard des câbles de TP.</p>`,
      { hint: "Injecte V = f(x − c₀t) et I = g(x − c₀t) dans ∂V/∂x = −ℓ ∂I/∂t." })
  ] });
dsEx({ id: "t-pertes", ann: null, title: "Câble avec résistance : atténuation", th: "coax", cm: ["cm2", "cm3"], dur: 25,
  intro: T`Câble avec inductance \(\ell\), capacité \(\gamma\) et résistance série \(r\) par unité de longueur (pas de fuite : \(g=0\)).`,
  q: [
    Q("Équation de propagation pour V.", 2, T`<p>\(\pd{V}{x}=-\ell\pd{I}{t}-rI\) et \(\pd{I}{x}=-\gamma\pd{V}{t}\) donnent</p><div class="math">\[\pdd{V}{x}=\ell\gamma\pdd{V}{t}+r\gamma\pd{V}{t}\]</div>`),
    Q(T`Relation de dispersion pour \(V=V_0e^{i(\tilde kx-\omega t)}\).`, 2, T`<p>\(-\tilde k^2=-\ell\gamma\omega^2-ir\gamma\omega\), soit \(\tilde k^2=\ell\gamma\omega^2+ir\gamma\omega\).</p>`),
    Q(T`Faibles pertes (\(r\ll\ell\omega\)) : montrer que \(\tilde k\approx\frac{\omega}{c_0}+i\frac{r}{2Z_c}\), avec \(Z_c=\sqrt{\ell/\gamma}\). Interpréter.`, 3,
      T`<p>\(\tilde k=\omega\sqrt{\ell\gamma}\sqrt{1+\frac{ir}{\ell\omega}}\approx\frac{\omega}{c_0}\left(1+\frac{ir}{2\ell\omega}\right)=\frac{\omega}{c_0}+i\frac{r}{2\ell c_0}\), et \(\ell c_0=Z_c\).</p>
      <p>\(e^{i\tilde kx}=e^{-x/\delta}e^{i\omega x/c_0}\) : l'onde avance à \(c_0\) et s'atténue sur la longueur \(\delta=2Z_c/r\).</p>`,
      { hint: "Développement limité √(1 + ε) ≈ 1 + ε/2." })
  ] });
dsEx({ id: "t-son", ann: null, title: "Célérité du son dans un gaz parfait", th: "son", cm: ["cm2"], dur: 20,
  intro: T`Air assimilé à un gaz parfait : \(P_0=1{,}0\cdot10^5\) Pa, \(\rho_0=1{,}2\) kg·m⁻³, \(\gamma=1{,}4\). Évolution isentropique : \(PV^\gamma=\text{cte}\).`,
  q: [
    Q("Rappeler les 3 équations linéarisées et l'équation de propagation de p.", 2,
      T`<p>\(-\pd{p}{x}=\rho_0\pd{v}{t}\), \(\pd{\rho}{t}=-\rho_0\pd{v}{x}\), \(\rho=\rho_0\chi_Sp\), d'où \(\pdd{p}{x}-\rho_0\chi_S\pdd{p}{t}=0\).</p>`),
    Q(T`Montrer que \(\chi_S=\dfrac{1}{\gamma P_0}\).`, 2,
      T`<p>\(PV^\gamma=\text{cte}\) : \(\frac{dP}{P}+\gamma\frac{dV}{V}=0\), donc \(\chi_S=-\frac1V\left(\pd VP\right)_S=\frac{1}{\gamma P}\approx\frac{1}{\gamma P_0}\).</p>`),
    Q("Célérité du son ? Application numérique.", 2, T`<div class="math">\[c_s=\sqrt{\frac{\gamma P_0}{\rho_0}}=\sqrt{\frac{1{,}4\times10^5}{1{,}2}}\approx3{,}4\cdot10^2\ \text{m/s}\]</div>`)
  ] });
dsEx({ id: "t-doppler", ann: null, title: "Effet Doppler : source mobile", th: "son", cm: ["cm2"], dur: 20,
  intro: T`Une ambulance (source, fréquence \(f_0=440\) Hz) roule à \(v=20\) m/s vers un piéton immobile. \(c=340\) m/s.`,
  q: [
    Q("Avec la même méthode que l'annale 2023, établir la fréquence perçue quand la source se rapproche.", 3,
      T`<p>Un bip émis à \(t_0\) à la distance \(d\) est reçu à \(t_0+d/c\). Le suivant est émis à \(t_0+T_0\) depuis une distance \(d-vT_0\), reçu à \(t_0+T_0+\frac{d-vT_0}{c}\). Période perçue : \(T=T_0\left(1-\frac vc\right)\), donc</p>
      <div class="math">\[f=\frac{f_0}{1-v/c}\]</div>`),
    Q("Valeurs numériques à l'approche, puis quand elle s'éloigne.", 2, T`<p>À l'approche : \(f=\frac{440}{1-20/340}\approx468\) Hz. En s'éloignant (\(v\to-v\)) : \(f=\frac{440}{1+20/340}\approx416\) Hz. Le son paraît plus aigu puis plus grave.</p>`),
    Q("Comparer avec le récepteur mobile à la même vitesse.", 1, T`<p>Récepteur qui se rapproche : \(f=f_0(1+v/c)\approx466\) Hz. Pour \(v\ll c\), les deux formules coïncident au premier ordre ; elles diffèrent à l'ordre 2.</p>`)
  ] });
dsEx({ id: "t-maxwell", ann: null, title: "De Maxwell à l'onde plane", th: "em", cm: ["cm2", "cm4"], dur: 25,
  intro: "Vide, sans charge ni courant (ρ = 0, j = 0).",
  q: [
    Q("Établir l'équation de propagation de E.", 3,
      T`<p>\(\rot(\rot\vec E)=-\pd{}{t}\rot\vec B=-\mu_0\varepsilon_0\pdd{\vec E}{t}\) (Faraday puis Ampère, permutation des dérivées). Et \(\rot(\rot\vec E)=\grad(\dive\vec E)-\Delta\vec E=-\Delta\vec E\) car \(\dive\vec E=0\). D'où</p>
      <div class="math">\[\Delta\vec E-\frac{1}{c^2}\pdd{\vec E}{t}=\vec 0,\qquad c=\frac{1}{\sqrt{\mu_0\varepsilon_0}}\]</div>`),
    Q(T`OPPM \(\vec E=\vec E_0e^{i(\omega t-\vec k\cdot\vec r)}\) : montrer que \(\vec k\cdot\vec E=0\) et \(\vec B=\frac{\vec k\wedge\vec E}{\omega}\).`, 3,
      T`<p>\(\vec\nabla\to-i\vec k\), \(\pd{}{t}\to i\omega\). Gauss : \(-i\vec k\cdot\vec E=0\). Faraday : \(-i\vec k\wedge\vec E=-i\omega\vec B\), donc \(\vec B=\vec k\wedge\vec E/\omega\).</p>`),
    Q(T`En déduire \(\|\vec B\|\) et la structure de l'onde.`, 1, T`<p>\(\vec E\perp\vec k\), d'où \(\|\vec B\|=\frac{k}{\omega}\|\vec E\|=\frac{\|\vec E\|}{c}\). Onde transverse, \((\vec E,\vec B,\vec k)\) trièdre direct, champs en phase.</p>`)
  ] });
dsEx({ id: "t-polar", ann: null, title: "Reconnaître une polarisation", th: "em", cm: ["cm4"], dur: 12,
  intro: T`\(E_x=E_{0x}\cos\omega t\), \(E_y=E_{0y}\cos(\omega t-\varphi)\).`,
  q: [
    Q(T`Nature de la polarisation pour \(\varphi=0\) et \(\varphi=\pi\) ?`, 1, T`<p>Rectiligne : \(E_y/E_x=\pm E_{0y}/E_{0x}\) constant (deux directions symétriques).</p>`),
    Q(T`Pour \(E_{0x}=E_{0y}=E_0\) et \(\varphi=\pi/2\) ?`, 1, T`<p>\(E_y=E_0\sin\omega t\), donc \(E_x^2+E_y^2=E_0^2\) : circulaire.</p>`),
    Q(T`Cas général : retrouver l'équation de l'ellipse.`, 3,
      T`<p>\(\frac{E_y}{E_{0y}}=\cos\omega t\cos\varphi+\sin\omega t\sin\varphi\) avec \(\cos\omega t=\frac{E_x}{E_{0x}}\). On isole \(\sin\omega t\sin\varphi=\frac{E_y}{E_{0y}}-\frac{E_x}{E_{0x}}\cos\varphi\), on élève au carré et on utilise \(\sin^2=1-\cos^2\) :</p>

/* Petit Markdown pour les réponses de Claude (texte échappé, LaTeX conservé). */
function md(src) {
  const lines = esc(src).split(/\n/);
  let html = "", list = null, para = [];
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    const ul = l.match(/^[-•*]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/), hd = l.match(/^#{1,4}\s+(.*)/);
    if (!l) { flushP(); flushL(); continue; }
    if (hd) { flushP(); flushL(); html += `<p><b>${inline(hd[1])}</b></p>`; continue; }
    if (ul || ol) { flushP(); const t = ul ? "ul" : "ol"; if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push((ul || ol)[1]); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return html;
}

/* Synchronisation entre appareils (capacité db de claude.ai), sinon stockage local seul. */
const Cloud = {
  ref: null, busy: false, again: false,
  async init() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/progress");
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.state && (remote.state.updatedAt || 0) > (state.updatedAt || 0)) {
        state = Object.assign(blankState(), JSON.parse(JSON.stringify(remote.state)));
        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* rien */ }
        this.ref = ref;
        listeners.forEach((fn) => fn());
        Router.render();
      } else {
        this.ref = ref;
        if (state.updatedAt) this.push();
      }
    } catch (e) { console.warn("Synchronisation indisponible", e); this.ref = null; }
  },
  async push() {
    const self = Cloud;
    if (!self.ref) return;
    if (self.busy) { self.again = true; return; }
    self.busy = true;
    try { await self.ref.set({ state: JSON.parse(JSON.stringify(state)), updatedAt: state.updatedAt }); }
    catch (e) { if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) self.ref = null; }
    self.busy = false;
    if (self.again) { self.again = false; self.push(); }
  }
};

const ALL_CARDS = [];
for (const d of [...DEMOS, ...COURS]) (EXOS[d.id]?.cards || []).forEach((c, i) => ALL_CARDS.push({ id: d.id + ":" + i, demo: d.id, q: c[0], a: c[1] }));
function cardState(id) { return state.cards[id] || null; }
function dueCards(demoId) {
  const today = dayNum();
  const pool = ALL_CARDS.filter((c) => !demoId || c.demo === demoId);
  const due = pool.filter((c) => { const s = cardState(c.id); return s && s.due <= today; });
  if (state.newDay.day !== today) state.newDay = { day: today, n: 0 };
  const room = demoId ? 99 : Math.max(0, NEW_PER_DAY - state.newDay.n);
  const fresh = pool.filter((c) => !cardState(c.id)).slice(0, room);
  return { due, fresh };
}
function rateCard(id, grade) {
  const today = dayNum();
  const s = state.cards[id] || { b: 0, due: today, n: 0 };
  if (!state.cards[id]) { if (state.newDay.day !== today) state.newDay = { day: today, n: 0 }; state.newDay.n++; }
  if (grade === 2) s.b = Math.min(5, s.b + 1);
  else if (grade === 1) s.b = Math.max(1, s.b);
  else s.b = 0;
  s.due = today + (grade === 1 ? 1 : INTERVALS[s.b]);
  s.n = (s.n || 0) + 1;
  state.cards[id] = s;
  markActive(); save();
}

/* ---------- Maîtrise d'une démo (0 à 100) ---------- */
function mastery(id) {
  const s = demoState(id);
  const cards = ALL_CARDS.filter((c) => c.demo === id);
  const cardScore = cards.length ? cards.reduce((a, c) => a + ((cardState(c.id)?.b || 0) / 5), 0) / cards.length : 0;
  const last = s.colle.length ? s.colle[s.colle.length - 1].score / 20 : 0;
  if (CHAP[id]) return Math.round(100 * (0.55 * cardScore + 0.45 * ((s.qcm || 0) + (s.trous || 0) + (s.vf || 0)) / 3));
  const practice = ((s.qcm || 0) + (s.trous || 0) + (s.ordre || 0)) / 3;
  return Math.round(100 * (0.4 * last + 0.35 * cardScore + 0.25 * practice));
}

/* Préférences d'affichage (onglet par démo…), propres à ce navigateur. */
const Prefs = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem("demos-magneto:pref:" + k)); return v ?? d; } catch (e) { return d; } },

/* ===== components.js ===== */
/* ---------- Composants d'entraînement réutilisables ---------- */
function setHTML(el, html) { mathClear(el); el.innerHTML = html; typeset(el); }
const demoTag = (id) => { const d = UNIT[id]; return `<span class="chip c-${d.color}">${unitLabel(id)} · ${esc(d.short)}</span>`; };
const disp = (tex) => `<div class="math">\\[${tex}\\]</div>`;

/* Cartes mémo : retourner, puis s'auto-évaluer (Oublié / Hésitant / Su). */
function FlashSession(el, cards, opts = {}) {
  let queue = cards.slice(), i = 0, flipped = false, relearn = new Set();
  const tally = [0, 0, 0];
  function render() {
    if (i >= queue.length) return end();
    const c = queue[i];
    setHTML(el, `
      <div class="row-between"><span class="eyebrow">Carte ${i + 1} / ${queue.length}</span>${opts.showDemo ? demoTag(c.demo) : ""}</div>
      <div class="progress-line"><i style="width:${(100 * i) / queue.length}%"></i></div>
      <div class="flip c-${UNIT[c.demo].color} ${flipped ? "on" : ""}" id="flip" role="button" tabindex="0" aria-label="Retourner la carte">
        <div class="flip-in">
          <div class="face front"><span class="eyebrow">Question</span><div class="q">${c.q}</div><span class="hint">Espace ou clic pour retourner</span></div>
          <div class="face back"><span class="eyebrow">Réponse</span><div class="q">${c.a}</div></div>
        </div>
      </div>
      <div class="rate" ${flipped ? "" : "hidden"}>
        <button class="btn b-no" data-g="0">${icon("cross")}Oublié <span class="kbd">1</span></button>
        <button class="btn b-mid" data-g="1">${icon("half")}Hésitant <span class="kbd">2</span></button>
        <button class="btn b-ok" data-g="2">${icon("check")}Su <span class="kbd">3</span></button>
      </div>
      <div class="row" ${flipped ? "hidden" : ""}><button class="btn btn-main" id="flipbtn">${icon("eye")}Voir la réponse</button></div>`);
    $("#flip", el).onclick = flip;
    const fb = $("#flipbtn", el); if (fb) fb.onclick = flip;
    $$("[data-g]", el).forEach((b) => (b.onclick = () => rate(+b.dataset.g)));
  }
  function flip() { flipped = !flipped; $("#flip", el).classList.toggle("on", flipped); $(".rate", el).hidden = !flipped; const r = $("#flipbtn", el)?.parentElement; if (r) r.hidden = flipped; }
  function rate(g) {
    const c = queue[i];
    rateCard(c.id, g); tally[g]++;
    if (g === 0 && !relearn.has(c.id)) { relearn.add(c.id); queue.push(c); }
    i++; flipped = false; render();
  }
  function end() {
    setHTML(el, `<div class="empty"><span class="eyebrow">Session terminée</span>
      <div class="scorebig">${tally[2]}<span class="muted" style="font-size:.45em"> sues</span></div>
      <p>${tally[1]} hésitante${tally[1] > 1 ? "s" : ""} · ${tally[0]} oubliée${tally[0] > 1 ? "s" : ""}. Les cartes oubliées reviendront demain, les cartes sues dans quelques jours.</p>
      <div class="row">${opts.again ? `<button class="btn btn-main" id="again">${icon("reset")}Recommencer</button>` : ""}</div></div>`);
    const a = $("#again", el); if (a) a.onclick = opts.again;
    opts.onDone && opts.onDone(tally);
  }
  function key(e) {
    if (!el.isConnected || e.target.closest("input, textarea")) return;
    if (e.code === "Space" && i < queue.length) { e.preventDefault(); flip(); }
    else if (flipped && ["Digit1", "Digit2", "Digit3", "Numpad1", "Numpad2", "Numpad3"].includes(e.code)) rate(+e.code.slice(-1) - 1);
  }
  document.addEventListener("keydown", key);
  if (!queue.length) setHTML(el, `<div class="empty"><b>Rien à réviser pour l'instant.</b><p>Toutes tes cartes sont à jour. Reviens demain, ou entraîne-toi avec un autre mode.</p></div>`);
  else render();
  return () => document.removeEventListener("keydown", key);
}

/* Questions à choix : QCM, textes à trous, vrai ou faux (bonne option = première dans les données). */
function buildQ(kind, unit, idx) {
  const it = EXOS[unit][kind][idx], base = { kind, unit, idx };
  if (kind === "qcm") return { ...base, prompt: `<div class="qprompt">${it[0]}</div>`, opts: shuffle(it[1].map((o, k) => ({ html: o, ok: k === 0 }))), why: it[2] };
  if (kind === "vf") return { ...base, prompt: `<span class="eyebrow">Vrai ou faux ?</span><div class="qprompt">${it[0]}</div>`, opts: [{ html: "Vrai", ok: it[1] }, { html: "Faux", ok: !it[1] }], why: `<b>${it[1] ? "Vrai" : "Faux"}.</b> ${it[2]}` };
  return { ...base, prompt: `<div class="qprompt">Complète la formule :</div>${disp(it[0])}`, opts: shuffle(it[1].map((o, k) => ({ html: `\\(${o}\\)`, ok: k === 0 }))), full: it[0].replace("\\boxed{\;?\;}", "\\boxed{" + it[1][0] + "}") };
}
const questionsOf = (unit, kind) => ((EXOS[unit] || {})[kind] || []).map((_, i) => buildQ(kind, unit, i));
const KIND_LABEL = { qcm: "Question", trous: "Trou", vf: "Affirmation" };

function ChoiceGame(el, unitId, kind, opts = {}) {
  const items = opts.items ? opts.items.slice() : shuffle(questionsOf(unitId, kind));
  let i = 0, good = 0;
  function render() {
    if (i >= items.length) return end();
    const it = items[i];
    setHTML(el, `<div class="row-between"><span class="eyebrow">${KIND_LABEL[kind] || "Question"} ${i + 1} / ${items.length}</span><span class="row">${opts.showUnit ? demoTag(it.unit) : ""}<span class="chip chip-plain mono">${good} juste${good > 1 ? "s" : ""}</span></span></div>
      <div class="progress-line"><i style="width:${(100 * i) / items.length}%"></i></div>
      ${it.prompt}
      <div class="options">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${o.html}</button>`).join("")}</div>
      <div id="fb"></div>`);
    $$(".opt", el).forEach((b) => (b.onclick = () => pick(+b.dataset.k)));
  }
  function pick(k) {
    const it = items[i], ok = it.opts[k].ok;
    if (ok) good++;
    noteAnswer(it.kind, it.unit, it.idx, ok);
    $$(".opt", el).forEach((b, j) => { b.disabled = true; if (it.opts[j].ok) b.classList.add("right"); else if (j === k) b.classList.add("bad"); });
    setHTML($("#fb", el), `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "Exact !" : "Pas tout à fait."}</b>${it.why ? `<span>${it.why}</span>` : ""}${it.full ? disp(it.full) : ""}</div>
      <div class="row" style="margin-top:12px"><button class="btn btn-main" id="nx">${i + 1 < items.length ? "Suivant" : "Voir mon score"}${icon("next")}</button></div>`);
    $("#nx", el).onclick = () => { i++; render(); };
    $("#nx", el).focus({ preventScroll: true });
  }
  function end() {
    const ratio = items.length ? good / items.length : 0;
    if (unitId && kind && !opts.items) recordBest(unitId, kind, ratio); else { markActive(); save(); }
    if (opts.onEnd) return opts.onEnd(good, items.length);
    setHTML(el, `<div class="empty"><span class="eyebrow">Score</span><div class="scorebig">${good} / ${items.length}</div>
      <p>${ratio === 1 ? "Parfait, aucune erreur !" : ratio >= .6 ? "Bien. Refais une passe pour viser le sans-faute." : "Relis la fiche ou le pas à pas, puis réessaie."} ${missCount() ? `Tes erreurs sont gardées dans <b>Suivi → Mes erreurs</b>.` : ""}</p>
      <div class="row"><button class="btn btn-main" id="again">${icon("reset")}Recommencer</button></div></div>`);
    $("#again", el).onclick = () => (opts.again ? opts.again() : ChoiceGame(el, unitId, kind, opts));
  }
  if (!items.length) setHTML(el, `<div class="empty">Aucune question ici pour l'instant.</div>`); else render();
}

/* Questions du colleur : la question, puis la réponse, puis « je savais / je ne savais pas ». */
function ColleurGame(el, demoId) {
  const list = shuffle((COLLEUR[demoId] || []).map((c, idx) => ({ q: c[0], a: c[1], idx })));
  let i = 0, good = 0, shown = false;
  function render() {
    if (i >= list.length) return end();
    const it = list[i];
    setHTML(el, `<div class="row-between"><span class="eyebrow">Question du colleur ${i + 1} / ${list.length}</span><span class="chip chip-plain mono">${good} sue${good > 1 ? "s" : ""}</span></div>
      <div class="progress-line"><i style="width:${(100 * i) / list.length}%"></i></div>
      <div class="msg prof" style="max-width:100%"><span class="who">Colleur</span><div class="qprompt">${it.q}</div></div>
      <p class="muted small" ${shown ? "hidden" : ""}>Réponds à voix haute, puis révèle la réponse.</p>
      <div class="feedback ok" ${shown ? "" : "hidden"}><b>Réponse attendue</b><span>${it.a}</span></div>
      <div class="row">${shown ? `<button class="btn b-ok" data-r="1">${icon("check")}Je savais</button><button class="btn b-no" data-r="0">${icon("cross")}Je ne savais pas</button>` : `<button class="btn btn-main" id="show">${icon("eye")}Voir la réponse</button>`}</div>`);
    const s = $("#show", el); if (s) s.onclick = () => { shown = true; render(); };
    $$("[data-r]", el).forEach((b) => (b.onclick = () => { const ok = b.dataset.r === "1"; if (ok) good++; noteAnswer("colleur", demoId, it.idx, ok); i++; shown = false; render(); }));
  }
  function end() {
    recordBest(demoId, "colleur", list.length ? good / list.length : 0);
    setHTML(el, `<div class="empty"><span class="eyebrow">Fin de l'interrogation</span><div class="scorebig">${good} / ${list.length}</div><p>Les questions ratées reviennent dans <b>Suivi → Mes erreurs</b>.</p>
      <div class="row"><button class="btn btn-main" id="again">${icon("reset")}Recommencer</button></div></div>`);
    $("#again", el).onclick = () => ColleurGame(el, demoId);
  }
  render();
}

/* Remettre les étapes dans l'ordre : toucher l'étape suivante. */
function OrderGame(el, demo) {
  const steps = demo.steps.map((s, k) => ({ k, t: s.t }));
  let pool = shuffle(steps), next = 0, mistakes = 0;
  function render() {
    const placed = steps.slice(0, next);
    setHTML(el, `<div class="row-between"><span class="eyebrow">Étape ${Math.min(next + 1, steps.length)} / ${steps.length}</span><span class="chip chip-plain mono">${mistakes} erreur${mistakes > 1 ? "s" : ""}</span></div>
      <div class="progress-line"><i style="width:${(100 * next) / steps.length}%"></i></div>
      <p class="muted small">Touche les étapes dans l'ordre de la démonstration.</p>
      <div class="tiles">${placed.map((s) => `<div class="tile placed"><span class="k">${String(s.k + 1).padStart(2, "0")}</span>${esc(s.t)}</div>`).join("")}</div>
      ${next < steps.length ? `<div class="tiles">${pool.map((s) => `<button class="tile" data-k="${s.k}"><span class="k">?</span>${esc(s.t)}</button>`).join("")}</div>` : ""}
      <div id="end"></div>`);
    $$("button.tile", el).forEach((b) => (b.onclick = () => tap(+b.dataset.k, b)));
    if (next >= steps.length) end();
  }
  function tap(k, b) {
    if (k === next) { pool = pool.filter((s) => s.k !== k); next++; render(); }
    else { mistakes++; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); $(".chip.mono", el).textContent = `${mistakes} erreur${mistakes > 1 ? "s" : ""}`; }
  }
  function end() {
    const ratio = Math.max(0, 1 - mistakes / steps.length);
    recordBest(demo.id, "ordre", ratio);
    setHTML($("#end", el), `<div class="feedback ${mistakes ? "no" : "ok"}"><b>${mistakes ? `Terminé avec ${mistakes} erreur${mistakes > 1 ? "s" : ""}.` : "Sans faute !"}</b><span>Le plan est en place. Essaie maintenant de retrouver la formule de chaque étape en mode « Masquer les formules ».</span></div>
      <div class="row" style="margin-top:12px"><button class="btn btn-main" id="again">${icon("shuffle")}Mélanger à nouveau</button></div>`);
    $("#again", el).onclick = () => OrderGame(el, demo);
  }
  render();
}

/* Trouve l'erreur : une copie, une ligne fausse. */
function ErrorGame(el, items, demoId) {
  const list = shuffle(items);
  let i = 0, good = 0;
  function render() {
    if (i >= list.length) return end();
    const it = list[i], d = DEMO[it.d];
    setHTML(el, `<div class="row-between"><span class="eyebrow">Copie ${i + 1} / ${list.length}</span><span class="row">${demoTag(it.d)}<span class="chip chip-plain">${it.src === "notes" ? "Erreur des notes" : "Piège classique"}</span></span></div>
      <div class="progress-line"><i style="width:${(100 * i) / list.length}%"></i></div>
      <div class="paper"><div class="hand">${esc(d.title)}</div>
        ${it.lines.map((l, k) => `<button class="pline" data-k="${k}">\\(\\displaystyle ${l[0]}\\)</button>`).join("")}
      </div>
      <p class="muted small">Une seule ligne est fausse. Touche-la.</p>
      <div id="fb"></div>`);
    $$(".pline", el).forEach((b) => (b.onclick = () => pick(+b.dataset.k)));
  }
  function pick(k) {
    const it = list[i], ok = !!it.lines[k][1];
    if (ok) good++;
    $$(".pline", el).forEach((b, j) => { b.disabled = true; if (it.lines[j][1]) b.classList.add(ok ? "right" : "culprit"); else if (j === k) b.classList.add("bad"); });
    setHTML($("#fb", el), `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "Bien vu !" : "Raté : l'erreur est surlignée."}</b><span>Correction :</span>${disp(it.fix)}<span>${it.why}</span></div>
      <div class="row" style="margin-top:12px"><button class="btn btn-main" id="nx">${i + 1 < list.length ? "Copie suivante" : "Voir mon score"}${icon("next")}</button></div>`);
    $("#nx", el).onclick = () => { i++; render(); };
  }
  function end() {
    const ratio = list.length ? good / list.length : 0;
    if (demoId) recordBest(demoId, "err", ratio); else { markActive(); save(); }
    setHTML(el, `<div class="empty"><span class="eyebrow">Score</span><div class="scorebig">${good} / ${list.length}</div>
      <p>${ratio === 1 ? "Œil de lynx. Aucun piège ne t'échappe." : "Relis les pièges ratés : ce sont exactement ceux qu'un colleur repère."}</p>
      <div class="row"><button class="btn btn-main" id="again">${icon("reset")}Recommencer</button></div></div>`);
    $("#again", el).onclick = () => ErrorGame(el, items, demoId);
  }
  if (!list.length) setHTML(el, `<div class="empty">Pas de copie piégée pour cette démo.</div>`); else render();
}

/* Récitation progressive : la démo entière, avec de plus en plus de formules cachées. */
function RecitGame(el, demo) {
  const blocks = demo.steps.flatMap((s, k) => s.m.map((m, j) => ({ k, j })));
  const order = shuffle(blocks.map((_, i) => i));
  const LEVELS = [0, 0.25, 0.5, 0.75, 1];
  let level = 0;
  function render() {
    const hidden = new Set(order.slice(0, Math.round(LEVELS[level] * blocks.length)));
    let n = -1;
    setHTML(el, `<div class="row-between"><span class="eyebrow">Niveau ${level + 1} / ${LEVELS.length} · ${Math.round(LEVELS[level] * 100)} % des formules cachées</span>
        <div class="row">${level > 0 ? `<button class="btn btn-ghost btn-sm" id="down">${icon("prev")}Plus facile</button>` : ""}${level < LEVELS.length - 1 ? `<button class="btn btn-main btn-sm" id="up">Niveau suivant${icon("next")}</button>` : ""}</div></div>
      <div class="progress-line"><i style="width:${(100 * level) / (LEVELS.length - 1)}%"></i></div>
      <p class="muted small">Récite la démo à voix haute, en entier. Une formule floutée : dis-la de tête, puis touche-la pour vérifier.</p>
      <div class="steps recall">${demo.steps.map((s, k) => `<article class="step glass"><span class="sn">${k + 1}</span><h3>${esc(s.t)}</h3><div class="body">${s.m.map(() => { n++; return `<div class="math ${hidden.has(n) ? "" : "shown"}">\\[${s.m[blocks[n].j]}\\]</div>`; }).join("")}</div></article>`).join("")}</div>
      ${level === LEVELS.length - 1 ? `<div class="feedback ok"><b>Dernier niveau</b><span>Toutes les formules sont cachées. Si tu passes ce niveau sans regarder, la démo est sue : passe à la colle blanche !</span></div>` : ""}`);
    $$(".math", el).forEach((m) => (m.onclick = () => m.classList.add("shown")));
    const up = $("#up", el), down = $("#down", el);
    if (up) up.onclick = () => { level++; markActive(); save(); render(); el.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); };
    if (down) down.onclick = () => { level--; render(); };
  }
  render();
}

/* Comprendre : pas à pas, formules masquables pour s'auto-tester. */
function tabLearn(box, d) {
  let shown = clamp(Prefs.get("shown:" + d.id, 1), 1, d.steps.length);
  let all = Prefs.get("all:" + d.id, false), recall = Prefs.get("recall", false);
  box.innerHTML = `
  <div class="split" style="margin-block:22px">
    <section class="glass panel"><span class="eyebrow">Point de départ</span><div class="math">\\[${d.start}\\]</div>
      <div class="row"><label class="toggle"><input type="checkbox" id="recall" ${recall ? "checked" : ""}> Masquer les formules (je les retrouve de tête)</label></div>
      <div class="row"><label class="toggle"><input type="checkbox" id="all" ${all ? "checked" : ""}> Tout afficher d'un coup</label></div>
    </section>
    <section class="glass panel"><span class="eyebrow">Plan de la démo</span><ol class="plan">${d.steps.map((s) => `<li>${esc(s.t)}</li>`).join("")}</ol></section>
  </div>
  <div class="steps ${recall ? "recall" : ""}" id="steps"></div>
  <div class="row" id="stepnav" style="margin-top:16px"></div>`;
  const steps = $("#steps", box), nav = $("#stepnav", box);
  function render() {
    const n = all ? d.steps.length : shown;
    mathClear(steps);
    steps.innerHTML = d.steps.slice(0, n).map((s, k) => stepHTML(d, s, k)).join("") +
      (n < d.steps.length ? `<div class="locked-step glass">${icon("eye")}<span>Encore ${d.steps.length - n} étape${d.steps.length - n > 1 ? "s" : ""}. Essaie de deviner la suivante avant de la révéler.</span></div>` : "");
    typeset(steps); glossify(steps);
    nav.innerHTML = all ? `<button class="btn btn-main" data-tabgo="colle">${icon("timer")}Passer à la colle blanche</button>` : n < d.steps.length
      ? `<button class="btn btn-main" id="nx">Étape suivante${icon("next")}</button>${n > 1 ? `<button class="btn btn-ghost" id="pv">${icon("prev")}Masquer la dernière</button>` : ""}<span class="small muted">Raccourcis : <span class="kbd">→</span> <span class="kbd">←</span></span>`
      : `<button class="btn btn-main" data-tabgo="colle">${icon("timer")}Démo terminée : passer à la colle blanche</button><button class="btn btn-ghost" id="rs">${icon("reset")}Recommencer le pas à pas</button>`;
    const nx = $("#nx", nav), pv = $("#pv", nav), rs = $("#rs", nav);
    if (nx) nx.onclick = () => step(1);
    if (pv) pv.onclick = () => step(-1);
    if (rs) rs.onclick = () => { shown = 1; Prefs.set("shown:" + d.id, 1); render(); window.scrollTo({ top: steps.offsetTop - 90, behavior: "smooth" }); };
    const tg = $("[data-tabgo]", nav); if (tg) tg.onclick = () => $(`[data-tab="colle"]`).click();
  }
  function step(dir) {
    if (all) return;
    shown = clamp(shown + dir, 1, d.steps.length); Prefs.set("shown:" + d.id, shown); render();
    if (dir > 0) { const last = $$(".step", steps).pop(); if (last) last.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "center" }); }
  }
  $("#recall", box).onchange = (e) => { recall = e.target.checked; Prefs.set("recall", recall); steps.classList.toggle("recall", recall); $$(".math", steps).forEach((m) => m.classList.remove("shown")); };
  $("#all", box).onchange = (e) => { all = e.target.checked; Prefs.set("all:" + d.id, all); render(); };
  steps.addEventListener("click", (e) => {
    const m = e.target.closest(".math"); if (m && steps.classList.contains("recall")) m.classList.add("shown");
    const ex = e.target.closest("[data-explain]"); if (ex) AI.explain(d, d.steps[+ex.dataset.explain], $("#ai-" + ex.dataset.explain, steps), ex);
  });
  const key = (e) => { if (e.target.closest("input, textarea, button")) return; if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); };
  document.addEventListener("keydown", key);
  render();
  return () => document.removeEventListener("keydown", key);
}

function tabColle(box, d) {
  const ds = demoState(d.id);
  let dur = Prefs.get("dur:" + d.id, d.minutes) * 60, t0 = 0, elapsed = 0, running = false, timer = null, hints = 0, phase = "prep", evals = d.steps.map(() => -1), alerted = false;

    <section class="glass timer">
      <span class="eyebrow">Chronomètre</span>
      <div class="timer-ring"><svg viewBox="0 0 210 210"><circle class="track" cx="105" cy="105" r="${R}" fill="none" stroke-width="12"/><circle class="val" id="tv" cx="105" cy="105" r="${R}" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/></svg>
        <div class="digits"><b id="dg">00:00</b><span id="dl">temps restant</span></div></div>
      <div class="dur-pick" id="dp">${[5, 8, 10, 12, 15].map((m) => `<button data-m="${m}" aria-pressed="${dur === m * 60}">${m} min</button>`).join("")}</div>
      <div class="row" style="justify-content:center"><button class="btn btn-main" id="go">${icon("play")}Démarrer</button><button class="btn btn-ghost" id="hint">Coup de pouce</button></div>
      <div id="hints" class="small" style="display:grid;gap:6px;text-align:left;width:100%"></div>
    </section>
    <section class="glass panel" id="stage"></section>
  </div>
  <section class="glass panel needs-ai" id="aibox" style="margin-top:20px"></section>
  <section class="glass panel no-ai" style="margin-top:20px"><span class="eyebrow">Correction par Claude</span><p class="muted small">Ouvre cette page sur claude.ai pour faire corriger ta copie (texte ou photo) par Claude et passer une colle orale simulée.</p></section>`;
  const stage = $("#stage", box);
  const fmt = (s) => { const a = Math.abs(Math.round(s)); return `${s < 0 ? "+" : ""}${String(Math.floor(a / 60)).padStart(2, "0")}:${String(a % 60).padStart(2, "0")}`; };
  function tick() {
    const now = running ? elapsed + (Date.now() - t0) / 1000 : elapsed, left = dur - now;
    $("#dg", box).textContent = fmt(left);
    $("#dl", box).textContent = left >= 0 ? "temps restant" : "dépassement";
    $("#dg", box).style.color = left < 0 ? "var(--rose-ink)" : "";
    $("#tv", box).style.strokeDashoffset = (C * (1 - clamp(now / dur, 0, 1))).toFixed(1);
    if (left < 0 && !alerted) { alerted = true; toast("Temps écoulé ! Termine ta phrase et conclus."); }
  }
  function toggle() {
    if (phase === "prep") { phase = "run"; renderStage(); }
    if (running) { elapsed += (Date.now() - t0) / 1000; running = false; clearInterval(timer); }
    else { t0 = Date.now(); running = true; timer = setInterval(tick, 250); markActive(); }

  $("#go", box).onclick = toggle;

  };
  function renderStage() {
    mathClear(stage);
    if (phase === "prep") stage.innerHTML = `<span class="eyebrow">Avant de commencer</span><h2 style="font-size:1.3rem">${esc(d.title)}</h2>
      <p>${esc(d.pitch)}</p>

      <div class="row"><button class="btn btn-main" id="go2">${icon("play")}Lancer la colle</button></div>`;
    else if (phase === "run") stage.innerHTML = `<span class="eyebrow">Colle en cours</span><h2 style="font-size:1.3rem">${esc(d.title)}</h2>
      <p class="muted">Rédige la démonstration de tête. Commence par les hypothèses : ${d.hyp.map((h) => h.replace(/<[^>]+>/g, "")).join(" ; ")}.</p>
      <div class="math">\\[${d.start}\\]</div>
      <div class="row"><button class="btn btn-main" id="done">${icon("check")}J'ai terminé</button></div>`;
    else if (phase === "eval") stage.innerHTML = `<span class="eyebrow">Auto-évaluation</span><h2 style="font-size:1.3rem">Compare avec la correction</h2>
      <p class="muted small">Pour chaque étape : <b>su</b> (juste et justifiée), <b>hésitant</b> (oubli ou erreur de signe), <b>oublié</b>. Touche le titre pour voir la correction.</p>
      <div style="display:grid;gap:10px">${d.steps.map((s, k) => `<div class="eval-row"><div class="t"><button class="btn btn-ghost btn-sm" style="justify-self:start" data-peek="${k}">${k + 1}. ${esc(s.t)}</button><div id="pk-${k}" hidden>${s.m.map((m) => `<div class="math">\\[${m}\\]</div>`).join("")}</div></div>
        <div class="tri" role="group" aria-label="Évaluation de l'étape ${k + 1}"><button class="e2" data-e="2" data-k="${k}" aria-pressed="${evals[k] === 2}" title="Su">${icon("check")}</button><button class="e1" data-e="1" data-k="${k}" aria-pressed="${evals[k] === 1}" title="Hésitant">${icon("half")}</button><button class="e0" data-e="0" data-k="${k}" aria-pressed="${evals[k] === 0}" title="Oublié">${icon("cross")}</button></div></div>`).join("")}</div>
      <div class="row"><button class="btn btn-main" id="val" ${evals.includes(-1) ? "disabled" : ""}>${icon("check")}Calculer ma note</button><span class="small muted" id="left">${evals.filter((e) => e < 0).length} étape(s) à évaluer</span></div>`;
    else resultStage();
    const g2 = $("#go2", stage); if (g2) g2.onclick = toggle;
    const dn = $("#done", stage); if (dn) dn.onclick = () => { stopClock(); phase = "eval"; renderStage(); };
    $$("[data-peek]", stage).forEach((b) => (b.onclick = () => { const p = $("#pk-" + b.dataset.peek, stage); p.hidden = !p.hidden; }));
    $$("[data-e]", stage).forEach((b) => (b.onclick = () => {
      evals[+b.dataset.k] = +b.dataset.e;

      const left = evals.filter((e) => e < 0).length; $("#left", stage).textContent = `${left} étape(s) à évaluer`; $("#val", stage).disabled = left > 0;
    }));
    const v = $("#val", stage); if (v) v.onclick = () => {
      const raw = (20 * evals.reduce((a, e) => a + e, 0)) / (2 * evals.length) - 0.5 * hints;
      const score = Math.max(0, Math.round(raw * 2) / 2);
      ds.colle.push({ t: Date.now(), score, dur: Math.round(elapsed), hints }); ds.colle = ds.colle.slice(-30);
      markActive(); save(); phase = "done"; renderStage();
    };
    typeset(stage);
  }
  function resultStage() {
    const last = ds.colle[ds.colle.length - 1], weak = d.steps.map((s, k) => [s, k]).filter(([, k]) => evals[k] < 2);
    const hist = ds.colle.slice(-10);

      <div class="row" style="gap:20px"><div class="scorebig">${last.score.toFixed(1).replace(".", ",")}<span class="muted" style="font-size:.4em"> / 20</span></div>
      <div class="small muted">Durée ${fmt(last.dur)} · ${last.hints} coup${last.hints > 1 ? "s" : ""} de pouce<br>${last.score >= 16 ? "Prêt pour la colle." : last.score >= 12 ? "Solide, quelques étapes à consolider." : "Reprends le pas à pas sur les étapes ratées."}</div></div>
      <div><span class="eyebrow">Tes ${hist.length} dernières colles</span><div class="hist">${hist.map((c) => `<i style="height:${Math.max(6, c.score * 5)}%" title="${c.score}/20"></i>`).join("")}</div></div>
      ${weak.length ? `<div style="display:grid;gap:8px"><span class="eyebrow">À retravailler</span>${weak.map(([s, k]) => `<div class="trap" style="background:var(--sun-soft);border-color:var(--sun)"><b class="lab" style="color:var(--sun-ink)">Étape ${k + 1}</b><span>${esc(s.t)}</span></div>`).join("")}</div>` : `<p>Toutes les étapes sont sues. Bravo !</p>`}
      <div class="row"><button class="btn btn-main" id="again">${icon("reset")}Nouvelle colle</button><button class="btn" data-tabgo2="learn">${icon("book")}Revoir le pas à pas</button></div>`;
    $("#again", stage).onclick = () => { phase = "prep"; elapsed = 0; hints = 0; alerted = false; evals = d.steps.map(() => -1); $("#hints", box).innerHTML = ""; $("#go", box).innerHTML = `${icon("play")}Démarrer`; tick(); renderStage(); };
    $("[data-tabgo2]", stage).onclick = () => $(`[data-tab="learn"]`).click();
  }
  renderStage(); tick();
  AI.correctionPanel($("#aibox", box), d);
  return () => { clearInterval(timer); AI.abortAll(); };
}

  function bubble(role, html) {

/* ---------- Glossaire cliquable ---------- */
const GL_TERMS = Object.keys(GLOSSAIRE).sort((a, b) => b.length - a.length);
const GL_RE = new RegExp("(" + GL_TERMS.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "i");
function glossify(root) {
  if (!root) return;
  $$(".why, .fiche-x, .faq-a", root).forEach((box) => {
    const seen = new Set();
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentElement.closest("mjx-container, .gl, button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      const m = n.nodeValue.match(GL_RE); if (!m) continue;
      const term = GL_TERMS.find((t) => t.toLowerCase() === m[1].toLowerCase());
      if (!term || seen.has(term)) continue; seen.add(term);
      const after = n.splitText(m.index); after.nodeValue = after.nodeValue.slice(m[1].length);
      const b = document.createElement("button"); b.className = "gl"; b.type = "button"; b.dataset.term = term; b.textContent = m[1];
      n.parentNode.insertBefore(b, after);
    }
  });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".gl"); const old = $("#gl-pop");
  if (old && !e.target.closest("#gl-pop")) old.remove();
  if (!b) return;
  const p = document.createElement("div"); p.id = "gl-pop"; p.className = "gl-pop glass glass-strong"; p.setAttribute("role", "dialog");
  p.innerHTML = `<b>${esc(b.dataset.term)}</b><span>${esc(GLOSSAIRE[b.dataset.term])}</span>`;
  document.body.append(p);
  const r = b.getBoundingClientRect(), w = Math.min(300, innerWidth - 32);
  p.style.width = w + "px"; p.style.left = clamp(r.left + scrollX, 16 + scrollX, scrollX + innerWidth - w - 16) + "px"; p.style.top = (r.bottom + scrollY + 8) + "px";
});

/* ---------- Ordres de grandeur ---------- */
function parseNum(s) {
  let t = String(s).trim().replace(/\s/g, "").replace(/,/g, ".").replace(/[×x·*]10\^?/i, "e").replace(/^10\^?/, "1e").replace(/⁻/g, "-");
  t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c));
  const v = Number(t); return Number.isFinite(v) && v > 0 ? v : null;
}
const sci = (v) => { if (v >= 0.01 && v < 1e5) return fr(v, v < 10 ? 2 : 0).replace(/,00$/, ""); const e = Math.floor(Math.log10(v)), m = v / 10 ** e; return `${fr(m, 2).replace(/,00$/, "")}·10${String(e).split("").map((c) => (c === "-" ? "⁻" : "⁰¹²³⁴⁵⁶⁷⁸⁹"[c])).join("")}`; };
Views.grandeurs = function (app) {

    <p class="muted">Tape une valeur (par exemple <span class="mono">340</span>, <span class="mono">3e8</span> ou <span class="mono">3·10^8</span>) dans l'unité indiquée. On demande un ordre de grandeur : une petite marge est acceptée.</p></section>
    <section class="glass game c-sun" id="og"></section>`;
  const el = $("#og"), list = shuffle(GRANDEURS.map((g, idx) => ({ ...g, idx })));
  let i = 0, good = 0;
  function render() {
    if (i >= list.length) return end();

    el.innerHTML = `<div class="row-between"><span class="eyebrow">Grandeur ${i + 1} / ${list.length}</span><span class="chip chip-plain mono">${good} juste${good > 1 ? "s" : ""}</span></div>

      const r = Math.max(v / g.v, g.v / v), ok = r <= g.tol, close = !ok && r <= 10;
      if (ok) good++;

function weightedPick(list) {
  const w = list.map((d) => 1 + (100 - mastery(d.id)) / 25);
  let r = Math.random() * w.reduce((a, b) => a + b, 0), k = 0;
  while (k < list.length - 1 && r > w[k]) { r -= w[k]; k++; }
  return list[k];
}

  return { score, why };
}
/* Sélection du jour : 3 vidéos, stable toute la journée (départage par date + identifiant). */
function todayPicks(n = 3) {
  const day = dayNum();
  const ranked = SHORTS.map((s) => { const p = shortPriority(s); const h = [...(s.id + day)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 9973, 0); return { s, ...p, tie: h / 9973 }; })
    .sort((a, b) => b.score - a.score || a.tie - b.tie);
  return ranked.slice(0, n);
}

/* ---------- Révision partiel : annales corrigées, exercices type DS, DS blanc ----------
   Chaque question : énoncé, barème, indice, correction (avec les coquilles des corrigés officiels),
   puis auto-évaluation Juste / À moitié / Faux. Les notions qui dépassent les démos vues sont
   rangées à part (« Notion en plus ») et ne comptent que si on les inclut. */
const qBey = (ex, i) => !!ex.beyond || ex.qb.includes(i);
const dsIncl = () => Prefs.get("ds:incl", false);
const dsCount = (ex, i, incl) => incl || !qBey(ex, i);
const dsMax = (ex, incl) => ex.q.reduce((a, q, i) => a + (dsCount(ex, i, incl) ? q.pts : 0), 0);
function dsRec(id) { if (!state.ds) state.ds = {}; if (!state.ds[id]) state.ds[id] = { marks: {}, best: null, t: 0 }; return state.ds[id]; }
const dsScore = (ex, marks, incl) => ex.q.reduce((a, q, i) => a + (dsCount(ex, i, incl) && marks[i] != null ? q.pts * marks[i] : 0), 0);
const dsDone = (ex, marks, incl) => ex.q.every((q, i) => !dsCount(ex, i, incl) || marks[i] != null);
const half = (x) => Math.round(x * 2) / 2;
const exSrc = (ex) => (ex.ann ? "Annale · " + ANNALE[ex.ann].title.replace(/^Contrôle d(e |')/, "") : "Exercice type DS");

/* Affiche un exercice. mode : "train" (indice et correction à la demande), "sujet" (énoncé seul), "corr" (correction ouverte). */
function mountEx(el, ex, { mode = "train", marks = dsRec(ex.id).marks, onChange = () => {}, persist = true } = {}) {
  const incl = dsIncl();
  const pts = (q) => `${fr(q.pts, q.pts % 1 ? 1 : 0)} pt${q.pts > 1 ? "s" : ""}`;
  el.innerHTML = `<article class="glass panel ds-ex c-${CHAP[ex.cm[0]]?.color || "lav"}">
    <div class="row-between"><div><span class="eyebrow">${esc(exSrc(ex))} · ${esc(DS_THEMES[ex.th])} · ~${ex.dur} min</span><h2 style="font-size:1.2rem">${esc(ex.title)}</h2></div>
      <div class="row">${ex.beyond ? `<span class="chip c-sun" title="${esc(ex.beyond)}">Notion en plus</span>` : ""}<span class="chip chip-plain mono" data-sc></span></div></div>
    ${ex.beyond ? `<p class="small muted">${esc(ex.beyond)}${incl ? "" : " Non compté dans la note (active « Inclure les notions en plus » pour le compter)."}</p>` : ""}
    <div class="ds-intro">${ex.intro}</div>
    <ol class="ds-qs">${ex.q.map((q, i) => `<li class="ds-q${qBey(ex, i) && !ex.beyond ? " bey" : ""}${dsCount(ex, i, incl) ? "" : " off"}">
      <div class="ds-qh"><div class="ds-qt">${q.q}</div><span class="chip chip-plain mono">${pts(q)}</span></div>
      ${qBey(ex, i) && !ex.beyond ? `<span class="small ds-bey">Notion en plus · ${esc(ex.qbWhy)}</span>` : ""}
      ${mode === "sujet" ? "" : `<div class="row ds-act">${q.hint && mode === "train" ? `<button class="btn btn-ghost btn-sm" data-hint="${i}">${icon("spark")}Indice</button>` : ""}<button class="btn btn-sm" data-sol="${i}">${icon("eye")}${mode === "corr" ? "Masquer" : "Voir"} la correction</button></div>
        ${q.hint ? `<div class="feedback ds-hint" data-h="${i}" hidden><b>Indice</b><span>${q.hint}</span></div>` : ""}
        <div class="ds-sol" data-s="${i}" ${mode === "corr" ? "" : "hidden"}>${q.sol}${q.err ? `<div class="trap"><b class="lab">Coquille dans le sujet ou le corrigé officiel</b><span>${q.err}</span></div>` : ""}
          ${dsCount(ex, i, incl) ? `<div class="ds-mark"><span class="small muted">Ma réponse :</span><div class="tri">${[[1, "e2", "check", "Juste"], [0.5, "e1", "half", "À moitié"], [0, "e0", "cross", "Faux"]].map(([v, c, ic, t]) => `<button class="${c}" data-m="${i}" data-v="${v}" aria-pressed="${marks[i] === v}" title="${t}">${icon(ic)}</button>`).join("")}</div></div>` : ""}</div>`}
    </li>`).join("")}</ol>
    ${mode === "train" ? `<div class="needs-ai ds-ai"><button class="btn btn-sm" data-ai>${icon("spark")}Faire corriger ma copie par Claude</button><div data-aibox></div></div>` : ""}</article>`;
  const sc = $("[data-sc]", el);
  const upd = () => { sc.textContent = `${fr(half(dsScore(ex, marks, incl)), 1)} / ${fr(dsMax(ex, incl), 1)}`; };
  const aiBtn = $("[data-ai]", el);
  if (aiBtn) aiBtn.onclick = () => { aiBtn.hidden = true; dsAIPanel($("[data-aibox]", el), ex, (i, v) => { const b = $(`[data-m="${i}"][data-v="${v}"]`, el); if (b) b.click(); }); };
  $$("[data-hint]", el).forEach((b) => (b.onclick = () => { const h = $(`[data-h="${b.dataset.hint}"]`, el); h.hidden = !h.hidden; typeset(h); }));
  $$("[data-sol]", el).forEach((b) => (b.onclick = () => { const s = $(`[data-s="${b.dataset.sol}"]`, el); s.hidden = !s.hidden; b.innerHTML = `${icon("eye")}${s.hidden ? "Voir" : "Masquer"} la correction`; typeset(s); }));
  $$("[data-m]", el).forEach((b) => (b.onclick = () => {
    const i = +b.dataset.m, v = +b.dataset.v; marks[i] = v;
    $$(`[data-m="${i}"]`, el).forEach((x) => x.setAttribute("aria-pressed", x === b));
    if (persist) {
      const r = dsRec(ex.id); r.t = Date.now();
      if (dsDone(ex, marks, incl)) { const s = dsScore(ex, marks, incl) / Math.max(1, dsMax(ex, incl)); r.best = Math.max(r.best ?? 0, s); r.last = s; }
      noteAnswer("ds", ex.cm[0], ex.id + ":" + i, v === 1); markActive(); save();
    }
    upd(); onChange();
  }));
  upd();
}

/* Choix des exercices d'un DS blanc : un par groupe de thèmes, en favorisant ceux jamais faits ou ratés. */
function pickDS(incl) {
  const pool = DS_EX.filter((e) => (incl || !e.beyond) && dsMax(e, incl) > 0);
  const w = (e) => { const r = state.ds?.[e.id]; return r && r.best != null ? 0.4 + (1 - r.best) * 2 : 3; };
  const draw = (list) => { let r = Math.random() * list.reduce((a, e) => a + w(e), 0); for (const e of list) { r -= w(e); if (r <= 0) return e; } return list[list.length - 1]; };
  const out = [];
  for (const g of DS_GROUPS) {
    let cand = pool.filter((e) => g.includes(e.th) && !out.includes(e) && !out.some((o) => o.ann && o.ann === e.ann && o.th === e.th));
    if (!cand.length) cand = pool.filter((e) => !out.includes(e) && !out.some((o) => o.th === e.th));
    if (cand.length) out.push(draw(cand));
  }
  const pts = () => out.reduce((s, e) => s + dsMax(e, incl), 0);
  while (pts() < 14) { const rest = pool.filter((e) => !out.includes(e)); if (!rest.length) break; const fresh = rest.filter((e) => !out.some((o) => o.th === e.th)); out.push(draw(fresh.length ? fresh : rest)); }
  return out;
}

        <div class="steps">${FORMULAIRE_UTILE.map((f) => `<div class="fiche-item k-res"><b>${esc(f.t)}</b><div class="math">\\[${f.m}\\]</div></div>`).join("")}</div></section>
        <section class="glass panel"><span class="eyebrow">Attention</span><h2 style="font-size:1.2rem">Coquilles du formulaire distribué</h2>
        <div class="trap-list">${FORMULAIRE_ERR.map((f) => `<div class="trap"><b class="lab">${esc(f.t)}</b><span>Le formulaire écrit ${f.bad}.</span><span>La bonne formule : ${f.good}</span></div>`).join("")}</div></section>`;
    }
    $$("[data-ann]", box).forEach((b) => (b.onclick = () => { open = { kind: "ann", id: b.dataset.ann }; body(); window.scrollTo(0, 0); }));
    $$("[data-ex]", box).forEach((b) => (b.onclick = () => { open = { kind: "ex", id: b.dataset.ex }; body(); window.scrollTo(0, 0); }));
    typeset(box);
  }
  shell(); body();
  return () => clearInterval(timer);
};

/* ---------- DS blanc (appelé depuis l'examen blanc) ---------- */
function runDSBlanc(el, clock, setTimer) {
  const incl = dsIncl();
  let exs = pickDS(incl), phase = "start", marks = {}, t0 = 0, limit = 80 * 60, tid = 0;
  const max = () => exs.reduce((s, e) => s + dsMax(e, incl), 0);
  function render() {
    mathClear(el);
    if (phase === "start") {
      el.innerHTML = `<span class="eyebrow">DS blanc · 1h20 · sur 20</span>
        <p class="muted">Des exercices tirés au sort (un par grand thème, au moins 14 points), en favorisant ceux que tu n'as jamais faits ou que tu as ratés. Sans document ni calculatrice. ${incl ? "Les notions en plus sont incluses." : "Seulement les notions des démos vues."}</p>
        <ul class="list-plain">${exs.map((e) => `<li><b>${esc(e.title)}</b> <span class="small muted">· ${esc(exSrc(e))} · ${fr(dsMax(e, incl), 1)} pts</span></li>`).join("")}</ul>
        <div class="row"><button class="btn btn-main btn-lg" id="go">${icon("timer")}Commencer (1h20)</button><button class="btn btn-ghost" id="redraw">${icon("shuffle")}Autre tirage</button></div>`;
      $("#go", el).onclick = () => { exs.forEach((e) => (marks[e.id] = {})); t0 = Date.now(); setTimer(tid = setInterval(() => { const left = limit - Math.round((Date.now() - t0) / 1000); clock.textContent = left >= 0 ? `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")} restantes` : "Temps écoulé !"; }, 1000)); phase = "sujet"; render(); };
      $("#redraw", el).onclick = () => { exs = pickDS(incl); render(); };
    } else if (phase === "sujet" || phase === "corr") {
      el.innerHTML = `<span class="eyebrow">${phase === "sujet" ? "Sujet : rédige sur ta feuille" : "Correction : note-toi question par question"}</span>
        ${exs.map((e) => `<div data-mount="${e.id}"></div>`).join("")}
        <div class="row">${phase === "sujet" ? `<button class="btn btn-main" id="rendre">${icon("check")}Je rends ma copie</button>` : `<button class="btn btn-main" id="note" disabled>Voir ma note</button><span class="small muted" id="left"></span>`}</div>`;
      const check = () => { if (phase !== "corr") return; const ok = exs.every((e) => dsDone(e, marks[e.id], incl)); $("#note", el).disabled = !ok; $("#left", el).textContent = ok ? "" : "Note toutes les questions pour obtenir ta note."; };
      exs.forEach((e) => mountEx($(`[data-mount="${e.id}"]`, el), e, { mode: phase === "sujet" ? "sujet" : "corr", marks: marks[e.id], persist: false, onChange: check }));
      if (phase === "sujet") $("#rendre", el).onclick = () => { phase = "corr"; render(); window.scrollTo(0, 0); };
      else { check(); $("#note", el).onclick = () => { phase = "end"; render(); }; }
    } else {
      const s = exs.reduce((x, e) => x + dsScore(e, marks[e.id], incl), 0), note = half((20 * s) / Math.max(1, max())), dur = Math.round((Date.now() - t0) / 1000);
      clearInterval(tid); clock.textContent = `${Math.floor(dur / 60)} min ${String(dur % 60).padStart(2, "0")} s`;
      exs.forEach((e) => { const r = dsRec(e.id), sc = dsScore(e, marks[e.id], incl) / Math.max(1, dsMax(e, incl)); r.marks = Object.assign({}, marks[e.id]); r.best = Math.max(r.best ?? 0, sc); r.last = sc; r.t = Date.now(); e.q.forEach((q, i) => { if (dsCount(e, i, incl)) noteAnswer("ds", e.cm[0], e.id + ":" + i, marks[e.id][i] === 1); }); });
      state.dsExams = (state.dsExams || []).concat({ t: Date.now(), score: note, ids: exs.map((e) => e.id), dur, incl }).slice(-30);
      markActive(); save();
      el.innerHTML = `<span class="eyebrow">Résultat du DS blanc</span>
        <div class="row" style="gap:20px"><div class="scorebig">${fr(note, 1)}<span class="muted" style="font-size:.4em"> / 20</span></div>
        <div class="small muted">${fr(half(s), 1)} / ${fr(max(), 1)} points · ${Math.floor(dur / 60)} min${dur > limit ? " (temps dépassé)" : ""}<br>${exs.map((e) => `${esc(e.title)} : ${fr(half(dsScore(e, marks[e.id], incl)), 1)}/${fr(dsMax(e, incl), 1)}`).join("<br>")}</div></div>
        <p>${note >= 16 ? "Très solide, tu es prêt pour le contrôle." : note >= 10 ? "Bonne base. Refais les questions ratées depuis la Révision partiel." : "Reprends les exercices un par un dans la Révision partiel, avec les indices."}</p>
        <div class="row"><button class="btn btn-main" id="again">${icon("reset")}Nouveau DS blanc</button><button class="btn" data-go="partiel">${icon("book")}Révision partiel</button></div>`;
      $("#again", el).onclick = () => Router.render();
    }
    typeset(el);
  }
  render();
}

/* ---------- Correction d'une copie de DS par Claude (sur claude.ai seulement) ---------- */
function dsAIPanel(el, ex, applyMark) {
  const incl = dsIncl(), max = AI.imgLimits ? AI.imgLimits.maxCount : 4;
  el.innerHTML = `<div class="ai-out" style="background:var(--glass-strong);display:grid;gap:10px">
    <span class="ai-badge">${icon("spark")}Claude · correcteur de DS</span>
    <p class="small muted">Prends ta copie en photo (ou tape tes réponses, question par question). Claude la corrige avec le barème et la correction de l'exercice.</p>
    <textarea data-tx rows="5" placeholder="Q1 : … &#10;Q2 : …"></textarea>
    <div class="drop needs-img" data-drop role="button" tabindex="0">${icon("camera")}<b>Ajouter des photos de ma copie</b><span class="small muted">Jusqu'à ${max} photos nettes</span></div>
    <input type="file" data-file accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
    <div class="thumbs" data-thumbs></div>
    <div class="row"><button class="btn btn-main" data-aigo>${icon("spark")}Corriger</button><span class="small muted" data-msg role="status"></span></div>
    <div data-out></div></div>`;
  const q = (s) => $(s, el);
  let files = [];
  const add = (list) => {
    const types = AI.imgLimits ? AI.imgLimits.mediaTypes : ["image/jpeg", "image/png", "image/webp", "image/gif"];
    for (const f of list) if (types.includes(f.type) && files.length < max) files.push(f);
    const th = q("[data-thumbs]"); th.innerHTML = "";
    files.forEach((f, k) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.src = r.result; im.alt = `Photo ${k + 1}`; im.title = "Toucher pour retirer"; im.onclick = () => { files.splice(k, 1); add([]); }; th.append(im); }; r.readAsDataURL(f); });
  };
  const input = q("[data-file]"), drop = q("[data-drop]");
  drop.onclick = () => input.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  input.onchange = () => { add(input.files); input.value = ""; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
  q("[data-aigo]").onclick = async () => {
    const text = q("[data-tx]").value.trim(), msg = q("[data-msg]"), out = q("[data-out]"), go = q("[data-aigo]");
    if (!text && !files.length) { msg.textContent = "Tape tes réponses ou ajoute une photo d'abord."; return; }
    if (!AI.sample) return;
    const c = AI.ctl(); go.disabled = true; msg.textContent = "";
    out.innerHTML = AI.thinking("Claude corrige ta copie… (30 s à 1 min)");
    const counted = ex.q.map((x, i) => [x, i]).filter(([, i]) => dsCount(ex, i, incl));
    const ref = counted.map(([x, i]) => `Q${i + 1} (${x.pts} pt) : ${strip(x.q)}\nCorrection : ${strip(x.sol)}`).join("\n\n");
    const prompt = `Tu es correcteur d'un contrôle de physique des ondes (2e année, prépa intégrée). Corrige la copie d'un étudiant pour l'exercice « ${ex.title} », avec le barème indiqué. Sois exigeant mais juste : une réponse juste sans justification vaut au plus la moitié des points.\n\nÉnoncé : ${strip(ex.intro)}\n\n=== QUESTIONS, BARÈME ET CORRECTION ===\n${ref}\n\n=== COPIE ===\n${text ? `Texte tapé :\n"""\n${text.slice(0, 10000)}\n"""\n` : ""}${files.length ? `Copie manuscrite sur ${files.length > 1 ? "les photos jointes" : "la photo jointe"}.\n` : ""}\nRéponds UNIQUEMENT en JSON : {"questions": [{"n": numéro de la question, "points": points obtenus (au demi-point), "commentaire": "1 phrase"}], "erreurs": ["erreur précise et correction"], "conseil": "1 conseil"}. Formules en LaTeX entre \\( et \\). Une question absente de la copie vaut 0. ${MACROS_NOTE}`;
    try {
      const v = await AI.sample.json(prompt, { modelTier: "complex", signal: c.signal, images: files.length ? files.slice() : undefined });
      const qs = Array.isArray(v && v.questions) ? v.questions : [];
      let tot = 0, mx = 0;
      const rows = counted.map(([x, i]) => {
        const r = qs.find((y) => Number(y && y.n) === i + 1) || {}, p = clamp(Number(r.points) || 0, 0, x.pts);
        tot += p; mx += x.pts;
        const st = p >= 0.75 * x.pts ? "ok" : p >= 0.25 * x.pts ? "partiel" : "faux";
        return { i, p, st, html: `<div class="status"><span class="pill ${st}">${fr(p, 1)}/${fr(x.pts, 1)}</span><div><b>Question ${i + 1}</b>${r.commentaire ? `<div class="small muted">${md(String(r.commentaire)).replace(/^<p>|<\/p>$/g, "")}</div>` : ""}</div></div>` };
      });
      const list = (a) => (Array.isArray(a) ? a : []).map((x) => `<li>${md(String(x)).replace(/^<p>|<\/p>$/g, "")}</li>`).join("");
      setHTML(out, `<div class="verdict"><div class="top"><div class="scorebig">${fr(half(tot), 1)}<span class="muted" style="font-size:.4em"> / ${fr(mx, 1)}</span></div></div>
        <div class="status-list">${rows.map((r) => r.html).join("")}</div>
        ${(v.erreurs || []).length ? `<div><span class="eyebrow">Erreurs relevées</span><ul class="list-plain small">${list(v.erreurs)}</ul></div>` : ""}
        ${v.conseil ? `<div class="feedback ok"><b>Conseil</b><span>${md(String(v.conseil)).replace(/^<p>|<\/p>$/g, "")}</span></div>` : ""}
        <div class="row"><button class="btn btn-main" data-apply>${icon("check")}Reporter ces notes dans l'exercice</button></div></div>`);
      $("[data-apply]", out).onclick = (e) => { rows.forEach((r) => applyMark(r.i, r.st === "ok" ? 1 : r.st === "partiel" ? 0.5 : 0)); e.currentTarget.disabled = true; toast("Notes reportées dans l'exercice"); };
    } catch (e) { const m = AI.errorText(e); out.innerHTML = m ? `<div class="feedback no"><b>${esc(m)}</b></div>` : ""; }
    finally { go.disabled = false; AI.ctls.delete(c); }
  };
}

/* ===== claude.js ===== */
/* ---------- Claude : explications, correction de copie, colleur oral ----------
   Disponible seulement quand la page est ouverte sur claude.ai (capacité « sample »).
   Ailleurs, les éléments .needs-ai restent cachés. */
const strip = (h) => String(h || "").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ");
const MACROS_NOTE = "Macros LaTeX utilisées : \\pd{a}{b} = ∂a/∂b ; \\pdd{a}{b} = ∂²a/∂b² ; \\pdc{a}{b}{c} = ∂²a/∂b∂c ; \\rot, \\grad, \\dive = rotationnel, gradient, divergence ; \\vec{X} = vecteur X.";
function demoRef(d) {
  return [
    `Démonstration : ${d.title}`,
    `Énoncé du colleur : ${d.pitch}`,
    `Hypothèses : ${d.hyp.map(strip).join(" ; ")}`,
    d.notation ? `Notations : ${strip(d.notation)}` : "",
    `Point de départ : ${d.start}`,
    "Étapes de la version corrigée :",
    ...d.steps.map((s, k) => `${k + 1}. ${s.t}\n   Formules : ${s.m.join("  ;  ")}\n   Justification : ${strip(s.why)}${s.trap ? `\n   Piège connu : ${strip(s.trap)}` : ""}`),
    `Résultat : ${d.result}`,
    MACROS_NOTE
  ].filter(Boolean).join("\n");
}

const AI = {
  sample: null, imgLimits: null, ctls: new Set(),
  async init() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    let s = null;
    try { s = await window.claude.use("sample"); } catch (e) { s = null; }
    if (!s) return;
    this.sample = s;
    document.documentElement.dataset.ai = "on";
    try { const lim = await s.limits(); if (lim && lim.images) { this.imgLimits = lim.images; document.documentElement.dataset.aiImg = "on"; } } catch (e) { /* pas d'images */ }
  },
  disable() { delete document.documentElement.dataset.ai; delete document.documentElement.dataset.aiImg; this.sample = null; },
  ctl() { const c = new AbortController(); this.ctls.add(c); return c; },
  abortAll() { this.ctls.forEach((c) => c.abort()); this.ctls.clear(); },
  errorText(e) {
    const c = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { setTimeout(() => this.disable(), 2500); return "Claude n'est pas disponible sur cette page (accès refusé ou désactivé)."; }
    if (c === "images_unavailable") { delete document.documentElement.dataset.aiImg; return "L'envoi de photos n'est pas possible ici. Tape ta démo à la place."; }
    return ({
      cancelled: "",
      rate_limited: "Trop de demandes pour l'instant. Réessaie dans quelques minutes.",
      session_expired: "Ta session claude.ai a expiré : reconnecte-toi puis réessaie.",

    })[c] ?? "La connexion avec Claude a échoué. Réessaie.";

  thinking: (label) => `<span class="thinking"><i></i><i></i><i></i>&nbsp;${esc(label)}</span>`,

  /* Une autre explication d'une étape (modèle rapide). */
  async explain(d, s, out, btn) {

      finally { go.disabled = false; stop.hidden = true; this.ctls.delete(c); }

    function renderVerdict(v) {

    loop(ts) { const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts; api.t += dt; api.frame(dt); if (playing) raf = requestAnimationFrame(api.loop); },

/* Démo 1 : F(x − ct) + G(x + ct), deux paquets qui se croisent sans se déformer. */
SIMS.d1 = (el) => {

    legend: `<span><i style="background:var(--rose-ink)"></i>F(x − ct)</span><span><i style="background:var(--sky-ink)"></i>G(x + ct)</span><span><i style="background:var(--lav-ink);height:6px"></i>f = F + G</span>`,

/* Démo 5 : impulsion sur une corde fixée aux deux bouts, forces de tension sur un élément. */

/* ===== shorts-vis.js ===== */
/* ---------- Shorts : schémas animés (canvas) ----------
   VIS.nom(c, w, h, s) avec s = { t: secondes depuis le début de la scène, u: avancement 0 → 1,

const VIS = {};
const VFONT = { body: "Lexend, system-ui, sans-serif", mono: "'DM Mono', ui-monospace, monospace", disp: "Unbounded, Lexend, system-ui, sans-serif" };

function vtxt(c, s, x, y, o = {}) {
  const size = o.size || 14, col = o.color || "#000";
  c.font = `${o.weight || 500} ${size}px ${VFONT[o.font || "body"]}`;
  c.textAlign = o.align || "center"; c.textBaseline = "middle";
  if (o.bg) {

    const bx = c.textAlign === "left" ? x - 8 : c.textAlign === "right" ? x - pw + 8 : x - pw / 2;
    vround(c, bx, y - ph / 2, pw, ph, ph / 2); c.fillStyle = o.bg; c.fill();

}

}

function vring(c, x, y, r, col, w = 2, dash) { c.strokeStyle = col; c.lineWidth = w; if (dash) c.setLineDash(dash); c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); c.setLineDash([]); }
function vline(c, x0, y0, x1, y1, col, w = 2, dash) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = "round"; if (dash) c.setLineDash(dash); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.setLineDash([]); }

const vcol = (P, k) => P[k || "lav"] || P.lav;
const vsoft = (P, k) => P[(k || "lav") + "S"] || P.lavS;

/* Gros symbole qui respire, entouré de bulles : scènes d'accroche et formules clés. */
VIS.glyph = (c, w, h, { t, p, P }) => {
  const R = Math.min(w, h), cx = w / 2, cy = h * 0.46, cols = [P.lavS, P.skyS, P.roseS, P.mintS, P.sunS];
  for (let i = 0; i < 9; i++) {

    bubble(c, cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, R * (0.03 + 0.016 * (i % 3)), cols[i % 5]);

  const mw = c.measureText(p.g).width; if (mw > w * 0.86) size *= (w * 0.86) / mw;
  vtxt(c, p.g, 0, 0, { size, color: vcol(P, p.c), weight: 700, font: "disp" });
