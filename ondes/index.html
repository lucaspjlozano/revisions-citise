<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Démos d'Ondes</title>
<meta name="description" content="Site d'entraînement aux 5 démonstrations de la colle de physique des ondes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Mono:wght@400;500&family=Lexend:wght@300;400;500;600&family=Unbounded:wght@500;600;700&display=swap">
</head>
<body>
<style>
/* Layout : une colonne centrée (max 1180px), barre de navigation en verre collante,
   panneaux "bulles de verre" posés sur un fond de taches pastel. Chaque démo a sa couleur. */
:root {
  --bg: #f2f0f7;
  --bg-2: #e8e5f2;
  --ink: #262541;
  --ink-2: #55537a;
  --ink-3: #8886a6;
  --line: rgba(70, 60, 140, .13);
  --glass: rgba(255, 255, 255, .56);
  --glass-strong: rgba(255, 255, 255, .8);
  --glass-edge: rgba(255, 255, 255, .9);
  --glass-hi: rgba(255, 255, 255, .95);
  --shadow: rgba(62, 50, 135, .2);
  --paper: #fbf8ec;
  --paper-line: rgba(90, 110, 160, .22);
  --paper-margin: #e0607a;
  --lav: #b8a6f2;  --lav-soft: #ebe5fd;  --lav-ink: #5a44c2;
  --sky: #93cdf2;  --sky-soft: #ddf0fc;  --sky-ink: #1f6c9c;
  --rose: #f2aaa2; --rose-soft: #fde4e0; --rose-ink: #b0463b;
  --sun: #f4d37c;  --sun-soft: #fdf3d4;  --sun-ink: #84600c;
  --mint: #9edcc5; --mint-soft: #ddf5ec; --mint-ink: #1d755b;
  --lilac: #e3b3e8; --lilac-soft: #f8e7fa; --lilac-ink: #87398f;
  --f-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --c: var(--lav); --c-soft: var(--lav-soft); --c-ink: var(--lav-ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15142a; --bg-2: #1d1b37; --ink: #eceaf8; --ink-2: #b5b2d6; --ink-3: #85829f;
    --line: rgba(200, 190, 255, .13);
    --glass: rgba(42, 40, 76, .55); --glass-strong: rgba(48, 46, 86, .86);
    --glass-edge: rgba(255, 255, 255, .11); --glass-hi: rgba(255, 255, 255, .09);
    --shadow: rgba(0, 0, 0, .5);
    --paper: #2a2838; --paper-line: rgba(170, 180, 230, .16); --paper-margin: #c25670;
    --lav: #9d8ae6;  --lav-soft: #2f2958;  --lav-ink: #c6baff;
    --sky: #6fb6e3;  --sky-soft: #1d3349;  --sky-ink: #a2d7f8;
    --rose: #e2928a; --rose-soft: #3e2531; --rose-ink: #ffb4ab;
    --sun: #e3c063;  --sun-soft: #3a3221;  --sun-ink: #f4d88a;
    --mint: #7fcfb2; --mint-soft: #1b3b34; --mint-ink: #9de6ca;
    --lilac: #cf98d6; --lilac-soft: #37253e; --lilac-ink: #f1c0f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15142a; --bg-2: #1d1b37; --ink: #eceaf8; --ink-2: #b5b2d6; --ink-3: #85829f;
  --line: rgba(200, 190, 255, .13);
  --glass: rgba(42, 40, 76, .55); --glass-strong: rgba(48, 46, 86, .86);
  --glass-edge: rgba(255, 255, 255, .11); --glass-hi: rgba(255, 255, 255, .09);
  --shadow: rgba(0, 0, 0, .5);
  --paper: #2a2838; --paper-line: rgba(170, 180, 230, .16); --paper-margin: #c25670;
  --lav: #9d8ae6;  --lav-soft: #2f2958;  --lav-ink: #c6baff;
  --sky: #6fb6e3;  --sky-soft: #1d3349;  --sky-ink: #a2d7f8;
  --rose: #e2928a; --rose-soft: #3e2531; --rose-ink: #ffb4ab;
  --sun: #e3c063;  --sun-soft: #3a3221;  --sun-ink: #f4d88a;
  --mint: #7fcfb2; --mint-soft: #1b3b34; --mint-ink: #9de6ca;
  --lilac: #cf98d6; --lilac-soft: #37253e; --lilac-ink: #f1c0f7;
  color-scheme: dark;
}

.c-lav   { --c: var(--lav);   --c-soft: var(--lav-soft);   --c-ink: var(--lav-ink); }
.c-sky   { --c: var(--sky);   --c-soft: var(--sky-soft);   --c-ink: var(--sky-ink); }
.c-mint  { --c: var(--mint);  --c-soft: var(--mint-soft);  --c-ink: var(--mint-ink); }
.c-rose  { --c: var(--rose);  --c-soft: var(--rose-soft);  --c-ink: var(--rose-ink); }
.c-sun   { --c: var(--sun);   --c-soft: var(--sun-soft);   --c-ink: var(--sun-ink); }
.c-lilac { --c: var(--lilac); --c-soft: var(--lilac-soft); --c-ink: var(--lilac-ink); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
  min-height: 100%;
  overflow-x: hidden;
}
.backdrop {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42vmax 42vmax at 8% -4%, color-mix(in srgb, var(--lav) 50%, transparent), transparent 70%),
    radial-gradient(36vmax 36vmax at 96% 12%, color-mix(in srgb, var(--sky) 45%, transparent), transparent 70%),
    radial-gradient(32vmax 32vmax at 84% 98%, color-mix(in srgb, var(--sun) 40%, transparent), transparent 70%),
    radial-gradient(34vmax 34vmax at 2% 88%, color-mix(in srgb, var(--rose) 38%, transparent), transparent 70%),
    radial-gradient(28vmax 28vmax at 50% 55%, color-mix(in srgb, var(--mint) 22%, transparent), transparent 70%),
    var(--bg);
}
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.5), transparent 60%);
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.5), transparent 60%);
}

h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
h1, h2 { font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em; }
h3, h4 { font-weight: 600; }
p { margin: 0; }
a { color: var(--c-ink); }
button { font: inherit; color: inherit; }
svg[viewBox="0 0 24 24"] { width: 18px; height: 18px; flex: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--c-ink) 60%, transparent); outline-offset: 3px; border-radius: 10px; }
.mono { font-family: var(--f-mono); }
.eyebrow {
  font-family: var(--f-mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-2); font-weight: 500;
}
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.tiny { font-size: .78rem; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
main.wrap { padding-block: 26px 90px; display: grid; gap: 28px; }

/* ---------- Verre ---------- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 22px 46px -26px var(--shadow), 0 2px 6px -2px color-mix(in srgb, var(--shadow) 50%, transparent);
  border-radius: var(--r-lg);
}
.glass-strong { background: var(--glass-strong); }
.panel { padding: clamp(18px, 3vw, 30px); display: grid; gap: 18px; min-width: 0; }

/* ---------- Barre du haut ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  padding-block: 12px;
}
.topbar .bar {
  display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 16px;
  border-radius: 999px;
}
.brand {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--f-display); font-weight: 600; font-size: .98rem; white-space: nowrap;
  background: none; border: 0; cursor: pointer; padding: 0;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 28%, #fff 0 12%, transparent 13%), linear-gradient(140deg, var(--lav), var(--sky));
  box-shadow: inset 0 -4px 8px rgba(0,0,0,.08), 0 6px 14px -6px var(--shadow);
  display: grid; place-items: center;
}
.brand-mark svg { width: 18px; height: 18px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px; }
.nav::-webkit-scrollbar { display: none; }
.nav button {
  border: 0; background: none; cursor: pointer; white-space: nowrap;
  padding: 7px 13px; border-radius: 999px; font-size: .9rem; color: var(--ink-2); font-weight: 500;
  transition: background .2s, color .2s;
}
.nav button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 4px 12px -6px var(--shadow), inset 0 1px 0 var(--glass-hi); }
.nav .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.streak {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; flex: none;
  background: var(--sun-soft); color: var(--sun-ink); font-family: var(--f-mono); font-size: .8rem; font-weight: 500;
}
.streak svg { width: 15px; height: 15px; }

/* ---------- Boutons ---------- */
.btn {
  --b: var(--c-soft);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--glass-edge); cursor: pointer; text-decoration: none;
  padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: .95rem; line-height: 1.2;
  background: linear-gradient(180deg, color-mix(in srgb, var(--b) 70%, var(--glass-strong)), var(--b));
  color: var(--ink);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 20px -14px var(--shadow);
  transition: transform .15s ease, box-shadow .2s ease, background .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 var(--glass-hi), 0 14px 24px -14px var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn-main { --b: var(--c); font-weight: 600; }
.btn-ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn-ghost:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.btn-sm { padding: 7px 13px; font-size: .86rem; }
.btn-lg { padding: 14px 24px; font-size: 1.02rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  background: var(--c-soft); color: var(--c-ink); font-size: .84rem; font-weight: 500; line-height: 1.35;
  border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
}
.chip-plain { background: var(--glass-strong); color: var(--ink-2); border-color: var(--line); }

/* Contrôle segmenté */
.seg {
  display: flex; gap: 4px; padding: 5px; border-radius: 999px; overflow-x: auto; scrollbar-width: none;
  background: color-mix(in srgb, var(--ink) 5%, transparent); border: 1px solid var(--line);
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1 0 auto; border: 0; background: none; cursor: pointer; padding: 9px 16px; border-radius: 999px;
  font-weight: 500; font-size: .92rem; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-selected="true"] {
  background: var(--glass-strong); color: var(--c-ink);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 6px 14px -8px var(--shadow);
}

/* ---------- Accueil ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 28px; align-items: center; padding: clamp(22px, 4vw, 44px); position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.05; }
.hero h1 em { font-style: normal; color: var(--lav-ink); }
.hero .lead { font-size: 1.08rem; color: var(--ink-2); max-width: 46ch; }
.hero-copy { display: grid; gap: 18px; align-content: start; min-width: 0; }
.floaters { position: relative; min-height: 370px; perspective: 900px; }
.floater {
  position: absolute; padding: 12px 16px; border-radius: 20px; font-size: .92rem; min-width: 0; max-width: 100%;
  display: grid; gap: 2px; transform-style: preserve-3d;
  animation: bob 7s ease-in-out infinite;
  cursor: pointer; text-align: left; border: 1px solid var(--glass-edge); color: var(--ink);
}
.floater .tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--c-ink); }
.floater::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
  background: linear-gradient(150deg, color-mix(in srgb, var(--c) 55%, transparent), color-mix(in srgb, var(--c-soft) 70%, transparent));
}
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
.bubble-deco {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.25) 22%, transparent 60%),
              radial-gradient(circle at 70% 75%, color-mix(in srgb, var(--c) 70%, transparent), color-mix(in srgb, var(--c) 25%, transparent) 70%);
  box-shadow: inset -6px -10px 22px color-mix(in srgb, var(--c) 40%, transparent), 0 20px 30px -18px var(--shadow);
  animation: bob 9s ease-in-out infinite;
}

.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.section-head h2 { font-size: clamp(1.3rem, 2.4vw, 1.75rem); }
.grid-demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.demo-card { padding: 20px; display: grid; gap: 14px; position: relative; overflow: hidden; align-content: start; min-width: 0; }
.demo-card::before {
  content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -70px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--c) 60%, transparent), transparent 70%);
  z-index: -1;
}
.demo-card h3 { font-size: 1.12rem; }
.card-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.num-bubble {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--c-ink);
  background: radial-gradient(circle at 32% 28%, var(--glass-hi) 0 10%, transparent 30%), linear-gradient(150deg, var(--c-soft), var(--c));
  box-shadow: inset 0 -5px 10px color-mix(in srgb, var(--c-ink) 18%, transparent), 0 8px 16px -10px var(--shadow);
}
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: color-mix(in srgb, var(--ink) 10%, transparent); }
.ring .val { stroke: var(--c-ink); transition: stroke-dashoffset .8s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: .8rem; font-weight: 500; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--ink-2); font-family: var(--f-mono); }

.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.method .m { padding: 18px; display: grid; gap: 8px; align-content: start; }
.method .m b { font-family: var(--f-display); font-weight: 600; font-size: 1rem; }
.method .m .n { font-family: var(--f-mono); color: var(--c-ink); font-size: .8rem; letter-spacing: .1em; }

/* ---------- Page démo ---------- */
.demo-head { padding: clamp(20px, 3.4vw, 34px); display: grid; gap: 18px; position: relative; overflow: hidden; }
.demo-head::after {
  content: ""; position: absolute; right: -80px; bottom: -120px; width: 320px; height: 320px; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--c) 55%, transparent), transparent 70%);
}
.demo-head h1 { font-size: clamp(1.6rem, 3.6vw, 2.5rem); }
.demo-title-row { display: flex; gap: 16px; align-items: center; }
.head-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.demo-title-row > div { min-width: 0; }
.result-bubble {
  padding: 14px 20px; border-radius: 22px; display: grid; gap: 4px; justify-items: start; overflow-x: auto; max-width: 100%;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c-soft) 85%, transparent), color-mix(in srgb, var(--c) 35%, transparent));
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
}
.hyps { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Étapes ---------- */
.steps { display: grid; gap: 14px; counter-reset: s; }
.step { padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; animation: rise .45s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.step .sn {
  grid-row: span 3; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-mono); font-weight: 500; font-size: .9rem; color: var(--c-ink); background: var(--c-soft);
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
}
.step h3 { font-size: 1.02rem; align-self: center; }
.step .body { display: grid; gap: 10px; min-width: 0; }
.math { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 4px 2px; min-width: 0; }
.math mjx-container[display="true"] { margin: .35em 0 !important; }
mjx-container { max-width: 100%; }
.recall .math { cursor: pointer; position: relative; }
.recall .math:not(.shown) > * { filter: blur(9px); opacity: .55; user-select: none; }
.recall .math:not(.shown)::after {
  content: "Touchez pour révéler"; position: absolute; left: 50%; top: 50%; translate: -50% -50%;
  font-size: .78rem; font-family: var(--f-mono); color: var(--c-ink); background: var(--glass-strong); padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--line);
}
.why { font-size: .93rem; color: var(--ink-2); border-left: 3px solid var(--c); padding: 2px 0 2px 12px; }
.trap {
  font-size: .9rem; border-radius: 14px; padding: 10px 14px; display: grid; gap: 4px;
  background: var(--rose-soft); color: var(--ink); border: 1px dashed color-mix(in srgb, var(--rose) 80%, transparent);
}
.trap b.lab { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--rose-ink); font-weight: 500; }
.step-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-out { font-size: .93rem; background: var(--sky-soft); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.ai-out:empty { display: none; }
.locked-step { opacity: .55; padding: 14px 20px; border-style: dashed; display: flex; gap: 12px; align-items: center; color: var(--ink-2); }

/* ---------- Entraînement ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.mode-btn {
  padding: 16px; text-align: left; cursor: pointer; display: grid; gap: 4px; border-radius: var(--r-md);
  border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink);
  transition: transform .15s, box-shadow .2s;
}
.mode-btn:hover { transform: translateY(-2px); }
.mode-btn[aria-pressed="true"] { background: var(--c-soft); border-color: color-mix(in srgb, var(--c) 70%, transparent); }
.mode-btn b { font-weight: 600; }
.mode-btn span { font-size: .82rem; color: var(--ink-2); }
.game { padding: clamp(16px, 3vw, 26px); display: grid; gap: 16px; min-width: 0; }
.progress-line { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 9%, transparent); overflow: hidden; }
.progress-line > i { display: block; height: 100%; background: linear-gradient(90deg, var(--c), var(--c-ink)); border-radius: 99px; transition: width .4s ease; }

.tiles { display: grid; gap: 10px; }
.tile {
  text-align: left; cursor: pointer; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--glass-edge);
  background: var(--glass-strong); color: var(--ink); display: flex; gap: 12px; align-items: center;
  box-shadow: 0 8px 18px -14px var(--shadow); transition: transform .15s, background .2s;
}
.tile:hover { transform: translateX(3px); }
.tile .k { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-3); min-width: 1.6em; }
.tile.placed { background: var(--mint-soft); border-color: color-mix(in srgb, var(--mint) 70%, transparent); cursor: default; transform: none; }
.tile.wrong { animation: shake .4s; background: var(--rose-soft); }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opt {
  cursor: pointer; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--glass-edge); background: var(--glass-strong);
  color: var(--ink); text-align: left; min-height: 54px; overflow-x: auto; transition: transform .15s, background .2s, border-color .2s;
  box-shadow: 0 8px 18px -14px var(--shadow);
}
.opt:hover:not(:disabled) { transform: translateY(-2px); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--mint-soft); border-color: var(--mint); }
.opt.bad { background: var(--rose-soft); border-color: var(--rose); }
.feedback { border-radius: 16px; padding: 12px 16px; font-size: .94rem; display: grid; gap: 6px; }
.feedback.ok { background: var(--mint-soft); }
.feedback.no { background: var(--rose-soft); }
.feedback b { font-weight: 600; }
.qprompt { font-size: 1.06rem; font-weight: 500; }
.scorebig { font-family: var(--f-display); font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 700; color: var(--c-ink); line-height: 1; }

/* Carte mémo qui se retourne */
.flip { perspective: 1200px; cursor: pointer; min-height: 230px; display: grid; }
.flip-in { position: relative; transition: transform .6s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; display: grid; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  padding: 24px; border-radius: var(--r-lg); display: grid; gap: 12px; align-content: center; justify-items: center; text-align: center;
  border: 1px solid var(--glass-edge); min-height: 230px; overflow-x: auto; min-width: 0;
}
.face.front { background: linear-gradient(160deg, var(--glass-strong), var(--c-soft)); }
.face.back { background: linear-gradient(160deg, var(--c-soft), color-mix(in srgb, var(--c) 45%, var(--glass-strong))); transform: rotateY(180deg); }
.face .q { font-size: 1.12rem; font-weight: 500; max-width: 42ch; }
.face .hint { font-size: .78rem; font-family: var(--f-mono); color: var(--ink-3); }
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rate .btn { width: 100%; }
.b-ok { --b: var(--mint-soft); }
.b-mid { --b: var(--sun-soft); }
.b-no { --b: var(--rose-soft); }

/* Copie de l'étudiante (Trouve l'erreur) */
.paper {
  position: relative; border-radius: 18px; padding: 18px 18px 18px 58px; display: grid; gap: 4px;
  background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 40px, var(--paper-margin) 40px, var(--paper-margin) 42px, transparent 42px),
                    repeating-linear-gradient(180deg, transparent 0 33px, var(--paper-line) 33px 34px);
  box-shadow: 0 16px 30px -22px var(--shadow); border: 1px solid var(--line);
}
.paper .hand { font-family: var(--f-hand); font-size: 1.35rem; color: var(--lav-ink); line-height: 1.2; }
.pline {
  text-align: left; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--ink);
  border-radius: 12px; padding: 6px 10px; overflow-x: auto; min-height: 44px; transition: background .2s, border-color .2s;
}
.pline:hover:not(:disabled) { background: color-mix(in srgb, var(--sky) 18%, transparent); border-color: var(--line); }
.pline:disabled { cursor: default; }
.pline.right { background: color-mix(in srgb, var(--mint) 30%, transparent); }
.pline.bad { background: color-mix(in srgb, var(--rose) 32%, transparent); }
.pline.culprit { background: color-mix(in srgb, var(--rose) 32%, transparent); border-color: var(--rose); }

/* ---------- Colle blanche ---------- */
.colle-grid { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 20px; align-items: start; }
.timer { display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
.timer-ring { width: 210px; height: 210px; max-width: 100%; position: relative; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring .track { stroke: color-mix(in srgb, var(--ink) 9%, transparent); }
.timer-ring .val { stroke: var(--c-ink); transition: stroke-dashoffset 1s linear; }
.timer-ring .digits { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; }
.timer-ring .digits b { font-family: var(--f-mono); font-size: 2.6rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.timer-ring .digits span { font-size: .78rem; color: var(--ink-2); font-family: var(--f-mono); }
.dur-pick { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dur-pick button { border: 1px solid var(--line); background: var(--glass-strong); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-family: var(--f-mono); font-size: .85rem; }
.dur-pick button[aria-pressed="true"] { background: var(--c-soft); border-color: var(--c); color: var(--c-ink); }
.eval-row { padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--glass-edge); }
.eval-row .t { display: grid; gap: 2px; min-width: 0; }
.eval-row .t b { font-weight: 500; font-size: .95rem; }
.tri { display: flex; gap: 6px; }
.tri button {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; background: var(--glass);
  display: grid; place-items: center; transition: transform .15s, background .2s;
}
.tri button svg { width: 18px; height: 18px; }
.tri button:hover { transform: scale(1.06); }
.tri button[aria-pressed="true"].e2 { background: var(--mint); border-color: var(--mint-ink); }
.tri button[aria-pressed="true"].e1 { background: var(--sun); border-color: var(--sun-ink); }
.tri button[aria-pressed="true"].e0 { background: var(--rose); border-color: var(--rose-ink); }
.hist { display: flex; gap: 6px; align-items: end; height: 70px; }
.hist i { flex: 1; max-width: 26px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, var(--c), var(--c-soft)); min-height: 4px; }

/* ---------- Claude ---------- */
html:not([data-ai="on"]) .needs-ai { display: none !important; }
html:not([data-ai-img="on"]) .needs-img { display: none !important; }
html[data-ai="on"] .no-ai { display: none !important; }
.ai-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sky-ink); }
.ai-badge svg { width: 14px; height: 14px; }
textarea, input[type="text"] {
  width: 100%; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-strong); color: var(--ink);
  font: inherit; padding: 12px 14px; resize: vertical; min-height: 48px;
}
textarea:focus, input[type="text"]:focus { outline: 3px solid color-mix(in srgb, var(--c) 55%, transparent); outline-offset: 0; }
.drop {
  border: 2px dashed color-mix(in srgb, var(--c) 60%, transparent); border-radius: 18px; padding: 16px; text-align: center; cursor: pointer;
  background: color-mix(in srgb, var(--c-soft) 60%, transparent); display: grid; gap: 6px; justify-items: center;
}
.drop.over { background: var(--c-soft); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 74px; height: 74px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.thinking { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); font-size: .9rem; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-ink); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; }
.thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.verdict { display: grid; gap: 14px; }
.verdict .top { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.status-list { display: grid; gap: 8px; }
.status { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border-radius: 14px; background: var(--glass-strong); }
.status .pill { font-family: var(--f-mono); font-size: .72rem; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.pill.ok { background: var(--mint-soft); color: var(--mint-ink); }
.pill.partiel { background: var(--sun-soft); color: var(--sun-ink); }
.pill.manquant, .pill.faux { background: var(--rose-soft); color: var(--rose-ink); }
.chat { display: grid; gap: 12px; max-height: min(62vh, 640px); overflow-y: auto; padding: 4px; }
.msg { max-width: min(640px, 92%); padding: 12px 16px; border-radius: 20px; font-size: .95rem; display: grid; gap: 8px; overflow-x: auto; }
.msg.prof { background: var(--glass-strong); border: 1px solid var(--glass-edge); border-bottom-left-radius: 6px; justify-self: start; }
.msg.me { background: var(--c-soft); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-bottom-right-radius: 6px; justify-self: end; }
.msg .who { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.md p + p { margin-top: 6px; }
.md ul, .md ol { margin: 4px 0; padding-left: 20px; }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }

/* ---------- Tirage ---------- */
.draw-stage { position: relative; height: clamp(150px, 26vw, 220px); display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2vw, 22px); flex-wrap: nowrap; }
.draw-ball {
  width: clamp(52px, 12vw, 96px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 0; cursor: default;
  font-family: var(--f-display); font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.8rem); color: var(--c-ink);
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,.2) 26%, transparent 55%), linear-gradient(150deg, var(--c-soft), var(--c));
  box-shadow: inset -6px -10px 18px color-mix(in srgb, var(--c-ink) 22%, transparent), 0 18px 26px -18px var(--shadow);
  transition: transform .18s ease, filter .18s; animation: bob 6s ease-in-out infinite;
}
.draw-ball:nth-child(2) { animation-delay: -1.2s; } .draw-ball:nth-child(3) { animation-delay: -2.4s; }
.draw-ball:nth-child(4) { animation-delay: -3.6s; } .draw-ball:nth-child(5) { animation-delay: -4.8s; }
.draw-ball.lit { transform: scale(1.22); filter: saturate(1.3) brightness(1.04); }
.draw-ball.dim { filter: grayscale(.7) opacity(.45); }

/* ---------- Schémas / simulations ---------- */
.sim { padding: clamp(14px, 2.6vw, 24px); display: grid; gap: 14px; min-width: 0; }
.canvas-box { position: relative; border-radius: 20px; overflow: hidden; background: color-mix(in srgb, var(--glass-strong) 80%, transparent); border: 1px solid var(--line); }
.canvas-box canvas { display: block; width: 100%; height: clamp(220px, 34vw, 340px); touch-action: none; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 18px; align-items: end; }
.ctl { display: grid; gap: 4px; font-size: .88rem; color: var(--ink-2); }
.ctl output { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; }
input[type="range"] { width: 100%; accent-color: var(--c-ink); }
.readout { display: flex; flex-wrap: wrap; gap: 10px; }
.readout .r { padding: 10px 14px; border-radius: 14px; background: var(--c-soft); display: grid; min-width: 120px; }
.readout .r span { font-size: .74rem; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }
.readout .r b { font-family: var(--f-mono); font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .84rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.schema-svg { width: 100%; height: auto; display: block; }
.schema-svg .hot { cursor: pointer; }
.schema-svg .hot:hover .hl, .schema-svg .hot.on .hl { fill: color-mix(in srgb, var(--c) 35%, transparent); }
.schema-note { min-height: 64px; padding: 12px 16px; border-radius: 16px; background: var(--c-soft); font-size: .93rem; }
.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: .88rem; color: var(--ink-2); }
.toggle input { accent-color: var(--c-ink); width: 17px; height: 17px; }

/* ---------- Divers ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 60;
  padding: 11px 18px; border-radius: 999px; font-size: .92rem; font-weight: 500; max-width: calc(100% - 32px);
  animation: rise .3s ease both;
}
.empty { padding: 28px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.list-plain { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.plan { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: p; }
.plan li { counter-increment: p; display: flex; gap: 10px; align-items: baseline; font-size: .94rem; }
.plan li::before { content: counter(p, decimal-leading-zero); font-family: var(--f-mono); font-size: .78rem; color: var(--c-ink); }
.kbd { font-family: var(--f-mono); font-size: .75rem; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--glass-strong); }
.trap-list { display: grid; gap: 12px; }
.foot { text-align: center; color: var(--ink-3); font-size: .8rem; padding-bottom: 20px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .floaters { min-height: 300px; }
  .colle-grid, .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  body { font-size: 15px; }
  .wrap { padding-inline: 16px; }
  .topbar .bar { padding-left: 10px; gap: 8px; }
  .brand .label { display: none; }
  .streak .label { display: none; }
  .step { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .step .sn { grid-row: auto; }
  .eval-row { grid-template-columns: minmax(0, 1fr); }
  .rate { gap: 6px; }
  .rate .btn { padding-inline: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

@media (max-width: 560px) {
  .floaters { min-height: 0; display: flex; flex-wrap: wrap; gap: 10px; perspective: none; }
  .floater { position: static; animation: none; }
  .bubble-deco { display: none; }
}

/* Les grilles à une colonne ne doivent jamais s'élargir au contenu (formules, onglets). */
main.wrap, .panel, .game, .sim, .demo-head, .demo-card, .steps, .verdict { grid-template-columns: minmax(0, 1fr); }
.demo-head > *, .panel > *, .game > *, .sim > * { min-width: 0; }
.seg { max-width: 100%; min-width: 0; }
@media (max-width: 560px) {
  .demo-head .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 22px; width: 100%; }
  .demo-head .seg button { padding: 9px 8px; font-size: .86rem; }
  .demo-head .row-between > .row { width: 100%; justify-content: space-between; }
}
@media (max-width: 560px) {
  .demo-head h1 { font-size: 1.4rem; }
  .demo-head .num-bubble { width: 40px; height: 40px; font-size: 1rem; }
  .demo-head .ring { width: 54px !important; height: 54px !important; }
}
/* Les puces contenant des formules : texte continu (pas d'éléments flex séparés). */
.chip { display: inline-block; vertical-align: middle; }

/* ---------- FAQ ---------- */
.faq-list { display: grid; gap: 12px; }
.faq { padding: 0; overflow: hidden; }
.faq summary { list-style: none; cursor: pointer; padding: 16px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; grid-column: 2; grid-row: 1; font-family: var(--f-mono); font-size: 1.3rem; color: var(--c-ink); transition: transform .2s; }
.faq[open] summary::after { transform: rotate(45deg); }
.faq-q { font-weight: 600; grid-column: 1; }
.faq-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.faq-a { padding: 14px 20px 18px; border-top: 1px solid var(--line); display: block; line-height: 1.7; min-width: 0; overflow-x: auto; }
.faq-a p { margin: 0; }
.faq-a p + p, .faq-a p + .faq-oral, .faq-a .faq-oral + p { margin-top: 12px; }
.faq-a .faq-oral { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--c-soft); border-left: 3px solid var(--c-ink); }

/* ---------- Cours ---------- */
.grid-chaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.chap-mini { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; text-align: left; cursor: pointer; color: var(--ink); border-radius: var(--r-md); transition: transform .15s; }
.chap-mini:hover { transform: translateY(-2px); }
.chap-mini b { display: block; font-size: .95rem; line-height: 1.3; }
.step-n { color: var(--c-ink); font-size: .85rem; }
.fiche-item { display: grid; gap: 6px; padding: 12px 14px; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--glass-edge); border-left: 4px solid var(--c); min-width: 0; }
.fiche-item.k-res { border-left-color: var(--c-ink); }
.fiche-item.k-hyp { border-left-color: var(--sun); }
.fiche-item.k-rem { border-left-color: var(--sky); }
.fiche-k { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.fiche-x { font-size: .94rem; color: var(--ink-2); }
button.chip { cursor: pointer; font: inherit; font-size: .84rem; font-weight: 500; }
button.chip svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }

/* Glossaire */
.gl { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; border-bottom: 1.5px dotted var(--c-ink); }
.gl-pop { position: absolute; z-index: 70; padding: 12px 14px; display: grid; gap: 4px; font-size: .88rem; border-radius: 16px; animation: rise .2s ease both; }

/* Suivi */
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 48px; gap: 12px; align-items: center; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); text-align: left; }
.bar-l { font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 9%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--c), var(--c-ink)); border-radius: 99px; }
@media (max-width: 560px) { .bar-row { grid-template-columns: minmax(0, 1fr) 44px; } .bar-row .bar { grid-column: 1 / -1; grid-row: 2; } }
.num-bubble.nb-txt { font-size: .68rem !important; letter-spacing: -.02em; }

/* ---------- Vidéos (shorts) ---------- */
.sh-row { display: grid; gap: 14px; }
.sh-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.sh-thumb {
  position: relative; isolation: isolate; aspect-ratio: 9 / 13; border-radius: 22px; padding: 14px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; text-align: left; cursor: pointer; color: var(--ink);
  transition: transform .18s ease, box-shadow .2s ease;
}
.sh-thumb::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(120% 65% at 30% 8%, color-mix(in srgb, var(--c) 65%, transparent), transparent 72%),
              linear-gradient(180deg, color-mix(in srgb, var(--c-soft) 70%, transparent), var(--glass-strong));
}
.sh-thumb:hover { transform: translateY(-3px); }
.sh-th-glyph { position: absolute; top: 20%; left: 8px; right: 8px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.7rem, 4.6vw, 2.5rem); line-height: 1.1; color: var(--c-ink); }
.sh-th-play { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-strong); color: var(--c-ink); box-shadow: 0 6px 14px -8px var(--shadow); }
.sh-th-play svg { width: 15px; height: 15px; }
.sh-th-sec { font-size: .68rem; letter-spacing: .06em; color: var(--c-ink); }
.sh-thumb b { font-size: .94rem; line-height: 1.25; font-weight: 600; }
.sh-th-meta { font-family: var(--f-mono); font-size: .72rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.sh-seen { color: var(--mint-ink); }

html.sh-open, html.sh-open body { overflow: hidden; }
.sh-overlay {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 45%, rgba(24, 20, 56, .55));

}

  position: relative; height: min(94dvh, 900px); aspect-ratio: 9 / 16; max-width: calc(100vw - 96px);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; overflow: hidden; border-radius: 30px;
  touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(90% 45% at 0% 0%, color-mix(in srgb, var(--c) 32%, transparent), transparent 70%),

}
.sh-frame.sh-in-next { animation: shNext .38s cubic-bezier(.2, .7, .2, 1) both; }
.sh-frame.sh-in-prev { animation: shPrev .38s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes shNext { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shPrev { from { transform: translateY(-70px); opacity: 0; } to { transform: none; opacity: 1; } }
.sh-top { padding: 12px 14px 8px; display: grid; gap: 10px; }
.sh-bars { display: flex; gap: 4px; }

.sh-bars i b { display: block; height: 100%; width: 0; background: var(--c-ink); border-radius: 99px; }

.sh-x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass-strong); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.sh-vis { position: relative; min-height: 0; margin: 0 10px; border-radius: 22px; overflow: hidden; cursor: pointer; background: color-mix(in srgb, var(--glass-strong) 75%, transparent); border: 1px solid var(--line); }
.sh-vis canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.sh-cap {
  margin: 10px 12px 0; padding: 12px 14px; border-radius: 18px; min-height: 76px; display: grid; place-items: center; text-align: center;
  background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: 0 10px 24px -18px var(--shadow);
  font-weight: 600; font-size: 1rem; line-height: 1.4; overflow-x: auto; overflow-y: hidden;
}

.sh-sub span.cur { color: var(--ink); background: var(--c-soft); box-shadow: 0 0 0 2px var(--c-soft); }
.sh-rail { display: flex; justify-content: center; gap: 4px; padding: 2px 8px 12px; }
.sh-rb { width: 58px; display: grid; justify-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font-size: .62rem; font-family: var(--f-mono); }
.sh-rb > svg, .sh-rb > b {
  width: 40px; height: 40px; padding: 10px; box-sizing: border-box; border-radius: 50%;

.sh-nav { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--glass-edge); background: var(--glass-strong); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 22px -14px var(--shadow); }

"use strict";

/* ===== data-demos.js ===== */
/* Contenu des démonstrations — version CORRIGÉE des notes (voir CLAUDE.md, errata).
   Macros MathJax : \pd{f}{x} = ∂f/∂x, \pdd{f}{x} = ∂²f/∂x², \pdc{f}{u}{v} = ∂²f/∂u∂v,
   \rot, \grad, \dive, \vec{X} (flèche). */
const T = String.raw;

const DEMOS = [
  {
    id: "d1", num: 1, color: "lav", short: "d'Alembert",
    title: "Équation de d'Alembert",
    pitch: "Montrez que toute solution de l'équation de d'Alembert à une dimension s'écrit comme la somme d'une onde progressive et d'une onde régressive.",
    hyp: [T`Onde scalaire \(f(x,t)\) : ne dépend que de \(x\) et \(t\)`, "Pas de source", T`\(f\) de classe \(C^2\) (Schwarz)`],
    start: T`\frac{1}{c^2}\pdd{f}{t}-\pdd{f}{x}=0\qquad(1)`,
    result: T`f(x,t)=F(x-ct)+G(x+ct)`,
    resultNote: "Somme d'une onde progressive (vers +x) et d'une onde régressive (vers −x), toutes deux de célérité c.",
    minutes: 8,
    steps: [
      { t: "Poser le changement de variables",
        m: [T`u=x-ct\qquad v=x+ct`, T`\pd{u}{x}=1,\quad \pd{v}{x}=1,\quad \pd{u}{t}=-c,\quad \pd{v}{t}=c`],
        why: T`On cherche des variables où l'équation devient simple. On note encore \(f\) la fonction vue comme fonction de \((u,v)\).` },
      { t: "Dérivée première par rapport à x",
        m: [T`\pd{f}{x}=\pd{f}{u}\pd{u}{x}+\pd{f}{v}\pd{v}{x}=\pd{f}{u}+\pd{f}{v}`],
        why: "Règle de la chaîne : on dérive par rapport à chaque variable intermédiaire, puis on multiplie par la dérivée de cette variable.",
        trap: T`Les notes écrivent « \(\pd{f}{u}\,du+\pd{f}{v}\,dv\) ». Pas de \(du\) ni de \(dv\) : ce sont les dérivées partielles \(\pd{u}{x}\) et \(\pd{v}{x}\) qui apparaissent.` },
      { t: "Dérivée seconde par rapport à x",
        m: [T`\pdd{f}{x}=\left(\pd{}{u}+\pd{}{v}\right)\left(\pd{f}{u}+\pd{f}{v}\right)`, T`\boxed{\pdd{f}{x}=\pdd{f}{u}+\pdd{f}{v}+2\,\pdc{f}{u}{v}}\qquad(2)`],
        why: T`L'opérateur \(\pd{}{x}\) vaut \(\pd{}{u}+\pd{}{v}\) : on l'applique une deuxième fois. Les deux termes croisés sont égaux grâce au théorème de Schwarz.` },
      { t: "Dérivée première par rapport à t",
        m: [T`\pd{f}{t}=\pd{f}{u}\pd{u}{t}+\pd{f}{v}\pd{v}{t}=-c\,\pd{f}{u}+c\,\pd{f}{v}`],
        why: T`Même règle de la chaîne, avec \(\pd{u}{t}=-c\) et \(\pd{v}{t}=c\).` },
      { t: "Dérivée seconde par rapport à t",
        m: [T`\pdd{f}{t}=\left(-c\pd{}{u}+c\pd{}{v}\right)\left(-c\pd{f}{u}+c\pd{f}{v}\right)`, T`\boxed{\pdd{f}{t}=c^2\left(\pdd{f}{u}+\pdd{f}{v}-2\,\pdc{f}{u}{v}\right)}\qquad(3)`],
        why: T`Les termes carrés donnent \((-c)^2=c^2\). Les deux termes croisés valent chacun \(-c^2\), d'où \(-2c^2\).`,
        trap: T`Piège classique : le terme croisé vaut \(+2\) dans \(\pdd{f}{x}\) mais \(-2c^2\) dans \(\pdd{f}{t}\).` },
      { t: "Reporter (2) et (3) dans (1)",
        m: [T`\frac{1}{c^2}\pdd{f}{t}-\pdd{f}{x}=-4\,\pdc{f}{u}{v}=0`, T`\Longrightarrow\quad \pd{}{v}\left(\pd{f}{u}\right)=0`],
        why: T`Les termes \(\pdd{f}{u}\) et \(\pdd{f}{v}\) se simplifient. Il ne reste que les termes croisés : \(-2-2=-4\).` },
      { t: "Intégrer par rapport à v",
        m: [T`\pd{}{v}\left(\pd{f}{u}\right)=0\;\Longrightarrow\;\pd{f}{u}=F'(u)`],
        why: T`\(\pd{f}{u}\) a une dérivée nulle par rapport à \(v\) : elle ne dépend que de \(u\). On la note \(F'(u)\) pour préparer l'intégration suivante.` },
      { t: "Intégrer par rapport à u",
        m: [T`f(u,v)=\int F'(u)\,du+G(v)=F(u)+G(v)`],
        why: T`La « constante » d'intégration ne dépend pas de \(u\), mais elle peut dépendre de \(v\) : c'est une fonction \(G(v)\).` },
      { t: "Revenir aux variables x et t",
        m: [T`\boxed{f(x,t)=F(x-ct)+G(x+ct)}`],
        why: T`\(F(x-ct)\) : onde progressive, qui avance sans se déformer vers les \(x\) croissants à la célérité \(c\). \(G(x+ct)\) : onde régressive, vers les \(x\) décroissants.`,
        trap: T`Les notes écrivent \(F(x-ct)\cdot G(x+ct)\). C'est une <b>somme</b>, pas un produit : l'équation est linéaire, les solutions se superposent.` }
    ]
  },
  {
    id: "d2", num: 2, color: "sky", short: "Helmholtz",
    title: "Régime permanent : équation de Helmholtz",
    pitch: "Une source impose une excitation sinusoïdale. Établissez l'équation de Helmholtz vérifiée par l'amplitude, puis résolvez l'équation homogène.",
    hyp: [T`Source sinusoïdale \(s(x,t)=s(x)\,e^{-i\omega t}\)`, "Régime permanent (forcé)", T`Une dimension : \(\Delta f=\pdd{f}{x}\)`],
    start: T`\frac{1}{c^2}\pdd{f}{t}-\Delta f=s(x,t)\qquad(1)`,
    result: T`\Delta f+k^2f=-s(x),\qquad k=\frac{\omega}{c}`,
    resultNote: T`Sans source, \(f(x,t)=A\,e^{-i\omega(t+x/c)}+B\,e^{-i\omega(t-x/c)}\).`,
    minutes: 7,
    steps: [
      { t: "Hypothèse sur la source",
        m: [T`s(x,t)=s(x)\,e^{-i\omega t}`],
        why: T`La source est sinusoïdale de pulsation \(\omega\). On travaille en notation complexe : la grandeur physique est la partie réelle.`,
        trap: T`Les notes disent « périodique ». Ça ne suffit pas : il faut une dépendance <b>sinusoïdale</b> pour écrire \(e^{-i\omega t}\).` },
      { t: "Forme de la solution en régime permanent",
        m: [T`f(x,t)=f(x)\,e^{-i\omega t}`],
        why: T`L'équation est linéaire : en régime forcé, la réponse oscille à la même pulsation que la source. On note encore \(f(x)\) l'amplitude complexe.` },
      { t: "Calculer les dérivées",
        m: [T`\pdd{f}{t}=(-i\omega)^2f(x)\,e^{-i\omega t}=-\omega^2f(x)\,e^{-i\omega t}`, T`\pdd{f}{x}=f''(x)\,e^{-i\omega t}`],
        why: T`Dériver par rapport au temps revient à multiplier par \(-i\omega\). Deux fois : par \((-i\omega)^2=-\omega^2\).` },
      { t: "Reporter dans (1)",
        m: [T`-\frac{\omega^2}{c^2}f(x)\,e^{-i\omega t}-f''(x)\,e^{-i\omega t}=s(x)\,e^{-i\omega t}`, T`\Longrightarrow\quad -\frac{\omega^2}{c^2}f(x)-f''(x)=s(x)`],
        why: T`On simplifie par \(e^{-i\omega t}\neq0\) : la dépendance temporelle disparaît.` },
      { t: "Poser k = ω/c : équation de Helmholtz",
        m: [T`k=\frac{\omega}{c}\;\Longrightarrow\; f''(x)+k^2f(x)=-s(x)`, T`\boxed{\Delta f+k^2f=-s(x)}`],
        why: T`On multiplie par \(-1\). Sans source : \(\Delta f+k^2f=0\), l'équation de Helmholtz homogène.`,
        trap: T`Les notes concluent \(\Delta f+k^2f=s(x)\). Le signe « − » devant \(s\) se perd à la dernière ligne, alors que la ligne d'avant est juste.` },
      { t: "Résoudre l'équation homogène",
        m: [T`f''+k^2f=0\;:\qquad r^2+k^2=0\;\Longrightarrow\;r=\pm ik`, T`f(x)=A\,e^{-ikx}+B\,e^{ikx}`],
        why: T`Équation différentielle linéaire d'ordre 2 à coefficients constants : on passe par l'équation caractéristique. \(A\) et \(B\) sont des constantes complexes.` },
      { t: "Revenir à f(x,t)",
        m: [T`f(x,t)=A\,e^{-i(kx+\omega t)}+B\,e^{i(kx-\omega t)}`, T`\boxed{f(x,t)=A\,e^{-i\omega\left(t+\frac{x}{c}\right)}+B\,e^{-i\omega\left(t-\frac{x}{c}\right)}}`],
        why: T`On factorise par \(-i\omega\) avec \(k=\omega/c\). Terme en \(A\) : fonction de \(t+x/c\), onde régressive (vers \(-x\)). Terme en \(B\) : fonction de \(t-x/c\), onde progressive (vers \(+x\)). On retrouve la forme de d'Alembert.`,
        trap: T`Dans les notes, les deux exposants contiennent \(-x/c\). Le premier doit contenir \(t+x/c\).` },
      { t: "Et avec une source ?",
        m: [T`f=f_{\text{homogène}}+f_{\text{particulière}}`],
        why: T`Par linéarité, la solution générale est la somme de la solution homogène et d'une solution particulière, qu'on cherche une fois \(s(x)\) connue.` }
    ]
  },
  {
    id: "d3", num: 3, color: "mint", short: "Câble coaxial",
    title: "D'Alembert dans un câble coaxial",
    pitch: "À partir du modèle à constantes réparties d'un câble coaxial sans pertes, montrez que la tension et l'intensité vérifient l'équation de d'Alembert et exprimez la célérité.",
    hyp: [T`Tronçon \(dx\) : inductance \(\ell\,dx\), capacité \(\gamma\,dx\)`, T`\(\ell\) en H·m⁻¹, \(\gamma\) en F·m⁻¹`, "Câble sans pertes (résistances négligées)", T`\(dx\ll\lambda\) : lois de Kirchhoff sur le tronçon`],
    start: T`\text{Inconnues : } V(x,t)\ \text{(tension âme–gaine)},\quad I(x,t)\ \text{(intensité dans l'âme)}`,
    result: T`\pdd{V}{x}-\ell\gamma\,\pdd{V}{t}=0,\qquad c_0=\frac{1}{\sqrt{\ell\gamma}}`,
    resultNote: "Même équation pour I(x,t). TP : c₀ = 2,0·10⁸ m/s = 2c/3.",
    minutes: 10,
    steps: [
      { t: "Loi des mailles",
        m: [T`V(x,t)=V_L+V(x+dx,t)`, T`V_L=V(x,t)-V(x+dx,t)`],
        why: T`La tension d'entrée se répartit entre la bobine et la sortie du tronçon. \(V_L\) est fléchée vers \(x\), à l'opposé du courant : convention récepteur.`,
        trap: T`Les notes écrivent \(V_L=V(x+dx,t)-V(x,t)\) puis \(V_L=-\ell\,dx\,\pd{I}{t}\). Les deux signes sont faux mais se compensent. Avec la flèche du schéma, écris directement la version ci-dessus.` },

    <p>La correction utilise la forme réelle, équivalente : \(a\cos kx+b\sin kx\). Il suffit de poser \(a=A+B\) et \(b=i(A-B)\), car \(e^{\pm ikx}=\cos kx\pm i\sin kx\).</p>

    <div class="faq-oral"><b>À l'oral :</b> « la solution est \(Ae^{ikx}+Be^{-ikx}\) ; en forme réelle, c'est \(a\cos kx+b\sin kx\). Les deux sont équivalentes, je prends la réelle pour appliquer les conditions aux limites. »</div>` },
  { d: null, date: "2026-10-30",
    q: "Quelles moyennes temporelles faut-il connaître par cœur pour le partiel ?",
    a: T`<p>Il suffit de retenir <b>une seule règle</b> : sur une période, seule la <b>partie constante</b> survit à la moyenne. Un \(\cos\) ou un \(\sin\) de n'importe quel multiple de l'angle moyenne à zéro, car l'angle fait un nombre entier de tours :</p>
    <div class="math">\[\langle\cos n\theta\rangle=\langle\sin n\theta\rangle=0\qquad (n\neq0)\]</div>
    <p>Donc \(\cos2\theta\) et \(\sin2\theta\) moyennent tous les deux à zéro : quand \(\theta\) fait un tour, \(2\theta\) en fait deux. Ça se vérifie : \(\int_0^T\sin(2\omega t)\,dt=\big[-\tfrac{\cos2\omega t}{2\omega}\big]_0^T=0\).</p>
    <p>Pour les carrés, on linéarise d'abord, puis on ne garde que la constante :</p>
    <div class="math">\[\cos^2\theta=\frac{1+\cos2\theta}{2}\quad\Longrightarrow\quad\langle\cos^2\theta\rangle=\langle\sin^2\theta\rangle=\frac12\]</div>
    <p>Les trois moyennes à retenir :</p>
    <ul><li>\(\langle\cos\rangle=\langle\sin\rangle=0\), et \(\langle\cos\,\sin\rangle=0\).</li>

    <li>Deux fréquences différentes (\(\theta\) et \(2\theta\), par exemple) : moyenne nulle.</li></ul>
    <p><b>Piège :</b> la moyenne d'un produit n'est pas le produit des moyennes. \(\langle\sin^2\rangle=\tfrac12\), alors que \(\langle\sin\rangle^2=0\).</p>

    q: "Pour montrer que \\(f(\\alpha(x-ct))+g(\\alpha(x+ct))\\) est solution, peut-on passer par le changement de variables \\(u,v\\) ?",
    a: T`<p><b>Oui, et c'est plus court : un seul calcul au lieu de deux.</b> On pose \(u=\alpha(x-ct)\) et \(v=\alpha(x+ct)\). La règle de la chaîne donne :</p>
    <div class="math">\[\frac{\partial}{\partial x}=\alpha\left(\frac{\partial}{\partial u}+\frac{\partial}{\partial v}\right),\qquad \frac{\partial}{\partial t}=\alpha c\left(\frac{\partial}{\partial v}-\frac{\partial}{\partial u}\right)\]</div>
    <p>En élevant au carré, les termes en \(\partial_u^2\) et \(\partial_v^2\) se compensent dans la différence, et il reste le terme croisé :</p>
    <div class="math">\[\pdd{f}{x}-\frac{1}{c^2}\pdd{f}{t}=4\alpha^2\,\frac{\partial^2 f}{\partial u\,\partial v}\]</div>
    <p>L'équation de d'Alembert devient donc \(\dfrac{\partial^2 f}{\partial u\,\partial v}=0\), dont la solution est \(F(u)+G(v)\), soit \(f(\alpha(x-ct))+g(\alpha(x+ct))\). Le facteur \(4\alpha^2\) n'est pas nul (\(\alpha\neq0\)), donc le changement de variables est inversible et ne perd aucune solution.</p>
    <div class="faq-oral"><b>À l'oral :</b> « je pose \(u\) et \(v\) : l'équation devient \(4\alpha^2\,\partial_u\partial_v f=0\), donc \(f=F(u)+G(v)\). Un seul calcul suffit pour les deux termes. »</div>` },
  { d: null, date: "2026-10-29",
    q: "Dans l'exercice de la corde excitée par un vibreur, comment sait-on que c'est une onde stationnaire ?",
    a: T`<p>On le reconnaît à la <b>forme de la solution</b>. On cherche \(y=A\cos(\omega t+\phi)\cos(kx+\psi)\) : c'est un <b>produit</b> d'une fonction de \(t\) seul par une fonction de \(x\) seul. L'espace et le temps sont <b>découplés</b>.</p>
    <p>Une onde progressive, elle, s'écrit \(f(x-ct)\) : son profil se déplace à la vitesse \(c\).</p>
    <p>Conséquence physique : tous les points vibrent avec la même pulsation \(\omega\), en phase ou en opposition de phase, et certains points, les <b>nœuds</b> où \(\cos(kx+\psi)=0\), restent immobiles. L'onde ne se propage pas : elle résulte de la superposition de l'aller (émis par le vibreur) et du retour (réfléchi en \(x=L\)).</p>
    <div class="faq-oral"><b>À l'oral :</b> « la solution est un produit \(T(t)\,X(x)\) : espace et temps sont découplés, donc l'onde est stationnaire ; elle a des nœuds fixes. »</div>` },
  { d: "bonus", date: "2026-10-18",
    q: "Dans la démo de Maxwell, pourquoi a-t-on \\(\\rho=0\\) et \\(\\vec\\jmath=\\vec 0\\) ?",
    a: T`<p>Oui : à notre niveau, on démontre l'équation de propagation <b>dans le vide, en supposant \(\rho=0\) et \(\vec\jmath=\vec 0\)</b>. C'est une <b>hypothèse de départ</b>, pas une propriété générale des ondes électromagnétiques.</p>
    <p>Elle sert à deux endroits :</p>
    <ul><li>\(\rho=0\) donne \(\dive\vec E=0\) (Maxwell-Gauss), ce qui fait disparaître le terme en gradient de \(\dive\vec E\) dans \(\rot(\rot\vec E)\).</li>
    <li>\(\vec\jmath=\vec 0\) donne \(\rot\vec B=\mu_0\varepsilon_0\,\pd{\vec E}{t}\) (Maxwell-Ampère sans courant).</li></ul>
    <p>Avec des charges et des courants, l'équation de \(\vec B\) devient :</p>
    <div class="math">\[\Delta\vec B-\frac{1}{c^2}\pdd{\vec B}{t}=-\mu_0\,\rot\vec\jmath\]</div>
    <p>Seul le courant apparaît ici. La charge \(\rho\) n'intervient pas dans l'équation de \(\vec B\).</p>
    <div class="faq-oral"><b>À l'oral :</b> « je me place dans le vide, donc \(\rho=0\) et \(\vec\jmath=\vec 0\) ; ces hypothèses donnent \(\dive\vec E=0\) et \(\rot\vec B=\mu_0\varepsilon_0\pd{\vec E}{t}\). »</div>` },
  { d: "d5", date: "2026-10-17",
    q: "Dans la démo de la corde, peut-on écrire \\(\\mu\\,dx\\,\\pdd{s}{t}\\) sans préciser \\((x+dx/2,t)\\) ?",
    a: T`<p><b>Oui, dans la rédaction courante on peut l'omettre.</b> Le point \(x+dx/2\) est le <b>milieu de la tranche</b>, où l'on évalue l'accélération pour la moyenne. Mais la différence entre évaluer en \(x\), en \(x+dx/2\) ou en \(x+dx\) est d'ordre \(dx^2\) :</p>
    <div class="math">\[\mu\,dx\,\pdd{s}{t}\Big(x+\tfrac{dx}{2},t\Big)=\mu\,dx\,\pdd{s}{t}(x,t)+O(dx^2)\]</div>
    <p>Or on ne garde que l'ordre \(dx\) (on divise ensuite par \(dx\)). Donc le terme entre parenthèses ne change rien au résultat final \(\pdd{y}{x}-\dfrac{\mu}{T}\pdd{y}{t}=0\).</p>
    <p>Il est tout de même utile de le préciser une fois au début de la démo, pour montrer qu'on a bien fait un bilan sur la tranche \([x,x+dx]\) et que l'accélération est prise au centre.</p>
    <div class="faq-oral"><b>À l'oral :</b> « l'accélération est évaluée au centre de la tranche ; à l'ordre \(dx\), on peut écrire \(\pdd{s}{t}(x,t)\). »</div>` },
  { d: "d4", date: "2026-10-17",
    q: "Dans la démo de l'onde sonore, pourquoi seul le dernier terme \\(\\rho_0\\,\\pd{v}{x}\\) est-il du premier ordre ?",
    a: T`<p>On compte l'ordre d'un terme en regardant ses facteurs. \(\tilde\rho\) et \(v\) sont deux <b>petites grandeurs du premier ordre</b> ; \(\rho_0\) est la masse volumique à l'équilibre, <b>d'ordre 0</b> (elle n'est pas petite).</p>
    <div class="math">\[\underbrace{\pd{\tilde\rho}{x}\,v}_{\text{ordre 2}}\qquad \underbrace{\tilde\rho\,\pd{v}{x}}_{\text{ordre 2}}\qquad \underbrace{\rho_0\,\pd{v}{x}}_{\text{ordre 1}}\]</div>
    <p>Le produit de deux petites grandeurs est du second ordre, donc on néglige les deux premiers termes. Il reste \(\rho_0\,\pd{v}{x}\), qui est du premier ordre car \(\rho_0\) est d'ordre 0 et \(\pd{v}{x}\) est du premier ordre.</p>
    <div class="faq-oral"><b>À l'oral :</b> « un produit de deux petites quantités est négligeable devant une petite quantité seule ; \(\rho_0\) n'est pas petit. »</div>` },
  { d: "d4", date: "2026-10-16",
    q: "Dans la démo de l'onde sonore, peut-on écrire \\(\\pd{\\tilde\\rho}{t}\\,dm=\\pd{\\tilde P}{t}\\) ?",
    a: T`<p>Non, ce n'est pas la bonne relation : \(dm\) est une <b>masse</b>, et \(\pd{\tilde\rho}{t}\) multiplié par une masse n'a pas la dimension de \(\pd{\tilde P}{t}\). Il faut garder ce qui est vraiment vrai, à savoir la <b>relation locale</b> entre surdensité et surpression :</p>
    <div class="math">\[\tilde\rho=\rho_0\,\chi_S\,\tilde P\qquad\Longrightarrow\qquad \pd{\tilde\rho}{t}=\rho_0\,\chi_S\,\pd{\tilde P}{t}\]</div>
    <p>La seconde égalité vient de la dérivée par rapport au temps, à \(x\) fixé, des deux côtés de (3). Elle est valable car \(\rho_0\) et \(\chi_S\) sont constants (fluide homogène, au premier ordre, transformation isentropique).</p>
    <p>Le \(dm\) n'intervient pas ici : il apparaît dans le PFD, où il sert à écrire la masse de la tranche (\(dm=\rho_0 S\,dx\)), pas dans la relation entre \(\tilde\rho\) et \(\tilde P\).</p>
    <div class="faq-oral"><b>À l'oral :</b> « \(\tilde\rho=\rho_0\chi_S\tilde P\) est une relation locale ; je la dérive par rapport au temps à \(x\) fixé. »</div>` },
  { d: "d4", date: "2026-10-16",
    q: "Dans la démo de l'onde sonore, d'où sort \\(\\pd{\\tilde\\rho}{t}+\\pd{(\\tilde\\rho\\,v)}{x}=0\\) ?",
    a: T`<p>C'est la <b>conservation de la masse</b> (équation de continuité), écrite sur la tranche \([x,x+dx]\).</p>
    <p>La masse de la tranche varie parce qu'il entre du fluide par la face en \(x\) et qu'il en sort par la face en \(x+dx\) :</p>
    <div class="math">\[\pd{}{t}(\rho\,S\,dx)=\rho(x)\,v(x)\,S-\rho(x+dx)\,v(x+dx)\,S=-\pd{(\rho v)}{x}\,S\,dx\]</div>
    <p>On divise par \(S\,dx\) et on obtient \(\pd{\rho}{t}+\pd{(\rho v)}{x}=0\), avec la densité totale \(\rho=\rho_0+\tilde\rho\).</p>
    <p>On linéarise ensuite : \(\rho_0\) est constant, et le produit \(\tilde\rho\,v\) est du second ordre (deux petites grandeurs multipliées), donc on le néglige. Il reste \(\pd{\tilde\rho}{t}=-\rho_0\,\pd{v}{x}\), qui est la relation (2) de la démo.</p>
    <div class="faq-oral"><b>À l'oral :</b> « la masse qui entre moins la masse qui sort fait varier la masse de la tranche ; au premier ordre, \(\tilde\rho\,v\) est négligeable. »</div>` },
  { d: "d4", date: "2026-10-16",
    q: "Dans la démo de l'onde sonore, d'où sort la formule \\(dm = \\rho_0 S\\,dx\\) ?",
    a: T`<p>C'est la <b>masse de la tranche de fluide</b> : masse volumique × volume.</p>
    <div class="math">\[dm=\rho\,S\,dx\]</div>
    <p>Le volume de la tranche est un petit pavé de section \(S\) et d'épaisseur \(dx\), donc \(S\,dx\). Pour la masse volumique, on prend la valeur à l'équilibre \(\rho_0\) : la surdensité \(\tilde\rho\) est déjà du premier ordre, et le terme \(\tilde\rho\,S\,dx\) ne donnerait que des termes du second ordre, qu'on néglige dans l'approximation acoustique.</p>
    <div class="faq-oral"><b>À l'oral :</b> « la masse volumique est \(\rho_0\) au premier ordre, la surdensité ne contribue qu'à l'ordre supérieur ».</div>` },
  { d: "d4", date: "2026-10-16",
    q: "Dans la démo de l'onde sonore, pourquoi écrit-on \\(\\vec{F}(x+dx)\\) et pas \\(\\vec{F}(x+dx,t)\\) ? C'est parce que la force ne dépend pas du temps ?",
    a: T`<p>Non : la force <b>dépend bien du temps</b>. Elle vaut</p>
    <div class="math">\[\vec{F}(x+dx,t)=-\tilde P(x+dx,t)\,S\,\vec{u}_x\]</div>
    <p>et la surpression \(\tilde P\) varie avec \(t\) (c'est justement l'onde qui passe), donc \(\vec{F}\) aussi.</p>
    <p>Écrire \(\vec{F}(x+dx)\) est un simple <b>raccourci de notation</b> : on fait le bilan des forces sur la tranche à un instant \(t\) fixé. D'une force à l'autre, seule la face où elle s'applique change (en \(x\) ou en \(x+dx\)), donc on sous-entend le \(t\).</p>
    <p>Le plus rigoureux reste d'écrire \(\vec{F}(x+dx,t)\) : c'est ce que fait maintenant le site.</p>
    <div class="faq-oral"><b>À l'oral, si le colleur le remarque :</b> « la force dépend du temps à travers \(\tilde P(x+dx,t)\), j'ai juste allégé la notation ».</div>` },
];

addShort({ id: "cm1-6", cm: "cm1", sec: 5, g: "∂²", title: "L'équation d'onde",
