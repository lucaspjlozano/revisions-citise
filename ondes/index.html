/* Cartes qui apparaissent une à une (récapitulatifs, formules à retenir). */
VIS.cards = (c, w, h, { u, p, P }) => {
  const it = p.items || [], n = it.length, cols = p.cols || 1, rows = Math.ceil(n / cols);
  const pad = Math.max(10, w * 0.035), gw = (w - pad * (cols + 1)) / cols, gh = Math.min(h * 0.27, (h - pad * (rows + 1)) / rows, gw * 0.62);
  const top = (h - (gh * rows + pad * (rows - 1))) / 2;
  it.forEach((q, i) => {
    const a = p.all ? 1 : win(u, (i / n) * 0.55, (i / n) * 0.55 + 0.1);
    if (a <= 0) return;
    const x = pad + (i % cols) * (gw + pad), y = top + Math.floor(i / cols) * (gh + pad) + (1 - a) * 18;
    c.globalAlpha = a;
    vround(c, x, y, gw, gh, 16); c.fillStyle = hexA(vsoft(P, q.c), 0.42); c.fill();
    c.strokeStyle = hexA(vcol(P, q.c), 0.3); c.lineWidth = 1.2; c.stroke();
    const gwid = cols > 1 ? gw : gw * 0.3;
    let gs = Math.min(gh * 0.36, 40); c.font = `700 ${gs}px ${VFONT.disp}`;
    const mw = c.measureText(q.g).width; if (mw > gwid * 0.86) gs *= (gwid * 0.86) / mw;
    const ts = vsize(w, h, 0.04, 12, 16), ss = ts * 0.86;
    if (cols > 1) {
      vtxt(c, q.g, x + gw / 2, y + gh * 0.3, { size: gs, color: vcol(P, q.c), weight: 700, font: "disp" });
      vtxt(c, q.t, x + gw / 2, y + gh * 0.62, { size: ts, color: P.ink, weight: 600 });
      if (q.s) { c.font = `400 ${ss}px ${VFONT.body}`; vwrap(c, q.s, gw - 16).slice(0, 2).forEach((l, j) => vtxt(c, l, x + gw / 2, y + gh * 0.8 + j * ss * 1.25, { size: ss, color: P.ink2, weight: 400 })); }
    } else {
      vtxt(c, q.g, x + gwid / 2, y + gh / 2, { size: gs, color: vcol(P, q.c), weight: 700, font: "disp" });
      const tx = x + gwid, tw = gw - gwid - 14;
      c.font = `400 ${ss}px ${VFONT.body}`; const lines = q.s ? vwrap(c, q.s, tw).slice(0, 2) : [];
      const blockH = ts * 1.3 + lines.length * ss * 1.3, y0 = y + gh / 2 - blockH / 2 + ts * 0.6;
      vtxt(c, q.t, tx, y0, { size: ts, color: P.ink, weight: 600, align: "left" });
      lines.forEach((l, j) => vtxt(c, l, tx, y0 + ts * 1.25 + j * ss * 1.3, { size: ss, color: P.ink2, weight: 400, align: "left" }));
    }
    c.globalAlpha = 1;
  });
};

/* La ola : chacun se lève et se rassoit, seule la perturbation avance. */
VIS.ola = (c, w, h, { t, P }) => {

/* Bouchon sur l'eau : il oscille verticalement, sans suivre la vague. */

/* Particules d'un milieu : onde transverse, longitudinale, ou les deux. */

/* Onde progressive sinusoïdale, avec crête suivie, longueur d'onde, période. */
VIS.wave = (c, w, h, { t, p, P }) => {

/* Onde stationnaire (un mode, ses deux composantes progressives, ou plusieurs modes empilés). */
VIS.standing = (c, w, h, { t, p, P }) => {
  const x0 = w * 0.08, x1 = w * 0.92, L = x1 - x0, fs = vsize(w, h, 0.038, 11, 15);
  const draw = (m, yc, A, om, lbl) => {
    const k = (m * Math.PI) / L, ct = Math.cos(om * t), S = (x) => Math.sin(k * (x - x0));
    vcurve(c, (x) => yc - A * S(x), x0, x1, hexA(P.ink3, 0.35), 1.2, [3, 5]); vcurve(c, (x) => yc + A * S(x), x0, x1, hexA(P.ink3, 0.35), 1.2, [3, 5]);
    if (p.parts) {
      vcurve(c, (x) => yc - (A / 2) * Math.sin(k * (x - x0) - om * t), x0, x1, hexA(P.rose, 0.8), 2, [7, 5]);
      vcurve(c, (x) => yc - (A / 2) * Math.sin(k * (x - x0) + om * t), x0, x1, hexA(P.sky, 0.8), 2, [7, 5]);
    }

    for (let n = 0; n <= m; n++) vdot(c, x0 + (n * L) / m, yc, n === 0 || n === m ? 5 : 6, P.mint);
    if (p.labels) for (let n = 0; n < m; n++) vring(c, x0 + ((n + 0.5) * L) / m, yc, 5, P.rose, 2);
    c.fillStyle = hexA(P.ink2, 0.6); c.fillRect(x0 - 8, yc - A - 6, 6, 2 * A + 12); c.fillRect(x1 + 2, yc - A - 6, 6, 2 * A + 12);
    if (lbl) vtxt(c, lbl, x0 + 4, Math.max(10, yc - A - 12), { size: fs * 0.92, color: P.ink2, align: "left", font: "mono" });
  };
  if (p.stack) {
    const M = p.stack;
    for (let m = 1; m <= M; m++) draw(m, h * ((m - 0.5) / M), (h / M) * 0.3, 1.6 * m, m === 1 ? "m = 1 · fondamental" : `m = ${m}`);
  } else {
    const m = p.m || 3, A = h * 0.24; draw(m, h * 0.55, A, 2.2);
    if (p.labels && m >= 2) {

      vtxt(c, "ventre", x0 + L / (2 * m), h * 0.55 - A - 22, { size: fs, color: P.rose, weight: 600 });
    }
    if (p.parts) vtxt(c, "rose → · ← bleu · somme en noir", w / 2, h * 0.12, { size: fs, color: P.ink2 });

/* Fronts d'onde : plans parallèles, ou sphères autour d'une source (avec zoom au loin). */

  const fs = vsize(w, h, 0.038, 11, 15);

    for (let n = 0; n < 22; n++) { const r = off + n * lam; c.globalAlpha = Math.max(0, 1 - r / (w * 1.25)); vring(c, sx, sy, r, P.sky, 2.4); }

    vtxt(c, "source", sx + 4, sy + 24, { size: fs, color: P.rose, weight: 600, align: "left" });
    if (p.zoom) {

      c.fillStyle = hexA(P.sunS, 0.25); c.fillRect(bx, by, bw, bh);
      c.strokeStyle = P.sun; c.lineWidth = 2; c.setLineDash([6, 5]); c.strokeRect(bx, by, bw, bh); c.setLineDash([]);
      vtxt(c, "loin : presque plan", bx + bw / 2, by - 16, { size: fs, color: P.sun, weight: 600, bg: hexA(P.sunS, 0.5) });

    arrow(c, w * 0.08, h * 0.5, w * 0.92, h * 0.5, P.ink, 2.6);
    vtxt(c, "z (propagation)", w * 0.86, h * 0.5 + 18, { size: fs, color: P.ink, align: "right" });

    } else vtxt(c, "fronts d'onde = plans ⟂ à z", w / 2, h * 0.07, { size: fs, color: P.ink2 });
  }

/* Accélération ∝ courbure : l'équation d'onde en image. */
VIS.curv = (c, w, h, { t, p, P }) => {
  const y0 = h * 0.52, A = h * 0.2, k = (2 * Math.PI) / (w * 0.72), om = 1.8, Y = (x) => A * Math.sin(k * x - om * t), fs = vsize(w, h, 0.038, 11, 15);
  vline(c, 0, y0, w, y0, P.line, 1, [5, 6]);
  vcurve(c, (x) => y0 - Y(x), 0, w, P.lav, 3.2);
  for (let i = 0; i < 17; i++) {
    const x = (w * (i + 0.5)) / 17, y = y0 - Y(x), acc = -Y(x) / A, len = acc * h * 0.13;
    if (Math.abs(len) > 4) arrow(c, x, y, x, y - len, acc > 0 ? P.mint : P.rose, 2.2);
  }
  vtxt(c, "∂²y/∂t² = c² ∂²y/∂x²", w / 2, h * 0.09, { size: fs * 1.05, color: P.ink, weight: 600, bg: hexA(P.lavS, 0.5) });
  if (p.lbl) vtxt(c, "bosse → redescend · creux → remonte", w / 2, h * 0.93, { size: fs, color: P.ink2 });
};

/* Impulsions F(x − ct) et G(x + ct), ou bosse qui se coupe en deux. */
VIS.pulses = (c, w, h, { t, p, P }) => {
  const y0 = h * 0.66, A = h * 0.4, sig = w * 0.065, fs = vsize(w, h, 0.04, 11, 16), g = (x, xc, s = sig) => Math.exp(-(((x - xc) / s) ** 2));
  vline(c, 0, y0, w, y0, P.line, 1.2);
  if (p.mode === "split") {
    const tt = Math.max(0, (t % 7) - 1.2), d = tt * w * 0.085, xm = w * 0.5;
    if (tt > 0) vcurve(c, (x) => y0 - A * g(x, xm), 0, w, hexA(P.ink3, 0.5), 1.5, [4, 5]);
    vcurve(c, (x) => y0 - (A / 2) * g(x, xm + d), 0, w, hexA(P.rose, 0.85), 2, [7, 5]);
    vcurve(c, (x) => y0 - (A / 2) * g(x, xm - d), 0, w, hexA(P.sky, 0.85), 2, [7, 5]);
    vcurve(c, (x) => y0 - (A / 2) * (g(x, xm + d) + g(x, xm - d)), 0, w, P.ink, 3.2);
    if (tt === 0) vtxt(c, "t = 0 : forme initiale f(x)", w / 2, h * 0.12, { size: fs, color: P.ink, weight: 600 });
    else if (d > sig * 1.8) {
      vtxt(c, "f/2 →", xm + d, y0 - A / 2 - 22, { size: fs, color: P.rose, weight: 600 });
      vtxt(c, "← f/2", xm - d, y0 - A / 2 - 22, { size: fs, color: P.sky, weight: 600 });
    }
  } else {
    const tt = t % 7.5, d = tt * w * 0.12, xF = w * 0.12 + d, xG = w * 0.88 - d;
    const onlyF = p.mode === "F", onlyG = p.mode === "G";
    const F = (x) => (onlyG ? 0 : 0.8 * A * g(x, xF)), G = (x) => (onlyF ? 0 : 0.55 * A * g(x, xG, sig * 1.6));
    if (!onlyG && !onlyF) { vcurve(c, (x) => y0 - F(x), 0, w, hexA(P.rose, 0.8), 2, [7, 5]); vcurve(c, (x) => y0 - G(x), 0, w, hexA(P.sky, 0.8), 2, [7, 5]); }
    vcurve(c, (x) => y0 - F(x) - G(x), 0, w, onlyF ? P.rose : onlyG ? P.sky : P.ink, 3.2);
    if (!onlyG && xF < w * 0.95) vtxt(c, "F(x − ct) →", xF, y0 - 0.8 * A - 20, { size: fs, color: P.rose, weight: 600 });
    if (!onlyF && xG > w * 0.05) vtxt(c, "← G(x + ct)", xG, y0 - 0.55 * A - 20, { size: fs, color: P.sky, weight: 600 });
  }
};

/* Réflexion à une extrémité fixe (onde retournée) ou libre (même signe), méthode des images. */
VIS.reflect = (c, w, h, { t, p, P }) => {
  const ends = p.end === "both" ? ["fixed", "free"] : [p.end || "fixed"], fs = vsize(w, h, 0.036, 11, 15);
  ends.forEach((e, j) => {
    const top = (h * j) / ends.length, hh = h / ends.length, y0 = top + hh * 0.6, A = hh * 0.3, x0 = w * 0.05, xL = w * 0.86, sig = w * 0.06;
    const cyc = 6.5, start = x0 - sig * 2.5, xc = start + ((t % cyc) / cyc) * 2 * (xL - start);
    const F = (x) => A * Math.exp(-(((x - xc) / sig) ** 2)), sgn = e === "fixed" ? -1 : 1, y = (x) => F(x) + sgn * F(2 * xL - x);

    vcurve(c, (x) => y0 - y(x), x0, xL, vcol(P, e === "fixed" ? "lav" : "sky"), 3);
    if (e === "fixed") {
      c.fillStyle = hexA(P.ink2, 0.55); c.fillRect(xL, y0 - A - 10, 10, 2 * A + 20);
      for (let k = 0; k < 6; k++) vline(c, xL + 10, y0 - A - 10 + k * ((2 * A + 20) / 6), xL + 22, y0 - A - 10 + (k + 0.6) * ((2 * A + 20) / 6), hexA(P.ink2, 0.4), 1.5);
      vdot(c, xL, y0, 5, P.ink);
    } else {
      vline(c, xL + 6, y0 - A - 12, xL + 6, y0 + A + 12, hexA(P.ink2, 0.6), 3);
      vring(c, xL + 6, y0 - y(xL), 7, P.sky, 3);
    }
    const name = p.names ? (e === "fixed" ? "Dirichlet : f = 0 au bord" : "Neumann : ∂f/∂n = 0 au bord") : e === "fixed" ? "Bout fixe : y(L) = 0 → retournée" : "Bout libre : ∂y/∂x = 0 → même signe";
    vtxt(c, name, x0, top + hh * 0.13, { size: fs, color: P.ink, weight: 600, align: "left", bg: hexA(vsoft(P, e === "fixed" ? "lav" : "sky"), 0.5) });
  });
  if (ends.length > 1) vline(c, w * 0.04, h / 2, w * 0.96, h / 2, P.line, 1);
};

/* Vecteur complexe qui tourne : son ombre sur l'axe réel trace un cosinus. */
VIS.phasor = (c, w, h, { t, p, P }) => {
  const R = Math.min(w * 0.26, h * 0.2), cx = w * 0.5, cy = h * 0.27, om = 1.5, th = -om * t, fs = vsize(w, h, 0.036, 11, 15);
  vline(c, cx - R - 22, cy, cx + R + 22, cy, P.ink3, 1.5); vline(c, cx, cy - R - 18, cx, cy + R + 18, P.ink3, 1.5);
  vtxt(c, "Re", cx + R + 24, cy - 12, { size: fs * 0.9, color: P.ink3, align: "left" }); vtxt(c, "Im", cx + 8, cy - R - 16, { size: fs * 0.9, color: P.ink3, align: "left" });
  vring(c, cx, cy, R, P.line, 2);
  const zx = cx + R * Math.cos(th), zy = cy - R * Math.sin(th);

  vline(c, zx, zy, zx, cy, hexA(P.rose, 0.7), 1.5, [3, 4]); vdot(c, zx, cy, 6, P.rose);
  if (p.deriv) {

    vtxt(c, "× (−iω) : quart de tour", w / 2, cy + R + 26, { size: fs, color: P.sky, weight: 600, bg: hexA(P.skyS, 0.5) });
  }

  vtxt(c, "temps ↓", 8, yB - 10, { size: fs * 0.85, color: P.ink3, align: "left" });
};

/* Câble coaxial : coupe, puis échelle LC parcourue par une impulsion. */
VIS.coax = (c, w, h, { t, P }) => {
  const fs = vsize(w, h, 0.036, 10, 14), cx = w * 0.5, cy = h * 0.21, r3 = Math.min(h * 0.15, w * 0.17), r2 = r3 * 0.82, r1 = r3 * 0.34;
  vdot(c, cx, cy, r3, hexA(P.ink3, 0.55)); vdot(c, cx, cy, r2, hexA(P.skyS, 0.85)); vdot(c, cx, cy, r1, P.sun);
  vtxt(c, "âme", cx - r3 - 14, cy - r3 * 0.4, { size: fs, color: P.sun, weight: 600, align: "right" }); vline(c, cx - r3 - 10, cy - r3 * 0.4, cx - r1 * 0.6, cy - r1 * 0.3, hexA(P.sun, 0.6), 1.2);
  vtxt(c, "isolant εr", cx + r3 + 14, cy - r3 * 0.45, { size: fs, color: P.sky, weight: 600, align: "left" }); vline(c, cx + r3 + 10, cy - r3 * 0.45, cx + (r1 + r2) / 2, cy - r3 * 0.2, hexA(P.sky, 0.6), 1.2);
  vtxt(c, "tresse", cx + r3 + 14, cy + r3 * 0.6, { size: fs, color: P.ink2, weight: 600, align: "left" }); vline(c, cx + r3 + 10, cy + r3 * 0.6, cx + r3 * 0.9, cy + r3 * 0.35, hexA(P.ink2, 0.6), 1.2);
  const yT = h * 0.56, yB = h * 0.84, n = 5, x0 = w * 0.05, x1 = w * 0.95, cell = (x1 - x0) / n, span = x1 - x0 + cell * 2;
  const xp = x0 - cell + ((t * cell * 0.9) % span), V = (x) => Math.exp(-(((x - xp) / (cell * 0.8)) ** 2));
  vline(c, x0, yB, x1, yB, P.ink2, 2.2);

    const xs = x0 + i * cell, lw = (cell * 0.5) / 4;

    for (let j = 0; j < 4; j++) c.arc(xs + (j + 0.5) * lw, yT, lw / 2, Math.PI, 0, false);

/* ----- Champs 2D : repère commun (X, Y) ∈ [−bx, bx] × [−by, by] ----- */
function frame2d(w, h) { const sc = (Math.min(w, h) / 2) * 0.94; return { sc, bx: w / 2 / sc, by: h / 2 / sc, sx: (X) => w / 2 + X * sc, sy: (Y) => h / 2 - Y * sc }; }

    for (let q = 0; q < 3; q++) img.data[o + q] = (c0[q] + (c1[q] - c0[q]) * f) * band;
    img.data[o + 3] = 235;
  }
  x.putImageData(img, 0, 0);
  heatCache = { key, cv };

}

    }

/* Laplacien : comparer un point à la moyenne de ses voisins ; ou diffusion de la chaleur. */

    vtxt(c, "Δ < 0 : ça baisse", sx(0.5), y0 - A * amp - 30, { size: fs * 0.95, color: P.sky, weight: 600 });

      vdot(c, cx, cy, 4, P.sun);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const edge = (dx > 0 && i === nx - 1) || (dx < 0 && i === 0) || (dy > 0 && j === ny - 1) || (dy < 0 && j === 0);
        c.globalAlpha = edge ? 1 : fade; arrow(c, cx + dx * 8, cy + dy * 8, cx + dx * S * 0.44, cy + dy * S * 0.44, edge ? P.mint : P.ink3, edge ? 2.8 : 1.8); c.globalAlpha = 1;
      }
    } else {
      const r = S * 0.28, a0 = t * 1.6;
      c.globalAlpha = 0.35 + 0.65 * fade; c.strokeStyle = P.lav; c.lineWidth = 2.2; c.beginPath(); c.arc(cx, cy, r, a0, a0 + 5.2); c.stroke();
      const ax = cx + r * Math.cos(a0 + 5.2), ay = cy + r * Math.sin(a0 + 5.2); arrow(c, ax - 6 * Math.cos(a0 + 5.2 + 1.57), ay - 6 * Math.sin(a0 + 5.2 + 1.57), ax, ay, P.lav, 2.2);
      c.globalAlpha = 1;
    }
  }
  if (p.kind === "ostro") {
    c.strokeStyle = P.mint; c.lineWidth = 3; c.strokeRect(x0, y0, nx * S, ny * S);
    vtxt(c, "flux sortant total = somme des sources", w / 2, y0 + ny * S + 30, { size: fs, color: P.ink, weight: 700, bg: hexA(P.mintS, 0.6) });
    vtxt(c, "à l'intérieur, les flux se compensent", w / 2, y0 - 22, { size: fs * 0.95, color: P.ink2 });
  } else {
    c.strokeStyle = P.rose; c.lineWidth = 3.4; c.setLineDash([12, 9]); c.lineDashOffset = -t * 40; c.strokeRect(x0, y0, nx * S, ny * S); c.setLineDash([]); c.lineDashOffset = 0;
    vtxt(c, "circulation sur le bord = somme des petits tourbillons", w / 2, y0 + ny * S + 30, { size: fs * 0.95, color: P.ink, weight: 700, bg: hexA(P.roseS, 0.6) });
    vtxt(c, "à l'intérieur, les côtés communs s'annulent", w / 2, y0 - 22, { size: fs * 0.95, color: P.ink2 });
  }
};
