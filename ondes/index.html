    SC("glyph", { g: "Δ", sub: "Δf = ∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z²" }, T`\(\dfrac{1}{c^2}\pdd{f}{t}-\Delta f=s\)`, "Une grandeur f se propage si un sur c carré fois sa dérivée seconde en temps, moins son laplacien, égale s. Le laplacien, c'est la somme des dérivées secondes en x, y et z. Et s, c'est la source."),
    SC("curv", {}, "Dérivée seconde en temps = <b>accélération</b> ; en espace = <b>courbure</b>", "Comment la lire ? La dérivée seconde en temps, c'est l'accélération. La dérivée seconde en espace, c'est la courbure. Là où la corde est très courbée, elle accélère fort, vers l'axe."),
    SC("curv", { lbl: true }, T`Sans source : <b>d'Alembert</b> \(\Delta f-\dfrac{1}{c^2}\pdd{f}{t}=0\)`, "Loin de la source, s est nul : c'est l'équation de d'Alembert. En général, on ne sait pas la résoudre à la main."),
    SC("reflect", { end: "both", names: true }, "Les <b>conditions aux limites</b> fixent la solution", "Ce qui fixe la solution, ce sont les conditions aux limites. Dirichlet : f est nulle sur le bord, comme une corde attachée. Neumann : c'est la dérivée normale qui est nulle, comme une extrémité libre.")
  ],
  quiz: { q: "La condition de Dirichlet impose…", o: [T`\(f=0\) sur la frontière`, T`\(\partial f/\partial n=0\) sur la frontière`, T`\(s=0\) partout`], why: T`Neumann porte sur la dérivée normale ; Dirichlet porte sur la valeur de \(f\).` } });

addShort({ id: "cm1-7", cm: "cm1", sec: 6, g: "F+G", title: "La solution à une dimension",
  scenes: [
    SC("pulses", { mode: "cross" }, "Deux bosses qui se croisent… sans se casser 🤝", "Regarde : deux bosses partent l'une vers l'autre, se superposent, puis repartent intactes. C'est toute la solution de d'Alembert à une dimension."),
    SC("glyph", { g: "F + G", size: 0.22 }, T`\(f(x,t)=F(x-ct)+G(x+ct)\)`, "La solution générale s'écrit : f égale F de x moins c t, plus G de x plus c t. Une somme, jamais un produit ! C'est la démo 1."),
    SC("pulses", { mode: "F" }, T`\(F(x-ct)\) : vers les \(x\) croissants →`, "Pourquoi F va vers la droite ? Pour garder la même valeur, il faut x moins c t constant. Donc x augmente de c t : l'onde avance à la vitesse c, vers les x positifs."),
    SC("pulses", { mode: "G" }, T`← \(G(x+ct)\) : vers les \(x\) décroissants`, "Pour G, c'est x plus c t qui reste constant : x diminue, l'onde part vers les x négatifs, toujours à la vitesse c."),
    SC("pulses", { mode: "cross" }, "Sans se <b>déformer</b> : la forme est conservée", "Et dans les deux cas, l'onde ne se déforme pas : la forme F ou G est simplement translatée. À retenir : d x sur d t égale plus ou moins c.")
  ],
  quiz: { q: T`\(G(x+ct)\) se propage…`, o: [T`vers les \(x\) décroissants, à la vitesse \(c\)`, T`vers les \(x\) croissants, à la vitesse \(c\)`, "sur place"], why: T`\(x+ct=\text{cte}\Rightarrow dx/dt=-c\).` } });

addShort({ id: "cm1-8", cm: "cm1", sec: 7, g: "eⁱᶿ", title: "Régime harmonique et complexes",
  scenes: [
    SC("phasor", {}, "Un cosinus, c'est l'ombre d'un vecteur qui tourne 🌀", "Astuce géniale : un cosinus, c'est l'ombre d'un vecteur qui tourne. Le point rose, projeté sur l'axe réel, dessine exactement un cosinus."),
    SC("phasor", {}, T`\(A\cos(kx-\omega t-\varphi)=\mathrm{Re}\{A\,e^{i(kx-\omega t-\varphi)}\}\)`, "On représente donc le signal par un nombre complexe qui tourne. La grandeur physique, c'est sa partie réelle."),
    SC("phasor", { deriv: true }, T`Dériver par rapport à \(t\) = multiplier par \(-i\omega\)`, "Le super-pouvoir : dériver par rapport au temps revient à multiplier par moins i oméga. Géométriquement, c'est un quart de tour et un facteur oméga. Plus de dérivées, juste des multiplications !"),
    SC("glyph", { g: "ik", sub: "∂/∂x → × ik" }, T`Dériver par rapport à \(x\) = multiplier par \(ik\)`, "Même chose en espace : dériver par rapport à x revient à multiplier par i k. Les équations aux dérivées partielles deviennent des équations algébriques."),
    SC("cards", { items: [{ g: "Re", t: "Partie réelle", s: "Re z = (z + z*) / 2", c: "lav" }, { g: "Im", t: "Partie imaginaire", s: "Im z = (z − z*) / 2i", c: "sky" }, { g: "|z|²", t: "Module au carré", s: "|z|² = z z*", c: "rose" }] }, "Les trois formules des complexes", "Les formules à connaître : la partie réelle égale z plus z conjugué sur deux, la partie imaginaire égale z moins z conjugué sur deux i, et le module au carré égale z fois z conjugué."),
    SC("glyph", { g: "Δf + k²f", size: 0.15, sub: "Helmholtz · démo 2" }, T`En régime harmonique : \(\Delta f+k^2f=-s\), \(k=\dfrac{\omega}{c}\)`, "Appliqué à l'équation d'onde avec une source sinusoïdale, on obtient l'équation de Helmholtz : laplacien de f plus k carré f égale moins s, avec k égale oméga sur c. C'est la démo 2.")
  ],
  quiz: { q: T`Avec la convention \(e^{-i\omega t}\), \(\partial/\partial t\) devient…`, o: [T`\(\times(-i\omega)\)`, T`\(\times(ik)\)`, T`\(\times\omega^2\)`], why: T`\(\frac{d}{dt}e^{-i\omega t}=-i\omega\,e^{-i\omega t}\).` } });

/* ===================== CM2 ===================== */
addShort({ id: "cm2-1", cm: "cm2", sec: 0, g: "⊚", title: "Le câble coaxial",
  scenes: [
    SC("coax", {}, "Dans ton câble d'antenne : deux conducteurs <b>coaxiaux</b> 📺", "Un câble coaxial, c'est deux conducteurs de même axe : l'âme, le fil central plein, et la tresse, un cylindre creux. Entre les deux, un isolant."),
    SC("coax", {}, T`Un tronçon \(dx\) = une bobine \(\ell\,dx\) + un condensateur \(\gamma\,dx\)`, "Le modèle : on découpe le câble en petits tronçons de longueur d x. Chacun est un circuit L C : une bobine d'inductance l d x, et un condensateur de capacité gamma d x."),
    SC("coax", {}, "Le signal se propage de cellule en cellule", "La bobine modélise l'induction entre les conducteurs, le condensateur l'effet capacitif. Le signal avance en chargeant les condensateurs les uns après les autres."),
    SC("glyph", { g: "V, I", sub: "équations couplées" }, T`\(\pd{V}{x}=-\ell\pd{I}{t}\qquad \pd{I}{x}=-\gamma\pd{V}{t}\)`, "La loi des mailles et la loi des nœuds donnent deux équations couplées : la dérivée de V en x égale moins l fois la dérivée de I en t, et la dérivée de I en x égale moins gamma fois la dérivée de V en t."),
    SC("glyph", { g: "∂²", sub: "on découple" }, T`On découple : \(\pdd{V}{x}-\ell\gamma\pdd{V}{t}=0\)`, "On dérive l'une par rapport à x, l'autre par rapport à t, et on combine. On obtient une équation de d'Alembert, la même pour V et pour I. C'est la démo 3."),
    SC("cards", { items: [{ g: "c₀", t: "Célérité", s: "c₀ = 1 / √(ℓγ)", c: "sky" }, { g: "⚡", t: "Exemple du TP", s: "γ = 100 pF/m, ℓ = 0,25 µH/m → c₀ = 2·10⁸ m/s", c: "sun" }] }, T`\(c_0=\dfrac{1}{\sqrt{\ell\gamma}}\approx\dfrac{2}{3}\,c\)`, "La célérité vaut un sur racine de l gamma. Avec les valeurs du TP, cent picofarads par mètre et zéro virgule vingt-cinq microhenrys par mètre, on trouve deux fois dix puissance huit mètres par seconde : les deux tiers de la vitesse de la lumière.")
  ],
  quiz: { q: T`Dans le modèle du câble coaxial, un tronçon \(dx\) contient…`, o: [T`une bobine \(\ell\,dx\) et un condensateur \(\gamma\,dx\)`, "une résistance et un condensateur", "deux bobines en série"], why: "Modèle à constantes réparties, sans pertes : inductance et capacité linéiques." } });

addShort({ id: "cm2-2", cm: "cm2", sec: 1, g: "🔊", title: "L'onde sonore",
  scenes: [
    SC("fluid", { slice: false }, "Le son = des <b>compressions</b> et des <b>dilatations</b> qui voyagent", "Le son, c'est une onde de compression et de dilatation, qui se propage dans un milieu matériel élastique, comme l'air. Les molécules se serrent, puis s'écartent."),
    SC("fluid", {}, "Onde <b>longitudinale</b> : énergie oui, matière non", "C'est une onde longitudinale : les molécules oscillent dans la direction de propagation, sans voyager. La tranche violette avance puis recule, autour de sa position."),
    SC("glyph", { g: "p ≪ P₀", size: 0.18, sub: "p ≈ 10⁻⁷ P₀" }, T`\(P=P_0+p\) : la surpression \(p\) est <b>minuscule</b>`, "On écrit la pression P égale P zéro plus p, la surpression. Elle est minuscule : de l'ordre de dix puissance moins sept fois la pression atmosphérique pour un son courant. C'est ce qui justifie de linéariser."),
    SC("cards", { items: [{ g: "1", t: "PFD", s: "−∂p/∂x = ρ₀ ∂v/∂t", c: "lav" }, { g: "2", t: "Conservation de la masse", s: "∂ρ/∂t = −ρ₀ ∂v/∂x", c: "sky" }, { g: "3", t: "Compressibilité χs", s: "ρ = ρ₀ χs p", c: "rose" }] }, "Les 3 équations de la démo 4", "Trois équations. Un : le principe fondamental de la dynamique. Deux : la conservation de la masse, au premier ordre. Trois : la compressibilité isentropique, qui relie surdensité et surpression."),
    SC("glyph", { g: "⏱", sub: "adiabatique et réversible" }, "Pourquoi <b>isentropique</b> ? Trop rapide pour échanger de la chaleur", "Pourquoi isentropique ? La longueur de l'onde est immense devant le libre parcours moyen des molécules. La chaleur n'a pas le temps de diffuser : l'évolution est adiabatique, et réversible."),
    SC("cards", { items: [{ g: "c_s", t: "Célérité", s: "c_s = 1 / √(ρ₀ χs)", c: "lav" }, { g: "🌬", t: "Air", s: "≈ 340 m/s", c: "sky" }, { g: "💧", t: "Eau", s: "≈ 1 480 m/s", c: "mint" }] }, T`\(c_s=\dfrac{1}{\sqrt{\rho_0\chi_S}}\)`, "On combine, et on trouve une équation de d'Alembert, avec c s égale un sur racine de rho zéro khi s. C'est une compétition entre l'inertie et l'élasticité : trois cent quarante mètres par seconde dans l'air, mille quatre cent quatre-vingts dans l'eau.")
  ],
  quiz: { q: "Le son va plus vite dans l'eau que dans l'air car…", o: [T`l'eau est beaucoup moins compressible (\(\chi_S\) petit)`, "l'eau est moins dense", "l'eau transmet des ondes transverses"], why: T`\(c_s=1/\sqrt{\rho_0\chi_S}\) : l'eau est plus dense, mais bien moins compressible, et c'est ce qui l'emporte.` } });

addShort({ id: "cm2-3", cm: "cm2", sec: 2, g: "🎸", title: "La corde vibrante",
  scenes: [
    SC("glyph", { g: "🎸", sub: "CM2 · 03" }, "D'où vient l'onde sur une corde de guitare ?", "Pince une corde de guitare : une onde transverse la parcourt. D'où vient son équation ? D'un simple bilan de forces."),
    SC("string_el", {}, "Modèle : corde <b>souple</b>, <b>tendue</b>, poids négligé", "Le modèle : la corde est infiniment souple, sans raideur, pré-tendue, et on néglige son poids. La tension est toujours tangente à la corde."),
    SC("string_el", { net: true }, "Les tensions aux deux bouts ne se compensent pas → <b>force verticale</b>", "Sur un petit morceau d x, la tension tire à gauche et à droite, le long de la corde. Comme la corde est courbée, les deux forces ne se compensent pas : il reste une petite force verticale."),
    SC("string_el", { net: true, angles: true }, T`Petits angles : \(\cos\theta\approx1\), \(\sin\theta\approx\tan\theta=\pd{y}{x}\)`, "En petites amplitudes, cosinus thêta vaut environ un, et sinus thêta vaut environ tangente thêta, c'est-à-dire la pente. Sur x, on obtient une tension uniforme ; sur y, la différence des pentes."),
    SC("glyph", { g: "√(T/μ)", size: 0.18 }, T`\(\pdd{y}{x}-\dfrac{\mu}{T}\pdd{y}{t}=0,\quad c=\sqrt{\dfrac{T}{\mu}}\)`, "Le principe fondamental donne l'équation de d'Alembert, avec c égale racine de T sur mu. Plus la corde est tendue, plus l'onde va vite ; plus elle est lourde, plus elle est lente. C'est la démo 5.")
  ],
  quiz: { q: "Si on tend 4 fois plus la corde, la célérité est…", o: ["multipliée par 2", "multipliée par 4", "divisée par 2"], why: T`\(c=\sqrt{T/\mu}\) et \(\sqrt4=2\).` } });

addShort({ id: "cm2-4a", cm: "cm2", sec: 3, part: "1/4", g: "∇f", title: "Gradient et nabla",
  scenes: [
    SC("glyph", { g: "∇", sub: "CM2 · 04 · partie 1 sur 4" }, "Opérateurs vectoriels : zéro panique 😌", "Gradient, divergence, rotationnel : ça fait peur, mais ce sont juste des façons de mesurer comment un champ varie dans l'espace. On commence par le gradient."),
    SC("grad", {}, T`Un <b>champ scalaire</b> \(f(x,y)\) : un nombre en chaque point`, "Un champ scalaire, c'est un nombre en chaque point de l'espace. Imagine une carte d'altitude : en chaque point, une hauteur. Rose : c'est haut. Bleu : c'est bas."),
    SC("grad", { hiker: true }, T`Le <b>gradient</b> pointe là où \(f\) <b>monte le plus vite</b> ⛰️`, "Tu es randonneur sur cette carte. Le gradient, c'est la flèche qui t'indique la direction de la montée la plus raide. Sa longueur dit à quel point ça grimpe. Au sommet, il s'annule."),
    SC("grad", { arrows: true }, T`En chaque point, un vecteur : \(\grad f\)`, "On peut dessiner cette flèche en chaque point : le gradient transforme un champ scalaire en champ de vecteurs. Les flèches sont perpendiculaires aux lignes de niveau, et longues là où la pente est forte."),
    SC("cards", { items: [{ g: "∂f/∂x", t: "Pente selon x", s: "composante sur u_x", c: "rose" }, { g: "∂f/∂y", t: "Pente selon y", s: "composante sur u_y", c: "mint" }, { g: "∂f/∂z", t: "Pente selon z", s: "composante sur u_z", c: "sky" }] }, T`\(\grad f=\pd{f}{x}\vec{u}_x+\pd{f}{y}\vec{u}_y+\pd{f}{z}\vec{u}_z\)`, "En formule : chaque composante du gradient, c'est la pente dans une direction. La dérivée partielle de f par rapport à x sur u x, par rapport à y sur u y, et par rapport à z sur u z."),
    SC("glyph", { g: "∇", sub: "nabla = (∂/∂x, ∂/∂y, ∂/∂z)" }, T`\(\vec\nabla=\vec{u}_x\pd{}{x}+\vec{u}_y\pd{}{y}+\vec{u}_z\pd{}{z}\)`, "Pour aller plus vite, on invente nabla : un vecteur dont les composantes sont des dérivées partielles, qui attendent qu'on leur donne quelque chose à dériver. Le gradient, c'est simplement nabla f."),
    SC("cards", { items: [{ g: "∇f", t: "Gradient", s: "nabla × un scalaire → vecteur", c: "sun" }, { g: "∇·V", t: "Divergence", s: "produit scalaire → scalaire", c: "sky" }, { g: "∇∧V", t: "Rotationnel", s: "produit vectoriel → vecteur", c: "rose" }] }, "Tout le reste = nabla « multiplié » de 3 façons", "Et voilà le secret des opérateurs : nabla multiplié par un scalaire donne le gradient. Nabla scalaire un vecteur donne la divergence. Nabla vectoriel un vecteur donne le rotationnel. Suite dans la prochaine vidéo !")
  ],
  quiz: { q: "Le gradient d'un champ scalaire est…", o: ["un vecteur qui pointe vers la montée la plus raide", "un scalaire qui mesure la pente moyenne", "un vecteur tangent aux lignes de niveau"], why: T`\(\grad f\) est perpendiculaire aux lignes de niveau et pointe vers les \(f\) croissants.` } });

addShort({ id: "cm2-4b", cm: "cm2", sec: 3, part: "2/4", g: "∇·V", title: "La divergence",
  scenes: [
    SC("glyph", { g: "∇·", sub: "CM2 · 04 · partie 2 sur 4" }, "La divergence : est-ce que ça <b>jaillit</b> ? ⛲", "Deuxième opérateur : la divergence. Elle s'applique à un champ de vecteurs, par exemple le champ des vitesses d'un fluide."),
    SC("field", { f: "source", parts: true }, "Un <b>champ de vecteurs</b> : une flèche en chaque point", "Un champ de vecteurs, c'est une flèche en chaque point. Ici, de l'eau qui jaillit d'un robinet au centre : les particules s'écartent dans toutes les directions."),
    SC("field", { f: "source", parts: true, box: true }, T`Plus de flux qui <b>sort</b> qu'il n'en entre : \(\dive\vec V>0\)`, "Pose une petite boîte autour d'un point. S'il sort plus de fluide qu'il n'en entre, le point est une source : la divergence est positive."),
    SC("field", { f: "sink", parts: true, box: true }, T`Plus de flux qui <b>entre</b> : \(\dive\vec V<0\) (puits)`, "À l'inverse, si le fluide converge et disparaît, comme dans la bonde d'un évier, il entre plus qu'il ne sort : c'est un puits, la divergence est négative."),
    SC("field", { f: "uniform", parts: true, box: true }, T`Autant qui entre que qui sort : \(\dive\vec V=0\)`, "Et pour un écoulement uniforme ? Tout ce qui entre à gauche ressort à droite. Rien ne se crée, rien ne disparaît : la divergence est nulle."),
    SC("cards", { items: [{ g: "∂Vx/∂x", t: "Vx varie selon x ?", s: "", c: "rose" }, { g: "∂Vy/∂y", t: "Vy varie selon y ?", s: "", c: "mint" }, { g: "∂Vz/∂z", t: "Vz varie selon z ?", s: "", c: "sky" }] }, T`\(\dive\vec V=\vec\nabla\cdot\vec V=\pd{V_x}{x}+\pd{V_y}{y}+\pd{V_z}{z}\)`, "En formule, c'est le produit scalaire de nabla avec V : la dérivée de V x par rapport à x, plus celle de V y par rapport à y, plus celle de V z par rapport à z. Le résultat est un nombre, un scalaire."),
    SC("field", { f: "source", arrows: true }, T`En électromagnétisme : \(\dive\vec E=\dfrac{\rho}{\varepsilon_0}\)`, "Pourquoi c'est utile ? Maxwell-Gauss dit que la divergence de E vaut rho sur epsilon zéro : les charges positives sont des sources de champ électrique. Et la divergence de B est nulle : le champ magnétique n'a pas de source.")
  ],
  quiz: { q: T`Pour un écoulement uniforme \(\vec V=V_0\,\vec u_x\), \(\dive\vec V\) vaut…`, o: ["0", T`\(V_0\)`, T`\(+\infty\)`], why: T`\(V_x=V_0\) est constant : toutes les dérivées sont nulles. Tout ce qui entre ressort.` } });

addShort({ id: "cm2-4c", cm: "cm2", sec: 3, part: "3/4", g: "∇∧V", title: "Le rotationnel",
  scenes: [
    SC("glyph", { g: "∇∧", sub: "CM2 · 04 · partie 3 sur 4" }, "Le rotationnel : est-ce que ça <b>tourne</b> ? 🌀", "Troisième opérateur : le rotationnel. Il mesure à quel point un champ de vecteurs tourne autour d'un point."),
    SC("field", { f: "vortex", parts: true, paddle: [0, 0] }, "Pose un petit <b>moulinet</b> dans l'écoulement…", "L'astuce : pose un petit moulinet dans le fluide. Ici, un tourbillon : le moulinet se met à tourner sur lui-même. Le rotationnel est non nul."),
    SC("field", { f: "vortex", parts: true, paddle: [0.45, 0.2] }, T`Même décalé, il tourne : \(\rot\vec V\neq\vec 0\)`, "Même si tu le poses loin du centre, il tourne encore sur lui-même. Le rotationnel est une propriété locale, définie en chaque point."),
    SC("field", { f: "uniform", parts: true, paddle: [0, 0] }, "Écoulement uniforme : le moulinet <b>ne tourne pas</b>", "Dans un écoulement uniforme, le moulinet est poussé pareil de tous les côtés : il ne tourne pas. Le rotationnel est nul."),
    SC("field", { f: "shear", parts: true, paddle: [0, 0] }, "Piège : un <b>cisaillement</b> fait tourner, même sans tourbillon !", "Piège : ici, le fluide va tout droit, mais plus vite en haut qu'en bas. Le moulinet est poussé plus fort d'un côté : il tourne ! Le rotationnel est non nul, même sans tourbillon visible."),
    SC("glyph", { g: "∇∧V", size: 0.2, sub: "un vecteur, porté par l'axe de rotation" }, T`\(\rot\vec V=\vec\nabla\wedge\vec V\) : un <b>vecteur</b>`, "Le rotationnel, c'est le produit vectoriel de nabla avec V. C'est un vecteur : sa direction donne l'axe de rotation du moulinet, et sa norme, la vitesse de rotation."),
    SC("cards", { items: [{ g: "x", t: "∂Vz/∂y − ∂Vy/∂z", s: "on utilise y et z", c: "rose" }, { g: "y", t: "∂Vx/∂z − ∂Vz/∂x", s: "on utilise z et x", c: "mint" }, { g: "z", t: "∂Vy/∂x − ∂Vx/∂y", s: "on utilise x et y", c: "sky" }] }, T`\(\rot\vec V=\begin{pmatrix}\pd{V_z}{y}-\pd{V_y}{z}\\ \pd{V_x}{z}-\pd{V_z}{x}\\ \pd{V_y}{x}-\pd{V_x}{y}\end{pmatrix}\)`, "Pour retenir les composantes, pense produit vectoriel. Pour la composante selon x, on utilise y et z, dans l'ordre circulaire : la dérivée de V z par rapport à y, moins la dérivée de V y par rapport à z. Puis on fait tourner les lettres : x, y, z, x, y."),
    SC("field", { f: "vortex", parts: true }, T`En électromagnétisme : \(\rot\vec E=-\pd{\vec B}{t}\)`, "Et en électromagnétisme ? Maxwell-Faraday : le rotationnel de E égale moins la dérivée de B par rapport au temps. Un champ magnétique qui varie crée un champ électrique qui tourne autour. C'est le principe de l'induction.")
  ],
  quiz: { q: T`Pour l'écoulement \(\vec V=a\,y\,\vec u_x\) (plus rapide en haut), le rotationnel vaut…`, o: [T`\(-a\,\vec u_z\) : non nul`, "zéro, car le fluide va tout droit", T`\(a\,\vec u_x\)`], why: T`\((\rot\vec V)_z=\pd{V_y}{x}-\pd{V_x}{y}=0-a=-a\).` } });

addShort({ id: "cm2-4d", cm: "cm2", sec: 3, part: "4/4", g: "Δ", title: "Laplacien et double rotationnel",
  scenes: [
    SC("glyph", { g: "Δ", sub: "CM2 · 04 · partie 4 sur 4" }, "Le laplacien : es-tu plus bas que tes <b>voisins</b> ? 🏘️", "Dernier opérateur : le laplacien, noté delta. C'est celui de l'équation d'onde, et il a une signification très simple."),
    SC("lap", {}, T`\(\Delta f>0\) : plus bas que la moyenne des voisins (creux)`, "Compare la valeur de f en un point à la moyenne de ses voisins. Si le point est plus bas que ses voisins, on est dans un creux : le laplacien est positif. Dans une bosse, plus haut que ses voisins, il est négatif."),
    SC("lap", { mode: "heat" }, "Exemple : la chaleur. Les bosses <b>s'aplatissent</b>", "Exemple concret : la température. Une zone chaude, en bosse, a un laplacien négatif : elle refroidit. Les zones autour, en creux, ont un laplacien positif : elles se réchauffent. Le laplacien lisse tout."),
    SC("cards", { items: [{ g: "Δf", t: "Laplacien scalaire", s: "Δf = div(grad f)", c: "lav" }, { g: "∑", t: "Somme des dérivées secondes", s: "∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z²", c: "sky" }] }, T`\(\Delta f=\dive(\grad f)=\pdd{f}{x}+\pdd{f}{y}+\pdd{f}{z}\)`, "En formule : le laplacien, c'est la divergence du gradient. Ce qui donne la somme des dérivées secondes, en x, en y et en z."),
    SC("glyph", { g: "ΔV", size: 0.22, sub: "composante par composante" }, T`Pour un vecteur : \(\Delta\vec V=(\Delta V_x)\vec u_x+(\Delta V_y)\vec u_y+(\Delta V_z)\vec u_z\)`, "Pour un champ de vecteurs, on applique le laplacien à chaque composante. Rien de plus."),
    SC("cards", { items: [{ g: "rot rot", t: "Double rotationnel", s: "= grad(div V) − ΔV", c: "rose" }, { g: "⭐", t: "À savoir par cœur", s: "clé de toutes les équations d'onde électromagnétiques", c: "sun" }] }, T`\(\rot(\rot\vec V)=\grad(\dive\vec V)-\Delta\vec V\)`, "Et la formule à connaître par cœur : le rotationnel du rotationnel égale le gradient de la divergence, moins le laplacien. C'est elle qui fait apparaître le laplacien dans les équations de Maxwell."),
    SC("glyph", { g: "→ onde", size: 0.17, sub: "div E = 0 ⇒ rot rot E = −ΔE" }, T`Dans le vide, \(\dive\vec E=0\) donc \(\rot(\rot\vec E)=-\Delta\vec E\)`, "Dans le vide, la divergence de E est nulle. Il reste : rot rot E égale moins laplacien de E. Combiné à Faraday et Ampère, ça donne l'équation d'onde de la lumière. Bravo, tu as fini les opérateurs !")
  ],
  quiz: { q: T`En un point où \(f\) présente un minimum (un creux), \(\Delta f\) est…`, o: ["positif", "négatif", "toujours nul"], why: T`Au fond d'un creux, \(f\) est plus petite que la moyenne de ses voisins : les dérivées secondes sont positives.` } });

addShort({ id: "cm2-5a", cm: "cm2", sec: 4, part: "1/2", g: "◠", title: "Le principe de Huygens",
  scenes: [
    SC("huygens", { env: false }, "Chaque point d'un front d'onde est une <b>nouvelle source</b> 💡", "Le principe de Huygens : chaque point d'un front d'onde se comporte comme une petite source, qui émet une onde sphérique."),
    SC("huygens", {}, "Le nouveau front = l'<b>enveloppe</b> de toutes ces ondelettes", "Toutes ces petites ondes sphériques interfèrent. Leur enveloppe forme le nouveau front d'onde, un peu plus loin. Et on recommence."),
    SC("huygens", { mode: "slit" }, "Une ouverture : l'onde <b>s'étale</b> (diffraction)", "Si l'onde passe par une ouverture, seuls les points de l'ouverture émettent. L'onde s'étale de l'autre côté : c'est la diffraction."),
    SC("glyph", { g: "E(x′, y′)", size: 0.15, sub: "somme d'ondes sphériques" }, "Champ observé = <b>somme</b> des ondes sphériques de l'ouverture", "Le champ observé sur un écran, c'est la somme des ondes sphériques émises par tous les points de l'ouverture.")
  ],
  quiz: { q: "Selon Huygens, chaque point d'un front d'onde…", o: ["émet une onde sphérique", "absorbe l'onde", "reste au repos"], why: "Le nouveau front est l'enveloppe des ondelettes émises par chaque point." } });

addShort({ id: "cm2-5b", cm: "cm2", sec: 4, part: "2/2", g: "E⊥B", title: "De Maxwell à l'onde lumineuse",
  scenes: [
    SC("cards", { cols: 2, items: [{ g: "∇·E", t: "Gauss", s: "div E = 0", c: "rose" }, { g: "∇·B", t: "Flux", s: "div B = 0", c: "sky" }, { g: "∇∧E", t: "Faraday", s: "rot E = −∂B/∂t", c: "sun" }, { g: "∇∧B", t: "Ampère", s: "rot B = με ∂E/∂t", c: "mint" }] }, "Maxwell dans le vide : <b>sans charge ni courant</b>", "Les équations de Maxwell, sans charge ni courant : divergence de E nulle, divergence de B nulle, rotationnel de E égale moins la dérivée de B, rotationnel de B égale mu epsilon fois la dérivée de E."),
    SC("glyph", { g: "∇∧", sub: "rotationnel de Faraday" }, T`\(\rot(\rot\vec E)=-\pd{}{t}\left(\rot\vec B\right)\)`, "La recette : on prend le rotationnel de Maxwell-Faraday. À gauche, rot rot E. À droite, on permute les dérivées : moins la dérivée en temps du rotationnel de B."),
    SC("glyph", { g: "−με ∂²E/∂t²", size: 0.11 }, T`\(\rot(\rot\vec E)=-\mu\varepsilon\pdd{\vec E}{t}\)`, "On remplace rot B grâce à Maxwell-Ampère : on obtient moins mu epsilon fois la dérivée seconde de E par rapport au temps."),
    SC("glyph", { g: "−ΔE", size: 0.2, sub: "car div E = 0" }, T`Or \(\rot(\rot\vec E)=\grad(\underbrace{\dive\vec E}_{0})-\Delta\vec E=-\Delta\vec E\)`, "Avec la formule du double rotationnel, et la divergence de E nulle, le membre de gauche vaut moins le laplacien de E."),
    SC("emwave", {}, T`\(\Delta\vec E-\mu\varepsilon\pdd{\vec E}{t}=\vec 0,\quad \mu\varepsilon=\dfrac{1}{c^2}\)`, "Résultat : une équation de d'Alembert pour E, avec mu epsilon égale un sur c carré. La lumière est une onde électromagnétique !"),
    SC("emwave", { triad: true }, T`\(\vec E\), \(\vec B\) et la propagation : <b>perpendiculaires</b> deux à deux`, "Et si E est selon y et que l'onde va selon x, Maxwell-Faraday montre que B est selon z. E, B et la direction de propagation sont perpendiculaires deux à deux.")
  ],
  quiz: { q: T`Pour obtenir l'équation d'onde de \(\vec E\), on part du rotationnel de…`, o: ["Maxwell-Faraday", "Maxwell-Gauss", "la conservation de la charge"], why: T`\(\rot(\rot\vec E)\), puis Maxwell-Ampère et \(\dive\vec E=0\).` } });

/* ===================== CM3 ===================== */
addShort({ id: "cm3-1", cm: "cm3", sec: 0, g: "f/2", title: "Conditions initiales",
  scenes: [
    SC("pulses", { mode: "split" }, "Tu déformes une corde infinie, puis tu lâches… 🫳", "On déforme une corde infinie, et on la lâche sans vitesse. Que se passe-t-il ? La bosse se coupe en deux !"),
    SC("glyph", { g: "f, b", sub: "forme et vitesse à t = 0" }, T`À \(t=0\) : \(y(x,0)=f(x)\) et \(\pd{y}{t}(x,0)=b(x)\)`, "Les conditions initiales : à t égale zéro, on connaît la forme, f de x, et la vitesse, b de x. On cherche y sous la forme F de x moins v t, plus G de x plus v t."),
    SC("cards", { items: [{ g: "F+G", t: "La forme", s: "F(x) + G(x) = f(x)", c: "lav" }, { g: "G′−F′", t: "La vitesse", s: "v (G′ − F′) = b(x)", c: "rose" }] }, T`\(F+G=f\qquad v\,(G'-F')=b\)`, "On écrit les deux conditions à t égale zéro. La forme donne F plus G égale f. La vitesse donne v fois G prime moins F prime égale b. On intègre la seconde, puis on additionne et on soustrait."),
    SC("glyph", { g: "½", sub: "solution de d'Alembert" }, T`\(y=\dfrac{f(x-vt)+f(x+vt)}{2}+\dfrac{1}{2v}\displaystyle\int_{x-vt}^{x+vt}b(s)\,ds\)`, "Résultat : y égale la moyenne de f en x moins v t et en x plus v t, plus un terme intégral dû à la vitesse initiale."),
    SC("pulses", { mode: "split" }, "Sans vitesse initiale : deux ondes de <b>demi-amplitude</b>", "Sans vitesse initiale, il ne reste que le premier terme : deux ondes qui partent en sens inverse, avec chacune la forme initiale et la moitié de l'amplitude.")
  ],
  quiz: { q: T`Corde lâchée sans vitesse depuis une bosse de hauteur \(h\) : on obtient…`, o: [T`deux bosses de hauteur \(h/2\) qui s'éloignent`, T`une bosse de hauteur \(h\) qui avance`, "une onde stationnaire"], why: T`\(b=0\Rightarrow y=\frac{f(x-vt)+f(x+vt)}{2}\).` } });

addShort({ id: "cm3-2", cm: "cm3", sec: 1, g: "⊣", title: "Conditions aux limites",
  scenes: [
    SC("reflect", { end: "fixed" }, "Bout <b>fixe</b> : l'onde revient <b>à l'envers</b> 🙃", "Une bosse arrive au bout d'une corde attachée. Elle se réfléchit… et revient à l'envers ! Pourquoi ?"),
    SC("reflect", { end: "fixed" }, T`\(y(L,t)=0\Rightarrow G(u)=-F(2L-u)\)`, "Le bout est fixe : y de L égale zéro à chaque instant. Donc G de L plus v t égale moins F de L moins v t. L'onde réfléchie est l'onde incidente, retournée."),
    SC("reflect", { end: "free" }, T`Bout <b>libre</b> : \(\pd{y}{x}(L,t)=0\), <b>même signe</b>`, "Avec un bout libre, par exemple un anneau qui glisse sur une tige, aucune force n'est appliquée : c'est la pente qui est nulle. L'onde revient du même côté, avec la même amplitude et la même phase."),
    SC("reflect", { end: "both" }, "Fixe : retournée · Libre : identique", "Résumé : extrémité fixe, onde retournée. Extrémité libre, onde identique."),
    SC("standing", { m: 1 }, T`Fixée aux <b>deux</b> bouts : mouvement périodique, \(T=\dfrac{2L}{v}\)`, "Si la corde est fixée aux deux bouts, l'onde fait des allers-retours. Le mouvement devient périodique, de période T égale deux L sur v : le temps d'un aller-retour.")
  ],
  quiz: { q: "À une extrémité fixe, l'onde réfléchie est…", o: ["retournée (signe opposé)", "identique", "absorbée"], why: T`\(y(L,t)=0\) impose \(G(u)=-F(2L-u)\).` } });

addShort({ id: "cm3-3", cm: "cm3", sec: 2, g: "∿∿", title: "Les modes propres",
  scenes: [
    SC("standing", { stack: 4 }, "Les seules façons de vibrer d'une corde : les <b>modes propres</b> 🎶", "Une corde fixée aux deux bouts ne peut vibrer que de certaines façons : ce sont les modes propres. Le premier, c'est le fondamental, puis viennent les harmoniques."),
    SC("glyph", { g: "∑", sub: "série de Fourier" }, T`\(y=\displaystyle\sum_{m\geq1}\big[a_m\cos(\omega_mt)+b_m\sin(\omega_mt)\big]\sin(k_mx)\)`, "Toute vibration de la corde est une somme de modes propres : c'est une série de Fourier. Chaque terme est un sinus en x, qui oscille dans le temps."),
    SC("cards", { cols: 2, items: [{ g: "k_m", t: "Vecteur d'onde", s: "mπ / L", c: "lav" }, { g: "ω_m", t: "Pulsation", s: "mπv / L", c: "rose" }, { g: "f_m", t: "Fréquence", s: "m v / 2L", c: "mint" }, { g: "λ_m", t: "Longueur d'onde", s: "2L / m", c: "sky" }] }, T`\(k_m=\dfrac{m\pi}{L}\quad f_m=\dfrac{mv}{2L}\quad \lambda_m=\dfrac{2L}{m}\)`, "Les formules : k m égale m pi sur L, oméga m égale m pi v sur L, la fréquence f m égale m v sur deux L, et la longueur d'onde lambda m égale deux L sur m. Toutes les fréquences sont des multiples du fondamental."),
    SC("standing", { m: 3, labels: true }, T`Le mode \(m\) a \(m-1\) <b>nœuds</b>, espacés de \(\lambda_m/2\)`, "Le mode m a m moins un nœuds, sans compter les extrémités, placés en x égale n L sur m. Deux nœuds voisins sont séparés d'une demi-longueur d'onde."),
    SC("standing", { m: 2, parts: true }, "Un mode = 2 ondes progressives opposées, même fréquence, même amplitude", "Et un mode propre, c'est la somme de deux ondes progressives de sens opposés, de même fréquence et de même amplitude, en opposition de phase.")
  ],
  quiz: { q: T`Combien de nœuds (hors extrémités) a le mode \(m=4\) ?`, o: ["3", "4", "5"], why: T`Le mode \(m\) a \(m-1\) nœuds intérieurs, en \(x=nL/m\).` } });

addShort({ id: "cm3-4a", cm: "cm3", sec: 3, part: "1/2", g: "∫", title: "Orthogonalité et coefficients",
  scenes: [
    SC("fourier", {}, "Une corde pincée = une <b>somme de sinus</b> 🎸", "Une corde de guitare pincée part d'un triangle. Ce triangle, on peut l'écrire comme une somme de sinus : regarde la courbe se construire, harmonique après harmonique."),
    SC("fourier", { mode: "ortho" }, "La clé : l'<b>orthogonalité</b> des sinus", "Comment trouver le poids de chaque sinus ? Grâce à l'orthogonalité. Multiplie deux sinus différents et intègre sur la corde : les aires positives et négatives se compensent exactement."),
    SC("fourier", { mode: "ortho" }, T`\(\displaystyle\int_0^L\sin\frac{m\pi x}{L}\sin\frac{n\pi x}{L}\,dx=\frac{L}{2}\,\delta_{mn}\)`, "Résultat : l'intégrale vaut zéro si m est différent de n, et L sur deux si m égale n. Delta m n, c'est le symbole de Kronecker."),
    SC("glyph", { g: "a_n", sub: "× sin(k_n x), puis ∫ de 0 à L" }, T`\(a_n=\dfrac{2}{L}\displaystyle\int_0^Lf_0(x)\sin(k_nx)\,dx\)`, "Pour isoler a n, on multiplie la forme initiale par sinus de k n x, et on intègre de zéro à L. Tous les termes s'annulent, sauf le n-ième. On obtient a n égale deux sur L fois l'intégrale."),
    SC("glyph", { g: "b_n", sub: "avec la vitesse initiale" }, T`\(b_n=\dfrac{2}{L\,\omega_n}\displaystyle\int_0^L\dot f_0(x)\sin(k_nx)\,dx\)`, "Même chose avec la vitesse initiale pour les b n, avec un facteur un sur oméga n en plus, qui vient de la dérivée du sinus par rapport au temps.")
  ],
  quiz: { q: T`\(\int_0^L\sin\frac{2\pi x}{L}\sin\frac{3\pi x}{L}\,dx\) vaut…`, o: ["0", T`\(L/2\)`, T`\(L\)`], why: T`Deux modes différents sont orthogonaux : \(\frac{L}{2}\delta_{mn}=0\) pour \(m\neq n\).` } });

addShort({ id: "cm3-4b", cm: "cm3", sec: 3, part: "2/2", g: "🎹", title: "Corde pincée, corde frappée",
  scenes: [
    SC("fourier", {}, "Corde <b>pincée</b> (guitare) : lâchée sans vitesse depuis un triangle", "La corde pincée : on la tire en un point x égale a, à une hauteur h, et on la lâche sans vitesse. Donc tous les b m sont nuls."),
    SC("fourier", { bars: true }, T`\(a_m=\dfrac{2hL^2}{m^2\pi^2a(L-a)}\sin\dfrac{m\pi a}{L}\)`, "Deux intégrations par parties donnent : a m égale deux h L carré, sur m carré pi carré a fois L moins a, fois sinus de m pi a sur L."),
    SC("fourier", { bars: true }, T`Décroissance en \(1/m^2\) : <b>peu d'harmoniques</b>`, "Le point clé : a m décroît en un sur m carré. Les harmoniques s'éteignent vite : le son de la guitare contient peu d'harmoniques."),
    SC("fourier", { bars: true, node: true }, T`Pincer en un nœud du mode \(m\) (\(a=L/m\)) <b>supprime</b> cet harmonique`, "Et regarde le dixième harmonique : il est nul ! On a pincé en a égale trois dixièmes de L, un nœud du mode dix. Pincer en un nœud supprime l'harmonique correspondant."),
    SC("glyph", { g: "🔨", sub: "b_m ∝ 1/m" }, T`Corde <b>frappée</b> (piano) : \(b_m\propto\dfrac{1}{m}\sin\dfrac{m\pi a}{L}\)`, "Au piano, le marteau frappe une corde au repos : forme initiale nulle, donc a m nul, mais vitesse initiale non nulle. On trouve b m en un sur m : décroissance bien plus lente, donc beaucoup plus d'harmoniques. Un son plus riche.")
  ],
  quiz: { q: "Pourquoi le piano (corde frappée) a-t-il plus d'harmoniques que la guitare (corde pincée) ?", o: [T`ses coefficients décroissent en \(1/m\) au lieu de \(1/m^2\)`, "sa corde est plus longue", "le marteau supprime le fondamental"], why: T`Pincée : \(a_m\propto1/m^2\). Frappée : \(b_m\propto1/m\), qui décroît plus lentement.` } });

addShort({ id: "cm3-5", cm: "cm3", sec: 4, g: "v_g", title: "La dispersion",
  scenes: [
    SC("packet", {}, "Les crêtes et l'enveloppe ne vont pas à la même vitesse 🤯", "Regarde ce paquet d'ondes. Le point jaune suit une crête, le triangle rose suit l'enveloppe. Ils ne vont pas à la même vitesse !"),
    SC("wave", { show: ["crest"] }, T`Vitesse de phase : \(v_\varphi=\dfrac{\omega}{k}\)`, "Pour une onde sinusoïdale, la phase oméga t moins k x reste constante si d x sur d t égale oméga sur k. C'est la vitesse de phase, celle des crêtes."),
    SC("glyph", { g: "ω(k)", sub: "relation de dispersion" }, T`Milieu <b>dispersif</b> : \(v_\varphi\) dépend de \(\omega\)`, "Si la relation entre k et oméga n'est pas linéaire, la vitesse de phase dépend de la fréquence : le milieu est dispersif. Chaque fréquence va à sa propre vitesse."),
    SC("packet", {}, T`L'enveloppe va à la <b>vitesse de groupe</b> \(v_g=\left(\dfrac{d\omega}{dk}\right)_{\omega_0}\)`, "Or un signal réel a une durée finie : c'est un paquet de fréquences proches. Un développement limité de la relation de dispersion montre que l'enveloppe avance, sans se déformer, à la vitesse de groupe : d oméga sur d k."),
    SC("glyph", { g: "📡", sub: "v_φ pour les crêtes · v_g pour l'enveloppe" }, T`Crêtes à \(v_\varphi\), enveloppe (le signal) à \(v_g\)`, "À retenir : les crêtes vont à v phi, mais l'enveloppe, qui porte le signal, va à v g. Et une onde monochromatique pure n'est qu'un cas limite idéal.")
  ],
  quiz: { q: T`Dans un milieu non dispersif (\(\omega=ck\))…`, o: [T`\(v_\varphi=v_g=c\)`, T`\(v_g=0\)`, T`\(v_\varphi=2v_g\)`], why: T`\(\omega/k=c\) et \(d\omega/dk=c\).` } });

/* ===================== CM4 ===================== */
addShort({ id: "cm4-1", cm: "cm4", sec: 0, g: "∇·E", title: "Les équations de Maxwell",
  scenes: [
    SC("cards", { cols: 2, items: [{ g: "∇·E", t: "Maxwell-Gauss", s: "div E = ρ/ε₀", c: "rose" }, { g: "∇·B", t: "Maxwell-Thomson", s: "div B = 0", c: "sky" }, { g: "∇∧E", t: "Maxwell-Faraday", s: "rot E = −∂B/∂t", c: "sun" }, { g: "∇∧B", t: "Maxwell-Ampère", s: "rot B = μ₀j + μ₀ε₀ ∂E/∂t", c: "mint" }] }, "Les 4 équations de toute la lumière ✨", "Quatre équations pour tout l'électromagnétisme. On les lit une par une, avec ce qu'on a appris sur les opérateurs."),
    SC("field", { f: "source", parts: true }, T`Gauss : \(\dive\vec E=\dfrac{\rho}{\varepsilon_0}\) : les charges font <b>jaillir</b> \(\vec E\)`, "Maxwell-Gauss : la divergence de E vaut rho sur epsilon zéro. Les charges positives sont des sources du champ électrique, qui jaillit d'elles."),
    SC("field", { f: "vortex", parts: true }, T`Thomson : \(\dive\vec B=0\) : les lignes de \(\vec B\) <b>se referment</b>`, "Maxwell-Thomson : la divergence de B est toujours nulle. Il n'y a pas de charge magnétique : les lignes de champ magnétique se referment sur elles-mêmes."),
    SC("field", { f: "vortex", parts: true, paddle: [0, 0] }, T`Faraday : \(\rot\vec E=-\pd{\vec B}{t}\) : \(\vec B\) variable → \(\vec E\) qui tourne`, "Maxwell-Faraday : un champ magnétique qui varie crée un champ électrique qui tourne. C'est l'induction."),
    SC("glyph", { g: "∇∧B", size: 0.2, sub: "courant + E variable" }, T`Ampère : \(\rot\vec B=\mu_0\vec\jmath+\mu_0\varepsilon_0\pd{\vec E}{t}\)`, "Maxwell-Ampère : un courant, ou un champ électrique qui varie, crée un champ magnétique qui tourne autour."),
    SC("cards", { items: [{ g: "ε₀", t: "Permittivité du vide", s: "≈ 8,85 × 10⁻¹² F/m", c: "lav" }, { g: "μ₀", t: "Perméabilité du vide", s: "4π × 10⁻⁷ H/m", c: "sky" }, { g: "c", t: "Célérité de la lumière", s: "1/√(ε₀μ₀) ≈ 3 × 10⁸ m/s", c: "sun" }] }, T`\(c=\dfrac{1}{\sqrt{\varepsilon_0\mu_0}}\approx3\times10^8\ \text{m/s}\)`, "Sans charge ni courant, on en tire l'équation d'onde, avec c égale un sur racine de epsilon zéro mu zéro. Trois fois dix puissance huit mètres par seconde : la vitesse de la lumière sort des équations !")
  ],
  quiz: { q: "Quelle équation dit qu'il n'existe pas de « charge magnétique » ?", o: [T`\(\dive\vec B=0\)`, T`\(\dive\vec E=\rho/\varepsilon_0\)`, T`\(\rot\vec E=-\partial\vec B/\partial t\)`], why: T`Maxwell-Thomson : le flux de \(\vec B\) à travers toute surface fermée est nul.` } });

addShort({ id: "cm4-2", cm: "cm4", sec: 1, g: "OPPM", title: "L'onde plane progressive monochromatique",
  scenes: [
    SC("emwave", {}, "L'<b>OPPM</b> : la brique de base de la lumière 🧱", "L'onde plane progressive monochromatique, l'OPPM : une seule fréquence, des fronts plans, et elle avance. C'est la brique de base de toute onde lumineuse."),
    SC("glyph", { g: "∇ → −ik", size: 0.17, sub: "∂/∂t → iω" }, T`Pour \(e^{i(\omega t-\vec k\cdot\vec r)}\) : \(\vec\nabla\to-i\vec k\) et \(\pd{}{t}\to i\omega\)`, "En notation complexe, avec e puissance i, oméga t moins k scalaire r, dériver devient multiplier : nabla devient moins i k, et la dérivée par rapport au temps devient i oméga."),
    SC("cards", { items: [{ g: "k·E", t: "Gauss", s: "k · E = 0", c: "rose" }, { g: "k·B", t: "Thomson", s: "k · B = 0", c: "sky" }, { g: "k∧E", t: "Faraday", s: "k ∧ E = ω B", c: "sun" }] }, "Les équations de Maxwell deviennent <b>algébriques</b>", "Les équations de Maxwell deviennent de simples produits : k scalaire E égale zéro, k scalaire B égale zéro, et k vectoriel E égale oméga B."),

addShort({ id: "cm4-3", cm: "cm4", sec: 2, g: "◯", title: "La polarisation",

    SC("polar", { seq: [[1.0, 1, 0.7, ""]] }, T`La <b>polarisation</b> : que dessine la pointe de \(\vec E\) ? ✏️`, "Regarde la pointe du champ électrique, dans le plan perpendiculaire à la propagation. Au cours du temps, elle dessine une figure : c'est la polarisation."),
    SC("polar", { seq: [[1.0, 1, 0.7, "φ quelconque : elliptique"]] }, T`\(E_x=E_{0x}\cos\omega t,\quad E_y=E_{0y}\cos(\omega t-\varphi)\)`, "Cas général : E x égale E zéro x cosinus oméga t, et E y égale E zéro y cosinus de oméga t moins phi. La pointe décrit une ellipse."),
    SC("polar", { seq: [[1.0, 1, 0.7, "ellipse inscrite dans le rectangle"]], rect: true }, T`Une <b>ellipse</b> inscrite dans le rectangle \([-E_{0x},E_{0x}]\times[-E_{0y},E_{0y}]\)`, "L'ellipse est toujours inscrite dans le rectangle de côtés deux E zéro x et deux E zéro y. Son équation est à connaître : c'est la démo du complément sur la polarisation."),

addShort({ id: "cm4-4", cm: "cm4", sec: 3, g: "Π", title: "L'énergie électromagnétique",

    SC("theorem", { kind: "stokes" }, T`Stokes : \(\oint_C\vec V\cdot d\vec\ell=\iint_S\rot\vec V\cdot d\vec S\)`, "Rappel de Stokes : la circulation de V sur un contour fermé égale le flux du rotationnel à travers la surface. Les petits tourbillons intérieurs se compensent, il ne reste que le bord."),

    SC("theorem", { kind: "ostro" }, T`Ostrogradsky : \(\displaystyle\iint_{S\text{ fermée}}\vec V\cdot d\vec S=\iiint_V\dive\vec V\,d\tau\)`, "Rappel d'Ostrogradsky : le flux sortant d'une surface fermée égale l'intégrale de la divergence dans le volume. À l'intérieur, les flux entre petites boîtes voisines se compensent."),
    SC("cards", { items: [{ g: "σ = 0", t: "Pas de charge surfacique", s: "entre deux diélectriques", c: "mint" }, { g: "j_s = 0", t: "Pas de courant surfacique", s: "toutes les composantes sont continues", c: "sky" }] }, "Cas usuel (diélectriques) : <b>tout est continu</b>", "Dans le cas usuel, entre deux diélectriques comme l'air et le verre, il n'y a ni charge ni courant surfacique : toutes ces composantes sont continues.")

/* Révision partiel : annales corrigées (versions VÉRIFIÉES, coquilles des corrigés signalées) + exercices type DS.
   Exercice : { id, ann: id d'annale ou null, title, th: thème, cm: [chapitres liés], dur: minutes, intro: HTML,
                q: [{ q, pts, sol, hint?, err? }] }  —  err = coquille de l'énoncé ou du corrigé officiel. */
const DS_EX = [];
const dsEx = (o) => { DS_EX.push(o); return o.id; };
const Q = (q, pts, sol, o = {}) => ({ q, pts, sol, hint: o.hint || "", err: o.err || "" });
const DS_THEMES = {
  cours: "Questions de cours", dal: "Équation de d'Alembert", geo: "Cylindrique / sphérique", stat: "Ondes stationnaires",
  refl: "Réflexion", coax: "Câble coaxial", son: "Son et Doppler", em: "Électromagnétisme", four: "Fourier et dispersion"
};
/* Groupes pour composer un DS blanc : un exercice de chaque. */
const DS_GROUPS = [["cours", "dal", "geo"], ["stat", "refl", "four"], ["coax", "son", "em"]];

/* ============================ ANNALES ============================ */

dsEx({ id: "a18-1", ann: "cc2018", title: "Changement de variable pour d'Alembert", th: "dal", cm: ["cm1", "cm3"], dur: 15,
  intro: T`Équation d'onde à une dimension : \(\pdd{a}{t}=c_s^2\pdd{a}{x}\). On sait que \(a(x,t)=f(x-ct)+g(x+ct)\) est solution (on note \(c=c_s\)).`,
  q: [
    Q(T`Montrer que \(f(\alpha(x-ct))+g(\alpha(x+ct))\) est aussi solution, avec \(\alpha\) une constante.`, 2,
      T`<p>On pose \(u=\alpha(x-ct)\). Règle de la chaîne : \(\pd{u}{x}=\alpha\) et \(\pd{u}{t}=-\alpha c\).</p>
      <div class="math">\[\pdd{f}{x}=\alpha^2f''(u)\qquad \pdd{f}{t}=\alpha^2c^2f''(u)\]</div>
      <p>Donc \(\pdd{f}{t}-c^2\pdd{f}{x}=\alpha^2c^2f''-c^2\alpha^2f''=0\). Même calcul pour \(g\) avec \(v=\alpha(x+ct)\), où \(\pd{v}{t}=+\alpha c\) : le signe disparaît au carré. L'équation est linéaire, donc la somme est solution.</p>`,
      { hint: T`Pose \(u=\alpha(x-ct)\) et dérive deux fois avec la règle de la chaîne : chaque dérivée fait sortir un facteur.` }),
    Q(T`En déduire que \(f(x/c-t)+g(x/c+t)\) et \(f(kx-\omega t)+g(kx+\omega t)\) sont solutions. Lien entre \(k\) et \(\omega\) ?`, 2,
      T`<p>Avec \(\alpha=1/c\) : \(\alpha(x\mp ct)=x/c\mp t\). Avec \(\alpha=k\) : \(k(x\mp ct)=kx\mp kct\), qui s'écrit \(kx\mp\omega t\) à condition que</p>
      <div class="math">\[\omega=kc\]</div><p>C'est la relation de dispersion d'un milieu non dispersif (vitesse de phase \(\omega/k=c\) pour toutes les fréquences).</p>`)
  ] });
dsEx({ id: "a18-2", ann: "cc2018", title: "D'Alembert en coordonnées cylindriques", th: "geo", cm: ["cm1", "ops"], dur: 30,
  intro: T`Équation à 3 dimensions \(\pdd{a}{t}=c_s^2\,\Delta a\) (on note \(c=c_s\)), pour un problème indépendant de \(z\) et de \(\theta\). Formulaire autorisé.`,
  q: [
    Q("Écrire l'équation de d'Alembert en coordonnées cylindriques, sans dépendance en z ni en θ.", 2,
      T`<p>Formulaire : \(\Delta a=\frac1r\pd{}{r}\left(r\pd{a}{r}\right)+\frac{1}{r^2}\pdd{a}{\theta}+\pdd{a}{z}\). Les deux derniers termes sont nuls :</p>
      <div class="math">\[\pdd{a}{t}=\frac{c^2}{r}\pd{}{r}\left(r\pd{a}{r}\right)\]</div>`),
    Q(T`On cherche \(f(r,t)=F(r)G(t)\). Montrer qu'on obtient 2 équations faisant intervenir une constante.`, 1,
      T`<p>On remplace : \(F\,G''=\frac{c^2}{r}G\,(rF')'\). On divise par \(c^2FG\) :</p>
      <div class="math">\[\frac{1}{c^2}\frac{G''(t)}{G(t)}=\frac{1}{rF(r)}\frac{d}{dr}\left(r\frac{dF}{dr}\right)=K\]</div>
      <p>Le membre de gauche ne dépend que de \(t\), celui de droite que de \(r\) : les deux sont égaux à une même constante \(K\). D'où \(G''=Kc^2G\) et \(\frac1r(rF')'=KF\).</p>`,
      { hint: "Divise par F·G : un membre ne dépend que de t, l'autre que de r." }),
    Q("Donner l'expression générale de G(t).", 1,
      T`<p>\(G''-Kc^2G=0\). Selon le signe de \(K\) : si \(K>0\), \(G=Ae^{c\sqrt K\,t}+Be^{-c\sqrt K\,t}\) ; si \(K=0\), \(G=At+B\) ; si \(K=-k^2<0\), \(G=A\cos(kct)+B\sin(kct)\), soit en complexe \(Ae^{i\omega t}+Be^{-i\omega t}\) avec \(\omega=kc\).</p>`),
    Q(T`Loin de \(Oz\), la dépendance temporelle est en \(e^{i\omega t}\) (\(\omega>0\)). En déduire \(G(t)\).`, 1,
      T`<p>Seul le cas \(K<0\) donne des oscillations. On pose \(K=-k^2\) avec \(k=\omega/c\), et on garde \(G(t)=G_0\,e^{i\omega t}\).</p>`),
    Q("Donner l'équation différentielle vérifiée par F (équation de Bessel).", 1,
      T`<div class="math">\[\frac{d^2F}{dr^2}+\frac1r\frac{dF}{dr}+k^2F=0\]</div><p>C'est l'équation de Bessel d'ordre 0.</p>`),
    Q(T`Montrer que, loin de \(Oz\), \(F=\dfrac{Ae^{-ikr}}{\sqrt{kr}}\) est une solution acceptable.`, 1,
      T`<p>\(\ln F=\text{cte}-\tfrac12\ln r-ikr\) donne \(F'=F\left(-\frac{1}{2r}-ik\right)\), puis</p>
      <div class="math">\[F''=F\left[\left(\frac{1}{2r}+ik\right)^2+\frac{1}{2r^2}\right]=F\left[\frac{3}{4r^2}+\frac{ik}{r}-k^2\right]\]</div>
      <p>Donc \(F''+\frac{F'}{r}+k^2F=\frac{F}{4r^2}\). Loin de l'axe (\(kr\gg1\)), ce reste est négligeable devant \(k^2F\) : \(F\) est solution approchée.</p>`,
      { hint: "Calcule F′/F et F″/F, puis compare le reste à k²F quand kr ≫ 1." }),
    Q("Comment s'écrit alors la solution loin de l'axe ? Commenter.", 1,
      T`<div class="math">\[a(r,t)=\frac{A}{\sqrt{kr}}\,e^{i(\omega t-kr)}\]</div>
      <p>C'est un produit \(F(r)G(t)\) : la solution est bien à variables séparées. Sa phase \(\omega t-kr\) décrit une <b>onde cylindrique divergente</b> (vers les \(r\) croissants), d'amplitude en \(1/\sqrt r\) : l'énergie se répartit sur un cylindre de surface \(\propto r\).</p>`)
  ] });
dsEx({ id: "a18-3", ann: "cc2018", title: "Corde fixée aux 2 extrémités : modes propres", th: "stat", cm: ["cm2", "cm3"], dur: 30,
  intro: T`Corde homogène de longueur \(L\), fixée en \(x=0\) et \(x=L\), tension \(T\). Équation : \(\pdd{y}{x}=\frac{\mu}{T}\pdd{y}{t}\).`,
  q: [
    Q("Exprimer la célérité c. Unité de T ?", 1,
      T`<p>\(c=\sqrt{T/\mu}\), avec \(\mu\) la masse <b>linéique</b> (kg·m⁻¹). \(T\) est une force : en newtons, \(\text{N}=\text{kg·m·s}^{-2}\).</p>`,
      { err: T`L'énoncé appelle \(\mu\) « masse volumique » (kg·m⁻³). Dans l'équation de la corde, c'est la masse linéique : \(\mu_\ell=\rho S\) (voir l'application).` }),
    Q(T`Avec \(y=f(x)g(t)\), montrer que \(y=A\cos(kx+\phi)\cos(\omega t+\psi)\).`, 2,
      T`<p>On remplace et on sépare : \(\frac{f''}{f}=\frac{\mu}{T}\frac{g''}{g}=-k^2\) (constante négative pour avoir des oscillations bornées).</p>
      <p>\(f''+k^2f=0\) donne \(f=\cos(kx+\phi)\) à un facteur près ; \(g''+\omega^2g=0\) avec \(\omega^2=k^2T/\mu\) donne \(g=\cos(\omega t+\psi)\).</p>`),
    Q("Relation entre k, ω et c ?", 1, T`<div class="math">\[\omega=kc\]</div>`),
    Q(T`Montrer que \(f_N=N f_1\) et exprimer \(f_1\) en fonction de \(T\), \(L\), \(\mu\).`, 1,
      T`<p>\(y(0,t)=0\) impose \(\cos\phi=0\), donc \(f\propto\sin(kx)\). \(y(L,t)=0\) impose \(\sin(kL)=0\), donc \(k_N=N\pi/L\). Alors \(\omega_N=k_Nc\) et</p>
      <div class="math">\[f_N=\frac{Nc}{2L}=N f_1,\qquad f_1=\frac{1}{2L}\sqrt{\frac{T}{\mu}}\]</div>`),
    Q(T`Application : \(l=63\) cm, nylon \(\rho=1200\) kg·m⁻³, section \(S=0{,}42\) mm², \(f_1=147\) Hz. Tension ?`, 1,
      T`<p>Masse linéique : \(\mu=\rho S=1200\times0{,}42\cdot10^{-6}=5{,}04\cdot10^{-4}\) kg·m⁻¹.</p>
      <div class="math">\[T=\mu\,(2lf_1)^2=5{,}04\cdot10^{-4}\times(2\times0{,}63\times147)^2\approx17\ \text{N}\]</div>`,
      { hint: T`Il faut d'abord passer de la masse volumique à la masse linéique : \(\mu=\rho S\).` }),
    Q("Longueurs d'onde possibles ?", 1, T`<div class="math">\[\lambda_N=\frac{2\pi}{k_N}=\frac{2L}{N}\]</div>`),
    Q(T`Déplacement \(y_N\) du mode \(N\). Nombre et position des points immobiles ?`, 2,
      T`<div class="math">\[y_N(x,t)=A_N\sin\left(\frac{N\pi x}{L}\right)\cos\left(\frac{N\pi c}{L}t+\psi_N\right)\]</div>
      <p>Nœuds : \(\sin(N\pi x/L)=0\), soit \(x_p=pL/N\) avec \(p=0,\dots,N\). Il y a \(N+1\) points immobiles, extrémités comprises (\(N-1\) à l'intérieur), espacés de \(\lambda_N/2\).</p>`),
    Q("Dessiner la corde pour N = 1 et N = 4.", 1,
      T`<p>\(N=1\) : un seul fuseau (une arche), nœuds aux deux bouts, ventre au milieu. \(N=4\) : quatre fuseaux, nœuds en \(L/4\), \(L/2\), \(3L/4\) (plus les bouts), ventres en \(L/8\), \(3L/8\), \(5L/8\), \(7L/8\).</p>`)
  ] });

dsEx({ id: "a21-1", ann: "cc2021", title: "Questions de cours", th: "cours", cm: ["cm1", "cm2"], dur: 8,
  intro: "Répondre en 3 lignes maximum par question.",
  q: [
    Q("Définir une onde d'un point de vue physique.", 1, "<p>Une onde est un phénomène de <b>propagation ordonnée d'énergie, sans transport de matière</b>.</p>"),
    Q("Comment distingue-t-on une onde transverse d'une onde longitudinale ?", 1,
      "<p>Transverse : la perturbation (déplacement, champ) est <b>perpendiculaire</b> à la direction de propagation. Longitudinale : elle est <b>parallèle</b> à la direction de propagation.</p>"),
    Q("Quand le son se propage dans l'air, quelles grandeurs subissent le passage de l'onde ?", 1,
      "<p>La <b>surpression</b> \\(p\\), la <b>surdensité</b> (masse volumique) et la <b>vitesse</b> des particules de fluide (et aussi la température, qui varie de façon adiabatique).</p>")
  ] });
dsEx({ id: "a21-2", ann: "cc2021", title: "Solutions de d'Alembert sur une corde", th: "dal", cm: ["cm1", "cm2"], dur: 35,
  intro: T`Corde sans raideur de longueur \(L\), masse linéique \(\mu\), tension \(T\). Petits ébranlements \(\psi(x,t)\) : \(\pdd{\psi}{x}-\frac{1}{c^2}\pdd{\psi}{t}=0\).`,
  q: [
    Q("Schéma représentant les axes et une onde qui se propage sur la corde.", 1,
      "<p>Corde au repos le long de \\(Ox\\), déplacement \\(\\psi\\) mesuré selon \\(Oy\\) (perpendiculaire), flèche de propagation selon \\(Ox\\).</p>",
      { err: "L'énoncé dit que la corde au repos « se confond avec l'axe Oy », alors que \\(\\psi\\) dépend de \\(x\\) : il faut lire corde selon \\(Ox\\), déplacement selon \\(Oy\\)." }),
    Q("Dimension de c, de deux façons. Signification physique ?", 1.5,
      T`<p>1) Par l'équation : \([\psi]/\text{L}^2=[\psi]/([c]^2\,\text{T}^2)\), donc \([c]=\text{L·T}^{-1}\).</p>
      <p>2) Par \(c=\sqrt{T/\mu}\) : \(\left(\frac{\text{kg·m·s}^{-2}}{\text{kg·m}^{-1}}\right)^{1/2}=\text{m·s}^{-1}\). C'est la <b>vitesse de propagation</b> de l'onde.</p>`,
      { err: T`L'énoncé écrit \(c=T/\mu\) : c'est \(c=\sqrt{T/\mu}\) (la correction officielle utilise bien la racine).` }),
    Q(T`Vérifier que \(f(t-x/c)\) et \(g(t+x/c)\) sont solutions.`, 2,
      T`<p>Avec \(u=t-x/c\) : \(\pd{f}{t}=f'(u)\), \(\pd{f}{x}=-\frac1cf'(u)\), donc \(\pdd{f}{x}=\frac{1}{c^2}f''\) et \(\pdd{f}{t}=f''\). D'où \(\frac{1}{c^2}f''-\frac{1}{c^2}f''=0\). Même calcul pour \(g\) avec \(v=t+x/c\) (le signe disparaît au carré).</p>`),
    Q("Justifier que chacune correspond à une onde progressive.", 1,
      T`<p>\(f\) garde la même valeur si \(t-x/c\) est constant, c'est-à-dire \(x'-x=c(t'-t)\) : la forme avance à la vitesse \(+c\), vers les \(x\) croissants. Pour \(g\), \(x'-x=-c(t'-t)\) : vitesse \(-c\), onde régressive.</p>`),
    Q("Forme générale de la solution ?", 0.5, T`<div class="math">\[\psi(x,t)=f\!\left(t-\frac xc\right)+g\!\left(t+\frac xc\right)\]</div>`),
    Q(T`Variables séparées \(\psi=F(x)G(t)\), solution finie quand \(t\to\pm\infty\) : montrer que \(F\) et \(G\) vérifient des équations du 2nd ordre à solutions sinusoïdales.`, 3,
      T`<p>On remplace : \(\frac{F''}{F}=\frac{1}{c^2}\frac{G''}{G}=C\), constante. Si \(C>0\), \(G\) est une somme d'exponentielles réelles qui divergent en \(\pm\infty\) : impossible. Si \(C=0\), \(G=At+B\) diverge aussi (sauf constante, sans intérêt). Donc \(C<0\) ; on pose \(C=-k^2\), \(\omega=kc\) :</p>
      <div class="math">\[G''+\omega^2G=0\qquad F''+k^2F=0\]</div>`,
      { hint: "Discute selon le signe de la constante de séparation, et utilise le fait que G reste bornée." }),
    Q(T`On cherche \(\tilde\psi=\tilde\psi(x)e^{i\omega t}\). Équation vérifiée par \(\tilde\psi(x)\) ?`, 1,
      T`<p>\(\pdd{}{t}\to-\omega^2\), donc \(\tilde\psi''+k^2\tilde\psi=0\) avec \(k=\omega/c\).</p>`),
    Q("Montrer qu'on retrouve une somme de deux ondes propagatives.", 1,
      T`<p>Équation caractéristique \(r^2+k^2=0\), \(r=\pm ik\) : \(\tilde\psi(x)=Ae^{-ikx}+Be^{ikx}\), donc</p>
      <div class="math">\[\tilde\psi(x,t)=Ae^{i(\omega t-kx)}+Be^{i(\omega t+kx)}\]</div><p>une onde vers \(+x\) et une onde vers \(-x\).</p>`),
    Q("Solution réelle correspondante ?", 1, T`<p>\(\psi(x,t)=A\cos(\omega t-kx)+B\cos(\omega t+kx)\) (avec \(A\), \(B\) réels, ou des phases en plus si \(A\), \(B\) sont complexes).</p>`),
    Q(T`Onde incidente \(\psi_0e^{i(\omega t-kx)}\), bout fixe en \(x=L\), onde totale \(\psi_0e^{i(\omega t-kx)}+\psi_re^{i(\omega t+kx)}\). Déterminer \(\psi_r\).`, 1,
      T`<p>\(\tilde\psi(L,t)=0\) : \(\psi_0e^{-ikL}+\psi_re^{ikL}=0\), donc \(\psi_r=-\psi_0\,e^{-2ikL}\).</p>`),
    Q(T`Coefficient de réflexion en amplitude \(r=\psi_r/\psi_i\) en \(x=L\) ?`, 1,
      T`<p>En \(x=L\) : \(r=\frac{\psi_re^{ikL}}{\psi_0e^{-ikL}}=-1\).</p>`),
    Q("Déphasage à la réflexion ?", 0.5, T`<p>\(r=-1=e^{i\pi}\) : déphasage de \(\pi\), l'onde réfléchie est retournée.</p>`),
    Q(T`Solution réelle totale \(\psi(x,t)\).`, 1,
      T`<p>\(\tilde\psi=\psi_0e^{i(\omega t-kL)}\big[e^{ik(L-x)}-e^{-ik(L-x)}\big]=2i\psi_0\sin\big(k(L-x)\big)e^{i(\omega t-kL)}\). Partie réelle :</p>
      <div class="math">\[\psi(x,t)=-2\psi_0\sin\big(k(L-x)\big)\sin(\omega t-kL)\]</div>`,
      { err: T`Le corrigé officiel écrit \(\sin(L-x)\) : il manque le \(k\), c'est \(\sin\big(k(L-x)\big)\).` }),
    Q(T`Distinguer l'amplitude \(A(x)\) de la partie temporelle.`, 0.5,
      T`<p>\(A(x)=-2\psi_0\sin\big(k(L-x)\big)\) ne dépend que de \(x\) ; le facteur \(\sin(\omega t-kL)\) ne dépend que de \(t\). Espace et temps sont découplés : c'est une onde <b>stationnaire</b>.</p>`),
    Q("Position des nœuds ?", 0.5, T`<p>\(\sin\big(k(L-x)\big)=0\) : \(x_m=L-m\frac{\lambda}{2}\), \(m\in\mathbb N\) (avec \(x\geq0\)).</p>`),
    Q("Position des ventres ?", 0.5, T`<p>\(|\sin\big(k(L-x)\big)|=1\) : \(x_m=L-(2m+1)\frac{\lambda}{4}\), \(m\in\mathbb N\).</p>`),
    Q(T`Tracer \(A/\psi_0\).`, 1, T`<p>\(|A|/\psi_0=2|\sin(k(L-x))|\) : des arches de hauteur 2, nulles en \(x=L\), \(L-\lambda/2\), \(L-\lambda\)… (nœuds espacés de \(\lambda/2\)).</p>`)
  ] });

dsEx({ id: "a22-1", ann: "cc2022", title: "Équation de d'Alembert : invariance d'échelle", th: "dal", cm: ["cm1", "cm3"], dur: 15,
  intro: T`\(\pdd{f}{x}-\frac{1}{c^2}\pdd{f}{t}=0\) ; on sait que \(f=F(x+ct)+G(x-ct)=F(u)+G(v)\) est solution.`,
  q: [
    Q(T`Calculer \(\pd{}{x}\), \(\pdd{}{x}\), \(\pd{}{t}\) et \(\pdd{}{t}\) de \(F(\alpha u)+G(\alpha v)\).`, 2,
      T`<div class="math">\[\pd{}{x}=\alpha\big(F'+G'\big)\qquad \pdd{}{x}=\alpha^2\big(F''+G''\big)\]</div>
      <div class="math">\[\pd{}{t}=\alpha c\big(F'-G'\big)\qquad \pdd{}{t}=\alpha^2c^2\big(F''+G''\big)\]</div><p>(dérivées évaluées en \(\alpha u\) et \(\alpha v\) ; \(\pd{u}{t}=+c\), \(\pd{v}{t}=-c\)).</p>`,
      { err: T`Le corrigé officiel écrit \(\pd{}{t}=-\alpha cF'+\alpha cG'\) : comme \(u=x+ct\), c'est \(+\alpha cF'-\alpha cG'\). Le signe disparaît dans la dérivée seconde, le résultat final est juste.` }),
    Q(T`Montrer que \(f_\alpha=F(\alpha u)+G(\alpha v)\) est solution pour tout \(\alpha\).`, 2,
      T`<p>\(\pdd{f_\alpha}{x}-\frac{1}{c^2}\pdd{f_\alpha}{t}=\alpha^2(F''+G'')-\frac{\alpha^2c^2}{c^2}(F''+G'')=0\).</p>`),
    Q(T`En déduire que \(F(x/c+t)+G(x/c-t)\) est solution.`, 1, T`<p>On prend \(\alpha=1/c\) : \(\alpha(x\pm ct)=x/c\pm t\).</p>`)
  ] });
dsEx({ id: "a22-2", ann: "cc2022", title: "Ondes stationnaires imposées par une source", th: "stat", cm: ["cm3"], dur: 25,
  intro: T`Corde de longueur \(L\), fixée en \(x=L\). En \(x=0\) on impose \(s(0,t)=A\sin(\omega t)\). On cherche \(s(x,t)=X(x)\sin(\omega t)\).`,
  q: [
    Q("s(x,t) est-elle stationnaire ou progressive ?", 1, "<p><b>Stationnaire</b> : c'est un produit d'une fonction de \\(x\\) et d'une fonction de \\(t\\). Tous les points vibrent en phase (ou en opposition), seule l'amplitude dépend de \\(x\\).</p>"),
    Q("Équation différentielle vérifiée par X(x) ?", 1, T`<div class="math">\[X''+\frac{\omega^2}{c^2}X=0\]</div>`),
    Q("Solution X(x) avec les 2 conditions aux limites.", 2,
      T`<p>\(X=a\cos kx+b\sin kx\) avec \(k=\omega/c\). \(X(0)=A\) donne \(a=A\) ; \(X(L)=0\) donne \(b=-A/\tan(kL)\). Plus simplement :</p>
      <div class="math">\[X(x)=A\,\frac{\sin\big(k(L-x)\big)}{\sin(kL)}\qquad(\sin kL\neq0)\]</div>`,
      { hint: T`Écrire \(X\) sous la forme \(\sin(k(L-x))\) rend la condition en \(x=L\) automatique.` }),
    Q(T`Nœuds et ventres. Peut-on avoir \(\omega L/c=p\pi\) ? Conclusion ?`, 3,
      T`<p>Nœuds : \(\sin(k(L-x))=0\), soit \(x=L-p\frac{\pi c}{\omega}\), \(p\in\mathbb N\), \(x\geq0\).</p>
      <p>Ventres : \(k(L-x)=\frac\pi2+p\pi\), soit \(x=L-(2p+1)\frac{\pi c}{2\omega}\).</p>
      <p>Si \(\omega L/c=p\pi\), \(\sin kL=0\) et l'amplitude diverge : c'est la <b>résonance</b>, la source excite un mode propre \(\omega_p=p\pi c/L\). En réalité, les pertes (frottements, raideur) limitent l'amplitude.</p>`,
      { err: T`Le corrigé officiel donne les ventres en \(x=L-\frac{\pi c}{2\omega}(k+1)\) : c'est \((2k+1)\), sinon on obtiendrait aussi les nœuds.` })
  ] });
dsEx({ id: "a22-3", ann: "cc2022", title: "Câble coaxial résistif : équation des télégraphistes", th: "coax", cm: ["cm2", "cm3"], dur: 30,
  intro: T`Câble dispersif : par unité de longueur, inductance \(l\), capacité \(c\), résistance \(r_1\) (en série) et conductance \(g_2\) (en parallèle).`,
  q: [
    Q("Lois des mailles et des nœuds : système de 2 équations pour V et I.", 3,
      T`<p>Mailles : \(V(x,t)=l\,dx\,\pd{I}{t}+r_1dx\,I+V(x+dx,t)\). Nœuds : \(I(x,t)=I(x+dx,t)+c\,dx\,\pd{V}{t}+g_2dx\,V\). Au premier ordre en \(dx\) :</p>
      <div class="math">\[\pd{V}{x}=-l\pd{I}{t}-r_1I\qquad \pd{I}{x}=-c\pd{V}{t}-g_2V\]</div>`),
    Q("Équation des télégraphistes pour V (et I).", 2,
      T`<p>On dérive la première par rapport à \(x\) et on remplace \(\pd{I}{x}\) par la seconde (les dérivées commutent, Schwarz) :</p>
      <div class="math">\[\pdd{V}{x}=lc\,\pdd{V}{t}+(r_1c+lg_2)\pd{V}{t}+r_1g_2\,V\]</div><p>Même équation pour \(I\).</p>`),
    Q(T`Retrouver d'Alembert pour \(r_1=g_2=0\).`, 1, T`<p>\(\pdd{V}{x}-lc\pdd{V}{t}=0\), avec \(c_0=1/\sqrt{lc}\).</p>`),
    Q(T`Avec \(\tilde\Psi=\Psi_0e^{i(\tilde kx-\omega t+\phi)}\), relation de dispersion pour d'Alembert et pour les télégraphistes.`, 2,
      T`<p>\(\pd{}{x}\to i\tilde k\), \(\pd{}{t}\to-i\omega\). D'Alembert : \(\tilde k^2=lc\,\omega^2\), \(k\) réel, pas de dispersion. Télégraphistes :</p>
      <div class="math">\[\tilde k^2=lc\,\omega^2+i\,(r_1c+lg_2)\,\omega-r_1g_2\]</div>
      <p>\(\tilde k=k_1+ik_2\) est complexe : \(e^{i\tilde kx}=e^{-k_2x}e^{ik_1x}\), l'onde est <b>atténuée</b> et le milieu est <b>dispersif</b>.</p>`)
  ] });

dsEx({ id: "a23-1", ann: "cc2023", title: "Vérifier une solution de d'Alembert", th: "dal", cm: ["cm1"], dur: 10,
  intro: T`\(\pdd{f}{x}-\frac{1}{c^2}\pdd{f}{t}=0\).`,
  q: [
    Q(T`Vérifier que \(f=3\cos(\omega t-kx)+2\sin(kx+\omega t)\) est solution.`, 3,
      T`<p>Chaque terme vérifie \(\pdd{}{x}=-k^2\) et \(\pdd{}{t}=-\omega^2\) (fois lui-même), donc</p>
      <div class="math">\[\pdd{f}{x}-\frac{1}{c^2}\pdd{f}{t}=\left(-k^2+\frac{\omega^2}{c^2}\right)f=0\iff k=\frac{\omega}{c}\ \ (k>0)\]</div>`),
    Q("Relation de dispersion ?", 1, T`<p>\(\omega=ck\) : relation linéaire, milieu non dispersif.</p>`)
  ] });
dsEx({ id: "a23-2", ann: "cc2023", title: "Corde excitée par un vibreur", th: "stat", cm: ["cm3"], dur: 25,
  intro: T`Corde entre \(x=0\) et \(x=L\). Le vibreur impose \(y(0,t)=a\cos(\omega t)\) ; l'extrémité \(x=L\) est fixe. On cherche \(y=A\cos(\omega t+\phi)\cos(kx+\psi)\), \(k=\omega/c\).`,
  q: [
    Q("Conditions aux limites en x = 0 et x = L ?", 1, T`<p>\(y(0,t)=a\cos\omega t\) et \(y(L,t)=0\) pour tout \(t\).</p>`),
    Q("Quel type d'onde ?", 1, T`<p>Une onde <b>stationnaire</b>. On le voit à la forme cherchée : \(y=A\cos(\omega t+\phi)\cos(kx+\psi)\) est un <b>produit</b> d'une fonction de \(t\) seul par une fonction de \(x\) seul. Espace et temps sont découplés, contrairement à une onde progressive \(f(x-ct)\), dont le profil se déplace. Ici, chaque point vibre en phase avec la même pulsation \(\omega\), et certains points (les <b>nœuds</b>, où \(\cos(kx+\psi)=0\)) restent immobiles.</p>`),
    Q(T`Trouver \(A\), \(\phi\), \(\psi\).`, 3,
      T`<p>En \(x=0\) : \(A\cos\psi\cos(\omega t+\phi)=a\cos\omega t\) pour tout \(t\), donc \(\phi=0\) et \(A\cos\psi=a\). En \(x=L\) : \(\cos(kL+\psi)=0\), on prend \(\psi=\frac\pi2-kL\). Alors \(\cos\psi=\sin kL\) :</p>
      <div class="math">\[A=\frac{a}{\sin(kL)}\qquad y(x,t)=a\,\frac{\sin\big(k(L-x)\big)}{\sin(kL)}\cos(\omega t)\]</div>`),
    Q("Pulsations pour lesquelles l'amplitude devient très grande ? Interprétation ?", 3,
      T`<p>Quand \(\sin(\omega L/c)=0\) : \(\omega_n=\frac{n\pi c}{L}\). Ce sont les pulsations des <b>modes propres</b> de la corde fixée aux deux bouts : phénomène de <b>résonance</b>.</p>`),
    Q("Qu'est-ce qui limite l'amplitude en pratique ?", 1, "<p>Les phénomènes <b>dissipatifs</b> (frottements de l'air, pertes internes, rayonnement sonore) : l'amplitude reste finie, avec de simples maxima aux fréquences propres.</p>")
  ] });
dsEx({ id: "a23-3", ann: "cc2023", title: "Effet Doppler (récepteur mobile)", th: "son", cm: ["cm2"], dur: 20,
  intro: T`Source fixe \(S\) de fréquence \(f_0\) ; récepteur \(R\) qui s'éloigne à la vitesse \(\vec v=v\,\vec u_x\) ; \(f\) est la fréquence perçue, \(c\) la célérité du son. Le signal émis à \(t_0\) est reçu en \(R_1\) (\(SR_1=d_1\)), celui émis à \(t_0+T_0\) en \(R_2\) (\(SR_2=d_2\)).`,
  q: [
    Q(T`Exprimer \(d_2-d_1\) en fonction de \(f\), \(f_0\), \(c\).`, 2,
      T`<p>Réceptions : \(t_1=t_0+\frac{d_1}{c}\) et \(t_2=t_0+T_0+\frac{d_2}{c}\). La période perçue vaut \(T=t_2-t_1=T_0+\frac{d_2-d_1}{c}\), d'où</p>
      <div class="math">\[d_2-d_1=c\left(\frac1f-\frac1{f_0}\right)\]</div>`),
    Q(T`Exprimer \(d_2-d_1\) en fonction de \(v\) et \(f\).`, 2, T`<p>Entre les deux réceptions (durée \(T=1/f\)), le récepteur avance de \(vT\) : \(d_2-d_1=\frac vf\).</p>`),
    Q("Fréquence apparente f ?", 1, T`<p>\(\frac1f-\frac1{f_0}=\frac{v}{cf}\), donc</p><div class="math">\[f=f_0\left(1-\frac vc\right)\]</div>`),
    Q(T`Vitesse et sens pour que le do₃ soit perçu comme le do₄ (\(f/f_0=2\)), \(c=340\) m/s ?`, 2,
      T`<p>\(v=c\left(1-\frac f{f_0}\right)=-340\) m/s : le récepteur doit <b>se rapprocher</b> de la source à 340 m/s.</p>
      <p>Remarque : l'énoncé suppose \(v\ll c\), ce qui n'est pas le cas ici ; mais pour un récepteur mobile, la formule \(f=f_0(1-v/c)\) est exacte, le résultat reste valable.</p>`)
  ] });

/* ---------- Novembre 2025 (DS1, énoncé seul : correction rédigée ici, plus long et plus dur) ---------- */
dsEx({ id: "a25-1", ann: "ds2025", title: "Onde longitudinale dans un barreau", th: "son", cm: ["cm1", "cm2", "cm3"], dur: 55,
  intro: T`Barreau cylindrique homogène, de section \(S\), masse volumique \(\rho\), module d'Young \(E\) et longueur \(L\), aligné selon \(Ox\). \(u(x,t)\) est le déplacement axial (suivant \(Ox\)) de l'élément situé en \(x\). On néglige les variations de section et toute dissipation. Forces de tension aux extrémités d'un élément \(dx\) : \(T(x,t)=S\sigma(x,t)\) et \(T(x+dx,t)=S\sigma(x+dx,t)\), \(\sigma\) contrainte normale. Loi de Hooke : \(\sigma=E\varepsilon\), avec \(\varepsilon=\pd{u}{x}\) la déformation. Masse de l'élément : \(dm=\rho S\,dx\).`,
  q: [
    Q(T`<b>Équation d'onde.</b> Montrer que \(u\) vérifie \(\pdd{u}{t}=c^2\pdd{u}{x}\), avec \(c=\sqrt{E/\rho}\).`, 3,
      T`<p><b>Système :</b> l'élément entre \(x\) et \(x+dx\), de masse \(dm=\rho S\,dx\). Son accélération est \(\pdd{u}{t}\), car \(u\) est le déplacement de cet élément.</p>
      <p><b>Forces selon \(Ox\) :</b> la partie de droite tire l'élément vers \(+x\) avec \(T(x+dx,t)\) ; la partie de gauche le tire vers \(-x\) avec \(T(x,t)\) (convention : \(\sigma>0\) en traction). On néglige le poids, perpendiculaire à \(Ox\).</p>
      <p><b>PFD projeté sur \(Ox\) :</b></p>
      <div class="math">\[\rho S\,dx\,\pdd{u}{t}=S\sigma(x+dx,t)-S\sigma(x,t)=S\,\pd{\sigma}{x}\,dx\]</div>
      <p><b>Loi de Hooke :</b> \(\sigma=E\pd{u}{x}\), et \(E\) est uniforme (barreau homogène), donc \(\pd{\sigma}{x}=E\pdd{u}{x}\). On divise par \(\rho S\,dx\) :</p>
      <div class="math">\[\pdd{u}{t}=\frac{E}{\rho}\pdd{u}{x}=c^2\pdd{u}{x},\qquad c=\sqrt{\frac{E}{\rho}}\]</div>
      <p><b>Unités :</b> \(E\) en Pa \(=\) kg·m⁻¹·s⁻² et \(\rho\) en kg·m⁻³, donc \(E/\rho\) en m²·s⁻² : \(c\) est bien une vitesse.</p>`,
      { hint: T`Même démarche que la corde (démo 5), mais ici la force est le long de \(Ox\) : PFD sur la tranche \([x,x+dx]\), développement à l'ordre 1 en \(dx\), puis loi de Hooke.`,
        err: T`L'énoncé parle de « l'équilibre » de l'élément : ce n'est pas un équilibre (l'élément accélère), c'est un bilan dynamique, le principe fondamental de la dynamique.` }),
    Q(T`<b>Onde progressive</b> \(u=A\cos\big(\omega(t-\frac xc)\big)\). a) Calculer la vitesse locale \(\pd{u}{t}\) et la déformation \(\varepsilon=\pd{u}{x}\).`, 1,
      T`<p>On note \(\theta=\omega\left(t-\frac xc\right)\), avec \(\pd\theta t=\omega\) et \(\pd\theta x=-\frac\omega c\).</p>
      <div class="math">\[\pd{u}{t}=-A\omega\sin\theta\qquad \varepsilon=\pd{u}{x}=+\frac{A\omega}{c}\sin\theta\]</div>
      <p>Attention au signe : la dérivée en \(x\) fait sortir \(-\frac\omega c\), et la dérivée de \(\cos\) donne \(-\sin\) : les deux signes moins se compensent. On retient la relation propre à une onde progressive vers \(+x\) :</p>
      <div class="math">\[\varepsilon=-\frac1c\,\pd{u}{t}\]</div>`),
    Q(T`b) En déduire les densités volumiques d'énergie cinétique \(\mathcal E_c(x,t)\) et d'énergie élastique \(\mathcal E_p(x,t)\).`, 2,
      T`<p><b>Énergie cinétique</b> par unité de volume : \(\mathcal E_c=\frac12\rho\left(\pd{u}{t}\right)^2\) (c'est \(\frac12 dm\,v^2\) divisé par le volume \(S\,dx\)).</p>
      <p><b>Énergie élastique</b> par unité de volume : la tranche se comporte comme un ressort de raideur \(k=\frac{ES}{dx}\) (loi de Hooke : \(T=S\sigma=\frac{ES}{dx}\,\varepsilon\,dx\)), allongé de \(\delta=\varepsilon\,dx\). Son énergie vaut \(\frac12k\delta^2=\frac12E\varepsilon^2\,S\,dx\), donc \(\mathcal E_p=\frac12E\varepsilon^2=\frac12\sigma\varepsilon\).</p>
      <p>Avec la question a) :</p>
      <div class="math">\[\mathcal E_c=\frac12\rho A^2\omega^2\sin^2\!\Big(\omega\big(t-\tfrac xc\big)\Big)\qquad \mathcal E_p=\frac12E\,\frac{A^2\omega^2}{c^2}\sin^2\!\Big(\omega\big(t-\tfrac xc\big)\Big)\]</div>
      <p>Or \(\frac{E}{c^2}=\rho\), donc \(\mathcal E_p=\frac12\rho A^2\omega^2\sin^2\!\big(\omega(t-\frac xc)\big)=\mathcal E_c\) : <b>les deux densités sont égales en chaque point et à chaque instant</b>. C'est propre à l'onde progressive.</p>`,
      { hint: T`Cinétique : \(\frac12\rho v^2\). Élastique : l'énergie d'un ressort \(\frac12k\delta^2\), avec \(k=ES/dx\) et \(\delta=\varepsilon\,dx\). Puis utilise \(E=\rho c^2\).`,
        err: T`L'énoncé demande ces densités « en fonction de \(A\), \(\omega\), \(c\), \(t\) » : il faut aussi \(\rho\) (ou \(E\)) et \(x\).` }),
    Q(T`c) Calculer les moyennes temporelles \(\langle\mathcal E_c\rangle\) et \(\langle\mathcal E_p\rangle\) sur une période. Que constate-t-on ?`, 1,
      T`<p>\(\sin^2\theta=\frac{1-\cos 2\theta}{2}\), et la moyenne de \(\cos2\theta\) sur une période est nulle, donc \(\langle\sin^2\rangle=\frac12\) :</p>
      <div class="math">\[\langle\mathcal E_c\rangle=\langle\mathcal E_p\rangle=\frac14\rho A^2\omega^2\]</div>
      <p>On constate l'<b>équipartition</b> : l'énergie se répartit à parts égales entre forme cinétique et forme élastique.</p>`),
    Q(T`d) Densité d'énergie totale moyenne \(\langle\mathcal E\rangle=\langle\mathcal E_c\rangle+\langle\mathcal E_p\rangle\).`, 1,
      T`<div class="math">\[\langle\mathcal E\rangle=\frac12\rho A^2\omega^2\]</div><p>Unité : kg·m⁻³ · m² · s⁻² = J·m⁻³. ✓</p>`),
    Q(T`<b>Flux d'énergie.</b> Déterminer l'intensité \(I\) (puissance par unité de section) telle que \(I=\langle\mathcal E\rangle c\), et vérifier la cohérence dimensionnelle.`, 2,
      T`<div class="math">\[I=\langle\mathcal E\rangle\,c=\frac12\rho\,c\,A^2\omega^2\]</div>
      <p><b>Pourquoi \(I=\langle\mathcal E\rangle c\) :</b> pendant \(dt\), toute l'énergie contenue dans un cylindre de section \(S\) et de longueur \(c\,dt\) traverse la section. \(dW=\langle\mathcal E\rangle\,S\,c\,dt\), donc \(I=\frac{dW}{S\,dt}=\langle\mathcal E\rangle c\).</p>
      <p><b>Vérification (pour aller plus loin) :</b> la partie gauche exerce sur la partie droite la force \(-S\sigma\), de puissance \(\mathcal P=-S\sigma\,\pd ut=-SE\,\pd ux\,\pd ut\). Avec \(\pd ux=-\frac1c\pd ut\) : \(\mathcal P=S\rho c\left(\pd ut\right)^2\), dont la moyenne vaut \(S\cdot\frac12\rho cA^2\omega^2\). Même résultat.</p>
      <p><b>Dimensions :</b> \([\rho][c][A^2][\omega^2]=\) kg·m⁻³ · m·s⁻¹ · m² · s⁻² \(=\) kg·s⁻³. Et W·m⁻² \(=\) (kg·m²·s⁻³)·m⁻² \(=\) kg·s⁻³. ✓</p>`),
    Q(T`<b>Modes propres.</b> Barreau encastré aux deux bouts, \(u(0,t)=u(L,t)=0\), modes \(u_n=a_n\sin\left(\frac{n\pi x}{L}\right)\cos(\omega_nt)\). a) Pulsations et fréquences propres \(\omega_n\), \(f_n\).`, 1,
      T`<p>Les conditions aux limites sont vérifiées : \(\sin0=0\) et \(\sin(n\pi)=0\). On injecte dans l'équation d'onde :</p>
      <div class="math">\[\pdd{u_n}{t}=-\omega_n^2\,u_n\qquad \pdd{u_n}{x}=-\frac{n^2\pi^2}{L^2}\,u_n\qquad\Longrightarrow\qquad \omega_n^2=c^2\frac{n^2\pi^2}{L^2}\]</div>
      <div class="math">\[\omega_n=\frac{n\pi c}{L},\qquad f_n=\frac{\omega_n}{2\pi}=\frac{nc}{2L}=\frac{n}{2L}\sqrt{\frac E\rho}\]</div>`),
    Q(T`b) Pour le mode \(n\), calculer \(E_c(t)\) et \(E_p(t)\) (intégrer les densités sur le volume \(S\,dx\)). Montrer que \(\langle E_c\rangle=\langle E_p\rangle\).`, 3,
      T`<p><b>Dérivées :</b></p>
      <div class="math">\[\pd{u_n}{t}=-a_n\omega_n\sin\Big(\frac{n\pi x}{L}\Big)\sin(\omega_nt)\qquad \pd{u_n}{x}=a_n\frac{n\pi}{L}\cos\Big(\frac{n\pi x}{L}\Big)\cos(\omega_nt)\]</div>
      <p><b>Intégrales utiles :</b> \(\int_0^L\sin^2\big(\frac{n\pi x}{L}\big)dx=\int_0^L\cos^2\big(\frac{n\pi x}{L}\big)dx=\frac L2\) (on écrit \(\sin^2=\frac{1-\cos}{2}\) ; le cosinus s'intègre à 0 sur \(n\) périodes entières).</p>
      <p><b>Énergie cinétique :</b></p>
      <div class="math">\[E_c(t)=\int_0^L\frac12\rho\Big(\pd{u_n}{t}\Big)^2S\,dx=\frac12\rho S\,a_n^2\omega_n^2\sin^2(\omega_nt)\cdot\frac L2=\frac14\rho SL\,a_n^2\omega_n^2\sin^2(\omega_nt)\]</div>
      <p><b>Énergie élastique :</b></p>
      <div class="math">\[E_p(t)=\int_0^L\frac12E\Big(\pd{u_n}{x}\Big)^2S\,dx=\frac12ES\,a_n^2\frac{n^2\pi^2}{L^2}\cos^2(\omega_nt)\cdot\frac L2\]</div>
      <p>Or \(E\frac{n^2\pi^2}{L^2}=E\frac{\omega_n^2}{c^2}=\rho\,\omega_n^2\), donc \(E_p(t)=\frac14\rho SL\,a_n^2\omega_n^2\cos^2(\omega_nt)\).</p>
      <p><b>Moyennes :</b> \(\langle\sin^2\rangle=\langle\cos^2\rangle=\frac12\), donc</p>
      <div class="math">\[\langle E_c\rangle=\langle E_p\rangle=\frac18\rho SL\,a_n^2\omega_n^2\]</div>
      <p><b>À remarquer :</b> contrairement à l'onde progressive, \(E_c\) et \(E_p\) ne sont <b>pas</b> égales à chaque instant. Elles s'échangent, comme pour un oscillateur harmonique : \(E_c\) est maximale quand le barreau passe par sa position de repos, \(E_p\) aux élongations maximales. Leur somme reste constante (pas de dissipation).</p>`,
      { hint: T`Intègre sur toute la longueur : \(\int_0^L\sin^2\) et \(\int_0^L\cos^2\) valent \(L/2\). Utilise \(E=\rho c^2\) pour faire apparaître \(\omega_n\) dans \(E_p\).` }),
    Q(T`c) En déduire l'énergie totale moyenne \(\langle E\rangle\) du mode \(n\) en fonction de \(a_n\), \(\rho\), \(L\), \(\omega_n\), \(S\).`, 1,
      T`<div class="math">\[\langle E\rangle=\langle E_c\rangle+\langle E_p\rangle=\frac14\rho SL\,a_n^2\omega_n^2\]</div>
      <p>C'est aussi la valeur de \(E_c(t)+E_p(t)\) à chaque instant, car \(\sin^2+\cos^2=1\).</p>`),
    Q(T`<b>Exemple numérique</b> (aluminium) : \(\rho=2700\) kg·m⁻³, \(E=7{,}0\times10^{10}\) Pa, \(S=1{,}2\times10^{-4}\) m², \(L=0{,}50\) m, mode \(n=1\), \(a_1=1{,}0\times10^{-4}\) m. a) Calculer \(c\) et \(f_1\).`, 1,
      T`<div class="math">\[c=\sqrt{\frac{7{,}0\times10^{10}}{2700}}=\sqrt{2{,}59\times10^{7}}\approx5{,}1\times10^{3}\ \text{m/s}\]</div>
      <div class="math">\[f_1=\frac{c}{2L}=\frac{5{,}09\times10^3}{1{,}0}\approx5{,}1\times10^{3}\ \text{Hz}\]</div>
      <p>Le son va environ 15 fois plus vite dans l'aluminium que dans l'air. \(f_1\approx5{,}1\) kHz est un son aigu, audible.</p>`),
    Q("b) Calculer l'énergie totale moyenne ⟨E⟩ du mode fondamental.", 1,
      T`<p>\(\omega_1=2\pi f_1=\frac{\pi c}{L}\approx3{,}20\times10^4\) rad/s. On calcule par morceaux :</p>
      <ul><li>masse du barreau : \(\rho SL=2700\times1{,}2\times10^{-4}\times0{,}50=0{,}162\) kg ;</li>
      <li>vitesse maximale : \(a_1\omega_1=1{,}0\times10^{-4}\times3{,}20\times10^4=3{,}20\) m/s, donc \(a_1^2\omega_1^2\approx10{,}2\) m²·s⁻².</li></ul>
      <div class="math">\[\langle E\rangle=\frac14\times0{,}162\times10{,}2\approx0{,}41\ \text{J}\]</div>
      <p>Variante sans \(\rho\) : \(\omega_1^2=\frac{\pi^2E}{\rho L^2}\) donne \(\langle E\rangle=\frac{\pi^2ESa_1^2}{4L}\approx0{,}41\) J.</p>`),
    Q(T`c) Puissance \(P=IS\) transportée par une onde progressive de même amplitude \(A=a_1\) et même pulsation \(\omega_1\).`, 1,
      T`<div class="math">\[I=\frac12\rho cA^2\omega_1^2=\frac12\times2700\times5{,}09\times10^3\times10{,}2\approx7{,}0\times10^{7}\ \text{W/m}^2\]</div>
      <div class="math">\[P=IS\approx7{,}0\times10^7\times1{,}2\times10^{-4}\approx8{,}4\times10^{3}\ \text{W}\]</div>
      <p>Environ 8,4 kW : c'est énorme, parce qu'une amplitude de 0,1 mm à 5 kHz est très grande pour un solide (vitesse maximale de 3,2 m/s).</p>
      <p><b>Contrôle de cohérence :</b> le mode stationnaire d'amplitude \(a_1\) est la somme de deux ondes progressives d'amplitude \(\frac{a_1}{2}\), allant en sens opposés. Leur énergie totale vaut \(2\times\frac12\rho\big(\frac{a_1}{2}\big)^2\omega_1^2\times SL=\frac14\rho SLa_1^2\omega_1^2\) : on retrouve bien \(\langle E\rangle\) de la question 4c.</p>`)
  ] });
dsEx({ id: "a25-2", ann: "ds2025", title: "Analyse spectrale du son d'une corde vibrante", th: "four", cm: ["cm3"], dur: 35,
  intro: T`Corde de guitare de longueur \(L=0{,}65\) m, idéale, fixée à ses deux extrémités. Elle vibre selon \(y(x,t)=\sum_{n=1}^{\infty}A_n\sin\left(\frac{n\pi x}{L}\right)\cos(\omega_nt)\), avec \(\omega_n=n\frac{\pi c}{L}\) et \(c=\sqrt{T_0/\mu}\). Le signal acoustique détecté est proportionnel à la vitesse au point \(x_0\) : \(s(t)=K\pd{y}{t}(x_0,t)\).`,
  q: [
    Q(T`<b>Signal temporel.</b> a) Montrer que \(s(t)=\sum B_n\sin(\omega_nt)\), avec \(B_n=-KA_n\omega_n\sin\left(\frac{n\pi x_0}{L}\right)\).`, 1,
      T`<p>On dérive la série terme à terme par rapport à \(t\) (\(x\) fixé) :</p>
      <div class="math">\[\pd{y}{t}(x,t)=\sum_{n=1}^{\infty}-A_n\omega_n\sin\Big(\frac{n\pi x}{L}\Big)\sin(\omega_nt)\]</div>
      <p>En \(x=x_0\), multiplié par \(K\) :</p>
      <div class="math">\[s(t)=\sum_{n=1}^{\infty}B_n\sin(\omega_nt),\qquad B_n=-KA_n\omega_n\sin\Big(\frac{n\pi x_0}{L}\Big)\]</div>
      <p>Comme \(\omega_n=n\omega_1\), toutes les composantes ont une période qui divise \(T_1=\frac{2\pi}{\omega_1}=\frac{2L}{c}\) : <b>\(s\) est périodique de période \(T_1\)</b>.</p>`,
      { err: T`L'énoncé parle de « vitesse moyenne au point \(x_0\) » : c'est la vitesse transverse <b>locale</b> \(\pd yt(x_0,t)\), pas une moyenne.` }),
    Q(T`b) Avec \(A_1=1\), \(A_2=0{,}6\), \(A_3=0{,}3\), représenter qualitativement \(s(t)\) sur une période.`, 2,
      T`<p>Ce qu'il faut faire apparaître sur le dessin :</p>
      <ul><li>une courbe de période \(T_1=\frac{2L}{c}\) (celle du fondamental) ;</li>
      <li>\(s(0)=s\big(\frac{T_1}{2}\big)=s(T_1)=0\) : chaque \(\sin(n\omega_1t)\) s'annule en ces instants ;</li>
      <li>une forme <b>non sinusoïdale</b> : le fondamental est déformé par les harmoniques 2 et 3.</li></ul>
